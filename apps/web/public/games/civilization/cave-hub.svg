<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Пещера — стартовый лагерь</title>
<desc id="desc">Тёплая детализированная первобытная пещера с костром, верстаком, тайником и выходом к дикой долине.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#090706"/><stop offset=".28" stop-color="#24130c"/><stop offset=".62" stop-color="#3d2417"/><stop offset="1" stop-color="#061117"/>
  </linearGradient>
  <radialGradient id="fireAura" cx=".31" cy=".63" r=".42">
    <stop stop-color="#ffd76b" stop-opacity=".94"/><stop offset=".18" stop-color="#ff8a24" stop-opacity=".88"/>
    <stop offset=".45" stop-color="#8f2d12" stop-opacity=".42"/><stop offset="1" stop-color="#090807" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="torchAura" cx=".5" cy=".5" r=".5"><stop stop-color="#ffbe57" stop-opacity=".6"/><stop offset="1" stop-color="#ff7b1e" stop-opacity="0"/></radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8e9ef"/><stop offset=".45" stop-color="#89b7c3"/><stop offset="1" stop-color="#315a67"/></linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#21130d"/><stop offset=".45" stop-color="#5c3320"/><stop offset=".72" stop-color="#2b1a12"/><stop offset="1" stop-color="#120d0a"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2c1b12"/><stop offset=".45" stop-color="#84522d"/><stop offset=".75" stop-color="#4b2f1d"/><stop offset="1" stop-color="#1d140f"/></linearGradient>
  <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9d6136"/><stop offset=".5" stop-color="#5a3826"/><stop offset="1" stop-color="#251914"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f1f6"/><stop offset=".42" stop-color="#76b5c5"/><stop offset="1" stop-color="#2f6475"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".5"/></filter>
  <pattern id="grain" width="74" height="74" patternUnits="userSpaceOnUse">
    <circle cx="9" cy="13" r="1.8" fill="#fff" opacity=".028"/><circle cx="55" cy="11" r="1.3" fill="#fff" opacity=".022"/>
    <circle cx="33" cy="57" r="2.2" fill="#000" opacity=".12"/><path d="M8 47l20-8m17 21l19-7" stroke="#fff" stroke-width="1" opacity=".016"/>
  </pattern>
  <pattern id="rockLines" width="130" height="95" patternUnits="userSpaceOnUse">
    <path d="M4 72C28 44 50 60 69 40s35-22 57-7M17 18c19 10 33 7 51-7" fill="none" stroke="#d28a4c" stroke-width="2" opacity=".05"/>
  </pattern>
</defs>

