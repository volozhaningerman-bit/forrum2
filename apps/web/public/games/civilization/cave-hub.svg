<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Пещера — стартовый лагерь</title>
<desc id="desc">Тёплая первобытная пещера с костром, верстаком, тайником и выходом к долине.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120d0a"/><stop offset=".48" stop-color="#382117"/><stop offset="1" stop-color="#07131a"/></linearGradient>
  <radialGradient id="fire" cx=".34" cy=".56" r=".48"><stop stop-color="#ffcf68"/><stop offset=".22" stop-color="#ff7a22"/><stop offset=".55" stop-color="#7d2411" stop-opacity=".75"/><stop offset="1" stop-color="#090807" stop-opacity="0"/></radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6def1"/><stop offset=".58" stop-color="#6ea2b4"/><stop offset="1" stop-color="#1c4654"/></linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#2d1b13"/><stop offset=".48" stop-color="#5a3320"/><stop offset="1" stop-color="#1a1310"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="14" cy="21" r="2" fill="#fff" opacity=".03"/><circle cx="61" cy="12" r="1.5" fill="#fff" opacity=".025"/><circle cx="35" cy="65" r="2.2" fill="#000" opacity=".08"/></pattern>
</defs>
