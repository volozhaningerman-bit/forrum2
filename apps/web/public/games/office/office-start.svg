    <text x="82" y="143" fill="#2e251f" font-size="18" font-family="Arial" font-weight="700">АРХИВ</text>
    <text x="82" y="158" fill="#2e251f" font-size="11" font-family="Arial">(когда-нибудь)</text>
  </g>

