name: Legacy FirstVDS credential presence

on:
  push:
    branches:
      - diag/railway-production-v53

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report legacy deployment secret presence
        env:
          HAS_FORRUM_HOST: ${{ secrets.FORRUM_HOST != '' }}
          HAS_FORRUM_USER: ${{ secrets.FORRUM_USER != '' }}
          HAS_FORRUM_SSH_KEY: ${{ secrets.FORRUM_SSH_KEY != '' }}
          HAS_FORRUM_API_SSH_KEY_B64: ${{ secrets.FORRUM_API_SSH_KEY_B64 != '' }}
          HAS_FORRUM_API_SSH_KEY: ${{ secrets.FORRUM_API_SSH_KEY != '' }}
        run: env | grep '^HAS_' | sort
