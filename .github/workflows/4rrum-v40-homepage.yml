          entries = json.loads(gzip.decompress(payload))
          root = pathlib.Path.cwd().resolve()
          conflicts = []
          for item in entries:
              path = root / item['path']
              assert path.resolve().is_relative_to(root)
              existing = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if existing not in (item['before'], item['after']):
                  conflicts.append(item['path'])
              assert hashlib.sha256(base64.b64decode(item['content'])).hexdigest() == item['after']
          if conflicts:
              raise SystemExit('Исходники изменились после V39. Ничего не перезаписано: ' + ', '.join(conflicts))
          for item in entries:
              path = root / item['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(item['content']))
          pathlib.Path('/tmp/4rrum-v40-paths').write_text('\n'.join(item['path'] for item in entries)+'\n')
          print('Применено файлов:', len(entries))
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:home
      - name: Создать проверенную ветку
        shell: bash
        run: |
          branch="patch/home-v40-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/4rrum-v40-paths
          if git diff --cached --quiet; then
            echo 'V40 уже применён — новых изменений нет.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat: compact 4rrum homepage, topic actions and community panels (V40)'
          git push origin "HEAD:refs/heads/$branch"
          echo "Готово: [создать Pull Request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Изменения сайта появятся после Merge и развёртывания Railway.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4rrum-v40-browser
          path: test-results/home-reference
          retention-days: 7
