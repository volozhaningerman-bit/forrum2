name: FORRUM Home Paper Graphite V16 FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-paper-graphite-v16-fixed
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  homepage-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/page.tsx
          test -f apps/web/app/globals.css
          test -f apps/web/components/community-mark.tsx
          test -f apps/web/lib/types.ts

      - name: Apply canonical homepage
        shell: bash
        env:
          HOME_B64: 
          PAGE_B64: 
          CSS_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$HOME_B64" | base64 -d             > apps/web/components/home-dashboard.tsx

          printf '%s' "$PAGE_B64" | base64 -d             > apps/web/app/page.tsx

          printf '%s' "$CHECK_B64" | base64 -d             > scripts/home-paper-graphite-v16-check.mjs

          printf '%s' "$CSS_B64" | base64 -d             > /tmp/forrum-home-v16.css

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/app/globals.css')
          source = path.read_text(encoding='utf-8')
          fresh = Path('/tmp/forrum-home-v16.css').read_text(
              encoding='utf-8'
          ).strip()

          pattern = re.compile(
              r'/\* FORRUM_HOME_PAPER_GRAPHITE_V16_START'
              r'[\s\S]*?'
              r'/\* FORRUM_HOME_PAPER_GRAPHITE_V16_END \*/\s*'
          )

          source = pattern.sub('', source).rstrip()
          path.write_text(
              source + '\n\n' + fresh + '\n',
              encoding='utf-8',
          )
          PY

          git diff --check
          node scripts/home-paper-graphite-v16-check.mjs

      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail

          expected="$(printf '%s\n'             'apps/web/app/globals.css'             'apps/web/app/page.tsx'             'apps/web/components/home-dashboard.tsx'             'scripts/home-paper-graphite-v16-check.mjs' | sort)"

          actual="$(git status --porcelain             | sed 's/^...//'             | sort)"

          test "$actual" = "$expected"

          git diff --exit-code --             apps/api             apps/web/components/site-header.tsx             apps/web/components/main-nav.tsx             apps/web/components/site-footer.tsx             apps/web/app/communities             apps/web/app/p             apps/web/app/create

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Run homepage and static checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          git diff --check

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Remove build-only workspace changes
        shell: bash
        run: |
          set -euo pipefail

          # Build/typecheck may touch generated tracked files.
          # This workflow may publish ONLY these four homepage files.
          allowed_file() {
            case "$1" in
              apps/web/app/globals.css|\
              apps/web/app/page.tsx|\
              apps/web/components/home-dashboard.tsx|\
              scripts/home-paper-graphite-v16-check.mjs)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t dirty_paths < <(
            git status --porcelain=v1 -uall | sed 's/^...//'
          )

          for path in "${dirty_paths[@]}"; do
            if allowed_file "$path"; then
              continue
            fi

            echo "Cleaning build-only change: $path"

            if git ls-files --error-unmatch -- "$path" \
              >/dev/null 2>&1; then
              git restore --staged --worktree -- "$path"
            else
              rm -rf -- "$path"
            fi
          done

      - name: Final pre-commit audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          git diff --check

          expected="$(printf '%s\n' \
            'apps/web/app/globals.css' \
            'apps/web/app/page.tsx' \
            'apps/web/components/home-dashboard.tsx' \
            'scripts/home-paper-graphite-v16-check.mjs' | sort)"

          actual="$(git status --porcelain=v1 -uall \
            | sed 's/^...//' \
            | sort)"

          if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected workspace changes remain after build."
            echo "Expected homepage changes:"
            printf '%s\n' "$expected"
            echo
            echo "Actual workspace changes:"
            printf '%s\n' "$actual"
            echo
            echo "Raw git status:"
            git status --short
            exit 1
          fi

          if grep -Fq 'Кураторы недели' \
            apps/web/components/home-dashboard.tsx; then
            echo "::error::Rejected block returned: Кураторы недели"
            exit 1
          fi

          if grep -Fq 'Развитие FORRUM' \
            apps/web/components/home-dashboard.tsx; then
            echo "::error::Rejected block returned: Развитие FORRUM"
            exit 1
          fi

          if grep -Fq 'Поддержать проект' \
            apps/web/components/home-dashboard.tsx; then
            echo "::error::Rejected block returned: Поддержать проект"
            exit 1
          fi

          if grep -Fq 'Ближайшие события' \
            apps/web/components/home-dashboard.tsx; then
            echo "::error::Rejected block returned: Ближайшие события"
            exit 1
          fi

          echo "Final audit passed."
          git status --short

      - name: Commit verified homepage
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet             && git diff --cached --quiet             && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "V16 is already applied."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add             apps/web/app/globals.css             apps/web/app/page.tsx             apps/web/components/home-dashboard.tsx             scripts/home-paper-graphite-v16-check.mjs

          git diff --cached --check
          git commit -m "Build canonical Paper Graphite homepage V16"

          test -z "$(git status --porcelain)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push verified homepage
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$local_sha" = "$remote_sha"
          echo "Published verified homepage: $remote_sha"
