name: FORRUM Inventory V10.1
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-inventory-v10-1
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  inventory-v10-1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean inventory baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/api/prisma/schema.prisma
          test -f apps/api/prisma/seed.ts
          test -f apps/api/src/app.module.ts
          test -f 'apps/web/app/u/[username]/page.tsx'
          test -f apps/web/app/globals.css
          test -f apps/web/lib/api.ts
          test -f apps/web/lib/server-api.ts
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Repository is not clean before applying Inventory V10."
            git status --short
            exit 1
          fi

      - name: Apply public inventory and corrected auth imports
        shell: bash
        env:
          APPLY_B64: 
          SCHEMA_B64: 
          SEED_HELPER_B64: 
          SERVICE_B64: 
          MODULE_B64: 
          DTO_B64: aW1wb3J0IHsgSXNTdHJpbmcsIExlbmd0aCwgTWF0Y2hlcyB9IGZyb20gJ2NsYXNzLXZhbGlkYXRvcic7CgpleHBvcnQgY2xhc3MgVHJhbnNmZXJJbnZlbnRvcnlJdGVtRHRvIHsKICBASXNTdHJpbmcoKQogIEBMZW5ndGgoMiwgMzIpCiAgQE1hdGNoZXMoL15bYS16QS1aMC05Xy4tXSskLykKICB1c2VybmFtZSE6IHN0cmluZzsKfQo=
          CONTROLLER_TEMPLATE_B64: 
          PROFILE_PAGE_B64: 
          PANEL_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$APPLY_B64" | base64 --decode > /tmp/apply-inventory-v10.py
          python3 /tmp/apply-inventory-v10.py

      - name: Verify Inventory V10 contract and patch scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/inventory-v10-check.mjs
          python3 <<'PYCODE'
          from pathlib import Path
          import re

          controller = Path('apps/api/src/inventory/inventory.controller.ts')
          source = controller.read_text(encoding='utf-8')
          for specifier in re.findall(r"from\s+['\"]([^'\"]+)['\"]", source):
              if not specifier.startswith('.'):
                  continue
              target = controller.parent / specifier
              candidates = [target]
              if target.suffix in {'.js', '.mjs', '.cjs'}:
                  candidates.extend([target.with_suffix('.ts'), target.with_suffix('.tsx')])
              else:
                  candidates.extend([
                      target.with_suffix('.ts'),
                      target.with_suffix('.tsx'),
                      target / 'index.ts',
                      target / 'index.tsx',
                  ])
              if not any(candidate.is_file() for candidate in candidates):
                  raise SystemExit(f'Broken inventory controller import: {specifier}')
          print('Inventory controller local imports resolve correctly.')
          PYCODE
          git diff --check

          allowed='^(apps/api/prisma/schema\.prisma|apps/api/prisma/seed\.ts|apps/api/src/app\.module\.ts|apps/api/src/inventory/.*|apps/web/app/globals\.css|apps/web/app/u/\[username\]/page\.tsx|apps/web/app/u/\[username\]/inventory-panel\.tsx|scripts/inventory-v10-check\.mjs|docs/FORRUM_INVENTORY_V10\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          grep -q 'InventoryModule' apps/api/src/app.module.ts
          grep -q 'FORRUM_INVENTORY_V10' apps/api/prisma/schema.prisma
          grep -q 'seedInventoryV10' apps/api/prisma/seed.ts
          grep -q "@Post('items/:id/transfer')" apps/api/src/inventory/inventory.controller.ts
          grep -q "selected.equipped ? 'Снять' : 'Надеть'" 'apps/web/app/u/[username]/inventory-panel.tsx'

      - name: Create isolated local Inventory V10.1 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            apps/api/prisma/schema.prisma \
            apps/api/prisma/seed.ts \
            apps/api/src/app.module.ts \
            apps/api/src/inventory \
            apps/web/app/globals.css \
            'apps/web/app/u/[username]/page.tsx' \
            'apps/web/app/u/[username]/inventory-panel.tsx' \
            scripts/inventory-v10-check.mjs \
            docs/FORRUM_INVENTORY_V10.md

          allowed='^(M |A |D |R |C |\?\?) (apps/api/prisma/schema\.prisma|apps/api/prisma/seed\.ts|apps/api/src/app\.module\.ts|apps/api/src/inventory/.*|apps/web/app/globals\.css|apps/web/app/u/\[username\]/page\.tsx|apps/web/app/u/\[username\]/inventory-panel\.tsx|scripts/inventory-v10-check\.mjs|docs/FORRUM_INVENTORY_V10\.md)$'
          unexpected="$(git status --porcelain | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes exist before the local commit:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "FORRUM Inventory V10.1 is already present."
          else
            git commit -m "Add public FORRUM inventory and item action menu"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and inventory checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/inventory-v10-check.mjs
          if [ -f scripts/ui-interaction-check.mjs ]; then
            node scripts/ui-interaction-check.mjs
          fi

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Inventory V10.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
