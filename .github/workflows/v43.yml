name: "v43: Add Tyuryaga Game"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v43:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack game files
        run: |
          echo "" | base64 -d | tar -xzf -

      - name: Patch schema and module
        run: |
          python3 -c "
import os
p_path = 'apps/api/prisma/schema.prisma'
if os.path.exists(p_path):
    with open(p_path, 'r', encoding='utf-8') as f:
        c = f.read()
    if 'model TyuryagaProfile' not in c:
        if 'tyuryagaProfile' not in c and 'model User {' in c:
            c = c.replace('model User {', 'model User {\n  tyuryagaProfile TyuryagaProfile?', 1)
        schema_ext = '''

model TyuryagaProfile {
  id              String               @id @default(cuid())
  userId          String               @unique
  user            User                 @relation(fields: [userId], references: [id], onDelete: Cascade)
  
  level           Int                  @default(1)
  respect         Int                  @default(0)
  energy          Int                  @default(100)
  maxEnergy       Int                  @default(100)
  lastEnergySync  DateTime             @default(now())
  
  cigarettes      Int                  @default(150)
  sugar           Int                  @default(10)
  baseDamage      Int                  @default(15)
  wins            Int                  @default(0)

  tattoos         TyuryagaTattoo[]
  activeBoss      TyuryagaBossBattle?

  createdAt       DateTime             @default(now())
  updatedAt       DateTime             @updatedAt

  @@index([userId])
}

model TyuryagaTattoo {
  id          String          @id @default(cuid())
  profileId   String
  profile     TyuryagaProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
  tattooId    String
  acquiredAt  DateTime        @default(now())

  @@unique([profileId, tattooId])
}

model TyuryagaBossBattle {
  id               String          @id @default(cuid())
  profileId        String          @unique
  profile          TyuryagaProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
  bossId           String
  bossName         String
  currentHp        Int
  maxHp            Int
  rewardCigarettes Int
  rewardRespect    Int
  rewardSugar      Int
  isDefeated       Boolean         @default(false)
  expiresAt        DateTime
  createdAt        DateTime        @default(now())

  @@index([profileId])
}
'''
        c += schema_ext
        with open(p_path, 'w', encoding='utf-8') as f:
            f.write(c)

m_path = 'apps/api/src/app.module.ts'
if os.path.exists(m_path):
    with open(m_path, 'r', encoding='utf-8') as f:
        m = f.read()
    if 'TyuryagaModule' not in m:
        m = "import { TyuryagaModule } from './modules/tyuryaga/tyuryaga.module';\n" + m
        m = m.replace('imports: [', 'imports: [\n    TyuryagaModule,', 1)
        with open(m_path, 'w', encoding='utf-8') as f:
            f.write(m)
"

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "feat: integrate Tyuryaga game [v43]"
          git push origin main
