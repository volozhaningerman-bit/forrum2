name: FORRUM Home Hotfix V9.2.1
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-hotfix-v9-2-1
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  home-hotfix-v9-2-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/ui-interaction-check.mjs
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Repository is not clean before applying the hotfix."
            git status --short
            exit 1
          fi

      - name: Apply confirmed home hotfix changes
        shell: bash
        env:
          HOME_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode('utf-8')

          home_path = Path('apps/web/components/home-dashboard.tsx')
          css_path = Path('apps/web/app/globals.css')
          check_path = Path('scripts/home-stage1-hotfix-check.mjs')
          interaction_path = Path('scripts/ui-interaction-check.mjs')
          doc_path = Path('docs/FORRUM_HOME_HOTFIX_V9_2_1.md')

          home_path.write_text(decode('HOME_B64'), encoding='utf-8')

          stage_css = decode('CSS_B64').strip() + '\n'
          existing_css = css_path.read_text(encoding='utf-8')
          start = '/* FORRUM_HOME_STAGE_1_HOTFIX_V9_2'
          end = '/* /FORRUM_HOME_STAGE_1_HOTFIX_V9_2 */'

          if start in existing_css:
              prefix, remainder = existing_css.split(start, 1)
              if end not in remainder:
                  raise RuntimeError('Existing V9.2 hotfix CSS marker has no closing marker')
              _, suffix = remainder.split(end, 1)
              merged_css = prefix.rstrip() + '\n\n' + stage_css + suffix.lstrip('\n')
          else:
              merged_css = existing_css.rstrip() + '\n\n' + stage_css

          css_path.write_text(merged_css, encoding='utf-8')

          interaction_source = interaction_path.read_text(encoding='utf-8')
          old_contract = (
              "forbidMarker(home, \"'unanswered'\", 'home feed');\n"
              "forbidMarker(home, 'Без ответа', 'home feed');\n"
              "forbidMarker(home, 'Все категории', 'home tree');"
          )
          new_contract = (
              "// FORRUM_HOME_STAGE_1_V9_INTERACTION_CONTRACT\n"
              "requireMarker(home, \"'unanswered'\", 'home feed');\n"
              "requireMarker(home, 'Без ответа', 'home feed');\n"
              "requireMarker(home, 'home-feed-toolbar', 'home feed');\n"
              "requireMarker(home, 'Все категории', 'home tree');\n"
              "requireMarker(home, 'home-tree-all-link', 'home tree');"
          )

          if old_contract in interaction_source:
              interaction_source = interaction_source.replace(old_contract, new_contract, 1)
          elif 'FORRUM_HOME_STAGE_1_V9_INTERACTION_CONTRACT' not in interaction_source:
              raise RuntimeError('The interaction contract no longer matches the expected baseline')

          interaction_path.write_text(interaction_source, encoding='utf-8')
          check_path.parent.mkdir(parents=True, exist_ok=True)
          check_path.write_text(decode('CHECK_B64'), encoding='utf-8')
          doc_path.parent.mkdir(parents=True, exist_ok=True)
          doc_path.write_text(decode('DOC_B64'), encoding='utf-8')
          print('FORRUM Home Hotfix V9.2.1 applied.')
          PYCODE

      - name: Verify patch scope and home hotfix contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-stage1-hotfix-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check
          allowed='^(apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-stage1-hotfix-check\.mjs|scripts/ui-interaction-check\.mjs|docs/FORRUM_HOME_HOTFIX_V9_2_1\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create isolated local hotfix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-stage1-hotfix-check.mjs \
            scripts/ui-interaction-check.mjs \
            docs/FORRUM_HOME_HOTFIX_V9_2_1.md

          unexpected="$(git status --porcelain | grep -Ev '^(M |A |D |R |C |\?\?) (apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-stage1-hotfix-check\.mjs|scripts/ui-interaction-check\.mjs|docs/FORRUM_HOME_HOTFIX_V9_2_1\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes exist before the local hotfix commit:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "FORRUM Home Hotfix V9.2.1 is already present in main."
          else
            git commit -m "Fix FORRUM tree, topic header and editor after Stage 1 review"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-stage1-hotfix-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Clean generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Commit and push verified hotfix V9.2.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
