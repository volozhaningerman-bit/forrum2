name: Fix FORRUM web API connection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Add same-origin API proxy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          api_client = Path("apps/web/lib/api.ts")
          api_client.write_text(
              """export const API_URL = '/api';

          export async function api<T>(path: string, init: RequestInit = {}): Promise<T> {
            const headers = new Headers(init.headers);
            if (init.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');

            const response = await fetch(`${API_URL}${path}`, {
              ...init,
              credentials: 'include',
              headers,
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              const message = Array.isArray(data.message) ? data.message.join('. ') : data.message;
              throw new Error(message ?? 'Ошибка запроса');
            }

            return data as T;
          }
          """,
              encoding="utf-8",
          )

          route = Path("apps/web/app/api/[...path]/route.ts")
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text(
              """import { NextRequest, NextResponse } from 'next/server';

          export const dynamic = 'force-dynamic';
          export const runtime = 'nodejs';

          const DEFAULT_UPSTREAM = 'https://api-production-37ce.up.railway.app/v1';

          function upstreamBase() {
            return (process.env.API_INTERNAL_URL || DEFAULT_UPSTREAM).replace(/\\/$/, '');
          }

          async function proxy(
            request: NextRequest,
            context: { params: Promise<{ path: string[] }> },
          ) {
            try {
              const { path } = await context.params;
              const encodedPath = path.map((part) => encodeURIComponent(part)).join('/');
              const target = new URL(`${upstreamBase()}/${encodedPath}`);
              target.search = request.nextUrl.search;

              const headers = new Headers(request.headers);
              headers.delete('host');
              headers.delete('connection');
              headers.delete('content-length');
              headers.delete('accept-encoding');
              headers.delete('origin');
              headers.delete('referer');

              const hasBody = request.method !== 'GET' && request.method !== 'HEAD';
              const body = hasBody ? await request.arrayBuffer() : undefined;

              const upstream = await fetch(target, {
                method: request.method,
                headers,
                body,
                redirect: 'manual',
                cache: 'no-store',
              });

              const responseHeaders = new Headers(upstream.headers);
              responseHeaders.delete('content-encoding');
              responseHeaders.delete('content-length');
              responseHeaders.delete('transfer-encoding');

              return new NextResponse(upstream.body, {
                status: upstream.status,
                statusText: upstream.statusText,
                headers: responseHeaders,
              });
            } catch (error) {
              console.error('FORRUM API proxy error', error);
              return NextResponse.json(
                { message: 'API FORRUM временно недоступен. Повторите попытку.' },
                { status: 502 },
              );
            }
          }

          export const GET = proxy;
          export const HEAD = proxy;
          export const POST = proxy;
          export const PUT = proxy;
          export const PATCH = proxy;
          export const DELETE = proxy;
          export const OPTIONS = proxy;
          """,
              encoding="utf-8",
          )

          print("Same-origin API proxy created")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build web
        run: npm run build -w @forrum/web

      - name: Commit verified fix
        shell: bash
        run: |
          git diff --check
          git config user.name "FORRUM build fixer"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/lib/api.ts 'apps/web/app/api/[...path]/route.ts'

          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Route browser API calls through web origin"
            git push
          fi
