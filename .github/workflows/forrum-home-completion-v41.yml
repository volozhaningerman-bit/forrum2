name: FORRUM Home Completion V41

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-completion-v41
  cancel-in-progress: false

jobs:
  homepage-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Inventory deployed V40 baseline
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          for path in \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/globals.css \
            apps/web/components/main-nav.tsx \
            apps/web/components/theme-toggle.tsx \
            apps/web/app/page.tsx \
            apps/api/src/home/home.service.ts \
            apps/api/prisma/schema.prisma \
            scripts/home-paper-graphite-v16-check.mjs \
            scripts/home-reference-check.mjs \
            scripts/home-scale-polish-check.mjs \
            scripts/home-visual-theme-check.mjs
          do
            test -f "$path"
          done

          grep -Fq \
            'data-home-polish="v40"' \
            apps/web/components/home-dashboard.tsx

          grep -Fq \
            '// FORRUM_HOME_COMPOSITION_V40_DATA' \
            apps/api/src/home/home.service.ts

          # Approved tree interaction is frozen.
          grep -Fq \
            'event.target !== event.currentTarget' \
            apps/web/components/home-dashboard.tsx
          grep -Fq \
            'data-expandable={hasChildren ? '"'"'true'"'"' : undefined}' \
            apps/web/components/home-dashboard.tsx

          count="$(
            grep -F \
              'href={`/communities/${node.slug}`}' \
              apps/web/components/home-dashboard.tsx |
            wc -l |
            tr -d ' '
          )"
          test "$count" = "1"

          # Product navigation remains the real FORRUM navigation.
          grep -Fq "['/services', 'Услуги']" apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" apps/web/components/main-nav.tsx

          # V41 consumes only existing canonical data.
          grep -Fq 'model CommunityPoll {' apps/api/prisma/schema.prisma
          grep -Fq 'model PollOption {' apps/api/prisma/schema.prisma
          grep -Fq 'model PollVote {' apps/api/prisma/schema.prisma
          grep -Fq 'enum VoteClass {' apps/api/prisma/schema.prisma
          grep -Fq 'lastSeenAt' apps/api/prisma/schema.prisma
          grep -Fq 'enum ReactionType {' apps/api/prisma/schema.prisma

          {
            echo "## FORRUM Home Completion V41"
            echo
            echo "Narrow pass over deployed V40. No homepage rebuild."
            echo
            echo "| Priority | V40 | V41 |"
            echo "|---|---|---|"
            echo "| Active polls | renderer/API can still produce a blank block | complete real poll display contract: option counts, binding/advisory result, %, totals, closesAt |"
            echo "| Weekly members | likes/activity can both disappear when nobody posts | activity also uses real lastSeenAt presence; likes remain actual LIKE reactions only |"
            echo "| Topic/Actual imagery | generic community avatar may hide thematic FORRUM asset | known categories prefer existing thematic pixel assets |"
            echo "| Desktop container | V40 is too wide | centered 1580px max; 24px/16px responsive gutters |"
            echo "| Typography | still too bold | lower existing selector weights |"
            echo "| Graphite | still too close to black | lift existing Graphite page/panel levels and soften text |"
            echo "| Paper | surfaces too similar | separate existing warm Paper levels |"
            echo
            echo "Truthfulness:"
            echo "- No fake polls, users, topics or reactions."
            echo "- Zero OPEN future polls means the Active polls block honestly remains empty."
            echo "- Zero LIKE reactions in 7 days means the likes tab honestly remains empty."
            echo "- Activity ranking uses real lastSeenAt plus real topic/comment activity."
            echo "- No route, schema field or new product entity is introduced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write V41 completion patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/forrum-home-completion-v41.py <<'PY'
          from pathlib import Path

          HOME = Path('apps/web/components/home-dashboard.tsx')
          CSS = Path('apps/web/app/globals.css')
          SERVICE = Path('apps/api/src/home/home.service.ts')
          CHECK_HOME = Path('scripts/home-paper-graphite-v16-check.mjs')
          CHECK_REFERENCE = Path('scripts/home-reference-check.mjs')
          CHECK_SCALE = Path('scripts/home-scale-polish-check.mjs')

          for path in (HOME, CSS, SERVICE, CHECK_HOME, CHECK_REFERENCE, CHECK_SCALE):
              if not path.exists():
                  raise SystemExit(f'V41 required source missing: {path}')

          home = HOME.read_text(encoding='utf-8')
          css = CSS.read_text(encoding='utf-8')
          service = SERVICE.read_text(encoding='utf-8')
          important_before = css.count('!important')

          OLD_MARKER = 'data-home-polish="v40"'
          NEW_MARKER = 'data-home-polish="v41"'
          OLD_DATA_MARKER = '// FORRUM_HOME_COMPOSITION_V40_DATA'
          NEW_DATA_MARKER = '// FORRUM_HOME_COMPLETION_V41_DATA'
          CSS_START = '/* FORRUM_HOME_REFERENCE_V36_START'
          CSS_END = '/* FORRUM_HOME_REFERENCE_V36_END */'
          THEME_START = '/* FORRUM_VISUAL_THEME_START'
          THEME_END = '/* FORRUM_VISUAL_THEME_END */'
          SHELL_START = '/* FORRUM_GLOBAL_SHELL_V16_1_START'
          SHELL_END = '/* FORRUM_GLOBAL_SHELL_V16_1_END */'


          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'V41 expected one {label}; found {count}.')
              return source.replace(old, new, 1)


          def block_bounds(source: str, start_marker: str, end_marker: str):
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'V41 block missing: {start_marker}')
              end += len(end_marker)
              return start, end, source[start:end]


          def verify_tree(source: str):
              for marker in (
                  'MouseEvent<HTMLDivElement>',
                  'event.target !== event.currentTarget',
                  "data-expandable={hasChildren ? 'true' : undefined}",
                  'aria-label={`Открыть сообщество ${node.name}`}',
              ):
                  if marker not in source:
                      raise SystemExit(f'V41 tree regression: {marker}')
              if source.count('href={`/communities/${node.slug}`}') != 1:
                  raise SystemExit('V41 tree navigation must stay only on folder + name.')


          def verify(source_home: str, source_css: str, source_service: str):
              verify_tree(source_home)

              for marker in (
                  NEW_MARKER,
                  'communityVisual(item.community.slug, item.community.avatarUrl)',
                  'communityVisual(poll.community.slug, poll.community.avatarUrl)',
                  "const initialWeeklyMode: 'likes' | 'activity' =",
                  'initialWeeklyActivity.length',
                  'totalAdvisory',
                  'outcomeTotal',
              ):
                  if marker not in source_home:
                      raise SystemExit(f'V41 homepage contract missing: {marker}')

              for marker in (
                  NEW_DATA_MARKER,
                  'weeklyActiveUsers',
                  'presenceCount',
                  'item.topicCount * 3 +',
                  'item.commentCount * 2 +',
                  'item.presenceCount,',
                  'description: poll.description',
                  'avatarUrl: true',
              ):
                  if marker not in source_service:
                      raise SystemExit(f'V41 API contract missing: {marker}')

              start, end, block = block_bounds(source_css, CSS_START, CSS_END)
              outside = source_css[:start] + source_css[end:]

              for marker in (
                  'max-width: 1580px;',
                  'width: min(calc(100vw - 32px), 1580px);',
                  'margin-left: auto;',
                  'margin-right: auto;',
                  'grid-template-columns: 300px minmax(0, 1fr) 326px;',
              ):
                  if marker not in block:
                      raise SystemExit(f'V41 centered desktop contract missing: {marker}')

              if '.forrum-home-v16' in outside:
                  raise SystemExit('V41 found competing homepage CSS outside canonical source.')

              if source_css.count('!important') > important_before:
                  raise SystemExit('V41 added !important instead of fixing source rules.')

              if OLD_MARKER in source_home or OLD_DATA_MARKER in source_service:
                  raise SystemExit('V41 old product marker remains.')


          # Idempotent path.
          if NEW_MARKER in home and NEW_DATA_MARKER in service:
              verify(home, css, service)
              print('FORRUM Home Completion V41 already applied.')
              raise SystemExit(0)

          if OLD_MARKER not in home or OLD_DATA_MARKER not in service:
              raise SystemExit('V41 requires successfully deployed V40 baseline.')

          verify_tree(home)
          home = replace_once(home, OLD_MARKER, NEW_MARKER, 'homepage polish marker')
          service = replace_once(service, OLD_DATA_MARKER, NEW_DATA_MARKER, 'home data marker')

          # ------------------------------------------------------------------
          # BACKEND: complete existing real poll + weekly contracts.
          # No new route, schema field or fake row is introduced.
          # ------------------------------------------------------------------
          service = replace_once(
              service,
              '''  commentCount: number;\n};''',
              '''  commentCount: number;\n  presenceCount: number;\n};''',
              'WeeklyUser presence signal',
          )

          service = replace_once(
              service,
              '''    commentCount: 0,\n  };''',
              '''    commentCount: 0,\n    presenceCount: 0,\n  };''',
              'WeeklyAccumulator presence initialization',
          )

          service = replace_once(
              service,
              '''      commentCount: item.commentCount,\n    }))''',
              '''      commentCount: item.commentCount,\n      presenceCount: item.presenceCount,\n    }))''',
              'topWeekly presence output',
          )

          service = replace_once(
              service,
              '''      recordSetting,\n      weeklyTopics,''',
              '''      recordSetting,\n      weeklyActiveUsers,\n      weeklyTopics,''',
              'weekly active users Promise result',
          )

          service = replace_once(
              service,
              '''      this.prisma.platformSetting.findUnique({\n        where: { key: onlineRecordKey },\n      }),\n      this.prisma.publication.findMany({''',
              '''      this.prisma.platformSetting.findUnique({\n        where: { key: onlineRecordKey },\n      }),\n      this.prisma.user.findMany({\n        where: {\n          lastSeenAt: { gte: weekAgo },\n        },\n        orderBy: { lastSeenAt: 'desc' },\n        take: 100,\n        select: {\n          id: true,\n          username: true,\n          displayName: true,\n          avatarUrl: true,\n        },\n      }),\n      this.prisma.publication.findMany({''',
              'weekly active users query',
          )

          service = replace_once(
              service,
              '''    const activity = new Map<string, WeeklyAccumulator>();\n    const likes = new Map<string, WeeklyAccumulator>();\n\n    for (const item of weeklyTopics) {''',
              '''    const activity = new Map<string, WeeklyAccumulator>();\n    const likes = new Map<string, WeeklyAccumulator>();\n\n    // A real weekly activity ranking should not disappear just because a user\n    // read/browsed without creating a topic. Presence is a low-weight real\n    // activity signal; topics/comments keep the meaningful weight.\n    for (const user of weeklyActiveUsers) {\n      getWeeklyUser(activity, user).presenceCount += 1;\n    }\n\n    for (const item of weeklyTopics) {''',
              'weekly presence accumulation',
          )

          service = replace_once(
              service,
              '''        activity: topWeekly(\n          activity,\n          (item) => item.topicCount + item.commentCount,\n        ),''',
              '''        activity: topWeekly(\n          activity,\n          (item) =>\n            item.topicCount * 3 +\n            item.commentCount * 2 +\n            item.presenceCount,\n        ),''',
              'weekly activity score',
          )

          # Poll cards need a complete public display contract: description + themed community image.
          service = replace_once(
              service,
              '''              accentColor: true,\n            },''',
              '''              accentColor: true,\n              avatarUrl: true,\n            },''',
              'poll community avatar selection',
          )

          service = replace_once(
              service,
              '''        id: poll.id,\n        title: poll.title,\n        closesAt: poll.closesAt,''',
              '''        id: poll.id,\n        title: poll.title,\n        description: poll.description,\n        kind: poll.kind,\n        closesAt: poll.closesAt,''',
              'active poll display fields',
          )

          # ------------------------------------------------------------------
          # FRONTEND: render the existing real data fully and choose an honest
          # non-empty weekly tab when only activity exists.
          # ------------------------------------------------------------------
          home = replace_once(
              home,
              '''type PollItem = {\n  id: string;\n  title: string;''',
              '''type PollItem = {\n  id: string;\n  title: string;\n  description?: string;\n  kind?: string;''',
              'PollItem display fields',
          )

          home = replace_once(
              home,
              '''  community: { slug: string; name: string; accentColor?: string };''',
              '''  community: {\n    slug: string;\n    name: string;\n    accentColor?: string;\n    avatarUrl?: string | null;\n  };''',
              'PollItem community image contract',
          )

          home = replace_once(
              home,
              '''  commentCount: number;\n};\n\ntype HomeDiscussedTopic''',
              '''  commentCount: number;\n  presenceCount?: number;\n};\n\ntype HomeDiscussedTopic''',
              'WeeklyUser presence contract',
          )

          home = replace_once(
              home,
              '''function topicVisual(slug: string) {\n  return topicVisuals[slug] ?? '/forrum-assets/topic-default.svg';\n}\n''',
              '''function topicVisual(slug: string) {\n  return topicVisuals[slug] ?? '/forrum-assets/topic-default.svg';\n}\n\nfunction communityVisual(\n  slug: string,\n  avatarUrl?: string | null,\n) {\n  return topicVisuals[slug] ?? avatarUrl ?? topicVisual(slug);\n}\n''',
              'thematic community visual helper',
          )

          # Known FORRUM categories should use their deliberate thematic pixel visual,
          # instead of a generic avatar/letter placeholder.
          discussed_visual_old = '''      <CommunityMark
                  className="forrum-home-v16__topic-mark"
                  name={item.community.name}
                  url={item.community.avatarUrl ?? topicVisual(item.community.slug)}
                  size={46}
                />'''
          discussed_visual_new = '''      <CommunityMark
                  className="forrum-home-v16__topic-mark"
                  name={item.community.name}
                  url={communityVisual(item.community.slug, item.community.avatarUrl)}
                  size={46}
                />'''
          home = replace_once(
              home,
              discussed_visual_old,
              discussed_visual_new,
              'discussed thematic visual',
          )

          # Actual contains two remaining item-community occurrences in V40: announcements + topics.
          actual_old = 'url={item.community.avatarUrl ?? topicVisual(item.community.slug)}'
          actual_count = home.count(actual_old)
          if actual_count != 2:
              raise SystemExit(f'V41 expected two Actual generic image expressions; found {actual_count}.')
          home = home.replace(
              actual_old,
              'url={communityVisual(item.community.slug, item.community.avatarUrl)}',
          )

          home = replace_once(
              home,
              'url={topicVisual(poll.community.slug)}',
              'url={communityVisual(poll.community.slug, poll.community.avatarUrl)}',
              'poll thematic visual',
          )

          old_poll_row = '''function PollRow({ poll }: { poll: PollItem }) {\n  const options = poll.options ?? [];\n  const total = options.reduce((sum, option) => sum + Math.max(0, option.bindingVotes), 0);\n  return (\n    <Link className="forrum-home-v16__poll" href="/events?tab=polls">\n      <CommunityMark\n        className="forrum-home-v16__poll-mark"\n        name={poll.community.name}\n        url={communityVisual(poll.community.slug, poll.community.avatarUrl)}\n        size={40}\n      />\n      <span className="forrum-home-v16__poll-copy">\n        <strong>{poll.title}</strong>\n        <small>Голосов: {formatCount(total)}</small>\n      </span>\n      <span className="forrum-home-v16__poll-options">\n        {options.map((option) => {\n          const percent = total > 0 ? Math.round((option.bindingVotes / total) * 100) : 0;\n          return (\n            <span className="forrum-home-v16__poll-option" key={option.id}>\n              <span>{option.label}</span>\n              <i aria-hidden="true"><b style={{ width: `${percent}%` }} /></i>\n              <em>{formatCount(option.bindingVotes)}</em>\n              <strong>{percent}%</strong>\n            </span>\n          );\n        })}\n      </span>\n      <span className="forrum-home-v16__poll-time">Осталось: {pollTimeLeft(poll.closesAt)}</span>\n    </Link>\n  );\n}'''

          new_poll_row = '''function PollRow({ poll }: { poll: PollItem }) {\n  const options = poll.options ?? [];\n  const totalBinding = options.reduce(\n    (sum, option) => sum + Math.max(0, option.bindingVotes),\n    0,\n  );\n  const totalAdvisory = options.reduce(\n    (sum, option) => sum + Math.max(0, option.advisoryVotes),\n    0,\n  );\n  const outcomeTotal = totalBinding > 0 ? totalBinding : totalAdvisory;\n  const totalVotes = totalBinding + totalAdvisory;\n\n  return (\n    <Link className="forrum-home-v16__poll" href="/events?tab=polls">\n      <CommunityMark\n        className="forrum-home-v16__poll-mark"\n        name={poll.community.name}\n        url={communityVisual(poll.community.slug, poll.community.avatarUrl)}\n        size={40}\n      />\n      <span className="forrum-home-v16__poll-copy">\n        <strong>{poll.title}</strong>\n        <small>\n          Голосов: {formatCount(totalVotes)}\n          {totalBinding > 0 && totalAdvisory > 0\n            ? ` · решающих ${formatCount(totalBinding)}`\n            : ''}\n        </small>\n      </span>\n      <span className="forrum-home-v16__poll-options">\n        {options.map((option) => {\n          const votes = totalBinding > 0\n            ? option.bindingVotes\n            : option.advisoryVotes;\n          const percent = outcomeTotal > 0\n            ? Math.round((votes / outcomeTotal) * 100)\n            : 0;\n\n          return (\n            <span className="forrum-home-v16__poll-option" key={option.id}>\n              <span>{option.label}</span>\n              <i aria-hidden="true">\n                <b style={{ width: `${percent}%` }} />\n              </i>\n              <em>{formatCount(votes)}</em>\n              <strong>{percent}%</strong>\n            </span>\n          );\n        })}\n      </span>\n      <span className="forrum-home-v16__poll-time">\n        Осталось: {pollTimeLeft(poll.closesAt)}\n      </span>\n    </Link>\n  );\n}'''
          home = replace_once(home, old_poll_row, new_poll_row, 'full active poll renderer')

          home = replace_once(
              home,
              '''  const [expanded, setExpanded] = useState<Set<string>>(() => new Set(parentSlugs));\n  const [weeklyMode, setWeeklyMode] = useState<'likes' | 'activity'>('likes');\n  const discussed =''',
              '''  const [expanded, setExpanded] = useState<Set<string>>(() => new Set(parentSlugs));\n  const initialWeeklyLikes = initialData.overview?.weekly.likes ?? [];\n  const initialWeeklyActivity = initialData.overview?.weekly.activity ?? [];\n  const initialWeeklyMode: 'likes' | 'activity' =\n    initialWeeklyLikes.length > 0\n      ? 'likes'\n      : initialWeeklyActivity.length > 0\n        ? 'activity'\n        : 'likes';\n  const [weeklyMode, setWeeklyMode] = useState<'likes' | 'activity'>(\n    initialWeeklyMode,\n  );\n  const discussed =''',
              'honest weekly initial tab',
          )

          home = replace_once(
              home,
              '''                <strong>{weeklyMode === 'likes' ? '♡' : '↻'} {formatCount(user.score)}</strong>''',
              '''                <strong\n                  title={\n                    weeklyMode === 'likes'\n                      ? `Симпатий за 7 дней: ${formatCount(user.reactionCount)}`\n                      : `Тем ${formatCount(user.topicCount)} · комментариев ${formatCount(user.commentCount)} · активность ${formatCount(user.presenceCount)}`\n                  }\n                >\n                  {weeklyMode === 'likes' ? '♡' : '↻'} {formatCount(user.score)}\n                </strong>''',
              'weekly score details',
          )

          home = replace_once(
              home,
              '''          {!weekly.length && <p className="forrum-home-v16__weekly-empty">За эту неделю рейтинг ещё не сформировался.</p>}''',
              '''          {!weekly.length && (\n            <p className="forrum-home-v16__weekly-empty">\n              {weeklyMode === 'likes'\n                ? 'За последние 7 дней симпатий ещё нет.'\n                : 'За последние 7 дней активности ещё нет.'}\n            </p>\n          )}''',
              'truthful weekly empty state',
          )

          # ------------------------------------------------------------------
          # CSS: center desktop at 1580px, preserve three-column geometry,
          # refine existing typography/theme rules in place.
          # ------------------------------------------------------------------
          start, end, block = block_bounds(css, CSS_START, CSS_END)

          block = replace_once(
              block,
              '''   V40 composition alignment: near-full viewport shell, real dense home data, calmer typography.''',
              '''   V41 completion alignment: centered 1580px shell, complete real polls/ranking, thematic visuals.''',
              'V41 canonical comment',
          )

          block = replace_once(
              block,
              '''  position: relative;\n  left: 50%;\n  width: min(calc(100vw - 20px), 1920px);\n  max-width: 1920px;\n  margin-left: 0;\n  margin-right: 0;\n  transform: translateX(-50%);''',
              '''  position: relative;\n  left: auto;\n  width: min(calc(100vw - 32px), 1580px);\n  max-width: 1580px;\n  margin-left: auto;\n  margin-right: auto;\n  transform: none;''',
              'centered desktop shell',
          )

          # Responsive gutters should remain comfortable instead of returning to 10px.
          block = replace_once(
              block,
              '''  .forrum-home-v16 { width: calc(100vw - 20px); grid-template-columns: 260px minmax(0, 1fr); padding-inline: 8px; }''',
              '''  .forrum-home-v16 { width: calc(100vw - 24px); grid-template-columns: 260px minmax(0, 1fr); padding-inline: 0; }''',
              'narrow desktop gutter',
          )
          block = replace_once(
              block,
              '''  .forrum-home-v16 { width: calc(100vw - 12px); grid-template-columns: 1fr; gap: 10px; padding: 10px 6px 18px; }''',
              '''  .forrum-home-v16 { width: calc(100vw - 16px); grid-template-columns: 1fr; gap: 10px; padding: 8px 0 18px; }''',
              'mobile gutter',
          )

          # Calmer hierarchy: dense, not bold everywhere.
          for old, new, label in (
              ('font-weight: 690;', 'font-weight: 640;', 'panel heading weight'),
              ('font-size: 12.5px; font-weight: 650;', 'font-size: 12.5px; font-weight: 600;', 'root tree weight'),
              ('font-size: 13.5px; font-weight: 650;', 'font-size: 13.5px; font-weight: 610;', 'discussed title weight'),
              ('font-size: 11.75px; font-weight: 580;', 'font-size: 11.75px; font-weight: 560;', 'new topic weight'),
              ('font-size: 12.25px; line-height: 1.22; font-weight: 620;', 'font-size: 12.25px; line-height: 1.22; font-weight: 580;', 'actual title weight'),
          ):
              if old not in block:
                  raise SystemExit(f'V41 typography source missing: {label}')
              block = block.replace(old, new, 1)

          # Poll/ranking density matches the reference when real records exist.
          block = replace_once(
              block,
              '.forrum-home-v16__poll { min-width: 0; min-height: 78px;',
              '.forrum-home-v16__poll { min-width: 0; min-height: 82px;',
              'poll row height',
          )
          block = replace_once(
              block,
              '.forrum-home-v16__weekly li { min-height: 41px;',
              '.forrum-home-v16__weekly li { min-height: 40px;',
              'weekly row height',
          )

          css = css[:start] + block + css[end:]

          # Theme tokens: Graphite must read as graphite, not black; Paper gets subtle warm levels.
          t0, t1, theme = block_bounds(css, THEME_START, THEME_END)
          for old, new, label in (
              ('--fvt-page: #f7f5f1;', '--fvt-page: #f4f1ea;', 'Paper page'),
              ('--fvt-surface: #faf8f4;', '--fvt-surface: #f9f6ef;', 'Paper surface'),
              ('--fvt-panel: #faf8f3;', '--fvt-panel: #fcfaf5;', 'Paper panel'),
              ('--fvt-panel-soft: #f2efe9;', '--fvt-panel-soft: #f0ece4;', 'Paper soft'),
              ('--fvt-page: #151a1d;', '--fvt-page: #1a2024;', 'Graphite page'),
              ('--fvt-surface: #181d20;', '--fvt-surface: #1d2327;', 'Graphite surface'),
              ('--fvt-panel: #191e21;', '--fvt-panel: #20262a;', 'Graphite panel'),
              ('--fvt-panel-soft: #161b1e;', '--fvt-panel-soft: #1b2024;', 'Graphite soft'),
              ('--fvt-line: #363d42;', '--fvt-line: #3b444a;', 'Graphite line'),
              ('--fvt-text: #d7dbdd;', '--fvt-text: #cfd4d7;', 'Graphite text'),
              ('--fvt-muted: #9aa2a7;', '--fvt-muted: #969fa5;', 'Graphite muted'),
              ('--fvt-faint: #767f85;', '--fvt-faint: #7e878d;', 'Graphite faint'),
          ):
              theme = replace_once(theme, old, new, label)
          css = css[:t0] + theme + css[t1:]

          # Global header/footer shell follows the same centered max-width.
          if SHELL_START in css and SHELL_END in css:
              s0, s1, shell = block_bounds(css, SHELL_START, SHELL_END)
              old_shell_width = '''  width: min(calc(100% - 20px), 1920px) !important;\n  max-width: 1920px !important;'''
              new_shell_width = '''  width: min(calc(100% - 32px), 1580px);\n  max-width: 1580px;'''
              count = shell.count(old_shell_width)
              if count != 2:
                  raise SystemExit(f'V41 expected two V40 global shell width rules; found {count}.')
              shell = shell.replace(old_shell_width, new_shell_width)
              css = css[:s0] + shell + css[s1:]

          # ------------------------------------------------------------------
          # Existing validators are product contracts; update stale macro geometry and
          # require the new real-data completion signals. No validator is weakened.
          # ------------------------------------------------------------------
          for path in (CHECK_HOME, CHECK_REFERENCE, CHECK_SCALE):
              check = path.read_text(encoding='utf-8')
              check = check.replace(
                  'width: min(calc(100vw - 20px), 1920px)',
                  'width: min(calc(100vw - 32px), 1580px)',
              )
              check = check.replace('max-width: 1920px', 'max-width: 1580px')
              check = check.replace('near-full shell', 'centered 1580px shell')
              check = check.replace('reference-scale viewport width', 'reference-scale centered desktop width')
              path.write_text(check, encoding='utf-8')

          # Source hygiene only; generated Prisma is handled by workflow.
          home = '\n'.join(line.rstrip(' \t') for line in home.splitlines()) + '\n'
          service = '\n'.join(line.rstrip(' \t') for line in service.splitlines()) + '\n'
          css = '\n'.join(line.rstrip(' \t') for line in css.splitlines()) + '\n'

          verify(home, css, service)

          HOME.write_text(home, encoding='utf-8')
          SERVICE.write_text(service, encoding='utf-8')
          CSS.write_text(css, encoding='utf-8')

          print(
              'FORRUM Home Completion V41 applied: centered 1580 shell, complete real '
              'poll/ranking contracts, thematic imagery and softer Paper/Graphite.'
          )
          PY

          python3 -m py_compile /tmp/forrum-home-completion-v41.py

