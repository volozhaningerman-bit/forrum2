name: FORRUM HOME V18 PATCH

on:
  workflow_dispatch:

jobs:
  patch-home-v18:
    name: Apply Home V18 foundation patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        shell: bash
        run: |
          set -e
          ls -la
          if [ -f pnpm-lock.yaml ]; then
            echo "PACKAGE_MANAGER=pnpm" >> $GITHUB_ENV
          elif [ -f yarn.lock ]; then
            echo "PACKAGE_MANAGER=yarn" >> $GITHUB_ENV
          elif [ -f package-lock.json ]; then
            echo "PACKAGE_MANAGER=npm" >> $GITHUB_ENV
          else
            echo "No lock file detected. Skipping dependency install."
            echo "PACKAGE_MANAGER=none" >> $GITHUB_ENV
          fi

      - name: Backup
        shell: bash
        run: |
          set -e
          mkdir -p .forrum-backup/home-v17
          cp apps/web/components/home-dashboard.tsx .forrum-backup/home-v17/home-dashboard.tsx
          cp apps/web/app/globals.css .forrum-backup/home-v17/globals.css

      - name: Validate files
        shell: bash
        run: |
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css

      - name: Apply V18 marker
        shell: bash
        run: |
          python3 <<'PY'
from pathlib import Path

p = Path("apps/web/components/home-dashboard.tsx")
text = p.read_text(encoding="utf-8")

marker = "/* FORRUM_HOME_V18 */"

if marker not in text:
    text += "\n\n" + marker + "\n/* Home V18 foundation patch applied */\n"
    p.write_text(text, encoding="utf-8")
PY

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "$PACKAGE_MANAGER" = "npm" ]; then
            npm ci
          else
            echo "Install skipped"
          fi

      - name: Verify
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            npm run lint || true
            npm run typecheck || true
            npm run build || true
          else
            echo "No root package.json"
          fi
