name: FORRUM Create Topic Workspace V15.7.4
run-name: FORRUM Create Topic Workspace V15.7.4
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-create-topic-workspace-v15-7-4
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  create-topic-workspace-v15-7-4:
    name: Create Topic Workspace V15.7.4
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.7.3 and detect V15.7.4
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_2' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_3_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_3_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\ngrep -Fq 'FORRUM_EDITOR_ENGINE_V15_6' \\\n  apps/web/components/bbcode-editor.tsx\ngrep -Fq 'FORRUM_TOPIC_REPLY_EDITOR_V15_6' \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\"\ngrep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12' \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\"\n\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\ncss_start_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_START */' \\\n  apps/web/app/globals.css || true)\"\ncss_end_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_END */' \\\n  apps/web/app/globals.css || true)\"\ncheck_v4_count=\"$(grep -Fc 'Create Topic Workspace V15.7.4 passed:' \\\n  scripts/create-topic-workspace-v15-7-check.mjs || true)\"\ndoc_v4_count=\"$(grep -Fxc '# FORRUM Create Topic Workspace V15.7.4' \\\n  docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7.md || true)\"\n\ntest \"$css_start_count\" -le 1\ntest \"$css_end_count\" -le 1\ntest \"$check_v4_count\" -le 1\ntest \"$doc_v4_count\" -le 1\n\nif [ \"$css_start_count\" -ne \"$css_end_count\" ] || \\\n   [ \"$css_start_count\" -ne \"$check_v4_count\" ] || \\\n   [ \"$css_start_count\" -ne \"$doc_v4_count\" ]; then\n  echo 'Partial V15.7.4 marker state detected.'\n  exit 1\nfi\n\nif [ \"$css_start_count\" -eq 1 ]; then\n  node scripts/create-topic-workspace-v15-7-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Create Topic Workspace V15.7.4 is already applied and valid.'\nelse\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\nfi\n\ntest -z \"$(git status --porcelain)\""
    - name: Apply Create Topic Workspace V15.7.4 polish
      shell: bash
      env:
        CSS_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '\\n%s\\n' \"$(printf '%s' \"$CSS_B64\" | base64 -d)\" \\\n  >> apps/web/app/globals.css\n\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/create-topic-workspace-v15-7-check.mjs\n\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7.md"
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Verify V15.7.4 contracts and protected scope
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/create-topic-workspace-v15-7-check.mjs\ngrep -Fqx '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_START */' \\\n  apps/web/app/globals.css\ngrep -Fqx '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_END */' \\\n  apps/web/app/globals.css\n\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/category-page-stage-1-v14-check.mjs\nnode scripts/section-page-header-v14-3-check.mjs\nnode scripts/section-page-layout-v14-7-check.mjs\nnode scripts/section-page-polish-v14-8-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\n\ngit diff --check\n\nallowed='^(apps/web/app/globals\\.css|scripts/create-topic-workspace-v15-7-check\\.mjs|docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7\\.md)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\n\nif [ -n \"$unexpected\" ]; then\n  echo 'Unexpected files changed:'\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff -- \\\n  apps/web/app/create/publication-form.tsx \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\" \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\" \\\n  apps/web/components/topic-category-tree.tsx \\\n  apps/web/components/bbcode-editor.tsx \\\n  apps/web/components/bbcode-content.tsx \\\n  apps/web/lib/bbcode.ts \\\n  apps/web/components/main-nav.tsx \\\n  apps/web/components/site-header.tsx \\\n  apps/web/components/site-footer.tsx \\\n  apps/web/components/home-dashboard.tsx \\\n  apps/web/app/page.tsx \\\n  apps/api/src \\\n  apps/api/prisma | grep -q .; then\n  echo 'V15.7.4 changed protected topic/section/editor/header/home/backend scope.'\n  exit 1\nfi"
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Create isolated verified V15.7.4 commit
      shell: bash
      run: "set -euo pipefail\n\ngit config user.name \"FORRUM QA updater\"\ngit config user.email \"actions@users.noreply.github.com\"\n\ngit add -- \\\n  apps/web/app/globals.css \\\n  scripts/create-topic-workspace-v15-7-check.mjs \\\n  docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7.md\n\ngit commit -m \"Polish Create Topic Workspace V15.7.4\"\ntest -z \"$(git status --porcelain)\""
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      shell: bash
      run: 'set -euo pipefail

        npm install --package-lock=false

        test ! -f package-lock.json'
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Generate validate sync and seed Prisma
      shell: bash
      run: 'set -euo pipefail

        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Static UX accessibility and regression checks
      shell: bash
      run: 'set -euo pipefail


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y


        node scripts/create-topic-workspace-v15-7-check.mjs

        node scripts/topic-reply-editor-v15-6-check.mjs

        node scripts/topic-post-surface-v15-5-check.mjs

        node scripts/topic-page-frame-v15-4-check.mjs

        node scripts/section-tree-hit-area-v14-12-check.mjs

        node scripts/global-header-v13-4-check.mjs

        node scripts/ui-interaction-check.mjs'
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Typecheck every workspace
      run: npm run typecheck
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Run API tests
      run: npm test
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Clean production build
      run: npm run build
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Remove generated build noise
      shell: bash
      run: 'set -euo pipefail

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"'
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Push verified Create Topic Workspace V15.7.4
      shell: bash
      run: 'set -euo pipefail

        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Verify remote main
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\n\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_START'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_END'\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_2'\ngit show origin/main:apps/web/components/bbcode-editor.tsx \\\n  | grep -Fq 'FORRUM_EDITOR_ENGINE_V15_6'\ngit show 'origin/main:apps/web/app/p/[slug]/publication-client.tsx' \\\n  | grep -Fq 'FORRUM_TOPIC_REPLY_EDITOR_V15_6'\ngit show 'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \\\n  | grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12'\n\nnode scripts/create-topic-workspace-v15-7-check.mjs\n\necho 'FORRUM Create Topic Workspace V15.7.4 remote verification passed.' "
      if: steps.baseline.outputs.already_applied != 'true'
    - name: Confirm V15.7.4 was already valid
      shell: bash
      run: echo 'FORRUM Create Topic Workspace V15.7.4 was already applied; no files changed.'
      if: steps.baseline.outputs.already_applied == 'true'
