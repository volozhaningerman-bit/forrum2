name: FORRUM Global Shell V16.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-global-shell-v16-1
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  global-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/components/site-header.tsx
          test -f apps/web/components/site-footer.tsx
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/home-paper-graphite-v16-check.mjs

      - name: Apply Global Shell V16.1
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$PATCH_B64" | base64 -d \
            > /tmp/forrum-global-shell-v16-1.py

          printf '%s' "$CSS_B64" | base64 -d \
            > /tmp/forrum-global-shell-v16-1.css

          printf '%s' "$CHECK_B64" | base64 -d \
            > scripts/global-shell-v16-1-check.mjs

          python3 /tmp/forrum-global-shell-v16-1.py

          git diff --check
          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs

      - name: Verify isolated source scope
        shell: bash
        run: |
          set -euo pipefail

          allowed='^(apps/web/app/globals\.css|apps/web/components/site-header\.tsx|apps/web/components/site-footer\.tsx|scripts/global-shell-v16-1-check\.mjs)$'

          bad="$(
            git status --porcelain=v1 --untracked-files=all \
              | sed 's/^...//' \
              | grep -Ev "$allowed" || true
          )"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected source changes before build:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Run homepage and global-shell checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          git diff --check

      - name: Run available tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Restore tracked build side effects
        shell: bash
        run: |
          set -euo pipefail

          allowed='^(apps/web/app/globals\.css|apps/web/components/site-header\.tsx|apps/web/components/site-footer\.tsx|scripts/global-shell-v16-1-check\.mjs)$'

          mapfile -t tracked_dirty < <(
            git status --porcelain=v1 --untracked-files=no \
              | sed 's/^...//' \
              | grep -Ev "$allowed" || true
          )

          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue
            echo "Restoring build-only tracked change: $path"
            git restore --staged --worktree -- "$path"
          done

      - name: Final production audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          git diff --check

          allowed='^(apps/web/app/globals\.css|apps/web/components/site-header\.tsx|apps/web/components/site-footer\.tsx|scripts/global-shell-v16-1-check\.mjs)$'

          actual="$(
            git status --porcelain=v1 --untracked-files=all \
              | sed 's/^...//'
          )"

          bad="$(
            printf '%s\n' "$actual" \
              | grep -Ev "$allowed" || true
          )"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected files remain after all checks:"
            printf '%s\n' "$bad"
            echo
            git status --short
            exit 1
          fi

          grep -Fq 'data-forrum-shell="header"' \
            apps/web/components/site-header.tsx

          grep -Fq 'data-forrum-shell="footer"' \
            apps/web/components/site-footer.tsx

          echo "Final production audit passed."
          git status --short

      - name: Commit verified global shell
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet \
            && [ -z "$(git ls-files --others --exclude-standard scripts/global-shell-v16-1-check.mjs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Global Shell V16.1 is already applied."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add \
            apps/web/app/globals.css \
            apps/web/components/site-header.tsx \
            apps/web/components/site-footer.tsx \
            scripts/global-shell-v16-1-check.mjs

          git diff --cached --check
          git commit -m "Polish canonical FORRUM global shell V16.1"

          test -z "$(git status --porcelain --untracked-files=no)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push verified global shell
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Published verified Global Shell V16.1: $(git rev-parse HEAD)"
