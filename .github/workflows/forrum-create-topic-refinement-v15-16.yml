name: FORRUM Create Topic Refinement V15.16
run-name: FORRUM Create Topic Refinement V15.16
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-create-topic-refinement-v15-16
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  create-topic-refinement-v15-16:
    name: Create Topic Refinement V15.16
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.12 and detect V15.16
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest -f apps/web/components/bbcode-editor.tsx\ntest -f apps/web/app/create/publication-form.tsx\ntest -f apps/web/app/globals.css\ntest -f apps/api/src/publications/publications.service.ts\n\ncount_marker() {\n  local pattern=\"$1\"\n  local path=\"$2\"\n  if [ ! -f \"$path\" ]; then\n    printf '0\n'\n    return\n  fi\n  grep -Fc \"$pattern\" \"$path\" || true\n}\n\neditor_count=\"$(count_marker '// FORRUM_STABLE_VISUAL_SELECTION_V15_16' \\\n  apps/web/components/bbcode-editor.tsx)\"\nform_count=\"$(count_marker '// FORRUM_CREATE_TOPIC_REFINEMENT_V15_16' \\\n  apps/web/app/create/publication-form.tsx)\"\nservice_count=\"$(count_marker 'FORRUM_RESTRAINED_TAG_STYLE_PRESETS_V15_16' \\\n  apps/api/src/publications/publications.service.ts)\"\ncss_start_count=\"$(count_marker '/* FORRUM_CREATE_TOPIC_REFINEMENT_V15_16_START */' \\\n  apps/web/app/globals.css)\"\ncss_end_count=\"$(count_marker '/* FORRUM_CREATE_TOPIC_REFINEMENT_V15_16_END */' \\\n  apps/web/app/globals.css)\"\
        \ncheck_count=\"$(count_marker 'Create Topic Refinement V15.16 passed:' \\\n  scripts/create-topic-refinement-v15-16-check.mjs)\"\ndoc_count=\"$(count_marker '# FORRUM Create Topic Refinement V15.16' \\\n  docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md)\"\n\nfor count in \"$editor_count\" \"$form_count\" \"$service_count\" \\\n  \"$css_start_count\" \"$css_end_count\" \"$check_count\" \"$doc_count\"; do\n  test -n \"$count\"\n  test \"$count\" -le 1\ndone\n\nfor count in \"$form_count\" \"$service_count\" \"$css_start_count\" \\\n  \"$css_end_count\" \"$check_count\" \"$doc_count\"; do\n  if [ \"$editor_count\" -ne \"$count\" ]; then\n    echo 'Partial V15.16 marker state detected.'\n    exit 1\n  fi\ndone\n\nif [ \"$editor_count\" -eq 1 ]; then\n  node scripts/create-topic-refinement-v15-16-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Create Topic Refinement V15.16 is already applied and valid.'\nelse\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\
        \nfi"
    - name: Apply Create Topic Refinement V15.16
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      env:
        EDITOR_B64: 
        FORM_B64: 
        SERVICE_B64: 
        CSS12_B64: 
        CSS_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$EDITOR_B64\" | base64 -d \\\n  > apps/web/components/bbcode-editor.tsx\nprintf '%s' \"$FORM_B64\" | base64 -d \\\n  > apps/web/app/create/publication-form.tsx\nprintf '%s' \"$SERVICE_B64\" | base64 -d \\\n  > apps/api/src/publications/publications.service.ts\ncss12_start_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_12_START */' \\\n  apps/web/app/globals.css || true)\"\ncss12_end_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_12_END */' \\\n  apps/web/app/globals.css || true)\"\ntest \"$css12_start_count\" -eq \"$css12_end_count\"\ntest \"$css12_start_count\" -le 1\nif [ \"$css12_start_count\" -eq 0 ]; then\n  printf '%s' \"$CSS12_B64\" | base64 -d \\\n    >> apps/web/app/globals.css\nfi\nprintf '%s' \"$CSS_B64\" | base64 -d \\\n  >> apps/web/app/globals.css\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/create-topic-refinement-v15-16-check.mjs\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md\n\
        \ngit diff --check\nnode scripts/create-topic-refinement-v15-16-check.mjs"
    - name: Verify V15.16 contracts and protected scope
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_STABLE_VISUAL_SELECTION_V15_16' \\\n  apps/web/components/bbcode-editor.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_REFINEMENT_V15_16' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fc 'FORRUM_RESTRAINED_TAG_STYLE_PRESETS_V15_16' \\\n  apps/api/src/publications/publications.service.ts)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_REFINEMENT_V15_16_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_REFINEMENT_V15_16_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\nnode scripts/create-topic-refinement-v15-16-check.mjs\nnode scripts/editor-controls-v15-10-check.mjs\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\n\
        node scripts/global-header-v13-4-check.mjs\n\nexpected=\"$(printf '%s\n' \\\n  'apps/api/src/publications/publications.service.ts' \\\n  'apps/web/app/create/publication-form.tsx' \\\n  'apps/web/app/globals.css' \\\n  'apps/web/components/bbcode-editor.tsx' \\\n  'docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md' \\\n  'scripts/create-topic-refinement-v15-16-check.mjs' | sort)\"\nactual=\"$(git status --porcelain | cut -c4- | sort)\"\ntest \"$actual\" = \"$expected\""
    - name: Create isolated verified V15.16 commit
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit config user.name 'forrum-actions'\ngit config user.email 'actions@forrum.local'\n\ngit add \\\n  apps/api/src/publications/publications.service.ts \\\n  apps/web/app/create/publication-form.tsx \\\n  apps/web/app/globals.css \\\n  apps/web/components/bbcode-editor.tsx \\\n  scripts/create-topic-refinement-v15-16-check.mjs \\\n  docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md\n\ngit diff --cached --check\nexpected=\"$(printf '%s\n' \\\n  'apps/api/src/publications/publications.service.ts' \\\n  'apps/web/app/create/publication-form.tsx' \\\n  'apps/web/app/globals.css' \\\n  'apps/web/components/bbcode-editor.tsx' \\\n  'docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md' \\\n  'scripts/create-topic-refinement-v15-16-check.mjs' | sort)\"\nactual=\"$(git diff --cached --name-only | sort)\"\ntest \"$actual\" = \"$expected\"\n\ngit commit -m 'Refine create topic workspace V15.16'\ntest -z \"$(git status --porcelain)\""
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm install --package-lock=false


        test ! -f package-lock.json'
    - name: Generate validate sync and seed Prisma
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
    - name: Static UX accessibility and regression checks
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/create-topic-refinement-v15-16-check.mjs\nnode scripts/editor-controls-v15-10-check.mjs\ngit diff --check HEAD^ HEAD -- \\\n  apps/api/src/publications/publications.service.ts \\\n  apps/web/app/create/publication-form.tsx \\\n  apps/web/app/globals.css \\\n  apps/web/components/bbcode-editor.tsx \\\n  docs/FORRUM_CREATE_TOPIC_REFINEMENT_V15_16.md \\\n  scripts/create-topic-refinement-v15-16-check.mjs"
    - name: Typecheck every workspace
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run typecheck
    - name: Run API tests
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm test
    - name: Clean production build
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run build
    - name: Remove generated build noise
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git reset --hard HEAD

        git clean -ffdx


        test -z "$(git status --porcelain)"'
    - name: Push verified Create Topic Refinement V15.16
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
    - name: Verify remote main
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\ngit show origin/main:apps/web/components/bbcode-editor.tsx \\\n  | grep -Fq 'FORRUM_STABLE_VISUAL_SELECTION_V15_16'\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_REFINEMENT_V15_16'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_REFINEMENT_V15_16_START'\ngit show origin/main:apps/api/src/publications/publications.service.ts \\\n  | grep -Fq 'FORRUM_RESTRAINED_TAG_STYLE_PRESETS_V15_16'\nnode scripts/create-topic-refinement-v15-16-check.mjs\necho 'FORRUM Create Topic Refinement V15.16 remote verification passed.' "
    - name: Confirm V15.16 was already valid
      if: steps.baseline.outputs.already_applied == 'true'
      shell: bash
      run: echo 'FORRUM Create Topic Refinement V15.16 was already applied; no files changed.'
