name: FORRUM Global Header V13.4
run-name: FORRUM Global Header V13.4

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-global-header-v13-4
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  global-header-v13-4:
    name: Global Header V13.4
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact current baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "const legacyLinks = [" apps/web/components/main-nav.tsx
          grep -Fq "const homeLinks = [" apps/web/components/main-nav.tsx
          grep -Fq "const onCommunities = pathname === '/communities';" apps/web/components/main-nav.tsx
          grep -Fq "const useApprovedNav = onHome || onCommunities;" apps/web/components/main-nav.tsx

          grep -Fq "approved communities nav mode" scripts/communities-redesign-stage-a-check.mjs
          grep -Fq "shared approved nav" scripts/communities-redesign-stage-a-check.mjs
          grep -Fq "approved Communities header" scripts/communities-redesign-stage-b-check.mjs
          grep -Fq "approved existing Communities header mode" scripts/communities-redesign-stage-e-check.mjs

          grep -Fq "useState<string | null>(null)" apps/web/app/communities/communities-client.tsx
          grep -Fq "FORRUM_COMMUNITIES_REDESIGN_STAGE_F5_V12" apps/web/app/globals.css
          test -z "$(git status --porcelain)"

      - name: Apply Global Header V13.4
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-global-header-v13-4.py
          python3 /tmp/forrum-global-header-v13-4.py

      - name: Verify complete source contracts and scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/global-header-v13-4-check.mjs
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          allowed='^(apps/web/components/main-nav\.tsx|scripts/communities-redesign-stage-a-check\.mjs|scripts/communities-redesign-stage-b-check\.mjs|scripts/communities-redesign-stage-e-check\.mjs|scripts/global-header-v13-4-check\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --             apps/web/components/site-header.tsx             apps/web/components/site-footer.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/page.tsx             apps/web/app/communities             apps/api/src             apps/api/prisma | grep -q .; then
            echo 'V13.4 changed approved page/backend code unexpectedly.'
            exit 1
          fi

      - name: Create isolated verified commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add --             apps/web/components/main-nav.tsx             scripts/communities-redesign-stage-a-check.mjs             scripts/communities-redesign-stage-b-check.mjs             scripts/communities-redesign-stage-e-check.mjs             scripts/global-header-v13-4-check.mjs

          git commit -m "Finalize global FORRUM header"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and full regression checks
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/global-header-v13-4-check.mjs
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Global Header V13.4
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          nav="$(git show origin/main:apps/web/components/main-nav.tsx)"
          [[ "$nav" == *'FORRUM_GLOBAL_HEADER_V13_4'* ]]
          [[ "$nav" == *"['/', 'Главная']"* ]]
          [[ "$nav" == *"['/communities', 'Сообщества']"* ]]
          [[ "$nav" == *"['/services', 'Услуги']"* ]]
          [[ "$nav" == *"['/media', 'Медиа']"* ]]
          [[ "$nav" == *"['/news', 'Новости']"* ]]
          [[ "$nav" != *'legacyLinks'* ]]
          [[ "$nav" != *'homeLinks'* ]]
          [[ "$nav" != *'onCommunities'* ]]
          [[ "$nav" != *'useApprovedNav'* ]]
          [[ "$nav" != *"['/events', 'События']"* ]]
          [[ "$nav" != *"['/workshop', 'Мастерская']"* ]]

          node scripts/global-header-v13-4-check.mjs
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs

          echo "FORRUM Global Header V13.4 remote verification passed."
