name: FORRUM Visual Polish V23
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-visual-polish-v23
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  visual-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V21 baseline
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/app/globals.css
          test -f apps/web/components/theme-toggle.tsx
          test -f scripts/home-paper-graphite-v16-check.mjs
          test -f scripts/global-shell-v16-1-check.mjs
          test -f scripts/home-reference-check.mjs
          test -f scripts/home-scale-polish-check.mjs
          test -f scripts/home-visual-theme-check.mjs

          grep -q             'FORRUM_THEME_TOGGLE_V1\|FORRUM_THEME_TOGGLE_V2'             apps/web/components/theme-toggle.tsx

          grep -q             'FORRUM_VISUAL_THEME_START'             apps/web/app/globals.css

      - name: Decode V23 patch
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          THEME_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$PATCH_B64" | base64 -d             > /tmp/forrum-visual-polish-v23.py

          printf '%s' "$CSS_B64" | base64 -d             > /tmp/forrum-visual-polish-v23.css

          printf '%s' "$THEME_B64" | base64 -d             > /tmp/forrum-theme-toggle-v23.tsx

          printf '%s' "$CHECK_B64" | base64 -d             > scripts/home-visual-polish-v23-check.mjs

          python3 -m py_compile             /tmp/forrum-visual-polish-v23.py

          node --check             scripts/home-visual-polish-v23-check.mjs

      - name: Apply V23 visual polish
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/forrum-visual-polish-v23.py

          git diff --check

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs
          node scripts/home-visual-polish-v23-check.mjs

      - name: Verify isolated V23 scope
        shell: bash
        run: |
          set -euo pipefail

          is_allowed() {
            case "$1" in
              apps/web/app/globals.css|              apps/web/components/theme-toggle.tsx|              scripts/home-visual-polish-v23-check.mjs)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          bad=0

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            path="${line:3}"

            if ! is_allowed "$path"; then
              echo "::error::Unexpected V23 source file: $path"
              bad=1
            fi
          done < <(
            git status --porcelain=v1 --untracked-files=all
          )

          exit "$bad"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Validate ThemeToggle V23 TypeScript
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");
          const ts = require("typescript");

          const source = fs.readFileSync(
            "apps/web/components/theme-toggle.tsx",
            "utf8",
          );

          const result = ts.transpileModule(
            source,
            {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
                strict: true,
              },
              reportDiagnostics: true,
            },
          );

          const errors = (
            result.diagnostics ?? []
          ).filter(
            (diagnostic) =>
              diagnostic.category ===
              ts.DiagnosticCategory.Error,
          );

          if (errors.length) {
            for (const error of errors) {
              console.error(
                ts.flattenDiagnosticMessageText(
                  error.messageText,
                  "\n",
                ),
              );
            }
            process.exit(1);
          }

          console.log(
            "ThemeToggle V23 TypeScript validation: OK",
          );
          NODE

      - name: Run static UX accessibility checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs
          node scripts/home-visual-polish-v23-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          git diff --check

      - name: Run available tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Restore tracked build side effects
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tracked_dirty < <(
            git status --porcelain=v1 --untracked-files=no |
            sed 's/^...//'
          )

          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue

            case "$path" in
              apps/web/app/globals.css|              apps/web/components/theme-toggle.tsx)
                continue
                ;;
            esac

            git restore --staged --worktree -- "$path"
          done

      - name: Remove generated build artifacts
        shell: bash
        run: |
          set -euo pipefail

          git clean -ffdx             -e scripts/home-visual-polish-v23-check.mjs

          test -f scripts/home-visual-polish-v23-check.mjs

      - name: Final V23 production audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs
          node scripts/home-visual-polish-v23-check.mjs

          git diff --check

          is_allowed() {
            case "$1" in
              apps/web/app/globals.css|              apps/web/components/theme-toggle.tsx|              scripts/home-visual-polish-v23-check.mjs)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          bad=0

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            path="${line:3}"

            if ! is_allowed "$path"; then
              echo "::error::Unexpected final V23 file: $path"
              bad=1
            fi
          done < <(
            git status --porcelain=v1 --untracked-files=all
          )

          exit "$bad"

      - name: Commit verified V23
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet             && [ -z "$(
              git ls-files                 --others                 --exclude-standard                 scripts/home-visual-polish-v23-check.mjs
            )" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "FORRUM Visual Polish V23 already applied."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add             apps/web/app/globals.css             apps/web/components/theme-toggle.tsx             scripts/home-visual-polish-v23-check.mjs

          git diff --cached --check

          git commit -m             "Polish FORRUM visual identity V23"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Re-run full V23 audit after rebase
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs
          node scripts/home-visual-polish-v23-check.mjs
          git diff --check

          npm install --include=dev             --no-audit             --no-fund             --package-lock=false

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

          git diff --check

          git restore             --source=HEAD             --staged             --worktree             -- .

          git clean -ffdx
          test -z "$(git status --porcelain)"

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs
          node scripts/home-visual-polish-v23-check.mjs

          echo "Post-rebase V23 audit passed."

      - name: Push verified V23
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote V23 commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo             "Published FORRUM Visual Polish V23: $(git rev-parse HEAD)"
