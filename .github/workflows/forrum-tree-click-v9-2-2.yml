name: FORRUM Tree Click Behavior V9.2.2
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-tree-click-v9-2-2
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  tree-click-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean V9.2.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/ui-interaction-check.mjs
          grep -q 'home-tree-hitarea' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-toggle' apps/web/components/home-dashboard.tsx
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Repository is not clean before applying the tree behavior patch."
            git status --short
            exit 1
          fi

      - name: Apply name-only navigation and row expansion
        shell: bash
        env:
          CSS_B64: 
          CHECK_B64: 
          APPLY_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$APPLY_B64" | base64 --decode > /tmp/apply-tree-click-v9-2-2.py
          python3 /tmp/apply-tree-click-v9-2-2.py

      - name: Verify click behavior and patch scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-tree-click-check-v9-2-2.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check
          allowed='^(apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-click-check-v9-2-2\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create isolated local V9.2.2 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add --             apps/web/app/globals.css             apps/web/components/home-dashboard.tsx             scripts/home-tree-click-check-v9-2-2.mjs
          unexpected="$(git status --porcelain | grep -Ev '^(M |A |D |R |C |\?\?) (apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-click-check-v9-2-2\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes exist before the local commit:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "FORRUM Tree Click Behavior V9.2.2 is already present."
          else
            git commit -m "Make category names the only navigation links"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-tree-click-check-v9-2-2.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified V9.2.2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
