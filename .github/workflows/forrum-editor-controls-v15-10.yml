name: FORRUM Editor Controls V15.10
run-name: FORRUM Editor Controls V15.10
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-editor-controls-v15-10
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  editor-controls-v15-10:
    name: Editor Controls V15.10
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.9 and detect V15.10
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_VISUAL_BBCODE_EDITOR_V15_9' \\\n  apps/web/components/bbcode-editor.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_VISUAL_BBCODE_EDITOR_V15_9' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_VISUAL_BBCODE_EDITOR_V15_9_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_VISUAL_BBCODE_EDITOR_V15_9_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\ncount_marker() {\n  local pattern=\"$1\"\n  local path=\"$2\"\n  if [ ! -f \"$path\" ]; then\n    printf '0\\n'\n    return\n  fi\n  grep -Fc \"$pattern\" \"$path\" || true\n}\n\neditor_count=\"$(count_marker '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/components/bbcode-editor.tsx)\"\nform_count=\"$(count_marker '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/app/create/publication-form.tsx)\"\nparser_count=\"$(count_marker '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/lib/bbcode.ts)\"\ncss_start_count=\"$(count_marker '/* FORRUM_EDITOR_CONTROLS_V15_10_START */' \\\n  apps/web/app/globals.css)\"\ncss_end_count=\"$(count_marker '/* FORRUM_EDITOR_CONTROLS_V15_10_END */' \\\n  apps/web/app/globals.css)\"\ncontroller_count=\"$(count_marker 'FORRUM_TAG_STYLE_PRESETS_V15_10' \\\n  apps/api/src/publications/publications.controller.ts)\"\nservice_count=\"$(count_marker 'FORRUM_TAG_STYLE_PRESETS_V15_10' \\\n  apps/api/src/publications/publications.service.ts)\"\ncheck_count=\"$(count_marker 'Editor Controls V15.10 passed:' \\\n  scripts/editor-controls-v15-10-check.mjs)\"\ndoc_count=\"$(count_marker '# FORRUM Editor Controls V15.10' \\\n  docs/FORRUM_EDITOR_CONTROLS_V15_10.md)\"\n\nfor count in \"$editor_count\" \"$form_count\" \"$parser_count\" \\\n  \"$css_start_count\" \"$css_end_count\" \"$controller_count\" \\\n  \"$service_count\" \"$check_count\" \"$doc_count\"; do\n  test -n \"$count\"\n  test \"$count\" -le 1\ndone\n\nfor count in \"$form_count\" \"$parser_count\" \"$css_start_count\" \\\n  \"$css_end_count\" \"$controller_count\" \"$service_count\" \\\n  \"$check_count\" \"$doc_count\"; do\n  if [ \"$editor_count\" -ne \"$count\" ]; then\n    echo 'Partial V15.10 marker state detected.'\n    exit 1\n  fi\ndone\n\nif [ \"$editor_count\" -eq 1 ]; then\n  node scripts/editor-controls-v15-10-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Editor Controls V15.10 is already applied and valid.'\nelse\n  test \"$(sha256sum apps/web/components/bbcode-editor.tsx | cut -d' ' -f1)\" = \\\n    '27e7ab0b7960951e80720e805c048b04bb79beca7fd8bacce833b8b4744ea326'\n  test \"$(sha256sum apps/web/app/create/publication-form.tsx | cut -d' ' -f1)\" = \\\n    'ae1a6ac26861e2398645258447f71861f37ec3d93b8a9b0352bd873b349db627'\n  test \"$(sha256sum apps/web/lib/bbcode.ts | cut -d' ' -f1)\" = \\\n    '559c84b21e73bd2d293585f7d635e24b16579273c3063ceb8b28bdcb280f300d'\n  grep -Fq \"@Controller('communities/:communitySlug/publications')\" \\\n    apps/api/src/publications/publications.controller.ts\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\nfi\n\ntest -z \"$(git status --porcelain)\""
    - name: Apply Editor Controls V15.10
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      env:
        EDITOR_B64: 
        FORM_B64: 
        BBCODE_B64: 
        CSS_B64: 
        API_PATCH_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$EDITOR_B64\" | base64 -d \\\n  > apps/web/components/bbcode-editor.tsx\nprintf '%s' \"$FORM_B64\" | base64 -d \\\n  > apps/web/app/create/publication-form.tsx\nprintf '%s' \"$BBCODE_B64\" | base64 -d \\\n  > apps/web/lib/bbcode.ts\nprintf '\\n%s\\n' \"$(printf '%s' \"$CSS_B64\" | base64 -d)\" \\\n  >> apps/web/app/globals.css\nprintf '%s' \"$API_PATCH_B64\" | base64 -d \\\n  > /tmp/forrum-v15-10-api-patch.py\npython /tmp/forrum-v15-10-api-patch.py\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/editor-controls-v15-10-check.mjs\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_EDITOR_CONTROLS_V15_10.md"
    - name: Verify V15.10 contracts and protected scope
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/editor-controls-v15-10-check.mjs\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/category-page-stage-1-v14-check.mjs\nnode scripts/section-page-header-v14-3-check.mjs\nnode scripts/section-page-layout-v14-7-check.mjs\nnode scripts/section-page-polish-v14-8-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\n\ngit diff --check\n\nallowed='^(apps/web/app/create/publication-form\\.tsx|apps/web/components/bbcode-editor\\.tsx|apps/web/lib/bbcode\\.ts|apps/web/app/globals\\.css|apps/api/src/publications/publications\\.controller\\.ts|apps/api/src/publications/publications\\.service\\.ts|scripts/editor-controls-v15-10-check\\.mjs|docs/FORRUM_EDITOR_CONTROLS_V15_10\\.md)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\nif [ -n \"$unexpected\" ]; then\n  echo 'Unexpected files changed:'\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff -- \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\" \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\" \\\n  apps/web/components/topic-category-tree.tsx \\\n  apps/web/components/bbcode-content.tsx \\\n  apps/web/components/main-nav.tsx \\\n  apps/web/components/site-header.tsx \\\n  apps/web/components/site-footer.tsx \\\n  apps/web/components/home-dashboard.tsx \\\n  apps/web/app/page.tsx \\\n  apps/api/prisma | grep -q .; then\n  echo 'V15.10 changed protected topic/category/header/home/schema scope.'\n  exit 1\nfi"
    - name: Create isolated verified V15.10 commit
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit config user.name \"FORRUM QA updater\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add -- \\\n  apps/web/components/bbcode-editor.tsx \\\n  apps/web/app/create/publication-form.tsx \\\n  apps/web/lib/bbcode.ts \\\n  apps/web/app/globals.css \\\n  apps/api/src/publications/publications.controller.ts \\\n  apps/api/src/publications/publications.service.ts \\\n  scripts/editor-controls-v15-10-check.mjs \\\n  docs/FORRUM_EDITOR_CONTROLS_V15_10.md\ngit commit -m \"Polish editor controls V15.10\"\ntest -z \"$(git status --porcelain)\""
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm install --package-lock=false


        test ! -f package-lock.json'
    - name: Generate validate sync and seed Prisma
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
    - name: Static UX accessibility and regression checks
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y


        node scripts/editor-controls-v15-10-check.mjs

        node scripts/visual-bbcode-editor-v15-9-check.mjs

        node scripts/create-topic-workspace-v15-7-check.mjs

        node scripts/topic-reply-editor-v15-6-check.mjs

        node scripts/topic-post-surface-v15-5-check.mjs

        node scripts/topic-page-frame-v15-4-check.mjs

        node scripts/section-tree-hit-area-v14-12-check.mjs

        node scripts/global-header-v13-4-check.mjs

        node scripts/ui-interaction-check.mjs'
    - name: Typecheck every workspace
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run typecheck
    - name: Run API tests
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm test
    - name: Clean production build
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run build
    - name: Remove generated build noise
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git reset --hard HEAD

        git clean -ffdx


        test -z "$(git status --porcelain)"'
    - name: Push verified Editor Controls V15.10
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
    - name: Verify remote main
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\ngit show origin/main:apps/web/components/bbcode-editor.tsx \\\n  | grep -Fq 'FORRUM_EDITOR_CONTROLS_V15_10'\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_EDITOR_CONTROLS_V15_10'\ngit show origin/main:apps/web/lib/bbcode.ts \\\n  | grep -Fq 'FORRUM_EDITOR_CONTROLS_V15_10'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_EDITOR_CONTROLS_V15_10_START'\ngit show origin/main:apps/api/src/publications/publications.controller.ts \\\n  | grep -Fq 'FORRUM_TAG_STYLE_PRESETS_V15_10'\ngit show origin/main:apps/api/src/publications/publications.service.ts \\\n  | grep -Fq 'FORRUM_TAG_STYLE_PRESETS_V15_10'\nnode scripts/editor-controls-v15-10-check.mjs\necho 'FORRUM Editor Controls V15.10 remote verification passed.' "
    - name: Confirm V15.10 was already valid
      if: steps.baseline.outputs.already_applied == 'true'
      shell: bash
      run: echo 'FORRUM Editor Controls V15.10 was already applied; no files changed.'
