name: FORRUM V44 FINAL — News Block

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-v44-final-news
  cancel-in-progress: false

jobs:
  v44-final-news:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNING FORRUM V44 FINAL — NEWS BLOCK ==="

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx

          grep -Fq 'FORRUM сегодня' \
            apps/web/components/home-dashboard.tsx

          grep -Fq 'const announcements' \
            apps/web/components/home-dashboard.tsx

          grep -Fq 'title="Актуальное"' \
            apps/web/components/home-dashboard.tsx

          grep -Fq "['/services', 'Услуги']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" \
            apps/web/components/main-nav.tsx

          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq -- '--fvt-page:' apps/web/app/globals.css

          echo "V44 Fixed baseline confirmed."

      - name: Write regression check first
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/home-v44-fixed-check.mjs <<'NODE'
          import fs from 'node:fs';

          const component = fs.readFileSync(
            'apps/web/components/home-dashboard.tsx',
            'utf8',
          );
          const css = fs.readFileSync(
            'apps/web/app/globals.css',
            'utf8',
          );
          const nav = fs.readFileSync(
            'apps/web/components/main-nav.tsx',
            'utf8',
          );

          const componentRequired = [
            '// FORRUM_HOME_NEWS_V44_FIXED',
            'title="Новости FORRUM"',
            'href="/news"',
            'announcements.slice(0, 3).map((item) => (',
            'discussed.slice(0, 3).map((item) => (',
            'className="forrum-home-v16__news-list"',
            'className="forrum-home-v16__news-item"',
            'Новости FORRUM пока не опубликованы.',
            '// FORRUM_HOME_CONTENT_VISUALS_V43',
          ];

          for (const marker of componentRequired) {
            if (!component.includes(marker)) {
              throw new Error(`V44 component marker missing: ${marker}`);
            }
          }

          if (component.includes('FORRUM сегодня')) {
            throw new Error('Legacy FORRUM today block still exists.');
          }

          for (const marker of [
            'const totalPublications = communities.reduce(',
            'const recentPublications = communities.reduce(',
            'const totalSubscriptions = communities.reduce(',
          ]) {
            if (component.includes(marker)) {
              throw new Error(`Dead stats calculation remains: ${marker}`);
            }
          }

          const cssRequired = [
            '/* FORRUM_HOME_NEWS_V44_FIXED */',
            '.forrum-home-v16__news-list {',
            '.forrum-home-v16__news-item {',
            '--fvt-page: #14181b;',
            '--fvt-surface: #1a1f22;',
            '--fvt-panel: #1c2125;',
            '--fvt-panel-soft: #171c20;',
            '--fvt-text: #e2e5e7;',
            '"Courier New",',
          ];

          for (const marker of cssRequired) {
            if (!css.includes(marker)) {
              throw new Error(`V44 CSS marker missing: ${marker}`);
            }
          }

          for (const marker of [
            "['/services', 'Услуги']",
            "['/media', 'Медиа']",
            "['/news', 'Новости']",
          ]) {
            if (!nav.includes(marker)) {
              throw new Error(`Protected navigation changed: ${marker}`);
            }
          }

          console.log(
            'V44 Fixed: PASS — news replaces stats, Actual uses live topics, Graphite/wordmark polished.',
          );
          NODE

      - name: TDD RED
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/home-v44-fixed-check.mjs; then
            echo "::error::V44 Fixed unexpectedly passed before implementation."
            exit 1
          fi

          echo "TDD RED confirmed."

      - name: Apply V44 component patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/components/home-dashboard.tsx')
          source = path.read_text(encoding='utf-8')

          marker = '// FORRUM_HOME_NEWS_V44_FIXED'
          if marker in source:
              raise SystemExit('V44 Fixed is already present.')

          # Mark the production change without depending on exact formatting
          # of any particular const declaration.
          export_anchor = 'export function HomeDashboard({'
          if export_anchor not in source:
              raise SystemExit('Could not locate HomeDashboard export.')

          source = source.replace(
              export_anchor,
              marker + '\n' + export_anchor,
              1,
          )

          # Remove stats calculations that become dead once the stats panel
          # is replaced. Match by variable identity, not line formatting.
          for name in (
              'totalPublications',
              'recentPublications',
              'totalSubscriptions',
          ):
              pattern = re.compile(
                  rf'\n\s*const {name}\s*=\s*communities\.reduce\('
                  rf'[\s\S]*?\n\s*\);\n'
              )
              source, count = pattern.subn('\n', source, count=1)
              if count != 1:
                  raise SystemExit(
                      f'Could not remove legacy stat calculation: {name}'
                  )

          # "Актуальное" should stop duplicating official announcements.
          # It uses the existing real discussed-topic feed; the existing
          # active-poll card remains beneath it.
          actual_start = source.find('title="Актуальное"')
          weekly_start = source.find('<h2>Участники недели</h2>')
          if actual_start < 0 or weekly_start < 0 or weekly_start <= actual_start:
              raise SystemExit('Could not locate Actual/Weekly boundaries.')

          actual = source[actual_start:weekly_start]

          map_pattern = re.compile(
              r'(?:announcements|actualItems|officialNews)'
              r'\.map\(\(item\) => \('
          )
          actual, map_count = map_pattern.subn(
              'discussed.slice(0, 3).map((item) => (',
              actual,
              count=1,
          )
          if map_count != 1:
              raise SystemExit(
                  'Could not locate the content map inside Actual.'
              )

          actual = re.sub(
              r'!(?:announcements|actualItems|officialNews)\.length',
              '!discussed.length',
              actual,
              count=1,
          )

          source = (
              source[:actual_start]
              + actual
              + source[weekly_start:]
          )

          # Replace the old stats panel with real FORRUM announcements.
          stats_pattern = re.compile(
              r'\s*<section className="forrum-home-v16__panel">\s*'
              r'<header className="forrum-home-v16__panel-head">\s*'
              r'<h2>FORRUM сегодня</h2>\s*'
              r'</header>\s*'
              r'<dl className="forrum-home-v16__stats">'
              r'[\s\S]*?'
              r'</dl>\s*'
              r'</section>'
          )

          news_panel = (
              '\n        <HomePanel\n'
              '          title="Новости FORRUM"\n'
              '          href="/news"\n'
              '        >\n'
              '          <div className="forrum-home-v16__news-list">\n'
              '            {announcements.length ? (\n'
              '              announcements.slice(0, 3).map((item) => (\n'
              '                <Link\n'
              '                  className="forrum-home-v16__news-item"\n'
              '                  href={`/p/${item.slug}`}\n'
              '                  key={item.id}\n'
              '                >\n'
              '                  <CommunityMark\n'
              '                    className="forrum-home-v16__news-mark"\n'
              '                    name={item.community.name}\n'
              '                    url={topicContentVisual(item)}\n'
              '                    size={30}\n'
              '                  />\n'
              '                  <span className="forrum-home-v16__news-copy">\n'
              "                    <strong>{item.title || 'Новость FORRUM'}</strong>\n"
              '                    <small>{relativeTime(item.createdAt)}</small>\n'
              '                  </span>\n'
              '                </Link>\n'
              '              ))\n'
              '            ) : (\n'
              '              <p className="forrum-home-v16__empty">\n'
              '                Новости FORRUM пока не опубликованы.\n'
              '              </p>\n'
              '            )}\n'
              '          </div>\n'
              '        </HomePanel>'
          )

          source, stats_count = stats_pattern.subn(
              news_panel,
              source,
              count=1,
          )
          if stats_count != 1:
              raise SystemExit(
                  'Could not replace the FORRUM today panel.'
              )

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in source.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('V44 component patch applied.')
          PY

          git diff --check

      - name: Apply V44 CSS patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/app/globals.css')
          css = path.read_text(encoding='utf-8')

          marker = '/* FORRUM_HOME_NEWS_V44_FIXED */'
          if marker in css:
              raise SystemExit('V44 Fixed CSS is already present.')

          # Refine the effective final visual-theme tokens, not an obsolete
          # earlier --fh-* layer.
          token_values = {
              '--fvt-page': '#14181b',
              '--fvt-surface': '#1a1f22',
              '--fvt-panel': '#1c2125',
              '--fvt-panel-soft': '#171c20',
              '--fvt-line': '#394147',
              '--fvt-line-strong': '#5d666d',
              '--fvt-text': '#e2e5e7',
              '--fvt-muted': '#a6adb2',
              '--fvt-faint': '#858d93',
          }

          dark_start = css.find('html.dark,', css.find('FORRUM_VISUAL_THEME'))
          if dark_start < 0:
              raise SystemExit('Could not locate final Graphite token block.')

          dark_end = css.find('\n}', dark_start)
          if dark_end < 0:
              raise SystemExit('Could not locate Graphite token block end.')

          block = css[dark_start:dark_end + 2]

          for token, value in token_values.items():
              token_re = re.compile(
                  rf'({re.escape(token)}:\s*)#[0-9a-fA-F]{{6}};'
              )
              block, count = token_re.subn(
                  rf'\g<1>{value};',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f'Could not update final theme token: {token}'
                  )

          css = css[:dark_start] + block + css[dark_end + 2:]

          # Insert news styling beside the canonical Actual/Tabs styles,
          # not as a giant versioned override layer at EOF.
          actual_start = css.find('.forrum-home-v16__actual {')
          tabs_start = css.find(
              '.forrum-home-v16__tabs {',
              actual_start,
          )
          if actual_start < 0 or tabs_start < 0:
              raise SystemExit('Could not locate canonical Actual/Tabs CSS.')

          news_css = (
              marker + '\n'
              '.forrum-home-v16__news-list {\n'
              '  padding: 0 14px;\n'
              '}\n\n'
              '.forrum-home-v16__news-item {\n'
              '  min-height: 58px;\n'
              '  display: grid;\n'
              '  grid-template-columns: 30px minmax(0, 1fr);\n'
              '  gap: 8px;\n'
              '  align-items: center;\n'
              '  border-bottom: 1px solid var(--fvt-line);\n'
              '}\n\n'
              '.forrum-home-v16__news-item:last-child {\n'
              '  border-bottom: 0;\n'
              '}\n\n'
              '.forrum-home-v16__news-item:hover strong,\n'
              '.forrum-home-v16__news-item:focus-visible strong {\n'
              '  color: var(--fvt-accent);\n'
              '}\n\n'
              '.forrum-home-v16__news-mark {\n'
              '  image-rendering: pixelated;\n'
              '  border-radius: 2px;\n'
              '}\n\n'
              '.forrum-home-v16__news-copy {\n'
              '  min-width: 0;\n'
              '  display: grid;\n'
              '  gap: 2px;\n'
              '}\n\n'
              '.forrum-home-v16__news-copy strong {\n'
              '  overflow: hidden;\n'
              '  text-overflow: ellipsis;\n'
              '  color: var(--fvt-text);\n'
              '  font-size: 12px;\n'
              '  font-weight: 640;\n'
              '  line-height: 1.25;\n'
              '}\n\n'
              '.forrum-home-v16__news-copy small {\n'
              '  color: var(--fvt-muted);\n'
              '  font-size: 10px;\n'
              '}\n\n'
          )

          css = css[:tabs_start] + news_css + css[tabs_start:]

          # Polish only the existing canonical wordmark selector.
          selector = (
              '[data-forrum-shell="header"] > * > '
              'a[href="/"]:first-child {'
          )
          brand_start = css.find(selector)
          if brand_start < 0:
              raise SystemExit('Could not locate canonical wordmark rule.')

          brand_end = css.find('\n}', brand_start)
          if brand_end < 0:
              raise SystemExit('Could not locate wordmark rule end.')

          brand = css[brand_start:brand_end + 2]

          font_re = re.compile(
              r'font-family:\s*[\s\S]*?monospace;'
          )
          brand, font_count = font_re.subn(
              'font-family:\n'
              '    "Courier New",\n'
              '    ui-monospace,\n'
              '    "SFMono-Regular",\n'
              '    Consolas,\n'
              '    monospace;',
              brand,
              count=1,
          )
          if font_count != 1:
              raise SystemExit('Could not update wordmark font stack.')

          brand, spacing_count = re.subn(
              r'letter-spacing:\s*[^;]+;',
              'letter-spacing: 0.06em;',
              brand,
              count=1,
          )
          if spacing_count != 1:
              raise SystemExit('Could not update wordmark spacing.')

          css = css[:brand_start] + brand + css[brand_end + 2:]

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in css.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('V44 CSS patch applied.')
          PY

          git diff --check

      - name: TDD GREEN
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v44-fixed-check.mjs

          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '1580px' apps/web/app/globals.css

          echo "TDD GREEN confirmed."

      - name: Audit protected product scope
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          expected="$(
            printf '%s\n' \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-v44-fixed-check.mjs |
            sort
          )"

          echo "Detected V44 Fixed paths:"
          printf '%s\n' "$changed"

          test "$changed" = "$expected"

          test -z "$(
            git diff --name-only -- \
              apps/api \
              packages/contracts \
              apps/web/app/page.tsx \
              apps/web/components/main-nav.tsx
          )"

          grep -Fq "['/services', 'Услуги']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" \
            apps/web/components/main-nav.tsx

          ! git diff | grep -Eq \
            'fakePoll|fakeUser|mockPoll|mockUser|demoPoll|demoUser'

          echo "V44 Fixed protected scope: PASS"

      - name: Stage only verified V44 intent
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-v44-fixed-check.mjs

          git diff --cached --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Validate and regenerate Prisma
        shell: bash
        env:
          DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
        run: |
          set -euo pipefail

          npm run db:validate
          npm run db:generate

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v44-fixed-check.mjs
          node scripts/home-content-visual-v43-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Relevant tests
        shell: bash
        run: |
          set -euo pipefail

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apps/web/.next
          npm run build

      - name: Production self-review
        shell: bash
        run: |
          set -euo pipefail

          # 1. Right rail must not duplicate the same announcements.
          grep -Fq \
            'discussed.slice(0, 3).map((item) => (' \
            apps/web/components/home-dashboard.tsx
          grep -Fq \
            'announcements.slice(0, 3).map((item) => (' \
            apps/web/components/home-dashboard.tsx

          # 2. Old stats must be removed, not hidden.
          ! grep -Fq 'FORRUM сегодня' \
            apps/web/components/home-dashboard.tsx
          ! grep -Fq \
            'const totalPublications = communities.reduce(' \
            apps/web/components/home-dashboard.tsx

          # 3. Geometry/navigation/V43 remain intact.
          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx

          node scripts/home-v44-fixed-check.mjs
          node scripts/home-content-visual-v43-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck
          npm run build

          echo "V44 Fixed production self-review: PASS"

      - name: Restore generated build noise
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- .
          git clean -ffdx

          git diff --cached --check

          changed="$(
            git diff --cached --name-only |
            sort
          )"

          expected="$(
            printf '%s\n' \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-v44-fixed-check.mjs |
            sort
          )"

          echo "Final staged V44 Fixed paths:"
          printf '%s\n' "$changed"

          test "$changed" = "$expected"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          echo "V44 Fixed cleanup: PASS"

      - name: Commit verified V44
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "Replace home stats with FORRUM news V44"

          test -z "$(git status --porcelain)"

      - name: Publish only against unchanged main
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during V44 verification. Rerun V44 Fixed."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify remote V44
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx \
            | grep -Fq '// FORRUM_HOME_NEWS_V44_FIXED'

          echo "Published FORRUM Home V44 Fixed."
