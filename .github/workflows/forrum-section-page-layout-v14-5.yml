name: FORRUM Section Page Layout V14.5
run-name: FORRUM Section Page Layout V14.5
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-section-page-layout-v14-5
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  section-page-layout-v14-5:
    name: Section Page Layout V14.5
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify approved V14.3 baseline
      shell: bash
      run: 'set -euo pipefail


        test -f "apps/web/app/communities/[slug]/category-page.tsx"

        test -f scripts/category-page-stage-1-v14-check.mjs

        test -f scripts/section-page-header-v14-3-check.mjs


        grep -Fq "FORRUM_CATEGORY_PAGE_STAGE_1_V14"             "apps/web/app/communities/[slug]/category-page.tsx"

        grep -Fq "FORRUM_SECTION_PAGE_HEADER_V14_3"             "apps/web/app/communities/[slug]/category-page.tsx"

        grep -Fq ''className="section-breadcrumbs"''             "apps/web/app/communities/[slug]/category-page.tsx"

        grep -Fq ''className="section-identity"''             "apps/web/app/communities/[slug]/category-page.tsx"

        grep -Fq ''className="child-community-strip"''             "apps/web/app/communities/[slug]/category-page.tsx"

        grep -Fq ''className="dashboard-sidebar"''             "apps/web/app/communities/[slug]/category-page.tsx"


        grep -Fq "FORRUM_GLOBAL_HEADER_V13_4"             apps/web/components/main-nav.tsx


        test -z "$(git status --porcelain)"

        '
    - name: Apply Section Page Layout V14.5
      shell: bash
      env:
        PAGE_B64: 
        CSS_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: 'set -euo pipefail


        printf ''%s'' "$PAGE_B64" | base64 -d             > "apps/web/app/communities/[slug]/category-page.tsx"


        printf ''\n%s\n'' "$(printf ''%s'' "$CSS_B64" | base64 -d)"             >> apps/web/app/globals.css


        printf ''%s'' "$CHECK_B64" | base64 -d             > scripts/section-page-layout-v14-5-check.mjs


        printf ''%s'' "$DOC_B64" | base64 -d             > docs/FORRUM_SECTION_PAGE_LAYOUT_V14_5.md

        '
    - name: Verify V14.5 source and protected scope
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/category-page-stage-1-v14-check.mjs\nnode scripts/section-page-header-v14-3-check.mjs\nnode scripts/section-page-layout-v14-5-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\nnode scripts/communities-redesign-stage-a-check.mjs\nnode scripts/communities-redesign-stage-b-check.mjs\nnode scripts/communities-redesign-stage-c-check.mjs\nnode scripts/communities-redesign-stage-d-check.mjs\nnode scripts/communities-redesign-stage-e-check.mjs\nnode scripts/communities-redesign-stage-f-check.mjs\nnode scripts/communities-redesign-stage-f2-check.mjs\nnode scripts/communities-redesign-stage-f3-check.mjs\nnode scripts/communities-redesign-stage-f4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\n\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\n\ngit diff --check\n\nallowed='^(apps/web/app/communities/\\[slug\\]/category-page\\.tsx|apps/web/app/globals\\.css|scripts/section-page-layout-v14-4-check\\.mjs|docs/FORRUM_SECTION_PAGE_LAYOUT_V14_5\\.md)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\nif [ -n \"$unexpected\" ]; then\n  echo \"Unexpected files changed:\"\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff --             apps/web/components/main-nav.tsx             apps/web/components/site-header.tsx             apps/web/components/site-footer.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/communities/communities-client.tsx             apps/web/app/page.tsx             apps/api/src             apps/api/prisma | grep -q .; then\n  echo \"V14.5 changed protected catalogue/home/header/backend scope.\"\n  exit 1\nfi\n"
    - name: Create isolated verified V14.5 commit
      shell: bash
      run: 'set -euo pipefail


        git config user.name "FORRUM QA updater"

        git config user.email "actions@users.noreply.github.com"


        git add --             "apps/web/app/communities/[slug]/category-page.tsx"             apps/web/app/globals.css             scripts/section-page-layout-v14-5-check.mjs             docs/FORRUM_SECTION_PAGE_LAYOUT_V14_5.md


        git commit -m "Build approved section page layout V14.5"

        test -z "$(git status --porcelain)"

        '
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install dependencies without creating lock file
      shell: bash
      run: 'set -euo pipefail

        npm install --package-lock=false

        test ! -f package-lock.json

        '
    - name: Generate validate sync and seed Prisma
      shell: bash
      run: 'set -euo pipefail

        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed

        '
    - name: Static UX accessibility and V14.5 checks
      shell: bash
      run: 'set -euo pipefail


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y


        node scripts/category-page-stage-1-v14-check.mjs

        node scripts/section-page-header-v14-3-check.mjs

        node scripts/section-page-layout-v14-5-check.mjs

        node scripts/global-header-v13-4-check.mjs

        node scripts/ui-interaction-check.mjs

        '
    - name: Typecheck every workspace
      run: npm run typecheck
    - name: Run API tests
      run: npm test
    - name: Clean production build
      run: npm run build
    - name: Remove generated build noise
      shell: bash
      run: 'set -euo pipefail

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"

        '
    - name: Push verified Section Page Layout V14.5
      shell: bash
      run: 'set -euo pipefail

        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main

        '
    - name: Verify remote main
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"


        page="$(git show ''origin/main:apps/web/app/communities/[slug]/category-page.tsx'')"

        css="$(git show origin/main:apps/web/app/globals.css)"


        [[ "$page" == *''FORRUM_SECTION_PAGE_LAYOUT_V14_5''* ]]

        [[ "$page" == *''className="section-category-tree"''* ]]

        [[ "$page" == *''className="section-topic-table"''* ]]

        [[ "$page" == *''Без ответа''* ]]

        [[ "$page" != *''<PublicationCard''* ]]

        [[ "$page" != *''className="dashboard-sidebar"''* ]]

        [[ "$page" != *''Популярные хэштеги''* ]]


        [[ "$css" == *''FORRUM_SECTION_PAGE_LAYOUT_V14_5''* ]]

        [[ "$css" == *''body:has(.section-page-v14-4)''* ]]


        git show origin/main:apps/web/components/main-nav.tsx             | grep -Fq "FORRUM_GLOBAL_HEADER_V13_4"


        node scripts/section-page-layout-v14-5-check.mjs


        echo "FORRUM Section Page Layout V14.5 remote verification passed."

        '
