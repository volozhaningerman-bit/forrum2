name: Главная — 18
run-name: Главная — 18

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-18
  cancel-in-progress: false

jobs:
  home-18:
    name: Главная — 18
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 01. Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 02. Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 03. Проверка базы и backup
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f package.json

          grep -Fq 'function DiscussedTopic' apps/web/components/home-dashboard.tsx
          grep -Fq 'className="forrum-home-v16__tree-row"' apps/web/components/home-dashboard.tsx
          grep -Fq 'className="forrum-home-v16__weekly-row"' apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Новости 4RRUM"' apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Старт 4RRUM"' apps/web/components/home-dashboard.tsx

          backup_dir="${RUNNER_TEMP}/forrum-home-18-backup"
          mkdir -p "$backup_dir/apps/web/components" "$backup_dir/apps/web/app"
          cp apps/web/components/home-dashboard.tsx "$backup_dir/apps/web/components/home-dashboard.tsx"
          cp apps/web/app/globals.css "$backup_dir/apps/web/app/globals.css"
          sha256sum             "$backup_dir/apps/web/components/home-dashboard.tsx"             "$backup_dir/apps/web/app/globals.css"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 04. Применить HOME UI 18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          home_path = Path('apps/web/components/home-dashboard.tsx')
          css_path = Path('apps/web/app/globals.css')
          home = home_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          if 'forrum-home-v18__system-nav' in home or 'forrum-home-v18__system-nav' in css:
              raise SystemExit('HOME UI 18 уже применён либо применён частично.')

          def decode(value: str) -> str:
              return b64decode(value).decode('utf-8')

          replacements = [
              ("Название системного сообщества", "cmV0dXJuIG5hbWUgPT09ICdGT1JSVU0gU3RhcnQnID8gJ9Ch0YLQsNGA0YIgNFJSVU0nIDogbmFtZTs=", "cmV0dXJuIG5hbWUgPT09ICdGT1JSVU0gU3RhcnQnID8gJ9CeIEZPUlJVTScgOiBuYW1lOw=="),
              ("Подписчики корневых сообществ", "ICAgICAgICAgIDxzcGFuIGNsYXNzTmFtZT0iZm9ycnVtLWhvbWUtdjE2X190cmVlLW5hbWUiPgogICAgICAgICAgICB7Y29tbXVuaXR5RGlzcGxheU5hbWUobm9kZS5uYW1lKX0KICAgICAgICAgIDwvc3Bhbj4=", ""),
              ("Системная навигация", "ICAgICAgICA8TGluayBjbGFzc05hbWU9ImZvcnJ1bS1ob21lLXYxNl9fcHJvcG9zYWwiIGhyZWY9Ii9jb21tdW5pdGllcy9wcm9wb3NhbHMiPgogICAgICAgICAgPHNwYW4gYXJpYS1oaWRkZW49InRydWUiPuKKnjwvc3Bhbj4g0J/RgNC10LTQu9C+0LbQuNGC0Ywg0YHQvtC+0LHRidC10YHRgtCy0L4KICAgICAgICA8L0xpbms+", ""),
              ("Строка обсуждаемой темы", "", ""),
              ("Последнее сообщение новой темы", "ICAgICAgPHNwYW4gY2xhc3NOYW1lPSJmb3JydW0taG9tZS12MTZfX25ldy10b3BpYy1sYXN0Ij4KICAgICAgICAgIEB7aXRlbS5hdXRob3IudXNlcm5hbWV9IMK3IHtyZWxhdGl2ZVRpbWUoaXRlbS5sYXN0QWN0aXZpdHlBdCB8fCBpdGVtLmNyZWF0ZWRBdCl9CiAgICAgICAgPC9zcGFuPg==", "ICAgICAgPHNwYW4gY2xhc3NOYW1lPSJmb3JydW0taG9tZS12MTZfX25ldy10b3BpYy1sYXN0IGZvcnJ1bS1ob21lLXYxOF9fbmV3LXRvcGljLWxhc3QiPgogICAgICAgIDxzdHJvbmc+QHtyZXBseS51c2VybmFtZX08L3N0cm9uZz4KICAgICAgICA8c21hbGw+e3JlbGF0aXZlVGltZShyZXBseS5jcmVhdGVkQXQpfTwvc21hbGw+CiAgICAgIDwvc3Bhbj4="),
              ("Шапка обсуждаемых тем", "ICAgICAgICAgICAgPHNwYW4+0J7RgtCy0LXRgtGLPC9zcGFuPgogICAgICAgICAgICA8c3Bhbj7Qn9GA0L7RgdC80L7RgtGA0Ys8L3NwYW4+CiAgICAgICAgICAgIDxzcGFuPtCQ0LrRgtC40LLQvdC+0YHRgtGMPC9zcGFuPg==", "ICAgICAgICAgICAgPHNwYW4+0J7RgtCy0LXRgtGLPC9zcGFuPgogICAgICAgICAgICA8c3Bhbj7Qn9GA0L7RgdC80L7RgtGA0Ys8L3NwYW4+CiAgICAgICAgICAgIDxzcGFuPtCf0L7RgdC70LXQtNC90LXQtTwvc3Bhbj4="),
              ("Расчёт инициалов рейтинга", "", ""),
              ("Аватар участника недели", "", ""),
              ("Подпись результата участника недели", "ICAgICAgICAgICAgICAgICAgICAgID4KICAgICAgICAgICAgICAgICAgICAgICAge3Njb3JlfQogICAgICAgICAgICAgICAgICAgICAgPC9zcGFuPg==", "ICAgICAgICAgICAgICAgICAgICAgID4KICAgICAgICAgICAgICAgICAgICAgICAgPHN0cm9uZz57c2NvcmV9PC9zdHJvbmc+CiAgICAgICAgICAgICAgICAgICAgICAgIDxzbWFsbD57d2Vla2x5TW9kZSA9PT0gJ2xpa2VzJyA/ICfRgdC40LzQv9Cw0YLQuNC5JyA6ICfQsdCw0LvQu9C+0LInfTwvc21hbGw+CiAgICAgICAgICAgICAgICAgICAgICA8L3NwYW4+"),
              ("Новости проекта и блок О FORRUM", "", ""),
          ]

          for label, old_encoded, new_encoded in replacements:
              old = decode(old_encoded)
              new = decode(new_encoded)
              count = home.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: ожидалось одно точное совпадение, найдено {count}.'
                  )
              home = home.replace(old, new, 1)

          css_addition = decode("")
          home = '\n'.join(line.rstrip(' \t') for line in home.splitlines()).rstrip() + '\n'
          css = '\n'.join(line.rstrip(' \t') for line in css.splitlines()).rstrip()
          css = css + '\n' + css_addition.strip('\n') + '\n'

          home_path.write_text(home, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

          git diff --check

      - name: 05. Проверить изменения V18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          home = Path('apps/web/components/home-dashboard.tsx').read_text(encoding='utf-8')
          css = Path('apps/web/app/globals.css').read_text(encoding='utf-8')

          home_required = [
              'forrum-home-v18__system-nav',
              'forrum-home-v18__tree-subscribers',
              'forrum-home-v18__discussed',
              'forrum-home-v18__topic-type',
              'forrum-home-v18__last-message',
              'forrum-home-v18__new-topic-last',
              'title="Новости FORRUM"',
              'title="О FORRUM"',
              'Первый Розыск FORRUM',
              'Как развивается FORRUM',
              'href="/media"',
              'href="/services"',
              'href="/welcome"',
              '<span>Последнее</span>',
          ]
          css_required = [
              '.forrum-home-v18__system-nav',
              '.forrum-home-v18__tree-subscribers',
              '.forrum-home-v18__discussed',
              '.forrum-home-v18__topic-type',
              '.forrum-home-v18__last-message',
              '.forrum-home-v18__new-topic-last',
              '.forrum-home-v18__project-news',
          ]

          for value in home_required:
              if value not in home:
                  raise SystemExit(f'Не найден результат V18 в TSX: {value}')
          for value in css_required:
              if value not in css:
                  raise SystemExit(f'Не найден стиль V18: {value}')

          forbidden_ui = [
              'title="Новости 4RRUM"',
              'title="Старт 4RRUM"',
              "'Новость 4RRUM'",
              'Новости 4RRUM пока не опубликованы.',
              '<span>Активность</span>',
          ]
          for value in forbidden_ui:
              if value in home:
                  raise SystemExit(f'Остался старый интерфейс: {value}')

          if home.count('forrum-home-v18__system-nav') != 1:
              raise SystemExit('Системная навигация V18 добавлена не один раз.')
          if home.count('function DiscussedTopic') != 1:
              raise SystemExit('DiscussedTopic должен существовать ровно один раз.')
          PY

          changed="$(git diff --name-only | sort -u)"
          expected="$(printf '%s\n'             apps/web/app/globals.css             apps/web/components/home-dashboard.tsx | sort -u)"

          printf 'Изменённые файлы:\n%s\n' "$changed"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- apps/api packages/contracts)"
          git diff --check

      - name: 06. Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: 07. Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: 08. Build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build

      - name: 09. Stage и аудит
        shell: bash
        run: |
          set -euo pipefail

          git add --             apps/web/app/globals.css             apps/web/components/home-dashboard.tsx

          git diff --cached --check
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$(printf '%s\n'             apps/web/app/globals.css             apps/web/components/home-dashboard.tsx | sort -u)"

          printf 'Подготовлено к commit:\n%s\n' "$staged"
          test "$staged" = "$expected"

          git diff --cached --stat
          git diff --cached --             apps/web/components/home-dashboard.tsx | sed -n '1,260p'

      - name: 10. Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Implement FORRUM Home UI 18"

      - name: 11. Push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main изменился во время проверки. Запустите workflow ещё раз."
            exit 1
          fi

          git push origin HEAD:main

      - name: 12. Проверить публикацию commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'forrum-home-v18__system-nav'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'Первый Розыск FORRUM'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'title="О FORRUM"'
          git show origin/main:apps/web/app/globals.css |
            grep -Fq '.forrum-home-v18__discussed'

          echo "Главная — 18: применена, проверена и отправлена в main."

