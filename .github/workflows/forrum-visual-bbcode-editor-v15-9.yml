name: FORRUM Visual BBCode Editor V15.9
run-name: FORRUM Visual BBCode Editor V15.9
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-visual-bbcode-editor-v15-9
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  visual-bbcode-editor-v15-9:
    name: Visual BBCode Editor V15.9
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.8 and detect V15.9
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_EDITOR_V15_8' \\\n  apps/web/components/bbcode-editor.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_EDITOR_V15_8' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_EDITOR_V15_8_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_EDITOR_V15_8_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\nnode scripts/create-topic-editor-v15-8-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\neditor_count=\"$(grep -Fxc '// FORRUM_VISUAL_BBCODE_EDITOR_V15_9' \\\n  apps/web/components/bbcode-editor.tsx || true)\"\nform_count=\"$(grep -Fxc '// FORRUM_VISUAL_BBCODE_EDITOR_V15_9' \\\n  apps/web/app/create/publication-form.tsx || true)\"\ncss_start_count=\"$(grep -Fxc '/* FORRUM_VISUAL_BBCODE_EDITOR_V15_9_START */' \\\n  apps/web/app/globals.css || true)\"\ncss_end_count=\"$(grep -Fxc '/* FORRUM_VISUAL_BBCODE_EDITOR_V15_9_END */' \\\n  apps/web/app/globals.css || true)\"\n\ncount_optional_file() {\n  local pattern=\"$1\"\n  local path=\"$2\"\n  if [ ! -f \"$path\" ]; then\n    printf '0\\n'\n    return\n  fi\n  grep -Fc \"$pattern\" \"$path\" || true\n}\n\ncheck_count=\"$(count_optional_file \\\n  'Visual BBCode Editor V15.9 passed:' \\\n  scripts/visual-bbcode-editor-v15-9-check.mjs)\"\ndoc_count=\"$(count_optional_file \\\n  '# FORRUM Visual BBCode Editor V15.9' \\\n  docs/FORRUM_VISUAL_BBCODE_EDITOR_V15_9.md)\"\n\nfor count in \"$editor_count\" \"$form_count\" \"$css_start_count\" \\\n  \"$css_end_count\" \"$check_count\" \"$doc_count\"; do\n  test \"$count\" -le 1\ndone\n\nif [ \"$editor_count\" -ne \"$form_count\" ] || \\\n   [ \"$editor_count\" -ne \"$css_start_count\" ] || \\\n   [ \"$editor_count\" -ne \"$css_end_count\" ] || \\\n   [ \"$editor_count\" -ne \"$check_count\" ] || \\\n   [ \"$editor_count\" -ne \"$doc_count\" ]; then\n  echo 'Partial V15.9 marker state detected.'\n  exit 1\nfi\n\nif [ \"$editor_count\" -eq 1 ]; then\n  node scripts/visual-bbcode-editor-v15-9-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Visual BBCode Editor V15.9 is already applied and valid.'\nelse\n  test \"$(sha256sum apps/web/components/bbcode-editor.tsx | cut -d' ' -f1)\" = \\\n    '7111130a0468595bce52ebec858ce2824f5d64f95979725d39211748cb73ed3b'\n  test \"$(sha256sum apps/web/app/create/publication-form.tsx | cut -d' ' -f1)\" = \\\n    '6f2527790a5ccd2787dd5e55cc11b3bbdd82492258c8b6c4c1d8ff8466e13aaf'\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\nfi\n\ntest -z \"$(git status --porcelain)\""
    - name: Apply Visual BBCode Editor V15.9
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      env:
        EDITOR_B64: 
        FORM_B64: 
        CSS_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$EDITOR_B64\" | base64 -d \\\n  > apps/web/components/bbcode-editor.tsx\nprintf '%s' \"$FORM_B64\" | base64 -d \\\n  > apps/web/app/create/publication-form.tsx\nprintf '\\n%s\\n' \"$(printf '%s' \"$CSS_B64\" | base64 -d)\" \\\n  >> apps/web/app/globals.css\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/visual-bbcode-editor-v15-9-check.mjs\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_VISUAL_BBCODE_EDITOR_V15_9.md"
    - name: Verify V15.9 contracts and protected scope
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/category-page-stage-1-v14-check.mjs\nnode scripts/section-page-header-v14-3-check.mjs\nnode scripts/section-page-layout-v14-7-check.mjs\nnode scripts/section-page-polish-v14-8-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\n\ngit diff --check\n\nallowed='^(apps/web/app/create/publication-form\\.tsx|apps/web/components/bbcode-editor\\.tsx|apps/web/app/globals\\.css|scripts/visual-bbcode-editor-v15-9-check\\.mjs|docs/FORRUM_VISUAL_BBCODE_EDITOR_V15_9\\.md)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\nif [ -n \"$unexpected\" ]; then\n  echo 'Unexpected files changed:'\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff -- \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\" \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\" \\\n  apps/web/components/topic-category-tree.tsx \\\n  apps/web/components/bbcode-content.tsx \\\n  apps/web/lib/bbcode.ts \\\n  apps/web/components/main-nav.tsx \\\n  apps/web/components/site-header.tsx \\\n  apps/web/components/site-footer.tsx \\\n  apps/web/components/home-dashboard.tsx \\\n  apps/web/app/page.tsx \\\n  apps/api/src \\\n  apps/api/prisma | grep -q .; then\n  echo 'V15.9 changed protected topic/section/parser/header/home/backend scope.'\n  exit 1\nfi"
    - name: Create isolated verified V15.9 commit
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git config user.name "FORRUM QA updater"

        git config user.email "actions@users.noreply.github.com"

        git add --   apps/web/components/bbcode-editor.tsx   apps/web/app/create/publication-form.tsx   apps/web/app/globals.css   scripts/visual-bbcode-editor-v15-9-check.mjs   docs/FORRUM_VISUAL_BBCODE_EDITOR_V15_9.md

        git commit -m "Add visual BBCode editor V15.9"

        test -z "$(git status --porcelain)"'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm install --package-lock=false


        test ! -f package-lock.json'
    - name: Generate validate sync and seed Prisma
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
    - name: Static UX accessibility and regression checks
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y


        node scripts/visual-bbcode-editor-v15-9-check.mjs

        node scripts/create-topic-workspace-v15-7-check.mjs

        node scripts/topic-reply-editor-v15-6-check.mjs

        node scripts/topic-post-surface-v15-5-check.mjs

        node scripts/topic-page-frame-v15-4-check.mjs

        node scripts/section-tree-hit-area-v14-12-check.mjs

        node scripts/global-header-v13-4-check.mjs

        node scripts/ui-interaction-check.mjs'
    - name: Typecheck every workspace
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run typecheck
    - name: Run API tests
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm test
    - name: Clean production build
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run build
    - name: Remove generated build noise
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git reset --hard HEAD

        git clean -ffdx


        test -z "$(git status --porcelain)"'
    - name: Push verified Visual BBCode Editor V15.9
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
    - name: Verify remote main
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\ngit show origin/main:apps/web/components/bbcode-editor.tsx \\\n  | grep -Fq 'FORRUM_VISUAL_BBCODE_EDITOR_V15_9'\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_VISUAL_BBCODE_EDITOR_V15_9'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_VISUAL_BBCODE_EDITOR_V15_9_START'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_VISUAL_BBCODE_EDITOR_V15_9_END'\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\necho 'FORRUM Visual BBCode Editor V15.9 remote verification passed.' "
    - name: Confirm V15.9 was already valid
      if: steps.baseline.outputs.already_applied == 'true'
      shell: bash
      run: echo 'FORRUM Visual BBCode Editor V15.9 was already applied; no files changed.'
