name: FORRUM Navigation Architecture V30

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-navigation-architecture-v30
  cancel-in-progress: false

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Inventory product
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          for f in \
            apps/web/components/main-nav.tsx \
            scripts/home-reference-check.mjs \
            apps/web/app/services/page.tsx \
            apps/web/app/media/page.tsx \
            apps/web/app/news/page.tsx
          do
            test -f "$f"
          done
          grep -Fq "api<ActivityItem[]>('/news')" apps/web/components/main-nav.tsx
          grep -Fq "const [newsUnread, setNewsUnread]" apps/web/components/main-nav.tsx

      - name: Apply V30 product navigation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/forrum-navigation-v30.py <<'PY'
          from pathlib import Path
          import re

          nav_path = Path("apps/web/components/main-nav.tsx")
          check_path = Path("scripts/home-reference-check.mjs")
          nav = nav_path.read_text(encoding="utf-8")

          links_re = re.compile(r"const\s+links\s*=\s*\[[\s\S]*?\]\s*as\s+const\s*;")
          if len(list(links_re.finditer(nav))) != 1:
              raise SystemExit("Expected exactly one MainNav links array")

          nav = links_re.sub("""const links = [
            ['/', 'Главная'],
            ['/communities', 'Сообщества'],
            ['/services', 'Услуги'],
            ['/media', 'Медиа'],
            ['/news', 'Новости'],
          ] as const;""", nav, count=1)

          for required in (
              "api<ActivityItem[]>('/news')",
              "const [newsUnread, setNewsUnread]",
          ):
              if required not in nav:
                  raise SystemExit(f"Existing News behavior missing: {required}")

          nav, count = re.subn(
              r"const\s+showDot\s*=\s*(?:String\(\s*href\s*\)|href)\s*===\s*['\"]/news['\"]\s*&&\s*newsUnread\s*;",
              "const showDot = href === '/news' && newsUnread;",
              nav,
              count=1,
          )
          if count != 1 or "String(href)" in nav:
              raise SystemExit("Could not safely normalize News unread comparison")

          nav_path.write_text(nav, encoding="utf-8")

          checker = check_path.read_text(encoding="utf-8")
          start = checker.find("const nav = fs.readFileSync(navPath, 'utf8');")
          end = checker.find("const home = fs.readFileSync(homePath, 'utf8');")
          if start < 0 or end <= start:
              raise SystemExit("Could not isolate navigation validator section")

          nav_check = r'''const nav = fs.readFileSync(navPath, 'utf8');
          const linksMatch = nav.match(/const\s+links\s*=\s*\[([\s\S]*?)\]\s*as\s+const\s*;/);
          if (!linksMatch) throw new Error('MainNav links array missing.');
          const tuples = [...linksMatch[1].matchAll(/\[\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]\s*\]/g)].map((m) => [m[1], m[2]]);
          const expectedNavigation = [
            ['/', 'Главная'],
            ['/communities', 'Сообщества'],
            ['/services', 'Услуги'],
            ['/media', 'Медиа'],
            ['/news', 'Новости'],
          ];
          if (JSON.stringify(tuples) !== JSON.stringify(expectedNavigation)) {
            throw new Error(`MainNav product contract mismatch: ${JSON.stringify(tuples)}`);
          }
          for (const routePage of [
            'apps/web/app/services/page.tsx',
            'apps/web/app/media/page.tsx',
            'apps/web/app/news/page.tsx',
          ]) {
            if (!fs.existsSync(routePage)) throw new Error(`Approved route missing: ${routePage}`);
          }
          if (!nav.includes("api<ActivityItem[]>('/news')")) throw new Error('News polling removed.');
          if (nav.includes('String(href)')) throw new Error('String(href) workaround returned.');

          '''
          check_path.write_text(checker[:start] + nav_check + checker[end:], encoding="utf-8")
          PY
          python3 -m py_compile /tmp/forrum-navigation-v30.py
          python3 /tmp/forrum-navigation-v30.py
          git diff --check
          node scripts/home-reference-check.mjs

      - name: Audit source scope before dependencies
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/web/components/main-nav.tsx scripts/home-reference-check.mjs | sort)"
          test "$changed" = "$expected"
          git diff -- apps/web/components/main-nav.tsx scripts/home-reference-check.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false
          node -e "console.log(require.resolve('typescript'))"

      - name: Production verification
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const p = 'apps/web/components/main-nav.tsx';
          const f = ts.createSourceFile(p, fs.readFileSync(p, 'utf8'), ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
          if (f.parseDiagnostics.length) {
            for (const d of f.parseDiagnostics) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
            process.exit(1);
          }
          console.log('MainNav V30 TSX parser: PASS');
          NODE
          node scripts/static-check.mjs
          node scripts/home-reference-check.mjs
          for checker in scripts/home-paper-graphite-v16-check.mjs scripts/global-shell-v16-1-check.mjs scripts/home-scale-polish-check.mjs scripts/home-visual-theme-check.mjs; do
            [ ! -f "$checker" ] || node "$checker"
          done
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Self-review and second pass
        shell: bash
        run: |
          set -euo pipefail
          before="$(git diff | sha256sum | cut -d' ' -f1)"
          python3 /tmp/forrum-navigation-v30.py
          after="$(git diff | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          grep -Fq "['/services', 'Услуги']" apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" apps/web/components/main-nav.tsx
          ! grep -Fq "String(href)" apps/web/components/main-nav.tsx
          node scripts/home-reference-check.mjs
          npm run validate:static
          npm run typecheck -w @forrum/web

      - name: Clean build artifacts and final audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <(git status --porcelain=v1 --untracked-files=no | sed 's/^...//')
          for path in "${dirty[@]}"; do
            [ -n "$path" ] || continue
            case "$path" in
              apps/web/components/main-nav.tsx|scripts/home-reference-check.mjs) continue ;;
            esac
            git restore --staged --worktree -- "$path"
          done
          git clean -ffdx
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/web/components/main-nav.tsx scripts/home-reference-check.mjs | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all | grep -Ev '^( M|M |MM) (apps/web/components/main-nav\.tsx|scripts/home-reference-check\.mjs)$' || true)"

      - name: Commit verified V30
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"
          git add apps/web/components/main-nav.tsx scripts/home-reference-check.mjs
          git diff --cached --check
          git commit -m "Restore FORRUM product navigation V30"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and re-audit V30
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          npm install --include=dev --no-audit --no-fund --package-lock=false
          node scripts/home-reference-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web
          git restore --source=HEAD --staged --worktree -- .
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Publish V30 safely
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            remote="$(git rev-parse origin/main)"
            if ! git merge-base --is-ancestor "$remote" HEAD; then
              git rebase origin/main
              npm install --include=dev --no-audit --no-fund --package-lock=false
              node scripts/home-reference-check.mjs
              npm run validate:static
              npm run typecheck -w @forrum/web
              rm -rf apps/web/.next
              npm run build -w @forrum/web
              git restore --source=HEAD --staged --worktree -- .
              git clean -ffdx
            fi
            git fetch origin main
            [ "$(git rev-parse origin/main)" = "$(git merge-base HEAD origin/main)" ] || continue
            git push origin HEAD:main && exit 0
          done
          echo "::error::V30 could not be published safely."
          exit 1

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
