name: FORRUM Home Reference V34

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-reference-v34
  cancel-in-progress: false

jobs:
  homepage-v34:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Inventory product before V34
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          for path in \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/main-nav.tsx \
            apps/web/app/page.tsx \
            apps/web/app/globals.css \
            apps/web/lib/types.ts \
            apps/api/src/home/home.service.ts \
            apps/api/src/feed/feed.service.ts \
            apps/api/src/governance/governance.service.ts \
            apps/api/prisma/schema.prisma
          do
            test -f "$path"
          done

          grep -Fq "['/services', 'Услуги']" apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" apps/web/components/main-nav.tsx
          grep -Fq "api<ActivityItem[]>('/news')" apps/web/components/main-nav.tsx

          grep -Fq "async polls(userId?: string)" apps/api/src/governance/governance.service.ts
          grep -Fq "bindingVotes:" apps/api/src/governance/governance.service.ts
          grep -Fq "advisoryVotes:" apps/api/src/governance/governance.service.ts
          grep -Fq "model Session" apps/api/prisma/schema.prisma
          grep -Fq "model PlatformSetting" apps/api/prisma/schema.prisma
          grep -Fq -- "--fvt-panel:" apps/web/app/globals.css
          grep -Fq ".forrum-theme-toggle" apps/web/app/globals.css

          {
            echo "## FORRUM Home Reference V34"
            echo
            echo "V34 changes presentation plus only the backend data required by the approved homepage."
            echo
            echo "| Reference | Existing product source | V34 |"
            echo "|---|---|---|"
            echo "| Community tree | /communities hierarchy | preserve real hierarchy; dense reference tree |"
            echo "| Discussed topics | /feed?mode=popular | real 24h discussed topics + latest reply author |"
            echo "| New topics | /feed?mode=new | dense table + latest reply author |"
            echo "| Active polls | /governance/polls | title, all options, counts/percent, remaining time; click opens polls |"
            echo "| Weekly users | existing users/topics/comments/reactions | real 7-day ranking from backend |"
            echo "| FORRUM today | existing DB entities/sessions | communities/topics/messages/online + persisted online record |"
            echo "| Themes | existing Paper/Graphite tokens | one identical geometry, token-only colors |"
            echo
            echo "Navigation, services/media/news routes and voting mechanics are not redesigned."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write V34 product patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/forrum-home-reference-v34.py <<'PY'
          from pathlib import Path
          import re

          HOME = Path('apps/web/components/home-dashboard.tsx')
          PAGE = Path('apps/web/app/page.tsx')
          CSS = Path('apps/web/app/globals.css')
          TYPES = Path('apps/web/lib/types.ts')
          HOME_SERVICE = Path('apps/api/src/home/home.service.ts')
          FEED_SERVICE = Path('apps/api/src/feed/feed.service.ts')

          for path in (HOME, PAGE, CSS, TYPES, HOME_SERVICE, FEED_SERVICE):
              if not path.exists():
                  raise SystemExit(f'V34 required source missing: {path}')

          HOME_SOURCE = '\'use client\';\n\nimport Link from \'next/link\';\nimport type { CSSProperties, ReactNode } from \'react\';\nimport { useMemo, useState } from \'react\';\nimport { Avatar } from \'@/components/avatar\';\nimport { CommunityMark } from \'@/components/community-mark\';\nimport type { PublicationCardData } from \'@/lib/types\';\n\ntype Community = {\n  id: string;\n  slug: string;\n  name: string;\n  description: string;\n  shortDescription?: string | null;\n  avatarUrl?: string | null;\n  subscriberCount: number;\n  publicationCount: number;\n  recentPublicationCount?: number;\n  lastActivityAt?: string | null;\n  isSubscribed?: boolean;\n  parent: { slug: string; name: string } | null;\n};\n\ntype PollOption = {\n  id: string;\n  label: string;\n  position?: number;\n  bindingVotes: number;\n  advisoryVotes: number;\n};\n\ntype PollItem = {\n  id: string;\n  title: string;\n  closesAt: string;\n  status: string;\n  createdAt?: string;\n  options?: PollOption[];\n  community: { slug: string; name: string; accentColor?: string };\n};\n\ntype WeeklyUser = {\n  username: string;\n  displayName: string;\n  avatarUrl?: string | null;\n  score: number;\n  reactionCount: number;\n  topicCount: number;\n  commentCount: number;\n};\n\ntype HomeOverview = {\n  stats: {\n    communities: number;\n    topics: number;\n    messages: number;\n    usersOnline: number;\n    recordOnline: number;\n    recordOnlineAt?: string | null;\n  };\n  weekly: {\n    likes: WeeklyUser[];\n    activity: WeeklyUser[];\n  };\n};\n\nexport type HomeInitialData = {\n  communities?: Community[];\n  polls?: PollItem[];\n  announcements?: PublicationCardData[];\n  feed?: PublicationCardData[];\n  newFeed?: PublicationCardData[];\n  overview?: HomeOverview;\n};\n\ntype TreeNode = Community & { children: TreeNode[] };\n\nconst topicVisuals: Record<string, string> = {\n  \'forrum-start\': \'/forrum-assets/topic-forrum.svg\',\n  \'forrum-feedback\': \'/forrum-assets/topic-forrum.svg\',\n  \'internet-projects\': \'/forrum-assets/topic-projects.svg\',\n  \'launches-and-teams\': \'/forrum-assets/topic-projects.svg\',\n  promotion: \'/forrum-assets/topic-promotion.svg\',\n  \'seo-and-traffic\': \'/forrum-assets/topic-seo.svg\',\n  \'gta-rp\': \'/forrum-assets/topic-gta.svg\',\n  \'majestic-rp\': \'/forrum-assets/topic-gta.svg\',\n  telegram: \'/forrum-assets/topic-telegram.svg\',\n  \'telegram-bots\': \'/forrum-assets/topic-telegram.svg\',\n};\n\nfunction topicVisual(slug: string) {\n  return topicVisuals[slug] ?? \'/forrum-assets/topic-default.svg\';\n}\n\nconst publicationTypeName: Record<string, string> = {\n  DISCUSSION: \'Обсуждение\',\n  QUESTION: \'Вопрос\',\n  NEWS: \'Новости\',\n  GUIDE: \'Гайд\',\n  PROJECT: \'Проект\',\n  SERVICE: \'Услуга\',\n  CASE: \'Кейс\',\n  ANNOUNCEMENT: \'Объявление\',\n};\n\nfunction formatCount(value: number | undefined) {\n  const safe = Number.isFinite(value) ? Number(value) : 0;\n  return new Intl.NumberFormat(\'ru-RU\', {\n    notation: safe >= 10_000 ? \'compact\' : \'standard\',\n    maximumFractionDigits: 1,\n  }).format(safe);\n}\n\nfunction formatMetric(value: number | undefined) {\n  return Number.isFinite(value) ? formatCount(value) : \'—\';\n}\n\nfunction relativeTime(value?: string | null) {\n  if (!value) return \'\';\n  const time = new Date(value).getTime();\n  if (!Number.isFinite(time)) return \'\';\n  const diff = Math.max(0, Date.now() - time);\n  if (diff < 60_000) return \'только что\';\n  const minutes = Math.floor(diff / 60_000);\n  if (minutes < 60) return `${minutes} мин. назад`;\n  const hours = Math.floor(diff / 3_600_000);\n  if (hours < 24) return `${hours} ч. назад`;\n  const days = Math.floor(diff / 86_400_000);\n  if (days < 14) return `${days} дн. назад`;\n  return new Date(value).toLocaleDateString(\'ru-RU\', { day: \'numeric\', month: \'short\' });\n}\n\nfunction pollTimeLeft(value: string) {\n  const time = new Date(value).getTime();\n  if (!Number.isFinite(time)) return \'\';\n  const diff = time - Date.now();\n  if (diff <= 0) return \'завершено\';\n  const hours = Math.ceil(diff / 3_600_000);\n  if (hours < 24) return `${hours} ч.`;\n  return `${Math.ceil(diff / 86_400_000)} дн.`;\n}\n\nfunction formatRecordDate(value?: string | null) {\n  if (!value) return \'\';\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) return \'\';\n  return date.toLocaleString(\'ru-RU\', {\n    day: \'numeric\',\n    month: \'short\',\n    hour: \'2-digit\',\n    minute: \'2-digit\',\n  });\n}\n\nfunction buildTree(items: Community[]): TreeNode[] {\n  const nodes = new Map<string, TreeNode>();\n  items.forEach((item) => nodes.set(item.slug, { ...item, children: [] }));\n  const roots: TreeNode[] = [];\n  nodes.forEach((node) => {\n    const parent = node.parent?.slug ? nodes.get(node.parent.slug) : undefined;\n    if (parent && parent.slug !== node.slug) parent.children.push(node);\n    else roots.push(node);\n  });\n  const sortNodes = (rows: TreeNode[]) => {\n    rows.sort((a, b) =>\n      (b.subscriberCount ?? 0) - (a.subscriberCount ?? 0) ||\n      a.name.localeCompare(b.name, \'ru\'),\n    );\n    rows.forEach((row) => sortNodes(row.children));\n  };\n  sortNodes(roots);\n  return roots;\n}\n\nfunction topicRows(items: PublicationCardData[] | undefined) {\n  return (items ?? []).filter((item) => item.format === \'TOPIC\').slice(0, 5);\n}\n\nfunction lastReply(item: PublicationCardData) {\n  return {\n    username: item.lastComment?.author.username ?? item.author.username,\n    createdAt: item.lastComment?.createdAt ?? item.lastActivityAt ?? item.createdAt,\n  };\n}\n\nfunction TreeBranch({\n  node,\n  depth,\n  expanded,\n  onToggle,\n}: {\n  node: TreeNode;\n  depth: number;\n  expanded: Set<string>;\n  onToggle: (slug: string) => void;\n}) {\n  const hasChildren = node.children.length > 0;\n  const isOpen = expanded.has(node.slug);\n  return (\n    <li className="forrum-home-v16__tree-node" style={{ \'--tree-depth\': depth } as CSSProperties}>\n      <div className="forrum-home-v16__tree-row">\n        {hasChildren ? (\n          <button\n            className="forrum-home-v16__tree-toggle"\n            type="button"\n            aria-expanded={isOpen}\n            aria-label={isOpen ? `Свернуть ${node.name}` : `Развернуть ${node.name}`}\n            onClick={() => onToggle(node.slug)}\n          >\n            <span aria-hidden="true">{isOpen ? \'⌄\' : \'›\'}</span>\n          </button>\n        ) : (\n          <span className="forrum-home-v16__tree-spacer" aria-hidden="true" />\n        )}\n        <Link className="forrum-home-v16__tree-link" href={`/communities/${node.slug}`}>\n          <span className="forrum-home-v16__tree-folder" aria-hidden="true" />\n          <span className="forrum-home-v16__tree-name">{node.name}</span>\n          <span className="forrum-home-v16__tree-count">{formatCount(node.subscriberCount)}</span>\n        </Link>\n      </div>\n      {hasChildren && isOpen && (\n        <ul className="forrum-home-v16__tree-children">\n          {node.children.map((child) => (\n            <TreeBranch\n              key={child.id}\n              node={child}\n              depth={depth + 1}\n              expanded={expanded}\n              onToggle={onToggle}\n            />\n          ))}\n        </ul>\n      )}\n    </li>\n  );\n}\n\nfunction HomePanel({ title, href, children }: { title: string; href?: string; children: ReactNode }) {\n  return (\n    <section className="forrum-home-v16__panel">\n      <header className="forrum-home-v16__panel-head">\n        <h2>{title}</h2>\n        {href && <Link href={href}>Смотреть все <span aria-hidden="true">→</span></Link>}\n      </header>\n      {children}\n    </section>\n  );\n}\n\nfunction DiscussedTopic({ item }: { item: PublicationCardData }) {\n  const reply = lastReply(item);\n  return (\n    <Link className="forrum-home-v16__discussed" href={`/p/${item.slug}`}>\n      <CommunityMark\n        className="forrum-home-v16__topic-mark"\n        name={item.community.name}\n        url={item.community.avatarUrl ?? topicVisual(item.community.slug)}\n        size={42}\n      />\n      <span className="forrum-home-v16__discussed-copy">\n        <span className="forrum-home-v16__topic-title">\n          <span className={`forrum-home-v16__type type-${item.type.toLowerCase()}`}>\n            {publicationTypeName[item.type] ?? \'Тема\'}\n          </span>\n          <strong>{item.title?.trim() || \'Тема без заголовка\'}</strong>\n        </span>\n        <span className="forrum-home-v16__topic-excerpt">{item.excerpt}</span>\n        <span className="forrum-home-v16__topic-meta">\n          <span>@{item.author.username}</span>\n          <span aria-hidden="true">→</span>\n          <span>{relativeTime(item.createdAt)}</span>\n        </span>\n      </span>\n      <span className="forrum-home-v16__discussion-stat" title="Ответы">▣ {formatCount(item.commentCount)}</span>\n      <span className="forrum-home-v16__discussion-stat" title="Просмотры">◉ {formatCount(item.viewCount)}</span>\n      <span className="forrum-home-v16__last-message">\n        <strong>{relativeTime(reply.createdAt)}</strong>\n        <small>@{reply.username}</small>\n      </span>\n    </Link>\n  );\n}\n\nfunction NewTopic({ item }: { item: PublicationCardData }) {\n  const reply = lastReply(item);\n  return (\n    <Link className="forrum-home-v16__new-topic" href={`/p/${item.slug}`}>\n      <span className="forrum-home-v16__new-topic-title">{item.title?.trim() || \'Тема без заголовка\'}</span>\n      <span className="forrum-home-v16__new-topic-section">{item.community.name}</span>\n      <span className="forrum-home-v16__new-topic-author">@{item.author.username}</span>\n      <span className="forrum-home-v16__new-topic-number">{formatCount(item.commentCount)}</span>\n      <span className="forrum-home-v16__new-topic-number">{formatCount(item.viewCount)}</span>\n      <span className="forrum-home-v16__new-topic-last">\n        {relativeTime(reply.createdAt)} <b>@{reply.username}</b>\n      </span>\n    </Link>\n  );\n}\n\nfunction PollRow({ poll }: { poll: PollItem }) {\n  const options = poll.options ?? [];\n  const total = options.reduce((sum, option) => sum + Math.max(0, option.bindingVotes), 0);\n  return (\n    <Link className="forrum-home-v16__poll" href="/events?tab=polls">\n      <CommunityMark\n        className="forrum-home-v16__poll-mark"\n        name={poll.community.name}\n        url={topicVisual(poll.community.slug)}\n        size={38}\n      />\n      <span className="forrum-home-v16__poll-copy">\n        <strong>{poll.title}</strong>\n        <small>Голосов: {formatCount(total)}</small>\n      </span>\n      <span className="forrum-home-v16__poll-options">\n        {options.map((option) => {\n          const percent = total > 0 ? Math.round((option.bindingVotes / total) * 100) : 0;\n          return (\n            <span className="forrum-home-v16__poll-option" key={option.id}>\n              <span>{option.label}</span>\n              <i aria-hidden="true"><b style={{ width: `${percent}%` }} /></i>\n              <em>{formatCount(option.bindingVotes)}</em>\n              <strong>{percent}%</strong>\n            </span>\n          );\n        })}\n      </span>\n      <span className="forrum-home-v16__poll-time">Осталось: {pollTimeLeft(poll.closesAt)}</span>\n    </Link>\n  );\n}\n\nexport function HomeDashboard({ initialData }: { initialData: HomeInitialData }) {\n  const communities = initialData.communities ?? [];\n  const tree = useMemo(() => buildTree(communities), [communities]);\n  const parentSlugs = useMemo(\n    () => communities.filter((item) => communities.some((candidate) => candidate.parent?.slug === item.slug)).map((item) => item.slug),\n    [communities],\n  );\n  const [expanded, setExpanded] = useState<Set<string>>(() => new Set(parentSlugs));\n  const [weeklyMode, setWeeklyMode] = useState<\'likes\' | \'activity\'>(\'likes\');\n  const discussed = topicRows(initialData.feed);\n  const newest = topicRows(initialData.newFeed);\n  const activePolls = useMemo(\n    () => (initialData.polls ?? [])\n      .filter((poll) => poll.status.toUpperCase() === \'OPEN\' && new Date(poll.closesAt).getTime() > Date.now())\n      .sort((a, b) => new Date(a.closesAt).getTime() - new Date(b.closesAt).getTime())\n      .slice(0, 3),\n    [initialData.polls],\n  );\n  const announcements = (initialData.announcements ?? []).slice(0, 2);\n  const weekly = initialData.overview?.weekly[weeklyMode] ?? [];\n  const stats = initialData.overview?.stats;\n\n  const toggleTree = (slug: string) => {\n    setExpanded((current) => {\n      const next = new Set(current);\n      if (next.has(slug)) next.delete(slug);\n      else next.add(slug);\n      return next;\n    });\n  };\n\n  return (\n    <div className="forrum-home-v16" data-home-reference="v34">\n      <aside className="forrum-home-v16__tree">\n        <div className="forrum-home-v16__side-head"><h2>Сообщества</h2></div>\n        {tree.length ? (\n          <ul className="forrum-home-v16__tree-root">\n            {tree.map((node) => (\n              <TreeBranch key={node.id} node={node} depth={0} expanded={expanded} onToggle={toggleTree} />\n            ))}\n          </ul>\n        ) : (\n          <p className="forrum-home-v16__empty">Сообщества появятся после загрузки данных.</p>\n        )}\n        <Link className="forrum-home-v16__proposal" href="/communities/proposals">\n          <span aria-hidden="true">⊞</span> Предложить сообщество\n        </Link>\n      </aside>\n\n      <main className="forrum-home-v16__center">\n        <HomePanel title="Обсуждаемые темы" href="/feed?mode=popular">\n          <div className="forrum-home-v16__discussed-list">\n            {discussed.length ? discussed.map((item) => <DiscussedTopic key={item.id} item={item} />) : (\n              <p className="forrum-home-v16__empty">Обсуждаемых тем за последние 24 часа пока нет.</p>\n            )}\n          </div>\n        </HomePanel>\n\n        <HomePanel title="Новые темы" href="/feed?mode=new">\n          <div className="forrum-home-v16__new-topic-table">\n            <div className="forrum-home-v16__new-topic-head" aria-hidden="true">\n              <span>Тема</span><span>Раздел</span><span>Автор</span><span>Ответы</span><span>Просмотры</span><span>Последнее сообщение</span>\n            </div>\n            {newest.length ? newest.map((item) => <NewTopic key={item.id} item={item} />) : (\n              <p className="forrum-home-v16__empty">Новых тем пока нет.</p>\n            )}\n          </div>\n        </HomePanel>\n\n        <HomePanel title="Активные голосования" href="/events?tab=polls">\n          <div className="forrum-home-v16__poll-list">\n            {activePolls.length ? activePolls.map((poll) => <PollRow key={poll.id} poll={poll} />) : (\n              <p className="forrum-home-v16__empty">Активных голосований сейчас нет.</p>\n            )}\n          </div>\n        </HomePanel>\n      </main>\n\n      <aside className="forrum-home-v16__rail">\n        <HomePanel title="Актуальное" href="/news">\n          <div className="forrum-home-v16__actual-list">\n            {announcements.map((item) => (\n              <Link className="forrum-home-v16__actual" href={`/p/${item.slug}`} key={item.id}>\n                <CommunityMark name={item.community.name} url={item.community.avatarUrl ?? topicVisual(item.community.slug)} size={34} />\n                <span><strong>{item.title || \'Объявление\'}</strong><small>{relativeTime(item.createdAt)}</small></span>\n              </Link>\n            ))}\n            {activePolls[0] && (\n              <Link className="forrum-home-v16__actual" href="/events?tab=polls">\n                <CommunityMark name={activePolls[0].community.name} url={topicVisual(activePolls[0].community.slug)} size={34} />\n                <span><strong>Активное голосование</strong><small>{activePolls[0].title}</small></span>\n              </Link>\n            )}\n            {!announcements.length && !activePolls.length && (\n              <p className="forrum-home-v16__empty">Важных обновлений сейчас нет.</p>\n            )}\n          </div>\n        </HomePanel>\n\n        <section className="forrum-home-v16__panel">\n          <header className="forrum-home-v16__panel-head"><h2>Участники недели</h2></header>\n          <div className="forrum-home-v16__tabs" role="tablist" aria-label="Рейтинг недели">\n            <button type="button" role="tab" aria-selected={weeklyMode === \'likes\'} className={weeklyMode === \'likes\' ? \'is-active\' : \'\'} onClick={() => setWeeklyMode(\'likes\')}>По симпатиям</button>\n            <button type="button" role="tab" aria-selected={weeklyMode === \'activity\'} className={weeklyMode === \'activity\' ? \'is-active\' : \'\'} onClick={() => setWeeklyMode(\'activity\')}>По активности</button>\n          </div>\n          <ol className="forrum-home-v16__weekly">\n            {weekly.map((user, index) => (\n              <li key={user.username}>\n                <span className="forrum-home-v16__weekly-rank">{index + 1}</span>\n                <Avatar name={user.displayName} url={user.avatarUrl} size={30} />\n                <Link href={`/u/${user.username}`}>@{user.username}</Link>\n                <strong>{weeklyMode === \'likes\' ? \'♡\' : \'↻\'} {formatCount(user.score)}</strong>\n              </li>\n            ))}\n          </ol>\n          {!weekly.length && <p className="forrum-home-v16__weekly-empty">За эту неделю рейтинг ещё не сформировался.</p>}\n          <Link className="forrum-home-v16__rail-footer" href="/users">Смотреть рейтинг <span aria-hidden="true">→</span></Link>\n        </section>\n\n        <section className="forrum-home-v16__panel">\n          <header className="forrum-home-v16__panel-head"><h2>FORRUM сегодня</h2></header>\n          <dl className="forrum-home-v16__stats">\n            <div><dt>Сообщества</dt><dd>{formatMetric(stats?.communities)}</dd></div>\n            <div><dt>Тем создано</dt><dd>{formatMetric(stats?.topics)}</dd></div>\n            <div><dt>Сообщений</dt><dd>{formatMetric(stats?.messages)}</dd></div>\n            <div><dt>Пользователей онлайн</dt><dd>{formatMetric(stats?.usersOnline)}</dd></div>\n          </dl>\n          <div className="forrum-home-v16__record">\n            Рекорд онлайн: <strong>{formatMetric(stats?.recordOnline)}</strong>\n            {stats?.recordOnlineAt ? ` — ${formatRecordDate(stats.recordOnlineAt)}` : \'\'}\n          </div>\n        </section>\n      </aside>\n    </div>\n  );\n}\n'
          PAGE_SOURCE = "import {\n  HomeDashboard,\n  type HomeInitialData,\n} from '@/components/home-dashboard';\nimport { resolveApiBase } from '@/lib/api-base';\n\nexport const dynamic = 'force-dynamic';\n\nasync function publicApi<T>(path: string) {\n  const controller = new AbortController();\n  const timeout = setTimeout(\n    () => controller.abort(),\n    12_000,\n  );\n\n  try {\n    const response = await fetch(\n      `${resolveApiBase()}${path}`,\n      {\n        cache: 'no-store',\n        headers: {\n          Accept: 'application/json',\n        },\n        signal: controller.signal,\n      },\n    );\n\n    if (!response.ok) return undefined;\n\n    return (await response.json()) as T;\n  } catch {\n    return undefined;\n  } finally {\n    clearTimeout(timeout);\n  }\n}\n\nexport default async function Home() {\n  const [\n    communities,\n    polls,\n    announcements,\n    feed,\n    newFeed,\n    overview,\n  ] = await Promise.all([\n    publicApi<HomeInitialData['communities']>(\n      '/communities',\n    ),\n    publicApi<HomeInitialData['polls']>(\n      '/governance/polls',\n    ),\n    publicApi<HomeInitialData['announcements']>(\n      '/announcements',\n    ),\n    publicApi<HomeInitialData['feed']>(\n      '/feed?mode=popular',\n    ),\n    publicApi<HomeInitialData['newFeed']>(\n      '/feed?mode=new',\n    ),\n    publicApi<HomeInitialData['overview']>(\n      '/home/overview',\n    ),\n  ]);\n\n  return (\n    <HomeDashboard\n      initialData={{\n        communities,\n        polls,\n        announcements,\n        feed,\n        newFeed,\n        overview,\n      }}\n    />\n  );\n}\n"
          HOME_SERVICE_SOURCE = "import { Injectable } from '@nestjs/common';\nimport {\n  PollStatus,\n  PublicationFormat,\n  PublicationStatus,\n  ReactionType,\n} from '../generated/prisma/client.js';\nimport { PrismaService } from '../prisma/prisma.service.js';\n\ntype WeeklyUser = {\n  username: string;\n  displayName: string;\n  avatarUrl: string | null;\n  score: number;\n  reactionCount: number;\n  topicCount: number;\n  commentCount: number;\n};\n\ntype WeeklyAccumulator = WeeklyUser & {\n  id: string;\n};\n\ntype UserIdentity = {\n  id: string;\n  username: string;\n  displayName: string;\n  avatarUrl: string | null;\n};\n\nconst onlineRecordKey = 'home.recordOnline';\n\nfunction getWeeklyUser(\n  map: Map<string, WeeklyAccumulator>,\n  user: UserIdentity,\n) {\n  const existing = map.get(user.id);\n\n  if (existing) return existing;\n\n  const created: WeeklyAccumulator = {\n    id: user.id,\n    username: user.username,\n    displayName: user.displayName,\n    avatarUrl: user.avatarUrl,\n    score: 0,\n    reactionCount: 0,\n    topicCount: 0,\n    commentCount: 0,\n  };\n\n  map.set(user.id, created);\n  return created;\n}\n\nfunction topWeekly(\n  map: Map<string, WeeklyAccumulator>,\n  score: (item: WeeklyAccumulator) => number,\n) {\n  return [...map.values()]\n    .map((item) => ({\n      username: item.username,\n      displayName: item.displayName,\n      avatarUrl: item.avatarUrl,\n      score: score(item),\n      reactionCount: item.reactionCount,\n      topicCount: item.topicCount,\n      commentCount: item.commentCount,\n    }))\n    .filter((item) => item.score > 0)\n    .sort(\n      (left, right) =>\n        right.score - left.score ||\n        left.username.localeCompare(right.username),\n    )\n    .slice(0, 5);\n}\n\nfunction readOnlineRecord(value: unknown) {\n  if (\n    typeof value !== 'object' ||\n    value === null ||\n    Array.isArray(value)\n  ) {\n    return { count: 0, at: null as string | null };\n  }\n\n  const record = value as Record<string, unknown>;\n  const count =\n    typeof record.count === 'number' &&\n    Number.isFinite(record.count)\n      ? Math.max(0, Math.floor(record.count))\n      : 0;\n  const at =\n    typeof record.at === 'string'\n      ? record.at\n      : null;\n\n  return { count, at };\n}\n\n@Injectable()\nexport class HomeService {\n  constructor(private readonly prisma: PrismaService) {}\n\n  async overview(userId?: string) {\n    const now = new Date();\n    const dayAgo = new Date(\n      now.getTime() - 24 * 60 * 60 * 1000,\n    );\n    const weekAgo = new Date(\n      now.getTime() - 7 * 24 * 60 * 60 * 1000,\n    );\n    const onlineSince = new Date(\n      now.getTime() - 5 * 60 * 1000,\n    );\n\n    const [\n      verifiedUsers,\n      activeUsers24h,\n      publications,\n      comments24h,\n      communities,\n      topics,\n      messages,\n      onlineSessions,\n      recordSetting,\n      weeklyTopics,\n      weeklyComments,\n      publicationReactions,\n      commentReactions,\n      poll,\n      proposal,\n    ] = await Promise.all([\n      this.prisma.user.count({\n        where: { emailVerifiedAt: { not: null } },\n      }),\n      this.prisma.user.count({\n        where: { lastSeenAt: { gte: dayAgo } },\n      }),\n      this.prisma.publication.count({\n        where: { status: PublicationStatus.PUBLISHED },\n      }),\n      this.prisma.comment.count({\n        where: {\n          hiddenAt: null,\n          createdAt: { gte: dayAgo },\n        },\n      }),\n      this.prisma.community.count({\n        where: { status: 'ACTIVE' },\n      }),\n      this.prisma.publication.count({\n        where: {\n          status: PublicationStatus.PUBLISHED,\n          format: PublicationFormat.TOPIC,\n        },\n      }),\n      this.prisma.comment.count({\n        where: { hiddenAt: null },\n      }),\n      this.prisma.session.findMany({\n        where: {\n          revokedAt: null,\n          expiresAt: { gt: now },\n          lastSeenAt: { gte: onlineSince },\n        },\n        distinct: ['userId'],\n        select: { userId: true },\n      }),\n      this.prisma.platformSetting.findUnique({\n        where: { key: onlineRecordKey },\n      }),\n      this.prisma.publication.findMany({\n        where: {\n          status: PublicationStatus.PUBLISHED,\n          format: PublicationFormat.TOPIC,\n          createdAt: { gte: weekAgo },\n        },\n        select: {\n          author: {\n            select: {\n              id: true,\n              username: true,\n              displayName: true,\n              avatarUrl: true,\n            },\n          },\n        },\n      }),\n      this.prisma.comment.findMany({\n        where: {\n          hiddenAt: null,\n          createdAt: { gte: weekAgo },\n          publication: {\n            status: PublicationStatus.PUBLISHED,\n          },\n        },\n        select: {\n          author: {\n            select: {\n              id: true,\n              username: true,\n              displayName: true,\n              avatarUrl: true,\n            },\n          },\n        },\n      }),\n      this.prisma.publicationReaction.findMany({\n        where: {\n          createdAt: { gte: weekAgo },\n          type: ReactionType.LIKE,\n          publication: {\n            status: PublicationStatus.PUBLISHED,\n          },\n        },\n        select: {\n          userId: true,\n          publication: {\n            select: {\n              author: {\n                select: {\n                  id: true,\n                  username: true,\n                  displayName: true,\n                  avatarUrl: true,\n                },\n              },\n            },\n          },\n        },\n      }),\n      this.prisma.commentReaction.findMany({\n        where: {\n          createdAt: { gte: weekAgo },\n          type: ReactionType.LIKE,\n          comment: {\n            hiddenAt: null,\n            publication: {\n              status: PublicationStatus.PUBLISHED,\n            },\n          },\n        },\n        select: {\n          userId: true,\n          comment: {\n            select: {\n              author: {\n                select: {\n                  id: true,\n                  username: true,\n                  displayName: true,\n                  avatarUrl: true,\n                },\n              },\n            },\n          },\n        },\n      }),\n      this.prisma.communityPoll.findFirst({\n        where: {\n          status: PollStatus.OPEN,\n          closesAt: { gt: now },\n        },\n        orderBy: { createdAt: 'desc' },\n        include: {\n          community: {\n            select: {\n              slug: true,\n              name: true,\n              accentColor: true,\n            },\n          },\n          options: {\n            orderBy: { position: 'asc' },\n            include: {\n              _count: { select: { votes: true } },\n            },\n          },\n          votes: {\n            where: {\n              userId:\n                userId ??\n                '00000000-0000-0000-0000-000000000000',\n            },\n            take: 1,\n          },\n        },\n      }),\n      this.prisma.communityProposal.findFirst({\n        where: { status: 'OPEN' },\n        orderBy: { createdAt: 'desc' },\n        include: {\n          author: {\n            select: {\n              username: true,\n              displayName: true,\n            },\n          },\n          _count: { select: { supports: true } },\n        },\n      }),\n    ]);\n\n    const activity = new Map<string, WeeklyAccumulator>();\n    const likes = new Map<string, WeeklyAccumulator>();\n\n    for (const item of weeklyTopics) {\n      getWeeklyUser(activity, item.author).topicCount += 1;\n    }\n\n    for (const item of weeklyComments) {\n      getWeeklyUser(activity, item.author).commentCount += 1;\n    }\n\n    for (const item of publicationReactions) {\n      const author = item.publication.author;\n\n      if (item.userId === author.id) continue;\n\n      getWeeklyUser(likes, author).reactionCount += 1;\n    }\n\n    for (const item of commentReactions) {\n      const author = item.comment.author;\n\n      if (item.userId === author.id) continue;\n\n      getWeeklyUser(likes, author).reactionCount += 1;\n    }\n\n    const usersOnline = onlineSessions.length;\n    const savedRecord = readOnlineRecord(\n      recordSetting?.value,\n    );\n\n    let recordOnline = savedRecord.count;\n    let recordOnlineAt = savedRecord.at;\n\n    if (usersOnline > recordOnline) {\n      recordOnline = usersOnline;\n      recordOnlineAt = now.toISOString();\n\n      await this.prisma.platformSetting.upsert({\n        where: { key: onlineRecordKey },\n        create: {\n          key: onlineRecordKey,\n          value: {\n            count: recordOnline,\n            at: recordOnlineAt,\n          },\n        },\n        update: {\n          value: {\n            count: recordOnline,\n            at: recordOnlineAt,\n          },\n        },\n      });\n    }\n\n    return {\n      stats: {\n        // Existing fields stay for backward compatibility.\n        verifiedUsers,\n        activeUsers24h,\n        publications,\n        comments24h,\n        communities,\n        // Canonical FORRUM Today metrics.\n        topics,\n        messages,\n        usersOnline,\n        recordOnline,\n        recordOnlineAt,\n      },\n      weekly: {\n        likes: topWeekly(\n          likes,\n          (item) => item.reactionCount,\n        ),\n        activity: topWeekly(\n          activity,\n          (item) => item.topicCount + item.commentCount,\n        ),\n      },\n      poll: poll\n        ? {\n            id: poll.id,\n            title: poll.title,\n            closesAt: poll.closesAt,\n            community: poll.community,\n            totalVotes: poll.options.reduce(\n              (sum, option) =>\n                sum + option._count.votes,\n              0,\n            ),\n            viewerVoted: poll.votes.length > 0,\n          }\n        : null,\n      proposal: proposal\n        ? {\n            id: proposal.id,\n            name: proposal.name,\n            description: proposal.description,\n            supportCount: proposal._count.supports,\n            author: proposal.author,\n          }\n        : null,\n    };\n  }\n}\n"
          CHECK_HOME_SOURCE = 'import fs from \'node:fs\';\n\nconst homePath = \'apps/web/components/home-dashboard.tsx\';\nconst cssPath = \'apps/web/app/globals.css\';\nconst pagePath = \'apps/web/app/page.tsx\';\n\nfor (const path of [homePath, cssPath, pagePath]) {\n  if (!fs.existsSync(path)) {\n    throw new Error(`Homepage V34 required file missing: ${path}`);\n  }\n}\n\nconst home = fs.readFileSync(homePath, \'utf8\');\nconst css = fs.readFileSync(cssPath, \'utf8\');\nconst page = fs.readFileSync(pagePath, \'utf8\');\n\nfor (const required of [\n  \'data-home-reference="v34"\',\n  \'Обсуждаемые темы\',\n  \'Новые темы\',\n  \'Активные голосования\',\n  \'Участники недели\',\n  \'FORRUM сегодня\',\n  \'Сообщества\',\n  \'Тем создано\',\n  \'Сообщений\',\n  \'Пользователей онлайн\',\n  \'Рекорд онлайн:\',\n  \'item.lastComment?.author.username\',\n  \'poll.options ?? []\',\n  \'option.bindingVotes\',\n  \'Осталось:\',\n]) {\n  if (!home.includes(required)) {\n    throw new Error(`Homepage V34 product element missing: ${required}`);\n  }\n}\n\nfor (const required of [\n  "\'/communities\'",\n  "\'/governance/polls\'",\n  "\'/announcements\'",\n  "\'/feed?mode=popular\'",\n  "\'/feed?mode=new\'",\n  "\'/home/overview\'",\n]) {\n  if (!page.includes(required)) {\n    throw new Error(`Homepage V34 server data source missing: ${required}`);\n  }\n}\n\nconst startMarker = \'/* FORRUM_HOME_REFERENCE_V34_START\';\nconst endMarker = \'/* FORRUM_HOME_REFERENCE_V34_END */\';\nconst starts = css.split(startMarker).length - 1;\nconst ends = css.split(endMarker).length - 1;\n\nif (starts !== 1 || ends !== 1) {\n  throw new Error(\n    `Homepage V34 must have exactly one canonical CSS block; got ${starts}/${ends}.`,\n  );\n}\n\nconst start = css.indexOf(startMarker);\nconst end = css.indexOf(endMarker, start);\nconst block = css.slice(start, end + endMarker.length);\nconst outside = css.slice(0, start) + css.slice(end + endMarker.length);\n\nfor (const required of [\n  \'grid-template-columns: 300px minmax(0, 1fr) 326px\',\n  \'max-width: 1680px\',\n  \'gap: 14px\',\n  \'min-height: 68px\',\n  \'min-height: 39px\',\n  \'min-height: 78px\',\n  \'.forrum-home-v16__tree-children::before\',\n  \'border-left: 1px dotted\',\n  \'.forrum-home-v16__new-topic-head\',\n  \'.forrum-home-v16__poll-option\',\n  \'.forrum-home-v16__weekly\',\n  \'.forrum-home-v16__record\',\n  \'@media (max-width: 860px)\',\n]) {\n  if (!block.includes(required)) {\n    throw new Error(`Homepage V34 reference geometry missing: ${required}`);\n  }\n}\n\nif (outside.includes(\'.forrum-home-v16\')) {\n  throw new Error(\n    \'Homepage styles are duplicated outside the single V34 canonical block.\',\n  );\n}\n\nfor (const forbidden of [\n  \'!important\',\n  \'linear-gradient\',\n  \'radial-gradient\',\n  \'box-shadow:\',\n  \'backdrop-filter:\',\n  \'border-radius: 12px\',\n  \'border-radius: 16px\',\n]) {\n  if (block.includes(forbidden)) {\n    throw new Error(`Homepage V34 forbidden visual pattern: ${forbidden}`);\n  }\n}\n\nfor (const forbiddenThemeGeometry of [\n  \'html.dark .forrum-home-v16\',\n  \'html[data-theme="dark"] .forrum-home-v16\',\n  \'html[data-theme="graphite"] .forrum-home-v16\',\n  \'html[data-forrum-theme="graphite"] .forrum-home-v16\',\n]) {\n  if (block.includes(forbiddenThemeGeometry)) {\n    throw new Error(\n      `Paper/Graphite geometry diverged in V34: ${forbiddenThemeGeometry}`,\n    );\n  }\n}\n\nconsole.log(\n  \'FORRUM Home V34 passed: reference geometry, dense tree/table/polls, one Paper/Graphite layout.\',\n);\n'
          CHECK_REFERENCE_SOURCE = 'import fs from \'node:fs\';\n\nconst navPath = \'apps/web/components/main-nav.tsx\';\nconst homePath = \'apps/web/components/home-dashboard.tsx\';\nconst cssPath = \'apps/web/app/globals.css\';\n\nfor (const path of [navPath, homePath, cssPath]) {\n  if (!fs.existsSync(path)) {\n    throw new Error(`FORRUM reference file missing: ${path}`);\n  }\n}\n\nconst nav = fs.readFileSync(navPath, \'utf8\');\nconst linksMatch = nav.match(\n  /const\\s+links\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*as\\s+const\\s*;/,\n);\n\nif (!linksMatch) {\n  throw new Error(\'Could not isolate MainNav product links array.\');\n}\n\nconst tuples = [\n  ...linksMatch[1].matchAll(\n    /\\[\\s*[\'"]([^\'"]+)[\'"]\\s*,\\s*[\'"]([^\'"]+)[\'"]\\s*\\]/g,\n  ),\n].map((match) => [match[1], match[2]]);\n\nconst expectedNavigation = [\n  [\'/\', \'Главная\'],\n  [\'/communities\', \'Сообщества\'],\n  [\'/services\', \'Услуги\'],\n  [\'/media\', \'Медиа\'],\n  [\'/news\', \'Новости\'],\n];\n\nif (JSON.stringify(tuples) !== JSON.stringify(expectedNavigation)) {\n  throw new Error(\n    `MainNav product contract mismatch: ${JSON.stringify(tuples)}`,\n  );\n}\n\nfor (const routePage of [\n  \'apps/web/app/services/page.tsx\',\n  \'apps/web/app/media/page.tsx\',\n  \'apps/web/app/news/page.tsx\',\n]) {\n  if (!fs.existsSync(routePage)) {\n    throw new Error(`Approved MainNav route has no real page: ${routePage}`);\n  }\n}\n\nif (!nav.includes("api<ActivityItem[]>(\'/news\')")) {\n  throw new Error(\'Existing News polling was removed.\');\n}\n\nif (nav.includes(\'String(href)\')) {\n  throw new Error(\'String(href) workaround returned to MainNav.\');\n}\n\nconst home = fs.readFileSync(homePath, \'utf8\');\nconst css = fs.readFileSync(cssPath, \'utf8\');\n\nconst requiredHome = [\n  \'data-home-reference="v34"\',\n  \'forrum-home-v16__tree\',\n  \'forrum-home-v16__discussed\',\n  \'forrum-home-v16__new-topic-table\',\n  \'forrum-home-v16__poll-list\',\n  \'forrum-home-v16__weekly\',\n  \'forrum-home-v16__stats\',\n];\n\nfor (const marker of requiredHome) {\n  if (!home.includes(marker)) {\n    throw new Error(`V34 reference screen structure missing: ${marker}`);\n  }\n}\n\nconst start = css.indexOf(\'/* FORRUM_HOME_REFERENCE_V34_START\');\nconst end = css.indexOf(\'/* FORRUM_HOME_REFERENCE_V34_END */\', start);\n\nif (start < 0 || end < 0) {\n  throw new Error(\'V34 reference CSS block is missing.\');\n}\n\nconst block = css.slice(start, end);\n\nif (!block.includes(\'grid-template-columns: 300px minmax(0, 1fr) 326px\')) {\n  throw new Error(\'V34 reference three-column geometry is missing.\');\n}\n\nif (!block.includes(\'border-left: 1px dotted\')) {\n  throw new Error(\'V34 visible community hierarchy is missing.\');\n}\n\nconsole.log(\n  \'FORRUM Home Reference V34 passed: approved navigation preserved and homepage aligned to reference.\',\n);\n'
          CHECK_SCALE_SOURCE = "import fs from 'node:fs';\n\nconst css = fs.readFileSync('apps/web/app/globals.css', 'utf8');\nconst start = css.indexOf('/* FORRUM_HOME_REFERENCE_V34_START');\nconst end = css.indexOf('/* FORRUM_HOME_REFERENCE_V34_END */', start);\n\nif (start < 0 || end < 0) {\n  throw new Error('V34 canonical homepage block missing.');\n}\n\nconst block = css.slice(start, end);\n\nconst densityContract = [\n  'grid-template-columns: 300px minmax(0, 1fr) 326px',\n  'min-height: 44px',\n  'min-height: 68px',\n  'min-height: 39px',\n  'min-height: 78px',\n  'font-size: 12.5px',\n  '@media (max-width: 1480px)',\n  '@media (max-width: 1240px)',\n  '@media (max-width: 860px)',\n  '@media (max-width: 560px)',\n];\n\nfor (const marker of densityContract) {\n  if (!block.includes(marker)) {\n    throw new Error(`V34 density/scale contract missing: ${marker}`);\n  }\n}\n\nconsole.log(\n  'FORRUM Home Scale V34 passed: reference shell width, dense rows and responsive collapse.',\n);\n"
          CHECK_THEME_SOURCE = 'import fs from \'node:fs\';\n\nconst css = fs.readFileSync(\'apps/web/app/globals.css\', \'utf8\');\n\nfor (const token of [\n  \'--fvt-page:\',\n  \'--fvt-panel:\',\n  \'--fvt-line:\',\n  \'--fvt-text:\',\n  \'--fvt-muted:\',\n  \'--fvt-accent:\',\n]) {\n  if (!css.includes(token)) {\n    throw new Error(`FORRUM visual token missing: ${token}`);\n  }\n}\n\nif (\n  !css.includes(\'html[data-theme="graphite"]\') &&\n  !css.includes(\'html[data-forrum-theme="graphite"]\') &&\n  !css.includes(\'html.dark\')\n) {\n  throw new Error(\'Graphite token theme selector is missing.\');\n}\n\nif (!css.includes(\'.forrum-theme-toggle\')) {\n  throw new Error(\'Theme toggle styling is missing.\');\n}\n\nconst start = css.indexOf(\'/* FORRUM_HOME_REFERENCE_V34_START\');\nconst end = css.indexOf(\'/* FORRUM_HOME_REFERENCE_V34_END */\', start);\nconst block = start >= 0 && end >= 0 ? css.slice(start, end) : \'\';\n\nif (!block) {\n  throw new Error(\'V34 canonical homepage style block missing.\');\n}\n\nfor (const selector of [\n  \'html.dark\',\n  \'html[data-theme=\',\n  \'html[data-forrum-theme=\',\n]) {\n  if (block.includes(selector)) {\n    throw new Error(\n      `Theme-specific homepage geometry is forbidden in V34: ${selector}`,\n    );\n  }\n}\n\nconsole.log(\n  \'FORRUM Visual Theme V34 passed: Paper/Graphite are token-only with one shared homepage geometry.\',\n);\n'
          V34_CSS = '/* FORRUM_HOME_REFERENCE_V34_START\n   Canonical homepage reference geometry.\n   Paper and Graphite share one layout; theme differences come only from --fvt-* tokens.\n*/\n.forrum-home-v16 {\n  width: min(calc(100vw - 24px), 1680px);\n  max-width: 1680px;\n  margin: 0 auto;\n  padding: 14px 12px 26px;\n  display: grid;\n  grid-template-columns: 300px minmax(0, 1fr) 326px;\n  gap: 14px;\n  align-items: start;\n  color: var(--fvt-text);\n  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-size: 12.5px;\n}\n\n.forrum-home-v16 *,\n.forrum-home-v16 *::before,\n.forrum-home-v16 *::after { box-sizing: border-box; }\n.forrum-home-v16 a { color: inherit; text-decoration: none; }\n.forrum-home-v16 a:focus-visible,\n.forrum-home-v16 button:focus-visible { outline: 1px dashed var(--fvt-focus); outline-offset: 2px; }\n\n.forrum-home-v16__tree,\n.forrum-home-v16__panel {\n  min-width: 0;\n  border: 1px solid var(--fvt-line);\n  border-radius: 2px;\n  background: var(--fvt-panel);\n}\n\n.forrum-home-v16__tree {\n  position: sticky;\n  top: 72px;\n  padding: 0 14px 14px;\n  max-height: calc(100vh - 88px);\n  overflow: auto;\n  scrollbar-width: thin;\n  scrollbar-color: var(--fvt-line-strong) transparent;\n}\n\n.forrum-home-v16__center,\n.forrum-home-v16__rail { min-width: 0; display: grid; gap: 14px; }\n\n.forrum-home-v16__side-head,\n.forrum-home-v16__panel-head {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  border-bottom: 1px solid var(--fvt-line);\n}\n.forrum-home-v16__panel-head { padding: 0 14px; }\n.forrum-home-v16__side-head h2,\n.forrum-home-v16__panel-head h2 {\n  margin: 0;\n  color: var(--fvt-text);\n  font-size: 13px;\n  line-height: 1.15;\n  font-weight: 760;\n  letter-spacing: 0.012em;\n  text-transform: uppercase;\n}\n.forrum-home-v16__panel-head > a {\n  color: var(--fvt-accent);\n  font-size: 12px;\n  font-weight