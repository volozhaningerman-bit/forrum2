            fi
          done

          echo "::error::V34 could not be published safely after three attempts."
          exit 1

      - name: Verify remote V34 commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Published FORRUM Home Reference V34: $(git rev-parse HEAD)"
