              "distinct: ['publicationId']",
              'hiddenAt: null',
              'lastComment: latestCommentByPublication.get(publication.id) ?? null',
          ):
              if required not in feed:
                  raise SystemExit(f'V34 feed output incomplete: {required}')
          FEED_SERVICE.write_text(feed, encoding='utf-8')

          # Remove every active old homepage rule before adding the single canonical V34 block.
          css = CSS.read_text(encoding='utf-8')
          css = re.sub(
              r'/\* FORRUM_HOME_REFERENCE_V34_START[\s\S]*?'
              r'/\* FORRUM_HOME_REFERENCE_V34_END \*/\s*',
              '',
              css,
          )

          def find_delimiter(text: str, start: int):
              quote = None
              comment = False
              paren = 0
              bracket = 0
              i = start
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif paren == 0 and bracket == 0 and ch in ('{', ';'):
                      return i, ch
                  i += 1
              return None, None


          def matching_brace(text: str, open_at: int):
              depth = 0
              quote = None
              comment = False
              i = open_at
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('V34 CSS parser found an unbalanced block.')


          def strip_home_rules(text: str):
              out = []
              pos = 0
              while pos < len(text):
                  delimiter, kind = find_delimiter(text, pos)
                  if delimiter is None:
                      out.append(text[pos:])
                      break
                  if kind == ';':
                      out.append(text[pos:delimiter + 1])
                      pos = delimiter + 1
                      continue

                  close = matching_brace(text, delimiter)
                  prelude = text[pos:delimiter]
                  inner = text[delimiter + 1:close]
                  normalized = re.sub(r'/\*[\s\S]*?\*/', ' ', prelude).strip()

                  if normalized.startswith(('@media', '@supports', '@layer', '@container')):
                      cleaned = strip_home_rules(inner)
                      if cleaned.strip():
                          out.append(prelude + '{' + cleaned + '}')
                  elif '.forrum-home-v16' in normalized:
                      prefix_match = re.match(r'((?:\s|/\*[\s\S]*?\*/)*)', prelude)
                      prefix = prefix_match.group(1) if prefix_match else ''
                      selector = prelude[len(prefix):]
                      parts = [part for part in selector.split(',') if '.forrum-home-v16' not in part]
                      if parts:
                          out.append(prefix + ','.join(parts) + '{' + inner + '}')
                      else:
                          out.append(prefix)
                  else:
                      out.append(prelude + '{' + inner + '}')
                  pos = close + 1
              return ''.join(out)

          css = strip_home_rules(css).rstrip()

          global_shell_start_marker = '/* FORRUM_GLOBAL_SHELL_V16_1_START'
          global_shell_end_marker = '/* FORRUM_GLOBAL_SHELL_V16_1_END */'

          global_shell_start = css.find(global_shell_start_marker)
          global_shell_end = css.find(
              global_shell_end_marker,
              global_shell_start,
          )

          if global_shell_start < 0 or global_shell_end < 0:
              raise SystemExit(
                  'V34 requires existing Global Shell V16.1; '
                  'refusing to create a parallel shell.'
              )

          css = (
              css[:global_shell_end].rstrip()
              + '\n\n'
              + V34_CSS.strip()
              + '\n'
              + css[global_shell_end:]
          )

          # Keep the V32 trailing-whitespace regression fixed.
          css = '\n'.join(
              line.rstrip(' \t')
              for line in css.splitlines()
          ) + '\n'

          start = css.index('/* FORRUM_HOME_REFERENCE_V34_START')
          end = css.index('/* FORRUM_HOME_REFERENCE_V34_END */', start)

          global_shell_start = css.index(global_shell_start_marker)
          global_shell_end = css.index(
              global_shell_end_marker,
              global_shell_start,
          )

          if not (
              global_shell_start
              < start
              < end
              < global_shell_end
          ):
              raise SystemExit(
                  'V34 canonical homepage source must be inside Global Shell V16.1.'
              )

          outside = (
              css[:start]
              + css[
                  end
                  + len('/* FORRUM_HOME_REFERENCE_V34_END */'):
              ]
          )

          if '.forrum-home-v16' in outside:
              raise SystemExit(
                  'V34 cleanup left competing homepage CSS outside canonical source.'
              )

          global_shell_block = css[
              global_shell_start:
              global_shell_end + len(global_shell_end_marker)
          ]

          for required_shell_rule in (
              'width: min(calc(100vw - 24px), 1680px)',
              'border-left-color: var(--fh-line-strong)',
              'border-top-color: var(--fh-line-strong)',
          ):
              if required_shell_rule not in global_shell_block:
                  raise SystemExit(
                      'V34 broke Global Shell homepage contract: '
                      + required_shell_rule
                  )

          if '!important' in V34_CSS:
              raise SystemExit(
                  'V34 canonical homepage CSS must not use !important.'
              )

          CSS.write_text(css, encoding='utf-8')
          PY

          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m py_compile \
            /tmp/forrum-home-reference-v34.py

