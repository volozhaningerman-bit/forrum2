          # Difference 4: Graphite was almost black; Paper page was too gray.
          grep -Fq -- '--fvt-page: #151a1d;' apps/web/app/globals.css
          grep -Fq -- '--fvt-page: #f7f5f1;' apps/web/app/globals.css

          # Difference 5: header base rhythm was 64px.
          grep -Fq             '.nav { min-height: 56px;'             apps/web/app/globals.css

          # Tree interaction must remain unchanged after all visual work.
          grep -Fq             'event.target !== event.currentTarget'             apps/web/components/home-dashboard.tsx
          test "$(
            grep -F 'href={`/communities/${node.slug}`}'               apps/web/components/home-dashboard.tsx |
            wc -l |
            tr -d ' '
          )" = "1"

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck
          npm run build

          git diff --check -- \
            apps/api/src/home/home.service.ts \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-paper-graphite-v16-check.mjs \
            scripts/home-reference-check.mjs \
            scripts/home-scale-polish-check.mjs

          echo "V40 visual 1:1 second-pass production review: PASS"

      - name: Restore build side effects and clean dependencies
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tracked_dirty < <(
            git status \
              --porcelain=v1 \
              --untracked-files=no |
            sed 's/^...//'
          )

          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue

            case "$path" in
              apps/api/src/home/home.service.ts|\
              apps/web/app/globals.css|\
              apps/web/components/home-dashboard.tsx|\
              scripts/home-paper-graphite-v16-check.mjs|\
              scripts/home-reference-check.mjs|\
              scripts/home-scale-polish-check.mjs)
                continue
                ;;
            esac

            git restore \
              --staged \
              --worktree \
              -- "$path"
          done

          git clean -ffdx

          test -z "$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//' |
            grep '^apps/api/src/generated/prisma/' || true
          )"

      - name: Final V40 pre-commit audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          git diff --check

          changed="$(
            git diff --name-only |
            sort
          )"

          expected="$(
            printf '%s\n' \
              apps/api/src/home/home.service.ts \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-paper-graphite-v16-check.mjs \
              scripts/home-reference-check.mjs \
              scripts/home-scale-polish-check.mjs |
            sort
          )"

          test "$changed" = "$expected"

          test -z "$(
            git status --porcelain=v1 --untracked-files=all |
            grep -vE \
              '^( M|M |MM) (apps/api/src/home/home\.service\.ts|apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-paper-graphite-v16-check\.mjs|scripts/home-reference-check\.mjs|scripts/home-scale-polish-check\.mjs)$' \
              || true
          )"

          echo "V40 final source audit: PASS"

      - name: Commit verified V40
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "FORRUM Home Composition V40 is already present."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add \
            apps/api/src/home/home.service.ts \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-paper-graphite-v16-check.mjs \
            scripts/home-reference-check.mjs \
            scripts/home-scale-polish-check.mjs

          git diff --cached --check
          git commit -m "Align FORRUM homepage composition V40"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and full V40 production audit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

          DATABASE_URL='postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public' \
            npm run db:validate
          DATABASE_URL='postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public' \
            npm run db:generate

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck
          npm run build

          git restore \
            --source=HEAD \
            --staged \
            --worktree \
            -- .

          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "Post-rebase V40 production audit: PASS"

      - name: Publish V40 safely
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch origin main

            remote="$(git rev-parse origin/main)"

            if ! git merge-base --is-ancestor "$remote" HEAD; then
              echo "origin/main advanced; rebasing and repeating V40 verification."

              git rebase origin/main

              npm install \
                --include=dev \
                --no-audit \
                --no-fund \
                --package-lock=false

              DATABASE_URL='postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public' \
                npm run db:validate
              DATABASE_URL='postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public' \
                npm run db:generate

              node scripts/home-paper-graphite-v16-check.mjs
              node scripts/home-reference-check.mjs
              node scripts/home-scale-polish-check.mjs
              node scripts/home-visual-theme-check.mjs

              npm run validate:static
              npm run validate:ux
              npm run validate:a11y

              npm test -w @forrum/contracts --if-present
              npm test -w @forrum/api --if-present
              npm test -w @forrum/web --if-present

              npm run typecheck
              npm run build

              git restore \
                --source=HEAD \
                --staged \
                --worktree \
                -- .

              git clean -ffdx
              test -z "$(git status --porcelain)"
            fi

            git fetch origin main

            if [ "$(git rev-parse origin/main)" != "$(git merge-base HEAD origin/main)" ]; then
              continue
            fi

            if git push origin HEAD:main; then
              echo "V40 push succeeded on attempt $attempt."
              exit 0
            fi
          done

          echo "::error::V40 could not be published safely."
          exit 1

      - name: Verify remote V40 commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          echo "Published FORRUM Home Composition V40."

