          const fs = require("fs");
          const ts = require("typescript");

          const files = [
            ["apps/web/components/home-dashboard.tsx", ts.ScriptKind.TSX],
            ["apps/api/src/home/home.service.ts", ts.ScriptKind.TS],
          ];

          let failed = false;

          for (const [path, kind] of files) {
            const source = fs.readFileSync(path, "utf8");
            const file = ts.createSourceFile(
              path,
              source,
              ts.ScriptTarget.Latest,
              true,
              kind,
            );

            for (const diagnostic of file.parseDiagnostics ?? []) {
              failed = true;
              const pos = file.getLineAndCharacterOfPosition(
                diagnostic.start ?? 0,
              );
              console.error(
                `${path}:${pos.line + 1}:${pos.character + 1} ` +
                ts.flattenDiagnosticMessageText(
                  diagnostic.messageText,
                  "\n",
                ),
              );
            }
          }

          if (failed) process.exit(1);
          console.log("V40 changed TypeScript parser: PASS");
          NODE

