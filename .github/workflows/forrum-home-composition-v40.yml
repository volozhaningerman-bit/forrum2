name: FORRUM Home Composition V40

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-composition-v40
  cancel-in-progress: false

jobs:
  homepage-v40:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Inventory deployed V39 baseline
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          for path in \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/globals.css \
            apps/web/components/main-nav.tsx \
            apps/web/app/page.tsx \
            apps/api/src/home/home.service.ts \
            apps/api/prisma/schema.prisma \
            scripts/home-paper-graphite-v16-check.mjs \
            scripts/home-reference-check.mjs \
            scripts/home-scale-polish-check.mjs
          do
            test -f "$path"
          done

          grep -Fq \
            'data-home-polish="v39"' \
            apps/web/components/home-dashboard.tsx

          # Approved tree interaction is frozen.
          grep -Fq \
            'event.target !== event.currentTarget' \
            apps/web/components/home-dashboard.tsx
          grep -Fq \
            'data-expandable={hasChildren ? '"'"'true'"'"' : undefined}' \
            apps/web/components/home-dashboard.tsx

          count="$(
            grep -F \
              'href={`/communities/${node.slug}`}' \
              apps/web/components/home-dashboard.tsx |
            wc -l |
            tr -d ' '
          )"
          test "$count" = "1"

          # Product navigation stays real FORRUM navigation.
          grep -Fq "['/services', 'Услуги']" apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" apps/web/components/main-nav.tsx

          # Confirm the current real schema already contains the entities V40 uses.
          grep -Fq 'model Publication {' apps/api/prisma/schema.prisma
          grep -Fq 'model CommunityPoll {' apps/api/prisma/schema.prisma
          grep -Fq 'enum VoteClass {' apps/api/prisma/schema.prisma
          grep -Fq 'model CommunityProposal {' apps/api/prisma/schema.prisma

          {
            echo "## FORRUM Home Composition V40"
            echo
            echo "Four-screen visual audit: deployed Paper/Graphite V39 vs approved Paper/Graphite references."
            echo
            echo "| Area | Visible V39 difference | V40 correction |"
            echo "|---|---|---|"
            echo "| Overall width | 1680px max makes the UI look like a miniature site inside a 1920px screen | near-full viewport shell, max 1920px, 10px outer target margin |"
            echo "| Vertical density | Discussed is empty and Actual has one item, leaving a large empty lower half | real discussed ranking from existing publications + real Actual composition |"
            echo "| Polls | frontend supports rich rows but home overview exposes only one summary without options | existing /home/overview now exposes up to 3 real open polls with option vote counts |"
            echo "| Weekly members | UI/backend already exist; can be empty when no 7-day score exists | preserve honest empty state; no fake users |"
            echo "| Typography | too much bold text | lower heading/topic/tree weights, denser New topics rows |"
            echo "| Graphite | page is too black and text too white | lighter graphite page levels + softer text tokens |"
            echo "| Paper | page is too gray/dark compared with reference | lighter warm-paper page/surface tokens |"
            echo "| Header | 64px base rhythm is heavier than reference | edit original header/nav heights to 56px |"
            echo "| Tree | interaction is approved | preserve interaction exactly; only typography/rhythm changes |"
            echo
            echo "Backend availability:"
            echo "- Discussed topics: schema already has publications/comments/reactions; V40 uses those real records."
            echo "- Active polls: schema already has CommunityPoll/PollOption/PollVote; V40 exposes existing real records."
            echo "- Weekly rating: backend already calculates 7-day likes/activity; if it is empty, the runtime data is genuinely empty."
            echo "- No new route, entity, schema field or fake record is introduced."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write V40 composition patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/forrum-home-composition-v40.py <<'PY'
          from pathlib import Path
          import re

          HOME = Path('apps/web/components/home-dashboard.tsx')
          CSS = Path('apps/web/app/globals.css')
          SERVICE = Path('apps/api/src/home/home.service.ts')
          CHECK_HOME = Path('scripts/home-paper-graphite-v16-check.mjs')
          CHECK_REFERENCE = Path('scripts/home-reference-check.mjs')
          CHECK_SCALE = Path('scripts/home-scale-polish-check.mjs')

          for path in (HOME, CSS, SERVICE, CHECK_HOME, CHECK_REFERENCE, CHECK_SCALE):
              if not path.exists():
                  raise SystemExit(f'V40 required source missing: {path}')

          home = HOME.read_text(encoding='utf-8')
          css = CSS.read_text(encoding='utf-8')
          service = SERVICE.read_text(encoding='utf-8')
          important_before = css.count('!important')

          OLD_MARKER = 'data-home-polish="v39"'
          NEW_MARKER = 'data-home-polish="v40"'
          CSS_START = '/* FORRUM_HOME_REFERENCE_V36_START'
          CSS_END = '/* FORRUM_HOME_REFERENCE_V36_END */'
          THEME_START = '/* FORRUM_VISUAL_THEME_START'
          THEME_END = '/* FORRUM_VISUAL_THEME_END */'
          SHELL_START = '/* FORRUM_GLOBAL_SHELL_V16_1_START'
          SHELL_END = '/* FORRUM_GLOBAL_SHELL_V16_1_END */'
          DATA_MARKER = '// FORRUM_HOME_COMPOSITION_V40_DATA'


          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'V40 expected one {label}; found {count}.')
              return source.replace(old, new, 1)


          def block_bounds(source: str, start_marker: str, end_marker: str):
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'V40 block missing: {start_marker}')
              end += len(end_marker)
              return start, end, source[start:end]


          def replace_in_block(source: str, start_marker: str, end_marker: str, old: str, new: str, label: str):
              start, end, block = block_bounds(source, start_marker, end_marker)
              block = replace_once(block, old, new, label)
              return source[:start] + block + source[end:]


          def verify_tree(source: str):
              for marker in (
                  'MouseEvent<HTMLDivElement>',
                  'event.target !== event.currentTarget',
                  "data-expandable={hasChildren ? 'true' : undefined}",
                  'aria-label={`Открыть сообщество ${node.name}`}',
              ):
                  if marker not in source:
                      raise SystemExit(f'V40 tree regression: {marker}')
              if source.count('href={`/communities/${node.slug}`}') != 1:
                  raise SystemExit('V40 tree navigation must stay only on folder + name.')


          # Idempotent verification path.
          if NEW_MARKER in home and DATA_MARKER in service:
              verify_tree(home)
              print('FORRUM Home Composition V40 already applied.')
              raise SystemExit(0)

          if OLD_MARKER not in home:
              raise SystemExit('V40 requires successfully deployed V39 homepage baseline.')

          verify_tree(home)
          home = replace_once(home, OLD_MARKER, NEW_MARKER, 'homepage polish marker')

          # ------------------------------------------------------------------
          # REAL HOME DATA: existing /home/overview is expanded, no new route/schema.
          # ------------------------------------------------------------------
          service = replace_once(
              service,
              '  ReactionType,\n} from \'../generated/prisma/client.js\';',
              '  ReactionType,\n  VoteClass,\n} from \'../generated/prisma/client.js\';',
              'VoteClass import',
          )

          service = replace_once(
              service,
              "const onlineRecordKey = 'home.recordOnline';\n",
              """const onlineRecordKey = 'home.recordOnline';

          function homeExcerpt(value: string) {
            const normalized = value.replace(/\\s+/g, ' ').trim();
            if (!normalized) return 'Без описания.';
            return normalized.length > 180
              ? `${normalized.slice(0, 177).trimEnd()}...`
              : normalized;
          }
          """,
              'home excerpt helper',
          )

          service = replace_once(
              service,
              '      poll,\n      proposal,',
              '      polls,\n      proposal,',
              'poll Promise result name',
          )

          old_poll_query = """this.prisma.communityPoll.findFirst({
                  where: {
                    status: PollStatus.OPEN,
                    closesAt: { gt: now },
                  },
                  orderBy: { createdAt: 'desc' },
                  include: {
                    community: {
                      select: {
                        slug: true,
                        name: true,
                        accentColor: true,
                      },
                    },
                    options: {
                      orderBy: { position: 'asc' },
                      include: {
                        _count: { select: { votes: true } },
                      },
                    },
                    votes: {
                      where: {
                        userId:
                          userId ??
                          '00000000-0000-0000-0000-000000000000',
                      },
                      take: 1,
                    },
                  },
                }),"""

          new_poll_query = """this.prisma.communityPoll.findMany({
                  where: {
                    status: PollStatus.OPEN,
                    closesAt: { gt: now },
                  },
                  orderBy: { closesAt: 'asc' },
                  take: 3,
                  include: {
                    community: {
                      select: {
                        slug: true,
                        name: true,
                        accentColor: true,
                      },
                    },
                    options: {
                      orderBy: { position: 'asc' },
                      include: {
                        votes: {
                          select: { voteClass: true },
                        },
                      },
                    },
                    votes: {
                      where: {
                        userId:
                          userId ??
                          '00000000-0000-0000-0000-000000000000',
                      },
                      take: 1,
                    },
                  },
                }),"""
          service = replace_once(service, old_poll_query, new_poll_query, 'home active polls query')

          # Existing schema already has topics/comments/reactions. Use them directly for
          # a truthful discussed block instead of relying on an empty generic feed mode.
          activity_anchor = '    const activity = new Map<string, WeeklyAccumulator>();\n'
          discussed_query = """    // FORRUM_HOME_COMPOSITION_V40_DATA
              const discussedSince = new Date(
                now.getTime() - 30 * 24 * 60 * 60 * 1000,
              );

              const discussedCandidates = await this.prisma.publication.findMany({
                where: {
                  status: PublicationStatus.PUBLISHED,
                  format: PublicationFormat.TOPIC,
                  lastActivityAt: { gte: discussedSince },
                },
                orderBy: { lastActivityAt: 'desc' },
                take: 30,
                select: {
                  id: true,
                  slug: true,
                  type: true,
                  title: true,
                  body: true,
                  viewCount: true,
                  createdAt: true,
                  lastActivityAt: true,
                  author: {
                    select: {
                      username: true,
                      displayName: true,
                      avatarUrl: true,
                    },
                  },
                  community: {
                    select: {
                      slug: true,
                      name: true,
                      accentColor: true,
                      avatarUrl: true,
                    },
                  },
                  comments: {
                    where: { hiddenAt: null },
                    orderBy: { createdAt: 'desc' },
                    take: 1,
                    select: {
                      createdAt: true,
                      author: {
                        select: {
                          username: true,
                          displayName: true,
                        },
                      },
                    },
                  },
                  _count: {
                    select: {
                      comments: { where: { hiddenAt: null } },
                      reactions: true,
                    },
                  },
                },
              });

              const discussed = discussedCandidates
                .map((item) => ({
                  id: item.id,
                  slug: item.slug,
                  type: item.type,
                  title: item.title,
                  excerpt: homeExcerpt(item.body),
                  viewCount: item.viewCount,
                  createdAt: item.createdAt,
                  lastActivityAt: item.lastActivityAt,
                  commentCount: item._count.comments,
                  reactionCount: item._count.reactions,
                  author: item.author,
                  community: item.community,
                  lastComment: item.comments[0] ?? null,
                  score:
                    item._count.comments * 12 +
                    item._count.reactions * 5 +
                    Math.min(item.viewCount, 5000) / 50,
                }))
                .sort(
                  (left, right) =>
                    right.score - left.score ||
                    right.lastActivityAt.getTime() - left.lastActivityAt.getTime(),
                )
                .slice(0, 5)
                .map(({ score: _score, ...item }) => item);

          """
          service = replace_once(service, activity_anchor, discussed_query + activity_anchor, 'discussed data insertion')

          old_return_poll = """      poll: poll
                  ? {
                      id: poll.id,
                      title: poll.title,
                      closesAt: poll.closesAt,
                      community: poll.community,
                      totalVotes: poll.options.reduce(
                        (sum, option) =>
                          sum + option._count.votes,
                        0,
                      ),
                      viewerVoted: poll.votes.length > 0,
                    }
                  : null,"""
          new_return_poll = """      discussed,
                activePolls: polls.map((poll) => ({
                  id: poll.id,
                  title: poll.title,
                  closesAt: poll.closesAt,
                  status: poll.status,
                  createdAt: poll.createdAt,
                  community: poll.community,
                  options: poll.options.map((option) => ({
                    id: option.id,
                    label: option.label,
                    position: option.position,
                    bindingVotes: option.votes.filter(
                      (vote) => vote.voteClass === VoteClass.BINDING,
                    ).length,
                    advisoryVotes: option.votes.filter(
                      (vote) => vote.voteClass === VoteClass.ADVISORY,
                    ).length,
                  })),
                })),
                // Backward-compatible single poll summary for existing consumers.
                poll: polls[0]
                  ? {
                      id: polls[0].id,
                      title: polls[0].title,
                      closesAt: polls[0].closesAt,
                      community: polls[0].community,
                      totalVotes: polls[0].options.reduce(
                        (sum, option) => sum + option.votes.length,
                        0,
                      ),
                      viewerVoted: polls[0].votes.length > 0,
                    }
                  : null,"""
          service = replace_once(service, old_return_poll, new_return_poll, 'overview poll return contract')

          # ------------------------------------------------------------------
          # FRONTEND DATA CONTRACT + real composition.
          # ------------------------------------------------------------------
          home_type_anchor = """type HomeOverview = {
            stats: {"""
          home_type_new = """type HomeDiscussedTopic = {
            id: string;
            slug: string;
            type: string;
            title: string | null;
            excerpt: string;
            viewCount: number;
            createdAt: string;
            lastActivityAt?: string;
            commentCount: number;
            reactionCount: number;
            author: {
              username: string;
              displayName: string;
              avatarUrl?: string | null;
            };
            community: {
              slug: string;
              name: string;
              accentColor?: string;
              avatarUrl?: string | null;
            };
            lastComment?: {
              createdAt: string;
              author: { username: string; displayName: string };
            } | null;
          };

          type HomeProposal = {
            id: string;
            name: string;
            description: string;
            supportCount: number;
            author: { username: string; displayName: string };
          };

          type HomeOverview = {
            discussed?: HomeDiscussedTopic[];
            activePolls?: PollItem[];
            proposal?: HomeProposal | null;
            stats: {"""
          home = replace_once(home, home_type_anchor, home_type_new, 'HomeOverview composition types')

          old_last_reply = 'function lastReply(item: PublicationCardData) {'
          new_last_reply = """function lastReply(item: {
            lastComment?: { createdAt: string; author: { username: string } } | null;
            author: { username: string };
            lastActivityAt?: string;
            createdAt: string;
          }) {"""
          home = replace_once(home, old_last_reply, new_last_reply, 'generic lastReply contract')

          home = replace_once(
              home,
              'function DiscussedTopic({ item }: { item: PublicationCardData }) {',
              'function DiscussedTopic({ item }: { item: PublicationCardData | HomeDiscussedTopic }) {',
              'DiscussedTopic real home data type',
          )

          old_data_state = """const discussed = topicRows(initialData.feed);
            const newest = topicRows(initialData.newFeed);
            const activePolls = useMemo(
              () => (initialData.polls ?? [])
                .filter((poll) => poll.status.toUpperCase() === 'OPEN' && new Date(poll.closesAt).getTime() > Date.now())
                .sort((a, b) => new Date(a.closesAt).getTime() - new Date(b.closesAt).getTime())
                .slice(0, 3),
              [initialData.polls],
            );
            const announcements = (initialData.announcements ?? []).slice(0, 2);
            const weekly = initialData.overview?.weekly[weeklyMode] ?? [];
            const stats = initialData.overview?.stats;
          """
          new_data_state = """const discussed = initialData.overview?.discussed?.length
              ? initialData.overview.discussed
              : topicRows(initialData.feed);
            const newest = topicRows(initialData.newFeed);
            const activePolls = useMemo(() => {
              const now = Date.now();
              const merged = [
                ...(initialData.overview?.activePolls ?? []),
                ...(initialData.polls ?? []),
              ];
              const unique = new Map<string, PollItem>();

              for (const poll of merged) {
                if (
                  poll.status.toUpperCase() !== 'OPEN' ||
                  new Date(poll.closesAt).getTime() <= now
                ) {
                  continue;
                }
                if (!unique.has(poll.id)) unique.set(poll.id, poll);
              }

              return [...unique.values()]
                .sort(
                  (a, b) =>
                    new Date(a.closesAt).getTime() -
                    new Date(b.closesAt).getTime(),
                )
                .slice(0, 3);
            }, [initialData.overview?.activePolls, initialData.polls]);

            const announcements = initialData.announcements ?? [];
            const actualPoll = activePolls[0];
            const actualProposal = initialData.overview?.proposal ?? null;
            const actualReserved = Number(Boolean(actualPoll)) + Number(Boolean(actualProposal));
            const actualAnnouncements = announcements.slice(0, Math.max(0, 3 - actualReserved));
            const actualTopicSlots = Math.max(
              0,
              3 - actualReserved - actualAnnouncements.length,
            );
            const actualTopics = newest.slice(0, actualTopicSlots);
            const actualCount =
              actualAnnouncements.length +
              actualTopics.length +
              Number(Boolean(actualPoll)) +
              Number(Boolean(actualProposal));

            const weekly = initialData.overview?.weekly[weeklyMode] ?? [];
            const stats = initialData.overview?.stats;
          """
          home = replace_once(home, old_data_state, new_data_state, 'homepage real data composition')

          home = replace_once(
              home,
              'Обсуждаемых тем за последние 24 часа пока нет.',
              'Обсуждаемых тем пока нет.',
              'truthful discussed empty state',
          )

          old_actual = """          <div className=\"forrum-home-v16__actual-list\">
                      {announcements.map((item) => (
                        <Link className=\"forrum-home-v16__actual\" href={`/p/${item.slug}`} key={item.id}>
                          <CommunityMark name={item.community.name} url={item.community.avatarUrl ?? topicVisual(item.community.slug)} size={36} />
                          <span><strong>{item.title || 'Объявление'}</strong><small>{relativeTime(item.createdAt)}</small></span>
                        </Link>
                      ))}
                      {activePolls[0] && (
                        <Link className=\"forrum-home-v16__actual\" href=\"/events?tab=polls\">
                          <CommunityMark name={activePolls[0].community.name} url={topicVisual(activePolls[0].community.slug)} size={36} />
                          <span><strong>Активное голосование</strong><small>{activePolls[0].title}</small></span>
                        </Link>
                      )}
                      {!announcements.length && !activePolls.length && (
                        <p className=\"forrum-home-v16__empty\">Важных обновлений сейчас нет.</p>
                      )}
                    </div>"""
          new_actual = """          <div className=\"forrum-home-v16__actual-list\">
                      {actualAnnouncements.map((item) => (
                        <Link className=\"forrum-home-v16__actual\" href={`/p/${item.slug}`} key={`announcement-${item.id}`}>
                          <CommunityMark name={item.community.name} url={item.community.avatarUrl ?? topicVisual(item.community.slug)} size={36} />
                          <span><strong>{item.title || 'Объявление'}</strong><small>Новость · {relativeTime(item.createdAt)}</small></span>
                        </Link>
                      ))}
                      {actualPoll && (
                        <Link className=\"forrum-home-v16__actual\" href=\"/events?tab=polls\">
                          <CommunityMark name={actualPoll.community.name} url={topicVisual(actualPoll.community.slug)} size={36} />
                          <span><strong>Активное голосование</strong><small>{actualPoll.title}</small></span>
                        </Link>
                      )}
                      {actualProposal && (
                        <Link className=\"forrum-home-v16__actual\" href=\"/communities/proposals\">
                          <CommunityMark name=\"Предложения\" url=\"/forrum-assets/topic-forrum.svg\" size={36} />
                          <span><strong>Предложен раздел: {actualProposal.name}</strong><small>@{actualProposal.author.username} · {formatCount(actualProposal.supportCount)} поддержали</small></span>
                        </Link>
                      )}
                      {actualTopics.map((item) => (
                        <Link className=\"forrum-home-v16__actual\" href={`/p/${item.slug}`} key={`topic-${item.id}`}>
                          <CommunityMark name={item.community.name} url={item.community.avatarUrl ?? topicVisual(item.community.slug)} size={36} />
                          <span><strong>{item.title?.trim() || 'Новая тема'}</strong><small>Новая тема · {item.community.name}</small></span>
                        </Link>
                      ))}
                      {!actualCount && (
                        <p className=\"forrum-home-v16__empty\">Важных обновлений сейчас нет.</p>
                      )}
                    </div>"""
          home = replace_once(home, old_actual, new_actual, 'rich Actual rail')

          # Add small stat glyphs without adding a new CSS override layer.
          home = replace_once(
              home,
              '<div><dt>Сообщества</dt><dd>{formatMetric(stats?.communities)}</dd></div>\n            <div><dt>Тем создано</dt><dd>{formatMetric(stats?.topics)}</dd></div>\n            <div><dt>Сообщений</dt><dd>{formatMetric(stats?.messages)}</dd></div>\n            <div><dt>Пользователей онлайн</dt><dd>{formatMetric(stats?.usersOnline)}</dd></div>',
              '<div><dt><span aria-hidden="true">◇</span>Сообщества</dt><dd>{formatMetric(stats?.communities)}</dd></div>\n            <div><dt><span aria-hidden="true">▣</span>Тем создано</dt><dd>{formatMetric(stats?.topics)}</dd></div>\n            <div><dt><span aria-hidden="true">▤</span>Сообщений</dt><dd>{formatMetric(stats?.messages)}</dd></div>\n            <div><dt><span aria-hidden="true">♙</span>Пользователей онлайн</dt><dd>{formatMetric(stats?.usersOnline)}</dd></div>',
              'FORRUM today iconography',
          )

          # ------------------------------------------------------------------
          # GEOMETRY + DENSITY: edit canonical rules, no new V40 override block.
          # ------------------------------------------------------------------
          start, end, block = block_bounds(css, CSS_START, CSS_END)

          block = replace_once(
              block,
              """   Canonical homepage reference geometry.
             V39 viewport alignment: reference shell is centered against the viewport, not a constrained parent.
             Paper and Graphite share one layout; theme differences come only from --fvt-* tokens.""",
              """   Canonical homepage reference geometry.
             V40 composition alignment: near-full viewport shell, real dense home data, calmer typography.
             Paper and Graphite share one layout; theme differences come only from --fvt-* tokens.""",
              'V40 canonical comment',
          )
          block = replace_once(
              block,
              """  width: min(calc(100vw - 24px), 1680px);
            max-width: 1680px;""",
              """  width: min(calc(100vw - 20px), 1920px);
            max-width: 1920px;""",
              'near-full viewport width',
          )
          block = replace_once(block, '  gap: 14px;\n  align-items: start;', '  gap: 12px;\n  align-items: start;', 'main grid gap')
          block = replace_once(
              block,
              '.forrum-home-v16__center,\n.forrum-home-v16__rail { min-width: 0; display: grid; gap: 14px; }',
              '.forrum-home-v16__center,\n.forrum-home-v16__rail { min-width: 0; display: grid; gap: 10px; }',
              'vertical panel rhythm',
          )
          block = replace_once(
              block,
              '  font-weight: 750;\n  letter-spacing: 0.02em;',
              '  font-weight: 690;\n  letter-spacing: 0.014em;',
              'panel heading weight',
          )
          block = replace_once(
              block,
