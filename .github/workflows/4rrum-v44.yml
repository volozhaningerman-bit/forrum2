name: "4rrum v44"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v44:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack game files
        run: |
          echo "" | base64 -d | tar -xzf -

      - name: Apply schema and module updates
        run: |
          python3 patch.py
          rm patch.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "feat(applications): add Tyuryaga game [v44]"
          git push origin main
