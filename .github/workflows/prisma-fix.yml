# Prisma CI fix

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forrum

services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forrum
    ports:
      - 5432:5432
    options: >-
      --health-cmd pg_isready
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

# Prisma command:
#
# npm run db:validate
# npm run db:generate
