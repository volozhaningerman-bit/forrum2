name: FORRUM Tree Reference V9.2.3
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-tree-reference-v9-2-3
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  tree-reference-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean V9.2.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/ui-interaction-check.mjs
          grep -q 'home-tree-icon-toggle' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-name-link' apps/web/components/home-dashboard.tsx
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Repository is not clean before applying the tree reference patch."
            git status --short
            exit 1
          fi

      - name: Apply reference-faithful tree navigation
        shell: bash
        env:
          HOME_B64: 
          CSS_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode('utf-8')

          home_path = Path('apps/web/components/home-dashboard.tsx')
          css_path = Path('apps/web/app/globals.css')
          check_path = Path('scripts/home-tree-reference-check-v9-2-3.mjs')
          interaction_path = Path('scripts/ui-interaction-check.mjs')

          home_path.write_text(decode('HOME_B64'), encoding='utf-8')

          stage_css = decode('CSS_B64').strip() + '\n'
          existing_css = css_path.read_text(encoding='utf-8')
          start = '/* FORRUM_HOME_TREE_REFERENCE_V9_2_3'
          end = '/* /FORRUM_HOME_TREE_REFERENCE_V9_2_3 */'

          if start in existing_css:
              prefix, remainder = existing_css.split(start, 1)
              if end not in remainder:
                  raise RuntimeError('Existing V9.2.3 CSS marker has no closing marker')
              _, suffix = remainder.split(end, 1)
              merged_css = prefix.rstrip() + '\n\n' + stage_css + suffix.lstrip('\n')
          else:
              merged_css = existing_css.rstrip() + '\n\n' + stage_css

          css_path.write_text(merged_css, encoding='utf-8')
          check_path.write_text(decode('CHECK_B64'), encoding='utf-8')

          interaction = interaction_path.read_text(encoding='utf-8')
          replacements = {
              "'home-tree-link'": "'home-tree-name-link'",
              "'home-tree-hitarea'": "'home-tree-expand-surface'",
              "'home-tree-toggle'": "'home-tree-reference-chevron'",
              "'navigationIcon(community.slug)'": "'CategoryTreeIcon'",
              "'.home-tree-hitarea'": "'.home-tree-expand-surface'",
          }

          for old, new in replacements.items():
              if old in interaction:
                  interaction = interaction.replace(old, new)
              elif new not in interaction:
                  raise RuntimeError(f'Interaction contract marker not found: {old}')

          interaction_path.write_text(interaction, encoding='utf-8')
          print('FORRUM Tree Reference V9.2.3 applied.')
          PYCODE

      - name: Verify reference tree and patch scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-tree-reference-check-v9-2-3.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check
          allowed='^(apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-reference-check-v9-2-3\.mjs|scripts/ui-interaction-check\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create isolated local V9.2.3 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-tree-reference-check-v9-2-3.mjs \
            scripts/ui-interaction-check.mjs

          unexpected="$(git status --porcelain | grep -Ev '^(M |A |D |R |C |\?\?) (apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-reference-check-v9-2-3\.mjs|scripts/ui-interaction-check\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes exist before the local commit:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "FORRUM Tree Reference V9.2.3 is already present."
          else
            git commit -m "Refine FORRUM category tree to compact reference navigation"
          fi

          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-tree-reference-check-v9-2-3.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified V9.2.3
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
