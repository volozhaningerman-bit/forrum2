      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies without lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify V23
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-v23-floating-islands-check.mjs
          npm test
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm run typecheck
          npm run build

      - name: Commit and push verified branch
        shell: bash
        run: |
          set -euo pipefail
          git restore -- apps/api/src/generated/prisma
          git restore -- apps/api/dist apps/web/.next packages/contracts/dist apps/web/tsconfig.tsbuildinfo
          git diff --cached --check

          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(home): finish floating islands v23"
          git push origin "$TARGET_BRANCH"

      - name: Next step
