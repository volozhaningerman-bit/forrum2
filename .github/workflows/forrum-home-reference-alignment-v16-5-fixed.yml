name: FORRUM Home Reference Alignment V16.5 FIXED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-reference-alignment-v16-5-fixed
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  home-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/home-paper-graphite-v16-check.mjs
          test -f scripts/global-shell-v16-1-check.mjs

      - name: Apply reference alignment
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$PATCH_B64" | base64 -d             > /tmp/forrum-home-reference-v16-5.py
          printf '%s' "$CSS_B64" | base64 -d             > /tmp/forrum-home-reference-v16-5.css
          printf '%s' "$CHECK_B64" | base64 -d             > scripts/home-reference-v16-5-check.mjs

          python3 /tmp/forrum-home-reference-v16-5.py

          echo "Navigation owner:"
          cat /tmp/forrum-nav-owner.txt

          git diff --check
          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-v16-5-check.mjs

      - name: Verify isolated source scope
        shell: bash
        run: |
          set -euo pipefail

          nav_owner="$(cat /tmp/forrum-nav-owner.txt)"

          case "$nav_owner" in
            apps/web/components/*.tsx|apps/web/components/*/*.tsx) ;;
            *)
              echo "::error::Unsafe navigation owner: $nav_owner"
              exit 1
              ;;
          esac

          actual="$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//'
          )"

          bad="$(
            printf '%s\n' "$actual" |
            while IFS= read -r file; do
              [ -n "$file" ] || continue

              case "$file" in
                apps/web/app/globals.css|                apps/web/components/home-dashboard.tsx|                scripts/home-reference-v16-5-check.mjs|                "$nav_owner")
                  ;;
                *)
                  printf '%s\n' "$file"
                  ;;
              esac
            done
          )"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected source changes before build:"
            printf '%s\n' "$bad"
            echo "Navigation owner: $nav_owner"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Run static UX accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-v16-5-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          git diff --check

      - name: Run available tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Restore tracked build side effects
        shell: bash
        run: |
          set -euo pipefail

          nav_owner="$(cat /tmp/forrum-nav-owner.txt)"

          mapfile -t tracked_dirty < <(
            git status --porcelain=v1 --untracked-files=no |
            sed 's/^...//'
          )

          for file in "${tracked_dirty[@]}"; do
            [ -n "$file" ] || continue

            case "$file" in
              apps/web/app/globals.css|              apps/web/components/home-dashboard.tsx|              "$nav_owner")
                continue
                ;;
            esac

            git restore --staged --worktree -- "$file"
          done

      - name: Remove generated build artifacts
        shell: bash
        run: |
          set -euo pipefail
          git clean -ffdx             -e scripts/home-reference-v16-5-check.mjs

          test -f scripts/home-reference-v16-5-check.mjs
          test -f /tmp/forrum-nav-owner.txt

      - name: Final production audit
        shell: bash
        run: |
          set -euo pipefail

          nav_owner="$(cat /tmp/forrum-nav-owner.txt)"

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-v16-5-check.mjs
          git diff --check

          actual="$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//'
          )"

          bad="$(
            printf '%s\n' "$actual" |
            while IFS= read -r file; do
              [ -n "$file" ] || continue

              case "$file" in
                apps/web/app/globals.css|                apps/web/components/home-dashboard.tsx|                scripts/home-reference-v16-5-check.mjs|                "$nav_owner")
                  ;;
                *)
                  printf '%s\n' "$file"
                  ;;
              esac
            done
          )"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected files remain after build cleanup:"
            printf '%s\n' "$bad"
            echo "Navigation owner: $nav_owner"
            git status --short
            exit 1
          fi

          echo "Final V16.5 production audit passed."
          echo "Navigation owner: $nav_owner"

      - name: Commit verified reference alignment
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          nav_owner="$(cat /tmp/forrum-nav-owner.txt)"

          if git diff --quiet             && [ -z "$(git ls-files --others --exclude-standard scripts/home-reference-v16-5-check.mjs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "V16.5 is already applied."
            exit 0
          fi

          case "$nav_owner" in
            apps/web/components/*.tsx|apps/web/components/*/*.tsx) ;;
            *)
              echo "::error::Unsafe navigation owner before commit: $nav_owner"
              exit 1
              ;;
          esac

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add             apps/web/app/globals.css             apps/web/components/home-dashboard.tsx             "$nav_owner"             scripts/home-reference-v16-5-check.mjs

          git diff --cached --check
          git commit -m "Align FORRUM home with approved references V16.5"

          test -z "$(git status --porcelain --untracked-files=no)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push verified reference alignment
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Published verified V16.5: $(git rev-parse HEAD)"
