name: FORRUM Tree Reference V9.2.4
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-tree-reference-v9-2-4
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  tree-reference-v9-2-4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean V9.2.3 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f scripts/ui-interaction-check.mjs
          grep -q 'home-tree-expand-surface' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-name-link' apps/web/components/home-dashboard.tsx
          grep -q 'FORRUM_HOME_TREE_REFERENCE_V9_2_3' apps/web/app/globals.css
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Repository is not clean before applying V9.2.4."
            git status --short
            exit 1
          fi

      - name: Apply V9.2.4 visual hierarchy pass
        shell: bash
        env:
          HOME_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode('utf-8')

          home_path = Path('apps/web/components/home-dashboard.tsx')
          css_path = Path('apps/web/app/globals.css')
          check_path = Path('scripts/home-tree-reference-check-v9-2-4.mjs')
          doc_path = Path('docs/FORRUM_TREE_REFERENCE_V9_2_4.md')

          home_path.write_text(decode('HOME_B64'), encoding='utf-8')

          replacement_css = decode('CSS_B64').strip() + '\n'
          current_css = css_path.read_text(encoding='utf-8')
          old_start = '/* FORRUM_HOME_TREE_REFERENCE_V9_2_3'
          old_end = '/* /FORRUM_HOME_TREE_REFERENCE_V9_2_3 */'
          new_start = '/* FORRUM_HOME_TREE_REFERENCE_V9_2_4'
          new_end = '/* /FORRUM_HOME_TREE_REFERENCE_V9_2_4 */'

          if old_start in current_css:
              prefix, remainder = current_css.split(old_start, 1)
              if old_end not in remainder:
                  raise RuntimeError('The V9.2.3 CSS marker has no closing marker')
              _, suffix = remainder.split(old_end, 1)
              merged_css = prefix.rstrip() + '\n\n' + replacement_css + suffix.lstrip('\n')
          elif new_start in current_css:
              prefix, remainder = current_css.split(new_start, 1)
              if new_end not in remainder:
                  raise RuntimeError('The V9.2.4 CSS marker has no closing marker')
              _, suffix = remainder.split(new_end, 1)
              merged_css = prefix.rstrip() + '\n\n' + replacement_css + suffix.lstrip('\n')
          else:
              raise RuntimeError('Expected V9.2.3 tree CSS baseline was not found')

          css_path.write_text(merged_css, encoding='utf-8')
          check_path.write_text(decode('CHECK_B64'), encoding='utf-8')
          doc_path.parent.mkdir(parents=True, exist_ok=True)
          doc_path.write_text(decode('DOC_B64'), encoding='utf-8')
          print('FORRUM Tree Reference V9.2.4 applied.')
          PYCODE

      - name: Verify V9.2.4 contract and patch scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-tree-reference-check-v9-2-4.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check
          allowed='^(apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-reference-check-v9-2-4\.mjs|docs/FORRUM_TREE_REFERENCE_V9_2_4\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi
          if git diff -- apps/api prisma packages/contracts | grep -q .; then
            echo "API, Prisma or contracts were modified unexpectedly."
            exit 1
          fi

      - name: Create isolated local V9.2.4 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-tree-reference-check-v9-2-4.mjs \
            docs/FORRUM_TREE_REFERENCE_V9_2_4.md

          unexpected="$(git status --porcelain | grep -Ev '^(M |A |D |R |C |\?\?) (apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|scripts/home-tree-reference-check-v9-2-4\.mjs|docs/FORRUM_TREE_REFERENCE_V9_2_4\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repository changes exist before the local commit:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "FORRUM Tree Reference V9.2.4 is already present."
          else
            git commit -m "Finish FORRUM category tree visual hierarchy V9.2.4"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-tree-reference-check-v9-2-4.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified V9.2.4
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
