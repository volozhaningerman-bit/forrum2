name: Update home snapshots (temporary)
on:
  push:
    branches:
      - feat/topic-reference-skeleton
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topic-reference-skeleton
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: UPDATE_HOME_SNAPSHOTS=1 node scripts/test-home-v39.mjs
      - name: Commit reviewed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-reference/home-implemented-desktop.png docs/design-reference/home-implemented-mobile.png
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "test(home): approve compact topic snapshots"
            git push origin HEAD:feat/topic-reference-skeleton
          fi
