name: Главная — 18
run-name: Главная — 18

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-18
  cancel-in-progress: false

jobs:
  home-18:
    name: Главная — 18
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 01. Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 02. Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 03. Проверка базы и backup
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          home_file='apps/web/components/home-dashboard.tsx'
          css_file='apps/web/app/globals.css'
          test -f "$home_file"
          test -f "$css_file"
          test -f package.json

          expected_home_sha='7f1f05f793f64afd0fea250f31fbb18f543080e4a4f3ef7ce680c1e944eb5405'
          actual_home_sha="$(sha256sum "$home_file" | awk '{print $1}')"
          if [ "$actual_home_sha" != "$expected_home_sha" ]; then
            echo "::error::Главная изменилась после подготовки V18. Нужен новый workflow для актуального main."
            exit 1
          fi

          grep -Fq 'function DiscussedTopic' "$home_file"
          grep -Fq 'className="forrum-home-v16__tree-row"' "$home_file"
          grep -Fq 'title="Новые темы"' "$home_file"
          grep -Fq 'title="Новости 4RRUM"' "$home_file"
          grep -Fq 'title="Старт 4RRUM"' "$home_file"

          backup_dir="${RUNNER_TEMP}/forrum-home-18-backup"
          mkdir -p "$backup_dir/apps/web/components" "$backup_dir/apps/web/app"
          cp "$home_file" "$backup_dir/apps/web/components/home-dashboard.tsx"
          cp "$css_file" "$backup_dir/apps/web/app/globals.css"
          sha256sum \
            "$backup_dir/apps/web/components/home-dashboard.tsx" \
            "$backup_dir/apps/web/app/globals.css"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 04. Применить HOME UI 18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          home_path = Path('apps/web/components/home-dashboard.tsx')
          css_path = Path('apps/web/app/globals.css')
          css = css_path.read_text(encoding='utf-8')

          home_payload = ''
          css_payload = ''
          desired_home = b64decode(home_payload).decode('utf-8')
          css_addition = b64decode(css_payload).decode('utf-8')

          if '4RRUM HOME 18: hierarchy, discovery streams and expanded discussions' in css:
              raise SystemExit('Стили HOME UI 18 уже применены либо применены частично.')

          home_path.write_text(desired_home.rstrip() + '\n', encoding='utf-8')
          css_path.write_text(
              css.rstrip() + '\n\n' + css_addition.strip() + '\n',
              encoding='utf-8',
          )
          PY

          git diff --check

      - name: 05. Проверить изменения V18
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          home = Path('apps/web/components/home-dashboard.tsx').read_text(encoding='utf-8')
          css = Path('apps/web/app/globals.css').read_text(encoding='utf-8')

          home_required = [
              'forrum-home-v18__discovery-grid',
              'title="Медиа"',
              'title="Услуги"',
              'forrum-home-v18__service-track',
              'forrum-home-v18__discussed',
              'forrum-home-v18__topic-type',
              'forrum-home-v18__last-message',
              'forrum-home-v18__expand-button',
              'forrum-home-v18__pagination',
              "'Развернуть'",
              'Страница {safeDiscussedPage + 1}',
              '<span>Последнее</span>',
              'title="Новости 4RRUM"',
              'title="О FORRUM"',
              'href="/rules"',
          ]
          css_required = [
              '.forrum-home-v16__tree-children::before',
              ".forrum-home-v16__tree-row[data-expandable='true']",
              '.forrum-home-v18__discovery-grid',
              '.forrum-home-v18__service-track',
              '@keyframes forrum-home-v18-services',
              '.forrum-home-v18__topic-type',
              '.forrum-home-v18__last-message',
              '.forrum-home-v18__pagination',
              '@media (prefers-reduced-motion: reduce)',
          ]

          for value in home_required:
              if value not in home:
                  raise SystemExit(f'Не найден результат V18 в TSX: {value}')
          for value in css_required:
              if value not in css:
                  raise SystemExit(f'Не найден стиль V18: {value}')

          forbidden_ui = [
              'title="Новые темы"',
              'title="Старт 4RRUM"',
              '<span>Активность</span>',
              'forrum-home-v16__topic-meta',
          ]
          for value in forbidden_ui:
              if value in home:
                  raise SystemExit(f'Остался старый интерфейс: {value}')

          if home.count('function DiscussedTopic') != 1:
              raise SystemExit('DiscussedTopic должен существовать ровно один раз.')
          if home.count('forrum-home-v18__discovery-grid') != 1:
              raise SystemExit('Блоки Медиа и Услуги добавлены не один раз.')
          PY

          changed="$(git diff --name-only | sort -u)"
          expected="$(printf '%s\n' \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx | sort -u)"

          printf 'Изменённые файлы:\n%s\n' "$changed"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- apps/api packages/contracts apps/web/components/header-search.tsx)"
          git diff --check

      - name: 06. Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: 07. Обновить Prisma Client
        shell: bash
        env:
          DATABASE_URL: 'postgresql://forrum:forrum@127.0.0.1:5432/forrum'
        run: |
          set -euo pipefail

          npm run db:generate

          test -d apps/api/src/generated/prisma
          grep -Rqs 'MediaPartnerStatus' apps/api/src/generated/prisma
          grep -Rqs 'ReviewModerationStatus' apps/api/src/generated/prisma
          grep -Rqs 'showFavorites' apps/api/src/generated/prisma

      - name: 08. Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: 09. Build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build

      - name: 10. Stage и аудит
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx

          git diff --cached --check
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$(printf '%s\n' \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx | sort -u)"
          test "$staged" = "$expected"

          git diff --cached --stat
          git diff --cached -- apps/web/components/home-dashboard.tsx | sed -n '1,320p'

      - name: 11. Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Implement 4RRUM Home UI 18"

      - name: 12. Push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main изменился во время проверки. Запустите workflow ещё раз."
            exit 1
          fi
          git push origin HEAD:main

      - name: 13. Проверить публикацию commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'forrum-home-v18__discovery-grid'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'title="Новости 4RRUM"'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'title="О FORRUM"'
          git show origin/main:apps/web/app/globals.css |
            grep -Fq '@keyframes forrum-home-v18-services'

          echo "Главная — 18: применена, проверена и отправлена в main."
