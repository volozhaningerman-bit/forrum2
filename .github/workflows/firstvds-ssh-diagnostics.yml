name: FirstVDS SSH diagnostics

on:
  push:
    branches:
      - diag/railway-production-v53

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FORRUM_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/forrum_actions
          chmod 600 ~/.ssh/forrum_actions
          ssh-keygen -y -f ~/.ssh/forrum_actions > /dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect live host without changes
        env:
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
          SSH_USER: ${{ secrets.FORRUM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/forrum_actions -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" '
            set +e
            echo "=== HOST ==="
            hostname
            id
            echo "=== DEPLOY COMMAND ==="
            command -v deploy || true
            p=$(command -v deploy 2>/dev/null || true)
            if [ -n "$p" ]; then readlink -f "$p" || true; ls -l "$p" || true; fi
            echo "=== DOCKER ==="
            docker ps --format "{{.Names}} | {{.Image}} | {{.Status}}" || true
            echo "=== COMPOSE WORKDIRS ==="
            for c in $(docker ps --format "{{.Names}}" 2>/dev/null); do
              wd=$(docker inspect "$c" --format "{{index .Config.Labels \"com.docker.compose.project.working_dir\"}}" 2>/dev/null || true)
              cfg=$(docker inspect "$c" --format "{{index .Config.Labels \"com.docker.compose.project.config_files\"}}" 2>/dev/null || true)
              if [ -n "$wd" ]; then echo "$c | $wd | $cfg"; fi
            done
            echo "=== GIT HEADS ==="
            for d in /opt/forrum /opt/forrum2 /srv/forrum /srv/forrum2 /var/www/forrum /var/www/forrum2 "$HOME/forrum" "$HOME/forrum2"; do
              if [ -d "$d/.git" ]; then
                echo "$d | $(git -C "$d" rev-parse --abbrev-ref HEAD 2>/dev/null) | $(git -C "$d" rev-parse HEAD 2>/dev/null)"
              fi
            done
          '
