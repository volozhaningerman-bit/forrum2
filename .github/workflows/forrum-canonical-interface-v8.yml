      run: |-
        npm install --include=dev --no-audit --no-fund --package-lock=false
    - name: Verify required package scripts
      shell: bash
      run: |
        set -euo pipefail

        node <<'NODE'
        const root = require('./package.json');
        const api = require('./apps/api/package.json');

        for (const name of [
          'db:generate',
          'db:validate',
          'db:push',
          'db:seed',
        ]) {
          if (!root.scripts?.[name]) {
            throw new Error(`Missing root script: ${name}`);
          }
        }

        for (const name of [
          'db:generate',
          'db:validate',
          'db:push',
          'db:seed',
          'build',
          'start',
          'typecheck',
          'test',
        ]) {
          if (!api.scripts?.[name]) {
            throw new Error(`Missing @forrum/api script: ${name}`);
          }
        }
        NODE
