.media-partner-copy p,\\n.workshop-compact-card p,\\n.sidebar-fact,\\n.team-member small,\\n.publication-author-inline span,\\n.publication-main p,\\n.home-current-item em,\\n.home-current-item small,\\n.home-simple-list small,\\n.home-simple-list em {\\n  font-size: 12.5px !important;\\n  line-height: 1.45;\\n}\\n\\n.button,\\nbutton.button,\\na.button {\\n  min-height: 34px;\\n  border: 1px solid #4b4b49;\\n  border-radius: 3px;\\n  background: #4b4b49;\\n  color: #fff;\\n  box-shadow: none;\\n  font-weight: 700;\\n}\\n\\n.button:hover,\\nbutton.button:hover,\\na.button:hover {\\n  background: #282827;\\n  border-color: #282827;\\n}\\n\\n.button.ghost,\\n.button.secondary {\\n  background: #fff;\\n  color: #20201f;\\n  border-color: var(--line-strong);\\n}\\n\\n.button.ghost:hover,\\n.button.secondary:hover {\\n  background: var(--surface-soft);\\n  border-color: #8f8f8a;\\n}\\n\\n.tag,\\n.tag-list a,\\n.popular-tags a,\\n.format-label,\\n.type-label,\\n.inherited-label,\\n.promoted-label,\\n.community-followed,\\n.feed-reason {\\n  border-radius: 999px !important;\\n  border: 1px solid var(--line-strong) !important;\\n  background: #f5f5f3 !important;\\n  color: #383836 !important;\\n  box-shadow: none !important;\\n}\\n\\n.avatar,\\n.community-mark,\\n.home-list-icon,\\n.home-current-icon,\\n.activity-kind {\\n  border-color: var(--line-strong) !important;\\n  box-shadow: none !important;\\n}\\n\\n.home-community-tree {\\n  overflow: visible;\\n}\\n\\n.home-tree-node {\\n  position: relative;\\n}\\n\\n.home-tree-row {\\n  display: grid !important;\\n  grid-template-columns: minmax(0, auto) minmax(18px, 1fr) 28px;\\n  align-items: stretch;\\n  min-height: 42px;\\n  border: 0 !important;\\n  border-bottom: 1px solid #ecece9 !important;\\n  border-radius: 0 !important;\\n  background: transparent !important;\\n  padding: 0 !important;\\n}\\n\\n.home-tree-row.opened {\\n  background: #f1f1ef !important;\\n}\\n\\n.home-tree-link {\\n  grid-column: 1;\\n  display: inline-grid !important;\\n  grid-template-columns: 28px minmax(0, auto);\\n  align-items: center;\\n  gap: 9px;\\n  width: max-content !important;\\n  max-width: 205px;\\n  min-height: 42px;\\n  padding:\\n    6px 4px 6px\\n    calc(5px + (var(--tree-depth) * 18px));\\n  color: var(--text);\\n  text-decoration: none;\\n  z-index: 2;\\n}\\n\\n.home-tree-link:hover strong {\\n  text-decoration: underline;\\n  text-underline-offset: 3px;\\n}\\n\\n.home-tree-link small {\\n  margin-top: 2px;\\n  color: var(--muted);\\n  font-size: 11.5px !important;\\n  font-weight: 400;\\n}\\n\\n.home-tree-hitarea {\\n  grid-column: 2;\\n  min-width: 20px;\\n  border: 0;\\n  border-radius: 0;\\n  background: transparent;\\n  cursor: pointer;\\n  z-index: 1;\\n}\\n\\n.home-tree-hitarea:hover,\\n.home-tree-hitarea:focus-visible {\\n  background: rgba(0, 0, 0, 0.035);\\n}\\n\\n.home-tree-toggle {\\n  grid-column: 3;\\n  width: 28px;\\n  min-width: 28px;\\n  min-height: 42px;\\n  padding: 0;\\n  border: 0 !important;\\n  border-radius: 0 !important;\\n  background: transparent !important;\\n  color: #373735 !important;\\n  font-size: 17px;\\n  font-weight: 500;\\n  cursor: pointer;\\n  z-index: 2;\\n}\\n\\n.home-tree-toggle:hover,\\n.home-tree-toggle:focus-visible {\\n  background: #e5e5e1 !important;\\n}\\n\\n.home-tree-spacer {\\n  grid-column: 2 / 4;\\n}\\n\\n.home-tree-children {\\n  margin-left: 17px;\\n  border-left: 1px solid #cfcfca;\\n}\\n\\n.home-tree-children .home-tree-row {\\n  min-height: 36px;\\n}\\n\\n.home-tree-children .home-tree-link,\\n.home-tree-children .home-tree-toggle {\\n  min-height: 36px;\\n}\\n\\n.home-panel-footer[href=\\"/communities\\"] {\\n  display: none !important;\\n}\\n\\n.home-feed-tabs {\\n  gap: 0 !important;\\n}\\n\\n.home-feed-tabs button {\\n  min-height: 42px;\\n  padding: 0 18px;\\n}\\n\\n.home-topic-row {\\n  position: relative;\\n  display: grid !important;\\n  grid-template-columns:\\n    48px\\n    minmax(0, 1fr)\\n    minmax(130px, 175px)\\n    58px\\n    58px !important;\\n  gap: 10px;\\n  min-height: 72px;\\n  padding: 9px 12px !important;\\n  border-left: 0 !important;\\n  box-shadow: none !important;\\n}\\n\\n.home-topic-row::before,\\n.home-topic-row::after {\\n  display: none !important;\\n  content: none !important;\\n}\\n\\n.home-topic-visual {\\n  position: relative;\\n  width: 44px;\\n  height: 44px;\\n  align-self: center;\\n  border: 1px solid var(--line);\\n  border-radius: 5px;\\n  overflow: hidden;\\n  background: #ecece9;\\n}\\n\\n.home-topic-visual > img {\\n  width: 100%;\\n  height: 100%;\\n  object-fit: cover;\\n}\\n\\n.home-topic-visual .avatar {\\n  position: absolute;\\n  right: -3px;\\n  bottom: -3px;\\n  width: 20px !important;\\n  height: 20px !important;\\n  border: 2px solid #fff !important;\\n  font-size: 8px !important;\\n}\\n\\n.home-topic-hashtags {\\n  display: flex;\\n  flex-wrap: wrap;\\n  gap: 4px;\\n  margin-top: 3px;\\n}\\n\\n.home-topic-hashtags a {\\n  color: #4e4e4b;\\n  font-size: 11px;\\n  font-weight: 650;\\n  text-decoration: none;\\n}\\n\\n.home-topic-hashtags a:hover {\\n  text-decoration: underline;\\n}\\n\\n.user-accent[data-username=\\"owner\\"],\\n.home-topic-author a[data-username=\\"owner\\"] {\\n  color: #7a3ed0;\\n}\\n\\n.user-accent[data-username=\\"friend\\"],\\n.home-topic-author a[data-username=\\"friend\\"] {\\n  color: #087e62;\\n}\\n\\n.user-accent[data-username=\\"nora\\"],\\n.home-topic-author a[data-username=\\"nora\\"] {\\n  color: #c2415d;\\n}\\n\\n.user-accent[data-username=\\"maxstream\\"],\\n.home-topic-author a[data-username=\\"maxstream\\"] {\\n  color: #2463c8;\\n}\\n\\n.user-accent[data-username=\\"pixel\\"],\\n.home-topic-author a[data-username=\\"pixel\\"] {\\n  color: #0b7f5f;\\n}\\n\\n.community-browser-row {\\n  display: grid !important;\\n  grid-template-columns:\\n    minmax(350px, 1fr)\\n    minmax(32px, 1fr)\\n    32px\\n    auto !important;\\n  align-items: stretch;\\n  padding: 0 !important;\\n  min-height: 74px;\\n  border-left: 0 !important;\\n  border-radius: 0 !important;\\n  box-shadow: none !important;\\n}\\n\\n.community-browser-row.opened {\\n  background: #f4f4f2;\\n}\\n\\n.community-browser-main-link {\\n  grid-column: 1;\\n  display: grid;\\n  grid-template-columns: 38px minmax(0, 1fr);\\n  gap: 10px;\\n  align-items: center;\\n  min-width: 0;\\n  padding:\\n    10px 8px 10px\\n    calc(12px + (var(--tree-depth) * 22px));\\n  color: inherit;\\n  text-decoration: none;\\n  z-index: 2;\\n}\\n\\n.community-browser-main-link:hover\\n  .community-browser-title strong {\\n  text-decoration: underline;\\n  text-underline-offset: 3px;\\n}\\n\\n.community-browser-hitarea {\\n  grid-column: 2;\\n  border: 0;\\n  border-radius: 0;\\n  background: transparent;\\n  cursor: pointer;\\n}\\n\\n.community-browser-hitarea:hover,\\n.community-browser-hitarea:focus-visible {\\n  background: rgba(0, 0, 0, 0.035);\\n}\\n\\n.community-browser-chevron {\\n  grid-column: 3;\\n  width: 32px;\\n  border: 0 !important;\\n  border-radius: 0 !important;\\n  background: transparent !important;\\n  color: #333 !important;\\n  font-size: 18px;\\n  cursor: pointer;\\n}\\n\\n.community-browser-chevron:hover,\\n.community-browser-chevron:focus-visible {\\n  background: #e6e6e2 !important;\\n}\\n\\n.community-browser-actions {\\n  grid-column: 4;\\n  display: flex;\\n  align-items: center;\\n  gap: 7px;\\n  padding: 10px 12px;\\n  z-index: 2;\\n}\\n\\n.community-browser-children {\\n  margin-left: 24px;\\n  border-left: 1px solid #cfcfca;\\n}\\n\\n.community-profile {\\n  display: grid !important;\\n  grid-template-columns: 190px minmax(0, 1fr) 285px !important;\\n  min-height: 232px;\\n  max-height: none !important;\\n  overflow: visible !important;\\n}\\n\\n.community-cover {\\n  min-height: 230px !important;\\n  overflow: hidden !important;\\n  background: #efefec;\\n}\\n\\n.community-cover-image {\\n  position: absolute;\\n  inset: 0;\\n  width: 100%;\\n  height: 100%;\\n  max-height: none !important;\\n  object-fit: cover;\\n}\\n\\n.community-cover .community-mark {\\n  position: relative;\\n  z-index: 2;\\n  background: rgba(255, 255, 255, 0.92);\\n}\\n\\n.community-profile-main {\\n  padding: 28px 30px 24px !important;\\n  min-width: 0;\\n}\\n\\n.community-title-row h1 {\\n  margin: 0 0 8px;\\n}\\n\\n.community-title-row p {\\n  max-width: 760px;\\n  color: var(--muted-strong);\\n  font-size: 14px !important;\\n  line-height: 1.55;\\n}\\n\\n.curator-panel {\\n  padding: 26px 22px !important;\\n  border-left: 1px solid var(--line) !important;\\n  background: #fafaf8 !important;\\n}\\n\\n.child-community-strip {\\n  display: grid !important;\\n  grid-template-columns: 220px minmax(0, 1fr);\\n  gap: 18px;\\n  align-items: center;\\n  padding: 12px 16px !important;\\n}\\n\\n.child-community-strip nav {\\n  display: flex !important;\\n  gap: 8px;\\n  overflow-x: auto;\\n}\\n\\n.child-community-strip nav a {\\n  min-width: 190px;\\n  background: #fafaf8 !important;\\n  border: 1px solid var(--line) !important;\\n  border-radius: 3px !important;\\n}\\n\\n.modern-publication,\\n.publication-card,\\n.permanent-topic {\\n  border-color: var(--line) !important;\\n  box-shadow: none !important;\\n}\\n\\n.modern-publication.permanent-topic {\\n  border-color: #bfbfba !important;\\n}\\n\\n.publication-content-row {\\n  display: grid !important;\\n  grid-template-columns: auto auto minmax(0, 1fr);\\n  gap: 12px;\\n}\\n\\n.publication-preview {\\n  width: 116px;\\n  height: 78px;\\n  align-self: start;\\n  overflow: hidden;\\n  border: 1px solid var(--line);\\n  border-radius: 4px;\\n  background: #eee;\\n}\\n\\n.publication-preview img {\\n  width: 100%;\\n  height: 100%;\\n  object-fit: cover;\\n}\\n\\n.publication-card:not(.with-preview)\\n  .publication-content-row {\\n  grid-template-columns: auto minmax(0, 1fr);\\n}\\n\\n.media-partner-row {\\n  grid-template-columns:\\n    42px minmax(260px, 1fr)\\n    minmax(125px, 180px)\\n    minmax(100px, 150px)\\n    auto !important;\\n  min-height: 76px;\\n}\\n\\n.media-partner-avatar {\\n  width: 38px !important;\\n  height: 38px !important;\\n  overflow: hidden;\\n  border: 1px solid var(--line-strong) !important;\\n  border-radius: 50% !important;\\n}\\n\\n.media-partner-avatar img {\\n  width: 100%;\\n  height: 100%;\\n  object-fit: cover;\\n}\\n\\n.workshop-compact-grid {\\n  display: grid !important;\\n  grid-template-columns:\\n    repeat(auto-fill, minmax(230px, 1fr)) !important;\\n  gap: 12px !important;\\n}\\n\\n.workshop-compact-card {\\n  width: auto !important;\\n  min-width: 0;\\n  border-radius: 3px !important;\\n  border-color: var(--line) !important;\\n  overflow: hidden;\\n}\\n\\n.workshop-preview,\\n.workshop-preview-fallback {\\n  display: block;\\n  width: 100%;\\n  aspect-ratio: 16 / 10;\\n  overflow: hidden;\\n  background: #ededeb;\\n}\\n\\n.workshop-preview img,\\n.workshop-preview-fallback img {\\n  width: 100%;\\n  height: 100%;\\n  object-fit: cover;\\n}\\n\\n.workshop-author-line {\\n  display: flex;\\n  align-items: center;\\n  gap: 7px;\\n}\\n\\n.compact-section-tabs {\\n  overflow: visible !important;\\n  scrollbar-width: none;\\n}\\n\\n.compact-section-tabs::-webkit-scrollbar {\\n  display: none;\\n}\\n\\n.compact-section-tabs::before,\\n.compact-section-tabs::after {\\n  display: none !important;\\n}\\n\\n@media (min-width: 900px) {\\n  .compact-section-tabs {\\n    display: flex !important;\\n    flex-wrap: wrap;\\n  }\\n\\n  .compact-section-tabs > button {\\n    flex: 0 0 auto;\\n  }\\n}\\n\\n.activity-page .compact-section-tabs,\\n.events-page .compact-section-tabs {\\n  padding-right: 0 !important;\\n}\\n\\n@media (max-width: 980px) {\\n  .home-topic-row {\\n    grid-template-columns: 48px minmax(0, 1fr) 54px 54px !important;\\n  }\\n\\n  .home-topic-author {\\n    display: none !important;\\n  }\\n\\n  .community-profile {\\n    grid-template-columns: 150px minmax(0, 1fr) !important;\\n  }\\n\\n  .curator-panel {\\n    grid-column: 1 / -1;\\n    border-top: 1px solid var(--line);\\n    border-left: 0 !important;\\n  }\\n\\n  .community-browser-row {\\n    grid-template-columns: minmax(0, 1fr) 28px 32px !important;\\n  }\\n\\n  .community-browser-actions {\\n    grid-column: 1 / -1;\\n    justify-content: flex-end;\\n    border-top: 1px solid var(--line);\\n  }\\n}\\n\\n@media (max-width: 680px) {\\n  .home-topic-row {\\n    grid-template-columns: 44px minmax(0, 1fr) !important;\\n  }\\n\\n  .home-topic-count {\\n    display: none;\\n  }\\n\\n  .publication-content-row,\\n  .publication-card:not(.with-preview)\\n    .publication-content-row {\\n    grid-template-columns: auto minmax(0, 1fr) !important;\\n  }\\n\\n  .publication-preview {\\n    grid-column: 1 / -1;\\n    width: 100%;\\n    height: 140px;\\n  }\\n\\n  .community-profile {\\n    grid-template-columns: 1fr !important;\\n  }\\n\\n  .community-cover {\\n    min-height: 160px !important;\\n  }\\n\\n  .child-community-strip {\\n    grid-template-columns: 1fr;\\n  }\\n}\\n", "communitiesHelpers": "\\nconst navigationIcons: Record<string, string> = {\\n  \'forrum-start\': \'/forrum-assets/nav-forrum.svg\',\\n  \'forrum-feedback\': \'/forrum-assets/nav-feedback.svg\',\\n  \'internet-projects\': \'/forrum-assets/nav-projects.svg\',\\n  \'launches-and-teams\': \'/forrum-assets/nav-launches.svg\',\\n  promotion: \'/forrum-assets/nav-promotion.svg\',\\n  \'seo-and-traffic\': \'/forrum-assets/nav-seo.svg\',\\n  \'gta-rp\': \'/forrum-assets/nav-gaming.svg\',\\n  \'majestic-rp\': \'/forrum-assets/nav-majestic.svg\',\\n  telegram: \'/forrum-assets/nav-telegram.svg\',\\n  \'telegram-bots\': \'/forrum-assets/nav-bots.svg\',\\n};\\n\\nfunction navigationIcon(slug: string) {\\n  return (\\n    navigationIcons[slug] ||\\n    \'/forrum-assets/nav-default.svg\'\\n  );\\n}\\n", "communitiesKeyboard": "  function keyboard(\\n    event: KeyboardEvent<HTMLElement>,\\n    open: boolean,\\n    expandable: boolean,\\n    toggleCurrent: () => void,\\n  ) {\\n    if (!expandable) return;\\n\\n    if (\\n      event.key === \'Enter\' ||\\n      event.key === \' \'\\n    ) {\\n      event.preventDefault();\\n      toggleCurrent();\\n      return;\\n    }\\n\\n    if (event.key === \'ArrowRight\' && !open) {\\n      event.preventDefault();\\n      toggleCurrent();\\n      return;\\n    }\\n\\n    if (event.key === \'ArrowLeft\' && open) {\\n      event.preventDefault();\\n      toggleCurrent();\\n    }\\n  }\\n", "communitiesRender": "  function renderBranch(\\n    item: Community,\\n    depth = 0,\\n  ): ReactNode {\\n    const children = sorted(\\n      (\\n        childrenByParent.get(item.slug) ?? []\\n      ).filter(branchMatches),\\n    );\\n\\n    const expandable = children.length > 0;\\n    const open =\\n      Boolean(normalized) || expanded.has(item.slug);\\n    const toggleCurrent = () => toggleOpen(item.slug);\\n\\n    return (\\n      <section\\n        className=\\"community-browser-node\\"\\n        key={item.id}\\n      >\\n        <article\\n          id={`community-${item.slug}`}\\n          className={`community-browser-row ${\\n            expandable ? \'expandable\' : \'\'\\n          } ${open ? \'opened\' : \'closed\'}`}\\n          style={\\n            {\\n              \'--tree-depth\': Math.min(depth, 4),\\n            } as CSSProperties\\n          }\\n        >\\n          <Link\\n            className=\\"community-browser-main-link\\"\\n            href={`/communities/${item.slug}`}\\n          >\\n            <CommunityMark\\n              name={item.name}\\n              url={navigationIcon(item.slug)}\\n              size={34}\\n            />\\n            <div className=\\"community-browser-copy\\">\\n              <div className=\\"community-browser-title\\">\\n                <strong>{item.name}</strong>\\n                {item.isSubscribed && (\\n                  <span className=\\"community-followed\\">\\n                    Вы подписаны\\n                  </span>\\n                )}\\n              </div>\\n\\n              <p>\\n                {item.shortDescription ||\\n                  item.description}\\n              </p>\\n\\n              <div className=\\"community-browser-meta\\">\\n                <span>\\n                  {formatNumber(item.subscriberCount)}{\' \'}\\n                  подписчиков\\n                </span>\\n                <span>\\n                  {formatNumber(item.publicationCount)}{\' \'}\\n                  публикаций\\n                </span>\\n                {item.lastActivityAt && (\\n                  <span>\\n                    Активность{\' \'}\\n                    {formatRelativeTime(\\n                      item.lastActivityAt,\\n                    )}\\n                  </span>\\n                )}\\n                {item.curator && (\\n                  <span>\\n                    Куратор: {item.curator.displayName}\\n                  </span>\\n                )}\\n              </div>\\n            </div>\\n          </Link>\\n\\n          {expandable ? (\\n            <>\\n              <button\\n                type=\\"button\\"\\n                className=\\"community-browser-hitarea\\"\\n                aria-label={\\n                  open\\n                    ? `Свернуть подразделы ${item.name}`\\n                    : `Показать подразделы ${item.name}`\\n                }\\n                aria-expanded={open}\\n                onClick={toggleCurrent}\\n                onKeyDown={(event) =>\\n                  keyboard(\\n                    event,\\n                    open,\\n                    expandable,\\n                    toggleCurrent,\\n                  )\\n                }\\n              >\\n                <span className=\\"visually-hidden\\">\\n                  {open ? \'Свернуть\' : \'Развернуть\'}\\n                </span>\\n              </button>\\n\\n              <button\\n                type=\\"button\\"\\n                className=\\"community-browser-chevron\\"\\n           