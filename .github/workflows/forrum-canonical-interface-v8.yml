        wait "$(cat /tmp/web.pid)" 2>/dev/null || true
        wait "$(cat /tmp/api.pid)" 2>/dev/null || true
    - name: Second clean production build
      env:
        NODE_ENV: production
      run: |
        rm -rf apps/web/.next apps/api/dist packages/contracts/dist
        npm run build -w @forrum/contracts
        npm run build -w @forrum/api
        npm run build -w @forrum/web
    - name: Remove generated Prisma diff noise
      shell: bash
      run: |
        set -euo pipefail

        if git ls-files -- apps/api/src/generated/prisma | grep -q .; then
          git restore --source=HEAD --staged --worktree -- apps/api/src/generated/prisma
        fi

        git clean -fd -- apps/api/src/generated/prisma
    - name: Final repository checks
      shell: bash
      run: |
        set -euo pipefail
        git diff --check -- . ':(exclude)apps/api/src/generated/prisma/**'
        git status --short

        node scripts/ui-interaction-check.mjs
        test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
    - name: Commit and push verified FORRUM V8
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "FORRUM QA updater"
        git config user.email "actions@users.noreply.github.com"

        git add -A apps/web apps/api scripts .github/workflows

        if git diff --cached --quiet; then
          echo "FORRUM V8 is already present in main."
        else
          git commit -m "Apply canonical FORRUM interface and interactions V8"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
        fi
    - name: Verify remote main
      shell: bash
      run: |
        set -euo pipefail

        LOCAL_SHA="$(git rev-parse HEAD)"
        REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

        echo "Local:  $LOCAL_SHA"
        echo "Remote: $REMOTE_SHA"

        test "$LOCAL_SHA" = "$REMOTE_SHA"

        git grep -q -F "FORRUM_CANONICAL_INTERFACE_V8" \
          HEAD -- apps/web/app/globals.css

        git grep -q -F "home-tree-hitarea" \
          HEAD -- apps/web/components/home-dashboard.tsx

        git grep -q -F "community-browser-hitarea" \
          HEAD -- apps/web/app/communities/communities-client.tsx

        git grep -q -F "FORRUM_POPULAR_24H_V8" \
