      shell: bash
    - name: Align UX checks with SSR client split
      shell: bash
      run: |
        set -euo pipefail

        python3 <<'PY'
        from pathlib import Path

        path = Path("scripts/ux-check.mjs")
        text = path.read_text(encoding="utf-8")

        replacements = {
            "apps/web/app/communities/page.tsx":
                "apps/web/app/communities/communities-client.tsx",
