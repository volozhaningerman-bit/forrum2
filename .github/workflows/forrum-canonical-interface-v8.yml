        ROOT = Path.cwd()
        PAYLOAD = json.loads('{"files": {"apps/web/components/home-dashboard.tsx": "\'use client\';\\n\\nimport Link from \'next/link\';\\nimport type {\\n  CSSProperties,\\n  KeyboardEvent,\\n  ReactNode,\\n} from \'react\';\\nimport { useEffect, useMemo, useState } from \'react\';\\nimport { api } from \'@/lib/api\';\\nimport type { PublicationCardData } from \'@/lib/types\';\\nimport { Avatar } from \'@/components/avatar\';\\nimport { CommunityMark } from \'@/components/community-mark\';\\n\\ntype Community = {\\n  id: string;\\n  slug: string;\\n  name: string;\\n  description: string;\\n  shortDescription?: string | null;\\n  avatarUrl?: string | null;\\n  coverUrl?: string | null;\\n  subscriberCount: number;\\n  publicationCount: number;\\n  recentPublicationCount?: number;\\n  lastActivityAt?: string | null;\\n  isSubscribed?: boolean;\\n  parent: { slug: string; name: string } | null;\\n};\\n\\ntype EventItem = {\\n  id: string;\\n  title: string;\\n  startsAt: string;\\n  status: string;\\n  community: { slug: string; name: string };\\n};\\n\\ntype PollItem = {\\n  id: string;\\n  title: string;\\n  closesAt: string;\\n  status: string;\\n  community: { slug: string; name: string };\\n};\\n\\ntype WorkshopItem = {\\n  id: string;\\n  title: string;\\n  description: string;\\n  status: string;\\n  type: string;\\n  createdAt: string;\\n  author: { username: string; displayName: string };\\n};\\n\\ntype FeedMode =\\n  | \'subscriptions\'\\n  | \'new\'\\n  | \'popular\';\\n\\nexport type HomeInitialData = {\\n  communities?: Community[];\\n  events?: EventItem[];\\n  polls?: PollItem[];\\n  announcements?: PublicationCardData[];\\n  workshop?: WorkshopItem[];\\n  feed?: PublicationCardData[];\\n};\\n\\nconst feedTabs: Array<{ key: FeedMode; label: string }> = [\\n  { key: \'subscriptions\', label: \'По подпискам\' },\\n  { key: \'new\', label: \'Новое\' },\\n  { key: \'popular\', label: \'Популярное\' },\\n];\\n\\nconst formatNumber = (value: number) =>\\n  new Intl.NumberFormat(\'ru-RU\').format(value);\\n\\nfunction relativeDate(value: string) {\\n  const time = new Date(value).getTime();\\n  if (!Number.isFinite(time)) return \'\';\\n  const difference = Date.now() - time;\\n  if (difference < 60_000) return \'только что\';\\n  const minutes = Math.floor(difference / 60_000);\\n  if (minutes < 60) return `${minutes} мин. назад`;\\n  const hours = Math.floor(difference / 3_600_000);\\n  if (hours < 24) return `${hours} ч. назад`;\\n  const days = Math.floor(difference / 86_400_000);\\n  if (days < 14) return `${days} дн. назад`;\\n  return new Date(value).toLocaleDateString(\'ru-RU\', {\\n    day: \'numeric\',\\n    month: \'short\',\\n  });\\n}\\n\\nfunction shortDate(value: string) {\\n  return new Date(value).toLocaleString(\'ru-RU\', {\\n    day: \'numeric\',\\n    month: \'short\',\\n    hour: \'2-digit\',\\n    minute: \'2-digit\',\\n  });\\n}\\n\\nfunction typeLabel(type: string) {\\n  const names: Record<string, string> = {\\n    GIFT: \'Подарок\',\\n    REACTION: \'Реакция\',\\n    BADGE: \'Значок\',\\n    PROFILE_DECOR: \'Профиль\',\\n    COMMUNITY_DECOR: \'Сообщество\',\\n  };\\n  return names[type] ?? type;\\n}\\n\\nconst navigationIcons: Record<string, string> = {\\n  \'forrum-start\': \'/forrum-assets/nav-forrum.svg\',\\n  \'forrum-feedback\': \'/forrum-assets/nav-feedback.svg\',\\n  \'internet-projects\': \'/forrum-assets/nav-projects.svg\',\\n  \'launches-and-teams\': \'/forrum-assets/nav-launches.svg\',\\n  promotion: \'/forrum-assets/nav-promotion.svg\',\\n  \'seo-and-traffic\': \'/forrum-assets/nav-seo.svg\',\\n  \'gta-rp\': \'/forrum-assets/nav-gaming.svg\',\\n  \'majestic-rp\': \'/forrum-assets/nav-majestic.svg\',\\n  telegram: \'/forrum-assets/nav-telegram.svg\',\\n  \'telegram-bots\': \'/forrum-assets/nav-bots.svg\',\\n};\\n\\nconst topicVisuals: Record<string, string> = {\\n  \'forrum-start\': \'/forrum-assets/topic-forrum.svg\',\\n  \'forrum-feedback\': \'/forrum-assets/topic-forrum.svg\',\\n  \'internet-projects\': \'/forrum-assets/topic-projects.svg\',\\n  \'launches-and-teams\': \'/forrum-assets/topic-projects.svg\',\\n  promotion: \'/forrum-assets/topic-promotion.svg\',\\n  \'seo-and-traffic\': \'/forrum-assets/topic-seo.svg\',\\n  \'gta-rp\': \'/forrum-assets/topic-gta.svg\',\\n  \'majestic-rp\': \'/forrum-assets/topic-gta.svg\',\\n  telegram: \'/forrum-assets/topic-telegram.svg\',\\n  \'telegram-bots\': \'/forrum-assets/topic-telegram.svg\',\\n};\\n\\nfunction navigationIcon(slug: string) {\\n  return navigationIcons[slug] ?? \'/forrum-assets/nav-default.svg\';\\n}\\n\\nfunction topicVisual(slug: string) {\\n  return topicVisuals[slug] ?? \'/forrum-assets/topic-default.svg\';\\n}\\n\\nfunction treeKeyboard(\\n  event: KeyboardEvent<HTMLButtonElement>,\\n  open: boolean,\\n  toggleOpen: () => void,\\n) {\\n  if (\\n    event.key === \'Enter\' ||\\n    event.key === \' \' ||\\n    (event.key === \'ArrowRight\' && !open) ||\\n    (event.key === \'ArrowLeft\' && open)\\n  ) {\\n    event.preventDefault();\\n    toggleOpen();\\n  }\\n}\\n\\nfunction TopicSkeleton() {\\n  return (\\n    <div className=\\"home-topic-row home-topic-skeleton\\" aria-hidden=\\"true\\">\\n      <span className=\\"skeleton-dot\\" />\\n      <div>\\n        <span className=\\"skeleton-line short\\" />\\n        <span className=\\"skeleton-line long\\" />\\n        <span className=\\"skeleton-line medium\\" />\\n      </div>\\n      <span className=\\"skeleton-line medium\\" />\\n      <span className=\\"skeleton-line short\\" />\\n      <span className=\\"skeleton-line short\\" />\\n    </div>\\n  );\\n}\\n\\nexport function HomeDashboard({\\n  initialData = {},\\n}: {\\n  initialData?: HomeInitialData;\\n}) {\\n  const [communities, setCommunities] = useState<Community[]>(\\n    initialData.communities ?? [],\\n  );\\n  const [events, setEvents] = useState<EventItem[]>(\\n    initialData.events ?? [],\\n  );\\n  const [polls, setPolls] = useState<PollItem[]>(\\n    initialData.polls ?? [],\\n  );\\n  const [announcements, setAnnouncements] = useState<\\n    PublicationCardData[]\\n  >(initialData.announcements ?? []);\\n  const [workshop, setWorkshop] = useState<WorkshopItem[]>(\\n    initialData.workshop ?? [],\\n  );\\n  const [feed, setFeed] = useState<PublicationCardData[]>(\\n    initialData.feed ?? [],\\n  );\\n  const [mode, setMode] = useState<FeedMode>(\'new\');\\n  const [expanded, setExpanded] = useState<Set<string>>(\\n    () => new Set(),\\n  );\\n  const [feedRequestVersion, setFeedRequestVersion] = useState(0);\\n  const [feedLoading, setFeedLoading] = useState(\\n    initialData.feed === undefined,\\n  );\\n  const [pageLoading, setPageLoading] = useState(\\n    [\\n      initialData.communities,\\n      initialData.events,\\n      initialData.polls,\\n      initialData.announcements,\\n      initialData.workshop,\\n    ].some((value) => value === undefined),\\n  );\\n  const [feedError, setFeedError] = useState(\'\');\\n  const [pageError, setPageError] = useState(\'\');\\n\\n  const pageSeeded = [\\n    initialData.communities,\\n    initialData.events,\\n    initialData.polls,\\n    initialData.announcements,\\n    initialData.workshop,\\n  ].every((value) => value !== undefined);\\n  const feedSeeded = initialData.feed !== undefined;\\n\\n  useEffect(() => {\\n    if (pageSeeded) return;\\n    let cancelled = false;\\n\\n    async function loadPage() {\\n      setPageLoading(true);\\n      const results = await Promise.allSettled([\\n        api<Community[]>(\'/communities\'),\\n        api<EventItem[]>(\'/events\'),\\n        api<PollItem[]>(\'/governance/polls\'),\\n        api<PublicationCardData[]>(\'/announcements\'),\\n        api<WorkshopItem[]>(\'/workshop\'),\\n      ]);\\n      if (cancelled) return;\\n\\n      const [communityResult, eventResult, pollResult, announcementResult, workshopResult] =\\n        results;\\n\\n      if (communityResult.status === \'fulfilled\') {\\n        setCommunities(communityResult.value);\\n      } else {\\n        setPageError(\\n          communityResult.reason instanceof Error\\n            ? communityResult.reason.message\\n            : \'Не удалось загрузить структуру FORRUM\',\\n        );\\n      }\\n      if (eventResult.status === \'fulfilled\') setEvents(eventResult.value);\\n      if (pollResult.status === \'fulfilled\') setPolls(pollResult.value);\\n      if (announcementResult.status === \'fulfilled\') {\\n        setAnnouncements(announcementResult.value);\\n      }\\n      if (workshopResult.status === \'fulfilled\') setWorkshop(workshopResult.value);\\n      setPageLoading(false);\\n    }\\n\\n    void loadPage();\\n    return () => {\\n      cancelled = true;\\n    };\\n  }, [pageSeeded]);\\n\\n  useEffect(() => {\\n    if (mode === \'new\' && feedSeeded && feedRequestVersion === 0) {\\n      setFeedLoading(false);\\n      return;\\n    }\\n    let cancelled = false;\\n\\n    async function loadFeed() {\\n      setFeedLoading(true);\\n      setFeedError(\'\');\\n      try {\\n        const items = await api<PublicationCardData[]>(\\n          `/feed?mode=${encodeURIComponent(mode)}`,\\n        );\\n        if (cancelled) return;\\n        setFeed(items);\\n      } catch (cause) {\\n        if (cancelled) return;\\n        setFeed([]);\\n        setFeedError(\\n          cause instanceof Error\\n            ? cause.message\\n            : \'Не удалось загрузить обсуждения\',\\n        );\\n      } finally {\\n        if (!cancelled) setFeedLoading(false);\\n      }\\n    }\\n\\n    void loadFeed();\\n    return () => {\\n      cancelled = true;\\n    };\\n  }, [feedRequestVersion, feedSeeded, mode]);\\n\\n  const childrenByParent = useMemo(() => {\\n    const map = new Map<string, Community[]>();\\n    for (const community of communities) {\\n      if (!community.parent) continue;\\n      map.set(community.parent.slug, [\\n        ...(map.get(community.parent.slug) ?? []),\\n        community,\\n      ]);\\n    }\\n    return map;\\n  }, [communities]);\\n\\n  const rootCommunities = useMemo(\\n    () =>\\n      communities\\n        .filter((community) => !community.parent)\\n        .sort((left, right) => left.name.localeCompare(right.name, \'ru\')),\\n    [communities],\\n  );\\n\\n  const newCommunities = useMemo(\\n    () =>\\n      [...rootCommunities]\\n        .sort(\\n          (left, right) =>\\n            (right.recentPublicationCount ?? 0) -\\n              (left.recentPublicationCount ?? 0) ||\\n            right.subscriberCount - left.subscriberCount,\\n        )\\n        .slice(0, 4),\\n    [rootCommunities],\\n  );\\n\\n  const workshopItems = useMemo(\\n    () => workshop.filter((item) => item.status === \'PUBLISHED\').slice(0, 4),\\n    [workshop],\\n  );\\n\\n  const currentItems = useMemo(() => {\\n    const now = Date.now();\\n    const upcoming = events\\n      .filter(\\n        (item) =>\\n          item.status === \'PUBLISHED\' &&\\n          new Date(item.startsAt).getTime() > now,\\n      )\\n      .slice(0, 2)\\n      .map((item) => ({\\n        id: `event-${item.id}`,\\n        kind: \'Событие\',\\n        symbol: \'С\',\\n        title: item.title,\\n        meta: `${item.community.name} · ${shortDate(item.startsAt)}`,\\n        href: `/events/${item.id}`,\\n      }));\\n    const openPolls = polls\\n      .filter((item) => item.status === \'OPEN\')\\n      .slice(0, 2)\\n      .map((item) => ({\\n        id: `poll-${item.id}`,\\n        kind: \'Голосование\',\\n        symbol: \'Г\',\\n        title: item.title,\\n        meta: `${item.community.name} · до ${shortDate(item.closesAt)}`,\\n        href: \'/events?tab=polls\',\\n      }));\\n    const latestAnnouncements = announcements.slice(0, 2).map((item) => ({\\n      id: `announcement-${item.id}`,\\n      kind: \'Объявление\',\\n      symbol: \'О\',\\n      title: item.title || item.excerpt.slice(0, 90) || \'Объявление FORRUM\',\\n      meta: `${item.community.name} · ${shortDate(\\n        item.lastActivityAt ?? item.createdAt,\\n      )}`,\\n      href: `/p/${item.slug}`,\\n    }));\\n    return [...upcoming, ...openPolls, ...latestAnnouncements].slice(0, 5);\\n  }, [announcements, events, polls]);\\n\\n  function toggle(slug: string) {\\n    setExpanded((current) => {\\n      const next = new Set(current);\\n      if (next.has(slug)) next.delete(slug);\\n      else next.add(slug);\\n      return next;\\n    });\\n  }\\n\\n  function renderTree(community: Community, depth = 0): ReactNode {\\n    const children = (childrenByParent.get(community.slug) ?? [])\\n      .slice()\\n      .sort((left, right) => left.name.localeCompare(right.name, \'ru\'));\\n    const expandable = children.length > 0;\\n    const open = expanded.has(community.slug);\\n    const toggleCurrent = () => toggle(community.slug);\\n\\n    return (\\n      <div\\n        className=\\"home-tree-node\\"\\n        key={community.id}\\n        style={{ \'--tree-depth\': Math.min(depth, 3) } as CSSProperties}\\n      >\\n        <div\\n          className={`home-tree-row ${expandable ? \'expandable\' : \'\'} ${\\n            open ? \'opened\' : \'closed\'\\n          }`}\\n        >\\n          <Link\\n            className=\\"home-tree-link\\"\\n            href={`/communities/${community.slug}`}\\n          >\\n            <CommunityMark\\n              name={community.name}\\n              url={navigationIcon(community.slug)}\\n              size={26}\\n            />\\n            <span>\\n              <strong>{community.name}</strong>\\n              {depth === 0 && (\\n                <small>\\n                  {formatNumber(community.subscriberCount)} подписчиков\\n                </small>\\n              )}\\n            </span>\\n          </Link>\\n\\n          {expandable ? (\\n            <>\\n              <button\\n                type=\\"button\\"\\n                className=\\"home-tree-hitarea\\"\\n                aria-label={\\n                  open\\n                    ? `Свернуть подразделы ${community.name}`\\n                    : `Показать подразделы ${community.name}`\\n                }\\n                aria-expanded={open}\\n                onClick={toggleCurrent}\\n                onKeyDown={(event) =>\\n                  treeKeyboard(event, open, toggleCurrent)\\n                }\\n              >\\n                <span className=\\"visually-hidden\\">\\n                  {open ? \'Свернуть\' : \'Развернуть\'}\\n                </span>\\n              </button>\\n              <button\\n                type=\\"button\\"\\n                className=\\"home-tree-toggle\\"\\n                aria-label={\\n                  open\\n                    ? `Свернуть подразделы ${community.name}`\\n                    : `Показать подразделы ${community.name}`\\n                }\\n                aria-expanded={open}\\n                onClick={toggleCurrent}\\n                onKeyDown={(event) =>\\n                  treeKeyboard(event, open, toggleCurrent)\\n                }\\n              >\\n                <span aria-hidden=\\"true\\">{open ? \'−\' : \'+\'}</span>\\n              </button>\\n            </>\\n          ) : (\\n            <span className=\\"home-tree-spacer\\" aria-hidden=\\"true\\" />\\n          )}\\n        </div>\\n        {expandable && open && (\\n          <div className=\\"home-tree-children\\">\\n            {children.map((child) => renderTree(child, depth + 1))}\\n          </div>\\n        )}\\n      </div>\\n    );\\n  }\\n\\n  return (\\n    <div className=\\"home-board final-home-v7\\">\\n      <section className=\\"home-commandbar\\">\\n        <h1>Главная</h1>\\n        <Link className=\\"button\\" href=\\"/create\\">\\n          <span aria-hidden=\\"true\\">＋</span>\\n          Создать тему\\n        </Link>\\n      </section>\\n\\n      {pageError && <div className=\\"error-box\\">{pageError}</div>}\\n\\n      <div className=\\"home-layout\\">\\n        <aside className=\\"home-community-tree\\" aria-label=\\"Категории и подразделы\\">\\n          <Link className=\\"home-workshop-entry\\" href=\\"/workshop\\">\\n            <span className=\\"home-workshop-icon\\">М</span>\\n            <span>\\n              <strong>Мастерская</strong>\\n              <small>Работы и решения участников</small>\\n            </span>\\n            <span aria-hidden=\\"true\\">→</span>\\n          </Link>\\n          <div className=\\"home-tree-separator\\" aria-hidden=\\"true\\" />\\n\\n          {pageLoading ? (\\n            <div className=\\"home-tree-skeleton\\" aria-label=\\"Загружаем структуру\\">\\n              {Array.from({ length: 7 }).map((_, index) => (\\n                <span key={index} />\\n              ))}\\n            </div>\\n          ) : (\\n            <>\\n              {rootCommunities.map((community) => renderTree(community))}\\n              {!rootCommunities.length && (\\n                <p className=\\"muted small-text\\">\\n                  Категории появятся после создания первых сообществ.\\n                </p>\\n              )}\\n            </>\\n          )}\\n        </aside>\\n\\n        <main className=\\"home-discussion-panel\\">\\n          <header className=\\"home-panel-heading\\">\\n            <h2>Лента обсуждений</h2>\\n          </header>\\n          <div className=\\"home-feed-tabs\\" role=\\"tablist\\" aria-label=\\"Режим ленты\\">\\n            {feedTabs.map((tab) => (\\n              <button\\n                type=\\"button\\"\\n                role=\\"tab\\"\\n                aria-selected={mode === tab.key}\\n                className={mode === tab.key ? \'active\' : \'\'}\\n                key={tab.key}\\n                onClick={() => setMode(tab.key)}\\n              >\\n                {tab.label}\\n              </button>\\n            ))}\\n          </div>\\n          <div className=\\"home-feed-table\\">\\n            <div className=\\"home-feed-head\\" aria-hidden=\\"true\\">\\n              <span>Тема</span>\\n              <span>Автор</span>\\n              <span>Ответы</span>\\n              <span>Просмотры</span>\\n            </div>\\n            {feedLoading ? (\\n              Array.from({ length: 8 }).map((_, index) => (\\n                <TopicSkeleton key={index} />\\n              ))\\n            ) : feedError ? (\\n              <div className=\\"home-feed-status error\\">\\n                <strong>Не удалось загрузить ленту</strong>\\n                <span>{feedError}</span>\\n                <button\\n                  type=\\"button\\"\\n                  className=\\"button ghost small\\"\\n                  onClick={() => setFeedRequestVersion((current) => current + 1)}\\n                >\\n                  Повторить\\n                </button>\\n              </div>\\n            ) : feed.length ? (\\n              feed.slice(0, 12).map((item, index) => (\\n                <article\\n                  className={`home-topic-row ${\\n                    item.format === \'TOPIC\' ? \'home-topic-permanent\' : \'\'\\n                  } ${\\n                    item.type === \'NEWS\' || index < 3\\n                      ? \'home-topic-with-preview\'\\n                      : \'\'\\n                  }`}\\n                  data-community={item.community.slug}\\n                  key={item.id}\\n                >\\n                  <div className=\\"home-topic-visual\\">\\n                    <img\\n                      src={topicVisual(item.community.slug)}\\n                      alt=\\"\\"\\n                      aria-hidden=\\"true\\"\\n                    />\\n                    <Avatar\\n                      name={item.author.displayName}\\n                      size={22}\\n                      url={item.author.avatarUrl}\\n                    />\\n                  </div>\\n                  <div className=\\"home-topic-copy\\">\\n                    <div className=\\"home-topic-path\\">\\n                      <Link href={`/communities/${item.community.slug}`}>\\n                        {item.community.name}\\n                      </Link>\\n                      {item.tags.slice(0, 3).map((tag) => (\\n                        <Link\\n                          className=\\"home-topic-hashtag\\"\\n                          href={`/tags/${tag.slug}`}\\n                          key={tag.id}\\n                        >\\n                          #{tag.label}\\n                        </Link>\\n                      ))}\\n                    </div>\\n                    <Link className=\\"home-topic-title\\" href={`/p/${item.slug}`}>\\n                      {item.title || item.excerpt.slice(0, 100)}\\n                    </Link>\\n                    <p>{item.excerpt}</p>\\n                  </div>\\n                  <div className=\\"home-topic-author\\">\\n                    <Link\\n                      className=\\"home-topic-author-link\\"\\n                      data-username={item.author.username}\\n                      href={`/u/${item.author.username}`}\\n                    >\\n                      {item.author.displayName}\\n                    </Link>\\n                    <span>{relativeDate(item.lastActivityAt || item.createdAt)}</span>\\n                  </div>\\n                  <strong className=\\"home-topic-count\\">\\n                    {formatNumber(item.commentCount)}\\n                  </strong>\\n                  <strong className=\\"home-topic-count\\">\\n                    {formatNumber(item.viewCount ?? 0)}\\n                  </strong>\\n                </article>\\n              ))\\n            ) : (\\n              <div className=\\"home-feed-status\\">\\n                <strong>В этой вкладке пока пусто</strong>\\n                <span>Выберите другой режим или создайте первую тему.</span>\\n              </div>\\n            )}\\n          </div>\\n          <Link className=\\"home-panel-footer\\" href=\\"/search\\">\\n            Перейти ко всем обсуждениям <span aria-hidden=\\"true\\">→</span>\\n          </Link>\\n        </main>\\n\\n        <aside className=\\"home-current-panel\\">\\n          <header className=\\"home-panel-heading\\">\\n            <h2>Актуальное</h2>\\n          </header>\\n          <div className=\\"home-current-list\\">\\n            {pageLoading\\n              ? Array.from({ length: 4 }).map((_, index) => (\\n                  <div className=\\"home-current-skeleton\\" key={index}>\\n                    <span />\\n                    <div><i /><i /><i /></div>\\n                  </div>\\n                ))\\n              : currentItems.map((item) => (\\n                  <Link href={item.href} className=\\"home-current-item\\" key={item.id}>\\n                    <span className=\\"home-current-icon\\">{item.symbol}</span>\\n                    <span>\\n                      <small>{item.kind}</small>\\n                      <strong>{item.title}</strong>\\n                      <em>{item.meta}</em>\\n                    </span>\\n                  </Link>\\n                ))}\\n            {!pageLoading && !currentItems.length && (\\n              <div className=\\"home-current-empty\\">\\n                Новых событий и объявлений пока нет.\\n              </div>\\n            )}\\n          </div>\\n          <Link className=\\"home-panel-footer\\" href=\\"/events\\">\\n            Перейти ко всему актуальному <span aria-hidden=\\"true\\">→</span>\\n          </Link>\\n        </aside>\\n      </div>\\n\\n      <div className=\\"home-lower-grid\\">\\n        <section className=\\"home-list-panel\\">\\n          <header className=\\"home-panel-heading\\">\\n            <h2>Новое в Мастерской</h2>\\n            <Link href=\\"/workshop\\">Перейти в Мастерскую</Link>\\n          </header>\\n          <div className=\\"home-simple-list\\">\\n            {workshopItems.map((item) => (\\n              <Link href=\\"/workshop\\" key={item.id}>\\n                <span className=\\"home-list-icon\\">М</span>\\n                <span>\\n                  <strong>{item.title}</strong>\\n                  <small>{typeLabel(item.type)} · @{item.author.username}</small>\\n                </span>\\n                <em>{relativeDate(item.createdAt)}</em>\\n              </Link>\\n            ))}\\n            {!pageLoading && !workshopItems.length && (\\n              <div className=\\"home-list-empty\\">Новых опубликованных работ пока нет.</div>\\n            )}\\n          </div>\\n          <Link className=\\"home-panel-footer\\" href=\\"/workshop\\">\\n            Смотреть все новинки <span aria-hidden=\\"true\\">→</span>\\n          </Link>\\n        </section>\\n\\n        <section className=\\"home-list-panel\\">\\n          <header className=\\"home-panel-heading\\">\\n            <h2>Новые сообщества</h2>\\n            <Link href=\\"/communities\\">Все сообщества</Link>\\n          </header>\\n          <div className=\\"home-simple-list\\">\\n            {newCommunities.map((community) => (\\n              <Link href={`/communities/${community.slug}`} key={community.id}>\\n                <CommunityMark\\n                  name={community.name}\\n                  url={community.avatarUrl}\\n                  size={30}\\n                />\\n                <span>\\n                  <strong>{community.name}</strong>\\n                  <small>{community.shortDescription || community.description}</small>\\n                </span>\\n                <em>{formatNumber(community.subscriberCount)} подписчиков</em>\\n              </Link>\\n            ))}\\n            {!pageLoading && !newCommunities.length && (\\n              <div className=\\"home-list-empty\\">Новых сообществ пока нет.</div>\\n            )}\\n          </div>\\n          <Link className=\\"home-panel-footer\\" href=\\"/communities\\">\\n            Перейти ко всем сообществам <span aria-hidden=\\"true\\">→</span>\\n          </Link>\\n        </section>\\n      </div>\\n    </div>\\n  );\\n}\\n", "apps/api/src/feed/ranking.ts": "export interface FeedScoreInput {\\n  mode: string;\\n  format: \'POST\' | \'TOPIC\';\\n  createdAtMs: number;\\n  lastActivityAtMs: number;\\n  nowMs: number;\\n  commentCount: number;\\n  recentCommentCount: number;\\n  reactionCount: number;\\n  bookmarkCount: number;\\n  viewCount: number;\\n  isCommunitySubscribed: boolean;\\n  isAuthorFollowed: boolean;\\n  matchingTagCount: number;\\n  isPinned: boolean;\\n}\\n\\nexport interface FeedScoreResult {\\n  score: number;\\n  reason: string;\\n  personallyRelevant: boolean;\\n  discussed: boolean;\\n}\\n\\nexport function calculateFeedScore(\\n  input: FeedScoreInput,\\n): FeedScoreResult {\\n  const ageHours = Math.max(\\n    0,\\n    (input.nowMs - input.createdAtMs) / 3_600_000,\\n  );\\n  const activityHours = Math.max(\\n    0,\\n    (input.nowMs - input.lastActivityAtMs) / 3_600_000,\\n  );\\n  const engagementRaw =\\n    input.commentCount * 3 +\\n    input.reactionCount * 2 +\\n    input.bookmarkCount * 2 +\\n    input.viewCount / 30;\\n  const engagement = Math.min(\\n    48,\\n    Math.log1p(engagementRaw) * 10,\\n  );\\n  const freshness =\\n    input.format === \'POST\'\\n      ? Math.max(0, 38 - ageHours * 0.65)\\n      : Math.max(0, 32 - activityHours * 0.22);\\n  const subscription = input.isCommunitySubscribed ? 55 : 0;\\n  const authorFollow = input.isAuthorFollowed ? 34 : 0;\\n  const tagAffinity = Math.min(\\n    28,\\n    input.matchingTagCount * 14,\\n  );\\n  const popularBonus = input.commentCount >= 5 ? 8 : 0;\\n  const pinBonus = input.isPinned ? 10 : 0;\\n  const personallyRelevant = Boolean(\\n    subscription || authorFollow || tagAffinity,\\n  );\\n  const discussed =\\n    input.recentCommentCount >= 2 ||\\n    engagement >= 20 ||\\n    input.commentCount >= 3 ||\\n    input.reactionCount >= 4 ||\\n    input.bookmarkCount >= 2;\\n\\n  const reason = input.recentCommentCount >= 3\\n    ? \'Активно обсуждается сегодня\'\\n    : subscription\\n      ? \'Вы подписаны на сообщество\'\\n      : authorFollow\\n        ? \'Вы подписаны на автора\'\\n        : tagAffinity\\n          ? \'Совпадает с вашими хэштегами\'\\n          : engagement >= 25\\n            ? \'Популярно и обсуждается\'\\n            : \'Новое на FORRUM\';\\n\\n  if (input.mode === \'new\') {\\n    return {\\n      score: input.createdAtMs,\\n      reason: \'Новое на FORRUM\',\\n      personallyRelevant,\\n      discussed,\\n    };\\n  }\\n\\n  if (input.mode === \'popular\') {\\n    const dailyDiscussion =\\n      input.recentCommentCount * 160;\\n    const ongoingDiscussion =\\n      Math.min(input.commentCount, 50) * 7;\\n    const recentActivity =\\n      Math.max(0, 72 - activityHours * 3);\\n    const supportingSignals =\\n      input.reactionCount * 3 +\\n      input.bookmarkCount * 2 +\\n      Math.log1p(input.viewCount) * 2;\\n\\n    return {\\n      score:\\n        dailyDiscussion +\\n        ongoingDiscussion +\\n        recentActivity +\\n        supportingSignals,\\n      reason,\\n      personallyRelevant,\\n      discussed,\\n    };\\n  }\\n\\n  return {\\n    score:\\n      subscription +\\n      authorFollow +\\n      tagAffinity +\\n      engagement +\\n      freshness +\\n      popularBonus +\\n      pinBonus,\\n    reason,\\n    personallyRelevant,\\n    discussed,\\n  };\\n}\\n", "apps/web/lib/types.ts": "export type Tag = {\\n  id: string;\\n  slug: string;\\n  label: string;\\n  styleEnabled: boolean;\\n  backgroundColor: string;\\n  textColor: string;\\n  borderColor: string;\\n};\\n\\nexport type PublicationCardData = {\\n  id: string;\\n  slug: string;\\n  format: \'POST\' | \'TOPIC\';\\n  type: string;\\n  title: string | null;\\n  excerpt: string;\\n  viewCount?: number;\\n  createdAt: string;\\n  savedAt?: string;\\n  lastActivityAt?: string;\\n  pinnedUntil?: string | null;\\n  reason?: string | null;\\n  feedbackEnabled?: boolean;\\n  recentCommentCount?: number;\\n  author: {\\n    username: string;\\n    displayName: string;\\n    avatarUrl?: string | null;\\n    forrumId?: number;\\n  };\\n  community: {\\n    slug: string;\\n    name: string;\\n    accentColor?: string;\\n    avatarUrl?: string | null;\\n    coverUrl?: string | null;\\n  };\\n  commentCount: number;\\n  reactionCount: number;\\n  bookmarkCount?: number;\\n  viewerReaction?: string | null;\\n  isBookmarked?: boolean;\\n  tags: Tag[];\\n  inheritedFromChild?: boolean;\\n};\\n\\nexport type Me = {\\n  user: {\\n    id: string;\\n    email: string;\\n    forrumId: number;\\n    username: string;\\n    displayName: string;\\n    avatarUrl?: string | null;\\n    emailVerified: boolean;\\n    onboardingCompleted: boolean;\\n    role: \'USER\' | \'ADMIN\' | \'OWNER\';\\n  };\\n};\\n", "apps/web/components/publication-card.tsx": "\'use client\';\\n\\nimport Link from \'next/link\';\\nimport { useRef, useState } from \'react\';\\nimport type { CSSProperties } from \'react\';\\nimport type { PublicationCardData } from \'@/lib/types\';\\nimport { api } from \'@/lib/api\';\\nimport { Avatar } from \'./avatar\';\\nimport { TagList } from \'./tag-list\';\\nimport { TelegramShareButton } from \'./telegram-share-button\';\\nimport {\\n  BookmarkIcon,\\n  CommentIcon,\\n  EyeIcon,\\n  HeartIcon,\\n} from \'./icons\';\\n\\nconst typeNames: Record<string, string> = {\\n  DISCUSSION: \'Обсуждение\',\\n  QUESTION: \'Вопрос\',\\n  NEWS: \'Новость\',\\n  GUIDE: \'Гайд\',\\n  PROJECT: \'Проект\',\\n  SERVICE: \'Услуга\',\\n  CASE: \'Кейс\',\\n  ANNOUNCEMENT: \'Объявление\',\\n};\\n\\nconst previewByCommunity: Record<string, string> = {\\n  \'forrum-start\': \'/forrum-assets/topic-forrum.svg\',\\n  \'internet-projects\': \'/forrum-assets/topic-projects.svg\',\\n  \'launches-and-teams\': \'/forrum-assets/topic-projects.svg\',\\n  promotion: \'/forrum-assets/topic-promotion.svg\',\\n  \'seo-and-traffic\': \'/forrum-assets/topic-seo.svg\',\\n  \'gta-rp\': \'/forrum-assets/topic-gta.svg\',\\n  \'majestic-rp\': \'/forrum-assets/topic-gta.svg\',\\n  telegram: \'/forrum-assets/topic-telegram.svg\',\\n  \'telegram-bots\': \'/forrum-assets/topic-telegram.svg\',\\n};\\n\\nfunction relativeDate(value: string) {\\n  const time = new Date(value).getTime();\\n  const difference = Date.now() - time;\\n\\n  if (!Number.isFinite(time)) return \'\';\\n  if (difference < 60_000) return \'только что\';\\n\\n  const minutes = Math.floor(difference / 60_000);\\n  if (minutes < 60) return `${minutes} мин. назад`;\\n\\n  const hours = Math.floor(difference / 3_600_000);\\n  if (hours < 24) return `${hours} ч. назад`;\\n\\n  const days = Math.floor(difference / 86_400_000);\\n  if (days < 14) return `${days} дн. назад`;\\n\\n  return new Date(value).toLocaleDateString(\'ru-RU\', {\\n    day: \'numeric\',\\n    month: \'short\',\\n    year:\\n      new Date(value).getFullYear() ===\\n      new Date().getFullYear()\\n        ? undefined\\n        : \'numeric\',\\n  });\\n}\\n\\nexport function PublicationCard({\\n  item,\\n  onFeedback,\\n}: {\\n  item: PublicationCardData;\\n  onFeedback?: (\\n    action: \'publication\' | \'community\',\\n    value: string,\\n  ) => void;\\n}) {\\n  const isTopic = item.format === \'TOPIC\';\\n  const pinned = Boolean(\\n    item.pinnedUntil &&\\n      new Date(item.pinnedUntil).getTime() > Date.now(),\\n  );\\n  const [feedbackState, setFeedbackState] = useState<\\n    \'publication\' | \'community\' | null\\n  >(null);\\n  const [feedbackError, setFeedbackError] = useState(\'\');\\n  const menuRef = useRef<HTMLDetailsElement>(null);\\n\\n  const showPreview =\\n    item.type === \'NEWS\' ||\\n    item.type === \'GUIDE\' ||\\n    isTopic;\\n\\n  const preview =\\n    item.community.coverUrl ||\\n    previewByCommunity[item.community.slug] ||\\n    \'/forrum-assets/topic-default.svg\';\\n\\n  async function hide(\\n    action: \'publication\' | \'community\',\\n  ) {\\n    setFeedbackState(action);\\n    setFeedbackError(\'\');\\n\\n    try {\\n      const path =\\n        action === \'publication\'\\n          ? `/feed/hidden-publications/${item.id}`\\n          : `/feed/hidden-communities/${item.community.slug}`;\\n\\n      await api(path, { method: \'POST\' });\\n      menuRef.current?.removeAttribute(\'open\');\\n      onFeedback?.(\\n        action,\\n        action === \'publication\'\\n          ? item.id\\n          : item.community.slug,\\n      );\\n    } catch (cause) {\\n      setFeedbackError(\\n        cause instanceof Error\\n          ? cause.message\\n          : \'Не удалось изменить ленту\',\\n      );\\n    } finally {\\n      setFeedbackState(null);\\n    }\\n  }\\n\\n  return (\\n    <article\\n      className={`publication-card modern-publication ${\\n        isTopic ? \'permanent-topic\' : \'short-post\'\\n      } ${showPreview ? \'with-preview\' : \'\'}`}\\n      data-community={item.community.slug}\\n      style={\\n        {\\n          \'--community-accent\':\\n            item.community.accentColor ?? \'#4C4C4C\',\\n        } as CSSProperties\\n      }\\n    >\\n      <div className=\\"publication-topline\\">\\n        <Link\\n          className=\\"community-link\\"\\n          href={`/communities/${item.community.slug}`}\\n        >\\n          {item.community.name}\\n        </Link>\\n        <span\\n          className={`format-label ${\\n            isTopic ? \'topic-label\' : \'post-label\'\\n          }`}\\n        >\\n          {isTopic ? \'Постоянная тема\' : \'Пост\'}\\n        </span>\\n        <span className=\\"type-label\\">\\n          {typeNames[item.type] ?? item.type}\\n        </span>\\n        {item.inheritedFromChild && (\\n          <span className=\\"inherited-label\\">\\n            Из подраздела\\n          </span>\\n        )}\\n        {pinned && (\\n          <span className=\\"promoted-label\\">Закреплено</span>\\n        )}\\n        {item.feedbackEnabled && (\\n          <details\\n            className=\\"publication-feedback\\"\\n            ref={menuRef}\\n          >\\n            <summary aria-label=\\"Настроить показ публикации\\">\\n              •••\\n            </summary>\\n            <div className=\\"publication-feedback-popover\\">\\n              <strong>Настроить ленту</strong>\\n              <button\\n                type=\\"button\\"\\n                disabled={Boolean(feedbackState)}\\n                onClick={() => hide(\'publication\')}\\n              >\\n                {feedbackState === \'publication\'\\n                  ? \'Скрываем…\'\\n                  : \'Не показывать эту публикацию\'}\\n              </button>\\n              <button\\n                type=\\"button\\"\\n                disabled={Boolean(feedbackState)}\\n                onClick={() => hide(\'community\')}\\n              >\\n                {feedbackState === \'community\'\\n                  ? \'Скрываем…\'\\n                  : `Меньше из «${item.community.name}»`}\\n              </button>\\n              <Link href=\\"/settings/interests\\">\\n                Подписки и рекомендации\\n              </Link>\\n              {feedbackError && (\\n                <span className=\\"error-text\\">\\n                  {feedbackError}\\n                </span>\\n              )}\\n            </div>\\n          </details>\\n        )}\\n      </div>\\n\\n      <div className=\\"publication-content-row\\">\\n        {showPreview && (\\n          <Link\\n            className=\\"publication-preview\\"\\n            href={`/p/${item.slug}`}\\n            aria-label={`Открыть «${item.title ?? item.excerpt}»`}\\n          >\\n            <img src={preview} alt=\\"\\" />\\n          </Link>\\n        )}\\n\\n        <Avatar\\n          name={item.author.displayName}\\n          size={44}\\n          url={item.author.avatarUrl}\\n        />\\n\\n        <div className=\\"publication-content\\">\\n          <div className=\\"publication-author-inline\\">\\n            <Link\\n              className=\\"user-accent\\"\\n              data-username={item.author.username}\\n              href={`/u/${item.author.username}`}\\n            >\\n              <strong>{item.author.displayName}</strong>\\n            </Link>\\n            <span>{relativeDate(item.createdAt)}</span>\\n          </div>\\n\\n          <Link\\n            className=\\"publication-main\\"\\n            href={`/p/${item.slug}`}\\n          >\\n            {item.title && <h2>{item.title}</h2>}\\n            <p>{item.excerpt}</p>\\n          </Link>\\n\\n          <TagList tags={item.tags} />\\n\\n          <div className=\\"publication-bottom\\">\\n            <TelegramShareButton\\n              slug={item.slug}\\n              compact\\n            />\\n            <div\\n              className=\\"publication-stats\\"\\n              aria-label=\\"Статистика публикации\\"\\n            >\\n              <span title=\\"Ответы\\">\\n                <CommentIcon /> {item.commentCount}\\n              </span>\\n              <span title=\\"Просмотры\\">\\n                <EyeIcon /> {item.viewCount ?? 0}\\n              </span>\\n              <span title=\\"Реакции\\">\\n                <HeartIcon /> {item.reactionCount}\\n              </span>\\n              {Boolean(\\n                item.bookmarkCount &&\\n                  item.bookmarkCount > 0,\\n              ) && (\\n                <span title=\\"Сохранения\\">\\n                  <BookmarkIcon /> {item.bookmarkCount}\\n                </span>\\n              )}\\n            </div>\\n            {item.reason && (\\n              <span className=\\"feed-reason\\">\\n                {item.reason}\\n              </span>\\n            )}\\n          </div>\\n        </div>\\n      </div>\\n    </article>\\n  );\\n}\\n", "scripts/ui-interaction-check.mjs": "import fs from \'node:fs\';\\n\\nfunction read(path) {\\n  return fs.readFileSync(path, \'utf8\');\\n}\\n\\nfunction requireMarker(source, marker, label) {\\n  if (!source.includes(marker)) {\\n    throw new Error(`${label}: missing ${marker}`);\\n  }\\n}\\n\\nfunction forbidMarker(source, marker, label) {\\n  if (source.includes(marker)) {\\n    throw new Error(`${label}: forbidden ${marker}`);\\n  }\\n}\\n\\nconst home = read(\'apps/web/components/home-dashboard.tsx\');\\nconst catalogue = read(\\n  \'apps/web/app/communities/communities-client.tsx\',\\n);\\nconst ranking = read(\'apps/api/src/feed/ranking.ts\');\\nconst feed = read(\'apps/api/src/feed/feed.service.ts\');\\nconst css = read(\'apps/web/app/globals.css\');\\n\\nfor (const marker of [\\n  \'home-tree-link\',\\n  \'home-tree-hitarea\',\\n  \'home-tree-toggle\',\\n  \\"event.key === \'ArrowRight\'\\",\\n  \\"event.key === \'ArrowLeft\'\\",\\n  \'navigationIcon(community.slug)\',\\n]) {\\n  requireMarker(home, marker, \'home tree\');\\n}\\n\\nfor (const marker of [\\n  \'community-browser-main-link\',\\n  \'community-browser-hitarea\',\\n  \'community-browser-chevron\',\\n  \\"event.key === \'ArrowRight\'\\",\\n  \\"event.key === \'ArrowLeft\'\\",\\n  \'navigationIcon(item.slug)\',\\n]) {\\n  requireMarker(catalogue, marker, \'community catalogue tree\');\\n}\\n\\nforbidMarker(home, \\"\'unanswered\'\\", \'home feed\');\\nforbidMarker(home, \'Без ответа\', \'home feed\');\\nforbidMarker(home, \'Все категории\', \'home tree\');\\n\\nrequireMarker(\\n  ranking,\\n  \'recentCommentCount * 160\',\\n  \'popular ranking\',\\n);\\nrequireMarker(\\n  feed,\\n  \'recentCommentSince\',\\n  \'recent comment query\',\\n);\\nrequireMarker(\\n  feed,\\n  \'recentCommentCount: publication.comments.length\',\\n  \'recent comment result\',\\n);\\n\\nfor (const marker of [\\n  \'FORRUM_CANONICAL_INTERFACE_V8\',\\n  \'.home-tree-hitarea\',\\n  \'.community-browser-hitarea\',\\n  \'.home-topic-visual\',\\n  \'.publication-preview\',\\n]) {\\n  requireMarker(css, marker, \'canonical CSS\');\\n}\\n\\nconst obsoleteWorkflows = [\\n  \'.github/workflows/forrum-ssr-routes-qa-v6-1.yml\',\\n  \'.github/workflows/forrum-ssr-routes-qa-v6-3.yml\',\\n  \'.gi