],\\n      bodies: [\\n        \'Предлагаю фиксировать не только позиции, но и дату изменения сниппета.\',\\n        \'На небольшом проекте сильнее всего сработала переработка структуры, а не новые тексты.\',\\n        \'Добавил бы шаблон таблицы до и после эксперимента.\',\\n      ],\\n    },\\n    {\\n      slug: \'launch-diary-template\',\\n      authors: [maxstream.id, nora.id],\\n      bodies: [\\n        \'В дневнике запуска важно отделить проверенную гипотезу от следующего предположения.\',\\n        \'Нужен короткий блок: что изменилось за сутки и какой следующий измеримый шаг.\',\\n      ],\\n    },\\n  ];\\n\\n  for (const topic of activeTopics) {\\n    const publication = await prisma.publication.findUnique({\\n      where: { slug: topic.slug },\\n    });\\n    if (!publication) continue;\\n\\n    for (let index = 0; index < topic.bodies.length; index += 1) {\\n      const body = topic.bodies[index];\\n      const authorId = topic.authors[index];\\n      const existing = await prisma.comment.findFirst({\\n        where: {\\n          publicationId: publication.id,\\n          authorId,\\n          body,\\n        },\\n      });\\n      if (!existing) {\\n        await prisma.comment.create({\\n          data: {\\n            publicationId: publication.id,\\n            authorId,\\n            body,\\n            createdAt: new Date(\\n              Date.now() - (index + 1) * 70 * 60 * 1000,\\n            ),\\n          },\\n        });\\n      }\\n    }\\n\\n    await prisma.publication.update({\\n      where: { id: publication.id },\\n      data: { lastActivityAt: new Date() },\\n    });\\n  }\\n\\n  const extraTags = [\\n    { slug: \'telegram\', label: \'telegram\' },\\n    { slug: \'seo\', label: \'seo\' },\\n    { slug: \'startup\', label: \'стартап\' },\\n    { slug: \'gta-rp\', label: \'gta-rp\' },\\n  ];\\n\\n  for (const tag of extraTags) {\\n    await prisma.tag.upsert({\\n      where: { slug: tag.slug },\\n      update: {\\n        label: tag.label,\\n        styleEnabled: true,\\n        backgroundColor: \'#F4F4F1\',\\n        textColor: \'#333331\',\\n        borderColor: \'#CFCFCA\',\\n      },\\n      create: {\\n        ...tag,\\n        styleEnabled: true,\\n        backgroundColor: \'#F4F4F1\',\\n        textColor: \'#333331\',\\n        borderColor: \'#CFCFCA\',\\n      },\\n    });\\n  }\\n\\n  const publicationTags = [\\n    [\'telegram-update-discussion\', \'telegram\'],\\n    [\'telegram-bot-launch-checklist\', \'telegram\'],\\n    [\'seo-experiment-log\', \'seo\'],\\n    [\'launch-diary-template\', \'startup\'],\\n    [\'gta-rp-new-player-start\', \'gta-rp\'],\\n  ] as const;\\n\\n  for (const [publicationSlug, tagSlug] of publicationTags) {\\n    const [publication, tag] = await Promise.all([\\n      prisma.publication.findUnique({\\n        where: { slug: publicationSlug },\\n      }),\\n      prisma.tag.findUnique({\\n        where: { slug: tagSlug },\\n      }),\\n    ]);\\n\\n    if (!publication || !tag) continue;\\n\\n    await prisma.publicationTag.upsert({\\n      where: {\\n        publicationId_tagId: {\\n          publicationId: publication.id,\\n          tagId: tag.id,\\n        },\\n      },\\n      update: {},\\n      create: {\\n        publicationId: publication.id,\\n        tagId: tag.id,\\n      },\\n    });\\n  }\\n"}')

        def read(path: str) -> str:
            target = ROOT / path
            if not target.exists():
                raise RuntimeError(f'Missing source file: {path}')
            return target.read_text(encoding='utf-8')

        def write(path: str, content: str) -> None:
            target = ROOT / path
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_text(content.rstrip() + '\n', encoding='utf-8')

        def replace_once(source: str, old: str, new: str, label: str) -> str:
            count = source.count(old)
            if count != 1:
                raise RuntimeError(f'{label}: expected one match, got {count}')
            return source.replace(old, new, 1)

        def replace_between(
            source: str,
            start_marker: str,
            end_marker: str,
            replacement: str,
            label: str,
        ) -> str:
            start = source.find(start_marker)
            if start < 0:
                raise RuntimeError(
                    f'{label}: start marker not found: {start_marker!r}'
                )
            end = source.find(end_marker, start)
            if end < 0:
                raise RuntimeError(
                    f'{label}: end marker not found: {end_marker!r}'
                )
            if end <= start:
                raise RuntimeError(f'{label}: invalid marker order')
            return source[:start] + replacement.rstrip() + '\n' + source[end:]

        # 1. Canonical full files and project-owned SVG assets.
        for path, content in PAYLOAD['files'].items():
            write(path, content)

        for path, content in PAYLOAD['assets'].items():
            write(path, content)
            ET.fromstring(content)

        # 2. Keep exactly one canonical workflow.
        workflow_dir = ROOT / '.github/workflows'
        canonical_workflow = workflow_dir / 'forrum-canonical-interface-v8.yml'
        if not canonical_workflow.exists():
            raise RuntimeError(
                'Upload this file exactly as '
                '.github/workflows/forrum-canonical-interface-v8.yml'
            )

        for candidate in workflow_dir.iterdir():
            if (
                candidate.is_file()
                and candidate.suffix in {'.yml', '.yaml'}
                and candidate.name != canonical_workflow.name
            ):
                candidate.unlink()

        # 3. Append the V8 visual system once.
        css_path = 'apps/web/app/globals.css'
        css = read(css_path)
        css_start = '/* FORRUM_CANONICAL_INTERFACE_V8'
        css_end = '/* END_FORRUM_CANONICAL_INTERFACE_V8 */'

        if css_start in css:
            start = css.index(css_start)
            end = css.find(css_end, start)
            if end < 0:
                raise RuntimeError('Existing V8 CSS block has no end marker')
            css = css[:start] + css[end + len(css_end):]

        css = (
            css.rstrip()
            + '\n\n'
            + PAYLOAD['css'].strip()
            + '\n'
            + css_end
            + '\n'
        )
        write(css_path, css)

