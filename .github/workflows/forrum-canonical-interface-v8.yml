name: FORRUM Canonical Interface V8
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forrum
          POSTGRES_PASSWORD: forrum
          POSTGRES_DB: forrum_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U forrum -d forrum_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_test
      API_INTERNAL_URL: http://127.0.0.1:4000/v1
      PUBLIC_API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      API_PORT: '4000'
      PORT: '3000'
    steps:
    - name: Checkout main branch
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Apply SSR route and auth fixes safely
      shell: bash
      run: |-
        python3 <<'PY'
        from pathlib import Path
        import json
        import os

        STATIC_FILES = json.loads('{"apps/web/lib/server-api.ts":"import { cookies } from \'next/headers\';\\nimport { redirect } from \'next/navigation\';\\nimport { resolveApiBase } from \'@/lib/api-base\';\\nimport type { Me } from \'@/lib/types\';\\n\\ntype ServerApiOptions = {\\n  timeoutMs?: number;\\n};\\n\\nexport async function serverApi<T>(\\n  path: string,\\n  options: ServerApiOptions = {},\\n): Promise<T | null> {\\n  const cookieStore = await cookies();\\n  const cookieHeader = cookieStore\\n    .getAll()\\n    .map(({ name, value }) => `${name}=${value}`)\\n    .join(\'; \');\\n\\n  const controller = new AbortController();\\n  const timeout = setTimeout(\\n    () => controller.abort(),\\n    options.timeoutMs ?? 15_000,\\n  );\\n\\n  try {\\n    const response = await fetch(\\n      `${resolveApiBase()}${path}`,\\n      {\\n        cache: \'no-store\',\\n        headers: {\\n          Accept: \'application/json\',\\n          ...(cookieHeader\\n            ? { Cookie: cookieHeader }\\n            : {}),\\n        },\\n        signal: controller.signal,\\n      },\\n    );\\n\\n    if (\\n      response.status === 401 ||\\n      response.status === 404\\n    ) {\\n      return null;\\n    }\\n\\n    if (!response.ok) {\\n      throw new Error(\\n        `API ${path} вернул статус ${response.status}`,\\n      );\\n    }\\n\\n    return (await response.json()) as T;\\n  } catch (cause) {\\n    if (\\n      cause instanceof Error &&\\n      cause.name === \'AbortError\'\\n    ) {\\n      throw new Error(\\n        `API ${path} не ответил за ${\\n          options.timeoutMs ?? 15_000\\n        } мс`,\\n      );\\n    }\\n\\n    throw cause;\\n  } finally {\\n    clearTimeout(timeout);\\n  }\\n}\\n\\nexport async function requireUser(nextPath: string) {\\n  const me = await serverApi<Me>(\'/auth/me\');\\n\\n  if (!me) {\\n    redirect(\\n      `/login?next=${encodeURIComponent(nextPath)}`,\\n    );\\n  }\\n\\n  return me;\\n}\\n","apps/web/app/error.tsx":"\'use client\';\\n\\nimport { useEffect } from \'react\';\\n\\nexport default function GlobalError({\\n  error,\\n  reset,\\n}: {\\n  error: Error & { digest?: string };\\n  reset: () => void;\\n}) {\\n  useEffect(() => {\\n    console.error(error);\\n  }, [error]);\\n\\n  return (\\n    <section className=\\"route-state route-state-error\\">\\n      <strong>Раздел не удалось открыть</strong>\\n      <p>\\n        Данные не потеряны. Повторите запрос или\\n        вернитесь на главную.\\n      </p>\\n      <div className=\\"inline-actions\\">\\n        <button\\n          type=\\"button\\"\\n          className=\\"button\\"\\n          onClick={reset}\\n        >\\n          Повторить\\n        </button>\\n        <a className=\\"button ghost\\" href=\\"/\\">\\n          На главную\\n        </a>\\n      </div>\\n      {error.digest && (\\n        <small>Код ошибки: {error.digest}</small>\\n      )}\\n    </section>\\n  );\\n}\\n","apps/web/app/loading.tsx":"export default function GlobalLoading() {\\n  return (\\n    <section\\n      className=\\"route-state route-state-loading\\"\\n      aria-live=\\"polite\\"\\n      aria-busy=\\"true\\"\\n    >\\n      <span className=\\"route-spinner\\" aria-hidden=\\"true\\" />\\n      <strong>Загружаем раздел</strong>\\n      <p>Обычно это занимает несколько секунд.</p>\\n    </section>\\n  );\\n}\\n","apps/web/app/not-found.tsx":"import Link from \'next/link\';\\n\\nexport default function NotFound() {\\n  return (\\n    <section className=\\"route-state\\">\\n      <strong>Страница не найдена</strong>\\n      <p>\\n        Материал мог быть удалён, перемещён или\\n        закрыт для просмотра.\\n      </p>\\n      <Link className=\\"button\\" href=\\"/\\">\\n        Вернуться на главную\\n      </Link>\\n    </section>\\n  );\\n}\\n","apps/web/app/communities/proposals/proposals-client.tsx":"\'use client\';\\n\\nimport Link from \'next/link\';\\nimport type { FormEvent } from \'react\';\\nimport { useState } from \'react\';\\nimport { api } from \'@/lib/api\';\\nimport type { Me } from \'@/lib/types\';\\n\\nexport type Proposal = {\\n  id: string;\\n  name: string;\\n  description: string;\\n  initialTopics: string;\\n  status: string;\\n  supportCount: number;\\n  supportedByViewer: boolean;\\n  author: {\\n    username: string;\\n    displayName: string;\\n  };\\n  suggestedParent: {\\n    slug: string;\\n    name: string;\\n  } | null;\\n  resolutionNote: string | null;\\n};\\n\\nexport function ProposalsClient({\\n  initialItems,\\n  initialMe,\\n}: {\\n  initialItems: Proposal[];\\n  initialMe: Me | null;\\n}) {\\n  const [items, setItems] =\\n    useState<Proposal[]>(initialItems);\\n  const [error, setError] = useState(\'\');\\n  const [message, setMessage] = useState(\'\');\\n\\n  async function load() {\\n    try {\\n      setItems(\\n        await api<Proposal[]>(\\n          \'/governance/proposals\',\\n        ),\\n      );\\n    } catch (cause) {\\n      setError(\\n        cause instanceof Error\\n          ? cause.message\\n          : \'Не удалось загрузить предложения\',\\n      );\\n    }\\n  }\\n\\n  async function support(id: string) {\\n    try {\\n      setError(\'\');\\n      await api(\\n        `/governance/proposals/${id}/support`,\\n        { method: \'POST\' },\\n      );\\n      await load();\\n    } catch (cause) {\\n      setError(\\n        cause instanceof Error\\n          ? cause.message\\n          : \'Не удалось изменить поддержку\',\\n      );\\n    }\\n  }\\n\\n  async function create(\\n    event: FormEvent<HTMLFormElement>,\\n  ) {\\n    event.preventDefault();\\n\\n    if (!initialMe) {\\n      setError(\\n        \'Войдите в аккаунт, чтобы предложить сообщество.\',\\n      );\\n      return;\\n    }\\n\\n    try {\\n      setError(\'\');\\n      setMessage(\'\');\\n\\n      const payload = Object.fromEntries(\\n        new FormData(event.currentTarget),\\n      ) as Record<string, string>;\\n\\n      if (!payload.parentSlug?.trim()) {\\n        delete payload.parentSlug;\\n      }\\n\\n      await api(\'/governance/proposals\', {\\n        method: \'POST\',\\n        body: JSON.stringify(payload),\\n      });\\n\\n      setMessage(\'Предложение опубликовано\');\\n      event.currentTarget.reset();\\n      await load();\\n    } catch (cause) {\\n      setError(\\n        cause instanceof Error\\n          ? cause.message\\n          : \'Не удалось опубликовать предложение\',\\n      );\\n    }\\n  }\\n\\n  return (\\n    <>\\n      <header className=\\"compact-page-heading\\">\\n        <div>\\n          <h1>Предложения сообществ</h1>\\n          <p>\\n            Новые разделы появляются при реальном\\n            спросе и понятном первом наборе тем.\\n          </p>\\n        </div>\\n        <Link\\n          className=\\"button ghost\\"\\n          href=\\"/communities\\"\\n        >\\n          Каталог\\n        </Link>\\n      </header>\\n\\n      {message && (\\n        <div className=\\"success-box\\">{message}</div>\\n      )}\\n      {error && (\\n        <div className=\\"error-box\\" role=\\"alert\\">\\n          {error}\\n        </div>\\n      )}\\n\\n      <div className=\\"two-column\\">\\n        <main className=\\"publication-list\\">\\n          {items.map((proposal) => (\\n            <article\\n              className=\\"card\\"\\n              key={proposal.id}\\n            >\\n              <div className=\\"publication-topline\\">\\n                <span className=\\"type-label\\">\\n                  {proposal.status}\\n                </span>\\n                {proposal.suggestedParent && (\\n                  <Link\\n                    href={`/communities/${proposal.suggestedParent.slug}`}\\n                  >\\n                    Внутри{\' \'}\\n                    {proposal.suggestedParent.name}\\n                  </Link>\\n                )}\\n              </div>\\n\\n              <h2>{proposal.name}</h2>\\n              <p>{proposal.description}</p>\\n\\n              <div className=\\"notice\\">\\n                <strong>Первые темы</strong>\\n                <p>{proposal.initialTopics}</p>\\n              </div>\\n\\n              <p className=\\"muted small-text\\">\\n                Предложил @{proposal.author.username}\\n              </p>\\n\\n              {proposal.resolutionNote && (\\n                <p className=\\"muted\\">\\n                  Решение: {proposal.resolutionNote}\\n                </p>\\n              )}\\n\\n              {proposal.status === \'OPEN\' &&\\n                (initialMe ? (\\n                  <button\\n                    type=\\"button\\"\\n                    className={`button small ${\\n                      proposal.supportedByViewer\\n                        ? \'secondary\'\\n                        : \'\'\\n                    }`}\\n                    onClick={() =>\\n                      void support(proposal.id)\\n                    }\\n                  >\\n                    {proposal.supportedByViewer\\n                      ? \'Убрать поддержку\'\\n                      : \'Поддержать\'}{\' \'}\\n                    · {proposal.supportCount}\\n                  </button>\\n                ) : (\\n                  <Link\\n                    className=\\"button ghost small\\"\\n                    href=\\"/login?next=%2Fcommunities%2Fproposals\\"\\n                  >\\n                    Войти, чтобы поддержать ·{\' \'}\\n                    {proposal.supportCount}\\n                  </Link>\\n                ))}\\n            </article>\\n          ))}\\n\\n          {!items.length && (\\n            <div className=\\"compact-empty-state\\">\\n              <strong>Предложений пока нет</strong>\\n              <span>\\n                Первое содержательное предложение\\n                появится здесь.\\n              </span>\\n            </div>\\n          )}\\n        </main>\\n\\n        <aside className=\\"card\\">\\n          <h2>Предложить сообщество</h2>\\n\\n          {initialMe ? (\\n            <form onSubmit={create}>\\n              <label>\\n                Название\\n                <input\\n                  name=\\"name\\"\\n                  minLength={2}\\n                  maxLength={80}\\n                  required\\n                />\\n              </label>\\n\\n              <label>\\n                Зачем оно нужно\\n                <textarea\\n                  name=\\"description\\"\\n                  minLength={30}\\n                  maxLength={3000}\\n                  required\\n                />\\n              </label>\\n\\n              <label>\\n                Примеры первых тем\\n                <textarea\\n                  name=\\"initialTopics\\"\\n                  minLength={10}\\n                  maxLength={2000}\\n                  required\\n                />\\n              </label>\\n\\n              <label>\\n                Родительский адрес, необязательно\\n                <input\\n                  name=\\"parentSlug\\"\\n                  placeholder=\\"gta-rp\\"\\n                />\\n              </label>\\n\\n              <button className=\\"button\\">\\n                Опубликовать\\n              </button>\\n            </form>\\n          ) : (\\n            <div className=\\"auth-required-panel\\">\\n              <p>\\n                Предложения и поддержка доступны\\n                после входа. Просматривать идеи\\n                можно без регистрации.\\n              </p>\\n              <Link\\n                className=\\"button\\"\\n                href=\\"/login?next=%2Fcommunities%2Fproposals\\"\\n              >\\n                Войти\\n              </Link>\\n            </div>\\n          )}\\n        </aside>\\n      </div>\\n    </>\\n  );\\n}\\n","apps/web/app/communities/proposals/page.tsx":"import {\\n  ProposalsClient,\\n  type Proposal,\\n} from \'./proposals-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\nimport type { Me } from \'@/lib/types\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function ProposalsPage() {\\n  const [items, me] = await Promise.all([\\n    serverApi<Proposal[]>(\\n      \'/governance/proposals\',\\n    ),\\n    serverApi<Me>(\'/auth/me\'),\\n  ]);\\n\\n  return (\\n    <ProposalsClient\\n      initialItems={items ?? []}\\n      initialMe={me}\\n    />\\n  );\\n}\\n","apps/web/app/communities/page.tsx":"import {\\n  CommunitiesClient,\\n  type Community,\\n} from \'./communities-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function CommunitiesPage() {\\n  const items =\\n    (await serverApi<Community[]>(\\n      \'/communities\',\\n    )) ?? [];\\n\\n  return (\\n    <CommunitiesClient initialItems={items} />\\n  );\\n}\\n","apps/web/app/events/page.tsx":"import {\\n  EventsClient,\\n  type EventItem,\\n  type Poll,\\n} from \'./events-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\nimport type { PublicationCardData } from \'@/lib/types\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function EventsPage() {\\n  const [events, polls, announcements] =\\n    await Promise.all([\\n      serverApi<EventItem[]>(\'/events\'),\\n      serverApi<Poll[]>(\'/governance/polls\'),\\n      serverApi<PublicationCardData[]>(\\n        \'/announcements\',\\n      ),\\n    ]);\\n\\n  return (\\n    <EventsClient\\n      initialEvents={events ?? []}\\n      initialPolls={polls ?? []}\\n      initialAnnouncements={announcements ?? []}\\n    />\\n  );\\n}\\n","apps/web/app/media/page.tsx":"import {\\n  MediaClient,\\n  type Partner,\\n} from \'./media-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\nimport type { PublicationCardData } from \'@/lib/types\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function MediaPage() {\\n  const [partners, materials] =\\n    await Promise.all([\\n      serverApi<Partner[]>(\'/media/partners\'),\\n      serverApi<PublicationCardData[]>(\'/news\'),\\n    ]);\\n\\n  return (\\n    <MediaClient\\n      initialPartners={partners ?? []}\\n      initialMaterials={materials ?? []}\\n    />\\n  );\\n}\\n","apps/web/app/workshop/page.tsx":"import {\\n  WorkshopClient,\\n  type Item,\\n} from \'./workshop-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function WorkshopPage() {\\n  const items =\\n    (await serverApi<Item[]>(\'/workshop\')) ?? [];\\n\\n  return <WorkshopClient initialItems={items} />;\\n}\\n","apps/web/app/communities/[slug]/page.tsx":"import { notFound } from \'next/navigation\';\\nimport {\\n  CommunityClient,\\n  type Community,\\n} from \'./community-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function CommunityPage({\\n  params,\\n}: {\\n  params: Promise<{ slug: string }>;\\n}) {\\n  const { slug } = await params;\\n  const data = await serverApi<Community>(\\n    `/communities/${encodeURIComponent(slug)}`,\\n  );\\n\\n  if (!data) notFound();\\n\\n  return (\\n    <CommunityClient\\n      slug={slug}\\n      initialData={data}\\n    />\\n  );\\n}\\n","apps/web/app/events/[id]/page.tsx":"import { notFound } from \'next/navigation\';\\nimport {\\n  EventDetailClient,\\n  type EventDetail,\\n} from \'./event-detail-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function EventDetailPage({\\n  params,\\n}: {\\n  params: Promise<{ id: string }>;\\n}) {\\n  const { id } = await params;\\n  const data = await serverApi<EventDetail>(\\n    `/events/${encodeURIComponent(id)}`,\\n  );\\n\\n  if (!data) notFound();\\n\\n  return (\\n    <EventDetailClient\\n      id={id}\\n      initialData={data}\\n    />\\n  );\\n}\\n","apps/web/app/p/[slug]/page.tsx":"import { notFound } from \'next/navigation\';\\nimport {\\n  PublicationClient,\\n  type Publication,\\n} from \'./publication-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function PublicationPage({\\n  params,\\n}: {\\n  params: Promise<{ slug: string }>;\\n}) {\\n  const { slug } = await params;\\n  const data = await serverApi<Publication>(\\n    `/publications/${encodeURIComponent(\\n      slug,\\n    )}?trackView=0`,\\n  );\\n\\n  if (!data) notFound();\\n\\n  return (\\n    <PublicationClient\\n      slug={slug}\\n      initialData={data}\\n    />\\n  );\\n}\\n","apps/web/app/u/[username]/page.tsx":"import { notFound } from \'next/navigation\';\\nimport {\\n  ProfileClient,\\n  type Profile,\\n} from \'./profile-client\';\\nimport { serverApi } from \'@/lib/server-api\';\\n\\nexport const dynamic = \'force-dynamic\';\\n\\nexport default async function ProfilePage({\\n  params,\\n}: {\\n  params: Promise<{ username: string }>;\\n}) {\\n  const { username } = await params;\\n  const data = await serverApi<Profile>(\\n    `/users/${encodeURIComponent(username)}`,\\n  );\\n\\n  if (!data) notFound();\\n\\n  return (\\n    <ProfileClient\\n      username={username}\\n      initialData={data}\\n    />\\n  );\\n}\\n","apps/web/proxy.ts":"import type { NextRequest } from \'next/server\';\\nimport { NextResponse } from \'next/server\';\\n\\nconst DEFAULT_SESSION_COOKIE = \'forrum_session\';\\n\\nfunction getSessionCookieName() {\\n  return (\\n    process.env.SESSION_COOKIE_NAME?.trim() ||\\n    DEFAULT_SESSION_COOKIE\\n  );\\n}\\n\\n// FORRUM_AUTH_PROXY_V6_10\\nexport function proxy(request: NextRequest) {\\n  const cookieName = getSessionCookieName();\\n\\n  if (request.cookies.has(cookieName)) {\\n    return NextResponse.next();\\n  }\\n\\n  const loginUrl = new URL(\'/login\', request.url);\\n  const nextPath =\\n    request.nextUrl.pathname +\\n    request.nextUrl.search;\\n\\n  loginUrl.searchParams.set(\'next\', nextPath);\\n\\n  return NextResponse.redirect(loginUrl);\\n}\\n\\nexport const config = {\\n  matcher: [\\n    \'/messages/:path*\',\\n    \'/create\',\\n    \'/notifications/:path*\',\\n    \'/settings/:path*\',\\n    \'/saved/:path*\',\\n    \'/subscriptions/:path*\',\\n    \'/wallet/:path*\',\\n    \'/interactions/:path*\',\\n    \'/portfolio/:path*\',\\n    \'/admin/:path*\',\\n  ],\\n};\\n"}')
