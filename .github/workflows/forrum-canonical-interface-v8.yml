Arial, sans-serif\\" font-size=\\"18\\" letter-spacing=\\"3\\" fill=\\"#606176\\">FORRUM / COMMUNITY</text>\\n  <text x=\\"48\\" y=\\"154\\" font-family=\\"Arial, sans-serif\\" font-size=\\"44\\" font-weight=\\"700\\" fill=\\"#1d1d1d\\">GTA RP</text>\\n  <text x=\\"48\\" y=\\"204\\" font-family=\\"Arial, sans-serif\\" font-size=\\"20\\" fill=\\"#666\\">Обсуждения, материалы и команда сообщества</text>\\n</svg>", "apps/web/public/forrum-assets/cover-telegram.svg": "<svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"1200\\" height=\\"360\\" viewBox=\\"0 0 1200 360\\">\\n  <rect width=\\"1200\\" height=\\"360\\" fill=\\"#f8f8f6\\"/>\\n  <path d=\\"M0 0h14v360H0z\\" fill=\\"#526c78\\"/>\\n  <path d=\\"M720 0h480v360H720z\\" fill=\\"#f1f1ee\\"/>\\n  <path d=\\"M760 90h330M760 145h220M760 200h280\\" stroke=\\"#d5d5d1\\" stroke-width=\\"3\\"/>\\n  <text x=\\"48\\" y=\\"84\\" font-family=\\"Arial, sans-serif\\" font-size=\\"18\\" letter-spacing=\\"3\\" fill=\\"#526c78\\">FORRUM / COMMUNITY</text>\\n  <text x=\\"48\\" y=\\"154\\" font-family=\\"Arial, sans-serif\\" font-size=\\"44\\" font-weight=\\"700\\" fill=\\"#1d1d1d\\">Telegram</text>\\n  <text x=\\"48\\" y=\\"204\\" font-family=\\"Arial, sans-serif\\" font-size=\\"20\\" fill=\\"#666\\">Обсуждения, материалы и команда сообщества</text>\\n</svg>"}, "css": "/* FORRUM_FINAL_MONOCHROME_V7\\n   Canonical light, dense forum interface. */\\n\\n:root {\\n  color-scheme: light;\\n  --bg: #f7f7f6;\\n  --surface: #ffffff;\\n  --surface-soft: #fafaf9;\\n  --text: #181818;\\n  --muted: #6b6b6b;\\n  --line: #d8d8d6;\\n  --line-strong: #bdbdb9;\\n  --accent: #4c4c4c;\\n  --accent-soft: #efefed;\\n  --danger: #a12f2f;\\n  --danger-soft: #fff4f3;\\n  --success: #336b53;\\n  --success-soft: #f1f8f4;\\n  --warning: #7a6328;\\n  --warning-soft: #faf7ea;\\n  --shadow: none;\\n}\\n\\nhtml,\\nbody {\\n  background: var(--bg);\\n}\\n\\nbody {\\n  color: var(--text);\\n  font-family: Arial, \\"Helvetica Neue\\", ui-sans-serif, system-ui, sans-serif;\\n  font-size: 14px;\\n}\\n\\nbody::before,\\nbody::after {\\n  display: none !important;\\n}\\n\\n.shell {\\n  width: min(1480px, calc(100% - 36px));\\n}\\n\\n.header {\\n  border-bottom: 1px solid var(--line);\\n  background: rgba(255, 255, 255, .98);\\n  backdrop-filter: none;\\n}\\n\\n.nav {\\n  min-height: 56px;\\n  gap: 18px;\\n}\\n\\n.brand {\\n  font-size: 22px;\\n  letter-spacing: -.035em;\\n}\\n\\n.brand-mark {\\n  width: 30px;\\n  height: 30px;\\n  border-radius: 2px;\\n  background: #4b4b4b;\\n  box-shadow: none;\\n}\\n\\n.main-links {\\n  gap: 4px;\\n}\\n\\n.main-links a {\\n  min-height: 56px;\\n  padding: 0 13px;\\n  border-bottom: 2px solid transparent;\\n  border-radius: 0;\\n  color: #343434;\\n  font-weight: 700;\\n}\\n\\n.main-links a:hover,\\n.main-links a.active {\\n  color: #111;\\n  background: transparent;\\n  border-bottom-color: #4b4b4b;\\n}\\n\\n.header-search {\\n  width: min(360px, 30vw);\\n}\\n\\n.header-search input,\\n.header-search button {\\n  min-height: 36px;\\n  border-radius: 3px;\\n}\\n\\n.icon-links a {\\n  width: 34px;\\n  height: 34px;\\n  border-radius: 3px;\\n}\\n\\n.button,\\n.auth-actions .button {\\n  min-height: 36px;\\n  padding: 8px 14px;\\n  border-radius: 4px;\\n  background: #4b4b4b;\\n  box-shadow: none;\\n}\\n\\n.button:hover {\\n  background: #373737;\\n  filter: none;\\n}\\n\\n.button.secondary {\\n  background: #ececea;\\n  color: #282828;\\n}\\n\\n.button.ghost {\\n  background: #fff;\\n  color: #202020;\\n  border: 1px solid var(--line-strong);\\n}\\n\\n.button.small {\\n  min-height: 31px;\\n  padding: 6px 11px;\\n  font-size: 13px;\\n}\\n\\n.main {\\n  padding-block: 14px 64px;\\n}\\n\\n.card,\\n.sidebar-card,\\n.compact-page-heading,\\n.compact-filterbar,\\n.home-commandbar,\\n.home-community-tree,\\n.home-discussion-panel,\\n.home-current-panel,\\n.home-list-panel,\\n.community-browser-index,\\n.community-browser-list,\\n.community-profile,\\n.child-community-strip,\\n.parent-aggregation-note,\