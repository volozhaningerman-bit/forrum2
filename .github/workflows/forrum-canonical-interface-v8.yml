                        </div>
                      \)\}'''
        )
        workshop, thumb_count = thumbnail_pattern.subn(
            '''              <div className="workshop-preview">
                        <img
                          src={
                            item.thumbnailUrl ||
                            workshopPreviewByType[item.type] ||
                            '/forrum-assets/workshop-badge.svg'
                          }
                          alt={`Превью работы «${item.title}»`}
                        />
                      </div>''',
            workshop,
            count=1,
        )
        if thumb_count == 0 and 'className="workshop-preview"' not in workshop:
            raise RuntimeError('workshop thumbnail block was not found')

        author_pattern = re.compile(
            r'''                <small>
                          @\{item\.author\.username\} · ID\{' '\}
                          \{item\.author\.forrumId\}
                        </small>'''
        )
        workshop, author_count = author_pattern.subn(
            '''                <div className="workshop-author-line">
                          <Avatar
                            name={item.author.displayName}
                            size={24}
                            url={item.author.avatarUrl}
                          />
                          <small>
                            @{item.author.username} · ID{' '}
                            {item.author.forrumId}
                          </small>
                        </div>''',
            workshop,
            count=1,
        )
        if author_count == 0 and 'workshop-author-line' not in workshop:
            raise RuntimeError('workshop author block was not found')
        write(workshop_path, workshop)

        # 8. APIs expose visual fields.
        community_service_path = 'apps/api/src/communities/communities.service.ts'
        community_service = read(community_service_path)
        publication_community_line = (
            'community: { slug: item.community.slug, '
            'name: item.community.name, '
            'accentColor: item.community.accentColor },'
        )
        if publication_community_line in community_service:
            community_service = community_service.replace(
                publication_community_line,
                (
                    'community: { slug: item.community.slug, '
                    'name: item.community.name, '
                    'accentColor: item.community.accentColor, '
                    'avatarUrl: item.community.avatarUrl, '
                    'coverUrl: item.community.coverUrl },'
                ),
                1,
            )
        write(community_service_path, community_service)

        workshop_service_path = 'apps/api/src/workshop/workshop.service.ts'
        workshop_service = read(workshop_service_path)
        if 'avatarUrl: item.author.avatarUrl' not in workshop_service:
            old_author = (
                'author: { username: item.author.username, '
                'displayName: item.author.displayName, '
                'forrumId: item.author.forrumId },'
            )
            if old_author in workshop_service:
                workshop_service = workshop_service.replace(
                    old_author,
                    (
                        'author: { username: item.author.username, '
                        'displayName: item.author.displayName, '
                        'forrumId: item.author.forrumId, '
                        'avatarUrl: item.author.avatarUrl },'
                    ),
                    1,
                )
        write(workshop_service_path, workshop_service)

        # 9. Events creation is protected before rendering.
        proxy_path = 'apps/web/proxy.ts'
        proxy = read(proxy_path)
        if "'/events/create'," not in proxy:
            proxy = replace_once(
                proxy,
                "    '/create',\n",
                "    '/create',\n    '/events/create',\n",
                'events/create proxy matcher',
            )
        write(proxy_path, proxy)

        # 10. Demo users, media partners, works, tags and fresh comments.
        seed_path = 'apps/api/prisma/seed.ts'
        seed = read(seed_path)

        if 'MediaPartnerStatus,' not in seed:
            seed = replace_once(
                seed,
                '  WorkshopItemType,\n',
                (
                    '  WorkshopItemType,\n'
                    '  MediaPartnerStatus,\n'
                    '  MediaPartnerType,\n'
                ),
                'seed media partner enum imports',
            )

        if 'FORRUM_DEMO_USERS_V8' not in seed:
            users_block = (
                '  // FORRUM_DEMO_USERS_V8\n'
                + PAYLOAD['seedExtraUsers'].rstrip()
                + '\n'
            )
            seed = replace_once(
                seed,
                '  // FORRUM_DEMO_VISUALS_V7\n',
                users_block + '  // FORRUM_DEMO_VISUALS_V7\n',
                'seed demo users',
            )

        if 'FORRUM_DEMO_CONTENT_V8' not in seed:
            seed = replace_once(
                seed,
                '  const ownerWallCount = await prisma.wallPost.count',
                (
                    PAYLOAD['seedContent'].rstrip()
                    + '\n\n'
                    + '  const ownerWallCount = await prisma.wallPost.count'
                ),
                'seed demo content',
            )

        write(seed_path, seed)

        # 11. Deterministic source contract.
        required = {
            'apps/web/components/home-dashboard.tsx': [
                'home-tree-hitarea',
                'ArrowRight',
                'ArrowLeft',
                "key: 'popular'",
                'data-username',
            ],
            'apps/web/app/communities/communities-client.tsx': [
                'FORRUM_TREE_INTERACTION_V8',
                'community-browser-hitarea',
                'community-browser-main-link',
                'ArrowRight',
                'ArrowLeft',
            ],
            'apps/api/src/feed/ranking.ts': [
                'recentCommentCount',
                'Активно обсуждается сегодня',
            ],
            'apps/api/src/feed/feed.service.ts': [
                'FORRUM_POPULAR_24H_V8',
                'recentCommentSince',
                'publication.comments.length',
            ],
            'apps/web/app/globals.css': [
                'FORRUM_CANONICAL_INTERFACE_V8',
                'home-topic-visual',
                'community-browser-hitarea',
            ],
            'apps/api/prisma/seed.ts': [
                'FORRUM_DEMO_USERS_V8',
                'FORRUM_DEMO_CONTENT_V8',
                'Max Stream',
                'Нора разбирает',
                'Набор подарков «Первый запуск»',
            ],
        }

        for path, markers in required.items():
            source = read(path)
            missing = [marker for marker in markers if marker not in source]
            if missing:
                raise RuntimeError(f'{path}: missing markers: {missing}')

        home = read('apps/web/components/home-dashboard.tsx')
        for forbidden in ['unanswered', 'Без ответа', 'Все категории']:
            if forbidden in home:
                raise RuntimeError(
                    f'Home still contains forbidden marker: {forbidden}'
                )

        remaining_workflows = sorted(
            path.name
            for path in workflow_dir.iterdir()
            if path.is_file() and path.suffix in {'.yml', '.yaml'}
        )
        if remaining_workflows != [canonical_workflow.name]:
            raise RuntimeError(
                f'Unexpected workflows remain: {remaining_workflows}'
            )

        print('FORRUM canonical interface V8 source patch applied.')

        PY
