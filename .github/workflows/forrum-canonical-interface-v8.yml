        def replace_seed_section(
            source: str,
            start_marker: str,
            end_marker: str,
            replacement: str,
            label: str,
        ) -> str:
            start = source.find(start_marker)
            if start < 0:
                raise RuntimeError(
                    f'{label} start marker not found: {start_marker!r}'
                )

            end = source.find(end_marker, start)
            if end < 0:
                raise RuntimeError(
                    f'{label} end marker not found: {end_marker!r}'
                )

            if end <= start:
                raise RuntimeError(
                    f'{label} markers are in the wrong order'
                )

            return (
                source[:start]
                + replacement.rstrip()
                + source[end:]
            )

        seed = replace_seed_section(
