name: FORRUM Home — Table Overflow Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-table-overflow-fix
  cancel-in-progress: false

jobs:
  home-table-overflow-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FORRUM HOME TABLE OVERFLOW FIX ==="

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          test -f apps/web/app/globals.css
          test -f apps/web/components/home-dashboard.tsx
          test -f .github/workflows/forrum-home-table-overflow-fix.yml

          grep -Fq '.forrum-home-v16__new-topic-table' \
            apps/web/app/globals.css
          grep -Fq '.forrum-home-v16__new-topic-last' \
            apps/web/app/globals.css
          grep -Fq 'forrum-home-v16__new-topic-author' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'forrum-home-v16__new-topic-last' \
            apps/web/components/home-dashboard.tsx

          echo "Baseline: PASS"

      - name: Write regression check first
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/home-table-overflow-check.mjs <<'NODE'
          import fs from 'node:fs';

          const css = fs.readFileSync(
            'apps/web/app/globals.css',
            'utf8',
          );

          const required = [
            '/* FORRUM_HOME_TABLE_OVERFLOW_FIX */',
            '.forrum-home-v16__new-topic-table {',
            'overflow: hidden;',
            '.forrum-home-v16__new-topic-head > *,',
            '.forrum-home-v16__new-topic > * {',
            'min-width: 0;',
            '.forrum-home-v16__new-topic-last {',
            'text-overflow: ellipsis;',
            'white-space: nowrap;',
            'max-width: 100%;',
            'minmax(0, 2.35fr)',
            'minmax(0, 1.15fr);',
          ];

          for (const marker of required) {
            if (!css.includes(marker)) {
              throw new Error(`Missing overflow marker: ${marker}`);
            }
          }

          console.log('Home table overflow contract: PASS');
          NODE

      - name: TDD RED
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/home-table-overflow-check.mjs; then
            echo "::error::Regression unexpectedly passed before implementation."
            exit 1
          fi

          echo "TDD RED confirmed."

      - name: Apply CSS-only fix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/globals.css')
          css = path.read_text(encoding='utf-8')

          marker = '/* FORRUM_HOME_TABLE_OVERFLOW_FIX */'
          if marker in css:
              raise SystemExit('Overflow fix already exists.')

          lines = [
              '',
              marker,
              '.forrum-home-v16__panel,',
              '.forrum-home-v16__center,',
              '.forrum-home-v16__new-topic-table {',
              '  min-width: 0;',
              '}',
              '',
              '.forrum-home-v16__new-topic-table {',
              '  width: 100%;',
              '  max-width: 100%;',
              '  overflow: hidden;',
              '}',
              '',
              '.forrum-home-v16__new-topic-head,',
              '.forrum-home-v16__new-topic {',
              '  width: 100%;',
              '  max-width: 100%;',
              '  min-width: 0;',
              '  grid-template-columns:',
              '    minmax(0, 2.35fr)',
              '    minmax(0, 1fr)',
              '    minmax(0, 0.9fr)',
              '    54px',
              '    68px',
              '    minmax(0, 1.15fr);',
              '  column-gap: 10px;',
              '}',
              '',
              '.forrum-home-v16__new-topic-head > *,',
              '.forrum-home-v16__new-topic > * {',
              '  min-width: 0;',
              '  max-width: 100%;',
              '}',
              '',
              '.forrum-home-v16__new-topic-title,',
              '.forrum-home-v16__new-topic-section,',
              '.forrum-home-v16__new-topic-author,',
              '.forrum-home-v16__new-topic-last {',
              '  display: block;',
              '  min-width: 0;',
              '  max-width: 100%;',
              '  overflow: hidden;',
              '  text-overflow: ellipsis;',
              '  white-space: nowrap;',
              '}',
              '',
              '.forrum-home-v16__new-topic-author,',
              '.forrum-home-v16__new-topic-last {',
              '  overflow-wrap: normal;',
              '  word-break: normal;',
              '}',
              '',
              '.forrum-home-v16__new-topic-last {',
              '  text-align: right;',
              '}',
              '',
              '.forrum-home-v16__new-topic-author > *,',
              '.forrum-home-v16__new-topic-last > * {',
              '  min-width: 0;',
              '  max-width: 100%;',
              '}',
              '',
              '@media (max-width: 1480px) and (min-width: 961px) {',
              '  .forrum-home-v16__new-topic-head,',
              '  .forrum-home-v16__new-topic {',
              '    grid-template-columns:',
              '      minmax(0, 2.2fr)',
              '      minmax(0, 0.95fr)',
              '      minmax(0, 0.82fr)',
              '      52px',
              '      64px',
              '      minmax(0, 1.08fr);',
              '    column-gap: 8px;',
              '  }',
              '}',
              '',
          ]

          path.write_text(
              css.rstrip() + '\n' + '\n'.join(lines),
              encoding='utf-8',
          )

          print('CSS-only overflow fix applied.')
          PY

          git diff --check

      - name: TDD GREEN
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-table-overflow-check.mjs
          echo "TDD GREEN confirmed."

      - name: Scope audit
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          expected="$(
            printf '%s\n' \
              apps/web/app/globals.css \
              scripts/home-table-overflow-check.mjs |
            sort
          )"

          printf 'Changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"

          test -z "$(
            git diff --name-only -- \
              apps/web/components/home-dashboard.tsx \
              apps/web/components/main-nav.tsx \
              apps/web/app/page.tsx \
              apps/api \
              packages/contracts
          )"

          echo "Scope audit: PASS"

      - name: Stage verified patch
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            scripts/home-table-overflow-check.mjs

          git diff --cached --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Validate Prisma
        shell: bash
        env:
          DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
        run: |
          set -euo pipefail

          npm run db:validate
          npm run db:generate

      - name: Full product verification
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-table-overflow-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck

          rm -rf apps/web/.next
          npm run build

      - name: Production self-review
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-table-overflow-check.mjs

          grep -Fq '/* FORRUM_HOME_TABLE_OVERFLOW_FIX */' \
            apps/web/app/globals.css

          test -z "$(
            git diff --cached --name-only -- \
              apps/web/components \
              apps/web/app/page.tsx \
              apps/api \
              packages/contracts
          )"

          npm run typecheck
          npm run build

          echo "Production self-review: PASS"

      - name: Restore generated noise and self-delete
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- .
          git clean -ffdx

          git rm .github/workflows/forrum-home-table-overflow-fix.yml

          git diff --cached --check

          staged="$(
            git diff --cached --name-only |
            sort
          )"

          expected="$(
            printf '%s\n' \
              .github/workflows/forrum-home-table-overflow-fix.yml \
              apps/web/app/globals.css \
              scripts/home-table-overflow-check.mjs |
            sort
          )"

          printf 'Final staged paths:\n%s\n' "$staged"
          test "$staged" = "$expected"

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "Fix home new topics overflow"

      - name: Publish only against unchanged main
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during verification. Rerun workflow."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify remote
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/app/globals.css \
            | grep -Fq '/* FORRUM_HOME_TABLE_OVERFLOW_FIX */'

          if git cat-file -e \
            origin/main:.github/workflows/forrum-home-table-overflow-fix.yml \
            2>/dev/null
          then
            echo "::error::Workflow did not self-delete."
            exit 1
          fi

          echo "Home table overflow fix published and workflow removed."
