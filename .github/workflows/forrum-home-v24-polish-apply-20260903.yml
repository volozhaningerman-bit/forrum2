name: Apply FORRUM Home V24 Polish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-v24-polish-20260903
  cancel-in-progress: false

env:
  BASE_SHA: 02b9dcabbb0f77b23b0b44929de9fcc24684c91c
  TARGET_BRANCH: codex/home-v24-polish-20260903
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum_ci
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply:
    name: Apply, verify and push V24
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify baseline and target branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD -- . \
            ':(exclude).github/workflows/forrum-home-v24-polish-apply-20260903.yml')"
          if [ -n "$unexpected" ]; then
            echo "::error::Main changed after the prepared V24 baseline:"
            echo "$unexpected"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $TARGET_BRANCH already exists."
            exit 1
          fi

          git switch --detach "$BASE_SHA"
          git switch -c "$TARGET_BRANCH"

      - name: Apply exact verified V24 patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/forrum-home-v24-polish.patch"
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          node scripts/home-v23-floating-islands-check.mjs
          node scripts/home-v24-polish-check.mjs

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        shell: bash
        run: npm run db:generate

      - name: Verify tests, structure, UX and build
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-v23-floating-islands-check.mjs
          node scripts/home-v24-polish-check.mjs
          node --experimental-strip-types --experimental-loader ./scripts/local-ts-loader.mjs --test apps/web/test/home-model.test.ts
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test
          npm run typecheck
          npm run build

      - name: Commit and push only the verified V24 branch
        shell: bash
        run: |
          set -euo pipefail
          git restore -- apps/api/src/generated/prisma
          git restore -- apps/api/dist apps/web/.next packages/contracts/dist apps/web/tsconfig.tsbuildinfo
          git clean -fd -- apps/api/dist apps/api/src/generated/prisma apps/web/.next packages/contracts/dist

          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            'apps/web/app/home-v24.css' \
            'apps/web/app/layout.tsx' \
            'apps/web/components/home-dashboard.tsx' \
            'apps/web/components/home/community-tree.tsx' \
            'apps/web/components/home/forum-stats-panel.tsx' \
            'apps/web/components/home/model.ts' \
            'apps/web/components/home/popular-topics-panel.tsx' \
            'apps/web/components/home/weekly-members-panel.tsx' \
            'apps/web/components/home/weekly-pulse-panel.tsx' \
            'apps/web/components/site-header.tsx' \
            'apps/web/test/home-model.test.ts' \
            'scripts/home-v23-floating-islands-check.mjs' \
            'scripts/home-v24-polish-check.mjs'

          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(home): refine floating forum islands v24"
          git push origin "$TARGET_BRANCH"

      - name: Publish compare link
        if: success()
        shell: bash
        run: |
          {
            echo '## FORRUM Home V24'
            echo ''
            echo "Branch: \`$TARGET_BRANCH\`"
            echo ''
            echo "[Open comparison and create PR](https://github.com/${{ github.repository }}/compare/main...$TARGET_BRANCH?expand=1)"
          } >> "$GITHUB_STEP_SUMMARY"

