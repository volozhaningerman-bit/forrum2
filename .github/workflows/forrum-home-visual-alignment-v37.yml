          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Self-review and second pass
        shell: bash
        run: |
          set -euo pipefail

          before="$(
            git diff |
            sha256sum |
            cut -d' ' -f1
          )"

          PYTHONDONTWRITEBYTECODE=1 python3 -S /tmp/forrum-home-visual-alignment-v37.py

          after="$(
            git diff |
            sha256sum |
            cut -d' ' -f1
          )"

          test "$before" = "$after"

          # First draft weakness found and fixed before delivery:
          # a full-width tree link would make the count/row navigate.
          # Final V37 link wraps ONLY folder icon + name, while only
          # direct clicks on blank row background toggle a parent.
          grep -Fq             'event.target !== event.currentTarget'             apps/web/components/home-dashboard.tsx

          grep -Fq             'max-width: calc(100% - 54px)'             apps/web/app/globals.css

          # Second visual weakness found and fixed:
          # 12px ruled texture read as notebook lines instead of paper grain.
          python3 - <<'PY'
          from pathlib import Path

          css = Path(
              'apps/web/app/globals.css'
          ).read_text(encoding='utf-8')

          start = css.index(
              '/* FORRUM_VISUAL_THEME_START'
          )
          end = css.index(
              '/* FORRUM_VISUAL_THEME_END */',
              start,
          )
          theme = css[start:end]

          if '%3Cpath' in theme:
              raise SystemExit(
                  'V37 self-review: ruled paper texture returned.'
              )

          if theme.count(
              "width='24' height='24'"
          ) != 2:
              raise SystemExit(
                  'V37 self-review: Paper/Graphite grain diverged.'
              )

          print(
              'V37 self-review visual weaknesses: FIXED'
          )
          PY

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          npm run typecheck -w @forrum/web
          git diff --check

      - name: Restore build side effects and clean dependencies
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tracked_dirty < <(
            git status               --porcelain=v1               --untracked-files=no |
            sed 's/^...//'
          )

          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue

            case "$path" in
              apps/web/components/home-dashboard.tsx|              apps/web/app/globals.css)
                continue
                ;;
            esac

            git restore               --staged               --worktree               -- "$path"
          done

          git clean -ffdx

      - name: Final V37 pre-commit audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          git diff --check

          changed="$(
            git diff --name-only | sort
          )"

          expected="$(
            printf '%s\n'               apps/web/app/globals.css               apps/web/components/home-dashboard.tsx |
            sort
          )"

          if [ -n "$changed" ]; then
            test "$changed" = "$expected"
          fi

          test -z "$(
            git status --porcelain=v1 --untracked-files=all |
            grep -vE               '^( M|M |MM) (apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx)$'               || true
          )"

      - name: Commit verified V37
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "FORRUM Home Visual Alignment V37 is already present."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add             apps/web/components/home-dashboard.tsx             apps/web/app/globals.css

          git diff --cached --check

          git commit -m             "Polish FORRUM homepage reference V37"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase and full V37 production audit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          npm install             --include=dev             --no-audit             --no-fund             --package-lock=false

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs
          node scripts/home-visual-theme-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

          git restore             --source=HEAD             --staged             --worktree             -- .

          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "Post-rebase V37 production audit: PASS"

      - name: Publish V37 safely
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch origin main

            remote="$(
              git rev-parse origin/main
            )"

            if ! git merge-base               --is-ancestor               "$remote"               HEAD
            then
              echo                 "origin/main advanced; rebasing and repeating V37 verification."

              git rebase origin/main

              npm install                 --include=dev                 --no-audit                 --no-fund                 --package-lock=false

              node scripts/home-paper-graphite-v16-check.mjs
              node scripts/home-reference-check.mjs
              node scripts/home-scale-polish-check.mjs
              node scripts/home-visual-theme-check.mjs

              npm run validate:static
              npm run validate:ux
              npm run validate:a11y
              npm test -w @forrum/contracts --if-present
              npm test -w @forrum/web --if-present
              npm run typecheck -w @forrum/contracts
              npm run typecheck -w @forrum/web

              rm -rf apps/web/.next
              npm run build -w @forrum/contracts
              npm run build -w @forrum/web

              git restore                 --source=HEAD                 --staged                 --worktree                 -- .

              git clean -ffdx
              test -z "$(git status --porcelain)"
            fi

            git fetch origin main

            if [ "$(
              git rev-parse origin/main
            )" != "$(
              git merge-base HEAD origin/main
            )" ]; then
              continue
            fi

            if git push origin HEAD:main; then
              echo "V37 push succeeded on attempt $attempt."
              exit 0
            fi
          done

          echo "::error::V37 could not be published safely."
          exit 1

      - name: Verify remote V37 commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          test "$(
            git rev-parse HEAD
          )" = "$(
            git rev-parse origin/main
          )"

          echo             "Published FORRUM Home Visual Alignment V37."
