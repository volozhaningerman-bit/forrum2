          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(PAYLOAD)))
          entries = json.loads(archive.read('manifest.json'))
          conflicts = []
          for entry in entries:
              name = entry['path']
              path = Path(name)
              parts = PurePosixPath(name).parts
              if not parts or name.startswith('/') or '..' in parts or '.git' in parts:
                  raise SystemExit('Unsafe patch path: ' + name)
              if path.is_symlink() or any(parent.is_symlink() for parent in path.parents):
                  raise SystemExit('Symlink patch path: ' + name)
              if entry['old'] is None:
                  valid = not path.exists()
              else:
                  data = path.read_bytes() if path.is_file() else None
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() if data is not None else None
                  valid = actual == entry['old']
              if not valid:
                  conflicts.append(name)
          if conflicts:
              raise SystemExit('Source files changed; no files written:\n' + '\n'.join(conflicts))
          if os.environ.get('FORRUM_PATCH_CHECK_ONLY') == '1':
              print('Baseline verified:', len(entries), 'paths; no files changed.')
          else:
              parents = set()
              for entry in entries:
                  path = Path(entry['path'])
                  if entry['delete']:
                      path.unlink()
                      parents.update(parent for parent in path.parents if str(parent) != '.')
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(archive.read('files/' + entry['path']))
              for parent in sorted(parents, key=lambda p: len(p.parts), reverse=True):
                  try:
                      parent.rmdir()
                  except OSError:
                      pass
              print('Applied:', sum(not e['delete'] for e in entries), 'written;', sum(e['delete'] for e in entries), 'removed.')
          PY_V28
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and generate Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run db:generate
          npm run build -w @forrum/contracts
      - name: Verify code and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm test
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:home
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forrum-v28-browser-check
          path: test-results/home-reference/
          if-no-files-found: ignore
      - name: Commit and push only verified V28 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- apps/web/components/reference-home.tsx apps/web/app/home-reference.css apps/web/components/home/types.ts apps/api/src/home/home.service.ts scripts/test-home-reference.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "feat(home): show real conversations and improve homepage surfaces"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            printf '%s\n' '## FORRUM V28 ready for review'
            printf '%s\n' "Branch: $TARGET_BRANCH"
            printf '%s\n' "Compare and create PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$TARGET_BRANCH?expand=1"
            printf '%s\n' 'The branch has not been merged or deployed by this patch.'
          } >> "$GITHUB_STEP_SUMMARY"
