      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Prepare disposable test database
        run: npm run db:push
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check taxonomy and subscriber counts in PostgreSQL
        run: node scripts/test-v35-db.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:home
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forrum-v35-browser
          path: test-results/home-reference
          if-no-files-found: ignore
      - name: Create review branch
        env:
          V35_BRANCH: patch/forrum-v35-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          git switch -c "$V35_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          paths=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'forrum-v35-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PYCODE
          git commit -m "feat: FORRUM V35 readable AI forum and managed taxonomy"
          git push --set-upstream origin "$V35_BRANCH"
          python3 - <<'PYCODE'
          import os
          branch=os.environ['V35_BRANCH']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
              report.write('## V35 ready for review\n\nAll checks passed. No merge or deployment performed.\n\n')
              report.write(f'[Create Pull Request](https://github.com/volozhaningerman-bit/forrum2/compare/main...{branch}?expand=1)\n\n')
              report.write('After deployment: /admin/home-banners (preset and save), /admin/ai-taxonomy (preview and confirm).\n')
          PYCODE
