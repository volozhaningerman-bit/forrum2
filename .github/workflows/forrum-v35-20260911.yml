name: FORRUM V35 — readable AI forum
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forrum-v35
  cancel-in-progress: false
jobs:
  prepare-patch:
    if: github.repository == 'volozhaningerman-bit/forrum2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: forrum_v35_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d forrum_v35_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
