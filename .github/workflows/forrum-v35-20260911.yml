          assert hashlib.sha256(payload).hexdigest() == '0c30354ce7ed1824122cf6862cc17dd40bafceb8777342e816e35f7bf43d0d59', 'Invalid payload'
          archive = zipfile.ZipFile(io.BytesIO(payload))
          manifest = json.loads(archive.read('manifest.json'))
          root = pathlib.Path.cwd().resolve()
          ready = []
          for entry in manifest:
              relative = pathlib.PurePosixPath(entry['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in ('apps', 'scripts', 'docs')
              path = root.joinpath(*relative.parts)
              assert not any(p.is_symlink() for p in [path, *path.parents]), 'Symlink rejected'
              old = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              assert old == entry['before'], 'Baseline mismatch: ' + entry['path'] + '. Provide an updated archive; do not bypass this guard.'
              data = archive.read('files/' + entry['path'])
              assert hashlib.sha256(data).hexdigest() == entry['after']
              ready.append((path, data))
          # All baseline checks finish before writing any file.
          for path, data in ready:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'forrum-v35-paths.json').write_text(json.dumps([e['path'] for e in manifest]))
          print('Applied', len(ready), 'verified source files')
