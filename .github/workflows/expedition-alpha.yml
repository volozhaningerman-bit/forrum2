name: Expedition alpha

on:
  pull_request:
    paths:
      - 'apps/web/app/applications/games/expedition/**'
      - 'apps/web/app/applications/page.tsx'
      - 'scripts/test-expedition-alpha.mjs'
      - 'package.json'
      - '.github/workflows/expedition-alpha.yml'
  workflow_dispatch:

jobs:
  verify-expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:expedition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-alpha-browser-artifacts
          path: test-results/expedition-alpha
          if-no-files-found: ignore
