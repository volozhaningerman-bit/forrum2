name: Fix FORRUM web API proxy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-and-test:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: https://api-production-37ce.up.railway.app/v1
      PORT: "3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure same-origin API proxy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          api_client = Path("apps/web/lib/api.ts")
          api_client.write_text(
              """export const API_URL = '/api';

          export async function api<T>(path: string, init: RequestInit = {}): Promise<T> {
            const headers = new Headers(init.headers);
            if (init.body && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');

            const response = await fetch(`${API_URL}${path}`, {
              ...init,
              credentials: 'include',
              headers,
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              const message = Array.isArray(data.message) ? data.message.join('. ') : data.message;
              throw new Error(message ?? 'Ошибка запроса');
            }

            return data as T;
          }
          """,
              encoding="utf-8",
          )

          next_config = Path("apps/web/next.config.ts")
          next_config.write_text(
              """import path from 'node:path';
          import type { NextConfig } from 'next';

          const securityHeaders = [
            { key: 'X-Content-Type-Options', value: 'nosniff' },
            { key: 'X-Frame-Options', value: 'DENY' },
            { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
            { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=(), payment=()' },
          ];

          const apiBase = (process.env.API_INTERNAL_URL ?? 'https://api-production-37ce.up.railway.app/v1').replace(/\\/$/, '');

          const nextConfig: NextConfig = {
            output: 'standalone',
            poweredByHeader: false,
            turbopack: {
              root: path.resolve(process.cwd(), '../..'),
            },
            async headers() {
              return [{ source: '/(.*)', headers: securityHeaders }];
            },
            async rewrites() {
              return [
                {
                  source: '/api/:path*',
                  destination: `${apiBase}/:path*`,
                },
              ];
            },
          };

          export default nextConfig;
          """,
              encoding="utf-8",
          )

          obsolete_route = Path("apps/web/app/api/[...path]/route.ts")
          if obsolete_route.exists():
              obsolete_route.unlink()
              print("Removed obsolete route handler")
              current = obsolete_route.parent
              while current != Path("apps/web/app") and current.exists() and not any(current.iterdir()):
                  current.rmdir()
                  current = current.parent

          print("Web API proxy configured through Next.js rewrites")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build web
        run: npm run build -w @forrum/web

      - name: Start web and verify proxied API
        shell: bash
        run: |
          set -euo pipefail

          npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" 2>/dev/null || true
            wait "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi

            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "Web stopped before the API proxy became healthy."
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          echo "Web API proxy did not become healthy in time."
          cat /tmp/forrum-web.log
          exit 1

      - name: Commit verified proxy
        shell: bash
        run: |
          git diff --check
          git config user.name "FORRUM build fixer"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/lib/api.ts apps/web/next.config.ts
          git add -u apps/web/app/api 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Proxy browser API requests through the web service"
            git push
          fi
