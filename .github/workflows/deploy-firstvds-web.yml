name: Deploy FORRUM Web to FirstVDS

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "Dockerfile.web"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-firstvds-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forrum-firstvds-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy live web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FORRUM_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/forrum_actions
          chmod 600 ~/.ssh/forrum_actions
          ssh-keygen -y -f ~/.ssh/forrum_actions > /dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest main
        env:
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
          SSH_USER: ${{ secrets.FORRUM_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/forrum_actions             -o BatchMode=yes             -o StrictHostKeyChecking=yes             -o ServerAliveInterval=30             -o ServerAliveCountMax=30             "$SSH_USER@$SSH_HOST" deploy

      - name: Verify live homepage
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            html=$(curl --fail --silent --show-error               -H 'Cache-Control: no-cache, no-store, max-age=0'               "https://4rrum.ru/?deploy-check=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$html" | grep -q 'data-home-revision="v60"'; then
              echo "4rrum.ru serves homepage revision v60"
              exit 0
            fi
            sleep 10
          done
          echo "Homepage revision v60 did not appear on 4rrum.ru" >&2
          exit 1
