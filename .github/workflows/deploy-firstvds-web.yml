name: Deploy FORRUM Web to FirstVDS
on:
  workflow_run:
    workflows: [Homepage checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forrum-firstvds-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Reject a superseded source commit
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_sha" = "$VERIFIED_SHA"
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FORRUM_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/forrum_actions
          chmod 600 ~/.ssh/forrum_actions
          ssh-keygen -y -f ~/.ssh/forrum_actions > /dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy validated main
        env:
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
          SSH_USER: ${{ secrets.FORRUM_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/forrum_actions -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=30 "$SSH_USER@$SSH_HOST" deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live commit and homepage
        env:
          EXPECTED_SHA: ${{ env.VERIFIED_SHA }}
          EXPECTED_HOME_REFERENCE: v49
          EXPECTED_HOME_REVISION: v84
          REQUIRE_EXACT_SHA: 'true'
          PRODUCTION_VERIFY_TIMEOUT_MS: '600000'
        run: node scripts/verify-production.mjs
