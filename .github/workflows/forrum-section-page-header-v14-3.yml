name: FORRUM Section Page Header V14.3
run-name: FORRUM Section Page Header V14.3

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-section-page-header-v14-3
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  section-page-header-v14-3:
    name: Section Page Header V14.3
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact approved Stage 1 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f "apps/web/app/communities/[slug]/category-page.tsx"
          test ! -f "apps/web/app/communities/[slug]/community-client.tsx"

          grep -Fq "FORRUM_CATEGORY_ROUTE_STAGE_1_V14"             "apps/web/app/communities/[slug]/page.tsx"
          grep -Fq "FORRUM_CATEGORY_PAGE_STAGE_1_V14"             "apps/web/app/communities/[slug]/category-page.tsx"
          grep -Fq 'className="community-profile"'             "apps/web/app/communities/[slug]/category-page.tsx"
          grep -Fq 'className="curator-panel"'             "apps/web/app/communities/[slug]/category-page.tsx"

          grep -Fq "select: { id: true, parentId: true }"             apps/api/src/communities/communities.service.ts

          grep -Fq "FORRUM_GLOBAL_HEADER_V13_4"             apps/web/components/main-nav.tsx

          test -z "$(git status --porcelain)"

      - name: Apply Section Page Header V14.3
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d             > /tmp/forrum-section-page-header-v14-3.py
          python3 /tmp/forrum-section-page-header-v14-3.py

      - name: Verify V14.3 source and protected scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/global-header-v13-4-check.mjs

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs

          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          allowed='^(apps/web/app/communities/\[slug\]/category-page\.tsx|apps/web/app/globals\.css|apps/api/src/communities/communities\.service\.ts|scripts/section-page-header-v14-3-check\.mjs|docs/FORRUM_SECTION_PAGE_HEADER_V14_3\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --             apps/web/components/main-nav.tsx             apps/web/components/site-header.tsx             apps/web/components/site-footer.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/communities/communities-client.tsx             apps/web/app/page.tsx             apps/api/prisma | grep -q .; then
            echo "V14.3 changed protected shared/catalogue/home/schema scope."
            exit 1
          fi

      - name: Create isolated verified V14.3 commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add --             "apps/web/app/communities/[slug]/category-page.tsx"             apps/web/app/globals.css             apps/api/src/communities/communities.service.ts             scripts/section-page-header-v14-3-check.mjs             docs/FORRUM_SECTION_PAGE_HEADER_V14_3.md

          git commit -m "Build approved section page header V14.3"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and regression checks
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Section Page Header V14.3
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          page="$(git show 'origin/main:apps/web/app/communities/[slug]/category-page.tsx')"
          service="$(git show origin/main:apps/api/src/communities/communities.service.ts)"
          css="$(git show origin/main:apps/web/app/globals.css)"

          [[ "$page" == *'FORRUM_SECTION_PAGE_HEADER_V14_3'* ]]
          [[ "$page" == *'className="section-breadcrumbs"'* ]]
          [[ "$page" == *'className="section-identity"'* ]]
          [[ "$page" == *'Создать тему'* ]]
          [[ "$page" != *'className="community-profile"'* ]]
          [[ "$page" != *'className="curator-panel"'* ]]

          [[ "$service" == *'const ancestors: Array<'* ]]
          [[ "$service" == *'ancestors.unshift('* ]]
          [[ "$css" == *'FORRUM_SECTION_PAGE_HEADER_V14_3'* ]]

          git show origin/main:apps/web/components/main-nav.tsx             | grep -Fq "FORRUM_GLOBAL_HEADER_V13_4"

          node scripts/section-page-header-v14-3-check.mjs

          echo "FORRUM Section Page Header V14.3 remote verification passed."
