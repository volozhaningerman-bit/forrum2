name: FORRUM Home Scale Polish STABLE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-scale-polish-stable
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  home-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/app/globals.css
          test -f apps/web/components/main-nav.tsx
          test -f apps/web/components/home-dashboard.tsx
          test -f scripts/home-paper-graphite-v16-check.mjs
          test -f scripts/global-shell-v16-1-check.mjs
          test -f scripts/home-reference-check.mjs

      - name: Decode and syntax-check visual patch
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$PATCH_B64" | base64 -d             > /tmp/forrum-home-scale-polish.py

          printf '%s' "$CSS_B64" | base64 -d             > /tmp/forrum-home-scale-polish.css

          printf '%s' "$CHECK_B64" | base64 -d             > scripts/home-scale-polish-check.mjs

          python3 -m py_compile             /tmp/forrum-home-scale-polish.py

          node --check             scripts/home-scale-polish-check.mjs

      - name: Apply visual scale polish
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/forrum-home-scale-polish.py

          git diff --check

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs

      - name: Verify isolated source scope
        shell: bash
        run: |
          set -euo pipefail

          is_allowed() {
            case "$1" in
              apps/web/app/globals.css|              scripts/home-scale-polish-check.mjs)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          bad=0

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            path="${line:3}"

            if ! is_allowed "$path"; then
              echo "::error::Unexpected source file: $path"
              bad=1
            fi
          done < <(git status --porcelain=v1 --untracked-files=all)

          exit "$bad"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Run static UX accessibility checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          git diff --check

      - name: Run available tests
        shell: bash
        run: |
          set -euo pipefail

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apps/web/.next

          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Restore tracked build side effects
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tracked_dirty < <(
            git status --porcelain=v1 --untracked-files=no |
            sed 's/^...//'
          )

          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue

            case "$path" in
              apps/web/app/globals.css)
                continue
                ;;
            esac

            echo "Restoring build-only tracked change: $path"
            git restore --staged --worktree -- "$path"
          done

      - name: Remove generated build artifacts
        shell: bash
        run: |
          set -euo pipefail

          git clean -ffdx             -e scripts/home-scale-polish-check.mjs

          test -f scripts/home-scale-polish-check.mjs

      - name: Final production audit
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs

          git diff --check

          is_allowed() {
            case "$1" in
              apps/web/app/globals.css|              scripts/home-scale-polish-check.mjs)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          bad=0

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            path="${line:3}"

            if ! is_allowed "$path"; then
              echo "::error::Unexpected final file: $path"
              bad=1
            fi
          done < <(git status --porcelain=v1 --untracked-files=all)

          exit "$bad"

      - name: Commit verified scale polish
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet             && [ -z "$(git ls-files --others --exclude-standard scripts/home-scale-polish-check.mjs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Home Scale Polish is already applied."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add             apps/web/app/globals.css             scripts/home-scale-polish-check.mjs

          git diff --cached --check
          git commit -m "Polish FORRUM home scale and density"

          test -z "$(git status --porcelain --untracked-files=no)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

      - name: Re-run audits after rebase
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-paper-graphite-v16-check.mjs
          node scripts/global-shell-v16-1-check.mjs
          node scripts/home-reference-check.mjs
          node scripts/home-scale-polish-check.mjs

          git diff --check

      - name: Push verified scale polish
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          test "$(git rev-parse HEAD)" =             "$(git rev-parse origin/main)"

          echo "Published verified FORRUM Home Scale Polish: $(git rev-parse HEAD)"
