name: FORRUM Communities Redesign V12.F.4

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-communities-redesign-v12-f-4
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  communities-stage-f-4:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved Communities Stage F.3 baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F3_V12_INTERACTION' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-curator-profile-link' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-hierarchy-curator-link' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F3_V12' \
            apps/web/app/globals.css
          grep -q 'communities-v12-row-expand-surface' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-hierarchy-child-expand-surface' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'href={`/u/${encodeURIComponent(item.curator.username)}`}' \
            apps/web/app/communities/communities-client.tsx

          test -z "$(git status --porcelain)"

      - name: Apply Communities Stage F.4 cursor and curator hit-area fix
        shell: bash
        run: |
          set -euo pipefail

          cat >> apps/web/app/globals.css <<'CSS'

          /* FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12
             Empty catalogue space stays clickable without pretending to be a link.
             Actual navigation and action targets keep the pointer cursor.
             Curator name regains a real mouse hit area above the full-row surface.
          */
          .communities-v12-stage-a .communities-v12-catalogue-row,
          .communities-v12-stage-a .communities-v12-hierarchy-child,
          .communities-v12-stage-a .communities-v12-row-expand-surface,
          .communities-v12-stage-a .communities-v12-hierarchy-child-expand-surface {
            cursor: default;
          }

          .communities-v12-stage-a .communities-v12-catalogue-curator {
            pointer-events: auto;
          }

          .communities-v12-stage-a .communities-v12-curator-profile-link,
          .communities-v12-stage-a .communities-v12-hierarchy-curator-link {
            position: relative;
            z-index: 4;
            pointer-events: auto;
            cursor: pointer;
          }

          .communities-v12-stage-a .communities-v12-catalogue-icon-link,
          .communities-v12-stage-a .communities-v12-catalogue-name,
          .communities-v12-stage-a .communities-v12-hierarchy-title,
          .communities-v12-stage-a .communities-v12-hierarchy-child-icon-link,
          .communities-v12-stage-a .communities-v12-hierarchy-child-name,
          .communities-v12-stage-a .communities-v12-subscribe,
          .communities-v12-stage-a .communities-v12-hero-primary,
          .communities-v12-stage-a .communities-v12-hero-secondary {
            cursor: pointer;
          }

          .communities-v12-stage-a .communities-v12-catalogue-curator
            > .communities-v12-curator-avatar {
            cursor: default;
          }
          /* /FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12 */
          CSS

          cat > scripts/communities-redesign-stage-f4-check.mjs <<'JS'
          import fs from 'node:fs';

          const client = fs.readFileSync(
            'apps/web/app/communities/communities-client.tsx',
            'utf8',
          );
          const css = fs.readFileSync(
            'apps/web/app/globals.css',
            'utf8',
          );

          function requireMarker(source, marker, label) {
            if (!source.includes(marker)) {
              throw new Error(`${label}: missing ${marker}`);
            }
          }

          for (const marker of [
            'FORRUM_COMMUNITIES_REDESIGN_STAGE_F3_V12_INTERACTION',
            'communities-v12-row-expand-surface',
            'communities-v12-hierarchy-child-expand-surface',
            'communities-v12-curator-profile-link',
            'communities-v12-hierarchy-curator-link',
            'href={`/u/${encodeURIComponent(item.curator.username)}`}',
            "target.closest(",
            "'a, button, input, select, textarea'",
            'setSelectedSlug(item.slug);',
            'setSelectedSlug(child.slug);',
          ]) {
            requireMarker(client, marker, 'Stage F.4 interaction baseline');
          }

          for (const marker of [
            'FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12',
            '.communities-v12-stage-a .communities-v12-catalogue-curator {',
            'pointer-events: auto;',
            'cursor: default;',
            'cursor: pointer;',
            '.communities-v12-stage-a .communities-v12-curator-profile-link,',
            '.communities-v12-stage-a .communities-v12-row-expand-surface,',
          ]) {
            requireMarker(css, marker, 'Stage F.4 cursor and curator fix');
          }

          console.log(
            'FORRUM Communities Stage F.4 curator link and honest cursor contract passed.',
          );
          JS

      - name: Verify Stage F.4 source contract and patch scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/globals\.css|scripts/communities-redesign-stage-f4-check\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff -- \
            apps/web/app/communities/communities-client.tsx \
            apps/web/components/site-header.tsx \
            apps/web/components/main-nav.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/page.tsx \
            apps/api/src \
            apps/api/prisma | grep -q .; then
            echo 'Stage F.4 altered approved structure, homepage or backend unexpectedly.'
            exit 1
          fi

      - name: Create isolated Communities Stage F.4 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            apps/web/app/globals.css \
            scripts/communities-redesign-stage-f4-check.mjs

          git commit -m "Fix Communities curator link hit area and row cursor"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Communities checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Communities Stage F.4
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$local_sha" = "$remote_sha"

          git show origin/main:apps/web/app/globals.css \
            | grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12'

          git show origin/main:scripts/communities-redesign-stage-f4-check.mjs \
            | grep -q 'honest cursor contract passed'

          git show origin/main:apps/web/app/communities/communities-client.tsx \
            | grep -q 'communities-v12-curator-profile-link'

          echo "FORRUM Communities V12.F.4 remote verification passed."
