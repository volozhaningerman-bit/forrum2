name: FORRUM Home Redesign V11.E.1
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-redesign-v11-e-1
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  stage-e-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify recoverable homepage baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/page.tsx
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f apps/api/src/feed/feed.service.ts
          test -f scripts/ui-interaction-check.mjs
          test -f apps/web/components/site-header.tsx
          test -f apps/web/components/main-nav.tsx
          grep -q 'home-tree-name-link' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-expand-surface' apps/web/components/home-dashboard.tsx
          if grep -q 'home-discussed-stage-d' apps/web/components/home-dashboard.tsx; then
            echo 'Stage D center is already present.'
          else
            grep -q '<main className="home-discussion-panel">' apps/web/components/home-dashboard.tsx
            echo 'Legacy center found; Stage D will be restored before Stage E.'
          fi
          test -z "$(git status --porcelain)"

      - name: Ensure Stage D discussed topics baseline
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-stage-d-recovery.py
          python3 /tmp/forrum-stage-d-recovery.py
          node scripts/home-redesign-stage-d-check.mjs

      - name: Apply new topics Stage E
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-stage-e-patch.py
          python3 /tmp/forrum-stage-e-patch.py

      - name: Verify Stage D plus E scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/page\.tsx|apps/web/components/home-dashboard\.tsx|apps/web/app/globals\.css|apps/api/src/feed/feed\.service\.ts|scripts/ui-interaction-check\.mjs|scripts/home-redesign-stage-d-check\.mjs|scripts/home-redesign-stage-e-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_D_V11\.md|docs/FORRUM_HOME_REDESIGN_STAGE_E_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files were changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff -- apps/web/components/site-header.tsx apps/web/components/main-nav.tsx apps/web/app/layout.tsx | grep -q .; then
            echo 'Stage E.1 must not alter the approved header or global layout.'
            exit 1
          fi

          grep -q 'home-discussed-stage-d' apps/web/components/home-dashboard.tsx
          grep -q 'home-new-topics-stage-e' apps/web/components/home-dashboard.tsx
          grep -q "'/feed?mode=popular'" apps/web/app/page.tsx
          grep -q "'/feed?mode=new'" apps/web/app/page.tsx
          grep -q 'FORRUM_DISCUSSSED_TOPICS_24H_V11' apps/api/src/feed/feed.service.ts

      - name: Create isolated Stage E.1 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            apps/web/app/page.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/globals.css \
            apps/api/src/feed/feed.service.ts \
            scripts/ui-interaction-check.mjs \
            scripts/home-redesign-stage-d-check.mjs \
            scripts/home-redesign-stage-e-check.mjs \
            docs/FORRUM_HOME_REDESIGN_STAGE_D_V11.md \
            docs/FORRUM_HOME_REDESIGN_STAGE_E_V11.md

          if git diff --cached --quiet; then
            echo 'Stage D + E are already present.'
          else
            git commit -m "Restore discussed topics and add new topics table"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Stage E.1 checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage E.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
