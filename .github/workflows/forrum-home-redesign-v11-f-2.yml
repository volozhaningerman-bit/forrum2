name: FORRUM Home Redesign V11.F.2
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-redesign-v11-f-2
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  stage-f-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify recoverable homepage baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/page.tsx
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f apps/api/src/feed/feed.service.ts
          test -f scripts/ui-interaction-check.mjs
          test -f apps/web/components/site-header.tsx
          test -f apps/web/components/main-nav.tsx
          grep -q 'home-tree-name-link' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-expand-surface' apps/web/components/home-dashboard.tsx
          if grep -q 'home-discussed-stage-d' apps/web/components/home-dashboard.tsx; then
            echo 'Stage D center is already present.'
          else
            grep -q '<main className="home-discussion-panel">' apps/web/components/home-dashboard.tsx
            echo 'Legacy center found; Stage D will be restored before Stage E.'
          fi
          test -z "$(git status --porcelain)"

      - name: Ensure Stage D discussed topics baseline safely
        shell: bash
        env:
          PATCH_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          HOME_FILE='apps/web/components/home-dashboard.tsx'
          FEED_FILE='apps/api/src/feed/feed.service.ts'
          CHECK_FILE='scripts/home-redesign-stage-d-check.mjs'

          # Stage D is already deployed in current main. Do not replay the old
          # exact-text recovery patch when the structural 24h implementation exists.
          if grep -q 'home-discussed-stage-d' "$HOME_FILE"             && grep -q "if (mode === 'popular')" "$FEED_FILE"             && grep -q "format: 'TOPIC'" "$FEED_FILE"             && grep -q 'recentCommentSince' "$FEED_FILE"             && grep -q 'publication.comments.length' "$FEED_FILE"; then
            echo 'Stage D structure already exists; skipping legacy recovery.'
          else
            echo 'Stage D structure is incomplete; running legacy recovery once.'
            printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-stage-d-recovery.py
            python3 /tmp/forrum-stage-d-recovery.py
          fi

          # Normalize the historical typo before any later Stage D contract check.
          python3 <<'PYCODE'
          from pathlib import Path

          wrong = 'FORRUM_DISCUSSSED_TOPICS_24H_V11'
          correct = 'FORRUM_DISCUSSED_TOPICS_24H_V11'

          feed_path = Path('apps/api/src/feed/feed.service.ts')
          check_path = Path('scripts/home-redesign-stage-d-check.mjs')

          feed = feed_path.read_text(encoding='utf-8')
          if wrong in feed:
              feed = feed.replace(wrong, correct)
          elif correct not in feed:
              anchor = "    if (mode === 'popular') {"
              structural = (
                  "format: 'TOPIC'" in feed
                  and 'recentCommentSince' in feed
                  and 'publication.comments.length' in feed
              )
              if not structural or anchor not in feed:
                  raise RuntimeError('Stage D 24h ranking structure is missing')
              feed = feed.replace(
                  anchor,
                  f'    // {correct}\n{anchor}',
                  1,
              )
          feed_path.write_text(feed, encoding='utf-8')

          check = check_path.read_text(encoding='utf-8')
          if wrong in check:
              check = check.replace(wrong, correct)
              check_path.write_text(check, encoding='utf-8')

          print('Stage D baseline is structurally valid and marker is normalized.')
          PYCODE

          # Do not run the Stage D checker here: after Stage E it correctly requires
          # both /feed?mode=popular and /feed?mode=new. Full D+E+F checks run later.

      - name: Apply new topics Stage E
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail

          HOME_FILE='apps/web/components/home-dashboard.tsx'
          PAGE_FILE='apps/web/app/page.tsx'

          # Stage E is already present in current main after the successful E.3 run.
          # Never replay its exact-text patch over an already migrated component.
          if grep -q 'home-new-topics-stage-e' "$HOME_FILE"             && grep -q 'newFeed?: PublicationCardData\[\]' "$HOME_FILE"             && grep -q "newFeed.slice(0, 5)" "$HOME_FILE"             && grep -q "'/feed?mode=new'" "$PAGE_FILE"; then
            echo 'Stage E already present; skipping legacy Stage E patch.'
          else
            echo 'Stage E is incomplete; applying Stage E patch once.'
            printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-stage-e-patch.py
            python3 /tmp/forrum-stage-e-patch.py
          fi

          # Defensive normalization for repositories touched by an older non-idempotent
          # runner. Keep exactly one newFeedSeeded declaration.
          python3 <<'PYCODE'
          from pathlib import Path
          import re

          path = Path('apps/web/components/home-dashboard.tsx')
          source = path.read_text(encoding='utf-8')

          declaration = "  const newFeedSeeded = initialData.newFeed !== undefined;"
          count = source.count(declaration)

          if count > 1:
              first = source.find(declaration)
              head = source[:first + len(declaration)]
              tail = source[first + len(declaration):]
              tail = tail.replace('\n' + declaration, '')
              tail = tail.replace(declaration + '\n', '')
              source = head + tail
              path.write_text(source, encoding='utf-8')
              print(f'Removed {count - 1} duplicate newFeedSeeded declaration(s).')
          elif count == 1:
              print('newFeedSeeded declaration is unique.')
          else:
              raise RuntimeError('Stage E newFeedSeeded declaration is missing')

          # Also fail early if any other Stage E state declaration was duplicated.
          checks = [
              r'const \[newFeed, setNewFeed\]',
              r'const \[newFeedLoading, setNewFeedLoading\]',
              r'const \[newFeedError, setNewFeedError\]',
              r'const \[newFeedRequestVersion, setNewFeedRequestVersion\]',
          ]
          source = path.read_text(encoding='utf-8')
          for pattern in checks:
              hits = len(re.findall(pattern, source))
              if hits != 1:
                  raise RuntimeError(f'Stage E declaration count for {pattern}: {hits}')

          print('Stage E state is idempotent and unique.')
          PYCODE

      - name: Apply approved right rail Stage F
        shell: bash
        env:
          STAGE_F_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$STAGE_F_PATCH_B64" | base64 -d > /tmp/forrum-stage-f-patch.py
          python3 /tmp/forrum-stage-f-patch.py

      - name: Verify Stage D E and F scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/page\.tsx|apps/web/components/home-dashboard\.tsx|apps/web/app/globals\.css|apps/api/src/feed/feed\.service\.ts|apps/api/prisma/schema\.prisma|apps/api/src/governance/dto\.ts|apps/api/src/governance/governance\.controller\.ts|apps/api/src/governance/governance\.service\.ts|scripts/ui-interaction-check\.mjs|scripts/home-redesign-stage-d-check\.mjs|scripts/home-redesign-stage-e-check\.mjs|scripts/home-redesign-stage-f-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_D_V11\.md|docs/FORRUM_HOME_REDESIGN_STAGE_E_V11\.md|docs/FORRUM_HOME_REDESIGN_STAGE_F_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files were changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff -- apps/web/components/site-header.tsx apps/web/components/main-nav.tsx apps/web/app/layout.tsx | grep -q .; then
            echo 'Stage E.3 must not alter the approved header or global layout.'
            exit 1
          fi

          grep -q 'home-discussed-stage-d' apps/web/components/home-dashboard.tsx
          grep -q 'home-new-topics-stage-e' apps/web/components/home-dashboard.tsx
          grep -q "'/feed?mode=popular'" apps/web/app/page.tsx
          grep -q "'/feed?mode=new'" apps/web/app/page.tsx
          grep -q 'FORRUM_DISCUSSED_TOPICS_24H_V11' apps/api/src/feed/feed.service.ts
          grep -q 'home-right-stage-f' apps/web/components/home-dashboard.tsx
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_F_V11' apps/web/app/globals.css
          grep -q 'model CuratorApplication' apps/api/prisma/schema.prisma
          grep -q "@Post('curator-applications')" apps/api/src/governance/governance.controller.ts

      - name: Create isolated Stage F.2 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            apps/web/app/page.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/globals.css \
            apps/api/src/feed/feed.service.ts \
            apps/api/prisma/schema.prisma \
            apps/api/src/governance/dto.ts \
            apps/api/src/governance/governance.controller.ts \
            apps/api/src/governance/governance.service.ts \
            scripts/ui-interaction-check.mjs \
            scripts/home-redesign-stage-d-check.mjs \
            scripts/home-redesign-stage-e-check.mjs \
            scripts/home-redesign-stage-f-check.mjs \
            docs/FORRUM_HOME_REDESIGN_STAGE_D_V11.md \
            docs/FORRUM_HOME_REDESIGN_STAGE_E_V11.md \
            docs/FORRUM_HOME_REDESIGN_STAGE_F_V11.md

          if git diff --cached --quiet; then
            echo 'Stage D + E + F.2 are already present.'
          else
            git commit -m "Restore discussed topics and add new topics table"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Stage F checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage F.2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
