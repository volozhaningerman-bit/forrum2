name: FORRUM Cleanup Legacy Patch Workflows

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN to remove only the approved legacy patch workflows'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: forrum-clean-legacy-patch-workflows
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'CLEAN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Show cleanup candidates
        shell: bash
        run: |
          set -euo pipefail

          echo "The following OLD PATCH workflow families are eligible:"
          printf '%s\n' \
            '.github/workflows/forrum-category-page-stage-1-v14.yml' \
            '.github/workflows/forrum-create-topic-polish-v15-*.yml' \
            '.github/workflows/forrum-create-topic-refinement-v15-*.yml' \
            '.github/workflows/forrum-create-topic-workspace-v15-*.yml' \
            '.github/workflows/forrum-editor-controls-v15-*.yml' \
            '.github/workflows/forrum-home-paper-graphite-v16.yml'

          echo
          echo "Existing matches:"
          find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-category-page-stage-1-v14.yml' -o \
              -name 'forrum-create-topic-polish-v15-*.yml' -o \
              -name 'forrum-create-topic-refinement-v15-*.yml' -o \
              -name 'forrum-create-topic-workspace-v15-*.yml' -o \
              -name 'forrum-editor-controls-v15-*.yml' -o \
              -name 'forrum-home-paper-graphite-v16.yml' \
            \) \
            -print | sort

      - name: Remove approved legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-category-page-stage-1-v14.yml' -o \
              -name 'forrum-create-topic-polish-v15-*.yml' -o \
              -name 'forrum-create-topic-refinement-v15-*.yml' -o \
              -name 'forrum-create-topic-workspace-v15-*.yml' -o \
              -name 'forrum-editor-controls-v15-*.yml' -o \
              -name 'forrum-home-paper-graphite-v16.yml' \
            \) \
            -delete

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          # Current canonical homepage workflow MUST survive.
          test -f .github/workflows/forrum-home-paper-graphite-v16-fixed.yml

          # Never touch generic CI / deploy workflows or unknown workflows.
          # Only deletions inside .github/workflows are allowed.
          changed="$(git status --porcelain=v1 -uall)"

          echo "Git changes:"
          printf '%s\n' "$changed"

          unexpected="$(
            printf '%s\n' "$changed" \
              | awk '
                  NF == 0 { next }
                  {
                    status = substr($0, 1, 2)
                    path = substr($0, 4)
                    if (status !~ /D/ || path !~ /^\.github\/workflows\//) {
                      print $0
                    }
                  }
                '
          )"

          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected non-workflow or non-deletion changes detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # Confirm all approved legacy families are gone.
          if find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-category-page-stage-1-v14.yml' -o \
              -name 'forrum-create-topic-polish-v15-*.yml' -o \
              -name 'forrum-create-topic-refinement-v15-*.yml' -o \
              -name 'forrum-create-topic-workspace-v15-*.yml' -o \
              -name 'forrum-editor-controls-v15-*.yml' -o \
              -name 'forrum-home-paper-graphite-v16.yml' \
            \) \
            -print -quit | grep -q .; then
            echo "::error::At least one approved legacy workflow still remains."
            exit 1
          fi

          echo
          echo "Remaining workflows:"
          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -printf '%f\n' | sort

      - name: Commit cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No matching legacy patch workflows were present."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add -u .github/workflows
          git diff --cached --check
          git commit -m "Clean legacy FORRUM patch workflows"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push cleanup
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote cleanup
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Legacy patch workflows removed from canonical main."
