name: FORRUM HOME V18 PATCH

on:
  workflow_dispatch:

jobs:
  patch-home-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup
        run: |
          mkdir -p .forrum-backup/home-v17
          cp apps/web/components/home-dashboard.tsx .forrum-backup/home-v17/
          cp apps/web/app/globals.css .forrum-backup/home-v17/

      - name: Validate
        run: |
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css

      - name: Add V18 marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/components/home-dashboard.tsx")
          s = p.read_text()
          if "FORRUM_HOME_V18" not in s:
              s += "\n/* FORRUM_HOME_V18 */\n"
              p.write_text(s)
          PY

      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
