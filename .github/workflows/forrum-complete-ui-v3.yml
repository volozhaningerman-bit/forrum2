name: FORRUM Complete UI V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-test-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forrum
          POSTGRES_PASSWORD: forrum
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forrum -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NODE_ENV: test
      API_PORT: "4000"
      PORT: "3000"
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:4000/v1
      PUBLIC_API_URL: http://127.0.0.1:4000
      SESSION_COOKIE_NAME: forrum_session
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: FORRUM <noreply@forrum.test>
      TELEGRAM_POLLING_ENABLED: "false"
      OWNER_EMAIL: owner@forrum.local
      OWNER_PASSWORD: Owner12345!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

