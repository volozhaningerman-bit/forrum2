      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static product checks
        run: |
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run API test suite
        run: npm test

      - name: First clean production build
        run: |
          rm -rf packages/contracts/dist apps/api/dist apps/web/.next
          npm run build

      - name: Smoke test API and web
        shell: bash
        run: |
          set -euo pipefail

          npm run start -w @forrum/api > /tmp/forrum-api.log 2>&1 &
          API_PID=$!
          npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" "$API_PID" 2>/dev/null || true
            wait "$WEB_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API stopped before becoming healthy"
              cat /tmp/forrum-api.log
              exit 1
            fi

            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "Web stopped before becoming healthy"
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Smoke test timed out"
            cat /tmp/forrum-api.log
            cat /tmp/forrum-web.log
            exit 1
          fi

          cat /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/promotion/terms > /tmp/promotion.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/media/partners > /tmp/media-partners.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/communities > /tmp/communities.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/users/owner > /tmp/profile.json
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/communities > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/events/create > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/media > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/promotion > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/u/owner > /dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          terms = json.loads(Path('/tmp/promotion.json').read_text())
          assert terms['durations'] == [1, 3, 7, 30]

          communities = json.loads(Path('/tmp/communities.json').read_text())
          assert isinstance(communities, list) and communities

          profile = json.loads(Path('/tmp/profile.json').read_text())
          assert profile['username'] == 'owner'
          assert 'showFavorites' in profile
          assert 'showSubscriptions' in profile
          assert 'workshopPortfolio' in profile
          assert 'gifts' in profile

          partners = json.loads(Path('/tmp/media-partners.json').read_text())
          assert isinstance(partners, list)

          print('Runtime payload assertions passed')
          PY

      - name: Second clean build for repeatability
        run: |
          rm -rf packages/contracts/dist apps/api/dist apps/web/.next
          npm run build

      - name: Final repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sha256sum --check --strict /tmp/forrum-v3-files.sha256
          git status --short

      - name: Commit complete verified update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM build fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps packages docs scripts

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Complete dark interface and remaining product flows"
            git push
          fi
