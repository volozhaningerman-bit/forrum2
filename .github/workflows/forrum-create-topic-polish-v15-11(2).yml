name: FORRUM Create Topic Polish V15.11
run-name: FORRUM Create Topic Polish V15.11
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-create-topic-polish-v15-11
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  create-topic-polish-v15-11:
    name: Create Topic Polish V15.11
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.10 and detect V15.11
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/components/bbcode-editor.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fc '// FORRUM_EDITOR_CONTROLS_V15_10' \\\n  apps/web/lib/bbcode.ts)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_EDITOR_CONTROLS_V15_10_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_EDITOR_CONTROLS_V15_10_END */' \\\n  apps/web/app/globals.css)\" -eq 1\ngrep -Fq 'FORRUM_TAG_STYLE_CONTROLLER_V15_10' \\\n  apps/api/src/publications/tag-styles.controller.ts\ngrep -Fq 'FORRUM_TAG_STYLE_MODULE_V15_10' \\\n  apps/api/src/publications/publications.module.ts\ngrep -Fq 'FORRUM_TAG_STYLE_PRESETS_V15_10' \\\n  apps/api/src/publications/publications.service.ts\n\nnode scripts/editor-controls-v15-10-check.mjs\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\n\
        node scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\ncount_marker() {\n  local pattern=\"$1\"\n  local path=\"$2\"\n  if [ ! -f \"$path\" ]; then\n    printf '0\n'\n    return\n  fi\n  grep -Fc \"$pattern\" \"$path\" || true\n}\n\nform_count=\"$(count_marker '// FORRUM_CREATE_TOPIC_POLISH_V15_11' \\\n  apps/web/app/create/publication-form.tsx)\"\ncss_start_count=\"$(count_marker '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_START */' \\\n  apps/web/app/globals.css)\"\ncss_end_count=\"$(count_marker '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_END */' \\\n  apps/web/app/globals.css)\"\ncheck_count=\"$(count_marker 'Create Topic Polish V15.11 passed:' \\\n  scripts/create-topic-polish-v15-11-check.mjs)\"\ndoc_count=\"$(count_marker '# FORRUM Create Topic Polish V15.11' \\\n  docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md)\"\
        \n\nfor count in \"$form_count\" \"$css_start_count\" \"$css_end_count\" \\\n  \"$check_count\" \"$doc_count\"; do\n  test -n \"$count\"\n  test \"$count\" -le 1\ndone\n\nfor count in \"$css_start_count\" \"$css_end_count\" \"$check_count\" \\\n  \"$doc_count\"; do\n  if [ \"$form_count\" -ne \"$count\" ]; then\n    echo 'Partial V15.11 marker state detected.'\n    exit 1\n  fi\ndone\n\nif [ \"$form_count\" -eq 1 ]; then\n  node scripts/create-topic-polish-v15-11-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Create Topic Polish V15.11 is already applied and valid.'\nelse\n  require_sha() {\n    local path=\"$1\"\n    local expected=\"$2\"\n    local actual\n    actual=\"$(sha256sum \"$path\" | cut -d' ' -f1)\"\n    if [ \"$actual\" != \"$expected\" ]; then\n      echo \"Unexpected V15.10 baseline hash: $path\"\n      echo \"expected=$expected\"\n      echo \"actual=$actual\"\n      exit 1\n    fi\n  }\n\n  require_sha_one_of() {\n    local path=\"$1\"\n\
        \    local expected_a=\"$2\"\n    local expected_b=\"$3\"\n    local actual\n    actual=\"$(sha256sum \"$path\" | cut -d' ' -f1)\"\n    if [ \"$actual\" != \"$expected_a\" ] && [ \"$actual\" != \"$expected_b\" ]; then\n      echo \"Unexpected V15.10 baseline hash: $path\"\n      echo \"expected_one_of=$expected_a,$expected_b\"\n      echo \"actual=$actual\"\n      exit 1\n    fi\n  }\n\n  require_sha apps/web/app/create/publication-form.tsx \\\n    'a60373e2a9785c2c2dbc3ef74adfad020713bbef6cda0d10ea74410299cefb2a'\n  require_sha_one_of apps/web/app/globals.css \\\n    'b5496e0c167e7954399735650b40769e952c53c5f9bcc0883ab7f49891afbb63' \\\n    '4409ebe438ed7e95dbd93ce0894d7e4dde846b8a9ee5a6fd00403f2ba709c399'\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\nfi\n\ntest -z \"$(git status --porcelain)\""
    - name: Apply Create Topic Polish V15.11
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      env:
        FORM_B64: 
        CSS_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$FORM_B64\" | base64 -d \\\n  > apps/web/app/create/publication-form.tsx\nprintf '%s' \"$CSS_B64\" | base64 -d \\\n  >> apps/web/app/globals.css\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/create-topic-polish-v15-11-check.mjs\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md\n\ngit diff --check\nnode scripts/create-topic-polish-v15-11-check.mjs"
    - name: Verify V15.11 contracts and protected scope
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_POLISH_V15_11' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\nnode scripts/create-topic-polish-v15-11-check.mjs\nnode scripts/editor-controls-v15-10-check.mjs\nnode scripts/visual-bbcode-editor-v15-9-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\nexpected=\"$(printf '%s\n' \\\n  'apps/web/app/create/publication-form.tsx' \\\n  'apps/web/app/globals.css' \\\n  'docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md' \\\n  'scripts/create-topic-polish-v15-11-check.mjs'\
        \ | sort)\"\nactual=\"$(git status --porcelain | cut -c4- | sort)\"\ntest \"$actual\" = \"$expected\""
    - name: Create isolated verified V15.11 commit
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit config user.name 'forrum-actions'\ngit config user.email 'actions@forrum.local'\n\ngit add \\\n  apps/web/app/create/publication-form.tsx \\\n  apps/web/app/globals.css \\\n  scripts/create-topic-polish-v15-11-check.mjs \\\n  docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md\n\ngit diff --cached --check\nexpected=\"$(printf '%s\n' \\\n  'apps/web/app/create/publication-form.tsx' \\\n  'apps/web/app/globals.css' \\\n  'docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md' \\\n  'scripts/create-topic-polish-v15-11-check.mjs' | sort)\"\nactual=\"$(git diff --cached --name-only | sort)\"\ntest \"$actual\" = \"$expected\"\n\ngit commit -m 'Polish create topic workspace V15.11'\ntest -z \"$(git status --porcelain)\""
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm install --package-lock=false


        test ! -f package-lock.json'
    - name: Generate validate sync and seed Prisma
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
    - name: Static UX accessibility and regression checks
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/create-topic-polish-v15-11-check.mjs\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_POLISH_V15_11' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_POLISH_V15_11_END */' \\\n  apps/web/app/globals.css)\" -eq 1\ngit diff --check HEAD^ HEAD -- \\\n  apps/web/app/create/publication-form.tsx \\\n  apps/web/app/globals.css \\\n  docs/FORRUM_CREATE_TOPIC_POLISH_V15_11.md \\\n  scripts/create-topic-polish-v15-11-check.mjs"
    - name: Typecheck every workspace
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run typecheck
    - name: Run API tests
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm test
    - name: Clean production build
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run build
    - name: Remove generated build noise
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git reset --hard HEAD

        git clean -ffdx


        test -z "$(git status --porcelain)"'
    - name: Push verified Create Topic Polish V15.11
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
    - name: Verify remote main
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_POLISH_V15_11'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_POLISH_V15_11_START'\ngit show origin/main:scripts/create-topic-polish-v15-11-check.mjs \\\n  | grep -Fq 'Create Topic Polish V15.11 passed:'\nnode scripts/create-topic-polish-v15-11-check.mjs\necho 'FORRUM Create Topic Polish V15.11 remote verification passed.' "
    - name: Confirm V15.11 was already valid
      if: steps.baseline.outputs.already_applied == 'true'
      shell: bash
      run: echo 'FORRUM Create Topic Polish V15.11 was already applied; no files changed.'
