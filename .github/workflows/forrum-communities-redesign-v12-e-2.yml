name: FORRUM Communities Redesign V12.E.2
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-communities-redesign-v12-e-2
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  communities-stage-e-2:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved Communities Stage D baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'communities-v12-catalogue-row' apps/web/app/communities/communities-client.tsx
          grep -q 'renderCatalogueRow' apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-catalogue-name' apps/web/app/communities/communities-client.tsx
          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_D_V12' apps/web/app/globals.css
          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_D_V12_INTERACTION_CONTRACT' scripts/ui-interaction-check.mjs
          grep -q "const hideFooter = pathname === '/communities';" apps/web/components/site-footer.tsx
          grep -q 'home-tree-workshop-section' apps/web/components/home-dashboard.tsx
          test -z "$(git status --porcelain)"

      - name: Apply final Communities Stage E.2 reference implementation
        shell: bash
        env:
          STAGE_E_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$STAGE_E_PATCH_B64" | base64 -d > /tmp/forrum-communities-stage-e.py
          python3 /tmp/forrum-communities-stage-e.py

      - name: Verify Stage E.2 source contract and patch scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/communities/communities-client\.tsx|apps/web/app/globals\.css|apps/api/prisma/seed\.ts|apps/web/components/home-dashboard\.tsx|scripts/ui-interaction-check\.mjs|scripts/communities-redesign-stage-a-check\.mjs|scripts/communities-redesign-stage-b-check\.mjs|scripts/communities-redesign-stage-c-check\.mjs|scripts/communities-redesign-stage-d-check\.mjs|scripts/communities-redesign-stage-e-check\.mjs|docs/FORRUM_COMMUNITIES_REDESIGN_STAGE_E_V12\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff -- \
            apps/web/components/site-header.tsx \
            apps/web/components/main-nav.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/app/page.tsx \
            apps/api/src \
            apps/api/prisma/schema.prisma | grep -q .; then
            echo 'Stage E altered approved global header/footer, homepage loader, API source or schema unexpectedly.'
            exit 1
          fi

          grep -q "community.slug !== 'workshop'" apps/web/components/home-dashboard.tsx
          grep -q "slug: 'workshop'" apps/api/prisma/seed.ts
          grep -q "slug: 'workshop-projects'" apps/api/prisma/seed.ts
          grep -q 'communities-v12-hierarchy-panel' apps/web/app/communities/communities-client.tsx
          grep -q 'grid-template-columns: minmax(0, 1fr) minmax(300px, 29%);' apps/web/app/globals.css

      - name: Create isolated Communities Stage E.2 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            apps/web/app/communities/communities-client.tsx \
            apps/web/app/globals.css \
            apps/api/prisma/seed.ts \
            apps/web/components/home-dashboard.tsx \
            scripts/ui-interaction-check.mjs \
            scripts/communities-redesign-stage-a-check.mjs \
            scripts/communities-redesign-stage-b-check.mjs \
            scripts/communities-redesign-stage-c-check.mjs \
            scripts/communities-redesign-stage-d-check.mjs \
            scripts/communities-redesign-stage-e-check.mjs \
            docs/FORRUM_COMMUNITIES_REDESIGN_STAGE_E_V12.md

          if git diff --cached --quiet; then
            echo 'Communities Stage E is already present.'
          else
            git commit -m "Finish FORRUM Communities reference layout"
          fi

          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and final Communities E.2 checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Communities Stage E.2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          test "$local_sha" = "$remote_sha"

          verify_remote_marker() {
            local path="$1"
            local marker="$2"
            local label="$3"

            local content
            content="$(git show "origin/main:$path")"

            if [[ "$content" != *"$marker"* ]]; then
              echo "Remote verification failed: $label"
              echo "Missing marker: $marker"
              exit 1
            fi
          }

          verify_remote_marker             "apps/web/app/communities/communities-client.tsx"             "communities-v12-hierarchy-panel"             "Communities hierarchy panel"

          verify_remote_marker             "apps/web/app/communities/communities-client.tsx"             "CommunityGlyph"             "Communities system glyphs"

          verify_remote_marker             "apps/web/app/globals.css"             "FORRUM_COMMUNITIES_REDESIGN_STAGE_E_V12"             "Communities Stage E CSS"

          verify_remote_marker             "apps/api/prisma/seed.ts"             "FORRUM_COMMUNITIES_STAGE_E_WORKSHOP_ROOT"             "Workshop taxonomy root"

          verify_remote_marker             "apps/web/components/home-dashboard.tsx"             "community.slug !== 'workshop'"             "Homepage Workshop duplicate protection"

          verify_remote_marker             "scripts/ui-interaction-check.mjs"             "FORRUM_COMMUNITIES_REDESIGN_STAGE_E_V12_INTERACTION_CONTRACT"             "Communities interaction contract"

          verify_remote_marker             "scripts/communities-redesign-stage-d-check.mjs"             "'roots.map((root) =>'"             "Evolved Stage D root map contract"

          verify_remote_marker             "scripts/communities-redesign-stage-d-check.mjs"             "'renderCatalogueRow(root)'"             "Evolved Stage D renderer contract"

          echo "Remote main verification passed without pipefail/SIGPIPE pipelines."
