name: FORRUM Section Page Polish V14.8
run-name: FORRUM Section Page Polish V14.8

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-section-page-polish-v14-8
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  section-page-polish-v14-8:
    name: Section Page Polish V14.8
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify successful V14.7 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f "apps/web/app/communities/[slug]/category-page.tsx"
          test -f scripts/section-page-layout-v14-7-check.mjs

          grep -Fq "FORRUM_SECTION_PAGE_LAYOUT_V14_7"             "apps/web/app/communities/[slug]/category-page.tsx"
          grep -Fq "FORRUM_SECTION_PAGE_LAYOUT_V14_7"             apps/web/app/globals.css
          grep -Fq 'className="section-category-tree"'             "apps/web/app/communities/[slug]/category-page.tsx"
          grep -Fq 'className="section-topic-table"'             "apps/web/app/communities/[slug]/category-page.tsx"
          grep -Fq "FORRUM_GLOBAL_HEADER_V13_4"             apps/web/components/main-nav.tsx

          if grep -Fq "FORRUM_SECTION_PAGE_POLISH_V14_8"             "apps/web/app/communities/[slug]/category-page.tsx"; then
            echo "V14.8 is already present on main."
            exit 1
          fi

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs

          test -z "$(git status --porcelain)"

      - name: Apply Section Page Polish V14.8
        shell: bash
        env:
          PAGE_B64: 
          CSS_APPEND_B64: 
          SEED_PATCH_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$PAGE_B64" | base64 -d             > "apps/web/app/communities/[slug]/category-page.tsx"

          if ! grep -Fq "FORRUM_SECTION_PAGE_POLISH_V14_8"             apps/web/app/globals.css; then
            printf '\n%s\n' "$(printf '%s' "$CSS_APPEND_B64" | base64 -d)"               >> apps/web/app/globals.css
          fi

          printf '%s' "$SEED_PATCH_B64" | base64 -d             > /tmp/forrum-section-page-polish-v14-8-seed.py
          python3 /tmp/forrum-section-page-polish-v14-8-seed.py

          printf '%s' "$CHECK_B64" | base64 -d             > scripts/section-page-polish-v14-8-check.mjs

          printf '%s' "$DOC_B64" | base64 -d             > docs/FORRUM_SECTION_PAGE_POLISH_V14_8.md

      - name: Verify V14.8 source and protected scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/global-header-v13-4-check.mjs

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs

          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          unexpected=""
          while IFS= read -r changed_path; do
            case "$changed_path" in
              "apps/web/app/communities/[slug]/category-page.tsx"               |"apps/web/app/globals.css"               |"apps/api/prisma/seed.ts"               |"scripts/section-page-polish-v14-8-check.mjs"               |"docs/FORRUM_SECTION_PAGE_POLISH_V14_8.md")
                ;;
              *)
                unexpected+="${changed_path}"$'\n'
                ;;
            esac
          done < <(git diff --name-only)

          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s' "$unexpected"
            exit 1
          fi

          if git diff --             apps/web/components/main-nav.tsx             apps/web/components/site-header.tsx             apps/web/components/site-footer.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/communities/communities-client.tsx             apps/web/app/page.tsx             apps/api/src             apps/api/prisma/schema.prisma | grep -q .; then
            echo "V14.8 changed protected catalogue/home/header/API/schema scope."
            exit 1
          fi

      - name: Create isolated verified V14.8 commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add --             "apps/web/app/communities/[slug]/category-page.tsx"             apps/web/app/globals.css             apps/api/prisma/seed.ts             scripts/section-page-polish-v14-8-check.mjs             docs/FORRUM_SECTION_PAGE_POLISH_V14_8.md

          git commit -m "Polish internal section page V14.8"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and V14.8 checks
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Section Page Polish V14.8
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show 'origin/main:apps/web/app/communities/[slug]/category-page.tsx'             | grep -Fq 'FORRUM_SECTION_PAGE_POLISH_V14_8'
          git show 'origin/main:apps/web/app/communities/[slug]/category-page.tsx'             | grep -Fq '<SectionGlyph slug={data.slug} />'
          git show origin/main:apps/web/app/globals.css             | grep -Fq 'FORRUM_SECTION_PAGE_POLISH_V14_8'
          git show origin/main:apps/api/prisma/seed.ts             | grep -Fq 'FORRUM_SECTION_PAGE_POLISH_V14_8_DEMO_TOPICS'
          git show origin/main:apps/api/prisma/seed.ts             | grep -Fq "promotion-organic-growth-checklist"
          git show origin/main:apps/web/components/main-nav.tsx             | grep -Fq 'FORRUM_GLOBAL_HEADER_V13_4'

          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs

          echo "FORRUM Section Page Polish V14.8 remote verification passed."
