name: FORRUM API Loading Fix V5.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-and-publish:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: "3000"
      API_INTERNAL_URL: http://127.0.0.1:4100/v1
      PUBLIC_API_URL: http://127.0.0.1:4100

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply runtime API connection fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = {
              "apps/web/lib/api-base.ts": "const DEFAULT_PUBLIC_API =\n  'https://api-production-37ce.up.railway.app';\n\nfunction addProtocol(value: string) {\n  if (/^https?:\\/\\//i.test(value)) return value;\n\n  if (\n    value.includes('.railway.internal') ||\n    value.startsWith('localhost') ||\n    value.startsWith('127.0.0.1')\n  ) {\n    return `http://${value}`;\n  }\n\n  return `https://${value}`;\n}\n\nexport function resolveApiBase() {\n  const configured =\n    process.env.API_INTERNAL_URL?.trim() ||\n    process.env.PUBLIC_API_URL?.trim() ||\n    DEFAULT_PUBLIC_API;\n\n  const withProtocol = addProtocol(configured);\n  const withoutTrailingSlash = withProtocol.replace(\n    /\\/+$/,\n    '',\n  );\n\n  return withoutTrailingSlash.endsWith('/v1')\n    ? withoutTrailingSlash\n    : `${withoutTrailingSlash}/v1`;\n}\n",
              "apps/web/app/api/[...path]/route.ts": "import { type NextRequest } from 'next/server';\nimport { resolveApiBase } from '@/lib/api-base';\n\nexport const runtime = 'nodejs';\nexport const dynamic = 'force-dynamic';\n\ntype RouteContext = {\n  params: Promise<{\n    path?: string[];\n  }>;\n};\n\nconst HOP_BY_HOP_HEADERS = new Set([\n  'connection',\n  'content-length',\n  'content-encoding',\n  'keep-alive',\n  'proxy-authenticate',\n  'proxy-authorization',\n  'te',\n  'trailer',\n  'transfer-encoding',\n  'upgrade',\n]);\n\nfunction requestHeaders(request: NextRequest) {\n  const headers = new Headers(request.headers);\n\n  headers.delete('host');\n  headers.delete('content-length');\n  headers.delete('connection');\n  headers.delete('accept-encoding');\n\n  if (!headers.has('accept')) {\n    headers.set('accept', 'application/json');\n  }\n\n  return headers;\n}\n\nfunction responseHeaders(upstream: Response) {\n  const headers = new Headers();\n\n  upstream.headers.forEach((value, key) => {\n    const normalized = key.toLowerCase();\n\n    if (\n      HOP_BY_HOP_HEADERS.has(normalized) ||\n      normalized === 'set-cookie'\n    ) {\n      return;\n    }\n\n    headers.append(key, value);\n  });\n\n  const sourceHeaders = upstream.headers as Headers & {\n    getSetCookie?: () => string[];\n  };\n\n  const cookies =\n    sourceHeaders.getSetCookie?.() ??\n    (upstream.headers.get('set-cookie')\n      ? [upstream.headers.get('set-cookie') as string]\n      : []);\n\n  for (const cookie of cookies) {\n    headers.append(\n      'set-cookie',\n      cookie.replace(/;\\s*Domain=[^;]+/gi, ''),\n    );\n  }\n\n  headers.set('cache-control', 'no-store');\n\n  return headers;\n}\n\nasync function proxy(\n  request: NextRequest,\n  context: RouteContext,\n) {\n  const { path = [] } = await context.params;\n  const base = resolveApiBase();\n\n  const encodedPath = path\n    .map((segment) => encodeURIComponent(segment))\n    .join('/');\n\n  const target = new URL(\n    encodedPath ? `${base}/${encodedPath}` : base,\n  );\n\n  target.search = request.nextUrl.search;\n\n  const controller = new AbortController();\n  const timeout = setTimeout(\n    () => controller.abort(),\n    20_000,\n  );\n\n  request.signal.addEventListener(\n    'abort',\n    () => controller.abort(),\n    { once: true },\n  );\n\n  try {\n    const hasBody = !['GET', 'HEAD'].includes(\n      request.method,\n    );\n\n    const body = hasBody\n      ? await request.arrayBuffer()\n      : undefined;\n\n    const upstream = await fetch(target, {\n      method: request.method,\n      headers: requestHeaders(request),\n      body:\n        body && body.byteLength > 0\n          ? body\n          : undefined,\n      redirect: 'manual',\n      cache: 'no-store',\n      signal: controller.signal,\n    });\n\n    return new Response(upstream.body, {\n      status: upstream.status,\n      statusText: upstream.statusText,\n      headers: responseHeaders(upstream),\n    });\n  } catch (cause) {\n    const timedOut =\n      cause instanceof Error &&\n      cause.name === 'AbortError';\n\n    return Response.json(\n      {\n        statusCode: 502,\n        message: timedOut\n          ? 'API не ответил за 20 секунд'\n          : 'Web-сервис не смог подключиться к API',\n        apiBase: base.replace(\n          /:\\/\\/([^/]+).*$/,\n          '://$1',\n        ),\n      },\n      {\n        status: 502,\n        headers: {\n          'cache-control': 'no-store',\n        },\n      },\n    );\n  } finally {\n    clearTimeout(timeout);\n  }\n}\n\nexport {\n  proxy as DELETE,\n  proxy as GET,\n  proxy as HEAD,\n  proxy as OPTIONS,\n  proxy as PATCH,\n  proxy as POST,\n  proxy as PUT,\n};\n",
              "apps/web/lib/api.ts": "export const API_URL = '/api';\n\nfunction parseMessage(\n  data: Record<string, unknown>,\n  fallback: string,\n) {\n  const value = data.message;\n\n  if (Array.isArray(value)) {\n    return value.map(String).join('. ');\n  }\n\n  if (typeof value === 'string' && value.trim()) {\n    return value;\n  }\n\n  return fallback;\n}\n\nexport async function api<T>(\n  path: string,\n  init: RequestInit = {},\n): Promise<T> {\n  const headers = new Headers(init.headers);\n\n  if (init.body && !headers.has('Content-Type')) {\n    headers.set('Content-Type', 'application/json');\n  }\n\n  if (!headers.has('Accept')) {\n    headers.set('Accept', 'application/json');\n  }\n\n  const controller = new AbortController();\n  const timeout = setTimeout(\n    () => controller.abort(),\n    20_000,\n  );\n\n  const abortFromCaller = () => controller.abort();\n\n  if (init.signal) {\n    if (init.signal.aborted) {\n      controller.abort();\n    } else {\n      init.signal.addEventListener(\n        'abort',\n        abortFromCaller,\n        { once: true },\n      );\n    }\n  }\n\n  try {\n    const response = await fetch(`${API_URL}${path}`, {\n      ...init,\n      credentials: 'include',\n      headers,\n      cache: init.cache ?? 'no-store',\n      signal: controller.signal,\n    });\n\n    const raw = await response.text();\n\n    let data: Record<string, unknown> = {};\n\n    if (raw) {\n      try {\n        data = JSON.parse(raw) as Record<\n          string,\n          unknown\n        >;\n      } catch {\n        if (!response.ok) {\n          throw new Error(\n            `API вернул ${response.status} вместо JSON`,\n          );\n        }\n\n        return raw as T;\n      }\n    }\n\n    if (!response.ok) {\n      throw new Error(\n        parseMessage(\n          data,\n          `Ошибка запроса: ${response.status}`,\n        ),\n      );\n    }\n\n    return data as T;\n  } catch (cause) {\n    if (\n      cause instanceof Error &&\n      cause.name === 'AbortError'\n    ) {\n      throw new Error(\n        'Сервер не ответил за 20 секунд',\n      );\n    }\n\n    throw cause;\n  } finally {\n    clearTimeout(timeout);\n\n    init.signal?.removeEventListener(\n      'abort',\n      abortFromCaller,\n    );\n  }\n}\n",
              "apps/web/app/page.tsx": "import {\n  HomeDashboard,\n  type HomeInitialData,\n} from '@/components/home-dashboard';\nimport { resolveApiBase } from '@/lib/api-base';\n\nexport const dynamic = 'force-dynamic';\n\nasync function publicApi<T>(path: string) {\n  const controller = new AbortController();\n  const timeout = setTimeout(\n    () => controller.abort(),\n    12_000,\n  );\n\n  try {\n    const response = await fetch(\n      `${resolveApiBase()}${path}`,\n      {\n        cache: 'no-store',\n        headers: {\n          Accept: 'application/json',\n        },\n        signal: controller.signal,\n      },\n    );\n\n    if (!response.ok) return undefined;\n\n    return (await response.json()) as T;\n  } catch {\n    return undefined;\n  } finally {\n    clearTimeout(timeout);\n  }\n}\n\nexport default async function Home() {\n  const [\n    communities,\n    events,\n    polls,\n    announcements,\n    workshop,\n    feed,\n  ] = await Promise.all([\n    publicApi<HomeInitialData['communities']>(\n      '/communities',\n    ),\n    publicApi<HomeInitialData['events']>('/events'),\n    publicApi<HomeInitialData['polls']>(\n      '/governance/polls',\n    ),\n    publicApi<HomeInitialData['announcements']>(\n      '/announcements',\n    ),\n    publicApi<HomeInitialData['workshop']>(\n      '/workshop',\n    ),\n    publicApi<HomeInitialData['feed']>(\n      '/feed?mode=new',\n    ),\n  ]);\n\n  return (\n    <HomeDashboard\n      initialData={{\n        communities,\n        events,\n        polls,\n        announcements,\n        workshop,\n        feed,\n      }}\n    />\n  );\n}\n",
          }

          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + "\n", encoding="utf-8")
              print(f"updated: {name}")
          PY

      - name: Verify proxy source
        shell: bash
        run: |
          set -euo pipefail
          test -f 'apps/web/app/api/[...path]/route.ts'
          grep -q "resolveApiBase" apps/web/lib/api-base.ts
          grep -q "proxy as POST" 'apps/web/app/api/[...path]/route.ts'
          grep -q "API не ответил за 20 секунд" 'apps/web/app/api/[...path]/route.ts'
          grep -q "Сервер не ответил за 20 секунд" apps/web/lib/api.ts
          grep -q "resolveApiBase" apps/web/app/page.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install all build dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Verify required TypeScript declarations
        shell: bash
        run: |
          set -euo pipefail
          test -f node_modules/@types/node/package.json
          test -f node_modules/@types/react/package.json
          test -f node_modules/@types/react-dom/package.json
          node -e "require.resolve('@types/node/package.json')"
          node -e "require.resolve('@types/react-dom/package.json')"

      - name: Static checks
        run: |
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Typecheck web
        run: |
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Clean production build
        env:
          NODE_ENV: production
        run: |
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Start mock API and web
        shell: bash
        run: |
          cat > /tmp/forrum-mock-api.mjs <<'MOCK'
          import http from 'node:http';

          const now = new Date().toISOString();

          const publication = {
            id: '11111111-1111-4111-8111-111111111111',
            slug: 'proxy-smoke-topic',
            format: 'TOPIC',
            type: 'DISCUSSION',
            title: 'Проверка соединения web и API',
            excerpt: 'Эта тема пришла через рабочий same-origin proxy.',
            createdAt: now,
            lastActivityAt: now,
            viewCount: 42,
            author: {
              username: 'tester',
              displayName: 'Тестировщик',
              avatarUrl: null,
              forrumId: 2,
            },
            community: {
              slug: 'development',
              name: 'Разработка',
              accentColor: '#555555',
            },
            commentCount: 3,
            reactionCount: 2,
            bookmarkCount: 1,
            tags: [],
          };

          const routes = new Map([
            ['/v1/health', { status: 'ok' }],
            ['/v1/communities', [
              {
                id: '22222222-2222-4222-8222-222222222222',
                slug: 'development',
                name: 'Разработка',
                description: 'Разработка продуктов и сервисов.',
                shortDescription: 'Код, продукты и команды.',
                subscriberCount: 12,
                publicationCount: 5,
                recentPublicationCount: 2,
                lastActivityAt: now,
                isSubscribed: false,
                parent: null,
              },
            ]],
            ['/v1/events', []],
            ['/v1/governance/polls', []],
            ['/v1/announcements', []],
            ['/v1/workshop', []],
            ['/v1/feed?mode=new', [publication]],
          ]);

          const server = http.createServer(
            async (request, response) => {
              const key =
                request.url?.startsWith('/v1/feed?mode=new')
                  ? '/v1/feed?mode=new'
                  : request.url ?? '';

              if (key === '/v1/proxy-echo') {
                let body = '';

                for await (const chunk of request) {
                  body += chunk;
                }

                response.setHeader(
                  'set-cookie',
                  'forrum_test=ok; Path=/; HttpOnly; SameSite=Lax',
                );
                response.setHeader(
                  'content-type',
                  'application/json; charset=utf-8',
                );
                response.end(
                  JSON.stringify({
                    method: request.method,
                    body,
                    cookie: request.headers.cookie ?? '',
                  }),
                );
                return;
              }

              const payload = routes.get(key);

              if (payload === undefined) {
                response.statusCode = 404;
                response.setHeader(
                  'content-type',
                  'application/json',
                );
                response.end(
                  JSON.stringify({
                    statusCode: 404,
                    message: `Unknown mock route: ${key}`,
                  }),
                );
                return;
              }

              response.setHeader(
                'content-type',
                'application/json; charset=utf-8',
              );
              response.end(JSON.stringify(payload));
            },
          );

          server.listen(4100, '127.0.0.1', () => {
            console.log('Mock API listening on 4100');
          });

          MOCK

          node /tmp/forrum-mock-api.mjs > /tmp/mock-api.log 2>&1 &
          echo $! > /tmp/mock-api.pid

          NODE_ENV=production npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          echo $! > /tmp/forrum-web.pid

      - name: Verify server-rendered homepage
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error               http://127.0.0.1:3000/               > /tmp/home.html; then
              break
            fi

            if ! kill -0 "$(cat /tmp/forrum-web.pid)" 2>/dev/null; then
              echo "Web stopped unexpectedly"
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          grep -q "Проверка соединения web и API" /tmp/home.html
          grep -q "Разработка" /tmp/home.html

      - name: Verify same-origin API proxy
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error             http://127.0.0.1:3000/api/health             > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          curl --fail --silent --show-error             'http://127.0.0.1:3000/api/feed?mode=new'             > /tmp/feed.json
          grep -q "Проверка соединения web и API" /tmp/feed.json

          curl --fail --silent --show-error             -D /tmp/echo.headers             -H 'content-type: application/json'             -H 'cookie: session=test-session'             --data '{"ok":true}'             http://127.0.0.1:3000/api/proxy-echo             > /tmp/echo.json

          grep -q '"method":"POST"' /tmp/echo.json
          grep -q '\\"ok\\":true' /tmp/echo.json
          grep -qi '^set-cookie: forrum_test=ok' /tmp/echo.headers

      - name: Verify malformed Railway URL normalization
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          function addProtocol(value) {
            if (/^https?:\/\//i.test(value)) return value;

            if (
              value.includes('.railway.internal') ||
              value.startsWith('localhost') ||
              value.startsWith('127.0.0.1')
            ) {
              return `http://${value}`;
            }

            return `https://${value}`;
          }

          const publicUrl = addProtocol(
            'api-production-37ce.up.railway.app',
          );
          const privateUrl = addProtocol(
            'api.railway.internal:4000',
          );

          if (
            publicUrl !==
            'https://api-production-37ce.up.railway.app'
          ) {
            throw new Error(publicUrl);
          }

          if (
            privateUrl !==
            'http://api.railway.internal:4000'
          ) {
            throw new Error(privateUrl);
          }
          NODE

      - name: Stop smoke-test services
        if: always()
        shell: bash
        run: |
          kill "$(cat /tmp/forrum-web.pid)" 2>/dev/null || true
          kill "$(cat /tmp/mock-api.pid)" 2>/dev/null || true
          wait "$(cat /tmp/forrum-web.pid)" 2>/dev/null || true
          wait "$(cat /tmp/mock-api.pid)" 2>/dev/null || true

      - name: Second clean build
        env:
          NODE_ENV: production
        run: |
          rm -rf apps/web/.next
          npm run build -w @forrum/web

      - name: Final repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          echo "Changes before commit:"
          git status --short

          test -f apps/web/lib/api-base.ts
          grep -q "resolveApiBase" apps/web/lib/api-base.ts
          grep -q "API не ответил за 20 секунд" 'apps/web/app/api/[...path]/route.ts'
          grep -q "Сервер не ответил за 20 секунд" apps/web/lib/api.ts
          grep -q "resolveApiBase" apps/web/app/page.tsx

      - name: Commit and push verified runtime fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM runtime fixer"
          git config user.email "actions@users.noreply.github.com"

          git add -f             apps/web/lib/api-base.ts             'apps/web/app/api/[...path]/route.ts'

          git add             apps/web/lib/api.ts             apps/web/app/page.tsx

          echo "Staged changes:"
          git diff --cached --stat
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "ERROR: runtime files were tested but nothing was staged."
            echo "Current file hashes:"
            sha256sum               apps/web/lib/api-base.ts               'apps/web/app/api/[...path]/route.ts'               apps/web/lib/api.ts               apps/web/app/page.tsx
            exit 1
          fi

          git commit -m "Fix web to API runtime connection"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main contains the fix
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

          echo "Local SHA:  $LOCAL_SHA"
          echo "Remote SHA: $REMOTE_SHA"

          test "$LOCAL_SHA" = "$REMOTE_SHA"

          git show HEAD:apps/web/lib/api-base.ts             | grep -q "resolveApiBase"

          git show "HEAD:apps/web/app/api/[...path]/route.ts"             | grep -q "API не ответил за 20 секунд"

          git show HEAD:apps/web/lib/api.ts             | grep -q "Сервер не ответил за 20 секунд"

          git show HEAD:apps/web/app/page.tsx             | grep -q "resolveApiBase"

          echo "The fix is committed and present in origin/main."
