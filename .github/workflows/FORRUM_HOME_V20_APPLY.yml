      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify tests and structure
        shell: bash
        run: |
          set -euo pipefail
          npm run test:pure
          node --experimental-strip-types             --experimental-loader ./scripts/local-ts-loader.mjs             --test apps/web/test/home-model.test.ts
          node scripts/home-v20-check.mjs
          npm run validate:static

      - name: Verify types, build and UX
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run validate:ux
          npm run validate:a11y

      - name: Commit and push branch
        shell: bash
        run: |
          set -euo pipefail

          git restore -- apps/api/src/generated/prisma
          git restore -- apps/api/dist apps/web/.next             packages/contracts/dist apps/web/tsconfig.tsbuildinfo

          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"

          git add \
            '.github/workflows/validate-home-19-1.yml'
            'apps/web/app/home-v20.css'
            'apps/web/app/layout.tsx'
            'apps/web/app/page.tsx'
            'apps/web/components/home-dashboard.tsx'
            'apps/web/components/home/activity-panel.tsx'
            'apps/web/components/home/community-tree.tsx'
            'apps/web/components/home/discovery-panels.tsx'
            'apps/web/components/home/forrum-news-panel.tsx'
            'apps/web/components/home/model.ts'
            'apps/web/components/home/popular-topics-panel.tsx'
            'apps/web/components/home/types.ts'
            'apps/web/components/site-header.tsx'
            'apps/web/test/home-model.test.ts'
            'docs/superpowers/plans/2026-09-02-home-neo-forum.md'
            'docs/superpowers/specs/2026-09-02-home-neo-forum-design.md'
            'scripts/dev.mjs'
            'scripts/home-v20-check.mjs'
          git add -u .github/workflows/FORRUM_HOME_V20_APPLY.yml
          git diff --cached --check
          git commit -m "feat(home): introduce neo-forum v20"
          git push origin "$TARGET_BRANCH"

      - name: Open pull request
        shell: bash
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/forrum-home-v20-pr.md"
          {
            echo "## Что изменено"
            echo
            echo "- новый визуальный язык «Старый форум, на новый лад»;"
            echo "- объёмные полупрозрачные панели и редакционная сетка;"
            echo "- живые и правдивые блоки «Медиа», «Услуги» и активности;"
            echo "- обновлённый логотип, дерево сообществ и сигналы тем;"
            echo "- адаптивная трёхколоночная компоновка главной."
            echo
            echo "## Проверено"
            echo
            echo "- 45 API-тестов и 10 тестов модели главной;"
            echo "- TypeScript typecheck;"
            echo "- production build всех 36 маршрутов;"
            echo "- UX, accessibility и структурные проверки."
          } > "$body_file"

          if ! gh pr create             --repo "${{ github.repository }}"             --base main             --head "$TARGET_BRANCH"             --title "Главная: Neo-forum V20"             --body-file "$body_file"; then
            echo "::warning::Branch was pushed, but GitHub did not allow automatic PR creation."
            echo "Create it here: https://github.com/${{ github.repository }}/compare/main...$TARGET_BRANCH?expand=1"
          fi

