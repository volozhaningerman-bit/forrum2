name: FORRUM Home V20 Apply

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forrum-home-v20-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply, verify and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 3b740dde3c1c9d9563680c6cb8bea855f6eb92e2
      TARGET_BRANCH: codex/home-19-1
      DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify baseline and branch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD -- .             ':(exclude).github/workflows/FORRUM_HOME_V20_APPLY.yml')"
          if [ -n "$unexpected" ]; then
            echo "::error::Main changed after the prepared baseline:"
            echo "$unexpected"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin             "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $TARGET_BRANCH already exists."
            exit 1
          fi

          git switch -c "$TARGET_BRANCH"

