      shell: bash
      run: |
        kill "$(cat /tmp/web.pid)" 2>/dev/null || true
        kill "$(cat /tmp/api.pid)" 2>/dev/null || true
        wait "$(cat /tmp/web.pid)" 2>/dev/null || true
        wait "$(cat /tmp/api.pid)" 2>/dev/null || true
