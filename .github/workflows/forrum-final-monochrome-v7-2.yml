nType.PROJECT,\\n    },\\n    {\\n      slug: \'seo-experiment-log\',\\n      title: \'Журнал SEO-экспериментов и изменений трафика\',\\n      body: \'Публикуйте гипотезу, исходные данные, внесённые изменения, период наблюдения и подтверждённый результат.\',\\n      communityId: seoChild.id,\\n      type: PublicationType.CASE,\\n    },\\n    {\\n      slug: \'telegram-bot-launch-checklist\',\\n      title: \'Чек-лист запуска Telegram-бота и Mini App\',\\n      body: \'Проверяем команды, ошибки, права бота, аналитику, уведомления, мобильное отображение и сценарии возврата пользователя.\',\\n      communityId: telegramBotsChild.id,\\n      type: PublicationType.GUIDE,\\n    },\\n  ];\\n  for (const topic of childTopics) {\\n    await prisma.publication.upsert({\\n      where: { slug: topic.slug },\\n      update: {\\n        format: PublicationFormat.TOPIC,\\n        title: topic.title,\\n        body: topic.body,\\n        communityId: topic.communityId,\\n        type: topic.type,\\n      },\\n      create: {\\n        slug: topic.slug,\\n        format: PublicationFormat.TOPIC,\\n        type: topic.type,\\n        title: topic.title,\\n        body: topic.body,\\n        authorId: owner.id,\\n        communityId: topic.communityId,\\n      },\\n    });\\n  }\\n\\n", "user_visuals": "  // FORRUM_DEMO_VISUALS_V7\\n  await prisma.user.update({\\n    where: { id: owner.id },\\n    data: {\\n      avatarUrl: \'/forrum-assets/avatar-owner.svg\',\\n      coverUrl: \'/forrum-assets/cover-forrum-start.svg\',\\n    },\\n  });\\n  await prisma.user.update({\\n    where: { id: friend.id },\\n    data: {\\n      avatarUrl: \'/forrum-assets/avatar-friend.svg\',\\n      coverUrl: \'/forrum-assets/cover-internet-projects.svg\',\\n    },\\n  });\\n"}')


        def read(path: str) -> str:
            return (ROOT / path).read_text(encoding='utf-8')


        def write(path: str, content: str) -> None:
            target = ROOT / path
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_text(content.rstrip() + '\n', encoding='utf-8')


        def replace_exact(path: str, old: str, new: str, expected: int = 1, already: str | None = None) -> None:
            text = read(path)
            if already and already in text:
                return
            count = text.count(old)
            if count != expected:
                raise RuntimeError(f'Expected {expected} matches in {path}, got {count}: {old[:100]!r}')
            write(path, text.replace(old, new))


        for path, content in PAYLOAD['files'].items():
            write(path, content)
            if path.endswith('.svg'):
                ET.fromstring(content)

        css_path = 'apps/web/app/globals.css'
        css = read(css_path)
        if 'FORRUM_FINAL_MONOCHROME_V7' not in css:
            write(css_path, css.rstrip() + '\n\n' + PAYLOAD['css'])

        # Same-origin proxy: browser Origin must not be forwarded to Nest CORS.
        replace_exact(
            'apps/web/app/api/[...path]/route.ts',
            "  headers.delete('accept-encoding');\n\n  if (!headers.has('accept')) {",
