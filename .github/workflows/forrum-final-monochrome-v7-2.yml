                raise RuntimeError("SiteHeader brand markup changed unexpectedly")
            header_text = header_text.replace(old_brand, new_brand, 1)
        header.write_text(header_text, encoding="utf-8")

        for spec in PATCH_SPECS:
            folder = Path(spec["directory"])
            page = folder / "page.tsx"
            client = folder / spec["client_name"]

            if not client.exists():
                os.replace(page, client)

            for old, new, marker in spec["replacements"]:
                replace_once(client, old, new, marker)

        # Write server wrappers only after the original client pages
        # have been preserved and transformed.
        proxy_path = Path("apps/web/proxy.ts")
        if (
