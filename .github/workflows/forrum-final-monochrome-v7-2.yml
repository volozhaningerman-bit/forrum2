            '      <div className={`community-cover cover-${data.slug}`}><span>{data.name.slice(0, 1)}</span></div>',
            '''      <div className="community-cover">
                {data.coverUrl && <img className="community-cover-image" src={data.coverUrl} alt="" />}
                <CommunityMark name={data.name} url={data.avatarUrl} size={104} />
              </div>''',
            already='community-cover-image',
        )
        replace_exact(
            community_page,
            '<div className="curator-person"><Avatar name={curator.user.displayName} size={52}/><div>',
            '<div className="curator-person"><Avatar name={curator.user.displayName} size={52} url={curator.user.avatarUrl}/><div>',
            already='url={curator.user.avatarUrl}',
        )
        replace_exact(
            community_page,
            '<nav>{data.children.map((child) => <Link key={child.slug} href={`/communities/${child.slug}`}><span>{child.name}</span><small>{formatNumber(child.subscriberCount)} подписчиков</small></Link>)}</nav>',
            '<nav>{data.children.map((child) => <Link key={child.slug} href={`/communities/${child.slug}`}><CommunityMark name={child.name} url={child.avatarUrl} size={32}/><span>{child.name}</span><small>{formatNumber(child.subscriberCount)} подписчиков</small></Link>)}</nav>',
            already='url={child.avatarUrl}',
        )
        replace_exact(
            community_page,
            '<Avatar name={member.user.displayName} size={38}/>',
            '<Avatar name={member.user.displayName} size={38} url={member.user.avatarUrl}/>',
            already='url={member.user.avatarUrl}',
        )
        text = read(community_page)
        text = re.sub(r'\s*<section className="sidebar-card sponsor-card">.*?</section>', '', text, count=1)
        write(community_page, text)

        # Permanent topics can use stable community artwork.
        replace_exact(
            'apps/web/components/publication-card.tsx',
            "  return <article className={`publication-card modern-publication ${isTopic ? 'permanent-topic' : 'short-post'}`} style={{ '--community-accent': item.community.accentColor ?? '#3157D5' } as React.CSSProperties}>",
            "  return <article className={`publication-card modern-publication ${isTopic ? 'permanent-topic' : 'short-post'}`} data-community={item.community.slug} style={{ '--community-accent': item.community.accentColor ?? '#4C4C4C' } as React.CSSProperties}>",
            already='data-community={item.community.slug}',
        )
        replace_exact(
            'apps/web/app/p/[slug]/publication-client.tsx',
            '''          className={`publication-detail ${isTopic ? 'publication-detail-topic' : 'publication-detail-post'}`}
                  style={{ '--community-accent': item.community.accentColor } as CSSProperties}''',
            '''          className={`publication-detail ${isTopic ? 'publication-detail-topic' : 'publication-detail-post'}`}
                  data-community={item.community.slug}
                  style={{ '--community-accent': item.community.accentColor } as CSSProperties}''',
            already='data-community={item.community.slug}',
        )

        # Seed visual identity, one child for every root, and child topics.
        seed_path = 'apps/api/prisma/seed.ts'
        seed = read(seed_path)
        if 'FORRUM_DEMO_VISUALS_V7' not in seed:
            marker = '  await prisma.platformSetting.upsert({'
            if marker not in seed:
                raise RuntimeError('Platform settings marker not found in seed')
            seed = seed.replace(marker, PAYLOAD['user_visuals'] + marker, 1)

        def replace_seed_section(
            source: str,
            start_marker: str,
            end_marker: str,
            replacement: str,
            label: str,
        ) -> str:
            start = source.find(start_marker)
            if start < 0:
                raise RuntimeError(
                    f'{label} start marker not found: {start_marker!r}'
                )

            end = source.find(end_marker, start)
            if end < 0:
                raise RuntimeError(
                    f'{label} end marker not found: {end_marker!r}'
                )

            if end <= start:
                raise RuntimeError(
                    f'{label} markers are in the wrong order'
                )

            return (
                source[:start]
                + replacement.rstrip()
                + source[end:]
            )

        seed = replace_seed_section(
            seed,
            '  const communities = [',
            '\n  for (const data of communities)',
            PAYLOAD['root_communities'],
            'Root communities',
        )

        old_update = "      update: { name: data.name, description: data.description, shortDescription: data.shortDescription, accentColor: data.accentColor },"
        new_update = "      update: { name: data.name, description: data.description, shortDescription: data.shortDescription, avatarUrl: data.avatarUrl, coverUrl: data.coverUrl, accentColor: data.accentColor },"
        if old_update in seed:
            seed = seed.replace(old_update, new_update, 1)
        elif new_update not in seed:
            raise RuntimeError('Root community update line not found')

        if "avatarUrl: '/forrum-assets/icon-majestic-rp.svg'" not in seed:
            majestic_old = "      accentColor: '#8B5CF6',"
            if seed.count(majestic_old) != 2:
                raise RuntimeError('Expected two Majestic accent lines')
            majestic_new = "      avatarUrl: '/forrum-assets/icon-majestic-rp.svg',\n      coverUrl: '/forrum-assets/cover-gta-rp.svg',\n      accentColor: '#666277',"
            seed = seed.replace(majestic_old, majestic_new)

        seed = replace_seed_section(
            seed,
            '  const tags = [',
            '\n  for (const tag of tags)',
            PAYLOAD['tags_block'],
            'Tags',
        )

        if 'FORRUM_DEMO_HIERARCHY_V7' not in seed:
            marker = PAYLOAD['tags_block']
            if marker not in seed:
                raise RuntimeError('Updated tag marker not found')
            seed = seed.replace(marker, PAYLOAD['child_seed'] + marker, 1)
        write(seed_path, seed)

        final_seed = read(seed_path)
        required_seed_markers = [
            'FORRUM_DEMO_VISUALS_V7',
            'FORRUM_DEMO_HIERARCHY_V7',
            "avatarUrl: '/forrum-assets/icon-forrum-start.svg'",
            "avatarUrl: '/forrum-assets/icon-telegram.svg'",
            "slug: 'forrum-feedback'",
            "slug: 'launches-and-teams'",
            "slug: 'seo-and-traffic'",
            "slug: 'telegram-bots'",
            'const tags = [',
        ]

        missing_seed_markers = [
            marker
            for marker in required_seed_markers
            if marker not in final_seed
        ]

        if missing_seed_markers:
            raise RuntimeError(
                'Seed verification failed; missing: '
                + ', '.join(missing_seed_markers)
            )

        if final_seed.count('  const communities = [') != 1:
            raise RuntimeError(
                'Seed must contain exactly one root communities block'
            )

        if final_seed.count('  const tags = [') != 1:
            raise RuntimeError(
                'Seed must contain exactly one tags block'
            )

        print('FORRUM final monochrome V7.1 source patch applied.')

