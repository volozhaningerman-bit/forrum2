            '      team: community.roles.map((role) => ({ role: role.role, user: { username: role.user.username, displayName: role.user.displayName, avatarUrl: role.user.avatarUrl } })),',
            already='avatarUrl: role.user.avatarUrl',
        )

        # Community catalogue marks; name links remain independent from row expansion.
        catalogue = 'apps/web/app/communities/communities-client.tsx'
        replace_exact(
