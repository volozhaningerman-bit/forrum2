        npm install --include=dev --no-audit --no-fund --package-lock=false
    - name: Verify required package scripts
      shell: bash
      run: |
        set -euo pipefail

        node <<'NODE'
        const root = require('./package.json');
        const api = require('./apps/api/package.json');

        for (const name of [
          'db:generate',
          'db:validate',
          'db:push',
          'db:seed',
        ]) {
          if (!root.scripts?.[name]) {
            throw new Error(`Missing root script: ${name}`);
          }
        }

        for (const name of [
          'db:generate',
          'db:validate',
          'db:push',
          'db:seed',
          'build',
          'start',
          'typecheck',
          'test',
        ]) {
          if (!api.scripts?.[name]) {
            throw new Error(`Missing @forrum/api script: ${name}`);
          }
        }
        NODE
    - name: Generate validate sync and seed Prisma
      run: |
        set -euo pipefail
        npm run db:generate
        npm run db:validate
        npm run db:push
        npm run db:seed
      shell: bash
    - name: Align UX checks with SSR client split
      shell: bash
      run: |
        set -euo pipefail

        python3 <<'PY'
        from pathlib import Path

        path = Path("scripts/ux-check.mjs")
        text = path.read_text(encoding="utf-8")

        replacements = {
            "apps/web/app/communities/page.tsx":
                "apps/web/app/communities/communities-client.tsx",
            "apps/web/app/events/page.tsx":
                "apps/web/app/events/events-client.tsx",
            "apps/web/app/u/[username]/page.tsx":
                "apps/web/app/u/[username]/profile-client.tsx",
        }

        for old, new in replacements.items():
            if old not in text and new not in text:
                raise RuntimeError(
                    f"UX checker contains neither {old} nor {new}"
                )

            text = text.replace(old, new)

        path.write_text(text, encoding="utf-8")
        PY

        grep -q "apps/web/app/communities/communities-client.tsx"           scripts/ux-check.mjs
        grep -q "apps/web/app/events/events-client.tsx"           scripts/ux-check.mjs
        grep -q "apps/web/app/u/\[username\]/profile-client.tsx"           scripts/ux-check.mjs

        if grep -q "apps/web/app/communities/page.tsx"           scripts/ux-check.mjs; then
          echo "Old communities UX-check path remains."
          exit 1
        fi

        if grep -q "apps/web/app/events/page.tsx"           scripts/ux-check.mjs; then
          echo "Old events UX-check path remains."
          exit 1
        fi

