    - name: Verify API and public SSR pages with diagnostics
      shell: bash
      run: |
        set -euo pipefail

        dump_logs() {
          echo
          echo "========== API LOG =========="
          cat /tmp/api.log 2>/dev/null || true
          echo
          echo "========== WEB LOG =========="
          cat /tmp/web.log 2>/dev/null || true
          echo
        }

        wait_for_url() {
          local name="$1"
          local url="$2"
          local output="$3"

          for attempt in $(seq 1 60); do
            local status

            status="$(
              curl \
                --silent \
                --output "$output" \
                --write-out '%{http_code}' \
                "$url" \
                2>/dev/null || true
            )"

            if [ "$status" = "200" ]; then
              echo "READY: $name ($url)"
              return 0
            fi

            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
              echo "API stopped while waiting for $name."
              dump_logs
              return 1
            fi

            if ! kill -0 "$(cat /tmp/web.pid)" 2>/dev/null; then
              echo "Web stopped while waiting for $name."
              dump_logs
              return 1
            fi

            sleep 2
          done

          echo "TIMEOUT: $name ($url)"
          echo "Last response:"
          cat "$output" 2>/dev/null || true
          dump_logs
          return 1
        }

        check_page() {
          local name="$1"
          local url="$2"
          local output="$3"
          local required_marker="$4"
          local forbidden_marker="${5:-}"
          local status

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$output" \
              --write-out '%{http_code}' \
              "$url" || true
          )"

          echo "CHECK: $name -> HTTP $status"

          if [ "$status" != "200" ]; then
            echo "FAILED URL: $url"
            echo "Response body:"
            cat "$output" 2>/dev/null || true
            dump_logs
            return 1
          fi

          if ! grep -Fq "$required_marker" "$output"; then
            echo "MISSING MARKER: $required_marker"
            echo "URL: $url"
            echo "Response excerpt:"
            head -c 5000 "$output" || true
            echo
            dump_logs
            return 1
          fi

          if [ -n "$forbidden_marker" ] \
            && grep -Fq "$forbidden_marker" "$output"; then
            echo "FORBIDDEN MARKER FOUND: $forbidden_marker"
            echo "URL: $url"
            echo "Response excerpt:"
            head -c 5000 "$output" || true
            echo
            dump_logs
            return 1
          fi
        }

        wait_for_url \
          "API health" \
          "http://127.0.0.1:4000/v1/health" \
          /tmp/health.json

        wait_for_url \
          "web homepage" \
          "http://127.0.0.1:3000/" \
          /tmp/home.html

        python3 <<'PY'
        import json
        from pathlib import Path

        path = Path("/tmp/health.json")

        try:
            payload = json.loads(
                path.read_text(
                    encoding="utf-8",
                    errors="strict",
                )
            )
        except (OSError, UnicodeError, json.JSONDecodeError) as error:
            raise SystemExit(
                f"Health response is not valid JSON: {error}"
            )

        if not isinstance(payload, dict):
            raise SystemExit(
                "Health response must be a JSON object."
            )

        if payload.get("ok") is not True:
            raise SystemExit(
                "Health response does not contain ok=true: "
                + json.dumps(
                    payload,
                    ensure_ascii=False,
                    sort_keys=True,
                )
            )

        if payload.get("service") != "forrum-api":
            raise SystemExit(
                "Unexpected health service: "
                + repr(payload.get("service"))
            )

        print(
            "HEALTH CONTRACT OK:",
            json.dumps(
                payload,
                ensure_ascii=False,
                sort_keys=True,
            ),
        )
        PY

        check_page \
          "homepage" \
          "http://127.0.0.1:3000/" \
          /tmp/home.html \
          "Лента обсуждений" \
          ">FFORRUM<"

        python3 <<'PY'
        import re
        from pathlib import Path

        html = Path("/tmp/home.html").read_text(
