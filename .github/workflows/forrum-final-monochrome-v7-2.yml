    - name: Verify protected route redirects with diagnostics
      shell: bash
      run: |
        set -euo pipefail

        dump_runtime_logs() {
          echo
          echo "========== API LOG =========="
          cat /tmp/api.log 2>/dev/null || true
          echo
          echo "========== WEB LOG =========="
          cat /tmp/web.log 2>/dev/null || true
          echo
        }

        check_redirect() {
          local route="$1"
          local expected_next="$2"
          local safe_name
          local headers
          local body
          local status
          local location

          safe_name="$(
            printf '%s' "$route" \
              | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g'
          )"

          headers="/tmp/redirect-${safe_name}.headers"
          body="/tmp/redirect-${safe_name}.body"

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              --max-redirs 0 \
              "http://127.0.0.1:3000${route}" \
              || true
          )"

          location="$(
            awk '
              BEGIN { IGNORECASE = 1 }
              /^location:/ {
                sub(/^[^:]+:[[:space:]]*/, "")
                sub(/\r$/, "")
                print
                exit
              }
            ' "$headers"
          )"

          echo "REDIRECT CHECK: ${route} -> HTTP ${status}"
          echo "Location: ${location:-<missing>}"

          case "$status" in
            301|302|303|307|308)
              ;;
            *)
              echo "Expected a redirect status for ${route}."
              echo "Response headers:"
              cat "$headers" 2>/dev/null || true
              echo "Response body:"
              head -c 5000 "$body" 2>/dev/null || true
              echo
              dump_runtime_logs
              return 1
              ;;
          esac

          if [ -z "$location" ]; then
            echo "Redirect response has no Location header."
            cat "$headers" 2>/dev/null || true
            dump_runtime_logs
            return 1
          fi

          LOCATION="$location" \
          EXPECTED_NEXT="$expected_next" \
          python3 <<'PY'
        import os
        from urllib.parse import (
            parse_qs,
            unquote,
            urljoin,
            urlsplit,
        )

        location = os.environ["LOCATION"]
        expected_next = os.environ["EXPECTED_NEXT"]

        absolute = urljoin(
            "http://127.0.0.1:3000/",
            location,
        )
        parsed = urlsplit(absolute)

        if parsed.path != "/login":
            raise SystemExit(
                "Unexpected redirect path: "
                f"{parsed.path!r}; full Location={location!r}"
            )

        query = parse_qs(
            parsed.query,
            keep_blank_values=True,
        )
        next_values = query.get("next", [])

        if len(next_values) != 1:
            raise SystemExit(
                "Redirect must contain exactly one next parameter: "
                f"{query!r}; full Location={location!r}"
            )

        actual_next = unquote(next_values[0])

        if actual_next != expected_next:
            raise SystemExit(
                "Unexpected next target: "
                f"{actual_next!r}; expected {expected_next!r}; "
                f"full Location={location!r}"
            )

        print(
            "REDIRECT CONTRACT OK:",
            f"{parsed.path}?next={actual_next}",
        )
        PY
        }

        AUTH_STATUS="$(
          curl \
            --silent \
            --show-error \
            --output /tmp/auth-me-anonymous.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:4000/v1/auth/me \
            || true
        )"

        echo "ANONYMOUS AUTH CHECK: HTTP ${AUTH_STATUS}"

        if [ "$AUTH_STATUS" != "401" ]; then
          echo "Anonymous /v1/auth/me must return 401."
          cat /tmp/auth-me-anonymous.json 2>/dev/null || true
          dump_runtime_logs
          exit 1
        fi

        check_redirect /messages /messages
        check_redirect /create /create
        check_redirect /settings /settings
        check_redirect /wallet /wallet
        check_redirect /admin /admin

        echo
        echo "All protected route redirects passed."
    - name: Stop smoke-test services
