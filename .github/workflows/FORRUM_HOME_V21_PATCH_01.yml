name: FORRUM Home V21 Patch 01

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forrum-home-v21-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/home-v21-${{ github.run_id }}
      DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V20 baseline and create branch
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/web/app/home-v20.css
          test -f apps/web/components/home-dashboard.tsx
          test -f scripts/home-v20-check.mjs

          grep -Fq 'forrum-home-v20' apps/web/components/home-dashboard.tsx
          grep -Fq "import './home-v20.css';" apps/web/app/layout.tsx

          if test -e apps/web/app/home-v21.css ||              grep -Fq 'data-home-reference="v21"' apps/web/components/home-dashboard.tsx; then
            echo "::error::V21 is already present on main. Nothing was changed."
            exit 1
          fi

          git switch -c "$TARGET_BRANCH"

      - name: Apply verified V21 payload
        shell: bash
        run: |
          set -euo pipefail

          payload_archive="$RUNNER_TEMP/forrum-home-v21.tar.gz"
          payload_manifest="$RUNNER_TEMP/forrum-home-v21-files.txt"

