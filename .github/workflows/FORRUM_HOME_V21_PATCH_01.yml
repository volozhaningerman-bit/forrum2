          FORRUM_V21_PAYLOAD

          tar -tzf "$payload_archive" > "$payload_manifest"
          mapfile -t payload_paths < "$payload_manifest"

          if [ "${#payload_paths[@]}" -ne 10 ]; then
            echo "::error::Expected 10 payload files, got ${#payload_paths[@]}."
            exit 1
          fi

          for payload_path in "${payload_paths[@]}"; do
            case "$payload_path" in
              ''|/*|../*|*/../*|*/..)
                echo "::error::Unsafe payload path: $payload_path"
                exit 1
                ;;
            esac
          done

          tar -xzf "$payload_archive"

          shopt -s nullglob
          bootstrap_paths=(
            .github/workflows/FORRUM_HOME_V20_APPLY*.yml
            .github/workflows/FORRUM_HOME_V21_PATCH*.yml
          )

          for bootstrap_path in "${bootstrap_paths[@]}"; do
            if git ls-files --error-unmatch "$bootstrap_path" >/dev/null 2>&1; then
              git rm -f -- "$bootstrap_path"
            else
              rm -f -- "$bootstrap_path"
            fi
          done

          for payload_path in "${payload_paths[@]}"; do
            test -f "$payload_path"
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify tests and structure
        shell: bash
        run: |
          set -euo pipefail
          npm run test:pure
          node --experimental-strip-types             --experimental-loader ./scripts/local-ts-loader.mjs             --test apps/web/test/home-model.test.ts
          node scripts/home-v20-check.mjs
          npm run validate:static

      - name: Verify types, build and UX
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run validate:ux
          npm run validate:a11y

      - name: Commit and push branch
        shell: bash
        run: |
          set -euo pipefail

          payload_manifest="$RUNNER_TEMP/forrum-home-v21-files.txt"
          mapfile -t payload_paths < "$payload_manifest"

          git restore --             apps/api/src/generated/prisma             apps/api/dist             apps/web/.next             packages/contracts/dist             apps/web/tsconfig.tsbuildinfo

          git clean -fd --             apps/api/src/generated/prisma             apps/api/dist             apps/web/.next             packages/contracts/dist

          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- "${payload_paths[@]}"
          git add -u -- .github/workflows
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::The verified payload produced no commit."
            exit 1
          fi

          git commit -m "feat(home): add live visual layer v21"
          git push origin "$TARGET_BRANCH"

      - name: Open pull request
        shell: bash
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/forrum-home-v21-pr.md"
          cat > "$body_file" <<'FORRUM_PR_BODY'
          ## FORRUM Home V21

          - adds a layered translucent visual system for light and dark themes;
          - gives every popular topic a clear lifecycle status;
          - suppresses low-signal test titles in the live activity presentation;
          - improves empty media, services and weekly-ranking states;
          - removes the duplicated 4 from the visible brand wordmark;
          - includes model, structure, type, build, UX and accessibility checks.
          FORRUM_PR_BODY

          if ! gh pr create             --repo "${{ github.repository }}"             --base main             --head "$TARGET_BRANCH"             --title "Главная: живой визуальный слой V21"             --body-file "$body_file"; then
            echo "::warning::Branch was pushed, but the PR was not opened automatically."
            echo "Open: https://github.com/${{ github.repository }}/compare/main...$TARGET_BRANCH?expand=1"
          fi

