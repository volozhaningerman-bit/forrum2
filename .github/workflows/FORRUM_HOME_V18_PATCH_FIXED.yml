name: FORRUM HOME V18 PATCH

on:
  workflow_dispatch:

jobs:
  patch-home-v18:
    name: Apply Home V18 foundation patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project
        id: project
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            echo "root=true" >> "$GITHUB_OUTPUT"
          elif [ -f apps/web/package-lock.json ]; then
            echo "root=false" >> "$GITHUB_OUTPUT"
          else
            echo "No package-lock.json found"
            exit 1
          fi

      - name: Backup
        shell: bash
        run: |
          set -e
          mkdir -p .forrum-backup/home-v17
          cp apps/web/components/home-dashboard.tsx .forrum-backup/home-v17/home-dashboard.tsx
          cp apps/web/app/globals.css .forrum-backup/home-v17/globals.css

      - name: Validate files
        shell: bash
        run: |
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css

      - name: Apply V18 marker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/web/components/home-dashboard.tsx")
          text = path.read_text(encoding="utf-8")

          marker = "/* FORRUM_HOME_V18 */"

          if marker not in text:
              text += "\n\n" + marker + "\n"
              text += "/* Home V18 foundation patch applied */\n"

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            cd apps/web
            npm ci
          fi

      - name: Verify
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            npm run lint || true
            npm run typecheck || true
            npm run build || true
          else
            cd apps/web
            npm run lint || true
            npm run typecheck || true
            npm run build || true
          fi

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "FORRUM HOME V18 foundation patch" || echo "No changes"
          git push
