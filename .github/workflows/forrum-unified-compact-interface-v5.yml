      - name: Stage 3 - verify UI source contract
        shell: bash
        run: |
          set -euo pipefail

          grep -q "FORRUM UNIFIED COMPACT INTERFACE V5" apps/web/app/globals.css
          grep -q "force-dynamic" apps/web/app/page.tsx
          grep -q "initialData" apps/web/components/home-dashboard.tsx
          grep -q "TopicSkeleton" apps/web/components/home-dashboard.tsx
          grep -q 'aria-label="FORRUM"' apps/web/components/site-header.tsx
          grep -q "collectDescendants" apps/web/app/communities/page.tsx
          grep -q "community-browser-layout" apps/web/app/communities/page.tsx
          grep -q "/media/partners" apps/web/app/media/page.tsx
          grep -q "workshop-compact-grid" apps/web/app/workshop/page.tsx
          grep -q "activity-list" apps/web/app/events/page.tsx
          grep -q "compact-auth-page" apps/web/components/auth-shell.tsx
          grep -q "search-page-skeleton" apps/web/app/search/page.tsx
          grep -q "messages-list-panel" apps/web/app/messages/page.tsx

          ! grep -q "community-expand-hint" apps/web/app/communities/page.tsx
          ! grep -q "community-expand-button" apps/web/app/communities/page.tsx
          ! grep -q "section-hero" apps/web/app/media/page.tsx
          ! grep -q "section-hero" apps/web/app/workshop/page.tsx
          ! grep -q "section-hero" apps/web/app/events/page.tsx
          ! grep -q "new-message-panel" apps/web/app/messages/page.tsx

          python3 <<'PY'
          from pathlib import Path

          css = Path("apps/web/app/globals.css").read_text(encoding="utf-8")
          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced")

          required = [
              ".compact-page-heading",
              ".community-browser-layout",
              ".media-partner-row",
              ".workshop-compact-grid",
              ".activity-row",
              ".compact-auth-page",
              ".messages-compact-row",
          ]

          missing = [selector for selector in required if selector not in css]
          if missing:
              raise SystemExit("Missing CSS selectors: " + ", ".join(missing))

          print("UI source contract passed")
          PY

      - name: Stage 4 - set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Stage 5 - install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Stage 6 - generate and validate Prisma
        run: |
          npm run db:generate -w @forrum/api
          npm run db:validate -w @forrum/api
          npm run db:push -w @forrum/api
          npm run db:seed -w @forrum/api

      - name: Stage 7 - static product checks
        run: |
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Stage 8 - typecheck every workspace
        run: npm run typecheck

      - name: Stage 9 - run API test suite
        run: npm run test

      - name: Stage 10 - first clean production build
        shell: bash
        run: |
          rm -rf packages/contracts/dist apps/api/dist apps/web/.next
          npm run build

      - name: Stage 11 - runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_STORAGE_ROOT" "$BACKUP_ROOT"

          npm run start -w @forrum/api > /tmp/forrum-api.log 2>&1 &
          API_PID=$!

          npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" "$API_PID" 2>/dev/null || true
            wait "$WEB_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error               http://127.0.0.1:4000/v1/health > /tmp/api-health.json               && curl --fail --silent --show-error               http://127.0.0.1:3000/api/health > /tmp/web-health.json; then
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API stopped before becoming healthy"
              cat /tmp/forrum-api.log
              exit 1
            fi

            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "Web stopped before becoming healthy"
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/communities > /tmp/communities.json
          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/media/partners > /tmp/media-partners.json
          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/workshop > /tmp/workshop.json
          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/events > /tmp/events.json
          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/governance/polls > /tmp/polls.json
          curl --fail --silent --show-error             http://127.0.0.1:4000/v1/announcements > /tmp/announcements.json
          curl --fail --silent --show-error             "http://127.0.0.1:4000/v1/feed?mode=new" > /tmp/feed.json

          for route in / /communities /media /workshop /events /login /register /search /messages; do
            safe_name=$(printf '%s' "$route" | sed 's#^/$#home#; s#^/##; s#/#-#g')
            curl --fail --silent --show-error               "http://127.0.0.1:3000$route" > "/tmp/page-$safe_name.html"
          done

          grep -q "home-topic-row" /tmp/page-home.html
          ! grep -q "Загружаем обсуждения" /tmp/page-home.html
          grep -q "community-browser-layout" /tmp/page-communities.html
          ! grep -q "Каталог интересов" /tmp/page-communities.html
          grep -q "media-partner-list" /tmp/page-media.html
          ! grep -q "Не покупаем фальшивые рекомендации" /tmp/page-media.html
          grep -q "workshop-compact-grid" /tmp/page-workshop.html
          ! grep -q "Создано пользователями" /tmp/page-workshop.html
          grep -q "activity-list" /tmp/page-events.html
          ! grep -q "Важное на FORRUM" /tmp/page-events.html
          grep -q "compact-auth-page" /tmp/page-login.html
          grep -q "compact-auth-page" /tmp/page-register.html
          grep -q "Поиск" /tmp/page-search.html
          grep -q "messages-list-panel" /tmp/page-messages.html

          echo "Runtime smoke test passed"

      - name: Stage 12 - second clean build for repeatability
        shell: bash
        run: |
          rm -rf packages/contracts/dist apps/api/dist apps/web/.next
          npm run build

      - name: Stage 13 - remove generated Prisma diff noise
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files -- apps/api/src/generated/prisma | grep -q .; then
            git restore --source=HEAD --staged --worktree --               apps/api/src/generated/prisma
          fi

          git clean -fd -- apps/api/src/generated/prisma

          if git status --short -- apps/api/src/generated/prisma | grep -q .; then
            echo "Generated Prisma files still contain changes"
            git status --short -- apps/api/src/generated/prisma
            exit 1
          fi

      - name: Stage 14 - final repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- .             ':(exclude)apps/api/src/generated/prisma/**'

          git status --short

      - name: Stage 15 - commit verified update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM interface updater"
          git config user.email "actions@users.noreply.github.com"

          git add             apps/web/app/page.tsx             apps/web/components/home-dashboard.tsx             apps/web/components/site-header.tsx             apps/web/app/communities/page.tsx             apps/web/app/media/page.tsx             apps/web/app/workshop/page.tsx             apps/web/app/events/page.tsx             apps/web/components/auth-shell.tsx             apps/web/app/login/page.tsx             apps/web/app/register/page.tsx             apps/web/app/search/page.tsx             apps/web/app/messages/page.tsx             apps/web/app/globals.css             docs/FORRUM_UI_UNIFIED_V5.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unify public interface around compact forum layout"
            git push
          fi
