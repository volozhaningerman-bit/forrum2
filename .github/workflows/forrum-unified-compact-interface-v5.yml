name: FORRUM Unified Compact Interface V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forrum
          POSTGRES_PASSWORD: forrum
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forrum -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum
      NODE_ENV: test
      API_PORT: "4000"
      PORT: "3000"
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:4000/v1
      PUBLIC_API_URL: http://127.0.0.1:4000
      SESSION_COOKIE_NAME: forrum_session
      SESSION_SECRET: forrum-test-session-secret-2026-at-least-32-characters
      OWNER_EMAIL: owner@forrum.test
      OWNER_PASSWORD: Owner12345!
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: FORRUM <noreply@forrum.test>
      TELEGRAM_POLLING_ENABLED: "false"
      MEDIA_STORAGE_ROOT: /tmp/forrum-media
      BACKUP_ROOT: /tmp/forrum-backups

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Stage 1 - verify expected source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/page.tsx
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/components/site-header.tsx
          test -f apps/web/app/communities/page.tsx
          test -f apps/web/app/media/page.tsx
          test -f apps/web/app/workshop/page.tsx
          test -f apps/web/app/events/page.tsx
          test -f apps/web/components/auth-shell.tsx
          test -f apps/web/app/login/page.tsx
          test -f apps/web/app/register/page.tsx
          test -f apps/web/app/search/page.tsx
          test -f apps/web/app/messages/page.tsx
          test -f apps/web/app/globals.css

      - name: Stage 2 - apply unified interface
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + '\n', encoding='utf-8')
              print(f'updated: {path}')
          
          write("apps/web/components/site-header.tsx", "import Link from 'next/link';\nimport { AuthActions } from './auth-actions';\nimport {\n  GridIcon,\n  HomeIcon,\n  MessageIcon,\n  PlusIcon,\n  SearchIcon,\n} from './icons';\nimport { NavCounters } from './nav-counters';\nimport { MainNav } from './main-nav';\n\nexport function SiteHeader() {\n  return (\n    <>\n      <header className=\"header\">\n        <div className=\"shell nav\">\n          <Link\n            className=\"brand\"\n            href=\"/\"\n            aria-label=\"FORRUM\"\n          >\n            <span\n              className=\"brand-mark\"\n              aria-hidden=\"true\"\n            >\n              F\n            </span>\n            <span aria-hidden=\"true\">FORRUM</span>\n          </Link>\n\n          <MainNav />\n\n          <span className=\"grow\" />\n\n          <form\n            className=\"header-search\"\n            action=\"/search\"\n            role=\"search\"\n          >\n            <input\n              name=\"q\"\n              aria-label=\"Поиск по FORRUM\"\n              placeholder=\"Поиск по форуму, темам и сообщениям…\"\n            />\n            <button type=\"submit\" aria-label=\"Найти\">\n              <SearchIcon />\n            </button>\n          </form>\n\n          <nav\n            className=\"icon-links\"\n            aria-label=\"Быстрые действия\"\n          >\n            <NavCounters />\n          </nav>\n\n          <AuthActions />\n        </div>\n      </header>\n\n      <nav\n        className=\"mobile-nav\"\n        aria-label=\"Навигация на телефоне\"\n      >\n        <Link href=\"/\">\n          <HomeIcon />\n          <span>Главная</span>\n        </Link>\n        <Link href=\"/communities\">\n          <GridIcon />\n          <span>Сообщества</span>\n        </Link>\n        <Link className=\"mobile-create\" href=\"/create\">\n          <PlusIcon />\n          <span>Создать</span>\n        </Link>\n        <Link href=\"/search\">\n          <SearchIcon />\n          <span>Поиск</span>\n        </Link>\n        <Link href=\"/messages\">\n          <MessageIcon />\n          <span>Сообщения</span>\n        </Link>\n      </nav>\n    </>\n  );\n}\n")
          
          write("apps/web/app/page.tsx", "import {\n  HomeDashboard,\n  type HomeInitialData,\n} from '@/components/home-dashboard';\n\nexport const dynamic = 'force-dynamic';\n\nfunction apiBase() {\n  const raw =\n    process.env.API_INTERNAL_URL ??\n    process.env.PUBLIC_API_URL;\n\n  if (!raw) return null;\n\n  const normalized = raw.replace(/\\/+$/, '');\n\n  return normalized.endsWith('/v1')\n    ? normalized\n    : `${normalized}/v1`;\n}\n\nasync function publicApi<T>(path: string) {\n  const base = apiBase();\n\n  if (!base) return undefined;\n\n  try {\n    const response = await fetch(`${base}${path}`, {\n      cache: 'no-store',\n      headers: {\n        Accept: 'application/json',\n      },\n    });\n\n    if (!response.ok) return undefined;\n\n    return (await response.json()) as T;\n  } catch {\n    return undefined;\n  }\n}\n\nexport default async function Home() {\n  const [\n    communities,\n    events,\n    polls,\n    announcements,\n    workshop,\n    feed,\n  ] = await Promise.all([\n    publicApi<HomeInitialData['communities']>(\n      '/communities',\n    ),\n    publicApi<HomeInitialData['events']>('/events'),\n    publicApi<HomeInitialData['polls']>(\n      '/governance/polls',\n    ),\n    publicApi<HomeInitialData['announcements']>(\n      '/announcements',\n    ),\n    publicApi<HomeInitialData['workshop']>(\n      '/workshop',\n    ),\n    publicApi<HomeInitialData['feed']>(\n      '/feed?mode=new',\n    ),\n  ]);\n\n  return (\n    <HomeDashboard\n      initialData={{\n        communities,\n        events,\n        polls,\n        announcements,\n        workshop,\n        feed,\n      }}\n    />\n  );\n}\n")
          
          write("apps/web/components/home-dashboard.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type { ReactNode } from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\nimport type { PublicationCardData } from '@/lib/types';\n\ntype Community = {\n  id: string;\n  slug: string;\n  name: string;\n  description: string;\n  shortDescription?: string | null;\n  subscriberCount: number;\n  publicationCount: number;\n  recentPublicationCount?: number;\n  lastActivityAt?: string | null;\n  isSubscribed?: boolean;\n  parent: {\n    slug: string;\n    name: string;\n  } | null;\n};\n\ntype EventItem = {\n  id: string;\n  title: string;\n  startsAt: string;\n  status: string;\n  createdAt: string;\n  community: {\n    slug: string;\n    name: string;\n  };\n};\n\ntype PollItem = {\n  id: string;\n  title: string;\n  closesAt: string;\n  status: string;\n  createdAt: string;\n  community: {\n    slug: string;\n    name: string;\n  };\n};\n\ntype WorkshopItem = {\n  id: string;\n  title: string;\n  description: string;\n  status: string;\n  type: string;\n  createdAt: string;\n  author: {\n    username: string;\n    displayName: string;\n  };\n};\n\ntype FeedMode =\n  | 'subscriptions'\n  | 'new'\n  | 'popular'\n  | 'unanswered';\n\nexport type HomeInitialData = {\n  communities?: Community[];\n  events?: EventItem[];\n  polls?: PollItem[];\n  announcements?: PublicationCardData[];\n  workshop?: WorkshopItem[];\n  feed?: PublicationCardData[];\n};\n\nconst feedTabs: Array<{\n  key: FeedMode;\n  label: string;\n}> = [\n  { key: 'subscriptions', label: 'По подпискам' },\n  { key: 'new', label: 'Новое' },\n  { key: 'popular', label: 'Популярное' },\n  { key: 'unanswered', label: 'Без ответа' },\n];\n\nconst formatNumber = (value: number) =>\n  new Intl.NumberFormat('ru-RU').format(value);\n\nfunction relativeDate(value: string) {\n  const time = new Date(value).getTime();\n\n  if (!Number.isFinite(time)) return '';\n\n  const difference = Date.now() - time;\n\n  if (difference < 60_000) return 'только что';\n\n  const minutes = Math.floor(difference / 60_000);\n  if (minutes < 60) return `${minutes} мин. назад`;\n\n  const hours = Math.floor(difference / 3_600_000);\n  if (hours < 24) return `${hours} ч. назад`;\n\n  const days = Math.floor(difference / 86_400_000);\n  if (days < 14) return `${days} дн. назад`;\n\n  return new Date(value).toLocaleDateString('ru-RU', {\n    day: 'numeric',\n    month: 'short',\n  });\n}\n\nfunction shortDate(value: string) {\n  return new Date(value).toLocaleString('ru-RU', {\n    day: 'numeric',\n    month: 'short',\n    hour: '2-digit',\n    minute: '2-digit',\n  });\n}\n\nfunction typeLabel(type: string) {\n  const names: Record<string, string> = {\n    GIFT: 'Подарок',\n    REACTION: 'Реакция',\n    BADGE: 'Значок',\n    PROFILE_DECOR: 'Профиль',\n    COMMUNITY_DECOR: 'Сообщество',\n  };\n\n  return names[type] ?? type;\n}\n\nfunction TopicSkeleton() {\n  return (\n    <div\n      className=\"home-topic-row home-topic-skeleton\"\n      aria-hidden=\"true\"\n    >\n      <span className=\"skeleton-dot\" />\n      <div>\n        <span className=\"skeleton-line short\" />\n        <span className=\"skeleton-line long\" />\n        <span className=\"skeleton-line medium\" />\n      </div>\n      <span className=\"skeleton-line medium\" />\n      <span className=\"skeleton-line short\" />\n      <span className=\"skeleton-line short\" />\n    </div>\n  );\n}\n\nexport function HomeDashboard({\n  initialData = {},\n}: {\n  initialData?: HomeInitialData;\n}) {\n  const [communities, setCommunities] = useState<\n    Community[]\n  >(initialData.communities ?? []);\n  const [events, setEvents] = useState<EventItem[]>(\n    initialData.events ?? [],\n  );\n  const [polls, setPolls] = useState<PollItem[]>(\n    initialData.polls ?? [],\n  );\n  const [announcements, setAnnouncements] = useState<\n    PublicationCardData[]\n  >(initialData.announcements ?? []);\n  const [workshop, setWorkshop] = useState<\n    WorkshopItem[]\n  >(initialData.workshop ?? []);\n  const [feed, setFeed] = useState<\n    PublicationCardData[]\n  >(initialData.feed ?? []);\n\n  const [mode, setMode] = useState<FeedMode>('new');\n  const [feedRequestVersion, setFeedRequestVersion] =\n    useState(0);\n  const [feedLoading, setFeedLoading] = useState(\n    initialData.feed === undefined,\n  );\n  const [pageLoading, setPageLoading] = useState(\n    [\n      initialData.communities,\n      initialData.events,\n      initialData.polls,\n      initialData.announcements,\n      initialData.workshop,\n    ].some((value) => value === undefined),\n  );\n  const [feedError, setFeedError] = useState('');\n  const [pageError, setPageError] = useState('');\n\n  const pageSeeded = [\n    initialData.communities,\n    initialData.events,\n    initialData.polls,\n    initialData.announcements,\n    initialData.workshop,\n  ].every((value) => value !== undefined);\n\n  const feedSeeded = initialData.feed !== undefined;\n\n  useEffect(() => {\n    if (pageSeeded) return;\n\n    let cancelled = false;\n\n    async function loadPage() {\n      setPageLoading(true);\n\n      const results = await Promise.allSettled([\n        api<Community[]>('/communities'),\n        api<EventItem[]>('/events'),\n        api<PollItem[]>('/governance/polls'),\n        api<PublicationCardData[]>('/announcements'),\n        api<WorkshopItem[]>('/workshop'),\n      ]);\n\n      if (cancelled) return;\n\n      const [\n        communityResult,\n        eventResult,\n        pollResult,\n        announcementResult,\n        workshopResult,\n      ] = results;\n\n      if (communityResult.status === 'fulfilled') {\n        setCommunities(communityResult.value);\n      } else {\n        setPageError(\n          communityResult.reason instanceof Error\n            ? communityResult.reason.message\n            : 'Не удалось загрузить структуру FORRUM',\n        );\n      }\n\n      if (eventResult.status === 'fulfilled') {\n        setEvents(eventResult.value);\n      }\n\n      if (pollResult.status === 'fulfilled') {\n        setPolls(pollResult.value);\n      }\n\n      if (announcementResult.status === 'fulfilled') {\n        setAnnouncements(announcementResult.value);\n      }\n\n      if (workshopResult.status === 'fulfilled') {\n        setWorkshop(workshopResult.value);\n      }\n\n      setPageLoading(false);\n    }\n\n    void loadPage();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [pageSeeded]);\n\n  useEffect(() => {\n    if (\n      mode === 'new' &&\n      feedSeeded &&\n      feedRequestVersion === 0\n    ) {\n      setFeedLoading(false);\n      return;\n    }\n\n    let cancelled = false;\n\n    async function loadFeed() {\n      setFeedLoading(true);\n      setFeedError('');\n\n      const apiMode =\n        mode === 'unanswered' ? 'all' : mode;\n\n      try {\n        const items = await api<PublicationCardData[]>(\n          `/feed?mode=${encodeURIComponent(apiMode)}`,\n        );\n\n        if (cancelled) return;\n\n        setFeed(\n          mode === 'unanswered'\n            ? items.filter(\n                (item) => item.commentCount === 0,\n              )\n            : items,\n        );\n      } catch (cause) {\n        if (cancelled) return;\n\n        setFeed([]);\n        setFeedError(\n          cause instanceof Error\n            ? cause.message\n            : 'Не удалось загрузить обсуждения',\n        );\n      } finally {\n        if (!cancelled) setFeedLoading(false);\n      }\n    }\n\n    void loadFeed();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [feedRequestVersion, feedSeeded, mode]);\n\n  const childrenByParent = useMemo(() => {\n    const map = new Map<string, Community[]>();\n\n    for (const community of communities) {\n      if (!community.parent) continue;\n\n      map.set(community.parent.slug, [\n        ...(map.get(community.parent.slug) ?? []),\n        community,\n      ]);\n    }\n\n    return map;\n  }, [communities]);\n\n  const rootCommunities = useMemo(\n    () =>\n      communities\n        .filter((community) => !community.parent)\n        .sort(\n          (left, right) =>\n            (right.recentPublicationCount ?? 0) -\n              (left.recentPublicationCount ?? 0) ||\n            right.publicationCount -\n              left.publicationCount,\n        )\n        .slice(0, 7),\n    [communities],\n  );\n\n  const newCommunities = useMemo(\n    () =>\n      [...communities]\n        .filter((community) => !community.parent)\n        .sort(\n          (left, right) =>\n            (right.recentPublicationCount ?? 0) -\n              (left.recentPublicationCount ?? 0) ||\n            right.subscriberCount -\n              left.subscriberCount,\n        )\n        .slice(0, 3),\n    [communities],\n  );\n\n  const workshopItems = useMemo(\n    () =>\n      workshop\n        .filter((item) => item.status === 'PUBLISHED')\n        .slice(0, 3),\n    [workshop],\n  );\n\n  const currentItems = useMemo(() => {\n    const now = Date.now();\n\n    const upcoming = events\n      .filter(\n        (item) =>\n          item.status === 'PUBLISHED' &&\n          new Date(item.startsAt).getTime() > now,\n      )\n      .slice(0, 2)\n      .map((item) => ({\n        id: `event-${item.id}`,\n        kind: 'Событие',\n        title: item.title,\n        meta: `${item.community.name} · ${shortDate(\n          item.startsAt,\n        )}`,\n        href: `/events/${item.id}`,\n      }));\n\n    const openPolls = polls\n      .filter((item) => item.status === 'OPEN')\n      .slice(0, 2)\n      .map((item) => ({\n        id: `poll-${item.id}`,\n        kind: 'Голосование',\n        title: item.title,\n        meta: `${item.community.name} · до ${shortDate(\n          item.closesAt,\n        )}`,\n        href: '/events',\n      }));\n\n    const latestAnnouncements = announcements\n      .slice(0, 2)\n      .map((item) => ({\n        id: `announcement-${item.id}`,\n        kind: 'Объявление',\n        title:\n          item.title ||\n          item.excerpt.slice(0, 90) ||\n          'Объявление FORRUM',\n        meta: `${item.community.name} · ${shortDate(\n          item.lastActivityAt ?? item.createdAt,\n        )}`,\n        href: `/p/${item.slug}`,\n      }));\n\n    return [\n      ...upcoming,\n      ...openPolls,\n      ...latestAnnouncements,\n    ].slice(0, 4);\n  }, [announcements, events, polls]);\n\n  function renderChildren(\n    parentSlug: string,\n    depth = 0,\n  ): ReactNode {\n    const children = (\n      childrenByParent.get(parentSlug) ?? []\n    )\n      .slice()\n      .sort((left, right) =>\n        left.name.localeCompare(right.name, 'ru'),\n      )\n      .slice(0, 6);\n\n    if (!children.length || depth > 1) return null;\n\n    return (\n      <ul>\n        {children.map((child) => (\n          <li key={child.id}>\n            <Link\n              href={`/communities/${child.slug}`}\n            >\n              {child.name}\n            </Link>\n            {renderChildren(child.slug, depth + 1)}\n          </li>\n        ))}\n      </ul>\n    );\n  }\n\n  return (\n    <div className=\"home-board\">\n      <section className=\"home-titlebar\">\n        <h1>Главная</h1>\n        <Link className=\"button\" href=\"/create\">\n          <span aria-hidden=\"true\">＋</span>\n          Создать тему\n        </Link>\n      </section>\n\n      {pageError && (\n        <div className=\"error-box\">{pageError}</div>\n      )}\n\n      <div className=\"home-layout\">\n        <aside\n          className=\"home-community-tree\"\n          aria-label=\"Категории и сообщества\"\n        >\n          {pageLoading ? (\n            <div\n              className=\"home-tree-skeleton\"\n              aria-label=\"Загружаем структуру\"\n            >\n              {Array.from({ length: 7 }).map(\n                (_, index) => (\n                  <span key={index} />\n                ),\n              )}\n            </div>\n          ) : (\n            <>\n              {rootCommunities.map(\n                (community, index) => (\n                  <details\n                    key={community.id}\n                    open={index < 3}\n                  >\n                    <summary>\n                      <span className=\"home-tree-symbol\">\n                        {community.name.slice(0, 1)}\n                      </span>\n                      <strong>{community.name}</strong>\n                      <span aria-hidden=\"true\">⌄</span>\n                    </summary>\n                    {renderChildren(community.slug)}\n                  </details>\n                ),\n              )}\n\n              {!rootCommunities.length && (\n                <p className=\"muted small-text\">\n                  Категории появятся после создания\n                  первых сообществ.\n                </p>\n              )}\n\n              <Link\n                className=\"home-panel-footer\"\n                href=\"/communities\"\n              >\n                Все категории\n                <span aria-hidden=\"true\">→</span>\n              </Link>\n            </>\n          )}\n        </aside>\n\n        <main className=\"home-discussion-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Лента обсуждений</h2>\n          </header>\n\n          <div\n            className=\"home-feed-tabs\"\n            role=\"tablist\"\n            aria-label=\"Режим ленты\"\n          >\n            {feedTabs.map((tab) => (\n              <button\n                type=\"button\"\n                role=\"tab\"\n                aria-selected={mode === tab.key}\n                className={\n                  mode === tab.key ? 'active' : ''\n                }\n                key={tab.key}\n                onClick={() => setMode(tab.key)}\n              >\n                {tab.label}\n              </button>\n            ))}\n          </div>\n\n          <div className=\"home-feed-table\">\n            <div\n              className=\"home-feed-head\"\n              aria-hidden=\"true\"\n            >\n              <span>Тема</span>\n              <span>Автор</span>\n              <span>Ответы</span>\n              <span>Просмотры</span>\n            </div>\n\n            {feedLoading ? (\n              Array.from({ length: 8 }).map(\n                (_, index) => (\n                  <TopicSkeleton key={index} />\n                ),\n              )\n            ) : feedError ? (\n              <div className=\"home-feed-status error\">\n                <strong>\n                  Не удалось загрузить ленту\n                </strong>\n                <span>{feedError}</span>\n                <button\n                  type=\"button\"\n                  className=\"button ghost small\"\n                  onClick={() =>\n                    setFeedRequestVersion(\n                      (current) => current + 1,\n                    )\n                  }\n                >\n                  Повторить\n                </button>\n              </div>\n            ) : feed.length ? (\n              feed.slice(0, 10).map((item) => (\n                <article\n                  className=\"home-topic-row\"\n                  key={item.id}\n                >\n                  <span\n                    className=\"home-topic-icon\"\n                    aria-hidden=\"true\"\n                  >\n                    {item.type === 'QUESTION'\n                      ? '?'\n                      : item.format === 'TOPIC'\n                        ? '●'\n                        : '○'}\n                  </span>\n\n                  <div className=\"home-topic-copy\">\n                    <div className=\"home-topic-path\">\n                      <Link\n                        href={`/communities/${item.community.slug}`}\n                      >\n                        {item.community.name}\n                      </Link>\n                      {item.tags.slice(0, 2).map((tag) => (\n                        <span key={tag.id}>\n                          › {tag.label}\n                        </span>\n                      ))}\n                    </div>\n\n                    <Link\n                      className=\"home-topic-title\"\n                      href={`/p/${item.slug}`}\n                    >\n                      {item.title ||\n                        item.excerpt.slice(0, 100)}\n                    </Link>\n\n                    <p>{item.excerpt}</p>\n                  </div>\n\n                  <div className=\"home-topic-author\">\n                    <Link\n                      href={`/u/${item.author.username}`}\n                    >\n                      {item.author.displayName}\n                    </Link>\n                    <span>\n                      {relativeDate(\n                        item.lastActivityAt ||\n                          item.createdAt,\n                      )}\n                    </span>\n                  </div>\n\n                  <strong className=\"home-topic-count\">\n                    {formatNumber(item.commentCount)}\n                  </strong>\n\n                  <strong className=\"home-topic-count\">\n                    {formatNumber(item.viewCount ?? 0)}\n                  </strong>\n                </article>\n              ))\n            ) : (\n              <div className=\"home-feed-status\">\n                <strong>\n                  В этой вкладке пока пусто\n                </strong>\n                <span>\n                  Выберите другой режим или создайте\n                  первую тему.\n                </span>\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/search\"\n          >\n            Перейти ко всем обсуждениям\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </main>\n\n        <aside className=\"home-current-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Актуальное</h2>\n          </header>\n\n          <div className=\"home-current-list\">\n            {pageLoading\n              ? Array.from({ length: 4 }).map(\n                  (_, index) => (\n                    <div\n                      className=\"home-current-skeleton\"\n                      key={index}\n                    >\n                      <span />\n                      <div>\n                        <i />\n                        <i />\n                        <i />\n                      </div>\n                    </div>\n                  ),\n                )\n              : currentItems.map((item) => (\n                  <Link\n                    href={item.href}\n                    className=\"home-current-item\"\n                    key={item.id}\n                  >\n                    <span className=\"home-current-icon\">\n                      {item.kind === 'Событие'\n                        ? '□'\n                        : item.kind === 'Голосование'\n                          ? '▥'\n                          : '◁'}\n                    </span>\n\n                    <span>\n                      <small>{item.kind}</small>\n                      <strong>{item.title}</strong>\n                      <em>{item.meta}</em>\n                    </span>\n                  </Link>\n                ))}\n\n            {!pageLoading && !currentItems.length && (\n              <div className=\"home-current-empty\">\n                Новых событий и объявлений пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/events\"\n          >\n            Перейти ко всему актуальному\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </aside>\n      </div>\n\n      <div className=\"home-lower-grid\">\n        <section className=\"home-list-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Новое в Мастерской</h2>\n            <Link href=\"/workshop\">\n              Перейти в Мастерскую\n            </Link>\n          </header>\n\n          <div className=\"home-simple-list\">\n            {workshopItems.map((item) => (\n              <Link href=\"/workshop\" key={item.id}>\n                <span className=\"home-list-icon\">\n                  □\n                </span>\n                <span>\n                  <strong>{item.title}</strong>\n                  <small>\n                    {typeLabel(item.type)} · @\n                    {item.author.username}\n                  </small>\n                </span>\n                <em>\n                  {relativeDate(item.createdAt)}\n                </em>\n              </Link>\n            ))}\n\n            {!pageLoading && !workshopItems.length && (\n              <div className=\"home-list-empty\">\n                Новых опубликованных работ пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/workshop\"\n          >\n            Смотреть все новинки\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </section>\n\n        <section className=\"home-list-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Новые сообщества</h2>\n            <Link href=\"/communities\">\n              Все сообщества\n            </Link>\n          </header>\n\n          <div className=\"home-simple-list\">\n            {newCommunities.map((community) => (\n              <Link\n                href={`/communities/${community.slug}`}\n                key={community.id}\n              >\n                <span className=\"home-list-icon\">\n                  ○\n                </span>\n                <span>\n                  <strong>{community.name}</strong>\n                  <small>\n                    {community.shortDescription ||\n                      community.description}\n                  </small>\n                </span>\n                <em>\n                  {formatNumber(\n                    community.subscriberCount,\n                  )}{' '}\n                  участников\n                </em>\n              </Link>\n            ))}\n\n            {!pageLoading && !newCommunities.length && (\n              <div className=\"home-list-empty\">\n                Новых сообществ пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/communities\"\n          >\n            Перейти ко всем сообществам\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </section>\n      </div>\n    </div>\n  );\n}\n")
          
          write("apps/web/app/communities/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type {\n  CSSProperties,\n  KeyboardEvent,\n  MouseEvent,\n  ReactNode,\n} from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\nimport { formatRelativeTime } from '@/lib/format';\n\ntype Community = {\n  id: string;\n  slug: string;\n  name: string;\n  description: string;\n  shortDescription?: string | null;\n  accentColor: string;\n  subscriberCount: number;\n  publicationCount: number;\n  recentPublicationCount: number;\n  lastActivityAt: string | null;\n  childCount: number;\n  isSubscribed: boolean;\n  curator: {\n    username: string;\n    displayName: string;\n  } | null;\n  parent: {\n    slug: string;\n    name: string;\n  } | null;\n};\n\ntype Scope = 'all' | 'subscribed';\ntype Sort = 'active' | 'subscribers' | 'name';\n\nconst formatNumber = (value: number) =>\n  new Intl.NumberFormat('ru-RU').format(value);\n\nexport default function CommunitiesPage() {\n  const [items, setItems] = useState<Community[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState('');\n  const [busy, setBusy] = useState('');\n  const [query, setQuery] = useState('');\n  const [scope, setScope] = useState<Scope>('all');\n  const [sort, setSort] = useState<Sort>('active');\n  const [expanded, setExpanded] = useState<\n    Set<string>\n  >(() => new Set());\n\n  async function load() {\n    setLoading(true);\n    setError('');\n\n    try {\n      setItems(await api<Community[]>('/communities'));\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось загрузить сообщества',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  useEffect(() => {\n    void load();\n  }, []);\n\n  const childrenByParent = useMemo(() => {\n    const map = new Map<string, Community[]>();\n\n    for (const item of items) {\n      if (!item.parent) continue;\n\n      map.set(item.parent.slug, [\n        ...(map.get(item.parent.slug) ?? []),\n        item,\n      ]);\n    }\n\n    return map;\n  }, [items]);\n\n  const normalized = query.trim().toLowerCase();\n\n  function collectDescendants(\n    rootSlug: string,\n  ): Community[] {\n    const result: Community[] = [];\n    const visited = new Set<string>();\n\n    function visit(parentSlug: string) {\n      for (\n        const child of\n        childrenByParent.get(parentSlug) ?? []\n      ) {\n        if (visited.has(child.slug)) continue;\n\n        visited.add(child.slug);\n        result.push(child);\n        visit(child.slug);\n      }\n    }\n\n    visit(rootSlug);\n\n    return result;\n  }\n\n  function containsSubscription(\n    item: Community,\n  ): boolean {\n    return (\n      item.isSubscribed ||\n      collectDescendants(item.slug).some(\n        (child) => child.isSubscribed,\n      )\n    );\n  }\n\n  function branchMatches(item: Community): boolean {\n    const ownMatch =\n      !normalized ||\n      `${item.name} ${item.description} ${\n        item.shortDescription ?? ''\n      }`\n        .toLowerCase()\n        .includes(normalized);\n\n    const children =\n      childrenByParent.get(item.slug) ?? [];\n\n    const queryMatch =\n      ownMatch || children.some(branchMatches);\n\n    const scopeMatch =\n      scope === 'all' || containsSubscription(item);\n\n    return queryMatch && scopeMatch;\n  }\n\n  function activity(item: Community): number {\n    const own = item.lastActivityAt\n      ? new Date(item.lastActivityAt).getTime()\n      : 0;\n\n    return Math.max(\n      own,\n      ...(childrenByParent.get(item.slug) ?? []).map(\n        activity,\n      ),\n      0,\n    );\n  }\n\n  function sorted(list: Community[]) {\n    return [...list].sort((left, right) => {\n      if (sort === 'name') {\n        return left.name.localeCompare(\n          right.name,\n          'ru',\n        );\n      }\n\n      if (sort === 'subscribers') {\n        return (\n          right.subscriberCount -\n          left.subscriberCount\n        );\n      }\n\n      return activity(right) - activity(left);\n    });\n  }\n\n  const roots = useMemo(\n    () =>\n      sorted(\n        items.filter(\n          (item) =>\n            !item.parent && branchMatches(item),\n        ),\n      ),\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n    [\n      items,\n      childrenByParent,\n      normalized,\n      scope,\n      sort,\n    ],\n  );\n\n  function toggleOpen(slug: string) {\n    setExpanded((current) => {\n      const next = new Set(current);\n\n      if (next.has(slug)) next.delete(slug);\n      else next.add(slug);\n\n      return next;\n    });\n  }\n\n  function stop(event: MouseEvent<HTMLElement>) {\n    event.stopPropagation();\n  }\n\n  function keyboard(\n    event: KeyboardEvent<HTMLElement>,\n    slug: string,\n    expandable: boolean,\n  ) {\n    if (!expandable) return;\n\n    if (event.key === 'Enter' || event.key === ' ') {\n      event.preventDefault();\n      toggleOpen(slug);\n    }\n  }\n\n  async function changeSubscription(\n    item: Community,\n    event: MouseEvent<HTMLButtonElement>,\n  ) {\n    event.stopPropagation();\n    setBusy(item.slug);\n    setError('');\n\n    try {\n      await api(`/communities/${item.slug}/subscribe`, {\n        method: item.isSubscribed ? 'DELETE' : 'POST',\n      });\n      await load();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось изменить подписку',\n      );\n    } finally {\n      setBusy('');\n    }\n  }\n\n  function renderBranch(\n    item: Community,\n    depth = 0,\n  ): ReactNode {\n    const children = sorted(\n      (\n        childrenByParent.get(item.slug) ?? []\n      ).filter(branchMatches),\n    );\n\n    const expandable = children.length > 0;\n    const open =\n      Boolean(normalized) || expanded.has(item.slug);\n\n    return (\n      <section\n        className=\"community-browser-node\"\n        key={item.id}\n      >\n        <article\n          id={`community-${item.slug}`}\n          className={`community-browser-row ${\n            expandable ? 'expandable' : ''\n          } ${open ? 'opened' : ''}`}\n          style={\n            {\n              '--tree-depth': Math.min(depth, 4),\n            } as CSSProperties\n          }\n          role={expandable ? 'button' : undefined}\n          tabIndex={expandable ? 0 : undefined}\n          aria-expanded={\n            expandable ? open : undefined\n          }\n          onClick={\n            expandable\n              ? () => toggleOpen(item.slug)\n              : undefined\n          }\n          onKeyDown={(event) =>\n            keyboard(event, item.slug, expandable)\n          }\n        >\n          <span\n            className=\"community-browser-symbol\"\n            aria-hidden=\"true\"\n          >\n            {item.name.slice(0, 1)}\n          </span>\n\n          <div className=\"community-browser-copy\">\n            <div className=\"community-browser-title\">\n              {expandable && (\n                <button\n                  type=\"button\"\n                  className=\"community-browser-chevron\"\n                  aria-label={\n                    open\n                      ? 'Свернуть подразделы'\n                      : 'Показать подразделы'\n                  }\n                  onClick={(event) => {\n                    event.stopPropagation();\n                    toggleOpen(item.slug);\n                  }}\n                >\n                  {open ? '⌄' : '›'}\n                </button>\n              )}\n\n              <Link\n                href={`/communities/${item.slug}`}\n                onClick={stop}\n              >\n                {item.name}\n              </Link>\n\n              {item.isSubscribed && (\n                <span className=\"community-followed\">\n                  Вы подписаны\n                </span>\n              )}\n            </div>\n\n            <p>\n              {item.shortDescription ||\n                item.description}\n            </p>\n\n            <div className=\"community-browser-meta\">\n              <span>\n                {formatNumber(item.subscriberCount)}{' '}\n                подписчиков\n              </span>\n              <span>\n                {formatNumber(item.publicationCount)}{' '}\n                публикаций\n              </span>\n              {item.lastActivityAt && (\n                <span>\n                  Активность{' '}\n                  {formatRelativeTime(\n                    item.lastActivityAt,\n                  )}\n                </span>\n              )}\n              {item.curator && (\n                <span>\n                  Куратор:{' '}\n                  <Link\n                    href={`/u/${item.curator.username}`}\n                    onClick={stop}\n                  >\n                    {item.curator.displayName}\n                  </Link>\n                </span>\n              )}\n            </div>\n          </div>\n\n          <div className=\"community-browser-actions\">\n            <Link\n              className=\"button ghost small\"\n              href={`/communities/${item.slug}`}\n              onClick={stop}\n            >\n              Открыть\n            </Link>\n\n            <button\n              type=\"button\"\n              className={`button small ${\n                item.isSubscribed ? 'secondary' : ''\n              }`}\n              disabled={busy === item.slug}\n              onClick={(event) =>\n                void changeSubscription(item, event)\n              }\n            >\n              {busy === item.slug\n                ? 'Сохраняем…'\n                : item.isSubscribed\n                  ? 'Отписаться'\n                  : 'Подписаться'}\n            </button>\n          </div>\n        </article>\n\n        {expandable && open && (\n          <div className=\"community-browser-children\">\n            {children.map((child) =>\n              renderBranch(child, depth + 1),\n            )}\n          </div>\n        )}\n      </section>\n    );\n  }\n\n  return (\n    <div className=\"community-browser-page\">\n      <header className=\"compact-page-heading\">\n        <div>\n          <h1>Сообщества</h1>\n          <p>\n            Направления, подразделы и активность\n            FORRUM.\n          </p>\n        </div>\n\n        <Link\n          className=\"button\"\n          href=\"/communities/proposals\"\n        >\n          Предложить сообщество\n        </Link>\n      </header>\n\n      <section\n        className=\"compact-filterbar\"\n        aria-label=\"Настройка каталога\"\n      >\n        <label className=\"compact-search-field\">\n          <span className=\"visually-hidden\">\n            Поиск\n          </span>\n          <input\n            value={query}\n            onChange={(event) =>\n              setQuery(event.target.value)\n            }\n            placeholder=\"Название или тема сообщества\"\n          />\n        </label>\n\n        <label>\n          <span>Показывать</span>\n          <select\n            value={scope}\n            onChange={(event) =>\n              setScope(event.target.value as Scope)\n            }\n          >\n            <option value=\"all\">\n              Все сообщества\n            </option>\n            <option value=\"subscribed\">\n              Только мои подписки\n            </option>\n          </select>\n        </label>\n\n        <label>\n          <span>Порядок</span>\n          <select\n            value={sort}\n            onChange={(event) =>\n              setSort(event.target.value as Sort)\n            }\n          >\n            <option value=\"active\">\n              По активности\n            </option>\n            <option value=\"subscribers\">\n              По подписчикам\n            </option>\n            <option value=\"name\">\n              По названию\n            </option>\n          </select>\n        </label>\n      </section>\n\n      {error && (\n        <div className=\"error-box\">\n          {error}\n          <button\n            type=\"button\"\n            className=\"button ghost small\"\n            onClick={() => void load()}\n          >\n            Повторить\n          </button>\n        </div>\n      )}\n\n      <div className=\"community-browser-layout\">\n        <aside className=\"community-browser-index\">\n          <strong>Направления</strong>\n\n          <nav>\n            {roots.map((root) => (\n              <a\n                key={root.id}\n                href={`#community-${root.slug}`}\n                onClick={() =>\n                  setExpanded((current) => {\n                    const next = new Set(current);\n                    next.add(root.slug);\n                    return next;\n                  })\n                }\n              >\n                <span>{root.name}</span>\n                <small>\n                  {formatNumber(\n                    root.subscriberCount,\n                  )}\n                </small>\n              </a>\n            ))}\n          </nav>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/communities/proposals\"\n          >\n            Предложения\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </aside>\n\n        <main className=\"community-browser-list\">\n          {loading ? (\n            <div\n              className=\"compact-row-skeletons\"\n              aria-label=\"Загружаем сообщества\"\n            >\n              {Array.from({ length: 8 }).map(\n                (_, index) => (\n                  <span key={index} />\n                ),\n              )}\n            </div>\n          ) : roots.length ? (\n            roots.map((root) => renderBranch(root))\n          ) : (\n            <div className=\"compact-empty-state\">\n              <strong>\n                {scope === 'subscribed'\n                  ? 'Подписок пока нет'\n                  : 'Ничего не найдено'}\n              </strong>\n              <span>\n                {scope === 'subscribed'\n                  ? 'Подпишитесь на сообщества, чтобы собрать собственную структуру.'\n                  : 'Сократите запрос или сбросьте фильтры.'}\n              </span>\n              <button\n                type=\"button\"\n                className=\"button ghost small\"\n                onClick={() => {\n                  setQuery('');\n                  setScope('all');\n                }}\n              >\n                Сбросить фильтры\n              </button>\n            </div>\n          )}\n        </main>\n      </div>\n    </div>\n  );\n}\n")
          
          write("apps/web/app/media/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type { FormEvent } from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\nimport type { PublicationCardData } from '@/lib/types';\n\ntype Partner = {\n  id: string;\n  type: string;\n  displayName: string;\n  platform: string;\n  channelUrl: string;\n  audienceText: string | null;\n  description: string;\n  updatedAt: string;\n  user: {\n    username: string;\n    displayName: string;\n    avatarUrl: string | null;\n  };\n};\n\ntype Tab = 'partners' | 'materials';\n\nconst partnerTypes: Record<string, string> = {\n  STREAMER: 'Стример',\n  VIDEO_CREATOR: 'Автор видео',\n  BLOGGER: 'Блогер',\n  CHANNEL: 'Канал',\n};\n\nconst applicationTypes = [\n  ['STREAMER', 'Стример'],\n  ['VIDEO_CREATOR', 'Автор видео'],\n  ['BLOGGER', 'Блогер'],\n  ['CHANNEL', 'Канал'],\n] as const;\n\nexport default function MediaPage() {\n  const [partners, setPartners] = useState<Partner[]>(\n    [],\n  );\n  const [materials, setMaterials] = useState<\n    PublicationCardData[]\n  >([]);\n  const [tab, setTab] = useState<Tab>('partners');\n  const [query, setQuery] = useState('');\n  const [type, setType] = useState('ALL');\n  const [applicationOpen, setApplicationOpen] =\n    useState(false);\n  const [loading, setLoading] = useState(true);\n  const [submitting, setSubmitting] = useState(false);\n  const [error, setError] = useState('');\n  const [message, setMessage] = useState('');\n\n  async function load() {\n    setLoading(true);\n    setError('');\n\n    const results = await Promise.allSettled([\n      api<Partner[]>('/media/partners'),\n      api<PublicationCardData[]>('/news'),\n    ]);\n\n    const [partnerResult, materialResult] = results;\n\n    if (partnerResult.status === 'fulfilled') {\n      setPartners(partnerResult.value);\n    } else {\n      setError(\n        partnerResult.reason instanceof Error\n          ? partnerResult.reason.message\n          : 'Не удалось загрузить медиапартнёров',\n      );\n    }\n\n    if (materialResult.status === 'fulfilled') {\n      setMaterials(materialResult.value);\n    }\n\n    setLoading(false);\n  }\n\n  useEffect(() => {\n    void load();\n  }, []);\n\n  const filteredPartners = useMemo(() => {\n    const normalized = query.trim().toLowerCase();\n\n    return partners.filter((partner) => {\n      const typeMatches =\n        type === 'ALL' || partner.type === type;\n\n      const queryMatches =\n        !normalized ||\n        `${partner.displayName} ${partner.platform} ${\n          partner.description\n        } ${partner.audienceText ?? ''}`\n          .toLowerCase()\n          .includes(normalized);\n\n      return typeMatches && queryMatches;\n    });\n  }, [partners, query, type]);\n\n  async function apply(\n    event: FormEvent<HTMLFormElement>,\n  ) {\n    event.preventDefault();\n    setSubmitting(true);\n    setError('');\n    setMessage('');\n\n    const form = new FormData(event.currentTarget);\n\n    try {\n      await api('/media/partners/apply', {\n        method: 'POST',\n        body: JSON.stringify({\n          type: form.get('type'),\n          displayName: form.get('displayName'),\n          platform: form.get('platform'),\n          channelUrl: form.get('channelUrl'),\n          audienceText:\n            String(form.get('audienceText') || '').trim() ||\n            undefined,\n          description: form.get('description'),\n        }),\n      });\n\n      event.currentTarget.reset();\n      setApplicationOpen(false);\n      setMessage(\n        'Заявка отправлена. После проверки канал появится в каталоге.',\n      );\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось отправить заявку',\n      );\n    } finally {\n      setSubmitting(false);\n    }\n  }\n\n  return (\n    <div className=\"media-directory-page\">\n      <header className=\"compact-page-heading\">\n        <div>\n          <h1>Медиа</h1>\n          <p>\n            Стримеры, авторы видео, блогеры и каналы,\n            которые работают с аудиторией FORRUM.\n          </p>\n        </div>\n\n        <button\n          type=\"button\"\n          className=\"button\"\n          onClick={() => setApplicationOpen(true)}\n        >\n          Стать медиапартнёром\n        </button>\n      </header>\n\n      {message && (\n        <div className=\"success-box\">{message}</div>\n      )}\n\n      {error && (\n        <div className=\"error-box\">\n          {error}\n          <button\n            type=\"button\"\n            className=\"button ghost small\"\n            onClick={() => void load()}\n          >\n            Повторить\n          </button>\n        </div>\n      )}\n\n      <nav\n        className=\"compact-section-tabs\"\n        aria-label=\"Разделы Медиа\"\n      >\n        <button\n          type=\"button\"\n          className={tab === 'partners' ? 'active' : ''}\n          onClick={() => setTab('partners')}\n        >\n          Медиапартнёры\n          <span>{partners.length}</span>\n        </button>\n        <button\n          type=\"button\"\n          className={tab === 'materials' ? 'active' : ''}\n          onClick={() => setTab('materials')}\n        >\n          Материалы\n          <span>{materials.length}</span>\n        </button>\n      </nav>\n\n      {tab === 'partners' && (\n        <>\n          <section className=\"compact-filterbar\">\n            <label className=\"compact-search-field\">\n              <span className=\"visually-hidden\">\n                Поиск медиапартнёров\n              </span>\n              <input\n                value={query}\n                onChange={(event) =>\n                  setQuery(event.target.value)\n                }\n                placeholder=\"Имя, платформа или тематика\"\n              />\n            </label>\n\n            <label>\n              <span>Формат</span>\n              <select\n                value={type}\n                onChange={(event) =>\n                  setType(event.target.value)\n                }\n              >\n                <option value=\"ALL\">Все</option>\n                {applicationTypes.map(\n                  ([value, label]) => (\n                    <option value={value} key={value}>\n                      {label}\n                    </option>\n                  ),\n                )}\n              </select>\n            </label>\n          </section>\n\n          <section className=\"media-partner-list\">\n            <div\n              className=\"media-partner-head\"\n              aria-hidden=\"true\"\n            >\n              <span>Партнёр</span>\n              <span>Платформа</span>\n              <span>Аудитория</span>\n              <span />\n            </div>\n\n            {loading ? (\n              <div className=\"compact-row-skeletons\">\n                {Array.from({ length: 6 }).map(\n                  (_, index) => (\n                    <span key={index} />\n                  ),\n                )}\n              </div>\n            ) : filteredPartners.length ? (\n              filteredPartners.map((partner) => (\n                <article\n                  className=\"media-partner-row\"\n                  key={partner.id}\n                >\n                  <span\n                    className=\"media-partner-avatar\"\n                    aria-hidden=\"true\"\n                  >\n                    {partner.displayName.slice(0, 1)}\n                  </span>\n\n                  <div className=\"media-partner-copy\">\n                    <strong>{partner.displayName}</strong>\n                    <p>{partner.description}</p>\n                    <Link\n                      href={`/u/${partner.user.username}`}\n                    >\n                      @{partner.user.username}\n                    </Link>\n                  </div>\n\n                  <span className=\"media-partner-platform\">\n                    <strong>{partner.platform}</strong>\n                    <small>\n                      {partnerTypes[partner.type] ??\n                        partner.type}\n                    </small>\n                  </span>\n\n                  <span className=\"media-partner-audience\">\n                    {partner.audienceText ||\n                      'Не указано'}\n                  </span>\n\n                  <a\n                    className=\"button ghost small\"\n                    href={partner.channelUrl}\n                    target=\"_blank\"\n                    rel=\"noreferrer\"\n                  >\n                    Открыть канал ↗\n                  </a>\n                </article>\n              ))\n            ) : (\n              <div className=\"compact-empty-state\">\n                <strong>\n                  {query || type !== 'ALL'\n                    ? 'Ничего не найдено'\n                    : 'Каталог пока пуст'}\n                </strong>\n                <span>\n                  Первый одобренный партнёр появится\n                  здесь после проверки заявки.\n                </span>\n              </div>\n            )}\n          </section>\n        </>\n      )}\n\n      {tab === 'materials' && (\n        <section className=\"media-material-list\">\n          {loading ? (\n            <div className=\"compact-row-skeletons\">\n              {Array.from({ length: 6 }).map(\n                (_, index) => (\n                  <span key={index} />\n                ),\n              )}\n            </div>\n          ) : materials.length ? (\n            materials.map((item) => (\n              <article\n                className=\"media-material-row\"\n                key={item.id}\n              >\n                <span\n                  className=\"media-material-symbol\"\n                  aria-hidden=\"true\"\n                >\n                  {item.type === 'NEWS' ? 'N' : 'M'}\n                </span>\n\n                <div>\n                  <span>\n                    {item.community.name} ·{' '}\n                    {new Date(\n                      item.createdAt,\n                    ).toLocaleDateString('ru-RU')}\n                  </span>\n                  <Link href={`/p/${item.slug}`}>\n                    {item.title || item.excerpt}\n                  </Link>\n                  <p>{item.excerpt}</p>\n                </div>\n\n                <strong>\n                  {item.commentCount} ответов\n                </strong>\n              </article>\n            ))\n          ) : (\n            <div className=\"compact-empty-state\">\n              <strong>Материалов пока нет</strong>\n              <span>\n                Новости и публикации медиапартнёров\n                появятся здесь.\n              </span>\n            </div>\n          )}\n        </section>\n      )}\n\n      {applicationOpen && (\n        <div\n          className=\"modal-backdrop\"\n          onMouseDown={(event) => {\n            if (\n              event.currentTarget === event.target\n            ) {\n              setApplicationOpen(false);\n            }\n          }}\n        >\n          <section\n            className=\"compact-dialog\"\n            role=\"dialog\"\n            aria-modal=\"true\"\n            aria-labelledby=\"media-application-title\"\n          >\n            <header>\n              <div>\n                <h2 id=\"media-application-title\">\n                  Заявка в Медиа FORRUM\n                </h2>\n                <p>\n                  Укажите реальный канал и кратко\n                  опишите формат сотрудничества.\n                </p>\n              </div>\n              <button\n                type=\"button\"\n                className=\"dialog-close\"\n                aria-label=\"Закрыть\"\n                onClick={() =>\n                  setApplicationOpen(false)\n                }\n              >\n                ×\n              </button>\n            </header>\n\n            <form onSubmit={apply}>\n              <div className=\"form-grid-two\">\n                <label>\n                  Формат\n                  <select name=\"type\" required>\n                    {applicationTypes.map(\n                      ([value, label]) => (\n                        <option\n                          value={value}\n                          key={value}\n                        >\n                          {label}\n                        </option>\n                      ),\n                    )}\n                  </select>\n                </label>\n\n                <label>\n                  Платформа\n                  <input\n                    name=\"platform\"\n                    minLength={2}\n                    maxLength={40}\n                    placeholder=\"YouTube, Twitch, Telegram\"\n                    required\n                  />\n                </label>\n              </div>\n\n              <label>\n                Название канала\n                <input\n                  name=\"displayName\"\n                  minLength={2}\n                  maxLength={80}\n                  required\n                />\n              </label>\n\n              <label>\n                Ссылка\n                <input\n                  name=\"channelUrl\"\n                  type=\"url\"\n                  placeholder=\"https://...\"\n                  required\n                />\n              </label>\n\n              <label>\n                Аудитория\n                <input\n                  name=\"audienceText\"\n                  maxLength={80}\n                  placeholder=\"например, 45 000 подписчиков\"\n                />\n              </label>\n\n              <label>\n                Формат сотрудничества\n                <textarea\n                  name=\"description\"\n                  minLength={20}\n                  maxLength={1500}\n                  required\n                />\n              </label>\n\n              <div className=\"dialog-actions\">\n                <button\n                  type=\"button\"\n                  className=\"button ghost\"\n                  onClick={() =>\n                    setApplicationOpen(false)\n                  }\n                >\n                  Отмена\n                </button>\n                <button\n                  className=\"button\"\n                  disabled={submitting}\n                >\n                  {submitting\n                    ? 'Отправляем…'\n                    : 'Отправить заявку'}\n                </button>\n              </div>\n            </form>\n          </section>\n        </div>\n      )}\n    </div>\n  );\n}\n")
          
          write("apps/web/app/workshop/page.tsx", "'use client';\n\nimport type {\n  ChangeEvent,\n  FormEvent,\n} from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\n\ntype Item = {\n  id: string;\n  type: string;\n  status: string;\n  title: string;\n  description: string;\n  previewUrl: string | null;\n  thumbnailUrl: string | null;\n  likeCount: number;\n  likedByViewer: boolean;\n  author: {\n    username: string;\n    displayName: string;\n    forrumId: number;\n  };\n};\n\ntype UploadedMedia = {\n  id: string;\n  url: string;\n  thumbnailUrl: string;\n};\n\nconst typeNames: Record<string, string> = {\n  GIFT: 'Подарок',\n  REACTION: 'Реакция',\n  BADGE: 'Значок',\n  PROFILE_DECOR: 'Оформление профиля',\n  COMMUNITY_DECOR: 'Оформление сообщества',\n};\n\nconst typeOptions = [\n  ['ALL', 'Все типы'],\n  ['GIFT', 'Подарки'],\n  ['REACTION', 'Реакции'],\n  ['BADGE', 'Значки'],\n  ['PROFILE_DECOR', 'Профили'],\n  ['COMMUNITY_DECOR', 'Сообщества'],\n] as const;\n\nexport default function WorkshopPage() {\n  const [items, setItems] = useState<Item[]>([]);\n  const [error, setError] = useState('');\n  const [message, setMessage] = useState('');\n  const [query, setQuery] = useState('');\n  const [type, setType] = useState('ALL');\n  const [formOpen, setFormOpen] = useState(false);\n  const [preview, setPreview] =\n    useState<UploadedMedia | null>(null);\n  const [uploading, setUploading] = useState(false);\n  const [loading, setLoading] = useState(true);\n\n  async function load() {\n    setLoading(true);\n\n    try {\n      setItems(await api<Item[]>('/workshop'));\n      setError('');\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось загрузить Мастерскую',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  useEffect(() => {\n    void load();\n  }, []);\n\n  const filtered = useMemo(() => {\n    const normalized = query.trim().toLowerCase();\n\n    return items.filter((item) => {\n      const typeMatches =\n        type === 'ALL' || item.type === type;\n\n      const queryMatches =\n        !normalized ||\n        `${item.title} ${item.description} ${\n          item.author.displayName\n        } ${item.author.username}`\n          .toLowerCase()\n          .includes(normalized);\n\n      return typeMatches && queryMatches;\n    });\n  }, [items, query, type]);\n\n  async function like(id: string) {\n    try {\n      await api(`/workshop/${id}/like`, {\n        method: 'POST',\n      });\n      await load();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось поставить отметку',\n      );\n    }\n  }\n\n  async function uploadPreview(\n    event: ChangeEvent<HTMLInputElement>,\n  ) {\n    const file = event.target.files?.[0];\n    event.target.value = '';\n\n    if (!file) return;\n\n    if (\n      ![\n        'image/png',\n        'image/jpeg',\n        'image/webp',\n      ].includes(file.type)\n    ) {\n      setError('Разрешены PNG, JPEG и WebP');\n      return;\n    }\n\n    if (file.size > 8 * 1024 * 1024) {\n      setError(\n        'Изображение должно быть не больше 8 МБ',\n      );\n      return;\n    }\n\n    setUploading(true);\n    setError('');\n\n    try {\n      setPreview(\n        await api<UploadedMedia>('/media', {\n          method: 'POST',\n          body: JSON.stringify({\n            kind: 'POST_IMAGE',\n            originalName: file.name,\n            dataUrl: await fileToDataUrl(file),\n          }),\n        }),\n      );\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось загрузить изображение',\n      );\n    } finally {\n      setUploading(false);\n    }\n  }\n\n  async function create(\n    event: FormEvent<HTMLFormElement>,\n  ) {\n    event.preventDefault();\n    setError('');\n    setMessage('');\n\n    try {\n      const payload = Object.fromEntries(\n        new FormData(event.currentTarget),\n      ) as Record<string, string>;\n\n      if (preview) {\n        payload.previewMediaId = preview.id;\n      }\n\n      await api('/workshop', {\n        method: 'POST',\n        body: JSON.stringify(payload),\n      });\n\n      setMessage('Работа отправлена на проверку');\n      setPreview(null);\n      setFormOpen(false);\n      event.currentTarget.reset();\n      await load();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось отправить работу',\n      );\n    }\n  }\n\n  return (\n    <div className=\"workshop-directory-page\">\n      <header className=\"compact-page-heading\">\n        <div>\n          <h1>Мастерская</h1>\n          <p>\n            Подарки, реакции, значки и оформление,\n            созданные пользователями FORRUM.\n          </p>\n        </div>\n\n        <button\n          type=\"button\"\n          className=\"button\"\n          onClick={() => setFormOpen(true)}\n        >\n          Предложить работу\n        </button>\n      </header>\n\n      <div aria-live=\"polite\">\n        {message && (\n          <div className=\"success-box\">{message}</div>\n        )}\n        {error && (\n          <div className=\"error-box\">\n            {error}\n            <button\n              type=\"button\"\n              className=\"button ghost small\"\n              onClick={() => void load()}\n            >\n              Повторить\n            </button>\n          </div>\n        )}\n      </div>\n\n      <section className=\"compact-filterbar\">\n        <label className=\"compact-search-field\">\n          <span className=\"visually-hidden\">\n            Поиск по Мастерской\n          </span>\n          <input\n            value={query}\n            onChange={(event) =>\n              setQuery(event.target.value)\n            }\n            placeholder=\"Название, автор или назначение\"\n          />\n        </label>\n\n        <label>\n          <span>Тип</span>\n          <select\n            value={type}\n            onChange={(event) =>\n              setType(event.target.value)\n            }\n          >\n            {typeOptions.map(([value, label]) => (\n              <option value={value} key={value}>\n                {label}\n              </option>\n            ))}\n          </select>\n        </label>\n      </section>\n\n      <section className=\"workshop-compact-grid\">\n        {loading ? (\n          Array.from({ length: 8 }).map((_, index) => (\n            <div\n              className=\"workshop-card-skeleton\"\n              key={index}\n              aria-hidden=\"true\"\n            />\n          ))\n        ) : filtered.length ? (\n          filtered.map((item) => (\n            <article\n              className=\"workshop-compact-card\"\n              key={item.id}\n            >\n              {item.thumbnailUrl ? (\n                <img\n                  src={item.thumbnailUrl}\n                  alt={`Превью работы «${item.title}»`}\n                />\n              ) : (\n                <div\n                  className=\"workshop-compact-placeholder\"\n                  aria-hidden=\"true\"\n                >\n                  {(typeNames[item.type] ?? item.type)\n                    .slice(0, 1)}\n                </div>\n              )}\n\n              <div className=\"workshop-compact-copy\">\n                <div>\n                  <span className=\"type-label\">\n                    {typeNames[item.type] ??\n                      item.type}\n                  </span>\n                  {item.status !== 'PUBLISHED' && (\n                    <span className=\"status-label\">\n                      {item.status === 'REVIEW'\n                        ? 'На проверке'\n                        : 'Отклонено'}\n                    </span>\n                  )}\n                </div>\n\n                <h2>{item.title}</h2>\n                <p>{item.description}</p>\n                <small>\n                  @{item.author.username} · ID{' '}\n                  {item.author.forrumId}\n                </small>\n              </div>\n\n              {item.status === 'PUBLISHED' && (\n                <button\n                  type=\"button\"\n                  className={`workshop-like-button ${\n                    item.likedByViewer ? 'active' : ''\n                  }`}\n                  aria-pressed={item.likedByViewer}\n                  onClick={() => void like(item.id)}\n                >\n                  ♡ {item.likeCount}\n                </button>\n              )}\n            </article>\n          ))\n        ) : (\n          <div className=\"compact-empty-state\">\n            <strong>\n              {query || type !== 'ALL'\n                ? 'Работы не найдены'\n                : 'В Мастерской пока нет работ'}\n            </strong>\n            <span>\n              Измените фильтры или отправьте первую\n              работу на проверку.\n            </span>\n          </div>\n        )}\n      </section>\n\n      {formOpen && (\n        <div\n          className=\"modal-backdrop\"\n          onMouseDown={(event) => {\n            if (\n              event.currentTarget === event.target\n            ) {\n              setFormOpen(false);\n            }\n          }}\n        >\n          <section\n            className=\"compact-dialog\"\n            role=\"dialog\"\n            aria-modal=\"true\"\n            aria-labelledby=\"workshop-submit-title\"\n          >\n            <header>\n              <div>\n                <h2 id=\"workshop-submit-title\">\n                  Предложить работу\n                </h2>\n                <p>\n                  Добавьте превью и коротко опишите,\n                  где элемент будет использоваться.\n                </p>\n              </div>\n              <button\n                type=\"button\"\n                className=\"dialog-close\"\n                aria-label=\"Закрыть\"\n                onClick={() => setFormOpen(false)}\n              >\n                ×\n              </button>\n            </header>\n\n            <form onSubmit={create}>\n              <label>\n                Тип\n                <select name=\"type\">\n                  {typeOptions\n                    .filter(([value]) => value !== 'ALL')\n                    .map(([value, label]) => (\n                      <option\n                        value={value}\n                        key={value}\n                      >\n                        {label}\n                      </option>\n                    ))}\n                </select>\n              </label>\n\n              <label>\n                Название\n                <input\n                  name=\"title\"\n                  minLength={3}\n                  maxLength={120}\n                  required\n                />\n              </label>\n\n              <label>\n                Описание\n                <textarea\n                  name=\"description\"\n                  minLength={20}\n                  maxLength={3000}\n                  required\n                />\n              </label>\n\n              <label>\n                Превью\n                <input\n                  type=\"file\"\n                  accept=\"image/png,image/jpeg,image/webp\"\n                  onChange={uploadPreview}\n                  disabled={uploading}\n                />\n                <span className=\"field-help\">\n                  PNG, JPEG или WebP, до 8 МБ.\n                </span>\n              </label>\n\n              {preview && (\n                <div className=\"workshop-preview-ready\">\n                  <img\n                    src={preview.thumbnailUrl}\n                    alt=\"Загруженное превью\"\n                  />\n                  <div>\n                    <strong>Превью загружено</strong>\n                    <button\n                      type=\"button\"\n                      className=\"text-button\"\n                      onClick={() => setPreview(null)}\n                    >\n                      Удалить\n                    </button>\n                  </div>\n                </div>\n              )}\n\n              <div className=\"dialog-actions\">\n                <button\n                  type=\"button\"\n                  className=\"button ghost\"\n                  onClick={() => setFormOpen(false)}\n                >\n                  Отмена\n                </button>\n                <button\n                  type=\"submit\"\n                  className=\"button\"\n                  disabled={uploading}\n                >\n                  {uploading\n                    ? 'Загружаем превью…'\n                    : 'Отправить на проверку'}\n                </button>\n              </div>\n            </form>\n          </section>\n        </div>\n      )}\n    </div>\n  );\n}\n\nfunction fileToDataUrl(\n  file: File,\n): Promise<string> {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n\n    reader.onload = () =>\n      resolve(String(reader.result));\n\n    reader.onerror = () =>\n      reject(\n        new Error(\n          'Не удалось прочитать изображение',\n        ),\n      );\n\n    reader.readAsDataURL(file);\n  });\n}\n")
          
          write("apps/web/app/events/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\nimport { formatDateTime } from '@/lib/format';\nimport type { PublicationCardData } from '@/lib/types';\n\ntype EventItem = {\n  id: string;\n  title: string;\n  description: string;\n  format: string;\n  status: string;\n  startsAt: string;\n  endsAt: string | null;\n  location: string | null;\n  capacity: number | null;\n  createdAt: string;\n  community: {\n    slug: string;\n    name: string;\n    accentColor: string;\n  };\n  createdBy: {\n    username: string;\n    displayName: string;\n  };\n  counts: {\n    going: number;\n    interested: number;\n  };\n  viewerAttendance: string | null;\n};\n\ntype Poll = {\n  id: string;\n  title: string;\n  description: string;\n  kind: string;\n  status: string;\n  closesAt: string;\n  createdAt: string;\n  quorum: number | null;\n  minAccountAgeDays: number;\n  requireSubscription: boolean;\n  allowAdvisory: boolean;\n  resultNote: string | null;\n  community: {\n    slug: string;\n    name: string;\n    accentColor: string;\n  };\n  viewerVote: {\n    optionId: string;\n    voteClass: string;\n  } | null;\n  options: Array<{\n    id: string;\n    label: string;\n    bindingVotes: number;\n    advisoryVotes: number;\n  }>;\n};\n\ntype Tab =\n  | 'all'\n  | 'events'\n  | 'polls'\n  | 'announcements';\n\nconst eventFormat: Record<string, string> = {\n  ONLINE: 'Онлайн',\n  OFFLINE: 'Офлайн',\n  HYBRID: 'Гибрид',\n};\n\nconst pollKind: Record<string, string> = {\n  GENERAL: 'Общий вопрос',\n  TEAM_REVIEW: 'Оценка команды',\n  ELECTION: 'Выборы',\n  STRUCTURE: 'Структура',\n  BUDGET: 'Средства сообщества',\n};\n\nexport default function EventsPage() {\n  const [events, setEvents] = useState<EventItem[]>([]);\n  const [polls, setPolls] = useState<Poll[]>([]);\n  const [announcements, setAnnouncements] = useState<\n    PublicationCardData[]\n  >([]);\n  const [tab, setTab] = useState<Tab>('all');\n  const [error, setError] = useState('');\n  const [message, setMessage] = useState('');\n  const [loading, setLoading] = useState(true);\n\n  async function load() {\n    setLoading(true);\n\n    try {\n      const [\n        eventRows,\n        pollRows,\n        announcementRows,\n      ] = await Promise.all([\n        api<EventItem[]>('/events'),\n        api<Poll[]>('/governance/polls'),\n        api<PublicationCardData[]>('/announcements'),\n      ]);\n\n      setEvents(eventRows);\n      setPolls(pollRows);\n      setAnnouncements(announcementRows);\n      setError('');\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось загрузить актуальное',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  useEffect(() => {\n    void load();\n  }, []);\n\n  const upcoming = useMemo(\n    () =>\n      events\n        .filter(\n          (item) =>\n            item.status === 'PUBLISHED' &&\n            new Date(item.startsAt) > new Date(),\n        )\n        .sort(\n          (left, right) =>\n            new Date(left.startsAt).getTime() -\n            new Date(right.startsAt).getTime(),\n        ),\n    [events],\n  );\n\n  const openPolls = useMemo(\n    () =>\n      polls\n        .filter((item) => item.status === 'OPEN')\n        .sort(\n          (left, right) =>\n            new Date(left.closesAt).getTime() -\n            new Date(right.closesAt).getTime(),\n        ),\n    [polls],\n  );\n\n  async function attend(\n    id: string,\n    status: 'GOING' | 'INTERESTED',\n  ) {\n    try {\n      await api(`/events/${id}/attendance`, {\n        method: 'POST',\n        body: JSON.stringify({ status }),\n      });\n\n      setMessage(\n        status === 'GOING'\n          ? 'Вы добавлены в список участников.'\n          : 'Событие отмечено как интересное.',\n      );\n\n      await load();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось изменить участие',\n      );\n    }\n  }\n\n  async function vote(\n    pollId: string,\n    optionId: string,\n  ) {\n    try {\n      const result = await api<{\n        voteClass: string;\n      }>(`/governance/polls/${pollId}/vote`, {\n        method: 'POST',\n        body: JSON.stringify({ optionId }),\n      });\n\n      setMessage(\n        result.voteClass === 'BINDING'\n          ? 'Решающий голос учтён.'\n          : 'Мнение учтено как консультативное.',\n      );\n\n      await load();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось проголосовать',\n      );\n    }\n  }\n\n  function renderEvent(item: EventItem) {\n    return (\n      <article\n        className=\"activity-row\"\n        key={`event-${item.id}`}\n      >\n        <time className=\"activity-date\">\n          <strong>\n            {new Date(item.startsAt).toLocaleDateString(\n              'ru-RU',\n              { day: '2-digit' },\n            )}\n          </strong>\n          <span>\n            {new Date(item.startsAt).toLocaleDateString(\n              'ru-RU',\n              { month: 'short' },\n            )}\n          </span>\n        </time>\n\n        <span\n          className=\"activity-kind\"\n          aria-hidden=\"true\"\n        >\n          □\n        </span>\n\n        <div className=\"activity-copy\">\n          <div>\n            <span>Событие</span>\n            <Link\n              href={`/communities/${item.community.slug}`}\n            >\n              {item.community.name}\n            </Link>\n          </div>\n          <Link\n            className=\"activity-title\"\n            href={`/events/${item.id}`}\n          >\n            {item.title}\n          </Link>\n          <p>{item.description}</p>\n        </div>\n\n        <div className=\"activity-meta\">\n          <strong>\n            {formatDateTime(item.startsAt)}\n          </strong>\n          <span>\n            {eventFormat[item.format] ?? item.format}\n            {item.location\n              ? ` · ${item.location}`\n              : ''}\n          </span>\n          <span>\n            {item.counts.going} идут ·{' '}\n            {item.counts.interested} интересуются\n          </span>\n        </div>\n\n        <div className=\"activity-actions\">\n          <button\n            type=\"button\"\n            className={\n              item.viewerAttendance === 'GOING'\n                ? 'button small'\n                : 'button ghost small'\n            }\n            onClick={() =>\n              void attend(item.id, 'GOING')\n            }\n          >\n            {item.viewerAttendance === 'GOING'\n              ? 'Вы идёте'\n              : 'Пойду'}\n          </button>\n\n          <button\n            type=\"button\"\n            className={\n              item.viewerAttendance === 'INTERESTED'\n                ? 'button small'\n                : 'button ghost small'\n            }\n            onClick={() =>\n              void attend(item.id, 'INTERESTED')\n            }\n          >\n            Интересно\n          </button>\n        </div>\n      </article>\n    );\n  }\n\n  function renderPoll(\n    poll: Poll,\n    interactive = false,\n  ) {\n    const totalBinding = poll.options.reduce(\n      (sum, option) =>\n        sum + option.bindingVotes,\n      0,\n    );\n\n    return (\n      <article\n        className=\"activity-row poll-activity-row\"\n        key={`poll-${poll.id}`}\n      >\n        <time className=\"activity-date\">\n          <strong>\n            {new Date(\n              poll.closesAt,\n            ).toLocaleDateString('ru-RU', {\n              day: '2-digit',\n            })}\n          </strong>\n          <span>до</span>\n        </time>\n\n        <span\n          className=\"activity-kind\"\n          aria-hidden=\"true\"\n        >\n          ▥\n        </span>\n\n        <div className=\"activity-copy\">\n          <div>\n            <span>Голосование</span>\n            <Link\n              href={`/communities/${poll.community.slug}`}\n            >\n              {poll.community.name}\n            </Link>\n          </div>\n          <strong className=\"activity-title\">\n            {poll.title}\n          </strong>\n          <p>{poll.description}</p>\n\n          {interactive && (\n            <div className=\"compact-poll-options\">\n              {poll.options.map((option) => (\n                <button\n                  type=\"button\"\n                  key={option.id}\n                  className={\n                    poll.viewerVote?.optionId ===\n                    option.id\n                      ? 'selected'\n                      : ''\n                  }\n                  disabled={poll.status !== 'OPEN'}\n                  onClick={() =>\n                    void vote(poll.id, option.id)\n                  }\n                >\n                  <span>{option.label}</span>\n                  <small>\n                    {option.bindingVotes}\n                    {poll.allowAdvisory\n                      ? ` · ${option.advisoryVotes}`\n                      : ''}\n                  </small>\n                </button>\n              ))}\n            </div>\n          )}\n        </div>\n\n        <div className=\"activity-meta\">\n          <strong>\n            {pollKind[poll.kind] ?? poll.kind}\n          </strong>\n          <span>\n            До {formatDateTime(poll.closesAt)}\n          </span>\n          <span>\n            {totalBinding} решающих голосов\n          </span>\n        </div>\n\n        <div className=\"activity-actions\">\n          <button\n            type=\"button\"\n            className=\"button ghost small\"\n            onClick={() => setTab('polls')}\n          >\n            {poll.viewerVote\n              ? 'Результаты'\n              : 'Проголосовать'}\n          </button>\n        </div>\n      </article>\n    );\n  }\n\n  function renderAnnouncement(\n    item: PublicationCardData,\n  ) {\n    return (\n      <article\n        className=\"activity-row\"\n        key={`announcement-${item.id}`}\n      >\n        <time className=\"activity-date\">\n          <strong>\n            {new Date(\n              item.createdAt,\n            ).toLocaleDateString('ru-RU', {\n              day: '2-digit',\n            })}\n          </strong>\n          <span>\n            {new Date(\n              item.createdAt,\n            ).toLocaleDateString('ru-RU', {\n              month: 'short',\n            })}\n          </span>\n        </time>\n\n        <span\n          className=\"activity-kind\"\n          aria-hidden=\"true\"\n        >\n          ◁\n        </span>\n\n        <div className=\"activity-copy\">\n          <div>\n            <span>Объявление</span>\n            <Link\n              href={`/communities/${item.community.slug}`}\n            >\n              {item.community.name}\n            </Link>\n          </div>\n          <Link\n            className=\"activity-title\"\n            href={`/p/${item.slug}`}\n          >\n            {item.title || item.excerpt}\n          </Link>\n          <p>{item.excerpt}</p>\n        </div>\n\n        <div className=\"activity-meta\">\n          <strong>\n            {item.author.displayName}\n          </strong>\n          <span>\n            {item.commentCount} ответов\n          </span>\n          <span>\n            {item.viewCount ?? 0} просмотров\n          </span>\n        </div>\n\n        <div className=\"activity-actions\">\n          <Link\n            className=\"button ghost small\"\n            href={`/p/${item.slug}`}\n          >\n            Открыть\n          </Link>\n        </div>\n      </article>\n    );\n  }\n\n  return (\n    <div className=\"events-directory-page\">\n      <header className=\"compact-page-heading\">\n        <div>\n          <h1>Актуальное</h1>\n          <p>\n            События, голосования и объявления\n            сообществ.\n          </p>\n        </div>\n\n        <Link\n          className=\"button\"\n          href=\"/events/create\"\n        >\n          Создать\n        </Link>\n      </header>\n\n      <nav\n        className=\"compact-section-tabs\"\n        aria-label=\"Актуальное FORRUM\"\n      >\n        <button\n          type=\"button\"\n          className={tab === 'all' ? 'active' : ''}\n          onClick={() => setTab('all')}\n        >\n          Всё\n          <span>\n            {upcoming.length +\n              openPolls.length +\n              announcements.length}\n          </span>\n        </button>\n\n        <button\n          type=\"button\"\n          className={tab === 'events' ? 'active' : ''}\n          onClick={() => setTab('events')}\n        >\n          События\n          <span>{upcoming.length}</span>\n        </button>\n\n        <button\n          type=\"button\"\n          className={tab === 'polls' ? 'active' : ''}\n          onClick={() => setTab('polls')}\n        >\n          Голосования\n          <span>{openPolls.length}</span>\n        </button>\n\n        <button\n          type=\"button\"\n          className={\n            tab === 'announcements' ? 'active' : ''\n          }\n          onClick={() => setTab('announcements')}\n        >\n          Объявления\n          <span>{announcements.length}</span>\n        </button>\n      </nav>\n\n      <div aria-live=\"polite\">\n        {message && (\n          <div className=\"success-box\">{message}</div>\n        )}\n        {error && (\n          <div className=\"error-box\">\n            {error}\n            <button\n              type=\"button\"\n              className=\"button ghost small\"\n              onClick={() => void load()}\n            >\n              Повторить\n            </button>\n          </div>\n        )}\n      </div>\n\n      <section className=\"activity-list\">\n        {loading ? (\n          <div className=\"compact-row-skeletons\">\n            {Array.from({ length: 8 }).map(\n              (_, index) => (\n                <span key={index} />\n              ),\n            )}\n          </div>\n        ) : tab === 'all' ? (\n          <>\n            {upcoming\n              .slice(0, 5)\n              .map((item) => renderEvent(item))}\n            {openPolls\n              .slice(0, 5)\n              .map((poll) => renderPoll(poll))}\n            {announcements\n              .slice(0, 5)\n              .map((item) =>\n                renderAnnouncement(item),\n              )}\n          </>\n        ) : tab === 'events' ? (\n          upcoming.map((item) => renderEvent(item))\n        ) : tab === 'polls' ? (\n          openPolls.map((poll) => (\n            <div id={`poll-${poll.id}`} key={poll.id}>\n              {renderPoll(poll, true)}\n            </div>\n          ))\n        ) : (\n          announcements.map((item) =>\n            renderAnnouncement(item),\n          )\n        )}\n\n        {!loading &&\n          ((tab === 'all' &&\n            !upcoming.length &&\n            !openPolls.length &&\n            !announcements.length) ||\n            (tab === 'events' && !upcoming.length) ||\n            (tab === 'polls' && !openPolls.length) ||\n            (tab === 'announcements' &&\n              !announcements.length)) && (\n            <div className=\"compact-empty-state\">\n              <strong>\n                В этом разделе пока пусто\n              </strong>\n              <span>\n                Новая активность появится после\n                публикации командой сообщества.\n              </span>\n            </div>\n          )}\n      </section>\n    </div>\n  );\n}\n")
          
          write("apps/web/components/auth-shell.tsx", "import type { ReactNode } from 'react';\nimport Link from 'next/link';\n\nexport function AuthShell({\n  eyebrow,\n  title,\n  description,\n  children,\n  footer,\n}: {\n  eyebrow: string;\n  title: string;\n  description: string;\n  children: ReactNode;\n  footer?: ReactNode;\n}) {\n  return (\n    <div className=\"compact-auth-page\">\n      <section className=\"compact-auth-panel\">\n        <Link\n          className=\"compact-auth-brand\"\n          href=\"/\"\n          aria-label=\"FORRUM\"\n        >\n          <span\n            className=\"brand-mark\"\n            aria-hidden=\"true\"\n          >\n            F\n          </span>\n          <strong aria-hidden=\"true\">FORRUM</strong>\n        </Link>\n\n        <header>\n          <span>{eyebrow}</span>\n          <h1>{title}</h1>\n          <p>{description}</p>\n        </header>\n\n        <div className=\"compact-auth-content\">\n          {children}\n        </div>\n\n        {footer && (\n          <footer className=\"auth-footer\">\n            {footer}\n          </footer>\n        )}\n      </section>\n    </div>\n  );\n}\n")
          
          write("apps/web/app/login/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type { FormEvent } from 'react';\nimport {\n  useEffect,\n  useState,\n} from 'react';\nimport { useRouter } from 'next/navigation';\nimport { api } from '@/lib/api';\nimport { AuthShell } from '@/components/auth-shell';\nimport { PasswordField } from '@/components/password-field';\nimport type { Me } from '@/lib/types';\n\nfunction safeNext(value: string | null) {\n  return value &&\n    value.startsWith('/') &&\n    !value.startsWith('//')\n    ? value\n    : '/';\n}\n\nexport default function LoginPage() {\n  const router = useRouter();\n  const [email, setEmail] = useState('');\n  const [password, setPassword] = useState('');\n  const [notice, setNotice] = useState('');\n  const [error, setError] = useState('');\n  const [loading, setLoading] = useState(false);\n  const [next, setNext] = useState('/');\n\n  useEffect(() => {\n    const params = new URLSearchParams(\n      window.location.search,\n    );\n\n    setNext(safeNext(params.get('next')));\n\n    if (params.get('verified') === '1') {\n      setNotice(\n        'Почта подтверждена. Теперь можно войти.',\n      );\n    }\n\n    if (params.get('reset') === '1') {\n      setNotice(\n        'Пароль изменён. Войдите с новым паролем.',\n      );\n    }\n  }, []);\n\n  async function submit(\n    event: FormEvent<HTMLFormElement>,\n  ) {\n    event.preventDefault();\n    setLoading(true);\n    setError('');\n\n    try {\n      const result = await api<Me>('/auth/login', {\n        method: 'POST',\n        body: JSON.stringify({ email, password }),\n      });\n\n      window.dispatchEvent(\n        new Event('forrum-auth-changed'),\n      );\n\n      if (!result.user.emailVerified) {\n        sessionStorage.setItem(\n          'forrum_pending_email',\n          result.user.email,\n        );\n        router.push('/verify-email');\n      } else if (!result.user.onboardingCompleted) {\n        router.push('/welcome');\n      } else {\n        router.push(next);\n      }\n\n      router.refresh();\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось войти',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  return (\n    <AuthShell\n      eyebrow=\"FORRUM ID\"\n      title=\"Вход\"\n      description=\"Введите почту и пароль.\"\n      footer={\n        <p>\n          Нет аккаунта?{' '}\n          <Link href=\"/register\">\n            <strong>Зарегистрироваться</strong>\n          </Link>\n        </p>\n      }\n    >\n      {notice && (\n        <div className=\"success-box\">{notice}</div>\n      )}\n\n      {error && (\n        <div className=\"error-box\" role=\"alert\">\n          {error}\n        </div>\n      )}\n\n      <form onSubmit={submit}>\n        <label>\n          Почта\n          <input\n            type=\"email\"\n            autoComplete=\"email\"\n            value={email}\n            placeholder=\"name@example.com\"\n            onChange={(event) =>\n              setEmail(event.target.value)\n            }\n            required\n          />\n        </label>\n\n        <PasswordField\n          label=\"Пароль\"\n          name=\"password\"\n          value={password}\n          onChange={setPassword}\n          autoComplete=\"current-password\"\n        />\n\n        <div className=\"auth-form-row compact\">\n          <span>\n            Неподтверждённый аккаунт откроется в\n            режиме чтения.\n          </span>\n          <Link href=\"/forgot-password\">\n            Забыли пароль?\n          </Link>\n        </div>\n\n        <button\n          className=\"button auth-submit\"\n          disabled={loading}\n        >\n          {loading ? 'Входим…' : 'Войти'}\n        </button>\n      </form>\n    </AuthShell>\n  );\n}\n")
          
          write("apps/web/app/register/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type { FormEvent } from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { useRouter } from 'next/navigation';\nimport { api } from '@/lib/api';\nimport { AuthShell } from '@/components/auth-shell';\nimport {\n  PasswordField,\n  passwordChecks,\n} from '@/components/password-field';\n\ntype Availability = {\n  available: boolean;\n  normalized: string;\n  reason?: string;\n};\n\nexport default function RegisterPage() {\n  const router = useRouter();\n  const [email, setEmail] = useState('');\n  const [username, setUsername] = useState('');\n  const [displayName, setDisplayName] =\n    useState('');\n  const [password, setPassword] = useState('');\n  const [availability, setAvailability] =\n    useState<Availability | null>(null);\n  const [checking, setChecking] = useState(false);\n  const [error, setError] = useState('');\n  const [loading, setLoading] = useState(false);\n\n  const checks = useMemo(\n    () => passwordChecks(password),\n    [password],\n  );\n\n  const usernameFormatValid =\n    /^[a-zA-Z0-9_]{3,24}$/.test(username);\n\n  useEffect(() => {\n    const value = username.trim().toLowerCase();\n\n    setAvailability(null);\n\n    if (!/^[a-z0-9_]{3,24}$/.test(value)) {\n      return;\n    }\n\n    const controller = new AbortController();\n\n    const timer = window.setTimeout(() => {\n      setChecking(true);\n\n      api<Availability>(\n        `/auth/username-availability?username=${encodeURIComponent(\n          value,\n        )}`,\n        { signal: controller.signal },\n      )\n        .then(setAvailability)\n        .catch((cause) => {\n          if (\n            (cause as Error).name !== 'AbortError'\n          ) {\n            setAvailability(null);\n          }\n        })\n        .finally(() => setChecking(false));\n    }, 350);\n\n    return () => {\n      window.clearTimeout(timer);\n      controller.abort();\n    };\n  }, [username]);\n\n  async function submit(\n    event: FormEvent<HTMLFormElement>,\n  ) {\n    event.preventDefault();\n    setError('');\n\n    if (\n      !usernameFormatValid ||\n      availability?.available === false\n    ) {\n      setError(\n        'Выберите корректное свободное имя пользователя',\n      );\n      return;\n    }\n\n    if (\n      !checks.longEnough ||\n      !checks.hasLetter ||\n      !checks.hasNumber\n    ) {\n      setError(\n        'Пароль не соответствует требованиям',\n      );\n      return;\n    }\n\n    setLoading(true);\n\n    try {\n      const result = await api<{\n        message: string;\n        email: string;\n      }>('/auth/register', {\n        method: 'POST',\n        body: JSON.stringify({\n          email,\n          username: username.trim().toLowerCase(),\n          displayName,\n          password,\n        }),\n      });\n\n      sessionStorage.setItem(\n        'forrum_pending_email',\n        result.email,\n      );\n\n      router.push('/verify-email?sent=1');\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось создать аккаунт',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  return (\n    <AuthShell\n      eyebrow=\"FORRUM ID\"\n      title=\"Создать аккаунт\"\n      description=\"Заполните основные данные. Почту нужно будет подтвердить.\"\n      footer={\n        <p>\n          Уже зарегистрированы?{' '}\n          <Link href=\"/login\">\n            <strong>Войти</strong>\n          </Link>\n        </p>\n      }\n    >\n      {error && (\n        <div className=\"error-box\" role=\"alert\">\n          {error}\n        </div>\n      )}\n\n      <form onSubmit={submit}>\n        <label>\n          Почта\n          <input\n            type=\"email\"\n            autoComplete=\"email\"\n            value={email}\n            placeholder=\"name@example.com\"\n            onChange={(event) =>\n              setEmail(event.target.value)\n            }\n            required\n          />\n          <span className=\"field-help\">\n            Сюда придёт ссылка подтверждения.\n          </span>\n        </label>\n\n        <label>\n          Имя пользователя\n          <div className=\"username-input-wrap\">\n            <span>@</span>\n            <input\n              autoComplete=\"username\"\n              value={username}\n              minLength={3}\n              maxLength={24}\n              placeholder=\"sebastian\"\n              onChange={(event) =>\n                setUsername(\n                  event.target.value.replace(/\\s/g, ''),\n                )\n              }\n              required\n            />\n          </div>\n\n          {!username && (\n            <span className=\"field-help\">\n              3–24 символа: латинские буквы, цифры и\n              подчёркивание.\n            </span>\n          )}\n\n          {username && !usernameFormatValid && (\n            <span className=\"field-status error\">\n              Используйте 3–24 латинских символа,\n              цифры или _\n            </span>\n          )}\n\n          {usernameFormatValid && checking && (\n            <span className=\"field-status\">\n              Проверяем доступность…\n            </span>\n          )}\n\n          {usernameFormatValid &&\n            !checking &&\n            availability?.available && (\n              <span className=\"field-status success\">\n                Имя свободно\n              </span>\n            )}\n\n          {usernameFormatValid &&\n            !checking &&\n            availability &&\n            !availability.available && (\n              <span className=\"field-status error\">\n                {availability.reason ??\n                  'Имя уже занято'}\n              </span>\n            )}\n        </label>\n\n        <label>\n          Отображаемое имя\n          <input\n            value={displayName}\n            minLength={2}\n            maxLength={60}\n            placeholder=\"Как к вам обращаться\"\n            onChange={(event) =>\n              setDisplayName(event.target.value)\n            }\n            required\n          />\n        </label>\n\n        <PasswordField\n          label=\"Пароль\"\n          name=\"password\"\n          value={password}\n          onChange={setPassword}\n          autoComplete=\"new-password\"\n          showRules\n        />\n\n        <button\n          className=\"button auth-submit\"\n          disabled={\n            loading ||\n            checking ||\n            !usernameFormatValid ||\n            availability?.available === false\n          }\n        >\n          {loading\n            ? 'Создаём аккаунт…'\n            : 'Создать аккаунт'}\n        </button>\n      </form>\n\n      <p className=\"auth-privacy-note\">\n        Это тестовый аккаунт закрытой версии\n        FORRUM.\n      </p>\n    </AuthShell>\n  );\n}\n")
          
          write("apps/web/app/search/page.tsx", "import { Suspense } from 'react';\nimport { SearchClient } from './search-client';\n\nfunction SearchFallback() {\n  return (\n    <div className=\"search-page-skeleton\">\n      <div className=\"compact-page-heading\">\n        <div>\n          <h1>Поиск</h1>\n          <p>\n            Публикации, сообщества, люди и хэштеги.\n          </p>\n        </div>\n      </div>\n\n      <div className=\"search-form search-form-modern\">\n        <div className=\"search-input-wrap\">\n          <input\n            aria-label=\"Поисковый запрос\"\n            placeholder=\"Название темы, имя или хэштег\"\n            disabled\n          />\n        </div>\n        <button className=\"button\" disabled>\n          Найти\n        </button>\n      </div>\n\n      <div className=\"compact-row-skeletons\">\n        {Array.from({ length: 5 }).map(\n          (_, index) => (\n            <span key={index} />\n          ),\n        )}\n      </div>\n    </div>\n  );\n}\n\nexport default function SearchPage() {\n  return (\n    <Suspense fallback={<SearchFallback />}>\n      <SearchClient />\n    </Suspense>\n  );\n}\n")
          
          write("apps/web/app/messages/page.tsx", "'use client';\n\nimport Link from 'next/link';\nimport type { FormEvent } from 'react';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { useRouter } from 'next/navigation';\nimport { api } from '@/lib/api';\nimport { Avatar } from '@/components/avatar';\nimport { formatRelativeTime } from '@/lib/format';\n\ntype Conversation = {\n  id: string;\n  updatedAt: string;\n  other: {\n    username: string;\n    displayName: string;\n    avatarUrl?: string | null;\n  } | null;\n  latest: {\n    body: string;\n    createdAt: string;\n    authorId: string;\n  } | null;\n  unread: boolean;\n};\n\ntype UserSuggestion = {\n  username: string;\n  displayName: string;\n  bio: string | null;\n  forrumId: number;\n};\n\ntype SearchResult = {\n  users: UserSuggestion[];\n};\n\nexport default function MessagesPage() {\n  const router = useRouter();\n  const [items, setItems] = useState<\n    Conversation[]\n  >([]);\n  const [error, setError] = useState('');\n  const [loading, setLoading] = useState(true);\n  const [query, setQuery] = useState('');\n  const [composeOpen, setComposeOpen] =\n    useState(false);\n  const [username, setUsername] = useState('');\n  const [body, setBody] = useState('');\n  const [suggestions, setSuggestions] = useState<\n    UserSuggestion[]\n  >([]);\n  const [starting, setStarting] = useState(false);\n\n  async function load() {\n    setLoading(true);\n\n    try {\n      setError('');\n      setItems(\n        await api<Conversation[]>('/messages'),\n      );\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось загрузить сообщения',\n      );\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  useEffect(() => {\n    void load();\n\n    const initial = new URLSearchParams(\n      window.location.search,\n    ).get('to');\n\n    if (initial) {\n      setUsername(initial);\n      setComposeOpen(true);\n    }\n  }, []);\n\n  useEffect(() => {\n    const value = username.trim();\n\n    if (value.length < 2) {\n      setSuggestions([]);\n      return;\n    }\n\n    const timer = window.setTimeout(async () => {\n      try {\n        const result = await api<SearchResult>(\n          `/search?q=${encodeURIComponent(value)}`,\n        );\n\n        setSuggestions(\n          result.users\n            .filter(\n              (user) =>\n                user.username !== value.toLowerCase(),\n            )\n            .slice(0, 5),\n        );\n      } catch {\n        setSuggestions([]);\n      }\n    }, 260);\n\n    return () => window.clearTimeout(timer);\n  }, [username]);\n\n  async function start(\n    event: FormEvent<HTMLFormElement>,\n  ) {\n    event.preventDefault();\n\n    if (!username.trim() || !body.trim()) return;\n\n    setStarting(true);\n\n    try {\n      setError('');\n\n      const result = await api<{ id: string }>(\n        '/messages',\n        {\n          method: 'POST',\n          body: JSON.stringify({\n            username: username.trim(),\n            body: body.trim(),\n          }),\n        },\n      );\n\n      router.push(`/messages/${result.id}`);\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : 'Не удалось начать диалог',\n      );\n    } finally {\n      setStarting(false);\n    }\n  }\n\n  const filtered = useMemo(() => {\n    const normalized = query.trim().toLowerCase();\n\n    if (!normalized) return items;\n\n    return items.filter((item) =>\n      `${item.other?.displayName ?? ''} ${\n        item.other?.username ?? ''\n      } ${item.latest?.body ?? ''}`\n        .toLowerCase()\n        .includes(normalized),\n    );\n  }, [items, query]);\n\n  const unreadCount = items.filter(\n    (item) => item.unread,\n  ).length;\n\n  return (\n    <div className=\"messages-index-page\">\n      <header className=\"compact-page-heading\">\n        <div>\n          <h1>Сообщения</h1>\n          <p>\n            {unreadCount\n              ? `${unreadCount} непрочитанных диалогов`\n              : 'Все диалоги прочитаны'}\n          </p>\n        </div>\n\n        <button\n          type=\"button\"\n          className=\"button\"\n          onClick={() => setComposeOpen(true)}\n        >\n          Новый диалог\n        </button>\n      </header>\n\n      {error && (\n        <div className=\"error-box\" role=\"alert\">\n          {error}\n          <button\n            type=\"button\"\n            className=\"button ghost small\"\n            onClick={() => void load()}\n          >\n            Повторить\n          </button>\n        </div>\n      )}\n\n      <section className=\"messages-list-panel\">\n        <div className=\"messages-list-search\">\n          <label\n            className=\"visually-hidden\"\n            htmlFor=\"conversation-search\"\n          >\n            Поиск по перепискам\n          </label>\n          <input\n            id=\"conversation-search\"\n            value={query}\n            onChange={(event) =>\n              setQuery(event.target.value)\n            }\n            placeholder=\"Найти переписку\"\n          />\n        </div>\n\n        <div className=\"messages-table-head\">\n          <span>Диалог</span>\n          <span>Последнее сообщение</span>\n          <span>Обновлено</span>\n        </div>\n\n        <div className=\"messages-compact-list\">\n          {loading ? (\n            <div className=\"compact-row-skeletons\">\n              {Array.from({ length: 7 }).map(\n                (_, index) => (\n                  <span key={index} />\n                ),\n              )}\n            </div>\n          ) : filtered.length ? (\n            filtered.map((item) => (\n              <Link\n                className={`messages-compact-row ${\n                  item.unread ? 'unread' : ''\n                }`}\n                href={`/messages/${item.id}`}\n                key={item.id}\n              >\n                <Avatar\n                  name={\n                    item.other?.displayName ??\n                    'Диалог'\n                  }\n                  size={40}\n                  url={item.other?.avatarUrl}\n                />\n\n                <div className=\"messages-person\">\n                  <strong>\n                    {item.other?.displayName ??\n                      'Диалог'}\n                  </strong>\n                  {item.other && (\n                    <span>\n                      @{item.other.username}\n                    </span>\n                  )}\n                </div>\n\n                <p>\n                  {item.latest?.body ??\n                    'Сообщений пока нет'}\n                </p>\n\n                <time>\n                  {formatRelativeTime(\n                    item.updatedAt,\n                  )}\n                </time>\n\n                {item.unread && (\n                  <span\n                    className=\"unread-dot\"\n                    aria-label=\"Непрочитанное сообщение\"\n                  />\n                )}\n              </Link>\n            ))\n          ) : (\n            <div className=\"compact-empty-state\">\n              <strong>\n                {query\n                  ? 'Переписка не найдена'\n                  : 'Переписок пока нет'}\n              </strong>\n              <span>\n                {query\n                  ? 'Измените запрос.'\n                  : 'Начните новый диалог с участником FORRUM.'}\n              </span>\n            </div>\n          )}\n        </div>\n      </section>\n\n      {composeOpen && (\n        <div\n          className=\"modal-backdrop\"\n          onMouseDown={(event) => {\n            if (\n              event.currentTarget === event.target\n            ) {\n              setComposeOpen(false);\n            }\n          }}\n        >\n          <section\n            className=\"compact-dialog\"\n            role=\"dialog\"\n            aria-modal=\"true\"\n            aria-labelledby=\"new-message-title\"\n          >\n            <header>\n              <div>\n                <h2 id=\"new-message-title\">\n                  Новый диалог\n                </h2>\n                <p>\n                  Укажите пользователя и первое\n                  сообщение.\n                </p>\n              </div>\n              <button\n                type=\"button\"\n                className=\"dialog-close\"\n                aria-label=\"Закрыть\"\n                onClick={() =>\n                  setComposeOpen(false)\n                }\n              >\n                ×\n              </button>\n            </header>\n\n            <form onSubmit={start}>\n              <label>\n                Получатель\n                <input\n                  value={username}\n                  onChange={(event) =>\n                    setUsername(event.target.value)\n                  }\n                  name=\"username\"\n                  autoComplete=\"off\"\n                  placeholder=\"например, friend\"\n                  required\n                />\n              </label>\n\n              {suggestions.length > 0 && (\n                <div\n                  className=\"recipient-suggestions\"\n                  aria-label=\"Подходящие пользователи\"\n                >\n                  {suggestions.map((user) => (\n                    <button\n                      type=\"button\"\n                      key={user.username}\n                      onClick={() => {\n                        setUsername(user.username);\n                        setSuggestions([]);\n                      }}\n                    >\n                      <Avatar\n                        name={user.displayName}\n                        size={34}\n                      />\n                      <span>\n                        <strong>\n                          {user.displayName}\n                        </strong>\n                        <small>\n                          @{user.username} · ID{' '}\n                          {user.forrumId}\n                        </small>\n                      </span>\n                    </button>\n                  ))}\n                </div>\n              )}\n\n              <label>\n                Первое сообщение\n                <textarea\n                  value={body}\n                  onChange={(event) =>\n                    setBody(event.target.value)\n                  }\n                  name=\"body\"\n                  minLength={1}\n                  maxLength={5000}\n                  placeholder=\"Напишите сообщение\"\n                  required\n                />\n              </label>\n\n              <p className=\"message-safety-note\">\n                Не отправляйте пароли, коды\n                подтверждения и платёжные данные.\n              </p>\n\n              <div className=\"dialog-actions\">\n                <button\n                  type=\"button\"\n                  className=\"button ghost\"\n                  onClick={() =>\n                    setComposeOpen(false)\n                  }\n                >\n                  Отмена\n                </button>\n\n                <button\n                  className=\"button\"\n                  disabled={\n                    starting ||\n                    !username.trim() ||\n                    !body.trim()\n                  }\n                >\n                  {starting\n                    ? 'Открываем…'\n                    : 'Начать диалог'}\n                </button>\n              </div>\n            </form>\n          </section>\n        </div>\n      )}\n    </div>\n  );\n}\n")
          
          write("docs/FORRUM_UI_UNIFIED_V5.md", "# FORRUM UI V5 — единая компактная система\n\n## Цель\n\nПривести публичные разделы к утверждённой светлой форумной базе: белые поверхности, тонкие серые границы, компактные строки, минимум скруглений и отсутствие декоративного шума.\n\n## Изменённые разделы\n\n- Главная: серверная начальная загрузка, плотная лента, стабильные skeleton-состояния.\n- Сообщества: компактный браузер структуры без счётчика «1+» и крупных статистических карточек.\n- Медиа: рабочий каталог партнёров и форма заявки.\n- Мастерская: фильтры, компактные карточки и отдельное окно отправки работы.\n- Актуальное: единый список событий, голосований и объявлений.\n- Вход и регистрация: компактные формы без промо-половины экрана.\n- Поиск: полноценное начальное состояние вместо технической заглушки.\n- Сообщения: компактный список диалогов и отдельное окно нового сообщения.\n- Шапка: корректное доступное название логотипа без дублирования «FFORRUM».\n\n## Проверки\n\nWorkflow выполняет последовательно:\n\n1. проверку исходной структуры;\n2. статическую проверку;\n3. UX truthfulness;\n4. accessibility;\n5. TypeScript typecheck всех workspaces;\n6. API tests;\n7. Prisma validate/push/seed;\n8. production build API и web;\n9. запуск и smoke-test публичных API и страниц;\n10. вторую чистую сборку;\n11. финальную проверку diff;\n12. коммит только после всех успешных этапов.\n")
          
          css_path = Path('apps/web/app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* FORRUM UNIFIED COMPACT INTERFACE V5 */'
          if marker in css:
              css = css[:css.index(marker)].rstrip()
          css_path.write_text(css + '\n\n' + "/* FORRUM UNIFIED COMPACT INTERFACE V5 */\n:root {\n  color-scheme: light;\n  --bg: #f6f6f4;\n  --surface: #ffffff;\n  --surface-soft: #fafaf8;\n  --text: #1b1b1b;\n  --muted: #70706d;\n  --line: #d8d8d4;\n  --line-strong: #bdbdb8;\n  --accent: #444444;\n  --accent-soft: #efefec;\n  --danger: #a32121;\n  --danger-soft: #fff1f1;\n  --success: #1f6a45;\n  --success-soft: #edf7f1;\n  --warning: #785b18;\n  --warning-soft: #fff8e8;\n  --shadow: none;\n}\n\nbody {\n  background: var(--bg);\n  color: var(--text);\n  background-image: none;\n}\n\n.shell {\n  width: min(1500px, calc(100% - 36px));\n}\n\n.header {\n  border-bottom: 1px solid var(--line);\n  background: rgba(255, 255, 255, .97);\n  box-shadow: none;\n}\n\n.nav {\n  min-height: 58px;\n}\n\n.brand-mark {\n  border-radius: 2px;\n  background: #4d4d4d;\n  box-shadow: none;\n}\n\n.main {\n  padding-block: 14px 72px;\n}\n\n.button {\n  border-radius: 5px;\n  box-shadow: none;\n}\n\n.compact-page-heading {\n  display: flex;\n  min-height: 58px;\n  align-items: center;\n  justify-content: space-between;\n  gap: 18px;\n  padding: 10px 14px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.compact-page-heading > div {\n  min-width: 0;\n}\n\n.compact-page-heading h1 {\n  margin: 0;\n  font-size: 19px;\n  line-height: 1.2;\n}\n\n.compact-page-heading p {\n  overflow: hidden;\n  margin: 4px 0 0;\n  color: var(--muted);\n  font-size: 11px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.compact-filterbar {\n  display: grid;\n  grid-template-columns: minmax(260px, 1fr) 190px 190px;\n  gap: 10px;\n  padding: 10px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.compact-filterbar label {\n  display: grid;\n  gap: 4px;\n  margin: 0;\n  color: #555;\n  font-size: 10px;\n  font-weight: 650;\n}\n\n.compact-filterbar input,\n.compact-filterbar select {\n  min-height: 36px;\n  padding-block: 0;\n  font-size: 12px;\n}\n\n.compact-search-field {\n  align-self: end;\n}\n\n.compact-section-tabs {\n  display: flex;\n  min-height: 44px;\n  align-items: end;\n  gap: 24px;\n  overflow-x: auto;\n  padding: 0 14px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.compact-section-tabs button {\n  position: relative;\n  display: inline-flex;\n  min-height: 43px;\n  align-items: center;\n  gap: 7px;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #666;\n  cursor: pointer;\n  font-size: 12px;\n  white-space: nowrap;\n}\n\n.compact-section-tabs button span {\n  display: grid;\n  min-width: 20px;\n  height: 20px;\n  place-items: center;\n  border: 1px solid #dededb;\n  border-radius: 10px;\n  color: #777;\n  font-size: 9px;\n}\n\n.compact-section-tabs button.active {\n  color: #1f1f1f;\n  font-weight: 750;\n}\n\n.compact-section-tabs button.active::after {\n  content: \"\";\n  position: absolute;\n  right: 0;\n  bottom: -1px;\n  left: 0;\n  height: 2px;\n  background: #454545;\n}\n\n.compact-empty-state {\n  display: grid;\n  min-height: 112px;\n  align-content: center;\n  justify-items: start;\n  gap: 6px;\n  padding: 18px;\n  border: 1px dashed #c9c9c5;\n  border-radius: 5px;\n  background: #fbfbfa;\n  color: var(--muted);\n  font-size: 11px;\n}\n\n.compact-empty-state strong {\n  color: #333;\n  font-size: 13px;\n}\n\n.compact-row-skeletons {\n  display: grid;\n  width: 100%;\n}\n\n.compact-row-skeletons > span {\n  position: relative;\n  display: block;\n  min-height: 62px;\n  overflow: hidden;\n  border-bottom: 1px solid #e7e7e4;\n  background:\n    linear-gradient(\n      90deg,\n      transparent 0,\n      rgba(0, 0, 0, .035) 50%,\n      transparent 100%\n    ),\n    #fff;\n  background-size: 240px 100%, auto;\n  animation: compact-shimmer 1.5s linear infinite;\n}\n\n.compact-row-skeletons > span:last-child {\n  border-bottom: 0;\n}\n\n@keyframes compact-shimmer {\n  from {\n    background-position: -240px 0, 0 0;\n  }\n\n  to {\n    background-position: calc(100% + 240px) 0, 0 0;\n  }\n}\n\n.error-box,\n.success-box {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n\n/* Главная */\n.home-lower-grid {\n  width: calc(100% - 294px);\n  margin-left: 294px;\n}\n\n.home-tree-skeleton {\n  display: grid;\n}\n\n.home-tree-skeleton span {\n  display: block;\n  height: 43px;\n  border-bottom: 1px solid #ececea;\n  background:\n    linear-gradient(\n      90deg,\n      #f7f7f5 20%,\n      #eeeeeb 50%,\n      #f7f7f5 80%\n    );\n  background-size: 240px 100%;\n  animation: compact-shimmer 1.5s linear infinite;\n}\n\n.home-topic-skeleton {\n  pointer-events: none;\n}\n\n.home-topic-skeleton > div {\n  display: grid;\n  gap: 6px;\n}\n\n.skeleton-dot {\n  display: block;\n  width: 20px;\n  height: 20px;\n  border-radius: 50%;\n  background: #ececea;\n}\n\n.skeleton-line {\n  display: block;\n  height: 7px;\n  border-radius: 3px;\n  background: #ececea;\n}\n\n.skeleton-line.short {\n  width: 44%;\n}\n\n.skeleton-line.medium {\n  width: 66%;\n}\n\n.skeleton-line.long {\n  width: 92%;\n}\n\n.home-current-skeleton {\n  display: grid;\n  grid-template-columns: 28px 1fr;\n  min-height: 88px;\n  gap: 10px;\n  padding: 12px;\n  border-bottom: 1px solid var(--line);\n}\n\n.home-current-skeleton > span {\n  display: block;\n  width: 26px;\n  height: 26px;\n  border-radius: 4px;\n  background: #ececea;\n}\n\n.home-current-skeleton > div {\n  display: grid;\n  align-content: center;\n  gap: 7px;\n}\n\n.home-current-skeleton i {\n  display: block;\n  width: 80%;\n  height: 7px;\n  border-radius: 3px;\n  background: #ececea;\n}\n\n.home-current-skeleton i:first-child {\n  width: 35%;\n}\n\n.home-current-skeleton i:last-child {\n  width: 55%;\n}\n\n/* Каталог сообществ */\n.community-browser-page,\n.media-directory-page,\n.workshop-directory-page,\n.events-directory-page,\n.messages-index-page {\n  display: grid;\n  gap: 12px;\n}\n\n.community-browser-layout {\n  display: grid;\n  grid-template-columns: 230px minmax(0, 1fr);\n  gap: 12px;\n  align-items: start;\n}\n\n.community-browser-index,\n.community-browser-list {\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.community-browser-index {\n  position: sticky;\n  top: 72px;\n}\n\n.community-browser-index > strong {\n  display: block;\n  padding: 13px 12px;\n  border-bottom: 1px solid var(--line);\n  font-size: 12px;\n}\n\n.community-browser-index nav {\n  display: grid;\n  padding: 5px 0;\n}\n\n.community-browser-index nav a {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  gap: 8px;\n  min-height: 34px;\n  align-items: center;\n  padding: 0 12px;\n  color: #474747;\n  font-size: 11px;\n}\n\n.community-browser-index nav a:hover {\n  background: #f7f7f5;\n  color: #111;\n}\n\n.community-browser-index nav span {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.community-browser-index nav small {\n  color: #8a8a86;\n  font-size: 9px;\n}\n\n.community-browser-node {\n  display: grid;\n}\n\n.community-browser-row {\n  --tree-indent: calc(var(--tree-depth, 0) * 18px);\n  display: grid;\n  grid-template-columns: 30px minmax(0, 1fr) auto;\n  min-height: 78px;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px 9px calc(12px + var(--tree-indent));\n  border-bottom: 1px solid #e5e5e2;\n  background: #fff;\n}\n\n.community-browser-row.expandable {\n  cursor: pointer;\n}\n\n.community-browser-row.expandable:hover,\n.community-browser-row:focus-visible {\n  background: #fafaf9;\n  outline: 0;\n}\n\n.community-browser-symbol {\n  display: grid;\n  width: 26px;\n  height: 26px;\n  place-items: center;\n  border: 1px solid #c8c8c4;\n  border-radius: 4px;\n  background: #fafaf8;\n  color: #555;\n  font-size: 11px;\n  font-weight: 800;\n}\n\n.community-browser-copy {\n  min-width: 0;\n}\n\n.community-browser-title {\n  display: flex;\n  min-width: 0;\n  align-items: center;\n  gap: 7px;\n}\n\n.community-browser-title > a {\n  overflow: hidden;\n  color: #202020;\n  font-size: 13px;\n  font-weight: 750;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.community-browser-title > a:hover {\n  text-decoration: underline;\n  text-underline-offset: 3px;\n}\n\n.community-browser-chevron {\n  display: grid;\n  width: 22px;\n  height: 22px;\n  place-items: center;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #666;\n  cursor: pointer;\n  font-size: 17px;\n}\n\n.community-followed {\n  flex: 0 0 auto;\n  padding: 2px 6px;\n  border: 1px solid #d3d3cf;\n  border-radius: 9px;\n  color: #666;\n  font-size: 8px;\n}\n\n.community-browser-copy > p {\n  overflow: hidden;\n  margin: 3px 0 5px;\n  color: #6d6d69;\n  font-size: 10px;\n  line-height: 1.35;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.community-browser-meta {\n  display: flex;\n  gap: 9px;\n  overflow: hidden;\n  color: #858581;\n  font-size: 9px;\n  white-space: nowrap;\n}\n\n.community-browser-meta span + span::before {\n  content: \"·\";\n  margin-right: 9px;\n  color: #b1b1ad;\n}\n\n.community-browser-meta a {\n  color: #555;\n}\n\n.community-browser-actions {\n  display: flex;\n  gap: 7px;\n}\n\n.community-browser-actions .button {\n  min-height: 32px;\n  padding: 6px 10px;\n  font-size: 10px;\n}\n\n.community-browser-children {\n  border-left: 2px solid #dededa;\n}\n\n.community-browser-list\n  > .community-browser-node:last-child\n  > .community-browser-row {\n  border-bottom: 0;\n}\n\n/* Медиа */\n.media-partner-list,\n.media-material-list {\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.media-partner-head {\n  display: grid;\n  grid-template-columns:\n    minmax(0, 1fr)\n    150px\n    150px\n    130px;\n  min-height: 32px;\n  align-items: center;\n  gap: 12px;\n  padding: 0 12px 0 50px;\n  border-bottom: 1px solid var(--line);\n  color: #777;\n  font-size: 9px;\n}\n\n.media-partner-row {\n  display: grid;\n  grid-template-columns:\n    30px\n    minmax(0, 1fr)\n    150px\n    150px\n    130px;\n  min-height: 76px;\n  align-items: center;\n  gap: 12px;\n  padding: 9px 12px;\n  border-bottom: 1px solid #e6e6e3;\n}\n\n.media-partner-row:last-child {\n  border-bottom: 0;\n}\n\n.media-partner-row:hover {\n  background: #fafaf9;\n}\n\n.media-partner-avatar {\n  display: grid;\n  width: 28px;\n  height: 28px;\n  place-items: center;\n  border: 1px solid #c8c8c4;\n  border-radius: 50%;\n  background: #f4f4f2;\n  color: #555;\n  font-size: 11px;\n  font-weight: 800;\n}\n\n.media-partner-copy {\n  min-width: 0;\n}\n\n.media-partner-copy strong {\n  color: #222;\n  font-size: 12px;\n}\n\n.media-partner-copy p {\n  overflow: hidden;\n  margin: 3px 0;\n  color: #777;\n  font-size: 10px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.media-partner-copy a {\n  color: #555;\n  font-size: 9px;\n}\n\n.media-partner-platform {\n  display: grid;\n  gap: 3px;\n  font-size: 10px;\n}\n\n.media-partner-platform small,\n.media-partner-audience {\n  color: #777;\n  font-size: 9px;\n}\n\n.media-partner-row .button {\n  justify-self: end;\n}\n\n.media-material-row {\n  display: grid;\n  grid-template-columns: 30px minmax(0, 1fr) 100px;\n  min-height: 70px;\n  align-items: center;\n  gap: 12px;\n  padding: 9px 12px;\n  border-bottom: 1px solid #e6e6e3;\n}\n\n.media-material-row:last-child {\n  border-bottom: 0;\n}\n\n.media-material-symbol {\n  display: grid;\n  width: 26px;\n  height: 26px;\n  place-items: center;\n  border: 1px solid #c8c8c4;\n  border-radius: 4px;\n  color: #555;\n  font-size: 10px;\n  font-weight: 800;\n}\n\n.media-material-row > div {\n  min-width: 0;\n}\n\n.media-material-row > div > span,\n.media-material-row > strong {\n  color: #858581;\n  font-size: 9px;\n  font-weight: 500;\n}\n\n.media-material-row a {\n  display: block;\n  overflow: hidden;\n  margin: 2px 0;\n  color: #222;\n  font-size: 12px;\n  font-weight: 700;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.media-material-row p {\n  overflow: hidden;\n  margin: 0;\n  color: #777;\n  font-size: 10px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n/* Мастерская */\n.workshop-compact-grid {\n  display: grid;\n  grid-template-columns: repeat(\n    auto-fill,\n    minmax(245px, 1fr)\n  );\n  gap: 10px;\n}\n\n.workshop-compact-card,\n.workshop-card-skeleton {\n  min-width: 0;\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.workshop-card-skeleton {\n  min-height: 260px;\n  background:\n    linear-gradient(\n      90deg,\n      #f7f7f5 20%,\n      #eeeeeb 50%,\n      #f7f7f5 80%\n    );\n  background-size: 240px 100%;\n  animation: compact-shimmer 1.5s linear infinite;\n}\n\n.workshop-compact-card > img,\n.workshop-compact-placeholder {\n  display: grid;\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  max-height: 170px;\n  place-items: center;\n  border-bottom: 1px solid var(--line);\n  object-fit: cover;\n}\n\n.workshop-compact-placeholder {\n  background: #f1f1ef;\n  color: #777;\n  font-size: 34px;\n  font-weight: 800;\n}\n\n.workshop-compact-copy {\n  padding: 11px 12px 8px;\n}\n\n.workshop-compact-copy > div {\n  display: flex;\n  gap: 6px;\n}\n\n.status-label {\n  padding: 2px 6px;\n  border: 1px solid #d9d9d5;\n  border-radius: 8px;\n  color: #777;\n  font-size: 8px;\n}\n\n.workshop-compact-copy h2 {\n  overflow: hidden;\n  margin: 8px 0 5px;\n  font-size: 14px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.workshop-compact-copy p {\n  display: -webkit-box;\n  min-height: 42px;\n  overflow: hidden;\n  margin: 0 0 8px;\n  color: #70706d;\n  font-size: 10px;\n  line-height: 1.45;\n  -webkit-box-orient: vertical;\n  -webkit-line-clamp: 3;\n}\n\n.workshop-compact-copy small {\n  color: #858581;\n  font-size: 9px;\n}\n\n.workshop-like-button {\n  width: calc(100% - 24px);\n  min-height: 32px;\n  margin: 0 12px 12px;\n  border: 1px solid #cececa;\n  border-radius: 4px;\n  background: #fff;\n  color: #555;\n  cursor: pointer;\n  font-size: 10px;\n  font-weight: 700;\n}\n\n.workshop-like-button:hover,\n.workshop-like-button.active {\n  border-color: #777;\n  background: #f1f1ef;\n  color: #222;\n}\n\n/* Актуальное */\n.activity-list {\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.activity-row {\n  display: grid;\n  grid-template-columns:\n    42px\n    28px\n    minmax(0, 1fr)\n    210px\n    170px;\n  min-height: 86px;\n  align-items: center;\n  gap: 10px;\n  padding: 9px 12px;\n  border-bottom: 1px solid #e5e5e2;\n}\n\n.activity-row:last-child {\n  border-bottom: 0;\n}\n\n.activity-row:hover {\n  background: #fafaf9;\n}\n\n.activity-date {\n  display: grid;\n  justify-items: center;\n  color: #555;\n  line-height: 1;\n}\n\n.activity-date strong {\n  font-size: 18px;\n}\n\n.activity-date span {\n  margin-top: 4px;\n  color: #858581;\n  font-size: 9px;\n  text-transform: lowercase;\n}\n\n.activity-kind {\n  display: grid;\n  width: 26px;\n  height: 26px;\n  place-items: center;\n  border: 1px solid #c8c8c4;\n  border-radius: 4px;\n  color: #555;\n  font-size: 12px;\n}\n\n.activity-copy {\n  min-width: 0;\n}\n\n.activity-copy > div:first-child {\n  display: flex;\n  gap: 6px;\n  color: #858581;\n  font-size: 9px;\n}\n\n.activity-copy > div:first-child span + a::before {\n  content: \"·\";\n  margin-right: 6px;\n}\n\n.activity-title {\n  display: block;\n  overflow: hidden;\n  margin: 3px 0;\n  color: #222;\n  font-size: 12px;\n  font-weight: 750;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.activity-copy p {\n  overflow: hidden;\n  margin: 0;\n  color: #777;\n  font-size: 10px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.activity-meta {\n  display: grid;\n  gap: 3px;\n  font-size: 9px;\n}\n\n.activity-meta strong {\n  color: #444;\n}\n\n.activity-meta span {\n  color: #7a7a76;\n}\n\n.activity-actions {\n  display: flex;\n  justify-content: flex-end;\n  gap: 6px;\n}\n\n.activity-actions .button {\n  min-height: 31px;\n  padding: 5px 9px;\n  font-size: 9px;\n}\n\n.compact-poll-options {\n  display: grid !important;\n  gap: 4px !important;\n  margin-top: 8px;\n}\n\n.compact-poll-options button {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  min-height: 30px;\n  align-items: center;\n  gap: 8px;\n  padding: 4px 8px;\n  border: 1px solid #d5d5d1;\n  border-radius: 4px;\n  background: #fff;\n  cursor: pointer;\n  color: #333;\n  font-size: 10px;\n  text-align: left;\n}\n\n.compact-poll-options button.selected {\n  border-color: #666;\n  background: #f0f0ed;\n}\n\n.compact-poll-options small {\n  color: #777;\n}\n\n/* Авторизация */\n.compact-auth-page {\n  display: grid;\n  min-height: calc(100vh - 150px);\n  place-items: center;\n  padding: 24px 0 48px;\n}\n\n.compact-auth-panel {\n  width: min(430px, 100%);\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 7px;\n  background: #fff;\n}\n\n.compact-auth-brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  margin: 18px 20px 0;\n  color: #222;\n}\n\n.compact-auth-brand strong {\n  font-size: 17px;\n  letter-spacing: -.03em;\n}\n\n.compact-auth-panel > header {\n  padding: 18px 20px 15px;\n  border-bottom: 1px solid var(--line);\n}\n\n.compact-auth-panel > header > span {\n  color: #777;\n  font-size: 9px;\n  font-weight: 800;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n\n.compact-auth-panel > header h1 {\n  margin: 5px 0 3px;\n  font-size: 24px;\n}\n\n.compact-auth-panel > header p {\n  margin: 0;\n  color: #777;\n  font-size: 11px;\n}\n\n.compact-auth-content {\n  padding: 18px 20px;\n}\n\n.compact-auth-content\n  .auth-panel-head,\n.compact-auth-content > h2,\n.compact-auth-content\n  > .muted:first-of-type {\n  display: none;\n}\n\n.compact-auth-content form {\n  display: grid;\n  gap: 12px;\n}\n\n.compact-auth-content label {\n  gap: 5px;\n  margin: 0;\n  color: #444;\n  font-size: 11px;\n}\n\n.compact-auth-content input,\n.compact-auth-content select,\n.compact-auth-content textarea {\n  min-height: 40px;\n}\n\n.compact-auth-content .auth-submit {\n  width: 100%;\n  margin-top: 2px;\n}\n\n.auth-form-row.compact {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 12px;\n  color: #777;\n  font-size: 9px;\n}\n\n.auth-form-row.compact a {\n  flex: 0 0 auto;\n  color: #444;\n  font-weight: 700;\n}\n\n.compact-auth-panel .auth-footer {\n  padding: 13px 20px;\n  border-top: 1px solid var(--line);\n  color: #666;\n  font-size: 10px;\n  text-align: center;\n}\n\n.compact-auth-panel .auth-footer p {\n  margin: 0;\n}\n\n.auth-privacy-note {\n  margin: 12px 0 0;\n  color: #8a8a86;\n  font-size: 9px;\n  line-height: 1.45;\n}\n\n/* Поиск */\n.search-page-skeleton {\n  display: grid;\n  gap: 12px;\n}\n\n.search-title {\n  min-height: 58px;\n  margin: 0 0 12px;\n  padding: 10px 14px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.search-title h1 {\n  margin: 0;\n  font-size: 19px;\n}\n\n.search-title p {\n  margin: 4px 0 0;\n  font-size: 11px;\n}\n\n.search-form-modern {\n  grid-template-columns: minmax(0, 1fr) 100px;\n  gap: 8px;\n  padding: 10px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: #fff;\n}\n\n.search-form-modern input {\n  min-height: 38px;\n}\n\n.search-start {\n  min-height: 130px;\n  border-radius: 6px;\n}\n\n.search-start h2 {\n  font-size: 15px;\n}\n\n.search-start p {\n  font-size: 10px;\n}\n\n.search-group-tabs,\n.search-publication-filters,\n.search-result-summary,\n.search-groups > section {\n  border-radius: 6px;\n  box-shadow: none;\n}\n\n.search-result-card,\n.search-card-grid .card,\n.user-row {\n  border-radius: 5px;\n}\n\n/* Сообщения */\n.messages-index-page {\n  width: min(980px, 100%);\n  margin-inline: auto;\n}\n\n.messages-list-panel {\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  bac