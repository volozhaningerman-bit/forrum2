px 170px;\n  }\n\n  .community-browser-layout {\n    grid-template-columns: 200px minmax(0, 1fr);\n  }\n\n  .activity-row {\n    grid-template-columns:\n      38px\n      26px\n      minmax(0, 1fr)\n      180px;\n  }\n\n  .activity-actions {\n    grid-column: 3 / -1;\n    justify-content: flex-start;\n    padding-left: 0;\n  }\n\n  .media-partner-head {\n    display: none;\n  }\n\n  .media-partner-row {\n    grid-template-columns:\n      30px\n      minmax(0, 1fr)\n      130px\n      120px;\n  }\n\n  .media-partner-row .button {\n    grid-column: 2 / -1;\n    justify-self: start;\n  }\n}\n\n@media (max-width: 930px) {\n  .home-lower-grid {\n    width: auto;\n    margin-left: 0;\n  }\n\n  .compact-filterbar {\n    grid-template-columns: 1fr 1fr;\n  }\n\n  .compact-search-field {\n    grid-column: 1 / -1;\n  }\n\n  .community-browser-layout {\n    grid-template-columns: 1fr;\n  }\n\n  .community-browser-index {\n    position: static;\n  }\n\n  .community-browser-index nav {\n    grid-template-columns: repeat(3, 1fr);\n  }\n\n  .community-browser-index nav a {\n    border-right: 1px solid #ecece9;\n  }\n\n  .media-partner-row {\n    grid-template-columns: 30px minmax(0, 1fr) 130px;\n  }\n\n  .media-partner-audience {\n    display: none;\n  }\n\n  .activity-row {\n    grid-template-columns:\n      38px\n      26px\n      minmax(0, 1fr);\n  }\n\n  .activity-meta {\n    grid-column: 3;\n  }\n\n  .activity-actions {\n    grid-column: 3;\n  }\n}\n\n@media (max-width: 760px) {\n  .compact-page-heading {\n    align-items: flex-start;\n  }\n\n  .compact-page-heading p {\n    white-space: normal;\n  }\n\n  .compact-filterbar {\n    grid-template-columns: 1fr;\n  }\n\n  .compact-search-field {\n    grid-column: auto;\n  }\n\n  .community-browser-row {\n    grid-template-columns: 28px minmax(0, 1fr);\n  }\n\n  .community-browser-actions {\n    grid-column: 2;\n  }\n\n  .community-browser-index nav {\n    grid-template-columns: repeat(2, 1fr);\n  }\n\n  .media-partner-row {\n    grid-template-columns: 28px minmax(0, 1fr);\n  }\n\n  .media-partner-platform {\n    grid-column: 2;\n  }\n\n  .media-partner-row .button {\n    grid-column: 2;\n  }\n\n  .media-material-row {\n    grid-template-columns: 28px minmax(0, 1fr);\n  }\n\n  .media-material-row > strong {\n    grid-column: 2;\n  }\n\n  .activity-row {\n    grid-template-columns: 36px 24px minmax(0, 1fr);\n  }\n\n  .activity-meta,\n  .activity-actions {\n    grid-column: 3;\n  }\n\n  .messages-table-head {\n    display: none;\n  }\n\n  .messages-compact-row {\n    grid-template-columns: 40px minmax(0, 1fr) 80px;\n  }\n\n  .messages-compact-row p {\n    grid-column: 2 / -1;\n  }\n\n  .messages-person {\n    grid-column: 2;\n  }\n\n  .messages-compact-row time {\n    grid-column: 3;\n    grid-row: 1;\n  }\n\n  .form-grid-two {\n    grid-template-columns: 1fr;\n  }\n}\n\n@media (max-width: 560px) {\n  .compact-page-heading {\n    min-height: 52px;\n    padding: 9px 10px;\n  }\n\n  .compact-page-heading h1 {\n    font-size: 17px;\n  }\n\n  .compact-page-heading .button {\n    min-height: 34px;\n    padding: 7px 9px;\n    font-size: 10px;\n  }\n\n  .compact-section-tabs {\n    gap: 18px;\n    padding-inline: 10px;\n  }\n\n  .community-browser-index nav {\n    grid-template-columns: 1fr;\n  }\n\n  .community-browser-actions {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n  }\n\n  .community-browser-actions .button {\n    width: 100%;\n  }\n\n  .workshop-compact-grid {\n    grid-template-columns: 1fr;\n  }\n\n  .activity-row {\n    grid-template-columns: 34px minmax(0, 1fr);\n    gap: 8px;\n  }\n\n  .activity-kind {\n    display: none;\n  }\n\n  .activity-copy,\n  .activity-meta,\n  .activity-actions {\n    grid-column: 2;\n  }\n\n  .activity-date {\n    grid-row: 1 / span 3;\n    align-self: start;\n    padding-top: 3px;\n  }\n\n  .messages-compact-row {\n    grid-template-columns: 38px minmax(0, 1fr);\n  }\n\n  .messages-compact-row time {\n    display: none;\n  }\n\n  .messages-compact-row p {\n    grid-column: 2;\n  }\n\n  .modal-backdrop {\n    place-items: end center;\n    padding: 0;\n  }\n\n  .compact-dialog {\n    width: 100%;\n    max-height: 90vh;\n    border-radius: 8px 8px 0 0;\n  }\n}" + '\n', encoding='utf-8')
