name: "4rrum v42: Add Tyuryaga Game"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-tyuryaga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Tyuryaga game files
        run: |
          mkdir -p apps/api/src/modules/tyuryaga/dto
          mkdir -p apps/web/app/applications/games/tyuryaga

