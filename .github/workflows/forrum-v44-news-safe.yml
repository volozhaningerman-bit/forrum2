name: FORRUM V44 — News Block SAFE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-v44-news-safe
  cancel-in-progress: false

jobs:
  v44-news-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNING FORRUM V44 NEWS SAFE ==="

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'FORRUM сегодня' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'const totalPublications' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'const toggleTree' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Актуальное"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'announcements.map((item) => (' \
            apps/web/components/home-dashboard.tsx

          grep -Fq "['/services', 'Услуги']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" \
            apps/web/components/main-nav.tsx

          grep -Fq '1580px' apps/web/app/globals.css

      - name: Write regression check first
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/home-v44-news-safe-check.mjs <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync(
            'apps/web/components/home-dashboard.tsx',
            'utf8',
          );

          const required = [
            '// FORRUM_HOME_NEWS_V44_SAFE',
            'title="Новости FORRUM"',
            'href="/news"',
            'announcements.map((item) => (',
            'discussed.slice(0, 3).map((item) => (',
            'href="/feed?mode=popular"',
            'Новости FORRUM пока не опубликованы.',
            '// FORRUM_HOME_CONTENT_VISUALS_V43',
          ];

          for (const marker of required) {
            if (!source.includes(marker)) {
              throw new Error(`V44 SAFE marker missing: ${marker}`);
            }
          }

          const forbidden = [
            'FORRUM сегодня',
            'const totalPublications',
            'const recentPublications',
            'const totalSubscriptions',
          ];

          for (const marker of forbidden) {
            if (source.includes(marker)) {
              throw new Error(`V44 SAFE legacy code remains: ${marker}`);
            }
          }

          const newsTitleCount = (
            source.match(/title="Новости FORRUM"/g) ?? []
          ).length;

          if (newsTitleCount !== 1) {
            throw new Error(
              `V44 SAFE expects exactly one News panel; found ${newsTitleCount}.`,
            );
          }

          console.log(
            'V44 SAFE: PASS — news replaces stats and Actual uses discussed topics.',
          );
          NODE

      - name: TDD RED
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/home-v44-news-safe-check.mjs; then
            echo "::error::V44 SAFE unexpectedly passed before implementation."
            exit 1
          fi

          echo "TDD RED confirmed."

      - name: Apply V44 safe component patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/components/home-dashboard.tsx')
          source = path.read_text(encoding='utf-8')

          marker = '// FORRUM_HOME_NEWS_V44_SAFE'
          if marker in source:
              raise SystemExit('V44 SAFE already exists.')

          # 1. Mark this exact production change.
          export_anchor = 'export function HomeDashboard({'
          if source.count(export_anchor) != 1:
              raise SystemExit(
                  f'Expected one HomeDashboard export, found {source.count(export_anchor)}.'
              )

          source = source.replace(
              export_anchor,
              marker + '\n' + export_anchor,
              1,
          )

          # 2. Remove the whole legacy stats-calculation region by stable
          # semantic anchors instead of fragile regex/line formatting.
          stats_start = source.find('  const totalPublications')
          toggle_start = source.find('  const toggleTree', stats_start)

          if stats_start < 0 or toggle_start < 0:
              raise SystemExit(
                  'Could not locate legacy stats region by semantic anchors.'
              )

          stats_region = source[stats_start:toggle_start]

          for required_name in (
              'totalPublications',
              'recentPublications',
              'totalSubscriptions',
          ):
              if required_name not in stats_region:
                  raise SystemExit(
                      f'Legacy stats region is missing expected {required_name}.'
                  )

          source = source[:stats_start] + source[toggle_start:]

          # 3. Change only the Actual panel between its own title and the
          # Weekly panel. No assumptions about code outside that boundary.
          actual_title = source.find('title="Актуальное"')
          weekly_title = source.find('<h2>Участники недели</h2>')

          if (
              actual_title < 0
              or weekly_title < 0
              or weekly_title <= actual_title
          ):
              raise SystemExit('Could not locate Actual panel boundaries.')

          actual = source[actual_title:weekly_title]

          if actual.count('announcements.map((item) => (') != 1:
              raise SystemExit(
                  'Expected exactly one announcements map in Actual.'
              )

          actual = actual.replace(
              'href="/news"',
              'href="/feed?mode=popular"',
              1,
          )
          actual = actual.replace(
              'announcements.map((item) => (',
              'discussed.slice(0, 3).map((item) => (',
              1,
          )

          # Keep the active-poll row. Only fix the empty state so it reflects
          # the new Actual source.
          actual = actual.replace(
              '!announcements.length &&',
              '!discussed.length &&',
              1,
          )

          source = (
              source[:actual_title]
              + actual
              + source[weekly_title:]
          )

          # 4. Locate the old FORRUM-today panel through the heading and
          # replace its entire enclosing section. This avoids JSX regex.
          heading = '<h2>FORRUM сегодня</h2>'
          heading_pos = source.find(heading)

          if heading_pos < 0:
              raise SystemExit('Could not locate FORRUM today heading.')

          section_start = source.rfind(
              '<section className="forrum-home-v16__panel">',
              0,
              heading_pos,
          )
          section_end = source.find('</section>', heading_pos)

          if section_start < 0 or section_end < 0:
              raise SystemExit(
                  'Could not locate enclosing FORRUM today section.'
              )

          section_end += len('</section>')

          old_panel = source[section_start:section_end]

          if 'forrum-home-v16__stats' not in old_panel:
              raise SystemExit(
                  'FORRUM today section does not contain the expected stats block.'
              )

          news_panel = (
              '<HomePanel\n'
              '          title="Новости FORRUM"\n'
              '          href="/news"\n'
              '        >\n'
              '          <div className="forrum-home-v16__actual-list">\n'
              '            {announcements.length ? (\n'
              '              announcements.map((item) => (\n'
              '                <Link\n'
              '                  className="forrum-home-v16__actual"\n'
              '                  href={`/p/${item.slug}`}\n'
              '                  key={item.id}\n'
              '                >\n'
              '                  <CommunityMark\n'
              '                    name={item.community.name}\n'
              '                    url={topicContentVisual(item)}\n'
              '                    size={30}\n'
              '                  />\n'
              '                  <span>\n'
              "                    <strong>{item.title || 'Новость FORRUM'}</strong>\n"
              '                    <small>{relativeTime(item.createdAt)}</small>\n'
              '                  </span>\n'
              '                </Link>\n'
              '              ))\n'
              '            ) : (\n'
              '              <p className="forrum-home-v16__empty">\n'
              '                Новости FORRUM пока не опубликованы.\n'
              '              </p>\n'
              '            )}\n'
              '          </div>\n'
              '        </HomePanel>'
          )

          source = (
              source[:section_start]
              + news_panel
              + source[section_end:]
          )

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in source.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('V44 SAFE component patch applied.')
          PY

          git diff --check

      - name: TDD GREEN
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v44-news-safe-check.mjs

          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '1580px' \
            apps/web/app/globals.css

          echo "TDD GREEN confirmed."

      - name: Audit protected product scope
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          expected="$(
            printf '%s\n' \
              apps/web/components/home-dashboard.tsx \
              scripts/home-v44-news-safe-check.mjs |
            sort
          )"

          echo "Detected V44 SAFE paths:"
          printf '%s\n' "$changed"

          test "$changed" = "$expected"

          test -z "$(
            git diff --name-only -- \
              apps/web/app/globals.css \
              apps/web/components/main-nav.tsx \
              apps/web/app/page.tsx \
              apps/api \
              packages/contracts
          )"

          grep -Fq "['/services', 'Услуги']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/media', 'Медиа']" \
            apps/web/components/main-nav.tsx
          grep -Fq "['/news', 'Новости']" \
            apps/web/components/main-nav.tsx

          ! git diff | grep -Eq \
            'fakePoll|fakeUser|mockPoll|mockUser|demoPoll|demoUser'

          echo "V44 SAFE protected scope: PASS"

      - name: Stage verified V44 SAFE intent
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/components/home-dashboard.tsx \
            scripts/home-v44-news-safe-check.mjs

          git diff --cached --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Validate Prisma
        shell: bash
        env:
          DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
        run: |
          set -euo pipefail

          npm run db:validate
          npm run db:generate

      - name: Static UX and accessibility checks
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v44-news-safe-check.mjs
          node scripts/home-content-visual-v43-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Relevant tests
        shell: bash
        run: |
          set -euo pipefail

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apps/web/.next
          npm run build

      - name: Production self-review
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v44-news-safe-check.mjs
          node scripts/home-content-visual-v43-check.mjs

          # Product invariants.
          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq '// FORRUM_HOME_CONTENT_VISUALS_V43' \
            apps/web/components/home-dashboard.tsx

          # No hidden legacy stats and no fake content.
          ! grep -Fq 'FORRUM сегодня' \
            apps/web/components/home-dashboard.tsx
          ! grep -Fq 'const totalPublications' \
            apps/web/components/home-dashboard.tsx
          ! git diff --cached | grep -Eq \
            'fakePoll|fakeUser|mockPoll|mockUser|demoPoll|demoUser'

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck
          npm run build

          echo "V44 SAFE production self-review: PASS"

      - name: Restore generated build noise
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- .
          git clean -ffdx

          git diff --cached --check

          changed="$(
            git diff --cached --name-only |
            sort
          )"

          expected="$(
            printf '%s\n' \
              apps/web/components/home-dashboard.tsx \
              scripts/home-v44-news-safe-check.mjs |
            sort
          )"

          echo "Final staged V44 SAFE paths:"
          printf '%s\n' "$changed"

          test "$changed" = "$expected"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          echo "V44 SAFE cleanup: PASS"

      - name: Commit verified V44 SAFE
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "Replace home stats with FORRUM news V44"

          test -z "$(git status --porcelain)"

      - name: Publish only against unchanged main
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during V44 SAFE verification. Rerun it."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify remote V44 SAFE
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx \
            | grep -Fq '// FORRUM_HOME_NEWS_V44_SAFE'

          echo "Published FORRUM V44 News SAFE."
