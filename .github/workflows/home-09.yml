name: Главная — 09
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: home-09
  cancel-in-progress: false
run-name: Главная — 09
jobs:
  home-09:
    name: Главная — 09
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: 01. Checkout
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: 02. Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: 03. База
      shell: bash
      run: 'set -euo pipefail

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"

        echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


        grep -Fq ''4RRUM_HOME_V4'' apps/web/components/home-dashboard.tsx

        grep -Fq ''forrum-home-v16__discussed-head'' apps/web/components/home-dashboard.tsx

        grep -Fq ''Старт 4RRUM'' apps/web/components/home-dashboard.tsx

        grep -Fq ''HeaderSearch'' apps/web/components/site-header.tsx

        grep -Fq ''ThemeToggle'' apps/web/components/main-nav.tsx


        echo "База Главная — 08 подтверждена."

        '
      id: baseline
    - name: 04. Контракт
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        Path(''/tmp/home-09-check.mjs'').write_text(''import fs from \''node:fs\'';\n\nconst home = fs.readFileSync(\n  \''apps/web/components/home-dashboard.tsx\'',\n  \''utf8\'',\n);\nconst css = fs.readFileSync(\n  \''apps/web/app/globals.css\'',\n  \''utf8\'',\n);\n\nfunction fail(message) {\n  throw new Error(message);\n}\n\nif (!home.includes(\''4RRUM_HOME_09_POLISH\'')) {\n  fail(\''Missing 4RRUM_HOME_09_POLISH marker.\'');\n}\n\nconst weekly = home.match(\n  /const\\s+\\[weeklyMode,\\s*setWeeklyMode\\]\\s*=\\s*useState<[\\s\\S]{0,180}?>\\s*\\(\\s*\''activity\''\\s*\\)\\s*;/\n);\nif (!weekly) {\n  fail(\''Weekly participants must initialize directly to activity.\'');\n}\n\nfor (const title of [\''Ответы\'', \''Просмотры\'']) {\n  const titlePos = home.indexOf(`title="${title}"`);\n  if (titlePos < 0) {\n    fail(`Missing discussed metric: ${title}`);\n  }\n\n  const nextClose = home.indexOf(\''</span>\'', titlePos);\n  if (nextClose < 0) {\n    fail(`Missing closing span for metric: ${title}`);\n  }\n\n  const metricSegment = home.slice(titlePos, nextClose);\n  if (/aria-hidden\\s*=\\s*["\'']true["\'']/.test(metricSegment)) {\n    fail(`Decorative metric glyph remains: ${title}`);\n  }\n}\n\nif
        (!home.includes(\''forrum-home-v16__discussed-head\'')) {\n  fail(\''Discussed metric legend is missing.\'');\n}\n\nconst startTitle = home.search(\n  /title\\s*=\\s*["\'']Старт 4RRUM["\'']/\n);\nif (startTitle < 0) {\n  fail(\''Старт 4RRUM panel is missing.\'');\n}\n\nconst startOpen = home.lastIndexOf(\''<HomePanel\'', startTitle);\nconst startOpenEnd = home.indexOf(\''>\'', startTitle);\nif (startOpen < 0 || startOpenEnd < 0) {\n  fail(\''Cannot inspect Старт 4RRUM opening tag.\'');\n}\n\nconst startOpening = home.slice(startOpen, startOpenEnd + 1);\nif (/\\bhref\\s*=/.test(startOpening)) {\n  fail(\''Старт 4RRUM must not show generic Смотреть все link.\'');\n}\n\nfor (const marker of [\n  \''4RRUM_HOME_09_POLISH\'',\n  \''grid-template-columns: 58px 68px 84px\'',\n  \''font-size: 10.5px\'',\n  \''font-size: 11.75px\'',\n  \''color: #a7b1bb\'',\n]) {\n  if (!css.includes(marker)) {\n    fail(`CSS missing: ${marker}`);\n  }\n}\n\nif (!css.includes(\n  \''.forrum-home-v16__topic-stat > [aria-hidden="true"]\''\n)) {\n  fail(\''Metric icon CSS fallback is missing.\'');\n}\n\nconsole.log(\''Главная — 09 contract: PASS\'');\n'', encoding=''utf-8'')

        PY

        node --check /tmp/home-09-check.mjs

        '
    - name: 05. RED
      shell: bash
      run: "set -euo pipefail\nif node /tmp/home-09-check.mjs; then\n  echo \"::error::Контракт неожиданно прошёл до изменений.\"\n  exit 1\nfi\necho \"RED: PASS — Главная — 08 ещё не соответствует 09.\"\n"
    - name: 06. Зависимости
      shell: bash
      run: 'set -euo pipefail

        npm install --include=dev --no-audit --no-fund --package-lock=false

        '
    - name: 07. Диагностика
      shell: bash
      run: 'set -euo pipefail

        echo "=== weeklyMode ==="

        grep -n -A10 -B2 ''weeklyMode'' apps/web/components/home-dashboard.tsx | head -80 || true


        echo "=== discussed metrics ==="

        grep -n -A5 -B3 ''title="Ответы"\|title="Просмотры"'' apps/web/components/home-dashboard.tsx | head -100 || true


        echo "=== start panel ==="

        grep -n -A8 -B3 ''Старт 4RRUM'' apps/web/components/home-dashboard.tsx | head -80 || true

        '
    - name: 08. Патч
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nPath('/tmp/home-09.py').write_text('from pathlib import Path\\nimport re\\n\\nHOME = Path(\\'apps/web/components/home-dashboard.tsx\\')\\nhome = HOME.read_text(encoding=\\'utf-8\\')\\n\\nif \\'4RRUM_HOME_09_POLISH\\' in home:\\n    raise SystemExit(\\'Главная — 09 уже применена.\\')\\n\\nif \\'4RRUM_HOME_V4\\' not in home:\\n    raise SystemExit(\\n        \\'Ожидалась успешная Главная — 08: marker 4RRUM_HOME_V4 не найден.\\'\\n    )\\n\\n\\ndef statement_end(text: str, start: int) -> int:\\n    paren = bracket = brace = 0\\n    quote = None\\n    escaped = False\\n    line_comment = False\\n    block_comment = False\\n    i = start\\n\\n    while i < len(text):\\n        ch = text[i]\\n        nxt = text[i + 1] if i + 1 < len(text) else \\'\\'\\n\\n        if line_comment:\\n            if ch == \\'\\\\n\\':\\n                line_comment = False\\n            i += 1\\n            continue\\n\\n        if block_comment:\\n            if ch == \\'*\\' and nxt == \\'/\\':\\n                block_comment = False\\n                i += 2\\n                continue\\n            i += 1\\n            continue\\n\\\
        n        if quote is not None:\\n            if escaped:\\n                escaped = False\\n            elif ch == \\'\\\\\\\\\\':\\n                escaped = True\\n            elif ch == quote:\\n                quote = None\\n            i += 1\\n            continue\\n\\n        if ch == \\'/\\' and nxt == \\'/\\':\\n            line_comment = True\\n            i += 2\\n            continue\\n\\n        if ch == \\'/\\' and nxt == \\'*\\':\\n            block_comment = True\\n            i += 2\\n            continue\\n\\n        if ch in (\"\\'\", \\'\"\\', \\'`\\'):\\n            quote = ch\\n            i += 1\\n            continue\\n\\n        if ch == \\'(\\':\\n            paren += 1\\n        elif ch == \\')\\':\\n            paren = max(0, paren - 1)\\n        elif ch == \\'[\\':\\n            bracket += 1\\n        elif ch == \\']\\':\\n            bracket = max(0, bracket - 1)\\n        elif ch == \\'{\\':\\n            brace += 1\\n        elif ch == \\'}\\':\\n            brace = max(0, brace - 1)\\n        elif ch == \\';\\' and paren == bracket == brace == 0:\\n            return i + 1\\n\\n        i += 1\\n\\n    raise SystemExit(\\'weeklyMode declaration\
        \ end not found.\\')\\n\\n\\ndef opening_tag_end(text: str, start: int) -> int:\\n    quote = None\\n    escaped = False\\n    brace = 0\\n    i = start\\n\\n    while i < len(text):\\n        ch = text[i]\\n\\n        if quote is not None:\\n            if escaped:\\n                escaped = False\\n            elif ch == \\'\\\\\\\\\\':\\n                escaped = True\\n            elif ch == quote:\\n                quote = None\\n            i += 1\\n            continue\\n\\n        if ch in (\"\\'\", \\'\"\\', \\'`\\'):\\n            quote = ch\\n            i += 1\\n            continue\\n\\n        if ch == \\'{\\':\\n            brace += 1\\n        elif ch == \\'}\\':\\n            brace = max(0, brace - 1)\\n        elif ch == \\'>\\' and brace == 0:\\n            return i\\n\\n        i += 1\\n\\n    raise SystemExit(\\'JSX opening tag end not found.\\')\\n\\n\\ndef metric_element_bounds(text: str, title: str):\\n    title_matches = list(re.finditer(\\n        rf\\'title\\\\s*=\\\\s*([\"\\\\\\']){re.escape(title)}\\\\1\\',\\n        text,\\n    ))\\n    if len(title_matches) != 1:\\n        raise SystemExit(\\n            f\\'Expected exactly one metric title {title!r},\
        \ \\'\\n            f\\'found {len(title_matches)}.\\'\\n        )\\n\\n    title_match = title_matches[0]\\n    start = text.rfind(\\'<span\\', 0, title_match.start())\\n    if start < 0:\\n        raise SystemExit(f\\'Metric opening span not found: {title}.\\')\\n\\n    open_end = opening_tag_end(text, start)\\n    if not (start <= title_match.start() <= open_end):\\n        raise SystemExit(f\\'Metric title outside opening span: {title}.\\')\\n\\n    token_re = re.compile(r\\'<span\\\\b|</span\\\\s*>\\', re.I)\\n    depth = 1\\n    close_start = close_end = -1\\n\\n    for token in token_re.finditer(text, open_end + 1):\\n        if token.group(0).lower().startswith(\\'<span\\'):\\n            depth += 1\\n        else:\\n            depth -= 1\\n            if depth == 0:\\n                close_start = token.start()\\n                close_end = token.end()\\n                break\\n\\n    if close_start < 0:\\n        raise SystemExit(f\\'Metric closing span not found: {title}.\\')\\n\\n    return start, open_end, close_start, close_end\\n\\n\\ndef clean_metric(text: str, title: str) -> str:\\n    start, open_end, close_start, close_end = metric_element_bounds(\\n     \
        \   text,\\n        title,\\n    )\\n    opening = text[start:open_end + 1]\\n    body = text[open_end + 1:close_start]\\n\\n    if \\'forrum-home-v16__topic-stat\\' not in opening:\\n        class_match = re.search(\\n            r\\'className\\\\s*=\\\\s*\"([^\"]*)\"\\',\\n            opening,\\n        )\\n        if class_match:\\n            classes = class_match.group(1).split()\\n            classes.append(\\'forrum-home-v16__topic-stat\\')\\n            opening = (\\n                opening[:class_match.start(1)]\\n                + \\' \\'.join(dict.fromkeys(classes))\\n                + opening[class_match.end(1):]\\n            )\\n        else:\\n            opening = opening.replace(\\n                \\'<span\\',\\n                \\'<span className=\"forrum-home-v16__topic-stat\"\\',\\n                1,\\n            )\\n\\n    # Remove decorative nested glyph spans regardless of the glyph\\n    # character used by an older revision.\\n    body = re.sub(\\n        r\\'\\\\s*<span\\\\b[^>]*aria-hidden\\\\s*=\\\\s*([\"\\\\\\'])true\\\\1[^>]*>\\'\\n        r\\'[\\\\s\\\\S]*?</span>\\\\s*\\',\\n        \\'\\\\n              \\',\\n        body,\\n    )\\n\\n    if\
        \ re.search(\\n        r\\'<span\\\\b[^>]*aria-hidden\\\\s*=\\\\s*([\"\\\\\\'])true\\\\1\\',\\n        body,\\n    ):\\n        raise SystemExit(\\n            f\\'Decorative metric glyph remains inside {title}.\\'\\n        )\\n\\n    return (\\n        text[:start]\\n        + opening\\n        + body\\n        + text[close_start:close_end]\\n        + text[close_end:]\\n    )\\n\\n\\n# A. Weekly participants: use a direct initial state so there is no\\n# hidden indirection that can reopen \"По симпатиям\" on first render.\\nweekly_match = re.search(\\n    r\\'(?m)^[ \\\\t]*const\\\\s+\\\\[weeklyMode,\\\\s*setWeeklyMode\\\\]\\\\s*=\\'\\n    r\\'\\\\s*useState<\\',\\n    home,\\n)\\nif not weekly_match:\\n    raise SystemExit(\\'weeklyMode declaration not found.\\')\\n\\nweekly_start = weekly_match.start()\\nweekly_end = statement_end(home, weekly_start)\\nindent = re.match(r\\'[ \\\\t]*\\', home[weekly_start:]).group(0)\\n\\nweekly_replacement = (\\n    f\"{indent}const [weeklyMode, setWeeklyMode] = useState<\\\\n\"\\n    f\"{indent}  \\'likes\\' | \\'activity\\'\\\\n\"\\n    f\"{indent}>(\\'activity\\');\"\\n)\\n\\nhome = (\\n    home[:weekly_start]\\n    + weekly_replacement\\\
        n    + home[weekly_end:]\\n)\\n\\n# B. Discussed metrics: numbers only, no mystery glyphs.\\nhome = clean_metric(home, \\'Ответы\\')\\nhome = clean_metric(home, \\'Просмотры\\')\\n\\n# C. \"Старт 4RRUM\" is an action panel, not a content feed.\\n# Remove the generic \"Смотреть все\" header link from this panel.\\nstart_title_matches = list(re.finditer(\\n    r\\'title\\\\s*=\\\\s*([\"\\\\\\'])Старт 4RRUM\\\\1\\',\\n    home,\\n))\\nif len(start_title_matches) != 1:\\n    raise SystemExit(\\n        \\'Expected exactly one Старт 4RRUM HomePanel, \\'\\n        f\\'found {len(start_title_matches)}.\\'\\n    )\\n\\nstart_title = start_title_matches[0]\\nstart_open = home.rfind(\\'<HomePanel\\', 0, start_title.start())\\nif start_open < 0:\\n    raise SystemExit(\\'Старт 4RRUM HomePanel opening tag not found.\\')\\n\\nstart_open_end = opening_tag_end(home, start_open)\\nopening = home[start_open:start_open_end + 1]\\n\\nopening, href_count = re.subn(\\n    r\\'\\\\s+href\\\\s*=\\\\s*([\"\\\\\\'])[^\"\\\\\\']*\\\\1\\',\\n    \\'\\',\\n    opening,\\n    count=1,\\n)\\nif \\'href=\\' in opening:\\n    raise SystemExit(\\n        \\'Старт 4RRUM has a non-literal href; refusing unsafe\
        \ rewrite.\\'\\n    )\\n\\nhome = home[:start_open] + opening + home[start_open_end + 1:]\\n\\n# D. Marker.\\nexport_anchor = \\'export function HomeDashboard({\\'\\nif home.count(export_anchor) != 1:\\n    raise SystemExit(\\'Unexpected HomeDashboard export count.\\')\\n\\nhome = home.replace(\\n    export_anchor,\\n    \\'// 4RRUM_HOME_09_POLISH\\\\n\\' + export_anchor,\\n    1,\\n)\\n\\nhome = \\'\\\\n\\'.join(\\n    line.rstrip(\\' \\\\t\\')\\n    for line in home.splitlines()\\n).rstrip() + \\'\\\\n\\'\\n\\nHOME.write_text(home, encoding=\\'utf-8\\')\\nprint(\\'Главная — 09 patch applied.\\')\\n', encoding='utf-8')\nPath('/tmp/home-09.css').write_text('/* 4RRUM_HOME_09_POLISH */\\n\\n/* Discussed-topic metrics: one clean numeric grid. */\\n.forrum-home-v16__discussed-head,\\n.forrum-home-v16__topic-stats {\\n  grid-template-columns: 58px 68px 84px !important;\\n  column-gap: 8px !important;\\n  justify-content: end !important;\\n}\\n\\n.forrum-home-v16__discussed-head {\\n  padding: 6px 13px 6px 0 !important;\\n  color: var(--muted) !important;\\n  font-size: 10.5px !important;\\n  font-weight: 600 !important;\\n  line-height: 1.15 !important;\\n  text-align: right !important;\\\
        n}\\n\\n.forrum-home-v16__topic-stats {\\n  min-width: 226px !important;\\n}\\n\\n.forrum-home-v16__topic-stat {\\n  min-width: 0 !important;\\n  font-size: 10.75px !important;\\n  font-weight: 500 !important;\\n  line-height: 1.2 !important;\\n  text-align: right !important;\\n}\\n\\n.forrum-home-v16__topic-stat > [aria-hidden=\"true\"] {\\n  display: none !important;\\n}\\n\\n.forrum-home-v16__topic-time {\\n  min-width: 0 !important;\\n  font-size: 10.25px !important;\\n  line-height: 1.2 !important;\\n  text-align: right !important;\\n}\\n\\n/* New topics must not read like footnotes. */\\n.forrum-home-v16__new-topic-title {\\n  font-size: 11.75px !important;\\n  line-height: 1.3 !important;\\n}\\n\\n.forrum-home-v16__new-topic-section,\\n.forrum-home-v16__new-topic-author,\\n.forrum-home-v16__new-topic-number,\\n.forrum-home-v16__new-topic-last {\\n  font-size: 10.5px !important;\\n  line-height: 1.25 !important;\\n}\\n\\n/* Secondary text stays secondary, but readable in graphite. */\\nhtml.dark .forrum-home-v16__topic-excerpt,\\nhtml.dark .forrum-home-v16__topic-meta,\\nhtml.dark .forrum-home-v16__topic-time,\\nhtml.dark .forrum-home-v16__new-topic-section,\\nhtml.dark\
        \ .forrum-home-v16__new-topic-author,\\nhtml.dark .forrum-home-v16__new-topic-last,\\nhtml.dark .forrum-home-v16__rail small,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__topic-excerpt,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__topic-meta,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__topic-time,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__new-topic-section,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__new-topic-author,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__new-topic-last,\\nhtml[data-forrum-theme=\"graphite\"] .forrum-home-v16__rail small {\\n  color: #a7b1bb !important;\\n}\\n\\n@media (max-width: 1280px) and (min-width: 961px) {\\n  .forrum-home-v16__discussed-head,\\n  .forrum-home-v16__topic-stats {\\n    grid-template-columns: 50px 60px 76px !important;\\n    column-gap: 6px !important;\\n  }\\n\\n  .forrum-home-v16__topic-stats {\\n    min-width: 198px !important;\\n  }\\n}\\n', encoding='utf-8')\nPY\n\npython3 -m py_compile /tmp/home-09.py\npython3 -S /tmp/home-09.py\ncat /tmp/home-09.css >> apps/web/app/globals.css\n\npython3 - <<'PY'\nfrom pathlib import Path\nfor rel in [\n    'apps/web/app/globals.css',\n\
        \    'apps/web/components/home-dashboard.tsx',\n]:\n    p = Path(rel)\n    text = p.read_text(encoding='utf-8')\n    p.write_text(\n        '\\n'.join(\n            line.rstrip(' \\t')\n            for line in text.splitlines()\n        ).rstrip() + '\\n',\n        encoding='utf-8',\n    )\nPY\n\ngit diff --check\n"
    - name: 09. GREEN
      shell: bash
      run: 'set -euo pipefail

        node /tmp/home-09-check.mjs

        echo "GREEN: PASS"

        '
    - name: 10. Scope
      shell: bash
      run: "set -euo pipefail\nchanged=\"$(\n  {\n    git diff --name-only\n    git ls-files --others --exclude-standard |\n      awk '!/(^|\\/)(node_modules|\\.next|dist|coverage|\\.turbo)(\\/|$)/'\n  } | sort -u\n)\"\nexpected=\"$(\n  printf '%s\\n' \\\n    apps/web/app/globals.css \\\n    apps/web/components/home-dashboard.tsx |\n  sort\n)\"\n\nprintf 'Changed:\\n%s\\n' \"$changed\"\ntest \"$changed\" = \"$expected\"\n\ntest -z \"$(\n  git diff --name-only -- \\\n    apps/api \\\n    packages/contracts \\\n    apps/web/components/site-header.tsx \\\n    apps/web/components/main-nav.tsx \\\n    apps/web/components/theme-toggle.tsx \\\n    apps/web/components/auth-actions.tsx \\\n    apps/web/components/header-search.tsx\n)\"\n\ngit diff --check\necho \"Scope: PASS\"\n"
    - name: 11. Stage
      shell: bash
      run: "set -euo pipefail\ngit add -- \\\n  apps/web/app/globals.css \\\n  apps/web/components/home-dashboard.tsx\ngit diff --cached --check\n"
    - name: 12. Prisma
      shell: bash
      run: 'set -euo pipefail

        npm run db:validate

        npm run db:generate

        '
      env:
        DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
    - name: 13. UX
      shell: bash
      run: 'set -euo pipefail

        node /tmp/home-09-check.mjs

        npm run validate:static

        npm run validate:ux

        npm run validate:a11y

        '
    - name: 14. Тесты
      shell: bash
      run: 'set -euo pipefail

        npm test -w @forrum/contracts --if-present

        npm test -w @forrum/api --if-present

        npm test -w @forrum/web --if-present

        '
    - name: 15. Typecheck
      shell: bash
      run: 'set -euo pipefail

        npm run typecheck

        '
    - name: 16. Build
      shell: bash
      run: 'set -euo pipefail

        rm -rf apps/web/.next

        npm run build

        '
    - name: 17. Аудит
      shell: bash
      run: 'set -euo pipefail

        node /tmp/home-09-check.mjs


        grep -Fq ''4RRUM_HOME_V4'' apps/web/components/home-dashboard.tsx

        grep -Fq ''4RRUM_HOME_09_POLISH'' apps/web/components/home-dashboard.tsx

        grep -Fq ''4RRUM_HOME_09_POLISH'' apps/web/app/globals.css

        grep -Fq "useState<" apps/web/components/home-dashboard.tsx

        grep -Fq "''activity''" apps/web/components/home-dashboard.tsx

        grep -Fq ''Старт 4RRUM'' apps/web/components/home-dashboard.tsx


        test -z "$(git diff --cached --name-only -- apps/api packages/contracts)"


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y

        npm run typecheck

        rm -rf apps/web/.next

        npm run build


        echo "Аудит Главная — 09: PASS"

        '
    - name: 18. Cleanup
      shell: bash
      run: "set -euo pipefail\nrm -rf node_modules apps/web/.next apps/api/dist packages/contracts/dist coverage .turbo\ngit restore --worktree -- .\ngit clean -ffdx\n\ngit rm .github/workflows/home-09.yml\ngit diff --cached --check\n\nstaged=\"$(git diff --cached --name-only | sort)\"\nexpected=\"$(\n  printf '%s\\n' \\\n    .github/workflows/home-09.yml \\\n    apps/web/app/globals.css \\\n    apps/web/components/home-dashboard.tsx |\n  sort\n)\"\n\nprintf 'Final staged:\\n%s\\n' \"$staged\"\ntest \"$staged\" = \"$expected\"\n"
    - name: 19. Commit
      shell: bash
      run: 'set -euo pipefail

        git config user.name "4RRUM updater"

        git config user.email "actions@users.noreply.github.com"

        git commit -m "Polish 4RRUM home page 09"

        '
    - name: 20. Push
      shell: bash
      run: "set -euo pipefail\ngit fetch origin main\nif [ \"$(git rev-parse origin/main)\" != \"$BASE_SHA\" ]; then\n  echo \"::error::main изменился во время проверки. Запусти Главная — 09 ещё раз.\"\n  exit 1\nfi\ngit push origin HEAD:main\n"
      env:
        BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
    - name: 21. Verify
      shell: bash
      run: "set -euo pipefail\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\n\ngit show origin/main:apps/web/components/home-dashboard.tsx |\n  grep -Fq '4RRUM_HOME_09_POLISH'\n\ngit show origin/main:apps/web/app/globals.css |\n  grep -Fq '4RRUM_HOME_09_POLISH'\n\nnode /tmp/home-09-check.mjs\n\nif git cat-file -e origin/main:.github/workflows/home-09.yml 2>/dev/null; then\n  echo \"::error::Одноразовый workflow не удалился.\"\n  exit 1\nfi\n\necho \"Главная — 09 опубликована.\"\n"
