          FORRUM_V22_SOCIAL_PAYLOAD

          tar -tzf "$payload_archive" > "$payload_manifest"
          mapfile -t payload_paths < "$payload_manifest"

          if [ "${#payload_paths[@]}" -ne 17 ]; then
            echo "::error::Expected 17 payload files, got ${#payload_paths[@]}."
            exit 1
          fi

          for payload_path in "${payload_paths[@]}"; do
            case "$payload_path" in
              ''|/*|../*|*/../*|*/..)
                echo "::error::Unsafe payload path: $payload_path"
                exit 1
                ;;
            esac
          done

          tar -xzf "$payload_archive" --no-same-owner --no-same-permissions

          shopt -s nullglob
          bootstrap_paths=(
            .github/workflows/FORRUM_HOME_V21_PATCH*.yml
            .github/workflows/FORRUM_HOME_V22_SOCIAL_PATCH_02*.yml
          )

          for bootstrap_path in "${bootstrap_paths[@]}"; do
            if git ls-files --error-unmatch "$bootstrap_path" >/dev/null 2>&1; then
              git rm -f -- "$bootstrap_path"
            fi
          done

          for payload_path in "${payload_paths[@]}"; do
            test -f "$payload_path"
          done

          grep -Fq 'data-home-reference="v22"' apps/web/components/home-dashboard.tsx
          grep -Fq "import './home-v22.css';" apps/web/app/layout.tsx
          grep -Fq 'Создано на 4RRUM · Обсудить' apps/api/src/telegram/telegram-message.ts

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify behavior and source contracts
        shell: bash
        run: |
          set -euo pipefail

          npm run test:pure
          node --experimental-strip-types \
            --experimental-loader ./scripts/local-ts-loader.mjs \
            --test apps/web/test/home-model.test.ts
          node scripts/home-v20-check.mjs
          node scripts/home-v22-check.mjs
          npm run validate:static

      - name: Verify types, build, UX and accessibility
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail

          npm run typecheck
          npm run build
          npm run validate:ux
          npm run validate:a11y

      - name: Commit and push only the verified V22 branch
        shell: bash
        run: |
          set -euo pipefail

          payload_manifest="$RUNNER_TEMP/forrum-home-v22-social-patch-02-files.txt"
          mapfile -t payload_paths < "$payload_manifest"

          git restore --worktree --staged -- \
            apps/api/src/generated/prisma \
            apps/api/dist \
            apps/web/.next \
            packages/contracts/dist \
            apps/web/tsconfig.tsbuildinfo 2>/dev/null || true

          git clean -fd -- \
            apps/api/src/generated/prisma \
            apps/api/dist \
            apps/web/.next \
            packages/contracts/dist

          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- "${payload_paths[@]}"
          git add -u -- .github/workflows
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::The verified V22 payload produced no commit."
            exit 1
          fi

          if [ "$(git branch --show-current)" != "$TARGET_BRANCH" ]; then
            echo "::error::Refusing to push from the wrong branch."
            exit 1
          fi

          git commit -m "feat(home): add social depth layer v22"
          git push --set-upstream origin "$TARGET_BRANCH"

      - name: Open pull request into main
        shell: bash
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/forrum-home-v22-social-pr.md"
          cat > "$body_file" <<'FORRUM_V22_PR_BODY'
          ## FORRUM Home V22

          - locks the desktop homepage viewport while keeping each long column independently scrollable;
          - replaces folder-tree visuals with recognizable community marks and preserved hierarchy;
          - adds the social composer, Hot/New/My feed tabs, reactions and Telegram sharing to popular topics;
          - fills empty Media, Services and weekly ranking states with isolated beta examples;
          - filters test garbage from live activity and removes repetitive low-value topic statuses;
          - replaces hard line frames with layered surfaces, soft perimeter shading and accessible focus states;
          - changes Telegram attribution to “Создано на 4RRUM · Обсудить →”;
          - includes model, Telegram, layout-contract, type, build, UX and accessibility checks.
          FORRUM_V22_PR_BODY

          pr_url="$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$TARGET_BRANCH" \
            --title "Главная: социальная глубина V22" \
            --body-file "$body_file")"

          test -n "$pr_url"
          echo "Created PR: $pr_url"
          {
            echo "## FORRUM Home V22"
            echo
            echo "- Branch: `$TARGET_BRANCH`"
            echo "- Base: `main`"
            echo "- Pull request: $pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

