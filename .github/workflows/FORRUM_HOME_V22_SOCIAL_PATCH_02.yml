name: FORRUM Home V22 Social Patch 02

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forrum-home-v22-social-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: codex/home-v22-social-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout fresh main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V21 baseline and create unique V22 branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --prune

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Checkout is not the current origin/main."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Fresh main checkout is unexpectedly dirty."
            git status --short
            exit 1
          fi

          test -f apps/web/app/home-v21.css
          test -f apps/web/components/home-dashboard.tsx
          test -f scripts/home-v20-check.mjs
          grep -Fq 'forrum-home-v21' apps/web/components/home-dashboard.tsx
          grep -Fq "import './home-v21.css';" apps/web/app/layout.tsx

          if test -e apps/web/app/home-v22.css ||
             grep -Fq 'data-home-reference="v22"' apps/web/components/home-dashboard.tsx; then
            echo "::error::V22 is already present on main. Nothing was changed."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "::error::Remote branch $TARGET_BRANCH already exists."
            exit 1
          fi

          git switch -c "$TARGET_BRANCH"

      - name: Apply verified V22 payload
        shell: bash
        run: |
          set -euo pipefail

          payload_archive="$RUNNER_TEMP/forrum-home-v22-social-patch-02.tar.gz"
          payload_manifest="$RUNNER_TEMP/forrum-home-v22-social-patch-02-files.txt"

