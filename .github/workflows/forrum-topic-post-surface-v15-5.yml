name: FORRUM Topic Post Surface V15.5
run-name: FORRUM Topic Post Surface V15.5

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-topic-post-surface-v15-5
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  topic-post-surface-v15-5:
    name: Topic Post Surface V15.5
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify successful V15.4 baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'FORRUM_TOPIC_PAGE_FRAME_V15_4'             "apps/web/app/p/[slug]/publication-client.tsx"
          grep -Fq 'FORRUM_TOPIC_TREE_FRAME_V15_4'             apps/web/components/topic-category-tree.tsx
          grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12'             "apps/web/app/communities/[slug]/category-page.tsx"

          node scripts/topic-page-frame-v15-4-check.mjs
          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs

          test -z "$(git status --porcelain)"

      - name: Apply Topic Post Surface V15.5
        shell: bash
        env:
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          printf '\n%s\n' "$(printf '%s' "$CSS_B64" | base64 -d)"             >> apps/web/app/globals.css

          printf '%s' "$CHECK_B64" | base64 -d             > scripts/topic-post-surface-v15-5-check.mjs

          printf '%s' "$DOC_B64" | base64 -d             > docs/FORRUM_TOPIC_POST_SURFACE_V15_5.md

      - name: Verify V15.5 source and protected scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/topic-post-surface-v15-5-check.mjs
          node scripts/topic-page-frame-v15-4-check.mjs
          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          allowed='^(apps/web/app/globals\.css|scripts/topic-post-surface-v15-5-check\.mjs|docs/FORRUM_TOPIC_POST_SURFACE_V15_5\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff --             "apps/web/app/p/[slug]/publication-client.tsx"             "apps/web/app/communities/[slug]/category-page.tsx"             apps/web/components/topic-category-tree.tsx             apps/web/app/communities/communities-client.tsx             apps/web/components/main-nav.tsx             apps/web/components/site-header.tsx             apps/web/components/site-footer.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/page.tsx             apps/api/src             apps/api/prisma | grep -q .; then
            echo 'V15.5 changed protected source unexpectedly.'
            exit 1
          fi

      - name: Create isolated verified V15.5 commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add --             apps/web/app/globals.css             scripts/topic-post-surface-v15-5-check.mjs             docs/FORRUM_TOPIC_POST_SURFACE_V15_5.md

          git commit -m "Polish TopicPage post surface V15.5"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/topic-post-surface-v15-5-check.mjs
          node scripts/topic-page-frame-v15-4-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Topic Post Surface V15.5
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/app/globals.css             | grep -Fq 'FORRUM_TOPIC_POST_SURFACE_V15_5'
          git show             'origin/main:apps/web/app/p/[slug]/publication-client.tsx'             | grep -Fq 'FORRUM_TOPIC_PAGE_FRAME_V15_4'
          git show             'origin/main:apps/web/app/communities/[slug]/category-page.tsx'             | grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12'

          node scripts/topic-post-surface-v15-5-check.mjs

          echo 'FORRUM Topic Post Surface V15.5 remote verification passed.'
