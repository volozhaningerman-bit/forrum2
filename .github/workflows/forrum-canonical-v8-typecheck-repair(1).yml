name: FORRUM Canonical V8 Typecheck Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-canonical-interface-repair
  cancel-in-progress: false

jobs:
  repair-canonical-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Patch V8 type compatibility safely
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          canonical = Path(
              ".github/workflows/forrum-canonical-interface-v8.yml"
          )
          repair = Path(
              ".github/workflows/forrum-canonical-v8-typecheck-repair.yml"
          )

          if not canonical.exists():
              raise RuntimeError(
                  "Missing .github/workflows/"
                  "forrum-canonical-interface-v8.yml"
              )

          source = canonical.read_text(encoding="utf-8")
          step_name = (
              "    - name: Preserve V8 feed ranking compatibility\n"
          )
          anchor = "    - name: Typecheck every workspace\n"

          compatibility_step = indent(dedent(r'''
          - name: Preserve V8 feed ranking compatibility
            shell: bash
            run: |
              set -euo pipefail

              python3 <<'PY'
              from pathlib import Path

              path = Path("apps/api/src/feed/ranking.ts")
              if not path.exists():
                  raise RuntimeError(
                      "Missing apps/api/src/feed/ranking.ts"
                  )

              text = path.read_text(encoding="utf-8")
              required_field = "  recentCommentCount: number;"
              optional_field = "  recentCommentCount?: number;"
              compatibility_marker = (
                  "// FORRUM_FEED_RANKING_COMPAT_V8"
              )
              fallback_line = (
                  "  const recentCommentCount = "
                  "input.recentCommentCount ?? 0; "
                  + compatibility_marker
                  + "\n"
              )

              if compatibility_marker not in text:
                  if required_field in text:
                      text = text.replace(
                          required_field,
                          optional_field,
                          1,
                      )
                  elif optional_field not in text:
                      raise RuntimeError(
                          "recentCommentCount field was not found "
                          "in FeedScoreInput"
                      )

                  usage_count = text.count(
                      "input.recentCommentCount"
                  )
                  if usage_count < 3:
                      raise RuntimeError(
                          "Expected at least three V8 ranking usages "
                          "of input.recentCommentCount; got "
                          f"{usage_count}"
                      )

                  text = text.replace(
                      "input.recentCommentCount",
                      "recentCommentCount",
                  )

                  function_anchor = "): FeedScoreResult {\n"
                  if text.count(function_anchor) != 1:
                      raise RuntimeError(
                          "Could not identify calculateFeedScore body"
                      )

                  text = text.replace(
                      function_anchor,
                      function_anchor + fallback_line,
                      1,
                  )

                  path.write_text(text, encoding="utf-8")

              final = path.read_text(encoding="utf-8")
              required_markers = [
                  optional_field,
                  compatibility_marker,
                  "recentCommentCount * 160",
                  "recentCommentCount >= 2",
                  "recentCommentCount >= 3",
              ]

              missing = [
                  marker
                  for marker in required_markers
                  if marker not in final
              ]
              if missing:
                  raise RuntimeError(
                      "Feed ranking compatibility verification "
                      "failed; missing: " + ", ".join(missing)
                  )

              if final.count("input.recentCommentCount") != 1:
                  raise RuntimeError(
                      "Only the fallback declaration may read "
                      "input.recentCommentCount directly"
                  )

              print(
                  "V8 feed ranking accepts omitted historical "
                  "test input as zero without changing live API data."
              )
              PY

              grep -q "recentCommentCount?: number" \
                apps/api/src/feed/ranking.ts
              grep -q "FORRUM_FEED_RANKING_COMPAT_V8" \
                apps/api/src/feed/ranking.ts
              grep -q "recentCommentCount \* 160" \
                apps/api/src/feed/ranking.ts
          '''), "    ")

          if step_name not in source:
              if source.count(anchor) != 1:
                  raise RuntimeError(
                      "Expected exactly one Typecheck every workspace "
                      "step in canonical V8"
                  )

              source = source.replace(
                  anchor,
                  compatibility_step + anchor,
                  1,
              )
              canonical.write_text(source, encoding="utf-8")

          final = canonical.read_text(encoding="utf-8")
          required = [
              "Preserve V8 feed ranking compatibility",
              "FORRUM_FEED_RANKING_COMPAT_V8",
              "recentCommentCount?: number;",
              "recentCommentCount * 160",
              "Typecheck every workspace",
          ]
          missing = [item for item in required if item not in final]
          if missing:
              raise RuntimeError(
                  "Canonical V8 repair is incomplete; missing: "
                  + ", ".join(missing)
              )

          # The temporary repair workflow removes itself after it has
          # safely updated the canonical workflow in main.
          if repair.exists():
              repair.unlink()

          print("Canonical V8 workflow patched and repair file removed.")
          PY

          git diff --check
          git status --short

      - name: Commit repaired canonical V8
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add \
            .github/workflows/forrum-canonical-interface-v8.yml
          git add -u .github/workflows

          if git diff --cached --quiet; then
            echo "Canonical V8 typecheck repair is already present."
          else
            git commit -m \
              "Repair V8 feed ranking type compatibility"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify repaired workflow in remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git show \
            origin/main:.github/workflows/forrum-canonical-interface-v8.yml \
            | grep -q "Preserve V8 feed ranking compatibility"

          git show \
            origin/main:.github/workflows/forrum-canonical-interface-v8.yml \
            | grep -q "FORRUM_FEED_RANKING_COMPAT_V8"

          if git cat-file -e \
            origin/main:.github/workflows/forrum-canonical-v8-typecheck-repair.yml \
            2>/dev/null; then
            echo "Temporary repair workflow still exists in remote main."
            exit 1
          fi

          echo "Canonical V8 repair is present in origin/main."
