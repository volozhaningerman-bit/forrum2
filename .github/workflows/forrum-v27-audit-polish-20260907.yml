      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and generate Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run db:generate
          npm run build -w @forrum/contracts
      - name: Verify code and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run typecheck
          npm test
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
      - name: Browser verification
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:home
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forrum-v27-browser-check
          path: test-results/home-reference/
          if-no-files-found: ignore
      - name: Commit and push only verified V27 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "feat(home): polish homepage typography navigation and previews"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            printf '%s\n' '## FORRUM V27 ready for review'
            printf '%s\n' "Branch: $TARGET_BRANCH"
            printf '%s\n' "Compare and create PR: https://github.com/$GITHUB_REPOSITORY/compare/main...$TARGET_BRANCH?expand=1"
            printf '%s\n' 'The branch has not been merged or deployed by this patch.'
          } >> "$GITHUB_STEP_SUMMARY"
