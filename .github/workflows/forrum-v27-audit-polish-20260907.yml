              name = entry['path']
              path = Path(name)
              parts = PurePosixPath(name).parts
              if not parts or name.startswith('/') or '..' in parts or '.git' in parts:
                  raise SystemExit('Unsafe patch path: ' + name)
              if path.is_symlink() or any(parent.is_symlink() for parent in path.parents):
                  raise SystemExit('Symlink patch path: ' + name)
              if entry['old'] is None:
                  valid = not path.exists()
              else:
                  data = path.read_bytes() if path.is_file() else None
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() if data is not None else None
                  valid = actual == entry['old']
              if not valid:
                  conflicts.append(name)
          if conflicts:
              raise SystemExit('Source files changed; no files written:\n' + '\n'.join(conflicts))
          if os.environ.get('FORRUM_PATCH_CHECK_ONLY') == '1':
              print('Baseline verified:', len(entries), 'paths; no files changed.')
          else:
              parents = set()
              for entry in entries:
                  path = Path(entry['path'])
                  if entry['delete']:
                      path.unlink()
                      parents.update(parent for parent in path.parents if str(parent) != '.')
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(archive.read('files/' + entry['path']))
              for parent in sorted(parents, key=lambda p: len(p.parts), reverse=True):
                  try:
                      parent.rmdir()
                  except OSError:
                      pass
              print('Applied:', sum(not e['delete'] for e in entries), 'written;', sum(e['delete'] for e in entries), 'removed.')
