name: Главная — 19.0 FIX
run-name: Главная — 19.0 FIX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-19-0-fix
  cancel-in-progress: false

jobs:
  home-19-0-fix:
    name: Главная — 19.0 FIX
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: 01. Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 02. Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 03. Проверить V18.2 и сделать backup
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          test -f package.json
          test -f scripts/local-ts-loader.mjs

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$path изменился после подготовки V19.0. Нужен workflow для актуального main."
              exit 1
            fi
          }

          check_blob apps/api/src/home/home.service.ts a4a65cfda12736f3efc325a8408596685ed4f74f
          check_blob apps/web/app/globals.css fb36b6f17ca830c401ccf7ccd12fc7f3b009e4e1
          check_blob apps/web/app/page.tsx e28fd333323d954084301150ce40c357f14b2e5b
          check_blob apps/web/components/home-dashboard.tsx d95078c3411bcaaba8b1ec7821879bce6f62ee95
          check_blob apps/web/components/site-footer.tsx 4ef01e06d03cda0bfc8abb3ab2466b55651cf673
          check_blob apps/web/components/site-header.tsx 350f32314e595e655cb80314a272846e2c54cd43
          check_blob scripts/local-ts-loader.mjs 6678f397123b3634e212aac83f03e3309b344c90

          test ! -e 'apps/api/src/home/ranking.ts' || { echo "::error::Target already exists: apps/api/src/home/ranking.ts"; exit 1; }
          test ! -e 'apps/api/test/home-ranking.test.ts' || { echo "::error::Target already exists: apps/api/test/home-ranking.test.ts"; exit 1; }
          test ! -e 'apps/web/components/home/community-tree.tsx' || { echo "::error::Target already exists: apps/web/components/home/community-tree.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/discovery-panels.tsx' || { echo "::error::Target already exists: apps/web/components/home/discovery-panels.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/forrum-news-panel.tsx' || { echo "::error::Target already exists: apps/web/components/home/forrum-news-panel.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/home-panel.tsx' || { echo "::error::Target already exists: apps/web/components/home/home-panel.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/model.ts' || { echo "::error::Target already exists: apps/web/components/home/model.ts"; exit 1; }
          test ! -e 'apps/web/components/home/polls-panel.tsx' || { echo "::error::Target already exists: apps/web/components/home/polls-panel.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/popular-topics-panel.tsx' || { echo "::error::Target already exists: apps/web/components/home/popular-topics-panel.tsx"; exit 1; }
          test ! -e 'apps/web/components/home/types.ts' || { echo "::error::Target already exists: apps/web/components/home/types.ts"; exit 1; }
          test ! -e 'apps/web/components/home/utils.ts' || { echo "::error::Target already exists: apps/web/components/home/utils.ts"; exit 1; }
          test ! -e 'apps/web/components/home/weekly-members-panel.tsx' || { echo "::error::Target already exists: apps/web/components/home/weekly-members-panel.tsx"; exit 1; }
          test ! -e 'apps/web/test/home-model.test.ts' || { echo "::error::Target already exists: apps/web/test/home-model.test.ts"; exit 1; }
          test ! -e 'scripts/home-v19-0-check.mjs' || { echo "::error::Target already exists: scripts/home-v19-0-check.mjs"; exit 1; }

          grep -Fq '4RRUM HOME 18.2: brand and discussion footer' apps/web/app/globals.css
          if grep -Fq '4RRUM HOME 19.0: live internet newsroom' apps/web/app/globals.css; then
            echo "::error::HOME UI 19.0 уже применён либо применён частично."
            exit 1
          fi

          backup_dir="$RUNNER_TEMP/forrum-home-19-0-backup"
          mkdir -p "$backup_dir/apps/api/src/home"
          mkdir -p "$backup_dir/apps/web/app"
          mkdir -p "$backup_dir/apps/web/components"
          mkdir -p "$backup_dir/scripts"
          cp apps/api/src/home/home.service.ts "$backup_dir/apps/api/src/home/home.service.ts"
          cp apps/web/app/globals.css "$backup_dir/apps/web/app/globals.css"
          cp apps/web/app/page.tsx "$backup_dir/apps/web/app/page.tsx"
          cp apps/web/components/home-dashboard.tsx "$backup_dir/apps/web/components/home-dashboard.tsx"
          cp apps/web/components/site-footer.tsx "$backup_dir/apps/web/components/site-footer.tsx"
          cp apps/web/components/site-header.tsx "$backup_dir/apps/web/components/site-header.tsx"
          cp scripts/local-ts-loader.mjs "$backup_dir/scripts/local-ts-loader.mjs"
          sha256sum "$backup_dir"/apps/api/src/home/home.service.ts
          sha256sum "$backup_dir"/apps/web/app/{globals.css,page.tsx}
          sha256sum "$backup_dir"/apps/web/components/{home-dashboard.tsx,site-footer.tsx,site-header.tsx}
          sha256sum "$backup_dir"/scripts/local-ts-loader.mjs

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 04. Применить HOME UI 19.0
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          payloads = {
              'apps/api/src/home/home.service.ts': '',
              'apps/api/src/home/ranking.ts': '',
              'apps/api/test/home-ranking.test.ts': '',
              'apps/web/app/page.tsx': '',
              'apps/web/components/home-dashboard.tsx': '',
              'apps/web/components/home/community-tree.tsx': '',
              'apps/web/components/home/discovery-panels.tsx': '',
              'apps/web/components/home/forrum-news-panel.tsx': '',
              'apps/web/components/home/home-panel.tsx': '',
              'apps/web/components/home/model.ts': '',
              'scripts/local-ts-loader.mjs': '',
              'apps/web/components/home/polls-panel.tsx': '',
              'apps/web/components/home/popular-topics-panel.tsx': '',
              'apps/web/components/home/types.ts': '',
              'apps/web/components/home/utils.ts': '',
              'apps/web/components/home/weekly-members-panel.tsx': '',
              'apps/web/components/site-footer.tsx': '',
              'apps/web/components/site-header.tsx': '',
              'apps/web/test/home-model.test.ts': '',
              'scripts/home-v19-0-check.mjs': '',
          }
          css_payload = ''

          for filename, payload in payloads.items():
              path = Path(filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(b64decode(payload))

          css_path = Path('apps/web/app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          if '4RRUM HOME 19.0: live internet newsroom' in css:
              raise SystemExit('Стили HOME UI 19.0 уже применены.')
          css_block = b64decode(css_payload).decode('utf-8').strip()
          css_path.write_text(
              css.rstrip() + '\n\n' + css_block + '\n',
              encoding='utf-8',
          )
          PY

      - name: 05. Проверить контракт V19.0
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-v19-0-check.mjs
          node --experimental-strip-types \
            --experimental-loader ./scripts/local-ts-loader.mjs \
            --test \
            apps/api/test/home-ranking.test.ts \
            apps/web/test/home-model.test.ts

          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            apps/api/src/home/home.service.ts \
            apps/api/src/home/ranking.ts \
            apps/api/test/home-ranking.test.ts \
            apps/web/app/globals.css \
            apps/web/app/page.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/home/community-tree.tsx \
            apps/web/components/home/discovery-panels.tsx \
            apps/web/components/home/forrum-news-panel.tsx \
            apps/web/components/home/home-panel.tsx \
            apps/web/components/home/model.ts \
            apps/web/components/home/polls-panel.tsx \
            apps/web/components/home/popular-topics-panel.tsx \
            apps/web/components/home/types.ts \
            apps/web/components/home/utils.ts \
            apps/web/components/home/weekly-members-panel.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/site-header.tsx \
            apps/web/test/home-model.test.ts \
            scripts/home-v19-0-check.mjs \
            scripts/local-ts-loader.mjs)"

          printf 'Изменённые файлы:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check

      - name: 06. Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: 07. Обновить Prisma Client
        shell: bash
        env:
          DATABASE_URL: 'postgresql://forrum:forrum@127.0.0.1:5432/forrum'
        run: |
          set -euo pipefail

          npm run db:generate
          test -d apps/api/src/generated/prisma
          grep -Rqs 'MediaPartnerStatus' apps/api/src/generated/prisma
          grep -Rqs 'ReviewModerationStatus' apps/api/src/generated/prisma
          grep -Rqs 'showFavorites' apps/api/src/generated/prisma

      - name: 08. Тесты API
        shell: bash
        run: |
          set -euo pipefail
          npm run test -w @forrum/api

      - name: 09. Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: 10. Build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build

      - name: 11. Stage и аудит
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/api/src/home/home.service.ts \
            apps/api/src/home/ranking.ts \
            apps/api/test/home-ranking.test.ts \
            apps/web/app/globals.css \
            apps/web/app/page.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/home/community-tree.tsx \
            apps/web/components/home/discovery-panels.tsx \
            apps/web/components/home/forrum-news-panel.tsx \
            apps/web/components/home/home-panel.tsx \
            apps/web/components/home/model.ts \
            apps/web/components/home/polls-panel.tsx \
            apps/web/components/home/popular-topics-panel.tsx \
            apps/web/components/home/types.ts \
            apps/web/components/home/utils.ts \
            apps/web/components/home/weekly-members-panel.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/site-header.tsx \
            apps/web/test/home-model.test.ts \
            scripts/home-v19-0-check.mjs \
            scripts/local-ts-loader.mjs

          git diff --cached --check
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$(printf '%s\n' \
            apps/api/src/home/home.service.ts \
            apps/api/src/home/ranking.ts \
            apps/api/test/home-ranking.test.ts \
            apps/web/app/globals.css \
            apps/web/app/page.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/home/community-tree.tsx \
            apps/web/components/home/discovery-panels.tsx \
            apps/web/components/home/forrum-news-panel.tsx \
            apps/web/components/home/home-panel.tsx \
            apps/web/components/home/model.ts \
            apps/web/components/home/polls-panel.tsx \
            apps/web/components/home/popular-topics-panel.tsx \
            apps/web/components/home/types.ts \
            apps/web/components/home/utils.ts \
            apps/web/components/home/weekly-members-panel.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/site-header.tsx \
            apps/web/test/home-model.test.ts \
            scripts/home-v19-0-check.mjs \
            scripts/local-ts-loader.mjs)"
          test "$staged" = "$expected"

          node scripts/home-v19-0-check.mjs
          git diff --cached --stat
          git diff --cached -- apps/web/components/home-dashboard.tsx apps/web/components/site-header.tsx | sed -n '1,520p'

      - name: 12. Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Build Home UI 19.0 live internet newsroom"

      - name: 13. Push с защитой от гонки
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main изменился во время проверки. Запустите workflow ещё раз."
            exit 1
          fi
          git push origin HEAD:main

      - name: 14. Проверить опубликованный commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git show origin/main:apps/web/app/globals.css |
            grep -Fq '4RRUM HOME 19.0: live internet newsroom'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'data-home-reference="v19"'
          git show origin/main:apps/web/components/site-header.tsx |
            grep -Fq 'brand-symbol__joint'
          git show origin/main:apps/api/src/home/home.service.ts |
            grep -Fq "rankWeekly([...activity.values()], 'activity')"
          git show origin/main:apps/web/components/home/model.ts >/dev/null
          git show origin/main:apps/api/test/home-ranking.test.ts >/dev/null
          git show origin/main:scripts/local-ts-loader.mjs |
            grep -Fq 'candidate of candidates'

          echo "Главная — 19.0: применена, проверена и отправлена в main."
