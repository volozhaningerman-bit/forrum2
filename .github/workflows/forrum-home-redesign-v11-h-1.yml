name: FORRUM Home Redesign V11.H.1
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-redesign-v11-h-1
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  stage-h-1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved Stage G baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f apps/web/app/rules/page.tsx
          test -f apps/web/app/support/page.tsx
          grep -q 'home-discussed-stage-d' apps/web/components/home-dashboard.tsx
          grep -q 'home-new-topics-stage-e' apps/web/components/home-dashboard.tsx
          grep -q 'home-right-stage-f' apps/web/components/home-dashboard.tsx
          grep -q 'home-participation-stage-f' apps/web/components/home-dashboard.tsx
          grep -q 'home-reference-footer-stage-g' apps/web/components/home-dashboard.tsx
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_G_V11' apps/web/app/globals.css
          test -z "$(git status --porcelain)"

      - name: Apply final homepage polish and global footer Stage H
        shell: bash
        env:
          STAGE_H_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$STAGE_H_PATCH_B64" | base64 -d > /tmp/forrum-stage-h-patch.py
          python3 /tmp/forrum-stage-h-patch.py

      - name: Normalize Stage H whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path

          files = [
              Path('apps/web/components/home-dashboard.tsx'),
              Path('apps/web/app/globals.css'),
              Path('apps/web/app/layout.tsx'),
              Path('apps/web/components/site-footer.tsx'),
              Path('apps/api/prisma/seed.ts'),
              Path('scripts/home-redesign-stage-g-check.mjs'),
              Path('scripts/home-redesign-stage-h-check.mjs'),
              Path('docs/FORRUM_HOME_REDESIGN_STAGE_H_V11.md'),
          ]

          changed = []
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text(encoding='utf-8')
              normalized = '\n'.join(line.rstrip() for line in source.splitlines()) + '\n'
              if normalized != source:
                  path.write_text(normalized, encoding='utf-8')
                  changed.append(str(path))

          if changed:
              print('Trailing whitespace normalized:')
              for path in changed:
                  print(f'  - {path}')
          else:
              print('No trailing whitespace found.')
          PYCODE

          git diff --check

      - name: Verify Stage H.1 scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/home-redesign-stage-g-check.mjs
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/components/home-dashboard\.tsx|apps/web/app/globals\.css|apps/web/app/layout\.tsx|apps/web/components/site-footer\.tsx|apps/api/prisma/seed\.ts|scripts/home-redesign-stage-g-check\.mjs|scripts/home-redesign-stage-h-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_H_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff -- apps/web/components/site-header.tsx apps/web/components/main-nav.tsx apps/web/app/page.tsx apps/api/src apps/api/prisma/schema.prisma | grep -q .; then
            echo 'Stage H altered approved header, page loading, API source or schema unexpectedly.'
            exit 1
          fi

      - name: Create isolated Stage H.1 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add --             apps/web/components/home-dashboard.tsx             apps/web/app/globals.css             apps/web/app/layout.tsx             apps/web/components/site-footer.tsx             apps/api/prisma/seed.ts             scripts/home-redesign-stage-g-check.mjs             scripts/home-redesign-stage-h-check.mjs             docs/FORRUM_HOME_REDESIGN_STAGE_H_V11.md

          if git diff --cached --quiet; then
            echo 'Stage H is already present.'
          else
            git commit -m "Polish FORRUM homepage and add global footer"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Stage H.1 checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/home-redesign-stage-g-check.mjs
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage H.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
