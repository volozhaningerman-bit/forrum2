name: Главная — 18.2
run-name: Главная — 18.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-18-2
  cancel-in-progress: false

jobs:
  home-18-2:
    name: Главная — 18.2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 01. Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 02. Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 03. Проверка V18.1 и backup
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          home_file='apps/web/components/home-dashboard.tsx'
          header_file='apps/web/components/site-header.tsx'
          css_file='apps/web/app/globals.css'
          test -f "$home_file"
          test -f "$header_file"
          test -f "$css_file"
          test -f package.json

          expected_home_blob='eca521f493fdfe96c1e72624cb6e22761e00c3e9'
          expected_header_blob='0fe02d4ccd6290f1a0727ce5a7e60976ce5f25ba'
          expected_css_blob='8fdefd879b0d585030e08972e0e7e255f93b1c7c'

          test "$(git hash-object "$home_file")" = "$expected_home_blob" || {
            echo "::error::Главная изменилась после V18.1. Нужен workflow для актуального main."
            exit 1
          }
          test "$(git hash-object "$header_file")" = "$expected_header_blob" || {
            echo "::error::Шапка изменилась после подготовки V18.2. Нужен workflow для актуального main."
            exit 1
          }
          test "$(git hash-object "$css_file")" = "$expected_css_blob" || {
            echo "::error::Стили изменились после подготовки V18.2. Нужен workflow для актуального main."
            exit 1
          }

          grep -Fq '4RRUM HOME 18.1: theme contrast and live media' "$css_file"
          if grep -Fq '4RRUM HOME 18.2: brand and discussion footer' "$css_file"; then
            echo "::error::HOME UI 18.2 уже применён либо применён частично."
            exit 1
          fi

          backup_dir="$RUNNER_TEMP/forrum-home-18-2-backup"
          mkdir -p "$backup_dir/apps/web/components" "$backup_dir/apps/web/app"
          cp "$home_file" "$backup_dir/apps/web/components/home-dashboard.tsx"
          cp "$header_file" "$backup_dir/apps/web/components/site-header.tsx"
          cp "$css_file" "$backup_dir/apps/web/app/globals.css"
          sha256sum \
            "$backup_dir/apps/web/components/home-dashboard.tsx" \
            "$backup_dir/apps/web/components/site-header.tsx" \
            "$backup_dir/apps/web/app/globals.css"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 04. Применить HOME UI 18.2
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          home_path = Path('apps/web/components/home-dashboard.tsx')
          header_path = Path('apps/web/components/site-header.tsx')
          css_path = Path('apps/web/app/globals.css')
          css = css_path.read_text(encoding='utf-8')

          home_payload = ''
          header_payload = ''
          css_payload = ''

          if '4RRUM HOME 18.2: brand and discussion footer' in css:
              raise SystemExit('Стили HOME UI 18.2 уже применены.')

          home_path.write_text(
              b64decode(home_payload).decode('utf-8').rstrip() + '\n',
              encoding='utf-8',
          )
          header_path.write_text(
              b64decode(header_payload).decode('utf-8').rstrip() + '\n',
              encoding='utf-8',
          )
          css_path.write_text(
              css.rstrip() + '\n\n' +
              b64decode(css_payload).decode('utf-8').strip() + '\n',
              encoding='utf-8',
          )
          PY

          git diff --check

      - name: 05. Проверить изменения V18.2
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          home = Path('apps/web/components/home-dashboard.tsx').read_text(encoding='utf-8')
          header = Path('apps/web/components/site-header.tsx').read_text(encoding='utf-8')
          css = Path('apps/web/app/globals.css').read_text(encoding='utf-8')

          home_required = [
              "'Эфиры и новости'",
              "'Сейчас в эфире'",
              'linkLabel="Все темы"',
              'forrum-home-v182__discussed-footer',
              "'Показать ещё'",
              "'Свернуть'",
              'Показано {discussedVisible.length} из {discussedPool.length}',
              'title="Новости 4RRUM"',
              'title="О FORRUM"',
          ]
          header_required = [
              'aria-label="4RRUM"',
              'className="brand-symbol"',
              'className="brand-symbol__back"',
              'className="brand-symbol__front"',
              'className="brand-wordmark"',
              '<strong>4</strong>RRUM',
          ]
          css_required = [
              '4RRUM HOME 18.2: brand and discussion footer',
              '.brand-symbol {',
              '.brand-symbol__back,',
              '.brand-symbol__front {',
              '.brand-wordmark {',
              '.forrum-home-v182__discussed-footer {',
              'var(--fvt-panel-soft)',
          ]

          for value in home_required:
              if value not in home:
                  raise SystemExit(f'Не найден результат V18.2 в TSX: {value}')
          for value in header_required:
              if value not in header:
                  raise SystemExit(f'Не найден новый логотип V18.2: {value}')
          for value in css_required:
              if value not in css:
                  raise SystemExit(f'Не найден стиль V18.2: {value}')

          if 'action={' in home:
              raise SystemExit('Кнопка раскрытия всё ещё находится в заголовке.')
          if '<span className="brand-mark" aria-hidden="true">4</span>' in header:
              raise SystemExit('Старый квадратный логотип не удалён.')
          if css.count('4RRUM HOME 18.2: brand and discussion footer') != 1:
              raise SystemExit('Стили V18.2 добавлены не один раз.')
          PY

          changed="$(git diff --name-only | sort -u)"
          expected="$(printf '%s\n' \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/site-header.tsx | sort -u)"

          printf 'Изменённые файлы:\n%s\n' "$changed"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- apps/api packages/contracts apps/web/app/page.tsx apps/web/components/header-search.tsx)"
          git diff --check

      - name: 06. Установить зависимости
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: 07. Обновить Prisma Client
        shell: bash
        env:
          DATABASE_URL: 'postgresql://forrum:forrum@127.0.0.1:5432/forrum'
        run: |
          set -euo pipefail

          npm run db:generate

          test -d apps/api/src/generated/prisma
          grep -Rqs 'MediaPartnerStatus' apps/api/src/generated/prisma
          grep -Rqs 'ReviewModerationStatus' apps/api/src/generated/prisma
          grep -Rqs 'showFavorites' apps/api/src/generated/prisma

      - name: 08. Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: 09. Build
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm run build

      - name: 10. Stage и аудит
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/site-header.tsx

          git diff --cached --check
          staged="$(git diff --cached --name-only | sort -u)"
          expected="$(printf '%s\n' \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            apps/web/components/site-header.tsx | sort -u)"
          test "$staged" = "$expected"

          git diff --cached --stat
          git diff --cached -- apps/web/components/home-dashboard.tsx apps/web/components/site-header.tsx | sed -n '1,420p'

      - name: 11. Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "4RRUM updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refine Home UI 18.2 branding and topics"

      - name: 12. Push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main изменился во время проверки. Запустите workflow ещё раз."
            exit 1
          fi
          git push origin HEAD:main

      - name: 13. Проверить публикацию commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'Эфиры и новости'
          git show origin/main:apps/web/components/home-dashboard.tsx |
            grep -Fq 'forrum-home-v182__discussed-footer'
          git show origin/main:apps/web/components/site-header.tsx |
            grep -Fq 'className="brand-symbol"'
          git show origin/main:apps/web/app/globals.css |
            grep -Fq '4RRUM HOME 18.2: brand and discussion footer'

          echo "Главная — 18.2: применена, проверена и отправлена в main."
