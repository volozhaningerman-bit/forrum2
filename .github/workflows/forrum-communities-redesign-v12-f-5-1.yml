name: FORRUM Communities Redesign V12.F.5.1
true:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-communities-redesign-v12-f-5-1
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  communities-stage-f-5-1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify approved Communities Stage F.4 baseline
      shell: bash
      run: "set -euo pipefail\n\ngrep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F3_V12_INTERACTION' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12' \\\n  apps/web/app/globals.css\ngrep -q 'communities-v12-row-expand-surface' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'communities-v12-subscribe' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'communities-v12-open-hierarchy' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'communities-v12-hierarchy-child-arrow' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'communities-v12-hierarchy-placeholder' \\\n  apps/web/app/communities/communities-client.tsx\ngrep -q 'Выберите сообщество' \\\n  apps/web/app/communities/communities-client.tsx\ntest -z \"$(git status --porcelain)\"\n"
    - name: Apply Communities Stage F.5.1 interaction fixes
      shell: bash
      env:
        STAGE_F5_PATCH_B64: 
      run: "set -euo pipefail\nprintf '%s' \"$STAGE_F5_PATCH_B64\" \\\n  | base64 -d > /tmp/forrum-communities-stage-f5.py\npython3 /tmp/forrum-communities-stage-f5.py\n"
    - name: Verify Stage F.5.1 source contract and patch scope
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/communities-redesign-stage-a-check.mjs\nnode scripts/communities-redesign-stage-b-check.mjs\nnode scripts/communities-redesign-stage-c-check.mjs\nnode scripts/communities-redesign-stage-d-check.mjs\nnode scripts/communities-redesign-stage-e-check.mjs\nnode scripts/communities-redesign-stage-f-check.mjs\nnode scripts/communities-redesign-stage-f2-check.mjs\nnode scripts/communities-redesign-stage-f3-check.mjs\nnode scripts/communities-redesign-stage-f4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\ngit diff --check\n\nallowed='^(apps/web/app/communities/communities-client\\.tsx|apps/web/app/globals\\.css|scripts/communities-redesign-stage-f5-check\\.mjs|scripts/communities-redesign-stage-e-check\\.mjs)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\nif [ -n \"$unexpected\" ]; then\n  echo \"Unexpected files were changed:\"\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff -- \\\n  apps/web/components/site-header.tsx \\\n  apps/web/components/main-nav.tsx \\\n  apps/web/components/site-footer.tsx \\\n  apps/web/components/home-dashboard.tsx \\\n  apps/web/app/page.tsx \\\n  apps/api/src \\\n  apps/api/prisma | grep -q .; then\n  echo 'Stage F.5 altered approved shared structure, homepage or backend unexpectedly.'\n  exit 1\nfi\n"
    - name: Create isolated Communities Stage F.5.1 commit
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"FORRUM QA updater\"\ngit config user.email \"actions@users.noreply.github.com\"\n\ngit add -- \\\n  apps/web/app/communities/communities-client.tsx \\\n  apps/web/app/globals.css \\\n  scripts/communities-redesign-stage-f5-check.mjs \\\n            scripts/communities-redesign-stage-e-check.mjs\n\ngit commit -m \"Polish Communities initial state and evolve contract\"\ntest -z \"$(git status --porcelain)\"\n"
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      shell: bash
      run: 'set -euo pipefail

        npm install --package-lock=false

        test ! -f package-lock.json

        '
    - name: Generate validate sync and seed Prisma
      shell: bash
      run: 'set -euo pipefail

        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed

        '
    - name: Static UX accessibility and Communities checks
      shell: bash
      run: 'set -euo pipefail

        npm run validate:static

        npm run validate:ux

        npm run validate:a11y

        node scripts/communities-redesign-stage-a-check.mjs

        node scripts/communities-redesign-stage-b-check.mjs

        node scripts/communities-redesign-stage-c-check.mjs

        node scripts/communities-redesign-stage-d-check.mjs

        node scripts/communities-redesign-stage-e-check.mjs

        node scripts/communities-redesign-stage-f-check.mjs

        node scripts/communities-redesign-stage-f2-check.mjs

        node scripts/communities-redesign-stage-f3-check.mjs

        node scripts/communities-redesign-stage-f4-check.mjs

        node scripts/communities-redesign-stage-f5-check.mjs

        node scripts/home-redesign-stage-h2-check.mjs

        node scripts/home-redesign-stage-h-check.mjs

        node scripts/ui-interaction-check.mjs

        '
    - name: Typecheck every workspace
      run: npm run typecheck
    - name: Run API tests
      run: npm test
    - name: Clean production build
      run: npm run build
    - name: Remove generated build noise
      shell: bash
      run: 'set -euo pipefail

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"

        '
    - name: Push verified Communities Stage F.5.1
      shell: bash
      run: 'set -euo pipefail

        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main

        '
    - name: Verify remote main
      shell: bash
      run: "set -euo pipefail\ngit fetch origin main\nlocal_sha=\"$(git rev-parse HEAD)\"\nremote_sha=\"$(git rev-parse origin/main)\"\ntest \"$local_sha\" = \"$remote_sha\"\n\nclient=\"$(git show origin/main:apps/web/app/communities/communities-client.tsx)\"\ncss=\"$(git show origin/main:apps/web/app/globals.css)\"\n\n[[ \"$client\" == *'useState<string | null>(null);'* ]]\n[[ \"$client\" != *\"useState<string | null>('internet-projects');\"* ]]\n[[ \"$client\" == *'communities-v12-hierarchy-placeholder'* ]]\n[[ \"$client\" == *'communities-v12-subscribe'* ]]\n[[ \"$client\" == *'communities-v12-open-hierarchy'* ]]\n[[ \"$css\" == *'FORRUM_COMMUNITIES_REDESIGN_STAGE_F5_V12'* ]]\n[[ \"$css\" == *'> .communities-v12-subscribe {'* ]]\n[[ \"$css\" == *'> .communities-v12-open-hierarchy,'* ]]\n\nstage_e=\"$(git show origin/main:scripts/communities-redesign-stage-e-check.mjs)\"\n          [[ \"$stage_e\" == *'FORRUM_COMMUNITIES_REDESIGN_STAGE_F5_INITIAL_SELECTION_CONTRACT'* ]]\n          [[ \"$stage_e\" == *\"'useState<string | null>(null)'\"* ]]\n          [[ \"$stage_e\" != *'\"useState<string | null>(\\'internet-projects\\')\"'* ]]\n\n          echo \"FORRUM Communities V12.F.5.1 remote verification passed.\"\n"
