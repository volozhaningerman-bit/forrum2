name: FORRUM Home Redesign V11.C.2.1
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-redesign
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  stage-c-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Stage C baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/globals.css
          test -f apps/web/components/home-dashboard.tsx
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_C_V11' apps/web/app/globals.css
          grep -q 'home-tree-panel-toggle' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-icon-link' apps/web/components/home-dashboard.tsx
          test -z "$(git status --porcelain)"

      - name: Ensure Stage C.1 alignment fix
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'FORRUM_HOME_REDESIGN_STAGE_C_1_V11' apps/web/app/globals.css; then
            cat >> apps/web/app/globals.css <<'CSS'

          /* FORRUM_HOME_REDESIGN_STAGE_C_1_V11
             Correct legacy sticky top offset after Stage C switched the tree to relative positioning.
          */
          .home-stage-one .home-community-tree {
            top: auto !important;
            align-self: start;
            margin-top: 0 !important;
          }
          /* /FORRUM_HOME_REDESIGN_STAGE_C_1_V11 */
          CSS
          fi
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_C_1_V11' apps/web/app/globals.css
          grep -q 'top: auto !important' apps/web/app/globals.css
          grep -q 'align-self: start' apps/web/app/globals.css

      - name: Apply new master-reference tree accents
        shell: bash
        env:
          CSS_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          css_path = Path('apps/web/app/globals.css')
          doc_path = Path('docs/FORRUM_HOME_REDESIGN_STAGE_C_2_1_V11.md')
          css = css_path.read_text(encoding='utf-8')
          block = base64.b64decode(os.environ['CSS_B64']).decode('utf-8').strip() + '\n'
          start = '/* FORRUM_HOME_REDESIGN_STAGE_C_2_V11'
          end = '/* /FORRUM_HOME_REDESIGN_STAGE_C_2_V11 */'

          if start in css:
              prefix, rest = css.split(start, 1)
              if end not in rest:
                  raise RuntimeError('Stage C.2 CSS marker has no closing marker')
              _, suffix = rest.split(end, 1)
              css = prefix.rstrip() + '\n\n' + block + suffix.lstrip('\n')
          else:
              css = css.rstrip() + '\n\n' + block

          css_path.write_text(css, encoding='utf-8')
          doc_path.parent.mkdir(parents=True, exist_ok=True)
          doc_path.write_text(base64.b64decode(os.environ['DOC_B64']).decode('utf-8'), encoding='utf-8')
          print('Stage C.2.1 master-reference accents applied.')
          PYCODE

      - name: Verify Stage C.2.1 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_C_2_V11' apps/web/app/globals.css
          grep -q 'home-tree-leaf-mark::after' apps/web/app/globals.css
          grep -q 'background: var(--forrum-home-accent)' apps/web/app/globals.css
          grep -q 'home-tree-panel-toggle' apps/web/app/globals.css
          git diff --check

          allowed='^(apps/web/app/globals\.css|docs/FORRUM_HOME_REDESIGN_STAGE_C_2_1_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files were changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff -- apps/web/components/home-dashboard.tsx apps/web/components/site-header.tsx apps/web/components/main-nav.tsx apps/web/app/page.tsx apps/api | grep -q .; then
            echo 'Stage C.2.1 must not change structure, header, center or backend.'
            exit 1
          fi

      - name: Create isolated Stage C.2.1 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/globals.css docs/FORRUM_HOME_REDESIGN_STAGE_C_2_1_V11.md
          if git diff --cached --quiet; then
            echo 'Stage C.2.1 is already present.'
          else
            git commit -m "Align FORRUM tree with dark master reference"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and interaction checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          if [ -f scripts/ui-interaction-check.mjs ]; then
            node scripts/ui-interaction-check.mjs
          fi

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage C.2.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
