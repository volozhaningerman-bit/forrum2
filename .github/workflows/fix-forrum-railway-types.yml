name: Fix FORRUM Railway API runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-and-verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fix API start entry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path("apps/api/package.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          scripts = data.setdefault("scripts", {})
          expected = "node dist/src/main.js"
          current = scripts.get("start")

          if current == expected:
              print("API start entry is already correct")
          else:
              print(f"Changing API start entry: {current!r} -> {expected!r}")
              scripts["start"] = expected
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Verify API entry file
        shell: bash
        run: |
          echo "Generated main files:"
          find apps/api/dist -type f -name 'main.js' -print
          test -f apps/api/dist/src/main.js

      - name: Build web
        run: npm run build -w @forrum/web

      - name: Commit verified runtime fix
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- apps/api/package.json; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add apps/api/package.json
            git commit -m "Fix Railway API runtime entry"
            git push
          fi
