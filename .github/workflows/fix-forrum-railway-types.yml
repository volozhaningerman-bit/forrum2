name: Repair FORRUM community build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Repair communities service
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/communities/communities.service.ts")
          text = path.read_text(encoding="utf-8")

          marker = "  async get("
          before, separator, after = text.partition(marker)
          if not separator:
              raise SystemExit("Method async get() was not found")

          managed_value = "      canManage: isGlobalManager || managedCommunityIds.has(community.id),"
          plain_value = "      canManage,"

          # list(): use the calculated global/community management flags.
          if managed_value not in before:
              if plain_value not in before:
                  raise SystemExit("The canManage field in list() was not found")
              before = before.replace(plain_value, managed_value, 1)

          # get(): use the local canManage variable calculated inside get().
          if managed_value in after:
              after = after.replace(managed_value, plain_value, 1)
          elif plain_value not in after:
              raise SystemExit("The canManage field in get() was not found")

          fixed = before + separator + after
          path.write_text(fixed, encoding="utf-8")
          print("communities.service.ts repaired")
          PY

      - name: Commit repair
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add apps/api/src/communities/communities.service.ts
            git commit -m "Fix community management scope"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Build web
        run: npm run build -w @forrum/web
