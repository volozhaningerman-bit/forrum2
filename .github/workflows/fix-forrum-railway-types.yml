name: Fix FORRUM Railway API runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-api-runtime:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fix API start entry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path("apps/api/package.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          scripts = data.setdefault("scripts", {})
          scripts["start"] = "node dist/src/main.js"

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("API start command set to node dist/src/main.js")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Verify API runtime entry
        shell: bash
        run: |
          echo "Generated API entry files:"
          find apps/api/dist -type f -name 'main.js' -print
          test -f apps/api/dist/src/main.js

      - name: Commit runtime fix
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- apps/api/package.json; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add apps/api/package.json
            git commit -m "Fix Railway API runtime entry"
            git push
          fi
