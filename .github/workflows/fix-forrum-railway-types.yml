name: Fix FORRUM subscriptions buttons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Remove duplicate button attributes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/subscriptions/page.tsx")
          text = path.read_text(encoding="utf-8")

          old_authors = """<button type="button" className={tab === 'authors' ? 'active' : ''} onClick={() => setTab('authors')} type="button">"""
          new_authors = """<button type="button" className={tab === 'authors' ? 'active' : ''} onClick={() => setTab('authors')}>"""

          old_tags = """<button type="button" className={tab === 'tags' ? 'active' : ''} onClick={() => setTab('tags')} type="button">"""
          new_tags = """<button type="button" className={tab === 'tags' ? 'active' : ''} onClick={() => setTab('tags')}>"""

          changed = False

          if old_authors in text:
              text = text.replace(old_authors, new_authors, 1)
              changed = True
              print("Fixed authors tab button")
          elif new_authors in text:
              print("Authors tab button already fixed")
          else:
              raise SystemExit("Authors tab button fragment was not found")

          if old_tags in text:
              text = text.replace(old_tags, new_tags, 1)
              changed = True
              print("Fixed tags tab button")
          elif new_tags in text:
              print("Tags tab button already fixed")
          else:
              raise SystemExit("Tags tab button fragment was not found")

          if changed:
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add apps/web/app/subscriptions/page.tsx
            git commit -m "Fix duplicate subscription button attributes"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Build web
        run: npm run build -w @forrum/web
