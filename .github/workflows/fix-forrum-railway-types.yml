name: Fix FORRUM auth runtime dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forrum
          POSTGRES_PASSWORD: forrum
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forrum -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NODE_ENV: test
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      SESSION_COOKIE_NAME: forrum_session
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: FORRUM <noreply@forrum.test>
      OWNER_EMAIL: owner@forrum.test
      OWNER_PASSWORD: ChangeMe12345
      FRIEND_EMAIL: friend@forrum.test
      FRIEND_PASSWORD: ChangeMe54321
      TELEGRAM_POLLING_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Make AuthModule global
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/auth/auth.module.ts")
          text = path.read_text(encoding="utf-8")

          if "import { Global, Module } from '@nestjs/common';" not in text:
              old_import = "import { Module } from '@nestjs/common';"
              if old_import not in text:
                  raise SystemExit("AuthModule Nest import was not found")
              text = text.replace(
                  old_import,
                  "import { Global, Module } from '@nestjs/common';",
                  1,
              )

          if "@Global()" not in text:
              marker = "@Module({"
              if marker not in text:
                  raise SystemExit("AuthModule decorator was not found")
              text = text.replace(marker, "@Global()\n@Module({", 1)

          path.write_text(text, encoding="utf-8")
          print("AuthModule is now global")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Sync test database
        run: npm run db:push -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Start API and verify health
        shell: bash
        run: |
          set -euo pipefail

          npm run start -w @forrum/api > /tmp/forrum-api.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API stopped before becoming healthy."
              cat /tmp/forrum-api.log
              exit 1
            fi

            sleep 2
          done

          echo "API did not become healthy in time."
          cat /tmp/forrum-api.log
          exit 1

      - name: Commit verified fix
        shell: bash
        run: |
          git diff --check

          if git diff --quiet -- apps/api/src/auth/auth.module.ts; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add apps/api/src/auth/auth.module.ts
            git commit -m "Make auth providers available to feature modules"
            git push
          fi
