name: Fix FORRUM publication avatar type

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fix publication author type
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/p/[slug]/page.tsx")
          text = path.read_text(encoding="utf-8")

          publication_start = text.find("type Publication = {")
          if publication_start == -1:
              raise SystemExit("type Publication was not found")

          publication_end = text.find("const reactions =", publication_start)
          if publication_end == -1:
              raise SystemExit("End of Publication type was not found")

          before = text[:publication_start]
          publication = text[publication_start:publication_end]
          after = text[publication_end:]

          if "avatarUrl?: string | null;" not in publication:
              old = """  author: {
                username: string;
                displayName: string;
                forrumId: number;"""
              new = """  author: {
                username: string;
                displayName: string;
                avatarUrl?: string | null;
                forrumId: number;"""
              if old not in publication:
                  raise SystemExit("Publication author type fragment was not found")
              publication = publication.replace(old, new, 1)
              path.write_text(before + publication + after, encoding="utf-8")
              print("Added avatarUrl to Publication.author")
          else:
              print("Publication.author already contains avatarUrl")
          PY

      - name: Commit fix
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No source changes were needed."
          else
            git config user.name "FORRUM build fixer"
            git config user.email "actions@users.noreply.github.com"
            git add 'apps/web/app/p/[slug]/page.tsx'
            git commit -m "Fix publication author avatar type"
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Build web
        run: npm run build -w @forrum/web
