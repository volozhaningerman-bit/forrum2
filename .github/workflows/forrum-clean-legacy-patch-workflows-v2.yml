name: FORRUM Cleanup Legacy Patch Workflows V2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN2 to remove the remaining approved legacy patch workflows'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: forrum-clean-legacy-patch-workflows-v2
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'CLEAN2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify protected workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/forrum-home-paper-graphite-v16-fixed.yml
          git reset --hard HEAD
          git clean -ffdx

      - name: Preview exact cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "Remaining legacy patch workflows selected for deletion:"
          find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-global-header-v13*.yml' -o \
              -name 'forrum-global-header-v13*.yaml' -o \
              -name 'forrum-patch*.yml' -o \
              -name 'forrum-patch*.yaml' -o \
              -name 'forrum-section-page-*.yml' -o \
              -name 'forrum-section-page-*.yaml' -o \
              -name 'forrum-topic-page-*.yml' -o \
              -name 'forrum-topic-page-*.yaml' \
            \) \
            ! -name 'forrum-home-paper-graphite-v16-fixed.yml' \
            -print | sort

      - name: Remove remaining legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-global-header-v13*.yml' -o \
              -name 'forrum-global-header-v13*.yaml' -o \
              -name 'forrum-patch*.yml' -o \
              -name 'forrum-patch*.yaml' -o \
              -name 'forrum-section-page-*.yml' -o \
              -name 'forrum-section-page-*.yaml' -o \
              -name 'forrum-topic-page-*.yml' -o \
              -name 'forrum-topic-page-*.yaml' \
            \) \
            ! -name 'forrum-home-paper-graphite-v16-fixed.yml' \
            -delete

          # Remove the first cleanup workflow if it is still present.
          rm -f .github/workflows/forrum-clean-legacy-patch-workflows.yml

      - name: Safety audit
        shell: bash
        run: |
          set -euo pipefail

          # The current canonical homepage workflow must survive.
          test -f .github/workflows/forrum-home-paper-graphite-v16-fixed.yml

          # None of the explicitly obsolete families may remain.
          if find .github/workflows -maxdepth 1 -type f \
            \( \
              -name 'forrum-global-header-v13*.yml' -o \
              -name 'forrum-global-header-v13*.yaml' -o \
              -name 'forrum-patch*.yml' -o \
              -name 'forrum-patch*.yaml' -o \
              -name 'forrum-section-page-*.yml' -o \
              -name 'forrum-section-page-*.yaml' -o \
              -name 'forrum-topic-page-*.yml' -o \
              -name 'forrum-topic-page-*.yaml' \
            \) \
            -print -quit | grep -q .; then
            echo "::error::An approved legacy workflow still remains."
            exit 1
          fi

          echo "Remaining workflow files:"
          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -printf '%f\n' | sort

          echo
          echo "Git changes:"
          git status --short

          # Every changed file must be a deletion inside .github/workflows.
          bad="$(
            git status --porcelain=v1 -uall |
            awk '
              NF == 0 { next }
              {
                status = substr($0, 1, 2)
                path = substr($0, 4)
                if (status !~ /D/ || path !~ /^\.github\/workflows\//) {
                  print $0
                }
              }
            '
          )"

          if [ -n "$bad" ]; then
            echo "::error::Unexpected change outside workflow deletions:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Commit cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing matched the approved legacy families."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add -u .github/workflows
          git diff --cached --check
          git commit -m "Remove remaining legacy FORRUM patch workflows"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Push cleanup
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote cleanup
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Remaining legacy patch families were removed."
