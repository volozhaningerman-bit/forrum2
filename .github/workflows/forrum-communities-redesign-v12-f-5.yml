name: FORRUM Communities Redesign V12.F.5

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-communities-redesign-v12-f-5
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  communities-stage-f-5:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved Communities Stage F.4 baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F3_V12_INTERACTION' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'FORRUM_COMMUNITIES_REDESIGN_STAGE_F4_V12' \
            apps/web/app/globals.css
          grep -q 'communities-v12-row-expand-surface' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-subscribe' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-open-hierarchy' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-hierarchy-child-arrow' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'communities-v12-hierarchy-placeholder' \
            apps/web/app/communities/communities-client.tsx
          grep -q 'Выберите сообщество' \
            apps/web/app/communities/communities-client.tsx
          test -z "$(git status --porcelain)"

      - name: Apply Communities Stage F.5 interaction fixes
        shell: bash
        env:
          STAGE_F5_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$STAGE_F5_PATCH_B64" \
            | base64 -d > /tmp/forrum-communities-stage-f5.py
          python3 /tmp/forrum-communities-stage-f5.py

      - name: Verify Stage F.5 source contract and patch scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/communities/communities-client\.tsx|apps/web/app/globals\.css|scripts/communities-redesign-stage-f5-check\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          if git diff -- \
            apps/web/components/site-header.tsx \
            apps/web/components/main-nav.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/page.tsx \
            apps/api/src \
            apps/api/prisma | grep -q .; then
            echo 'Stage F.5 altered approved shared structure, homepage or backend unexpectedly.'
            exit 1
          fi

      - name: Create isolated Communities Stage F.5 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            apps/web/app/communities/communities-client.tsx \
            apps/web/app/globals.css \
            scripts/communities-redesign-stage-f5-check.mjs

          git commit -m "Polish Communities initial state and actions"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Communities checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Communities Stage F.5
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          test "$local_sha" = "$remote_sha"

          client="$(git show origin/main:apps/web/app/communities/communities-client.tsx)"
          css="$(git show origin/main:apps/web/app/globals.css)"

          [[ "$client" == *'useState<string | null>(null);'* ]]
          [[ "$client" != *"useState<string | null>('internet-projects');"* ]]
          [[ "$client" == *'communities-v12-hierarchy-placeholder'* ]]
          [[ "$client" == *'communities-v12-subscribe'* ]]
          [[ "$client" == *'communities-v12-open-hierarchy'* ]]
          [[ "$css" == *'FORRUM_COMMUNITIES_REDESIGN_STAGE_F5_V12'* ]]
          [[ "$css" == *'> .communities-v12-subscribe {'* ]]
          [[ "$css" == *'> .communities-v12-open-hierarchy,'* ]]

          echo "FORRUM Communities V12.F.5 remote verification passed."
