name: FORRUM Create Topic Workspace V15.7.1
run-name: FORRUM Create Topic Workspace V15.7.1

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-create-topic-workspace-v15-7-1
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  create-topic-workspace-v15-7-1:
    name: Create Topic Workspace V15.7.1
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify installed V15.7 and detect V15.7.1
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'FORRUM_EDITOR_ENGINE_V15_6' \
            apps/web/components/bbcode-editor.tsx
          grep -Fq 'FORRUM_BBCODE_FREE_FORMATTING_V15_6' \
            apps/web/lib/bbcode.ts
          grep -Fq 'FORRUM_TOPIC_REPLY_EDITOR_V15_6' \
            "apps/web/app/p/[slug]/publication-client.tsx"
          grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12' \
            "apps/web/app/communities/[slug]/category-page.tsx"

          grep -Fq "const DRAFT_KEY = 'forrum-publication-draft';" \
            apps/web/app/create/publication-form.tsx
          grep -Fq "export function CreatePublicationForm()" \
            apps/web/app/create/publication-form.tsx
          grep -Fq '/communities/${community}/publications' \
            apps/web/app/create/publication-form.tsx
          grep -Fq 'router.push(`/p/${result.slug}`)' \
            apps/web/app/create/publication-form.tsx

          test "$(grep -Fxc '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7' \
            apps/web/app/create/publication-form.tsx)" -eq 1
          test "$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7 */' \
            apps/web/app/globals.css)" -eq 1

          node scripts/topic-reply-editor-v15-6-check.mjs
          node scripts/topic-post-surface-v15-5-check.mjs
          node scripts/topic-page-frame-v15-4-check.mjs
          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs

          form_upgrade_count="$(grep -Fxc \
            '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1' \
            apps/web/app/create/publication-form.tsx || true)"
          css_upgrade_count="$(grep -Fxc \
            '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1 */' \
            apps/web/app/globals.css || true)"

          test "$form_upgrade_count" -le 1
          test "$css_upgrade_count" -le 1

          if [ "$form_upgrade_count" -ne "$css_upgrade_count" ]; then
            echo 'Partial V15.7.1 marker state detected.'
            exit 1
          fi

          if [ "$form_upgrade_count" -eq 1 ]; then
            node scripts/create-topic-workspace-v15-7-check.mjs
            echo 'already_applied=true' >> "$GITHUB_OUTPUT"
            echo 'Create Topic Workspace V15.7.1 is already applied and valid.'
          else
            echo 'already_applied=false' >> "$GITHUB_OUTPUT"
          fi

          test -z "$(git status --porcelain)"

      - name: Upgrade Create Topic Workspace to V15.7.1
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        env:
          FORM_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          printf '%s' "$FORM_B64" | base64 -d \
            > apps/web/app/create/publication-form.tsx

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const formPath = 'apps/web/app/create/publication-form.tsx';
          const cssPath = 'apps/web/app/globals.css';
          const baseMarker = 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7';
          const upgradeMarker = 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1';
          const cssStart = `/* ${baseMarker} */`;
          const cssUpgrade = `/* ${upgradeMarker} */`;
          const oldCssHash =
            '65732b9143d6495b1313b37632bd4ae16d2c3162e6eb281960af5ab4dbffa40e';
          const finalCssHash =
            '5515a2a4596bfc47e5e9e78bcca3b6840283fe7ec31b7e44d04f80ff157dde18';
          const hash = (value) =>
            crypto.createHash('sha256').update(value).digest('hex');

          let form = fs.readFileSync(formPath, 'utf8');
          const formMarker = `// ${baseMarker}`;

          if (!form.includes(formMarker)) {
            throw new Error('Final V15.7 form payload lost its base marker.');
          }

          form = form.replace(
            formMarker,
            `${formMarker}\n// ${upgradeMarker}`,
          );
          fs.writeFileSync(formPath, form);

          const source = fs.readFileSync(cssPath, 'utf8');
          const markerIndex = source.indexOf(cssStart);

          if (markerIndex < 0 || source.indexOf(cssStart, markerIndex + 1) >= 0) {
            throw new Error('Expected exactly one installed V15.7 CSS block.');
          }

          const currentBlock = source.slice(markerIndex).trim();
          const currentHash = hash(currentBlock);
          const finalBlock = Buffer.from(
            process.env.CSS_B64,
            'base64',
          ).toString('utf8').trim();

          if (hash(finalBlock) !== finalCssHash) {
            throw new Error('Embedded final V15.7 CSS payload is corrupted.');
          }

          if (currentHash !== oldCssHash && currentHash !== finalCssHash) {
            throw new Error(
              'Installed V15.7 CSS differs from both known builds; refusing unsafe replacement.',
            );
          }

          const prefix = source.slice(0, markerIndex).trimEnd();
          fs.writeFileSync(
            cssPath,
            `${prefix}\n\n${finalBlock}\n\n${cssUpgrade}\n`,
          );
          NODE

          printf '%s' "$CHECK_B64" | base64 -d \
            > scripts/create-topic-workspace-v15-7-check.mjs

          printf '%s' "$DOC_B64" | base64 -d \
            > docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7.md

      - name: Verify V15.7.1 contracts and protected scope
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          node scripts/create-topic-workspace-v15-7-check.mjs
          grep -Fqx '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1' \
            apps/web/app/create/publication-form.tsx
          grep -Fqx '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1 */' \
            apps/web/app/globals.css
          node scripts/topic-reply-editor-v15-6-check.mjs
          node scripts/topic-post-surface-v15-5-check.mjs
          node scripts/topic-page-frame-v15-4-check.mjs

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs

          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          allowed='^(apps/web/app/create/publication-form\.tsx|apps/web/app/globals\.css|scripts/create-topic-workspace-v15-7-check\.mjs|docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"

          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff -- \
            "apps/web/app/communities/[slug]/category-page.tsx" \
            "apps/web/app/p/[slug]/publication-client.tsx" \
            apps/web/components/topic-category-tree.tsx \
            apps/web/components/bbcode-editor.tsx \
            apps/web/components/bbcode-content.tsx \
            apps/web/lib/bbcode.ts \
            apps/web/app/communities/communities-client.tsx \
            apps/web/components/main-nav.tsx \
            apps/web/components/site-header.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/page.tsx \
            apps/api/src \
            apps/api/prisma | grep -q .; then
            echo 'V15.7.1 changed protected topic/section/editor/header/home/backend scope.'
            exit 1
          fi

      - name: Create isolated verified V15.7.1 commit
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -- \
            apps/web/app/create/publication-form.tsx \
            apps/web/app/globals.css \
            scripts/create-topic-workspace-v15-7-check.mjs \
            docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_7.md

          git commit -m "Upgrade Create Topic Workspace V15.7.1"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        if: steps.baseline.outputs.already_applied != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and regression checks
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/create-topic-workspace-v15-7-check.mjs
          node scripts/topic-reply-editor-v15-6-check.mjs
          node scripts/topic-post-surface-v15-5-check.mjs
          node scripts/topic-page-frame-v15-4-check.mjs
          node scripts/section-tree-hit-area-v14-12-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        if: steps.baseline.outputs.already_applied != 'true'
        run: npm run typecheck

      - name: Run API tests
        if: steps.baseline.outputs.already_applied != 'true'
        run: npm test

      - name: Clean production build
        if: steps.baseline.outputs.already_applied != 'true'
        run: npm run build

      - name: Remove generated build noise
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Create Topic Workspace V15.7.1
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        if: steps.baseline.outputs.already_applied != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show \
            origin/main:apps/web/app/create/publication-form.tsx \
            | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7'

          git show \
            origin/main:apps/web/app/create/publication-form.tsx \
            | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1'

          git show \
            origin/main:apps/web/app/create/publication-form.tsx \
            | grep -Fq 'mode="topic-create"'

          git show \
            origin/main:apps/web/app/globals.css \
            | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7'

          git show \
            origin/main:apps/web/app/globals.css \
            | grep -Fq 'FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_1'

          git show \
            origin/main:apps/web/components/bbcode-editor.tsx \
            | grep -Fq 'FORRUM_EDITOR_ENGINE_V15_6'

          git show \
            'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \
            | grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12'

          node scripts/create-topic-workspace-v15-7-check.mjs

          echo 'FORRUM Create Topic Workspace V15.7.1 remote verification passed.'

      - name: Confirm V15.7.1 was already valid
        if: steps.baseline.outputs.already_applied == 'true'
        shell: bash
        run: |
          echo 'FORRUM Create Topic Workspace V15.7.1 was already applied; no files changed.'
