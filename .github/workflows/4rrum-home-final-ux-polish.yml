name: 4RRUM Home — Final UX Polish
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: 4rrum-home-final-ux-polish
  cancel-in-progress: false
jobs:
  home-final-ux-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: Baseline and protected scope
      shell: bash
      run: 'set -euo pipefail

        echo "=== 4RRUM HOME FINAL UX POLISH ==="

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"

        echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


        test -f apps/web/components/home-dashboard.tsx

        test -f apps/web/components/site-header.tsx

        test -f apps/web/components/site-footer.tsx

        test -f apps/web/app/layout.tsx

        test -f apps/web/app/globals.css

        test -f .github/workflows/4rrum-home-final-ux-polish.yml


        grep -Fq ''FORRUM_HOME_TABLE_OVERFLOW_FIX'' apps/web/app/globals.css

        grep -Fq ''FORRUM_HOME_CONTEXTUAL_ACTUAL'' apps/web/components/home-dashboard.tsx

        grep -Fq ''title="Новости FORRUM"'' apps/web/components/home-dashboard.tsx

        grep -Fq ''className="brand"'' apps/web/components/site-header.tsx

        grep -Fq ''className="header-search"'' apps/web/components/site-header.tsx

        echo "Baseline: PASS"

        '
      id: baseline
    - name: Write regression checks first
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 -d > scripts/home-final-ux-polish-check.mjs

        node --check scripts/home-final-ux-polish-check.mjs

        '
    - name: TDD RED
      shell: bash
      run: "set -euo pipefail\nif node scripts/home-final-ux-polish-check.mjs; then\n  echo \"::error::Regression checks unexpectedly passed before implementation.\"\n  exit 1\nfi\necho \"TDD RED confirmed.\"\n"
    - name: Apply production patch
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 -d > apps/web/components/header-search.tsx

        printf ''%s'' ''''
        | base64 -d > apps/web/components/theme-toggle.tsx

        printf ''%s'' ''''
        | base64 -d > apps/web/components/site-header.tsx

        printf ''%s'' ''''
        | base64 -d > /tmp/4rrum-home-polish.py

        python3 /tmp/4rrum-home-polish.py

        git diff --check

        '
    - name: TDD GREEN
      shell: bash
      run: 'set -euo pipefail

        node scripts/home-final-ux-polish-check.mjs

        echo "TDD GREEN confirmed."

        '
    - name: Audit exact change scope
      shell: bash
      run: "set -euo pipefail\nchanged=\"$(\n  {\n    git diff --name-only\n    git ls-files --others --exclude-standard\n  } | sort -u\n)\"\nexpected=\"$(\n  printf '%s\n'     apps/web/app/globals.css     apps/web/app/layout.tsx     apps/web/components/header-search.tsx     apps/web/components/home-dashboard.tsx     apps/web/components/site-footer.tsx     apps/web/components/site-header.tsx     apps/web/components/theme-toggle.tsx     scripts/home-final-ux-polish-check.mjs |\n  sort\n)\"\necho \"Changed:\"\nprintf '%s\n' \"$changed\"\necho \"Expected:\"\nprintf '%s\n' \"$expected\"\ntest \"$changed\" = \"$expected\"\n\ntest -z \"$(\n  git diff --name-only --     apps/api     packages/contracts     apps/web/components/auth-actions.tsx     apps/web/components/main-nav.tsx\n)\"\n! git diff | grep -Eq 'fakeUser|fakeParticipant|fakeNews|demoParticipant'\ngit diff --check\necho \"Scope audit: PASS\"\n"
    - name: Stage intended product change
      shell: bash
      run: 'set -euo pipefail

        git add --   apps/web/app/globals.css   apps/web/app/layout.tsx   apps/web/components/header-search.tsx   apps/web/components/home-dashboard.tsx   apps/web/components/site-footer.tsx   apps/web/components/site-header.tsx   apps/web/components/theme-toggle.tsx   scripts/home-final-ux-polish-check.mjs

        git diff --cached --check

        '
    - name: Install dependencies
      shell: bash
      run: 'set -euo pipefail

        npm install --include=dev --no-audit --no-fund --package-lock=false

        '
    - name: Validate and regenerate Prisma
      shell: bash
      run: 'set -euo pipefail

        npm run db:validate

        npm run db:generate

        '
      env:
        DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
    - name: Static UX accessibility tests
      shell: bash
      run: 'set -euo pipefail

        node scripts/home-final-ux-polish-check.mjs

        npm run validate:static

        npm run validate:ux

        npm run validate:a11y

        '
    - name: Relevant test suites
      shell: bash
      run: 'set -euo pipefail

        npm test -w @forrum/contracts --if-present

        npm test -w @forrum/api --if-present

        npm test -w @forrum/web --if-present

        '
    - name: Typecheck entire product
      shell: bash
      run: 'set -euo pipefail

        npm run typecheck

        '
    - name: Production build entire product
      shell: bash
      run: 'set -euo pipefail

        rm -rf apps/web/.next

        npm run build

        '
    - name: Production self-review
      shell: bash
      run: 'set -euo pipefail

        echo "=== FINAL SELF REVIEW ==="

        node scripts/home-final-ux-polish-check.mjs


        grep -Fq ''FORRUM_HOME_TABLE_OVERFLOW_FIX'' apps/web/app/globals.css

        grep -Fq ''FORRUM_HOME_V45_RIGHT_RAIL_NEWS'' apps/web/components/home-dashboard.tsx

        grep -Fq ''FORRUM_HOME_CONTEXTUAL_ACTUAL'' apps/web/components/home-dashboard.tsx

        grep -Fq ''1580px'' apps/web/app/globals.css


        ! git diff --cached | grep -Eq ''fakeUser|fakeParticipant|fakeNews|demoParticipant''

        test -z "$(git diff --cached --name-only -- apps/api packages/contracts)"


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y

        npm run typecheck

        npm run build


        echo "Production self-review: PASS"

        '
    - name: Restore generated build noise and self-delete
      shell: bash
      run: "set -euo pipefail\ngit restore --worktree -- .\ngit clean -ffdx\ngit rm .github/workflows/4rrum-home-final-ux-polish.yml\ngit diff --cached --check\n\nstaged=\"$(git diff --cached --name-only | sort)\"\nexpected=\"$(\n  printf '%s\n'     .github/workflows/4rrum-home-final-ux-polish.yml     apps/web/app/globals.css     apps/web/app/layout.tsx     apps/web/components/header-search.tsx     apps/web/components/home-dashboard.tsx     apps/web/components/site-footer.tsx     apps/web/components/site-header.tsx     apps/web/components/theme-toggle.tsx     scripts/home-final-ux-polish-check.mjs |\n  sort\n)\"\necho \"Final staged paths:\"\nprintf '%s\n' \"$staged\"\ntest \"$staged\" = \"$expected\"\n"
    - name: Commit verified home polish
      shell: bash
      run: 'set -euo pipefail

        git config user.name "4RRUM QA updater"

        git config user.email "actions@users.noreply.github.com"

        git commit -m "Polish 4RRUM home UX and header"

        '
    - name: Publish only against unchanged main
      shell: bash
      run: "set -euo pipefail\ngit fetch origin main\nif [ \"$(git rev-parse origin/main)\" != \"$BASE_SHA\" ]; then\n  echo \"::error::main advanced during verification. Rerun this workflow.\"\n  exit 1\nfi\ngit push origin HEAD:main\n"
      env:
        BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
    - name: Verify remote commit
      shell: bash
      run: "set -euo pipefail\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\n\ngit show origin/main:apps/web/components/site-header.tsx | grep -Fq 'aria-label=\"4RRUM\"'\ngit show origin/main:apps/web/components/home-dashboard.tsx | grep -Fq '4RRUM_HOME_START_RAIL'\ngit show origin/main:apps/web/app/globals.css | grep -Fq '/* 4RRUM_HOME_FINAL_UX_POLISH */'\n\nif git cat-file -e origin/main:.github/workflows/4rrum-home-final-ux-polish.yml 2>/dev/null; then\n  echo \"::error::One-time workflow did not self-delete.\"\n  exit 1\nfi\necho \"4RRUM final home polish published and workflow removed.\"\n"
