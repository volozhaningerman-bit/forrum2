name: FORRUM Home Production Polish V46

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-production-polish-v46
  cancel-in-progress: false

jobs:
  home-production-polish-v46:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FORRUM HOME PRODUCTION POLISH V46 ==="

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f apps/web/components/main-nav.tsx

          grep -Fq '// FORRUM_HOME_V45_RIGHT_RAIL_NEWS' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '// FORRUM_HOME_CONTEXTUAL_ACTUAL' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '<h2>Участники недели</h2>' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'event.target !== event.currentTarget' \
            apps/web/components/home-dashboard.tsx

          grep -Fq '/* FORRUM_HOME_REFERENCE_V36_START' \
            apps/web/app/globals.css
          grep -Fq '/* FORRUM_HOME_REFERENCE_V36_END */' \
            apps/web/app/globals.css
          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq '/* FORRUM_LOGO_DARK_HOVER_FIX */' \
            apps/web/app/globals.css

          echo "Baseline confirmed."

      - name: Write regression check first
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/home-production-polish-v46-check.mjs <<'NODE'
          import fs from 'node:fs';

          const home = fs.readFileSync(
            'apps/web/components/home-dashboard.tsx',
            'utf8',
          );
          const css = fs.readFileSync(
            'apps/web/app/globals.css',
            'utf8',
          );

          const requiredHome = [
            '// FORRUM_HOME_PRODUCTION_POLISH_V46',
            '// FORRUM_HOME_CONTEXTUAL_ACTUAL',
            'title="Новости FORRUM"',
            'announcements.slice(0, 3).map((item) => (',
            'weekly.slice(0, 5).map((user, index) => (',
            'event.target !== event.currentTarget',
          ];

          for (const marker of requiredHome) {
            if (!home.includes(marker)) {
              throw new Error(`V46 home marker missing: ${marker}`);
            }
          }

          const startMarker =
            '/* FORRUM_HOME_PRODUCTION_POLISH_V46_START */';
          const endMarker =
            '/* FORRUM_HOME_PRODUCTION_POLISH_V46_END */';
          const headerStart =
            '/* FORRUM_HEADER_PRODUCTION_POLISH_V46_START */';
          const headerEnd =
            '/* FORRUM_HEADER_PRODUCTION_POLISH_V46_END */';

          for (const marker of [
            startMarker,
            endMarker,
            headerStart,
            headerEnd,
            'grid-template-columns: minmax(360px, 2.65fr)',
            '.forrum-home-v16__discussion-stat',
            '.forrum-home-v16__tree-count',
            '.header-search',
            'width: min(330px, 25vw);',
          ]) {
            if (!css.includes(marker)) {
              throw new Error(`V46 CSS marker missing: ${marker}`);
            }
          }

          if ((css.match(
            /\/\* FORRUM_HOME_PRODUCTION_POLISH_V46_START \*\//g,
          ) ?? []).length !== 1) {
            throw new Error('V46 home CSS block must exist exactly once.');
          }

          if ((css.match(
            /\/\* FORRUM_HEADER_PRODUCTION_POLISH_V46_START \*\//g,
          ) ?? []).length !== 1) {
            throw new Error('V46 header CSS block must exist exactly once.');
          }

          const canonicalStart = css.indexOf(
            '/* FORRUM_HOME_REFERENCE_V36_START',
          );
          const canonicalEnd = css.indexOf(
            '/* FORRUM_HOME_REFERENCE_V36_END */',
            canonicalStart,
          );
          const polishStart = css.indexOf(startMarker);

          if (
            canonicalStart < 0 ||
            canonicalEnd < 0 ||
            polishStart < canonicalStart ||
            polishStart > canonicalEnd
          ) {
            throw new Error(
              'Homepage V46 styles must stay inside canonical homepage CSS.',
            );
          }

          const polishEnd = css.indexOf(endMarker, polishStart);
          const polish = css.slice(
            polishStart,
            polishEnd + endMarker.length,
          );

          for (const forbidden of [
            'box-shadow:',
            'backdrop-filter:',
            'linear-gradient(',
            'radial-gradient(',
            'border-radius: 8px',
            'border-radius: 12px',
          ]) {
            if (polish.includes(forbidden)) {
              throw new Error(`V46 forbidden visual pattern: ${forbidden}`);
            }
          }

          if (home.includes('FORRUM сегодня')) {
            throw new Error('Removed statistics panel returned.');
          }

          for (const fake of [
            'fakeUser',
            'fakeTopic',
            'fakeNews',
            'mockUser',
            'mockTopic',
            'demoUser',
            'demoTopic',
          ]) {
            if (home.includes(fake)) {
              throw new Error(`Synthetic homepage data detected: ${fake}`);
            }
          }

          console.log('FORRUM Home Production Polish V46: PASS');
          NODE

      - name: TDD RED
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/home-production-polish-v46-check.mjs; then
            echo "::error::V46 unexpectedly passed before implementation."
            exit 1
          fi

          echo "TDD RED confirmed."

      - name: Apply component polish
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/components/home-dashboard.tsx')
          source = path.read_text(encoding='utf-8')

          marker = '// FORRUM_HOME_PRODUCTION_POLISH_V46'
          if marker in source:
              raise SystemExit('V46 component polish already exists.')

          export_anchor = 'export function HomeDashboard({'
          if source.count(export_anchor) != 1:
              raise SystemExit(
                  f'Unexpected HomeDashboard export count: {source.count(export_anchor)}'
              )

          source = source.replace(
              export_anchor,
              marker + '\n' + export_anchor,
              1,
          )

          # News is a compact editorial showcase: never let the rail
          # turn into a second forum feed.
          news_title = 'title="Новости FORRUM"'
          news_pos = source.find(news_title)
          if news_pos < 0:
              raise SystemExit('Could not locate Новости FORRUM panel.')

          news_start = source.rfind('<HomePanel', 0, news_pos)
          news_end = source.find('</HomePanel>', news_pos)
          if news_start < 0 or news_end < 0:
              raise SystemExit('Could not locate Новости FORRUM bounds.')
          news_end += len('</HomePanel>')

          news = source[news_start:news_end]

          if 'announcements.slice(0, 3).map((item) => (' not in news:
              news, count = re.subn(
                  r'announcements(?:\.slice\(0,\s*3\))?'
                  r'\.map\(\(item\) => \(',
                  'announcements.slice(0, 3).map((item) => (',
                  news,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      'Could not normalize Новости FORRUM to three items.'
                  )

          source = source[:news_start] + news + source[news_end:]

          # The weekly block is a ranking, not an endless list.
          if 'weekly.slice(0, 5).map((user, index) => (' not in source:
              source, count = re.subn(
                  r'weekly(?:\.slice\(0,\s*5\))?'
                  r'\.map\(\(user,\s*index\) => \(',
                  'weekly.slice(0, 5).map((user, index) => (',
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      'Could not cap weekly ranking at five users.'
                  )

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in source.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('V46 component polish applied.')
          PY

          git diff --check

      - name: Apply visual hierarchy polish
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/globals.css')
          css = path.read_text(encoding='utf-8')

          home_start_marker = '/* FORRUM_HOME_PRODUCTION_POLISH_V46_START */'
          home_end_marker = '/* FORRUM_HOME_PRODUCTION_POLISH_V46_END */'
          header_start_marker = '/* FORRUM_HEADER_PRODUCTION_POLISH_V46_START */'
          header_end_marker = '/* FORRUM_HEADER_PRODUCTION_POLISH_V46_END */'

          for marker in (
              home_start_marker,
              home_end_marker,
              header_start_marker,
              header_end_marker,
          ):
              if marker in css:
                  raise SystemExit(f'V46 CSS marker already exists: {marker}')

          canonical_end_marker = '/* FORRUM_HOME_REFERENCE_V36_END */'
          canonical_end = css.find(canonical_end_marker)
          if canonical_end < 0:
              raise SystemExit('Canonical homepage CSS end marker missing.')

          home_polish = r'''
          /* FORRUM_HOME_PRODUCTION_POLISH_V46_START */
          /*
           * Final production pass over the approved homepage.
           * No new cards, statistics or SaaS-style decoration.
           * Geometry stays identical in Paper and Graphite.
           */
          @media (min-width: 1241px) {
            .forrum-home-v16__tree-count {
              color: var(--fvt-faint);
              font-weight: 500;
              font-variant-numeric: tabular-nums;
            }

            .forrum-home-v16__tree-children::before {
              border-left-color: var(--fvt-line);
            }

            .forrum-home-v16__topic-excerpt {
              color: var(--fvt-muted);
            }

            .forrum-home-v16__topic-meta {
              color: var(--fvt-faint);
            }

            .forrum-home-v16__topic-meta span:first-child {
              color: var(--fvt-muted);
              font-weight: 500;
            }

            .forrum-home-v16__discussion-stat {
              color: var(--fvt-faint);
              font-size: 10.75px;
              font-weight: 500;
            }

            .forrum-home-v16__last-message {
              color: var(--fvt-faint);
            }

            .forrum-home-v16__last-message strong {
              color: var(--fvt-muted);
              font-weight: 500;
            }

            .forrum-home-v16__new-topic-title {
              color: var(--fvt-text);
              font-weight: 620;
            }

            .forrum-home-v16__new-topic-section,
            .forrum-home-v16__new-topic-author {
              color: var(--fvt-muted);
            }

            .forrum-home-v16__new-topic-number,
            .forrum-home-v16__new-topic-last {
              color: var(--fvt-faint);
              font-variant-numeric: tabular-nums;
            }

            .forrum-home-v16__new-topic-last b {
              color: var(--fvt-muted);
              font-weight: 500;
            }

            .forrum-home-v16__weekly li {
              min-height: 38px;
            }

            .forrum-home-v16__weekly li > strong {
              color: var(--fvt-muted);
              font-weight: 560;
              font-variant-numeric: tabular-nums;
            }

            .forrum-home-v16__actual strong,
            .forrum-home-v16__news-item strong {
              font-weight: 610;
            }
          }

          @media (min-width: 1481px) {
            .forrum-home-v16__new-topic-head,
            .forrum-home-v16__new-topic {
              grid-template-columns: minmax(360px, 2.65fr)
                minmax(118px, .88fr)
                minmax(102px, .78fr)
                52px
                68px
                minmax(150px, 1.05fr);
              column-gap: 10px;
            }
          }
          /* FORRUM_HOME_PRODUCTION_POLISH_V46_END */
          '''

          css = (
              css[:canonical_end]
              + home_polish
              + '\n'
              + css[canonical_end:]
          )

          header_polish = r'''
          /* FORRUM_HEADER_PRODUCTION_POLISH_V46_START */
          @media (min-width: 1241px) {
            .header-search {
              width: min(330px, 25vw);
            }

            .auth-actions {
              gap: 12px;
            }

            .auth-actions .button.small {
              min-height: 32px;
              padding: 6px 12px;
              font-size: 13px;
            }
          }
          /* FORRUM_HEADER_PRODUCTION_POLISH_V46_END */
          '''

          css = css.rstrip() + '\n' + header_polish.lstrip()

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in css.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('V46 visual hierarchy polish applied.')
          PY

          git diff --check

      - name: TDD GREEN
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-production-polish-v46-check.mjs
          echo "TDD GREEN confirmed."

      - name: Scope audit
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          expected="$(
            printf '%s\n' \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-production-polish-v46-check.mjs |
            sort
          )"

          printf 'V46 changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"

          test -z "$(
            git diff --name-only -- \
              apps/web/app/page.tsx \
              apps/web/components/main-nav.tsx \
              apps/api \
              packages/contracts
          )"

          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx

          ! git diff | grep -Eq \
            'fakeUser|fakeTopic|fakeNews|mockUser|mockTopic|demoUser|demoTopic'

          echo "V46 scope audit: PASS"

      - name: Stage verified patch
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-production-polish-v46-check.mjs

          git diff --cached --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Validate Prisma
        shell: bash
        env:
          DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
        run: |
          set -euo pipefail

          npm run db:validate
          npm run db:generate

      - name: Full product verification
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-production-polish-v46-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck

          rm -rf apps/web/.next
          npm run build

      - name: Production self-review
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-production-polish-v46-check.mjs

          grep -Fq 'event.target !== event.currentTarget' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'Участники недели' \
            apps/web/components/home-dashboard.tsx

          ! grep -Fq 'FORRUM сегодня' \
            apps/web/components/home-dashboard.tsx

          polish="$(
            sed -n \
              '/FORRUM_HOME_PRODUCTION_POLISH_V46_START/,/FORRUM_HOME_PRODUCTION_POLISH_V46_END/p' \
              apps/web/app/globals.css
          )"

          ! grep -Eq \
            'box-shadow:|backdrop-filter:|linear-gradient\(|radial-gradient\(' \
            <<< "$polish"

          npm run typecheck
          npm run build

          echo "V46 production self-review: PASS"

      - name: Restore generated noise and self-delete
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- .
          git clean -ffdx

          git rm .github/workflows/forrum-home-production-polish-v46.yml

          git diff --cached --check

          staged="$(git diff --cached --name-only | sort)"
          expected="$(
            printf '%s\n' \
              .github/workflows/forrum-home-production-polish-v46.yml \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-production-polish-v46-check.mjs |
            sort
          )"

          printf 'V46 final staged paths:\n%s\n' "$staged"
          test "$staged" = "$expected"

      - name: Commit verified V46
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "Polish FORRUM home hierarchy V46"

      - name: Publish only against unchanged main
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during V46 verification. Rerun workflow."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify remote
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx \
            | grep -Fq '// FORRUM_HOME_PRODUCTION_POLISH_V46'

          git show origin/main:apps/web/app/globals.css \
            | grep -Fq '/* FORRUM_HOME_PRODUCTION_POLISH_V46_START */'

          if git cat-file -e \
            origin/main:.github/workflows/forrum-home-production-polish-v46.yml \
            2>/dev/null
          then
            echo "::error::V46 workflow did not self-delete."
            exit 1
          fi

          echo "V46 published and workflow removed."
