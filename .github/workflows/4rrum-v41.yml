name: 4rrum V41
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Применить изменения
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib

          root = Path.cwd()
          expected = {
              'apps/web/app/layout.tsx':
                  'edf96fd10ab935e266ec21c10bc5e05ff85d572a306bf5ef14cbbddac253e4f6',
              'apps/web/components/home/category-style.ts':
                  'db6f8653234d1a713d0f64d09077212c2506c0d8e2e6be95f6f0c5694b311989',
              'apps/web/components/reference-home.tsx':
                  '5b919bc8a84735d74bdbee4ad958643f50792bc4f09e42788f085c49d8d940b8',
          }

          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == digest, 'Исходники отличаются от V40: ' + name

          assert not (root / 'apps/web/app/home-v41.css').exists(), 'V41 уже присутствует'

          css = r"""
          .forum-home[data-home-reference="v40"] {
            --f-bg: #f0efe8;
            --f-panel: #f8f8f2;
            --f-rail: #eeeee6;
            --f-border: #dce2d7;
            --f-muted: #627168;
            max-width: 1600px;
            grid-template-columns: 245px minmax(0, 1fr) 290px;
            gap: 14px 18px;
            padding-right: 18px;
            font-family: Arial, Helvetica, sans-serif;
          }

          html.dark .forum-home[data-home-reference="v40"] {
            --f-bg: #18211e;
            --f-panel: #222d27;
            --f-rail: #1b2520;
            --f-border: #35423a;
            --f-muted: #abb9ad;
          }

          body:has(.forum-home[data-home-reference="v40"]) {
            background: #ecece3 !important;
          }

          html.dark body:has(.forum-home[data-home-reference="v40"]) {
            background: #17201c !important;
          }

          .forum-home[data-home-reference="v40"]::before {
            background:
              linear-gradient(#f0efe8e8, #e9ede3ed),
              url('/images/home/lab-v40.webp') center / cover;
            filter: blur(9px);
          }

          html.dark .forum-home[data-home-reference="v40"]::before {
            background:
              linear-gradient(#17201ce8, #17201cf5),
              url('/images/home/lab-v40.webp') center / cover;
          }

          .forum-home[data-home-reference="v40"] .forum-sidebar {
            padding: 20px 10px 14px;
            gap: 0;
            scrollbar-width: thin;
          }

          .forum-home[data-home-reference="v40"] .forum-brand {
            margin: 0 10px 28px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-title {
            margin: 0 6px 10px;
          }

          .forum-home[data-home-reference="v40"] .forum-categories {
            display: block;
            margin: 0;
          }

          .forum-home[data-home-reference="v40"] .forum-categories > .forum-category {
            padding: 5px 0;
            margin: 0;
          }

          .forum-home[data-home-reference="v40"] .forum-category-heading {
            min-height: 32px;
            padding: 4px;
            gap: 3px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-heading > a {
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            flex: 1;
          }

          .forum-home[data-home-reference="v40"] .forum-category-heading > a svg {
            width: 15px;
            height: 15px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-heading > a > span {
            line-height: 1.3;
          }

          .forum-home[data-home-reference="v40"] .forum-category-counts {
            font-size: 11px;
            gap: 4px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-heading > button {
            width: 18px;
            padding: 1px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-children {
            margin-left: 11px;
            padding-left: 9px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-children .forum-category-heading {
            min-height: 27px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-children .forum-category-heading > a {
            font-size: 11px;
          }

          .forum-home[data-home-reference="v40"] .forum-app-category .forum-category-children > a {
            padding: 4px;
          }

          .forum-home[data-home-reference="v40"] .forum-sidebar-bottom {
            margin-top: auto;
            padding-top: 14px;
          }

          .forum-home[data-home-reference="v40"] .forum-all-communities {
            margin: 12px 6px 18px;
          }

          .forum-home[data-home-reference="v40"] .forum-search-hero {
            min-height: 212px;
            background-size: auto 100%;
            background-position: right center;
            background-repeat: no-repeat;
            background-color: #242e23;
          }

          html.dark .forum-home[data-home-reference="v40"] .forum-search-hero {
            background-color: #242e23;
          }

          .forum-home[data-home-reference="v40"] .forum-search-hero::before,
          html.dark .forum-home[data-home-reference="v40"] .forum-search-hero::before {
            background: linear-gradient(
              90deg,
              #242e23 0%,
              #242e23 43%,
              #242e2399 62%,
              transparent 85%
            );
          }

          .forum-home[data-home-reference="v40"] .forum-hero-copy {
            width: 73%;
            max-width: 680px;
            padding: 22px;
          }

          .forum-home[data-home-reference="v40"] .forum-hero-copy h1 {
            font-size: clamp(26px, 2.15vw, 34px);
            font-weight: 700;
            letter-spacing: -.035em;
          }

          .forum-home[data-home-reference="v40"] .forum-hero-copy p {
            font-size: 13px;
            font-weight: 400;
          }

          .forum-home[data-home-reference="v40"] .forum-search-hero .forum-hero-stats {
            gap: 18px;
            font-size: 12px;
          }

          .forum-home[data-home-reference="v40"] .forum-topic {
            min-height: 70px;
            grid-template-columns: 36px minmax(0, 1fr) 198px;
            gap: 10px;
            padding: 12px 14px;
            border-color: transparent;
          }

          .forum-home[data-home-reference="v40"] .forum-topic h2 {
            font-size: 15px;
            font-weight: 600;
          }

          .forum-home[data-home-reference="v40"] .forum-topic.is-read h2 {
            font-size: 15px;
            font-weight: 400;
          }

          .forum-home[data-home-reference="v40"] .forum-topic-meta {
            gap: 10px;
          }

          .forum-home[data-home-reference="v40"] .forum-posted {
            font-size: 11px;
            min-width: 50px;
          }

          .forum-home[data-home-reference="v40"] .forum-more-trigger {
            font-size: 22px;
            width: 24px;
          }

          .forum-home[data-home-reference="v40"] .forum-category-chip {
            font-size: 11px;
            padding: 3px 6px;
            background: color-mix(in srgb, var(--chip-accent) 22%, var(--f-panel));
            color: color-mix(in srgb, var(--chip-accent) 44%, #13291e);
          }

          html.dark .forum-home[data-home-reference="v40"] .forum-category-chip {
            background: color-mix(in srgb, var(--chip-accent) 27%, var(--f-panel));
            color: color-mix(in srgb, var(--chip-accent) 30%, #f3f7ed);
          }

          .forum-home[data-home-reference="v40"] .forum-panel {
            padding: 14px;
          }

          .forum-home[data-home-reference="v40"] .forum-author-ranking li {
            min-height: 40px;
          }

          .forum-home[data-home-reference="v40"] .forum-panel h2 {
            font-size: 14px;
            font-weight: 600;
          }

          .forum-home[data-home-reference="v40"] .forum-panel .forum-muted {
            font-size: 12px;
          }

          .forum-home[data-home-reference="v40"] .forum-filter-toggle {
            gap: 0;
          }

          @media (min-width: 761px) and (max-width: 1350px) {
            .forum-home[data-home-reference="v40"] {
              grid-template-columns: 230px minmax(0, 1fr) 260px;
              gap: 12px;
              padding-right: 12px;
            }

            .forum-home[data-home-reference="v40"] .forum-topic {
              grid-template-columns: 32px minmax(0, 1fr);
            }

            .forum-home[data-home-reference="v40"] .forum-topic-meta {
              grid-column: 2;
              grid-row: 2;
            }

            .forum-home[data-home-reference="v40"] .forum-hero-copy {
              width: 85%;
              padding: 20px;
            }
          }

          @media (min-width: 761px) and (max-width: 1050px) {
            .forum-home[data-home-reference="v40"] {
              grid-template-columns: 220px minmax(0, 1fr);
            }

            .forum-home[data-home-reference="v40"] .forum-hero-copy {
              width: 82%;
            }
          }

          @media (max-width: 760px) {
            .forum-home[data-home-reference="v40"] {
              grid-template-columns: minmax(0, 1fr);
              padding: 0 10px 24px;
              gap: 12px;
            }

            .forum-home[data-home-reference="v40"] .forum-sidebar {
              padding: 20px 12px;
            }

            .forum-home[data-home-reference="v40"] .forum-hero-copy {
              width: auto;
              padding: 18px 14px;
            }

            .forum-home[data-home-reference="v40"] .forum-hero-copy h1 {
              font-size: 25px;
            }

            .forum-home[data-home-reference="v40"] .forum-topic {
              grid-template-columns: 30px minmax(0, 1fr);
              min-height: 0;
              gap: 6px 9px;
              padding: 11px;
            }

            .forum-home[data-home-reference="v40"] .forum-topic h2,
            .forum-home[data-home-reference="v40"] .forum-topic.is-read h2 {
              font-size: 14px;
            }

            .forum-home[data-home-reference="v40"] .forum-topic-meta {
              grid-column: 2;
              grid-row: 2;
              gap: 10px;
            }

            .forum-home[data-home-reference="v40"] .forum-posted {
              min-width: 0;
              font-size: 10px;
            }
          }
          """

          (root / 'apps/web/app/home-v41.css').write_text(css)

          p = root / 'apps/web/app/layout.tsx'
          p.write_text(p.read_text().replace(
              "import './home-v40.css';",
              "import './home-v40.css';\nimport './home-v41.css';"
          ))

          p = root / 'apps/web/components/home/category-style.ts'
          p.write_text("""import type { CSSProperties } from 'react';

          export function categoryStyle(slug: string, accent?: string): CSSProperties {
            const palette = [
              '#548e70', '#678baa', '#9b7bae',
              '#b38a61', '#648e94', '#a47786'
            ];
            const hash = Array.from(slug).reduce(
              (sum, char) => sum + char.charCodeAt(0), 0
            );
            const valid = accent && /^#[0-9a-f]{6}$/i.test(accent);
            const channels = valid
              ? [1, 3, 5].map(offset => parseInt(accent!.slice(offset, offset + 2), 16))
              : [];
            const colorful = channels.length === 3
              && Math.max(...channels) - Math.min(...channels) > 40;

            return {
              '--chip-accent': colorful ? accent : palette[hash % palette.length]
            } as CSSProperties;
          }
          """)

          p = root / 'apps/web/components/reference-home.tsx'
          s = p.read_text()
          s = s.replace(
              '{root.name}</span>',
              "{root.name.replace(/^FORRUM\\b/i, '4rrum')}</span>"
          )
          s = s.replace(
              '>{parent.name}</Link>',
              ">{parent.name.replace(/^FORRUM\\b/i, '4rrum')}</Link>"
          )
          s = s.replace(
              '>{item.community.name}</Link>',
              ">{item.community.name.replace(/^FORRUM\\b/i, '4rrum')}</Link>"
          )
          p.write_text(s)
          PYCODE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build -w @forrum/web
      - run: npm run typecheck -w @forrum/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:home

      - name: Подготовить Pull Request
        run: |
          branch="patch/home-v41-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            apps/web/app/home-v41.css \
            apps/web/app/layout.tsx \
            apps/web/components/home/category-style.ts \
            apps/web/components/reference-home.tsx

          git diff --cached --check
          git commit -m 'fix: align homepage proportions with approved reference'
          git push origin "$branch"

          echo "[Создать PR](https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1)" >> "$GITHUB_STEP_SUMMARY"