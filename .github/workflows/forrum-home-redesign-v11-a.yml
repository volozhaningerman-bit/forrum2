name: FORRUM Home Redesign V11.A
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-home-redesign-v11
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Stage A baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/web/app/globals.css
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/components/site-header.tsx
          test -f scripts/ui-interaction-check.mjs

          grep -q 'home-stage-one' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-name-link' apps/web/components/home-dashboard.tsx
          grep -q 'home-tree-expand-surface' apps/web/components/home-dashboard.tsx
          grep -q 'FORRUM_HOME_TREE_REFERENCE_V9_2_4' apps/web/app/globals.css

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Repository is not clean before Stage A.'
            git status --short
            exit 1
          fi

      - name: Apply homepage dark tokens and base surfaces
        shell: bash
        env:
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          python3 <<'PYCODE'
          from pathlib import Path
          import base64
          import os

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode('utf-8')

          css_path = Path('apps/web/app/globals.css')
          check_path = Path('scripts/home-redesign-stage-a-check.mjs')
          doc_path = Path('docs/FORRUM_HOME_REDESIGN_STAGE_A_V11.md')

          stage_css = decode('CSS_B64').strip() + '\n'
          current_css = css_path.read_text(encoding='utf-8')

          start = '/* FORRUM_HOME_REDESIGN_STAGE_A_V11'
          end = '/* /FORRUM_HOME_REDESIGN_STAGE_A_V11 */'

          if start in current_css:
              prefix, remainder = current_css.split(start, 1)
              if end not in remainder:
                  raise RuntimeError('Existing Stage A marker has no closing marker')
              _, suffix = remainder.split(end, 1)
              next_css = prefix.rstrip() + '\n\n' + stage_css + suffix.lstrip('\n')
          else:
              next_css = current_css.rstrip() + '\n\n' + stage_css

          css_path.write_text(next_css, encoding='utf-8')
          check_path.write_text(decode('CHECK_B64'), encoding='utf-8')
          doc_path.parent.mkdir(parents=True, exist_ok=True)
          doc_path.write_text(decode('DOC_B64'), encoding='utf-8')

          print('FORRUM Home Redesign Stage A V11 applied.')
          PYCODE

      - name: Verify Stage A scope and anti-AI contract
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-redesign-stage-a-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/globals\.css|scripts/home-redesign-stage-a-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_A_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files were changed:'
            echo "$unexpected"
            exit 1
          fi

          if git diff -- apps/web/components/home-dashboard.tsx apps/web/components/site-header.tsx apps/web/components/main-nav.tsx | grep -q .; then
            echo 'Stage A changed component structure or header unexpectedly.'
            exit 1
          fi

      - name: Create isolated Stage A commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'FORRUM QA updater'
          git config user.email 'actions@users.noreply.github.com'

          git add -- \
            apps/web/app/globals.css \
            scripts/home-redesign-stage-a-check.mjs \
            docs/FORRUM_HOME_REDESIGN_STAGE_A_V11.md

          unexpected="$(git status --porcelain | grep -Ev '^(M |A |D |R |C |\?\?) (apps/web/app/globals\.css|scripts/home-redesign-stage-a-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_A_V11\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected repository changes before Stage A commit:'
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'Stage A is already present in main.'
          else
            git commit -m 'Add homepage dark design foundation'
          fi

          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Stage A checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-redesign-stage-a-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
