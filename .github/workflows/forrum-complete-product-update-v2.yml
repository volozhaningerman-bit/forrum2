          2. Отдельный канал разрешён для подраздела первого уровня: например GTA RP и Majestic RP.
          3. Для подподраздела канал создаётся по заявке, когда есть стабильный охват, регулярный контент и назначенный куратор.
          4. Куратор может размещать согласованную рекламу. Доход и доли фиксируются в FORRUM, а не в личной переписке.
          
          ## Ограничение Telegram
          
          Обычный Telegram Bot API не позволяет боту самостоятельно создавать канал. Канал создаёт пользователь, после чего добавляет FORRUM-бота администратором через ссылку вида:
          
          `https://t.me/BOT_USERNAME?startchannel&admin=post_messages+edit_messages+delete_messages`
          
          Автоматическое создание канала возможно только через пользовательский MTProto-сеанс. Такой вариант не используется: он требует хранения пользовательской сессии, номера телефона и двухфакторного доступа.
          
          ## Подключение
          
          1. Куратор создаёт канал.
          2. В панели сообщества нажимает «Подключить Telegram».
          3. Добавляет FORRUM-бота администратором.
          4. Вставляет `@username` канала или `chat_id`.
          5. FORRUM отправляет тестовое сообщение.
          6. После подтверждения включается синхронизация.
          
          ## Режимы синхронизации
          
          - `IMPORTANT` — официальные темы, объявления, события, голосования и итоги.
          - `ALL` — все опубликованные темы раздела.
          - `MANUAL` — публикацию отправляет куратор отдельной кнопкой.
          - `OFF` — синхронизация выключена.
          
          Для нового канала режим по умолчанию — `IMPORTANT`.
          
          ## Формат Telegram-публикации
          
          - название раздела;
          - заголовок;
          - короткий фрагмент;
          - автор;
          - тип материала;
          - кнопка «Открыть на FORRUM».
          
          Комментарии и основное обсуждение остаются на FORRUM.
          
          ## Реклама и доход куратора
          
          Рекламная публикация должна содержать:
          
          - заказчика;
          - срок размещения;
          - цену;
          - маркировку рекламы;
          - долю куратора;
          - долю раздела;
          - долю платформы;
          - журнал публикации и удаления.
          
          Реклама не отправляется в Telegram автоматически без подтверждения куратора или администрации.
          
          ## Следующий технический этап
          
          - модель `CommunityTelegramChannel`;
          - API подключения и тестирования канала;
          - панель куратора;
          - очередь синхронизации;
          - повторная отправка при ошибке;
          - журнал Telegram-публикаций;
          - рекламные заказы и распределение дохода.
          }"""
          )
          
