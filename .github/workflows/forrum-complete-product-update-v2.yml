            margin: 0;
          }
          
          .telegram-image-toggle.disabled {
            opacity: .55;
            cursor: default;
          }
          
          .telegram-share-empty {
            display: grid;
            justify-items: start;
            gap: 10px;
            padding: 18px;
            border: 1px dashed var(--line-strong);
            border-radius: 12px;
          }
          
          .telegram-share-empty p {
            margin: 0;
            color: var(--muted);
          }
          
          .telegram-channel-settings {
            display: grid;
            gap: 16px;
          }
          
          .telegram-channel-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
          }
          
          .telegram-channel-heading h2 {
            margin-bottom: 6px;
          }
          
          .telegram-channel-list {
            display: grid;
            gap: 9px;
          }
          
          .telegram-channel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: var(--surface-soft);
          }
          
          .telegram-channel-row > div {
            display: grid;
            gap: 4px;
          }
          
          .telegram-channel-row span {
            color: var(--muted);
            font-size: 13px;
          }
          
          .telegram-channel-row.disabled {
            opacity: .62;
          }
          
          @media (max-width: 560px) {
            .telegram-share-dialog {
              align-self: end;
              width: 100%;
              border-radius: 16px 16px 0 0;
              padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
          
            .telegram-share-backdrop {
              place-items: end center;
              padding: 0;
            }
          
            .telegram-channel-heading,
            .telegram-channel-row {
              align-items: stretch;
              flex-direction: column;
            }
          }
          '''
          
              write(css_path, css)
          else:
              print("Telegram Share styles already present")
          
          write(
              "docs/TELEGRAM_SHARE.md",
              r'''
          # Telegram Share
          
          Telegram Share позволяет авторизованному пользователю опубликовать публичный материал FORRUM в собственный Telegram-канал.
          
          ## Интерфейс
          
          В окне отправки доступны только:
          
          1. выбор подключённого канала;
          2. переключатель «Добавить изображение»;
          3. кнопка «Опубликовать».
          
          В Telegram добавляется заголовок, короткий фрагмент и единственная подпись-ссылка:
          
          `FORRUM →`
          
          ## Подключение канала
          
          1. Пользователь привязывает личный Telegram в настройках FORRUM.
          2. Нажимает «Добавить канал».
          3. Telegram предлагает выбрать канал и добавить FORRUM-бота администратором.
          4. Боту запрашивается только право `post_messages`.
          5. Канал появляется в настройках и в окне Telegram Share.
          
          ## Переменные окружения API
          
          - `TELEGRAM_BOT_TOKEN` — токен от BotFather.
          - `TELEGRAM_BOT_USERNAME` — username бота без обязательного символа `@`.
          - `TELEGRAM_POLLING_ENABLED=true` — получение привязок каналов.
          - `WEB_URL` — публичный адрес сайта FORRUM.
          
          ## Ограничения MVP
          
          - работают только публичные публикации со статусом `PUBLISHED`;
          - до 30 отправок в час на пользователя;
          - повтор одной публикации в тот же канал блокируется на 2 минуты;
          - изображение берётся из первого BBCode-блока `[img]`;
          - при ошибке отправки изображения публикация отправляется без него;
          - комментарии и обсуждение остаются на FORRUM.
          ''',
          )
          PY

      - name: Remove superseded Telegram architecture note
        shell: bash
        run: |
          rm -f docs/TELEGRAM_COMMUNITY_CHANNELS.md

      - name: Verify expected source changes
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/app/media/page.tsx
          test -f apps/web/components/telegram-share-button.tsx
          test -f 'apps/web/app/api/[...path]/route.ts'
          test -f docs/TELEGRAM_SHARE.md
          grep -q "Фото или скриншот" apps/web/app/interactions/page.tsx
          grep -q "Объявления" apps/web/app/events/page.tsx
          grep -q "Медиа" apps/web/components/main-nav.tsx
          grep -q "FORRUM →" apps/web/components/telegram-share-button.tsx
          grep -q "В Telegram" apps/web/components/telegram-share-button.tsx
          grep -q "Добавить изображение" apps/web/components/telegram-share-button.tsx
          grep -q "model TelegramChannel" apps/api/prisma/schema.prisma
          grep -q "evidenceMediaId" apps/api/prisma/schema.prisma

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate Prisma client
        run: npm run db:generate -w @forrum/api

      - name: Validate and sync test database
        run: |
          npm run db:validate -w @forrum/api
          npm run db:push -w @forrum/api

      - name: Build contracts
        run: npm run build -w @forrum/contracts

      - name: Build API
        run: npm run build -w @forrum/api

      - name: Build web
        run: npm run build -w @forrum/web

      - name: Smoke test API and web
        shell: bash
        run: |
          set -euo pipefail

          npm run start -w @forrum/api > /tmp/forrum-api.log 2>&1 &
          API_PID=$!

          npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" "$API_PID" 2>/dev/null || true
            wait "$WEB_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent --show-error http://127.0.0.1:3000/events > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:3000/media > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:3000/settings/telegram > /dev/null
              exit 0
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API stopped before becoming healthy"
              cat /tmp/forrum-api.log
              exit 1
            fi

            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "Web stopped before becoming healthy"
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          echo "Smoke test timed out"
          cat /tmp/forrum-api.log
          cat /tmp/forrum-web.log
          exit 1

      - name: Commit complete verified update
        shell: bash
        run: |
          git diff --check
          git config user.name "FORRUM build fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A apps docs

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply product feedback and Telegram Share"
            git push
          fi
