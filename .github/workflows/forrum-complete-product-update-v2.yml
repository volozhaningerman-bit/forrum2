name: FORRUM Complete Product Update v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forrum
          POSTGRES_PASSWORD: forrum
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forrum -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://forrum:forrum@localhost:5432/forrum
      NODE_ENV: test
      API_PORT: "4000"
      PORT: "3000"
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:4000/v1
      PUBLIC_API_URL: http://127.0.0.1:4000
      SESSION_COOKIE_NAME: forrum_session
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: FORRUM <noreply@forrum.test>
      TELEGRAM_POLLING_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply product and profile changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")
          
          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text.rstrip() + "\n", encoding="utf-8")
              print(f"updated: {path}")
          
          def replace_once(path: str, old: str, new: str) -> None:
              import re

              text = read(path)

              if old in text:
                  write(path, text.replace(old, new, 1))
                  return

              if new in text:
                  print(f"already updated: {path}")
                  return

              # Source files may differ only by indentation or line endings.
              tokens = re.split(r"(\s+)", old.strip())
              pattern = "".join(r"\s+" if token.isspace() else re.escape(token) for token in tokens)
              match = re.search(pattern, text, flags=re.MULTILINE)

              if not match:
                  raise SystemExit(f"Expected fragment was not found in {path}")

              write(path, text[:match.start()] + new + text[match.end():])
          
          # ------------------------------------------------------------------
          # 1. Reviews: optional screenshot evidence stored as a MediaAsset.
          # ------------------------------------------------------------------
          replace_once(
              "apps/api/prisma/schema.prisma",
              """  workshopPreviews WorkshopItem[]
              @@index([ownerId, createdAt(sort: Desc)])""",
              """  workshopPreviews WorkshopItem[]
              reviewEvidence   ProfileReview[]
              @@index([ownerId, createdAt(sort: Desc)])"""
          )
          
          old_review_model = """model ProfileReview {
            id            String          @id @default(uuid()) @db.Uuid
            interactionId String          @db.Uuid
            authorId      String          @db.Uuid
            targetId      String          @db.Uuid
            verdict       ReviewVerdict
            body          String
            createdAt     DateTime        @default(now())
            updatedAt     DateTime        @updatedAt
            interaction   ConfirmedInteraction @relation(fields: [interactionId], references: [id], onDelete: Cascade)
            author        User            @relation("ReviewAuthor", fields: [authorId], references: [id], onDelete: Cascade)
            target        User            @relation("ReviewTarget", fields: [targetId], references: [id], onDelete: Cascade)
            @@unique([interactionId, authorId])
            @@index([targetId, createdAt(sort: Desc)])
            @@index([authorId, createdAt(sort: Desc)])
          }"""
          new_review_model = """model ProfileReview {
            id              String          @id @default(uuid()) @db.Uuid
            interactionId   String          @db.Uuid
            authorId        String          @db.Uuid
            targetId        String          @db.Uuid
            evidenceMediaId String?         @db.Uuid
            verdict         ReviewVerdict
            body            String
            createdAt       DateTime        @default(now())
            updatedAt       DateTime        @updatedAt
            interaction     ConfirmedInteraction @relation(fields: [interactionId], references: [id], onDelete: Cascade)
            author          User            @relation("ReviewAuthor", fields: [authorId], references: [id], onDelete: Cascade)
            target          User            @relation("ReviewTarget", fields: [targetId], references: [id], onDelete: Cascade)
            evidenceMedia   MediaAsset?      @relation(fields: [evidenceMediaId], references: [id], onDelete: SetNull)
            @@unique([interactionId, authorId])
            @@index([targetId, createdAt(sort: Desc)])
            @@index([authorId, createdAt(sort: Desc)])
            @@index([evidenceMediaId])
          }"""
          replace_once("apps/api/prisma/schema.prisma", old_review_model, new_review_model)
          
          write(
              "apps/api/src/interactions/dto.ts",
              """import { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';
          import { IsEnum, IsOptional, IsString, IsUUID, Length } from 'class-validator';
          import { InteractionType, ReviewVerdict } from '../generated/prisma/client.js';
          
          export class CreateInteractionDto {
            @ApiProperty() @IsString() @Length(2, 40) targetUsername!: string;
            @ApiProperty({ enum: InteractionType }) @IsEnum(InteractionType) type!: InteractionType;
            @ApiProperty() @IsString() @Length(4, 140) title!: string;
            @ApiProperty() @IsString() @Length(10, 2000) description!: string;
            @ApiPropertyOptional() @IsOptional() @IsString() @Length(1, 180) publicationSlug?: string;
            @ApiPropertyOptional() @IsOptional() @IsString() @Length(1, 100) communitySlug?: string;
            @ApiPropertyOptional() @IsOptional() @IsString() portfolioItemId?: string;
          }
          
          export class CancelInteractionDto {
            @ApiPropertyOptional() @IsOptional() @IsString() @Length(0, 500) reason?: string;
          }
          
          export class CreateProfileReviewDto {
            @ApiProperty({ enum: ReviewVerdict }) @IsEnum(ReviewVerdict) verdict!: ReviewVerdict;
            @ApiProperty() @IsString() @Length(10, 2000) body!: string;
            @ApiPropertyOptional() @IsOptional() @IsUUID() evidenceMediaId?: string;
          }"""
          )
          
          write(
              "apps/api/src/interactions/interactions.controller.ts",
              """import { Body, Controller, Get, Param, Post, UseGuards } from '@nestjs/common';
          import { ApiTags } from '@nestjs/swagger';
          import type { User } from '../generated/prisma/client.js';
          import { CurrentUser } from '../auth/current-user.js';
          import { SessionGuard } from '../auth/session.guard.js';
          import { VerifiedGuard } from '../auth/verified.guard.js';
          import { CancelInteractionDto, CreateInteractionDto, CreateProfileReviewDto } from './dto.js';
          import { InteractionsService } from './interactions.service.js';
          
          @ApiTags('interactions')
          @Controller('interactions')
          @UseGuards(SessionGuard, VerifiedGuard)
          export class InteractionsController {
            constructor(private readonly service: InteractionsService) {}
          
            @Get()
            list(@CurrentUser() user: User) {
              return this.service.list(user.id);
            }
          
            @Post()
            create(@CurrentUser() user: User, @Body() dto: CreateInteractionDto) {
              return this.service.create(user.id, dto);
            }
          
            @Post(':id/confirm')
            confirm(@Param('id') id: string, @CurrentUser() user: User) {
              return this.service.confirm(id, user.id);
            }
          
            @Post(':id/complete')
            complete(@Param('id') id: string, @CurrentUser() user: User) {
              return this.service.complete(id, user.id);
            }
          
            @Post(':id/cancel')
            cancel(@Param('id') id: string, @CurrentUser() user: User, @Body() dto: CancelInteractionDto) {
              return this.service.cancel(id, user.id, dto.reason);
            }
          
            @Post(':id/reviews')
            review(@Param('id') id: string, @CurrentUser() user: User, @Body() dto: CreateProfileReviewDto) {
              return this.service.review(id, user.id, dto.verdict, dto.body, dto.evidenceMediaId);
            }
          }"""
          )
          
          replace_once(
              "apps/api/src/interactions/interactions.service.ts",
              """import { InteractionStatus, NotificationType, type InteractionType, type ReviewVerdict } from '../generated/prisma/client.js';""",
              """import { InteractionStatus, MediaKind, NotificationType, type InteractionType, type ReviewVerdict } from '../generated/prisma/client.js';"""
          )
          replace_once(
              "apps/api/src/interactions/interactions.service.ts",
              """reviews: { where: { authorId: userId }, select: { id: true, verdict: true, body: true, createdAt: true } },""",
              """reviews: { where: { authorId: userId }, select: { id: true, verdict: true, body: true, evidenceMediaId: true, createdAt: true } },"""
          )
          
          service_text = read("apps/api/src/interactions/interactions.service.ts")
          start = service_text.find("  async review(id: string")
          end = service_text.find("\n  }\n}", start)
          if start == -1 or end == -1:
              raise SystemExit("InteractionsService.review was not found")
          replacement = """  async review(id: string, actorId: string, verdict: ReviewVerdict, bodyInput: string, evidenceMediaId?: string) {
            const row = await this.prisma.confirmedInteraction.findUnique({ where: { id } });
            if (!row) throw new NotFoundException('Взаимодействие не найдено');
          
            const participant = row.createdById === actorId || row.counterpartId === actorId;
            const alreadyReviewed = Boolean(await this.prisma.profileReview.findUnique({
              where: { interactionId_authorId: { interactionId: id, authorId: actorId } },
              select: { id: true },
            }));
          
            if (!reviewAllowed({ status: row.status, participant, alreadyReviewed })) {
              if (!participant) throw new ForbiddenException('Нет доступа к этому взаимодействию');
              if (alreadyReviewed) throw new BadRequestException('Вы уже оставили отзыв по этому взаимодействию');
              throw new BadRequestException('Отзыв доступен только после подтверждённого завершения');
            }
          
            const evidence = evidenceMediaId
              ? await this.prisma.mediaAsset.findFirst({
                  where: { id: evidenceMediaId, ownerId: actorId, kind: MediaKind.POST_IMAGE },
                  select: { id: true },
                })
              : null;
          
            if (evidenceMediaId && !evidence) {
              throw new BadRequestException('Приложенное изображение недоступно или принадлежит другому пользователю');
            }
          
            const targetId = row.createdById === actorId ? row.counterpartId : row.createdById;
            const review = await this.prisma.$transaction(async (tx) => {
              const result = await tx.profileReview.create({
                data: {
                  interactionId: id,
                  authorId: actorId,
                  targetId,
                  verdict,
                  body: bodyInput.trim(),
                  evidenceMediaId: evidence?.id ?? null,
                },
              });
          
              await tx.auditLog.create({
                data: {
                  actorId,
                  action: 'review.create',
                  entityType: 'ProfileReview',
                  entityId: result.id,
                  metadata: { interactionId: id, verdict, evidenceAttached: Boolean(evidence) },
                },
              });
          
              await this.notifications.deliver({
                userId: targetId,
                actorId,
                type: NotificationType.SYSTEM,
                title: 'Новый подтверждённый отзыв',
                body: excerpt(bodyInput, 120),
                href: '/interactions',
              }, tx);
          
              return result;
            }).catch((error: { code?: string }) => {
              if (error?.code === 'P2002') throw new BadRequestException('Вы уже оставили отзыв по этому взаимодействию');
              throw error;
            });
          
            return { id: review.id };
          }"""
          write(
              "apps/api/src/interactions/interactions.service.ts",
              service_text[:start] + replacement + service_text[end + len("\n  }"):]
          )
          
          replace_once(
              "apps/api/src/users/users.service.ts",
              """include: {
                    author: { select: { username: true, displayName: true, avatarUrl: true } },""",
              """include: {
                    evidenceMedia: { select: { id: true } },
                    author: { select: { username: true, displayName: true, avatarUrl: true } },"""
          )
          replace_once(
              "apps/api/src/users/users.service.ts",
              """id: review.id, verdict: review.verdict, body: review.body, createdAt: review.createdAt,
                    author: review.author,""",
              """id: review.id, verdict: review.verdict, body: review.body, createdAt: review.createdAt,
                    evidenceAttached: Boolean(review.evidenceMedia),
                    author: review.author,"""
          )
          
          write(
              "apps/web/app/interactions/page.tsx",
              """'use client';
          
          import Link from 'next/link';
          import type { FormEvent } from 'react';
          import { useEffect, useMemo, useState } from 'react';
          import { Avatar } from '@/components/avatar';
          import { api } from '@/lib/api';
          import { formatRelativeTime } from '@/lib/format';
          
          type Interaction = {
            id: string;
            type: string;
            status: 'PENDING' | 'CONFIRMED' | 'COMPLETED' | 'CANCELLED';
            title: string;
            description: string;
            createdAt: string;
            updatedAt: string;
            completedAt: string | null;
            viewerRole: 'CREATOR' | 'COUNTERPART';
            viewerConfirmed: boolean;
            otherConfirmed: boolean;
            viewerCompleted: boolean;
            otherCompleted: boolean;
            otherUser: { username: string; displayName: string; avatarUrl: string | null };
            community: { slug: string; name: string } | null;
            publication: { slug: string; title: string | null } | null;
            portfolioItem: { id: string; kind: string; title: string } | null;
            review: { id: string; verdict: string; body: string; evidenceMediaId: string | null; createdAt: string } | null;
          };
          
          type UploadedMedia = {
            id: string;
            url: string;
            thumbnailUrl: string;
          };
          
          const statusNames: Record<string, string> = {
            PENDING: 'Ждёт подтверждения',
            CONFIRMED: 'Подтверждено',
            COMPLETED: 'Завершено',
            CANCELLED: 'Отменено',
          };
          
          const typeNames: Record<string, string> = {
            SERVICE: 'Услуга',
            PROJECT: 'Совместный проект',
            DEAL: 'Сделка',
            HELP: 'Подтверждённая помощь',
          };
          
          function fileToDataUrl(file: File) {
            return new Promise<string>((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result));
              reader.onerror = () => reject(new Error('Не удалось прочитать изображение'));
              reader.readAsDataURL(file);
            });
          }
          
          export default function InteractionsPage() {
            const [items, setItems] = useState<Interaction[]>([]);
            const [filter, setFilter] = useState<'active' | 'completed' | 'all'>('active');
            const [error, setError] = useState('');
            const [notice, setNotice] = useState('');
            const [loading, setLoading] = useState(true);
            const [reviewingId, setReviewingId] = useState<string | null>(null);
            const [submittingReview, setSubmittingReview] = useState(false);
          
            const load = async () => {
              try {
                setError('');
                setItems(await api<Interaction[]>('/interactions'));
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : 'Не удалось загрузить взаимодействия');
              } finally {
                setLoading(false);
              }
            };
          
            useEffect(() => {
              void load();
            }, []);
          
            const shown = useMemo(
              () => items.filter((item) => filter === 'all' || (filter === 'completed' ? item.status === 'COMPLETED' : ['PENDING', 'CONFIRMED'].includes(item.status))),
              [items, filter],
            );
          
            async function action(id: string, kind: 'confirm' | 'complete' | 'cancel') {
              try {
                setError('');
                await api(`/interactions/${id}/${kind}`, {
                  method: 'POST',
                  body: JSON.stringify(kind === 'cancel' ? { reason: 'Отменено участником' } : {}),
                });
                setNotice(kind === 'confirm' ? 'Взаимодействие подтверждено' : kind === 'complete' ? 'Подтверждение завершения сохранено' : 'Взаимодействие отменено');
                await load();
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : 'Не удалось выполнить действие');
              }
            }
          
            async function review(event: FormEvent<HTMLFormElement>, item: Interaction) {
              event.preventDefault();
              if (submittingReview) return;
          
              const form = new FormData(event.currentTarget);
              const evidence = form.get('evidence');
              setSubmittingReview(true);
          
              try {
                setError('');
                let evidenceMediaId: string | undefined;
          
                if (evidence instanceof File && evidence.size > 0) {
                  if (evidence.size > 8 * 1024 * 1024) throw new Error('Изображение больше 8 МБ');
                  if (!['image/png', 'image/jpeg', 'image/webp'].includes(evidence.type)) {
                    throw new Error('Разрешены только PNG, JPEG и WebP');
                  }
          
                  const uploaded = await api<UploadedMedia>('/media', {
                    method: 'POST',
                    body: JSON.stringify({
                      kind: 'POST_IMAGE',
                      originalName: evidence.name,
                      dataUrl: await fileToDataUrl(evidence),
                    }),
                  });
                  evidenceMediaId = uploaded.id;
                }
          
                await api(`/interactions/${item.id}/reviews`, {
                  method: 'POST',
                  body: JSON.stringify({
                    verdict: form.get('verdict'),
                    body: form.get('body'),
                    evidenceMediaId,
                  }),
                });
          
                setReviewingId(null);
                setNotice('Отзыв опубликован. Приложенное фото сохранено как подтверждение.');
                await load();
              } catch (cause) {
                setError(cause instanceof Error ? cause.message : 'Не удалось оставить отзыв');
              } finally {
                setSubmittingReview(false);
              }
            }
          
            return <div className="interactions-page">
              <header className="page-heading">
                <div>
                  <span className="eyebrow">Личный раздел</span>
                  <h1>Подтверждённые взаимодействия</h1>
                  <p>Фиксируйте услуги, совместные проекты, сделки и помощь. Отзыв становится доступен только после подтверждения обеими сторонами и завершения.</p>
                </div>
              </header>
          
              {notice && <div className="success-box" role="status">{notice}</div>}
              {error && <div className="error-box" role="alert">{error}</div>}
          
              <nav className="segmented-tabs" aria-label="Фильтр взаимодействий">
                <button type="button" className={filter === 'active' ? 'active' : ''} onClick={() => setFilter('active')}>Активные</button>
                <button type="button" className={filter === 'completed' ? 'active' : ''} onClick={() => setFilter('completed')}>Завершённые</button>
                <button type="button" className={filter === 'all' ? 'active' : ''} onClick={() => setFilter('all')}>Все</button>
              </nav>
          
              {loading ? <div className="interaction-list"><div className="skeleton tall"/><div className="skeleton tall"/></div> : <div className="interaction-list">
                {shown.map((item) => <article className={`interaction-card status-${item.status.toLowerCase()}`} key={item.id}>
                  <header>
                    <div className="interaction-person">
                      <Avatar name={item.otherUser.displayName} size={46} url={item.otherUser.avatarUrl}/>
                      <div>
                        <Link href={`/u/${item.otherUser.username}`}><strong>{item.otherUser.displayName}</strong></Link>
                        <span>@{item.otherUser.username}</span>
                      </div>
                    </div>
                    <div className="interaction-status">
                      <span>{statusNames[item.status]}</span>
                      <small>{formatRelativeTime(item.updatedAt)}</small>
                    </div>
                  </header>
          
                  <div className="interaction-body">
                    <span className="type-label">{typeNames[item.type] ?? item.type}</span>
                    <h2>{item.title}</h2>
                    <p>{item.description}</p>
                    <div className="interaction-links">
                      {item.community && <Link href={`/communities/${item.community.slug}`}>{item.community.name}</Link>}
                      {item.publication && <Link href={`/p/${item.publication.slug}`}>Связанная публикация</Link>}
                      {item.portfolioItem && <Link href={`/portfolio/${item.portfolioItem.id}`}>{item.portfolioItem.kind === 'SERVICE' ? 'Связанная услуга' : 'Связанный проект'}</Link>}
                    </div>
                  </div>
          
                  <div className="interaction-confirmation-grid">
                    <div className={item.viewerConfirmed ? 'done' : ''}><strong>Вы подтвердили</strong><span>{item.viewerConfirmed ? 'Да' : 'Нет'}</span></div>
                    <div className={item.otherConfirmed ? 'done' : ''}><strong>Вторая сторона</strong><span>{item.otherConfirmed ? 'Подтвердила' : 'Ожидается'}</span></div>
                    <div className={item.viewerCompleted ? 'done' : ''}><strong>Вы завершили</strong><span>{item.viewerCompleted ? 'Да' : 'Нет'}</span></div>
                    <div className={item.otherCompleted ? 'done' : ''}><strong>Вторая сторона</strong><span>{item.otherCompleted ? 'Завершила' : 'Ожидается'}</span></div>
                  </div>
          
                  <footer>
                    {item.status === 'PENDING' && item.viewerRole === 'COUNTERPART' && <button type="button" className="button small" onClick={() => action(item.id, 'confirm')}>Подтвердить факт</button>}
                    {item.status === 'CONFIRMED' && !item.viewerCompleted && <button type="button" className="button small" onClick={() => action(item.id, 'complete')}>Подтвердить завершение</button>}
                    {['PENDING', 'CONFIRMED'].includes(item.status) && <button type="button" className="button ghost small danger-text" onClick={() => action(item.id, 'cancel')}>Отменить</button>}
                    {item.status === 'COMPLETED' && !item.review && <button type="button" className="button secondary small" onClick={() => setReviewingId(reviewingId === item.id ? null : item.id)}>Оставить отзыв</button>}
                    {item.review && <span className="verified-review-note">Ваш отзыв опубликован{item.review.evidenceMediaId ? ' · фото приложено' : ''}</span>}
                  </footer>
          
                  {reviewingId === item.id && <form className="interaction-review-form" onSubmit={(event) => review(event, item)}>
                    <label>
                      Итог взаимодействия
                      <select name="verdict" defaultValue="POSITIVE">
                        <option value="POSITIVE">Положительный</option>
                        <option value="NEUTRAL">Нейтральный</option>
                        <option value="NEGATIVE">Негативный</option>
                      </select>
                    </label>
                    <label>
                      Конкретный отзыв
                      <textarea name="body" minLength={10} maxLength={2000} placeholder="Опишите результат и важные факты без личных и платёжных данных" required/>
                    </label>
                    <label>
                      Фото или скриншот <span className="optional-label">желательно</span>
                      <input name="evidence" type="file" accept="image/png,image/jpeg,image/webp"/>
                    </label>
                    <div className="warning-box review-evidence-warning">
                      Перед загрузкой закройте лишние имена, аватары, телефоны, адреса, реквизиты и части личной переписки. Отзыв может не пройти модерацию, если на изображении видны посторонние люди или данные, не относящиеся к отзыву.
                    </div>
                    <button className="button small" disabled={submittingReview}>{submittingReview ? 'Сохраняем…' : 'Опубликовать отзыв'}</button>
                  </form>}
                </article>)}
          
                {!shown.length && <div className="empty-state">
                  <strong>Здесь пока ничего нет</strong>
                  <span>{filter === 'active' ? 'Новый запрос создаётся из профиля другого пользователя.' : 'Завершённые взаимодействия появятся после подтверждения обеими сторонами.'}</span>
                </div>}
              </div>}
            </div>;
          }"""
          )
          
          replace_once(
              "apps/web/app/u/[username]/page.tsx",
              """id: string; verdict: 'POSITIVE' | 'NEUTRAL' | 'NEGATIVE'; body: string; createdAt: string;""",
              """id: string; verdict: 'POSITIVE' | 'NEUTRAL' | 'NEGATIVE'; body: string; evidenceAttached: boolean; createdAt: string;"""
          )
          replace_once(
              "apps/web/app/u/[username]/page.tsx",
              """>Полезное</button>""",
              """>Избранное</button>"""
          )
          replace_once(
