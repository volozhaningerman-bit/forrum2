          python3 <<'PY'
          from pathlib import Path
          
          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")
          
          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + "\n", encoding="utf-8")
              print(f"updated: {path}")
          
          def replace_once(path: str, old: str, new: str) -> None:
              import re

              text = read(path)

              if old in text:
                  write(path, text.replace(old, new, 1))
                  return

              if new in text:
                  print(f"already updated: {path}")
                  return

              # Source files may differ only by indentation or line endings.
              tokens = re.split(r"(\s+)", old.strip())
              pattern = "".join(r"\s+" if token.isspace() else re.escape(token) for token in tokens)
              match = re.search(pattern, text, flags=re.MULTILINE)

              if not match:
                  raise SystemExit(f"Expected fragment was not found in {path}")

              write(path, text[:match.start()] + new + text[match.end():])
          
