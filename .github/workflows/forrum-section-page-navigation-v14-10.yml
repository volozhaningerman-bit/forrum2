name: FORRUM Section Page Navigation V14.10
run-name: FORRUM Section Page Navigation V14.10

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forrum-section-page-navigation-v14-10
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'

jobs:
  section-page-navigation-v14-10:
    name: Section Page Navigation V14.10
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact successful V14.8 baseline
        shell: bash
        run: |
          set -euo pipefail

          PAGE='apps/web/app/communities/[slug]/category-page.tsx'

          test -f "$PAGE"
          test -f scripts/section-page-layout-v14-7-check.mjs
          test -f scripts/section-page-polish-v14-8-check.mjs

          grep -Fq 'FORRUM_SECTION_PAGE_POLISH_V14_8' "$PAGE"
          grep -Fq 'FORRUM_SECTION_PAGE_POLISH_V14_8' \
            apps/web/app/globals.css
          grep -Fq 'FORRUM_GLOBAL_HEADER_V13_4' \
            apps/web/components/main-nav.tsx

          if grep -Fq 'FORRUM_SECTION_PAGE_NAVIGATION_V14_10' "$PAGE"; then
            echo 'V14.10 is already present on main.'
            exit 1
          fi

          ACTUAL_SHA="$(sha256sum "$PAGE" | awk '{print $1}')"
          EXPECTED_SHA='d68b6cc4c85c8694482883b933441c5334b60d087653ab894940cd601f4589ae'

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo 'The category page is not the exact successful V14.8 baseline.'
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs

          test -z "$(git status --porcelain)"

      - name: Apply Section Page Navigation V14.10
        shell: bash
        env:
          PAGE_B64: 
          CSS_B64: 
          CHECK_B64: 
          DOC_B64: 
        run: |
          set -euo pipefail

          PAGE='apps/web/app/communities/[slug]/category-page.tsx'

          printf '%s' "$PAGE_B64" | base64 -d > "$PAGE"

          if grep -Fq 'FORRUM_SECTION_PAGE_NAVIGATION_V14_10' \
            apps/web/app/globals.css; then
            echo 'V14.10 CSS marker unexpectedly already exists.'
            exit 1
          fi

          printf '\n%s\n' "$(printf '%s' "$CSS_B64" | base64 -d)" \
            >> apps/web/app/globals.css

          printf '%s' "$CHECK_B64" | base64 -d \
            > scripts/section-page-navigation-v14-10-check.mjs

          printf '%s' "$DOC_B64" | base64 -d \
            > docs/FORRUM_SECTION_PAGE_NAVIGATION_V14_10.md

          ACTUAL_SHA="$(sha256sum "$PAGE" | awk '{print $1}')"
          EXPECTED_SHA='c03c28b596680839eefbf3d6394a423e45ade5cb078f7ff825a441456d768927'
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Verify V14.10 source and protected scope
        shell: bash
        run: |
          set -euo pipefail

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-page-navigation-v14-10-check.mjs
          node scripts/global-header-v13-4-check.mjs

          node scripts/communities-redesign-stage-a-check.mjs
          node scripts/communities-redesign-stage-b-check.mjs
          node scripts/communities-redesign-stage-c-check.mjs
          node scripts/communities-redesign-stage-d-check.mjs
          node scripts/communities-redesign-stage-e-check.mjs
          node scripts/communities-redesign-stage-f-check.mjs
          node scripts/communities-redesign-stage-f2-check.mjs
          node scripts/communities-redesign-stage-f3-check.mjs
          node scripts/communities-redesign-stage-f4-check.mjs
          node scripts/communities-redesign-stage-f5-check.mjs

          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/ui-interaction-check.mjs

          git diff --check

          unexpected=''
          while IFS= read -r changed_path; do
            case "$changed_path" in
              'apps/web/app/communities/[slug]/category-page.tsx' \
              |'apps/web/app/globals.css' \
              |'scripts/section-page-navigation-v14-10-check.mjs' \
              |'docs/FORRUM_SECTION_PAGE_NAVIGATION_V14_10.md')
                ;;
              *)
                unexpected+="${changed_path}"$'\n'
                ;;
            esac
          done < <(git diff --name-only)

          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            printf '%s' "$unexpected"
            exit 1
          fi

          if git diff -- \
            apps/web/components/main-nav.tsx \
            apps/web/components/site-header.tsx \
            apps/web/components/site-footer.tsx \
            apps/web/components/home-dashboard.tsx \
            apps/web/app/communities/communities-client.tsx \
            apps/web/app/page.tsx \
            apps/api/src \
            apps/api/prisma | grep -q .; then
            echo 'V14.10 changed protected catalogue/home/header/backend scope.'
            exit 1
          fi

      - name: Create isolated verified V14.10 commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'FORRUM QA updater'
          git config user.email 'actions@users.noreply.github.com'

          git add -- \
            'apps/web/app/communities/[slug]/category-page.tsx' \
            apps/web/app/globals.css \
            scripts/section-page-navigation-v14-10-check.mjs \
            docs/FORRUM_SECTION_PAGE_NAVIGATION_V14_10.md

          git commit -m 'Add section date and pagination V14.10'
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies without creating a lock file
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          test ! -f package-lock.json

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and V14.10 checks
        shell: bash
        run: |
          set -euo pipefail

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          node scripts/category-page-stage-1-v14-check.mjs
          node scripts/section-page-header-v14-3-check.mjs
          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-page-navigation-v14-10-check.mjs
          node scripts/global-header-v13-4-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Clean production build
        run: npm run build

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Section Page Navigation V14.10
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show \
            'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \
            | grep -Fq 'FORRUM_SECTION_PAGE_NAVIGATION_V14_10'

          git show \
            'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \
            | grep -Fq '<span>Дата</span>'

          git show \
            'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \
            | grep -Fq 'dateTime={item.createdAt}'

          git show \
            'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \
            | grep -Fq 'const TOPICS_PER_PAGE = 20;'

          git show origin/main:apps/web/app/globals.css \
            | grep -Fq 'FORRUM_SECTION_PAGE_NAVIGATION_V14_10'

          git show origin/main:apps/web/app/globals.css \
            | grep -Fq 'cursor: default !important;'

          git show origin/main:apps/web/components/main-nav.tsx \
            | grep -Fq 'FORRUM_GLOBAL_HEADER_V13_4'

          node scripts/section-page-layout-v14-7-check.mjs
          node scripts/section-page-polish-v14-8-check.mjs
          node scripts/section-page-navigation-v14-10-check.mjs

          echo \
            'FORRUM Section Page Navigation V14.10 remote verification passed.'
