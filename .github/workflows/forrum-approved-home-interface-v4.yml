      - name: Verify exact interface markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "FORRUM APPROVED LIGHT FORUM BASE V4" apps/web/app/globals.css
          grep -q "Лента обсуждений" apps/web/components/home-dashboard.tsx
          grep -q "home-community-tree" apps/web/components/home-dashboard.tsx
          grep -q "Новое в Мастерской" apps/web/components/home-dashboard.tsx
          grep -q "Новые сообщества" apps/web/components/home-dashboard.tsx
          grep -q "header-search" apps/web/components/site-header.tsx
          grep -q "рабочая форумная панель" docs/FORRUM_HOME_UI_BASE.md

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Static and UX checks
        run: |
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

      - name: Typecheck web
        run: npm run typecheck -w @forrum/web

      - name: First production build
        run: npm run build -w @forrum/contracts && npm run build -w @forrum/web

      - name: Start and smoke test homepage
        shell: bash
        run: |
          set -euo pipefail

          npm run start -w @forrum/web > /tmp/forrum-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" 2>/dev/null || true
            wait "$WEB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/forrum-home.html; then
              grep -q "FORRUM" /tmp/forrum-home.html
              grep -q "Главная" /tmp/forrum-home.html
              exit 0
            fi

            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              cat /tmp/forrum-web.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/forrum-web.log
          exit 1

      - name: Second clean build
        shell: bash
        run: |
          rm -rf apps/web/.next
          npm run build -w @forrum/web

      - name: Final repository checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit verified interface
        shell: bash
        run: |
          git config user.name "FORRUM interface updater"
          git config user.email "actions@users.noreply.github.com"

          git add             apps/web/components/site-header.tsx             apps/web/components/home-dashboard.tsx             apps/web/app/globals.css             docs/FORRUM_HOME_UI_BASE.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply approved compact forum homepage"
            git push
          fi
