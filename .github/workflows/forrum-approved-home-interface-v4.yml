name: FORRUM Approved Home Interface V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign-build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: "3000"
      API_INTERNAL_URL: http://127.0.0.1:4000/v1
      PUBLIC_API_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Apply approved forum interface
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          
          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + "\n", encoding="utf-8")
              print(f"updated: {path}")
          
          write(
              "apps/web/components/site-header.tsx",
              "import Link from 'next/link';\nimport { AuthActions } from './auth-actions';\nimport {\n  GridIcon,\n  HomeIcon,\n  MessageIcon,\n  PlusIcon,\n  SearchIcon,\n} from './icons';\nimport { NavCounters } from './nav-counters';\nimport { MainNav } from './main-nav';\n\nexport function SiteHeader() {\n  return (\n    <>\n      <header className=\"header\">\n        <div className=\"shell nav\">\n          <Link className=\"brand\" href=\"/\">\n            <span className=\"brand-mark\">F</span>\n            <span>FORRUM</span>\n          </Link>\n\n          <MainNav />\n\n          <span className=\"grow\" />\n\n          <form\n            className=\"header-search\"\n            action=\"/search\"\n            role=\"search\"\n          >\n            <input\n              name=\"q\"\n              aria-label=\"Поиск по FORRUM\"\n              placeholder=\"Поиск по форуму, темам и сообщениям…\"\n            />\n            <button type=\"submit\" aria-label=\"Найти\">\n              <SearchIcon />\n            </button>\n          </form>\n\n          <nav\n            className=\"icon-links\"\n            aria-label=\"Быстрые действия\"\n          >\n            <NavCounters />\n          </nav>\n\n          <AuthActions />\n        </div>\n      </header>\n\n      <nav\n        className=\"mobile-nav\"\n        aria-label=\"Навигация на телефоне\"\n      >\n        <Link href=\"/\">\n          <HomeIcon />\n          <span>Главная</span>\n        </Link>\n        <Link href=\"/communities\">\n          <GridIcon />\n          <span>Сообщества</span>\n        </Link>\n        <Link className=\"mobile-create\" href=\"/create\">\n          <PlusIcon />\n          <span>Создать</span>\n        </Link>\n        <Link href=\"/search\">\n          <SearchIcon />\n          <span>Поиск</span>\n        </Link>\n        <Link href=\"/messages\">\n          <MessageIcon />\n          <span>Сообщения</span>\n        </Link>\n      </nav>\n    </>\n  );\n}\n",
          )
          
          write(
              "apps/web/components/home-dashboard.tsx",
              "'use client';\n\nimport Link from 'next/link';\nimport {\n  useEffect,\n  useMemo,\n  useState,\n} from 'react';\nimport { api } from '@/lib/api';\nimport type { PublicationCardData } from '@/lib/types';\n\ntype Community = {\n  id: string;\n  slug: string;\n  name: string;\n  description: string;\n  shortDescription?: string | null;\n  subscriberCount: number;\n  publicationCount: number;\n  recentPublicationCount?: number;\n  lastActivityAt?: string | null;\n  isSubscribed?: boolean;\n  parent: {\n    slug: string;\n    name: string;\n  } | null;\n};\n\ntype EventItem = {\n  id: string;\n  title: string;\n  startsAt: string;\n  status: string;\n  community: {\n    slug: string;\n    name: string;\n  };\n};\n\ntype PollItem = {\n  id: string;\n  title: string;\n  closesAt: string;\n  status: string;\n  community: {\n    slug: string;\n    name: string;\n  };\n};\n\ntype AnnouncementItem = {\n  id: string;\n  title?: string | null;\n  body?: string | null;\n  description?: string | null;\n  createdAt: string;\n  publishedAt?: string | null;\n  community?: {\n    slug: string;\n    name: string;\n  } | null;\n};\n\ntype WorkshopItem = {\n  id: string;\n  title: string;\n  description: string;\n  status: string;\n  type: string;\n  createdAt: string;\n  author: {\n    username: string;\n    displayName: string;\n  };\n};\n\ntype FeedMode =\n  | 'subscriptions'\n  | 'new'\n  | 'popular'\n  | 'unanswered';\n\nconst feedTabs: Array<{\n  key: FeedMode;\n  label: string;\n}> = [\n  { key: 'subscriptions', label: 'По подпискам' },\n  { key: 'new', label: 'Новое' },\n  { key: 'popular', label: 'Популярное' },\n  { key: 'unanswered', label: 'Без ответа' },\n];\n\nconst formatNumber = (value: number) =>\n  new Intl.NumberFormat('ru-RU').format(value);\n\nfunction relativeDate(value: string) {\n  const time = new Date(value).getTime();\n\n  if (!Number.isFinite(time)) return '';\n\n  const difference = Date.now() - time;\n\n  if (difference < 60_000) return 'только что';\n\n  const minutes = Math.floor(difference / 60_000);\n  if (minutes < 60) return `${minutes} мин. назад`;\n\n  const hours = Math.floor(difference / 3_600_000);\n  if (hours < 24) return `${hours} ч. назад`;\n\n  const days = Math.floor(difference / 86_400_000);\n  if (days < 14) return `${days} дн. назад`;\n\n  return new Date(value).toLocaleDateString('ru-RU', {\n    day: 'numeric',\n    month: 'short',\n  });\n}\n\nfunction shortDate(value: string) {\n  return new Date(value).toLocaleString('ru-RU', {\n    day: 'numeric',\n    month: 'short',\n    hour: '2-digit',\n    minute: '2-digit',\n  });\n}\n\nfunction typeLabel(type: string) {\n  const names: Record<string, string> = {\n    GIFT: 'Подарок',\n    REACTION: 'Реакция',\n    BADGE: 'Значок',\n    PROFILE_DECOR: 'Профиль',\n    COMMUNITY_DECOR: 'Сообщество',\n  };\n\n  return names[type] ?? type;\n}\n\nexport function HomeDashboard() {\n  const [communities, setCommunities] = useState<\n    Community[]\n  >([]);\n  const [events, setEvents] = useState<EventItem[]>([]);\n  const [polls, setPolls] = useState<PollItem[]>([]);\n  const [announcements, setAnnouncements] = useState<\n    AnnouncementItem[]\n  >([]);\n  const [workshop, setWorkshop] = useState<\n    WorkshopItem[]\n  >([]);\n  const [feed, setFeed] = useState<\n    PublicationCardData[]\n  >([]);\n\n  const [mode, setMode] = useState<FeedMode>('new');\n  const [feedLoading, setFeedLoading] = useState(true);\n  const [pageLoading, setPageLoading] = useState(true);\n  const [feedError, setFeedError] = useState('');\n  const [pageError, setPageError] = useState('');\n\n  useEffect(() => {\n    let cancelled = false;\n\n    async function loadPage() {\n      setPageLoading(true);\n\n      const results = await Promise.allSettled([\n        api<Community[]>('/communities'),\n        api<EventItem[]>('/events'),\n        api<PollItem[]>('/governance/polls'),\n        api<AnnouncementItem[]>('/announcements'),\n        api<WorkshopItem[]>('/workshop'),\n      ]);\n\n      if (cancelled) return;\n\n      const [\n        communityResult,\n        eventResult,\n        pollResult,\n        announcementResult,\n        workshopResult,\n      ] = results;\n\n      if (communityResult.status === 'fulfilled') {\n        setCommunities(communityResult.value);\n      } else {\n        setPageError(\n          communityResult.reason instanceof Error\n            ? communityResult.reason.message\n            : 'Не удалось загрузить структуру FORRUM',\n        );\n      }\n\n      if (eventResult.status === 'fulfilled') {\n        setEvents(eventResult.value);\n      }\n\n      if (pollResult.status === 'fulfilled') {\n        setPolls(pollResult.value);\n      }\n\n      if (announcementResult.status === 'fulfilled') {\n        setAnnouncements(announcementResult.value);\n      }\n\n      if (workshopResult.status === 'fulfilled') {\n        setWorkshop(workshopResult.value);\n      }\n\n      setPageLoading(false);\n    }\n\n    void loadPage();\n\n    return () => {\n      cancelled = true;\n    };\n  }, []);\n\n  useEffect(() => {\n    let cancelled = false;\n\n    async function loadFeed() {\n      setFeedLoading(true);\n      setFeedError('');\n\n      const apiMode =\n        mode === 'unanswered' ? 'all' : mode;\n\n      try {\n        const items = await api<PublicationCardData[]>(\n          `/feed?mode=${encodeURIComponent(apiMode)}`,\n        );\n\n        if (cancelled) return;\n\n        setFeed(\n          mode === 'unanswered'\n            ? items.filter(\n                (item) => item.commentCount === 0,\n              )\n            : items,\n        );\n      } catch (cause) {\n        if (cancelled) return;\n\n        setFeed([]);\n        setFeedError(\n          cause instanceof Error\n            ? cause.message\n            : 'Не удалось загрузить обсуждения',\n        );\n      } finally {\n        if (!cancelled) setFeedLoading(false);\n      }\n    }\n\n    void loadFeed();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [mode]);\n\n  const childrenByParent = useMemo(() => {\n    const map = new Map<string, Community[]>();\n\n    for (const community of communities) {\n      if (!community.parent) continue;\n\n      map.set(community.parent.slug, [\n        ...(map.get(community.parent.slug) ?? []),\n        community,\n      ]);\n    }\n\n    return map;\n  }, [communities]);\n\n  const rootCommunities = useMemo(\n    () =>\n      communities\n        .filter((community) => !community.parent)\n        .sort(\n          (left, right) =>\n            (right.recentPublicationCount ?? 0) -\n              (left.recentPublicationCount ?? 0) ||\n            right.publicationCount -\n              left.publicationCount,\n        )\n        .slice(0, 6),\n    [communities],\n  );\n\n  const newCommunities = useMemo(\n    () =>\n      [...communities]\n        .filter((community) => !community.parent)\n        .sort(\n          (left, right) =>\n            (right.recentPublicationCount ?? 0) -\n              (left.recentPublicationCount ?? 0) ||\n            right.subscriberCount -\n              left.subscriberCount,\n        )\n        .slice(0, 3),\n    [communities],\n  );\n\n  const workshopItems = useMemo(\n    () =>\n      workshop\n        .filter((item) => item.status === 'PUBLISHED')\n        .slice(0, 3),\n    [workshop],\n  );\n\n  const currentItems = useMemo(() => {\n    const now = Date.now();\n\n    const upcoming = events\n      .filter(\n        (item) =>\n          item.status === 'PUBLISHED' &&\n          new Date(item.startsAt).getTime() > now,\n      )\n      .slice(0, 2)\n      .map((item) => ({\n        id: `event-${item.id}`,\n        kind: 'Событие',\n        title: item.title,\n        meta: `${item.community.name} · ${shortDate(\n          item.startsAt,\n        )}`,\n        href: `/events/${item.id}`,\n        date: item.startsAt,\n      }));\n\n    const openPolls = polls\n      .filter((item) => item.status === 'OPEN')\n      .slice(0, 2)\n      .map((item) => ({\n        id: `poll-${item.id}`,\n        kind: 'Голосование',\n        title: item.title,\n        meta: `${item.community.name} · до ${shortDate(\n          item.closesAt,\n        )}`,\n        href: '/events',\n        date: item.closesAt,\n      }));\n\n    const latestAnnouncements = announcements\n      .slice(0, 2)\n      .map((item) => ({\n        id: `announcement-${item.id}`,\n        kind: 'Объявление',\n        title:\n          item.title ||\n          item.body?.slice(0, 90) ||\n          item.description?.slice(0, 90) ||\n          'Объявление FORRUM',\n        meta: `${\n          item.community?.name ?? 'FORRUM'\n        } · ${shortDate(\n          item.publishedAt ||\n            item.createdAt,\n        )}`,\n        href: '/events',\n        date:\n          item.publishedAt ||\n          item.createdAt,\n      }));\n\n    return [\n      ...upcoming,\n      ...openPolls,\n      ...latestAnnouncements,\n    ].slice(0, 4);\n  }, [announcements, events, polls]);\n\n  function renderChildren(\n    parentSlug: string,\n    depth = 0,\n  ): React.ReactNode {\n    const children = (\n      childrenByParent.get(parentSlug) ?? []\n    )\n      .slice()\n      .sort((left, right) =>\n        left.name.localeCompare(right.name, 'ru'),\n      )\n      .slice(0, 5);\n\n    if (!children.length || depth > 1) return null;\n\n    return (\n      <ul>\n        {children.map((child) => (\n          <li key={child.id}>\n            <Link\n              href={`/communities/${child.slug}`}\n            >\n              {child.name}\n            </Link>\n            {renderChildren(child.slug, depth + 1)}\n          </li>\n        ))}\n      </ul>\n    );\n  }\n\n  return (\n    <div className=\"home-board\">\n      <section className=\"home-titlebar\">\n        <h1>Главная</h1>\n        <Link className=\"button\" href=\"/create\">\n          <span aria-hidden=\"true\">＋</span>\n          Создать тему\n        </Link>\n      </section>\n\n      {pageError && (\n        <div className=\"error-box\">{pageError}</div>\n      )}\n\n      <div className=\"home-layout\">\n        <aside\n          className=\"home-community-tree\"\n          aria-label=\"Категории и сообщества\"\n        >\n          {pageLoading ? (\n            <div className=\"home-compact-loading\">\n              Загружаем структуру…\n            </div>\n          ) : (\n            <>\n              {rootCommunities.map(\n                (community, index) => (\n                  <details\n                    key={community.id}\n                    open={index < 4}\n                  >\n                    <summary>\n                      <span className=\"home-tree-symbol\">\n                        {community.name.slice(0, 1)}\n                      </span>\n                      <strong>{community.name}</strong>\n                      <span aria-hidden=\"true\">⌄</span>\n                    </summary>\n                    {renderChildren(community.slug)}\n                  </details>\n                ),\n              )}\n\n              {!rootCommunities.length && (\n                <p className=\"muted small-text\">\n                  Категории появятся после создания\n                  первых сообществ.\n                </p>\n              )}\n\n              <Link\n                className=\"home-panel-footer\"\n                href=\"/communities\"\n              >\n                Все категории\n                <span aria-hidden=\"true\">→</span>\n              </Link>\n            </>\n          )}\n        </aside>\n\n        <main className=\"home-discussion-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Лента обсуждений</h2>\n          </header>\n\n          <div\n            className=\"home-feed-tabs\"\n            role=\"tablist\"\n            aria-label=\"Режим ленты\"\n          >\n            {feedTabs.map((tab) => (\n              <button\n                type=\"button\"\n                role=\"tab\"\n                aria-selected={mode === tab.key}\n                className={\n                  mode === tab.key ? 'active' : ''\n                }\n                key={tab.key}\n                onClick={() => setMode(tab.key)}\n              >\n                {tab.label}\n              </button>\n            ))}\n          </div>\n\n          <div className=\"home-feed-table\">\n            <div\n              className=\"home-feed-head\"\n              aria-hidden=\"true\"\n            >\n              <span>Тема</span>\n              <span>Автор</span>\n              <span>Ответы</span>\n              <span>Просмотры</span>\n            </div>\n\n            {feedLoading ? (\n              <div className=\"home-feed-status\">\n                Загружаем обсуждения…\n              </div>\n            ) : feedError ? (\n              <div className=\"home-feed-status error\">\n                <strong>\n                  Не удалось загрузить ленту\n                </strong>\n                <span>{feedError}</span>\n                <button\n                  type=\"button\"\n                  className=\"button ghost small\"\n                  onClick={() =>\n                    setMode((current) => current)\n                  }\n                >\n                  Повторить\n                </button>\n              </div>\n            ) : feed.length ? (\n              feed.slice(0, 9).map((item) => (\n                <article\n                  className=\"home-topic-row\"\n                  key={item.id}\n                >\n                  <span\n                    className=\"home-topic-icon\"\n                    aria-hidden=\"true\"\n                  >\n                    {item.type === 'QUESTION'\n                      ? '?'\n                      : item.format === 'TOPIC'\n                        ? '●'\n                        : '○'}\n                  </span>\n\n                  <div className=\"home-topic-copy\">\n                    <div className=\"home-topic-path\">\n                      <Link\n                        href={`/communities/${item.community.slug}`}\n                      >\n                        {item.community.name}\n                      </Link>\n                      {item.tags.slice(0, 2).map((tag) => (\n                        <span key={tag.id}>\n                          › {tag.label}\n                        </span>\n                      ))}\n                    </div>\n\n                    <Link\n                      className=\"home-topic-title\"\n                      href={`/p/${item.slug}`}\n                    >\n                      {item.title ||\n                        item.excerpt.slice(0, 100)}\n                    </Link>\n\n                    <p>{item.excerpt}</p>\n                  </div>\n\n                  <div className=\"home-topic-author\">\n                    <Link\n                      href={`/u/${item.author.username}`}\n                    >\n                      {item.author.displayName}\n                    </Link>\n                    <span>\n                      {relativeDate(\n                        item.lastActivityAt ||\n                          item.createdAt,\n                      )}\n                    </span>\n                  </div>\n\n                  <strong className=\"home-topic-count\">\n                    {formatNumber(item.commentCount)}\n                  </strong>\n\n                  <strong className=\"home-topic-count\">\n                    {formatNumber(item.viewCount ?? 0)}\n                  </strong>\n                </article>\n              ))\n            ) : (\n              <div className=\"home-feed-status\">\n                <strong>\n                  В этой вкладке пока пусто\n                </strong>\n                <span>\n                  Выберите другой режим или создайте\n                  первую тему.\n                </span>\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/search\"\n          >\n            Перейти ко всем обсуждениям\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </main>\n\n        <aside className=\"home-current-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Актуальное</h2>\n          </header>\n\n          <div className=\"home-current-list\">\n            {currentItems.map((item) => (\n              <Link\n                href={item.href}\n                className=\"home-current-item\"\n                key={item.id}\n              >\n                <span className=\"home-current-icon\">\n                  {item.kind === 'Событие'\n                    ? '□'\n                    : item.kind === 'Голосование'\n                      ? '▥'\n                      : '◁'}\n                </span>\n\n                <span>\n                  <small>{item.kind}</small>\n                  <strong>{item.title}</strong>\n                  <em>{item.meta}</em>\n                </span>\n              </Link>\n            ))}\n\n            {!pageLoading && !currentItems.length && (\n              <div className=\"home-current-empty\">\n                Новых событий и объявлений пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/events\"\n          >\n            Перейти ко всему актуальному\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </aside>\n      </div>\n\n      <div className=\"home-lower-grid\">\n        <section className=\"home-list-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Новое в Мастерской</h2>\n            <Link href=\"/workshop\">\n              Перейти в Мастерскую\n            </Link>\n          </header>\n\n          <div className=\"home-simple-list\">\n            {workshopItems.map((item) => (\n              <Link href=\"/workshop\" key={item.id}>\n                <span className=\"home-list-icon\">\n                  □\n                </span>\n                <span>\n                  <strong>{item.title}</strong>\n                  <small>\n                    {typeLabel(item.type)} · @\n                    {item.author.username}\n                  </small>\n                </span>\n                <em>\n                  {relativeDate(item.createdAt)}\n                </em>\n              </Link>\n            ))}\n\n            {!pageLoading && !workshopItems.length && (\n              <div className=\"home-list-empty\">\n                Новых опубликованных работ пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/workshop\"\n          >\n            Смотреть все новинки\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </section>\n\n        <section className=\"home-list-panel\">\n          <header className=\"home-panel-heading\">\n            <h2>Новые сообщества</h2>\n            <Link href=\"/communities\">\n              Все сообщества\n            </Link>\n          </header>\n\n          <div className=\"home-simple-list\">\n            {newCommunities.map((community) => (\n              <Link\n                href={`/communities/${community.slug}`}\n                key={community.id}\n              >\n                <span className=\"home-list-icon\">\n                  ○\n                </span>\n                <span>\n                  <strong>{community.name}</strong>\n                  <small>\n                    {community.shortDescription ||\n                      community.description}\n                  </small>\n                </span>\n                <em>\n                  {formatNumber(\n                    community.subscriberCount,\n                  )}{' '}\n                  участников\n                </em>\n              </Link>\n            ))}\n\n            {!pageLoading && !newCommunities.length && (\n              <div className=\"home-list-empty\">\n                Новых сообществ пока нет.\n              </div>\n            )}\n          </div>\n\n          <Link\n            className=\"home-panel-footer\"\n            href=\"/communities\"\n          >\n            Перейти ко всем сообществам\n            <span aria-hidden=\"true\">→</span>\n          </Link>\n        </section>\n      </div>\n    </div>\n  );\n}\n",
          )
          
          write(
              "docs/FORRUM_HOME_UI_BASE.md",
              "# FORRUM — базовый интерфейс главной\n\nЭтот документ фиксирует утверждённое визуальное направление главной страницы.\n\n## Основной принцип\n\nГлавная FORRUM — рабочая форумная панель, а не лендинг. После открытия пользователь сразу видит структуру сообществ, плотную ленту обсуждений и актуальные события.\n\n## Визуальная система\n\n- Светлая почти монохромная палитра.\n- Белый фон и поверхности.\n- Текст: графитовый и чёрный.\n- Вторичный текст: нейтральный серый.\n- Тонкие серые границы.\n- Минимальные скругления: 4–7 px.\n- Без градиентов, свечения и тяжёлых теней.\n- Основная кнопка тёмно-серая.\n- Вторичные кнопки белые с тонкой обводкой.\n- Компактные отступы и небольшая высота блоков.\n\n## Композиция главной\n\n1. Компактная шапка:\n   - логотип;\n   - основные разделы;\n   - широкий поиск;\n   - уведомления;\n   - сообщения;\n   - профиль.\n\n2. Узкая строка заголовка:\n   - «Главная»;\n   - кнопка «Создать тему».\n\n3. Основная сетка:\n   - слева древовидная структура категорий;\n   - по центру табличная лента обсуждений;\n   - справа единый блок «Актуальное».\n\n4. Нижняя часть:\n   - «Новое в Мастерской»;\n   - «Новые сообщества».\n\n## Запреты\n\n- Нет hero-блоков и объяснений продукта.\n- Нет крупных карточек ради заполнения пространства.\n- Нет декоративных градиентов и цветового шума.\n- Нет огромных скруглений.\n- Нет отдельных тяжёлых блоков статистики.\n- Нет дублирования навигации и случайных виджетов.\n",
          )
          
          css_path = Path("apps/web/app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* FORRUM APPROVED LIGHT FORUM BASE V4 */"
          
          if marker in css:
              css = css[:css.index(marker)].rstrip()
          
          css_path.write_text(
              css + "\n\n" +
