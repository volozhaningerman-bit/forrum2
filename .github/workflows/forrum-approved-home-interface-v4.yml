nowrap;\n}\n\n@media (max-width: 1180px) {\n  .main-links {\n    gap: 18px;\n  }\n\n  .header-search {\n    width: min(280px, 24vw);\n  }\n\n  .home-layout {\n    grid-template-columns:\n      230px\n      minmax(0, 1fr);\n  }\n\n  .home-current-panel {\n    grid-column: 1 / -1;\n  }\n\n  .home-current-list {\n    grid-template-columns: repeat(2, 1fr);\n  }\n\n  .home-current-item:nth-child(odd) {\n    border-right: 1px solid var(--line);\n  }\n\n  .home-lower-grid {\n    width: auto;\n    margin-left: 244px;\n  }\n}\n\n@media (max-width: 930px) {\n  .header-search {\n    display: none;\n  }\n\n  .home-layout {\n    grid-template-columns: 1fr;\n  }\n\n  .home-community-tree {\n    order: 2;\n  }\n\n  .home-discussion-panel {\n    order: 1;\n  }\n\n  .home-current-panel {\n    order: 3;\n  }\n\n  .home-community-tree {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n  }\n\n  .home-community-tree\n    .home-panel-footer {\n    grid-column: 1 / -1;\n  }\n\n  .home-community-tree details:nth-of-type(odd) {\n    border-right: 1px solid var(--line);\n  }\n\n  .home-lower-grid {\n    width: auto;\n    margin-left: 0;\n  }\n}\n\n@media (max-width: 760px) {\n  .shell {\n    width: min(100% - 18px, 1500px);\n  }\n\n  .main {\n    padding-top: 9px;\n  }\n\n  .home-titlebar {\n    min-height: 46px;\n  }\n\n  .home-titlebar .button {\n    min-width: 0;\n  }\n\n  .home-feed-head {\n    grid-template-columns:\n      minmax(0, 1fr)\n      58px;\n    padding-left: 48px;\n  }\n\n  .home-feed-head span:nth-child(2),\n  .home-feed-head span:nth-child(4) {\n    display: none;\n  }\n\n  .home-topic-row {\n    grid-template-columns:\n      24px\n      minmax(0, 1fr)\n      58px;\n  }\n\n  .home-topic-author,\n  .home-topic-row\n    .home-topic-count:last-child {\n    display: none;\n  }\n\n  .home-lower-grid {\n    grid-template-columns: 1fr;\n  }\n\n  .home-current-list {\n    grid-template-columns: 1fr;\n  }\n\n  .home-current-item:nth-child(odd) {\n    border-right: 0;