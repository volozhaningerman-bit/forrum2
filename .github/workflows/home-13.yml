name: Главная — 13
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: home-13
  cancel-in-progress: false
run-name: Главная — 13
jobs:
  home-13:
    name: Главная — 13
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: 01. Checkout
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: 02. Node
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: 03. База
      shell: bash
      run: 'set -euo pipefail

        git reset --hard HEAD

        git clean -ffdx

        test -z "$(git status --porcelain)"

        echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


        grep -Fq ''4RRUM_HOME_V4'' apps/web/components/home-dashboard.tsx

        grep -Fq ''4RRUM_HOME_09_POLISH'' apps/web/components/home-dashboard.tsx

        grep -Fq ''forrum-home-v16__discussed-head'' apps/web/components/home-dashboard.tsx

        grep -Fq ''Старт 4RRUM'' apps/web/components/home-dashboard.tsx

        grep -Fq ''HeaderSearch'' apps/web/components/site-header.tsx

        grep -Fq ''ThemeToggle'' apps/web/components/main-nav.tsx


        echo "База Главная — 09 подтверждена."

        '
      id: baseline
    - name: 04. Контракт
      shell: bash
      run: 'set -euo pipefail


        python3 - <<''PY''

        from pathlib import Path

        Path(''/tmp/home-13-check.mjs'').write_text(''import fs from \''node:fs\'';\n\nconst home = fs.readFileSync(\n  \''apps/web/components/home-dashboard.tsx\'',\n  \''utf8\'',\n);\nconst css = fs.readFileSync(\n  \''apps/web/app/globals.css\'',\n  \''utf8\'',\n);\nconst search = fs.readFileSync(\n  \''apps/web/components/header-search.tsx\'',\n  \''utf8\'',\n);\nconst layout = fs.readFileSync(\n  \''apps/web/app/layout.tsx\'',\n  \''utf8\'',\n);\n\nfunction fail(message) {\n  throw new Error(message);\n}\n\nif (!home.includes(\''4RRUM_HOME_13_POLISH\'')) {\n  fail(\''Missing 4RRUM_HOME_13_POLISH marker.\'');\n}\n\nif (!css.includes(\''4RRUM_HOME_13_POLISH\'')) {\n  fail(\''Missing Home 12 CSS marker.\'');\n}\n\nfor (const phrase of [\n  \''Поиск по форуму\'',\n  \''Поиск по темам\'',\n  \''Поиск по сообщениям\'',\n]) {\n  if (!search.includes(phrase)) {\n    fail(`Search phrase missing: ${phrase}`);\n  }\n}\n\nif (search.includes("\''Поиск...\''") || search.includes(\''"Поиск..."\''))
        {\n  fail(\''Old dots-only search animation remains.\'');\n}\n\nif (!search.includes(\''4RRUM_HEADER_SEARCH_13\'')) {\n  fail(\''Header search revision marker missing.\'');\n}\n\nif (!search.includes(\''useState<string>(\'')) {\n  fail(\''Header search state must be widened to string.\'');\n}\n\nconst weekly = home.match(\n  /const\\s+\\[weeklyMode,\\s*setWeeklyMode\\]\\s*=\\s*useState<[\\s\\S]{0,180}?>\\s*\\(\\s*\''activity\''\\s*\\)\\s*;/\n);\nif (!weekly) {\n  fail(\''Weekly ranking must start on activity.\'');\n}\n\nfor (const marker of [\n  \''4RRUM_HOME_13_WEEKLY_REAL_USERS\'',\n  \''const weeklyParticipants = useMemo\'',\n  \''.slice(0, 5)\'',\n  \''href={`/u/${participant.username}`}\'',\n  \''participant.likes\'',\n  \''participant.activity\'',\n]) {\n  if (!home.includes(marker)) {\n    fail(`Weekly real-user ranking missing: ${marker}`);\n  }\n}\n\nif (!home.includes(\''forrum-home-v16__weekly-list\'')) {\n  fail(\''Weekly list markup missing.\'');\n}\n\nif (!home.includes(\''forrum-home-v16__weekly-row\''))
        {\n  fail(\''Weekly participant rows missing.\'');\n}\n\nconst lastMessage = home.match(\n  /className="forrum-home-v16__new-topic-last"[\\s\\S]{0,240}?<\\/span>/\n);\nif (!lastMessage) {\n  fail(\''New-topic last-message cell missing.\'');\n}\n\nconst lastSegment = lastMessage[0];\nconst usernamePos = lastSegment.indexOf(\''@{item.author.username}\'');\nconst timePos = lastSegment.indexOf(\n  \''{relativeTime(item.lastActivityAt || item.createdAt)}\''\n);\n\nif (\n  usernamePos < 0 ||\n  timePos < 0 ||\n  usernamePos >= timePos\n) {\n  fail(\''Last message must be username first, time second.\'');\n}\n\nif (lastSegment.includes(\''{relativeTime(date)}\'')) {\n  fail(\''Last message still references out-of-scope date.\'');\n}\n\nfor (const marker of [\n  \''grid-template-columns: 58px 72px 90px\'',\n  \''width: 244px\'',\n  \''text-align: center\'',\n  \''forrum-home-v16__topic-stat::before\'',\n  \''forrum-home-v16__topic-stat::after\'',\n]) {\n  if (!css.includes(marker)) {\n    fail(`Discussed
        alignment CSS missing: ${marker}`);\n  }\n}\n\nif (!css.includes(\n  \''.forrum-home-v16__topic-stat > [aria-hidden="true"]\''\n)) {\n  fail(\''Metric glyph fallback is missing.\'');\n}\n\nfor (const marker of [\n  \''forrum-home-v16__weekly-list\'',\n  \''forrum-home-v16__weekly-row\'',\n  \''forrum-home-v16__weekly-avatar\'',\n  \''forrum-home-v16__weekly-score\'',\n]) {\n  if (!css.includes(marker)) {\n    fail(`Weekly CSS missing: ${marker}`);\n  }\n}\n\nif (!home.includes("\''FORRUM Start\'' ? \''Старт 4RRUM\''")) {\n  fail(\''Legacy FORRUM Start display must be Старт 4RRUM.\'');\n}\n\nif (!layout.includes("title: \''4RRUM — тестовая версия\''")) {\n  fail(\''Root metadata still uses FORRUM.\'');\n}\n\nconsole.log(\''Главная — 13 contract: PASS\'');\n'', encoding=''utf-8'')

        PY


        node --check /tmp/home-13-check.mjs

        '
    - name: 05. RED
      shell: bash
      run: "set -euo pipefail\nif node /tmp/home-13-check.mjs; then\n  echo \"::error::Контракт неожиданно прошёл до изменений.\"\n  exit 1\nfi\necho \"RED: PASS — Главная — 13 ещё не соответствует 10.\"\n"
    - name: 06. Зависимости
      shell: bash
      run: 'set -euo pipefail

        npm install --include=dev --no-audit --no-fund --package-lock=false

        '
    - name: 07. Диагностика
      shell: bash
      run: 'set -euo pipefail

        echo "=== weeklyMode ==="

        grep -n -A10 -B2 ''weeklyMode'' apps/web/components/home-dashboard.tsx | head -80 || true


        echo "=== discussed metrics ==="

        grep -n -A5 -B3 ''title="Ответы"\|title="Просмотры"'' apps/web/components/home-dashboard.tsx | head -100 || true


        echo "=== start panel ==="

        grep -n -A8 -B3 ''Старт 4RRUM'' apps/web/components/home-dashboard.tsx | head -80 || true

        '
    - name: 08. Патч
      shell: bash
      run: "set -euo pipefail\n\npython3 - <<'PY'\nfrom pathlib import Path\nPath('/tmp/home-13.py').write_text('from pathlib import Path\\nimport re\\n\\nHOME = Path(\\'apps/web/components/home-dashboard.tsx\\')\\nLAYOUT = Path(\\'apps/web/app/layout.tsx\\')\\n\\nhome = HOME.read_text(encoding=\\'utf-8\\')\\nlayout = LAYOUT.read_text(encoding=\\'utf-8\\')\\n\\nif \\'4RRUM_HOME_13_POLISH\\' in home:\\n    raise SystemExit(\\'Главная — 13 уже применена.\\')\\n\\nif \\'4RRUM_HOME_09_POLISH\\' not in home:\\n    raise SystemExit(\\n        \\'Ожидалась успешная Главная — 09: \\'\\n        \\'marker 4RRUM_HOME_09_POLISH не найден.\\'\\n    )\\n\\n\\ndef statement_end(text: str, start: int) -> int:\\n    paren = bracket = brace = 0\\n    quote = None\\n    escaped = False\\n    line_comment = False\\n    block_comment = False\\n    i = start\\n\\n    while i < len(text):\\n        ch = text[i]\\n        nxt = text[i + 1] if i + 1 < len(text) else \\'\\'\\n\\n        if line_comment:\\n      \
        \      if ch == \\'\\\\n\\':\\n                line_comment = False\\n            i += 1\\n            continue\\n\\n        if block_comment:\\n            if ch == \\'*\\' and nxt == \\'/\\':\\n                block_comment = False\\n                i += 2\\n                continue\\n            i += 1\\n            continue\\n\\n        if quote is not None:\\n            if escaped:\\n                escaped = False\\n            elif ch == \\'\\\\\\\\\\':\\n                escaped = True\\n            elif ch == quote:\\n                quote = None\\n            i += 1\\n            continue\\n\\n        if ch == \\'/\\' and nxt == \\'/\\':\\n            line_comment = True\\n            i += 2\\n            continue\\n\\n        if ch == \\'/\\' and nxt == \\'*\\':\\n            block_comment = True\\n            i += 2\\n            continue\\n\\n        if ch in (\"\\'\", \\'\"\\', \\'`\\'):\\n            quote = ch\\n            i += 1\\n            continue\\n\\n    \
        \    if ch == \\'(\\':\\n            paren += 1\\n        elif ch == \\')\\':\\n            paren = max(0, paren - 1)\\n        elif ch == \\'[\\':\\n            bracket += 1\\n        elif ch == \\']\\':\\n            bracket = max(0, bracket - 1)\\n        elif ch == \\'{\\':\\n            brace += 1\\n        elif ch == \\'}\\':\\n            brace = max(0, brace - 1)\\n        elif ch == \\';\\' and paren == bracket == brace == 0:\\n            return i + 1\\n\\n        i += 1\\n\\n    raise SystemExit(\\'Could not find statement end.\\')\\n\\n\\ndef opening_tag_end(text: str, start: int) -> int:\\n    quote = None\\n    escaped = False\\n    brace = 0\\n    i = start\\n\\n    while i < len(text):\\n        ch = text[i]\\n\\n        if quote is not None:\\n            if escaped:\\n                escaped = False\\n            elif ch == \\'\\\\\\\\\\':\\n                escaped = True\\n            elif ch == quote:\\n                quote = None\\n            i += 1\\n    \
        \        continue\\n\\n        if ch in (\"\\'\", \\'\"\\', \\'`\\'):\\n            quote = ch\\n            i += 1\\n            continue\\n\\n        if ch == \\'{\\':\\n            brace += 1\\n        elif ch == \\'}\\':\\n            brace = max(0, brace - 1)\\n        elif ch == \\'>\\' and brace == 0:\\n            return i\\n\\n        i += 1\\n\\n    raise SystemExit(\\'Could not find JSX opening tag end.\\')\\n\\n\\ndef span_bounds_by_class(text: str, class_name: str):\\n    class_match = re.search(\\n        rf\\'className\\\\s*=\\\\s*([\"\\\\\\']){re.escape(class_name)}\\\\1\\',\\n        text,\\n    )\\n    if not class_match:\\n        raise SystemExit(\\n            f\\'Could not locate class: {class_name}\\'\\n        )\\n\\n    start = text.rfind(\\'<span\\', 0, class_match.start())\\n    if start < 0:\\n        raise SystemExit(\\n            f\\'Could not locate opening span: {class_name}\\'\\n        )\\n\\n    open_end = opening_tag_end(text, start)\\n    if\
        \ not (\\n        start <= class_match.start() <= open_end\\n    ):\\n        raise SystemExit(\\n            f\\'Class is outside opening span: {class_name}\\'\\n        )\\n\\n    token_re = re.compile(r\\'<span\\\\b|</span\\\\s*>\\', re.I)\\n    depth = 1\\n\\n    for token in token_re.finditer(text, open_end + 1):\\n        if token.group(0).lower().startswith(\\'<span\\'):\\n            depth += 1\\n        else:\\n            depth -= 1\\n            if depth == 0:\\n                return start, open_end, token.start(), token.end()\\n\\n    raise SystemExit(\\n        f\\'Could not locate closing span: {class_name}\\'\\n    )\\n\\n\\n# ---------------------------------------------------------\\n# A. Weekly ranking always opens on activity.\\n# ---------------------------------------------------------\\nweekly_match = re.search(\\n    r\\'(?m)^[ \\\\t]*const\\\\s+\\\\[weeklyMode,\\\\s*setWeeklyMode\\\\]\\\\s*=\\'\\n    r\\'\\\\s*useState<\\',\\n    home,\\n)\\nif not weekly_match:\\\
        n    raise SystemExit(\\'weeklyMode declaration not found.\\')\\n\\nweekly_start = weekly_match.start()\\nweekly_end = statement_end(home, weekly_start)\\nindent = re.match(\\n    r\\'[ \\\\t]*\\',\\n    home[weekly_start:],\\n).group(0)\\n\\nweekly_state = (\\n    f\"{indent}const [weeklyMode, setWeeklyMode] = useState<\\\\n\"\\n    f\"{indent}  \\'likes\\' | \\'activity\\'\\\\n\"\\n    f\"{indent}>(\\'activity\\');\"\\n)\\n\\nhome = (\\n    home[:weekly_start]\\n    + weekly_state\\n    + home[weekly_end:]\\n)\\n\\n# ---------------------------------------------------------\\n# B. Build up to five REAL existing users from visible forum topics.\\n# No database junk accounts: these rows link to actual /u/:username.\\n# \"По симпатиям\" = reactions on authored visible topics.\\n# \"По активности\" = authored topics + their discussion activity.\\n# ---------------------------------------------------------\\nif \\'4RRUM_HOME_13_WEEKLY_REAL_USERS\\' not in home:\\n    weekly_state_pos\
        \ = home.find(\\n        \"const [weeklyMode, setWeeklyMode]\"\\n    )\\n    weekly_state_end = statement_end(\\n        home,\\n        weekly_state_pos,\\n    )\\n\\n    weekly_data = r\\'\\'\\'\\n\\n  // 4RRUM_HOME_13_WEEKLY_REAL_USERS\\n  const weeklyParticipants = useMemo(() => {\\n    const topicMap = new Map<\\n      string,\\n      PublicationCardData\\n    >();\\n\\n    [\\n      ...(initialData.feed ?? []),\\n      ...(initialData.newFeed ?? []),\\n    ]\\n      .filter((item) => item.format === \\'TOPIC\\')\\n      .forEach((item) => topicMap.set(item.id, item));\\n\\n    const users = new Map<\\n      string,\\n      {\\n        username: string;\\n        displayName: string;\\n        avatarUrl?: string | null;\\n        likes: number;\\n        activity: number;\\n        latest: number;\\n      }\\n    >();\\n\\n    topicMap.forEach((item) => {\\n      const username = item.author.username;\\n      const current = users.get(username) ?? {\\n        username,\\n  \
        \      displayName:\\n          item.author.displayName || username,\\n        avatarUrl: item.author.avatarUrl,\\n        likes: 0,\\n        activity: 0,\\n        latest: 0,\\n      };\\n\\n      current.likes += item.reactionCount ?? 0;\\n      current.activity +=\\n        1 +\\n        Math.min(\\n          item.recentCommentCount ??\\n            item.commentCount ??\\n            0,\\n          25,\\n        );\\n\\n      const activityAt = new Date(\\n        item.lastActivityAt || item.createdAt,\\n      ).getTime();\\n\\n      if (Number.isFinite(activityAt)) {\\n        current.latest = Math.max(\\n          current.latest,\\n          activityAt,\\n        );\\n      }\\n\\n      users.set(username, current);\\n    });\\n\\n    const metric =\\n      weeklyMode === \\'likes\\'\\n        ? \\'likes\\'\\n        : \\'activity\\';\\n\\n    return [...users.values()]\\n      .sort(\\n        (a, b) =>\\n          b[metric] - a[metric] ||\\n          b.latest - a.latest ||\\\
        n          a.username.localeCompare(\\n            b.username,\\n            \\'ru\\',\\n          ),\\n      )\\n      .slice(0, 5);\\n  }, [\\n    initialData.feed,\\n    initialData.newFeed,\\n    weeklyMode,\\n  ]);\\n\\'\\'\\'\\n\\n    home = (\\n        home[:weekly_state_end]\\n        + weekly_data\\n        + home[weekly_state_end:]\\n    )\\n\\n# ---------------------------------------------------------\\n# C. Replace weekly panel as one stable unit.\\n# ---------------------------------------------------------\\nweekly_heading = home.find(\\n    \\'<h2>Участники недели</h2>\\'\\n)\\n\\nif weekly_heading < 0:\\n    weekly_title_match = re.search(\\n        r\\'title\\\\s*=\\\\s*([\"\\\\\\'])Участники недели\\\\1\\',\\n        home,\\n    )\\n    if not weekly_title_match:\\n        raise SystemExit(\\n            \\'Участники недели panel not found.\\'\\n        )\\n\\n    weekly_start_panel = home.rfind(\\n        \\'<HomePanel\\',\\n        0,\\n        weekly_title_match.start(),\\\
        n    )\\n    weekly_end_panel = home.find(\\n        \\'</HomePanel>\\',\\n        weekly_title_match.end(),\\n    )\\n    if (\\n        weekly_start_panel < 0\\n        or weekly_end_panel < 0\\n    ):\\n        raise SystemExit(\\n            \\'HomePanel weekly bounds not found.\\'\\n        )\\n    weekly_end_panel += len(\\'</HomePanel>\\')\\nelse:\\n    weekly_start_panel = home.rfind(\\n        \\'<section\\',\\n        0,\\n        weekly_heading,\\n    )\\n    weekly_end_panel = home.find(\\n        \\'</section>\\',\\n        weekly_heading,\\n    )\\n    if (\\n        weekly_start_panel < 0\\n        or weekly_end_panel < 0\\n    ):\\n        raise SystemExit(\\n            \\'Section weekly bounds not found.\\'\\n        )\\n    weekly_end_panel += len(\\'</section>\\')\\n\\nweekly_panel = r\\'\\'\\'<section className=\"forrum-home-v16__panel\">\\n          <header className=\"forrum-home-v16__panel-head\">\\n            <h2>Участники недели</h2>\\n          </header>\\\
        n          <div\\n            className=\"forrum-home-v16__tabs\"\\n            role=\"tablist\"\\n            aria-label=\"Рейтинг недели\"\\n          >\\n            <button\\n              type=\"button\"\\n              role=\"tab\"\\n              aria-selected={weeklyMode === \\'likes\\'}\\n              aria-controls=\"weekly-ranking-panel\"\\n              className={\\n                weeklyMode === \\'likes\\'\\n                  ? \\'is-active\\'\\n                  : \\'\\'\\n              }\\n              onClick={() => setWeeklyMode(\\'likes\\')}\\n            >\\n              По симпатиям\\n            </button>\\n            <button\\n              type=\"button\"\\n              role=\"tab\"\\n              aria-selected={weeklyMode === \\'activity\\'}\\n              aria-controls=\"weekly-ranking-panel\"\\n              className={\\n                weeklyMode === \\'activity\\'\\n                  ? \\'is-active\\'\\n                  : \\'\\'\\n          \
        \    }\\n              onClick={() => setWeeklyMode(\\'activity\\')}\\n            >\\n              По активности\\n            </button>\\n          </div>\\n          <div\\n            className=\"forrum-home-v16__weekly-list\"\\n            id=\"weekly-ranking-panel\"\\n            role=\"tabpanel\"\\n          >\\n            {weeklyParticipants.length ? (\\n              weeklyParticipants.map(\\n                (participant, index) => {\\n                  const initials = (\\n                    participant.displayName ||\\n                    participant.username\\n                  )\\n                    .split(/\\\\s+/)\\n                    .filter(Boolean)\\n                    .map((part) => part[0])\\n                    .join(\\'\\')\\n                    .slice(0, 2)\\n                    .toUpperCase();\\n\\n                  const score =\\n                    weeklyMode === \\'likes\\'\\n                      ? participant.likes\\n                      : participant.activity;\\\
        n\\n                  return (\\n                    <Link\\n                      className=\"forrum-home-v16__weekly-row\"\\n                      href={`/u/${participant.username}`}\\n                      key={participant.username}\\n                    >\\n                      <span className=\"forrum-home-v16__weekly-rank\">\\n                        {index + 1}\\n                      </span>\\n                      <span\\n                        className=\"forrum-home-v16__weekly-avatar\"\\n                        aria-hidden=\"true\"\\n                      >\\n                        {initials || \\'4R\\'}\\n                      </span>\\n                      <strong className=\"forrum-home-v16__weekly-user\">\\n                        @{participant.username}\\n                      </strong>\\n                      <span\\n                        className=\"forrum-home-v16__weekly-score\"\\n                        aria-label={\\n                          weeklyMode\
        \ === \\'likes\\'\\n                            ? `Симпатии: ${score}`\\n                            : `Активность: ${score}`\\n                        }\\n                      >\\n                        {score}\\n                      </span>\\n                    </Link>\\n                  );\\n                },\\n              )\\n            ) : (\\n              <p className=\"forrum-home-v16__weekly-empty\">\\n                За эту неделю активности пока нет.\\n              </p>\\n            )}\\n          </div>\\n          <Link\\n            className=\"forrum-home-v16__weekly-more\"\\n            href=\"/users\"\\n          >\\n            Смотреть рейтинг\\n            <span aria-hidden=\"true\">→</span>\\n          </Link>\\n        </section>\\'\\'\\'\\n\\nhome = (\\n    home[:weekly_start_panel]\\n    + weekly_panel\\n    + home[weekly_end_panel:]\\n)\\n\\n# ---------------------------------------------------------\\n# D. New topics: last message = @username\
        \ first, then time.\\n# ---------------------------------------------------------\\nstart, open_end, close_start, close_end = span_bounds_by_class(\\n    home,\\n    \\'forrum-home-v16__new-topic-last\\',\\n)\\n\\nnew_last_body = (\\n    \\'\\\\n          \\'\\n    \\'@{item.author.username} · \\'\\n    \\'{relativeTime(item.lastActivityAt || item.createdAt)}\\'\\n    \\'\\\\n        \\'\\n)\\n\\nhome = (\\n    home[:open_end + 1]\\n    + new_last_body\\n    + home[close_start:]\\n)\\n\\n# ---------------------------------------------------------\\n# E. Display-only consistency: Старт 4RRUM in tree.\\n# ---------------------------------------------------------\\nhome = home.replace(\\n    \"\\'FORRUM Start\\' ? \\'4RRUM Start\\'\",\\n    \"\\'FORRUM Start\\' ? \\'Старт 4RRUM\\'\",\\n)\\n\\nif \"\\'FORRUM Start\\' ? \\'4RRUM Start\\'\" in home:\\n    raise SystemExit(\\n        \\'Legacy 4RRUM Start display still remains.\\'\\n    )\\n\\n# ---------------------------------------------------------\\\
        n# F. Marker.\\n# ---------------------------------------------------------\\nexport_anchor = \\'export function HomeDashboard({\\'\\nif home.count(export_anchor) != 1:\\n    raise SystemExit(\\n        \\'Unexpected HomeDashboard export count.\\'\\n    )\\n\\nhome = home.replace(\\n    export_anchor,\\n    \\'// 4RRUM_HOME_13_POLISH\\\\n\\'\\n    + export_anchor,\\n    1,\\n)\\n\\nhome = \\'\\\\n\\'.join(\\n    line.rstrip(\\' \\\\t\\')\\n    for line in home.splitlines()\\n).rstrip() + \\'\\\\n\\'\\n\\nHOME.write_text(home, encoding=\\'utf-8\\')\\n\\n# ---------------------------------------------------------\\n# G. Browser/page metadata brand consistency.\\n# ---------------------------------------------------------\\nlayout = layout.replace(\\n    \"title: \\'FORRUM — тестовая версия\\'\",\\n    \"title: \\'4RRUM — тестовая версия\\'\",\\n)\\n\\nif \"title: \\'FORRUM — тестовая версия\\'\" in layout:\\n    raise SystemExit(\\n        \\'Old FORRUM metadata title remains.\\'\\\
