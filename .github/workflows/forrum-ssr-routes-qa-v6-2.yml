    - name: Verify source transformation
      shell: bash
      run: |
        set -euo pipefail

        test -f apps/web/lib/server-api.ts
        test -f apps/web/app/communities/communities-client.tsx
        grep -q "export type Community"   apps/web/app/communities/communities-client.tsx
        grep -q "export function CommunitiesClient"   apps/web/app/communities/communities-client.tsx
        grep -q "serverApi<Community"   apps/web/app/communities/page.tsx
        test -f apps/web/app/events/events-client.tsx
        test -f apps/web/app/media/media-client.tsx
        test -f apps/web/app/workshop/workshop-client.tsx
        test -f 'apps/web/app/communities/[slug]/community-client.tsx'
        test -f 'apps/web/app/events/[id]/event-detail-client.tsx'
        test -f 'apps/web/app/p/[slug]/publication-client.tsx'
        test -f 'apps/web/app/u/[username]/profile-client.tsx'

        grep -q "serverApi<Community" apps/web/app/communities/page.tsx
        grep -q "serverApi<EventItem" apps/web/app/events/page.tsx
        grep -q "serverApi<Partner" apps/web/app/media/page.tsx
        grep -q "serverApi<Item" apps/web/app/workshop/page.tsx
        grep -q "FORRUM_PROTECTED_ROUTE_V6" apps/web/app/messages/layout.tsx
        grep -q "FORRUM_PROTECTED_ROUTE_V6" apps/web/app/create/layout.tsx
        grep -q "initialMe" apps/web/app/communities/proposals/page.tsx
        grep -q "brand-mark::before" apps/web/app/globals.css

        if grep -A8 'className="brand-mark"' apps/web/components/site-header.tsx             | grep -q '^[[:space:]]*F[[:space:]]*$'; then
          echo "Literal F remains inside the brand mark."
          exit 1
        fi
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: Install all dependencies
      run: |-
        npm install --include=dev --no-audit --no-fund --package-lock=false
    - name: Generate and validate Prisma
      run: |
        npm run prisma:generate -w @forrum/api
        npm run prisma:validate -w @forrum/api
        npm run prisma:push -w @forrum/api
        npm run prisma:seed -w @forrum/api
    - name: Static UX and accessibility checks
      run: |
        npm run validate:static
        npm run validate:ux
        npm run validate:a11y
    - name: Typecheck every workspace
      run: |-
        npm run typecheck
    - name: Run API tests
      run: |-
        npm run test -w @forrum/api
    - name: First clean production build
      env:
        NODE_ENV: production
      run: |
        rm -rf apps/web/.next apps/api/dist packages/contracts/dist
        npm run build -w @forrum/contracts
        npm run build -w @forrum/api
        npm run build -w @forrum/web
    - name: Start production API and web
      shell: bash
      env:
        NODE_ENV: production
      run: |
        npm run start -w @forrum/api > /tmp/api.log 2>&1 &
        echo $! > /tmp/api.pid

        npm run start -w @forrum/web > /tmp/web.log 2>&1 &
        echo $! > /tmp/web.pid
    - name: Verify API and public SSR pages
      shell: bash
      run: |
        set -euo pipefail

        for attempt in $(seq 1 50); do
          API_OK=0
          WEB_OK=0

          curl --fail --silent               http://127.0.0.1:4000/v1/health               >/tmp/health.json && API_OK=1 || true

          curl --fail --silent               http://127.0.0.1:3000/               >/tmp/home.html && WEB_OK=1 || true

          if [ "$API_OK" = 1 ] && [ "$WEB_OK" = 1 ]; then
            break
          fi

          if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
            cat /tmp/api.log
            exit 1
          fi

          if ! kill -0 "$(cat /tmp/web.pid)" 2>/dev/null; then
            cat /tmp/web.log
            exit 1
          fi

          sleep 2
        done

        grep -q '"status":"ok"' /tmp/health.json

        for path in             /             /communities             /events             /media             /workshop             /communities/proposals
        do
          output="/tmp/page-$(echo "$path" | tr '/' '_').html"
          curl --fail --silent --show-error               "http://127.0.0.1:3000${path}"               > "$output"
        done

        grep -q "Войти, чтобы поддержать"             /tmp/page-_communities_proposals.html

        if grep -q ">FFORRUM<" /tmp/home.html; then
          echo "Duplicated logo text remains in HTML."
          exit 1
        fi

        python3 <<'PY'
        import json
        import urllib.request

        def get(path):
            with urllib.request.urlopen(
                f"http://127.0.0.1:4000/v1{path}"
            ) as response:
                return json.load(response)

        communities = get("/communities")
        feed = get("/feed?mode=new")
        events = get("/events")

        with open("/tmp/runtime-targets.env", "w") as file:
            if communities:
                file.write(
                    f"COMMUNITY={communities[0]['slug']}\n"
                )
            if feed:
                file.write(
                    f"PUBLICATION={feed[0]['slug']}\n"
                )
            if events:
                file.write(
                    f"EVENT={events[0]['id']}\n"
                )
        PY

        source /tmp/runtime-targets.env || true

        if [ -n "${COMMUNITY:-}" ]; then
          curl --fail --silent               "http://127.0.0.1:3000/communities/${COMMUNITY}"               > /tmp/community-detail.html
          ! grep -q "Загрузка сообщества" /tmp/community-detail.html
        fi

        if [ -n "${PUBLICATION:-}" ]; then
          curl --fail --silent               "http://127.0.0.1:3000/p/${PUBLICATION}"               > /tmp/publication-detail.html
          ! grep -q "Загрузка публикации" /tmp/publication-detail.html
        fi

        if [ -n "${EVENT:-}" ]; then
          curl --fail --silent               "http://127.0.0.1:3000/events/${EVENT}"               > /tmp/event-detail.html
          ! grep -q "Загрузка события" /tmp/event-detail.html
        fi

        curl --fail --silent             http://127.0.0.1:3000/u/owner             > /tmp/profile.html

        ! grep -q "profile-loading" /tmp/profile.html
    - name: Verify protected route redirects
      shell: bash
      run: |
        set -euo pipefail

        check_redirect() {
          local path="$1"
          local expected="$2"

          curl --silent --show-error               --output /dev/null               --dump-header /tmp/headers.txt               "http://127.0.0.1:3000${path}"

          grep -Ei "^location: ${expected}" /tmp/headers.txt
        }

        check_redirect /messages '/login\?next=%2Fmessages'
        check_redirect /create '/login\?next=%2Fcreate'
        check_redirect /settings '/login\?next=%2Fsettings'
        check_redirect /wallet '/login\?next=%2Fwallet'
        check_redirect /admin '/login\?next=%2Fadmin'
    - name: Stop smoke-test services
      if: always()
      shell: bash
      run: |
        kill "$(cat /tmp/web.pid)" 2>/dev/null || true
        kill "$(cat /tmp/api.pid)" 2>/dev/null || true
        wait "$(cat /tmp/web.pid)" 2>/dev/null || true
        wait "$(cat /tmp/api.pid)" 2>/dev/null || true
    - name: Second clean production build
      env:
        NODE_ENV: production
      run: |
        rm -rf apps/web/.next apps/api/dist packages/contracts/dist
        npm run build -w @forrum/contracts
        npm run build -w @forrum/api
        npm run build -w @forrum/web
    - name: Remove generated Prisma diff noise
      shell: bash
      run: |
        set -euo pipefail

        if git ls-files -- apps/api/src/generated/prisma | grep -q .; then
          git restore --source=HEAD --staged --worktree -- apps/api/src/generated/prisma
        fi

        git clean -fd -- apps/api/src/generated/prisma
    - name: Final repository checks
      shell: bash
      run: |
        set -euo pipefail
        git diff --check -- . ':(exclude)apps/api/src/generated/prisma/**'
        git status --short
    - name: Commit and push verified V6.2
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "FORRUM QA updater"
        git config user.email "actions@users.noreply.github.com"

        git add apps/web

        if git diff --cached --quiet; then
          echo "V6.2 is already present in main."
        else
          git commit -m "Add server-rendered routes and auth guards V6.2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
        fi
    - name: Verify remote main
      shell: bash
      run: |
        set -euo pipefail

        LOCAL_SHA="$(git rev-parse HEAD)"
        REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

        echo "Local:  $LOCAL_SHA"
        echo "Remote: $REMOTE_SHA"

        test "$LOCAL_SHA" = "$REMOTE_SHA"

        git show HEAD:apps/web/lib/server-api.ts             | grep -q "requireUser"

        git show HEAD:apps/web/app/communities/page.tsx             | grep -q "CommunitiesClient"

        git show HEAD:apps/web/app/messages/layout.tsx             | grep -q "FORRUM_PROTECTED_ROUTE_V6"

        echo "FORRUM V6.2 is present in origin/main."
