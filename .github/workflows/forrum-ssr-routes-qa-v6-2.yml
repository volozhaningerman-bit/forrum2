        ROUTE_CSS = '\n/* FORRUM SSR AND ROUTE STATES V6 */\n.brand-mark::before {\n  content: "F";\n}\n\n.route-state {\n  display: grid;\n  width: min(620px, 100%);\n  min-height: 220px;\n  place-content: center;\n  justify-items: center;\n  gap: 10px;\n  margin: 48px auto;\n  padding: 28px;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  background: var(--surface);\n  text-align: center;\n}\n\n.route-state strong {\n  font-size: 20px;\n}\n\n.route-state p {\n  max-width: 460px;\n  margin: 0;\n  color: var(--muted);\n}\n\n.route-state small {\n  color: var(--muted);\n}\n\n.route-spinner {\n  width: 26px;\n  height: 26px;\n  border: 2px solid var(--line);\n  border-top-color: var(--accent);\n  border-radius: 50%;\n  animation: forrum-route-spin .75s linear infinite;\n}\n\n.auth-required-panel {\n  display: grid;\n  gap: 14px;\n}\n\n.auth-required-panel p {\n  margin: 0;\n  color: var(--muted);\n  line-height: 1.55;\n}\n\n@keyframes forrum-route-spin {\n  to {\n    transform: rotate(360deg);\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .route-spinner {\n    animation: none;\n  }\n}\n'

        def write(path, content):
            target = Path(path)
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_text(content.rstrip() + "\n", encoding="utf-8")

        def replace_once(path, old, new, marker):
            text = path.read_text(encoding="utf-8")
            if marker in text:
                return
            count = text.count(old)
            if count != 1:
                raise RuntimeError(
                    f"Expected one match in {path} for {marker}, got {count}"
                )
            path.write_text(text.replace(old, new, 1), encoding="utf-8")

        # Validate original client pages before writing new server wrappers.
        for spec in PATCH_SPECS:
            folder = Path(spec["directory"])
            page = folder / "page.tsx"
            client = folder / spec["client_name"]

            if not client.exists():
                if not page.exists():
                    raise RuntimeError(
                        f"Missing source page: {page}"
                    )

                source_text = page.read_text(encoding="utf-8")
                first_old = spec["replacements"][0][0]
                first_marker = spec["replacements"][0][2]

                if (
                    first_old not in source_text
                    and first_marker not in source_text
                ):
                    raise RuntimeError(
                        f"Original page {page} does not contain "
                        f"the expected client marker: {first_old}"
                    )

        header = Path("apps/web/components/site-header.tsx")
        header_text = header.read_text(encoding="utf-8")
        old_brand = '''            <span
                      className="brand-mark"
                      aria-hidden="true"
                    >
                      F
                    </span>'''
        new_brand = '''            <span
                      className="brand-mark"
                      aria-hidden="true"
                    />'''
        if new_brand not in header_text:
            if old_brand not in header_text:
                raise RuntimeError("SiteHeader brand markup changed unexpectedly")
            header_text = header_text.replace(old_brand, new_brand, 1)
        header.write_text(header_text, encoding="utf-8")

        for spec in PATCH_SPECS:
            folder = Path(spec["directory"])
            page = folder / "page.tsx"
            client = folder / spec["client_name"]

            if not client.exists():
                os.replace(page, client)

            for old, new, marker in spec["replacements"]:
                replace_once(client, old, new, marker)

        # Write server wrappers only after the original client pages
        # have been preserved and transformed.
        for path, content in STATIC_FILES.items():
            write(path, content)

        layout_template = '''import { requireUser } from '@/lib/server-api';

        // FORRUM_PROTECTED_ROUTE_V6
        export default async function __COMPONENT__Layout({
          children,
        }: {
          children: React.ReactNode;
        }) {
          await requireUser(__NEXT_PATH__);
          return children;
        }
        '''

        for route, next_path in PROTECTED.items():
            path = Path(f"apps/web/app/{route}/layout.tsx")
            if (
                path.exists()
                and "FORRUM_PROTECTED_ROUTE_V6"
                not in path.read_text(encoding="utf-8")
            ):
                raise RuntimeError(
                    f"Refusing to overwrite existing layout: {path}"
                )

            component = (
                route.replace("-", " ")
                .title()
                .replace(" ", "")
            )
            content = (
                layout_template
                .replace("__COMPONENT__", component)
                .replace("__NEXT_PATH__", repr(next_path))
            )
            write(str(path), content)

        admin_layout = Path("apps/web/app/admin/layout.tsx")
        if (
            admin_layout.exists()
            and "FORRUM_ADMIN_ROUTE_V6"
            not in admin_layout.read_text(encoding="utf-8")
        ):
            raise RuntimeError(
                "Refusing to overwrite existing admin layout"
            )

        write(
            str(admin_layout),
            '''import { redirect } from 'next/navigation';
        import { requireUser } from '@/lib/server-api';

        // FORRUM_ADMIN_ROUTE_V6
        export default async function AdminLayout({
          children,
        }: {
          children: React.ReactNode;
        }) {
          const me = await requireUser('/admin');

          if (!['OWNER', 'ADMIN'].includes(me.user.role)) {
            redirect('/');
          }

          return children;
        }
        ''',
        )

        css_path = Path("apps/web/app/globals.css")
        css = css_path.read_text(encoding="utf-8")
        marker = "/* FORRUM SSR AND ROUTE STATES V6 */"

        if marker not in css:
            css_path.write_text(
                css.rstrip()
                + "\n\n"
                + ROUTE_CSS.strip()
                + "\n",
                encoding="utf-8",
            )

        print("FORRUM V6 source update applied.")
