a: EventDetail;\\n}) {\\n  const [data, setData] =\\n    useState<EventDetail | null>(initialData);\", \"export function EventDetailClient\"], [\"  useEffect(() => { void load(); }, [id]);\", \"  useEffect(() => {\\n    setData(initialData);\\n    setError('');\\n  }, [initialData]);\", \"setData(initialData)\"]]}, {\"directory\": \"apps/web/app/p/[slug]\", \"client_name\": \"publication-client.tsx\", \"replacements\": [[\"type Publication = {\", \"export type Publication = {\", \"export type Publication\"], [\"import { useParams, useRouter } from 'next/navigation';\", \"import { useRouter } from 'next/navigation';\", \"export type Publication\"], [\"export default function PublicationPage() {\\n  const { slug } = useParams<{ slug: string }>();\\n  const router = useRouter();\\n  const [item, setItem] = useState<Publication | null>(null);\", \"export function PublicationClient({\\n  slug,\\n  initialData,\\n}: {\\n  slug: string;\\n  initialData: Publication;\\n}) {\\n  const router = useRouter();\\n  const [item, setItem] =\\n    useState<Publication | null>(initialData);\", \"export function PublicationClient\"]]}, {\"directory\": \"apps/web/app/u/[username]\", \"client_name\": \"profile-client.tsx\", \"replacements\": [[\"type Profile = {\", \"export type Profile = {\", \"export type Profile\"], [\"import { useParams } from 'next/navigation';\\n\", \"\", \"export type Profile\"], [\"export default function ProfilePage() {\\n  const { username } = useParams<{ username: string }>();\\n  const [profile, setProfile] = useState<Profile | null>(null);\", \"export function ProfileClient({\\n  username,\\n  initialData,\\n}: {\\n  username: string;\\n  initialData: Profile;\\n}) {\\n  const [profile, setProfile] =\\n    useState<Profile | null>(initialData);\", \"export function ProfileClient\"], [\"  useEffect(() => { void load(); }, [username]);\", \"  useEffect(() => {\\n    setProfile(initialData);\\n    setError('');\\n  }, [initialData]);\", \"setProfile(initialDat