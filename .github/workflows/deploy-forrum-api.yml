name: Deploy FORRUM API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "Dockerfile.api"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - ".github/workflows/deploy-forrum-api.yml"

  workflow_dispatch:

concurrency:
  group: forrum-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to FirstVDS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FORRUM_API_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/forrum_api_actions
          chmod 600 ~/.ssh/forrum_api_actions

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy FORRUM API
        shell: bash
        env:
          SSH_HOST: ${{ secrets.FORRUM_HOST }}
          SSH_USER: ${{ secrets.FORRUM_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/forrum_api_actions \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" deploy

      - name: Verify production API
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://api.4rrum.ru/v1/health
