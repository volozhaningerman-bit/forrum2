name: FORRUM Workflow Cleanup V18

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-workflow-cleanup-v18
  cancel-in-progress: false

jobs:
  cleanup-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          test -d .github/workflows
          test -f .github/workflows/forrum-workflow-cleanup-v18.yml

      - name: Discover legacy patch workflows
        shell: bash
        env:
          CLEANUP_PY: |
            from pathlib import Path
            import re
            import sys

            ROOT = Path(".github/workflows")
            SELF = ROOT / "forrum-workflow-cleanup-v18.yml"
            MANIFEST = Path("/tmp/forrum-workflow-cleanup-v18.txt")

            if not ROOT.exists():
                raise SystemExit(".github/workflows does not exist.")

            protected_name = re.compile(
                r"(?:^|[-_.])("
                r"ci|deploy|deployment|release|production|prod|railway|"
                r"docker|backup|migration|migrate|security|dependabot"
                r")(?:[-_.]|$)",
                re.I,
            )

            patch_name = re.compile(
                r"(?:"
                r"patch|polish|refinement|workspace|header|layout|navigation|"
                r"topic|home|section|editor|category|reference|visual-theme|"
                r"global-shell|create-topic|tree-hit|legacy|cleanup"
                r")",
                re.I,
            )

            def looks_like_generated_patch(path: Path, text: str) -> bool:
                name = path.name.lower()

                if path == SELF:
                    return True

                if protected_name.search(name):
                    return False

                if not name.startswith("forrum-"):
                    return False

                if "workflow_dispatch" not in text:
                    return False

                # Our generated patch workflows consistently contain these execution traits.
                traits = sum(
                    marker in text
                    for marker in (
                        "git diff --check",
                        "git push origin",
                        "forrum-actions",
                        "contents: write",
                        "typecheck",
                        "production build",
                    )
                )

                if patch_name.search(name) and traits >= 2:
                    return True

                # Catch generic leftovers such as forrum-patch.yml / forrum-patch(1).yml.
                if re.search(r"forrum[-_ ]*patch", name, re.I) and traits >= 1:
                    return True

                return False

            all_workflows = sorted(
                path
                for path in ROOT.iterdir()
                if path.is_file() and path.suffix.lower() in {".yml", ".yaml"}
            )

            delete = []
            preserve = []

            for path in all_workflows:
                text = path.read_text(encoding="utf-8", errors="replace")

                if looks_like_generated_patch(path, text):
                    delete.append(path)
                else:
                    preserve.append(path)

            print("=== WORKFLOWS TO DELETE ===")
            for path in delete:
                print(path)

            print("\n=== WORKFLOWS TO PRESERVE ===")
            for path in preserve:
                print(path)

            # Hard safety: protected operational names may never be deleted.
            unsafe = [
                path
                for path in delete
                if protected_name.search(path.name)
            ]

            if unsafe:
                print("\nREFUSING: protected workflow matched deletion list:", file=sys.stderr)
                for path in unsafe:
                    print(path, file=sys.stderr)
                raise SystemExit(2)

            # Hard safety: only workflow YAML files may be listed.
            for path in delete:
                try:
                    path.relative_to(ROOT)
                except ValueError:
                    raise SystemExit(f"Unsafe path outside workflows: {path}")

                if path.suffix.lower() not in {".yml", ".yaml"}:
                    raise SystemExit(f"Unsafe non-YAML deletion candidate: {path}")

            MANIFEST.write_text(
                "\n".join(str(path) for path in delete) + ("\n" if delete else ""),
                encoding="utf-8",
            )

            print(f"\nDeletion manifest: {MANIFEST}")
            print(f"Delete count: {len(delete)}")
            print(f"Preserve count: {len(preserve)}")
        run: |
          set -euo pipefail
          printf '%s\n' "$CLEANUP_PY" > /tmp/forrum-workflow-cleanup-v18.py
          python3 -m py_compile /tmp/forrum-workflow-cleanup-v18.py
          python3 /tmp/forrum-workflow-cleanup-v18.py
          test -f /tmp/forrum-workflow-cleanup-v18.txt

      - name: Validate deletion manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest=/tmp/forrum-workflow-cleanup-v18.txt

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                echo "::error::Unsafe manifest path: $file"
                exit 1
                ;;
            esac

            case "$(basename "$file" | tr '[:upper:]' '[:lower:]')" in
              *-ci-*|ci-*|*-ci.yml|*-ci.yaml|              *deploy*|*release*|*production*|*railway*|              *docker*|*backup*|*migration*|*security*|*dependabot*)
                echo "::error::Protected operational workflow in deletion manifest: $file"
                exit 1
                ;;
            esac
          done < "$manifest"

          echo "Manifest safety validation passed."

      - name: Delete legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail

          manifest=/tmp/forrum-workflow-cleanup-v18.txt

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            test -f "$file"
            echo "Deleting legacy patch workflow: $file"
            rm -- "$file"
          done < "$manifest"

      - name: Verify workflow cleanup
        shell: bash
        run: |
          set -euo pipefail

          # No source/application files may be modified.
          bad="$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//' |
            grep -Ev '^\.github/workflows/[^/]+\.ya?ml$' || true
          )"

          if [ -n "$bad" ]; then
            echo "::error::Cleanup touched files outside .github/workflows:"
            printf '%s\n' "$bad"
            exit 1
          fi

          # Every change must be a deletion of a workflow YAML.
          while IFS= read -r line; do
            [ -n "$line" ] || continue

            status="${line:0:2}"
            path="${line:3}"

            case "$status" in
              " D"|"D ")
                ;;
              *)
                echo "::error::Unexpected workflow change status '$status' for $path"
                exit 1
                ;;
            esac

            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                echo "::error::Unexpected deletion path: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)

          echo
          echo "Remaining workflow files:"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort || true

      - name: Commit workflow cleanup
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No legacy patch workflows were found."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"

          git add -A .github/workflows
          git diff --cached --check

          # Final staged-scope audit.
          bad="$(
            git diff --cached --name-only |
            grep -Ev '^\.github/workflows/[^/]+\.ya?ml$' || true
          )"

          if [ -n "$bad" ]; then
            echo "::error::Staged changes outside workflow folder:"
            printf '%s\n' "$bad"
            exit 1
          fi

          git commit -m "Clean legacy FORRUM patch workflows V18"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Verify cleanup after rebase
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain)"

          echo "Workflow files that remain after cleanup:"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort || true

          # Cleanup workflow itself is expected to be deleted.
          test ! -f .github/workflows/forrum-workflow-cleanup-v18.yml

      - name: Push workflow cleanup
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Verify remote commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Published FORRUM Workflow Cleanup V18: $(git rev-parse HEAD)"
