name: FORRUM AI Design Audit V8.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-canonical-interface
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: "4000"
  PORT: "3000"

jobs:
  audit-fix-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify clean V8 baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/web/app/globals.css
          test -f apps/web/components/home-dashboard.tsx
          test -f 'apps/web/app/communities/[slug]/community-client.tsx'
          test -f apps/web/app/communities/communities-client.tsx

          grep -q "FORRUM_CANONICAL_INTERFACE_V8" apps/web/app/globals.css
          grep -q "home-tree-hitarea" apps/web/components/home-dashboard.tsx
          grep -q "community-browser-hitarea" apps/web/app/communities/communities-client.tsx
          grep -q "community-profile" 'apps/web/app/communities/[slug]/community-client.tsx'

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "The checkout is not clean before the V8.1 patch."
            git status --short
            exit 1
          fi

      - name: Apply confirmed anti-template corrections
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          MARKER = "/* FORRUM_AI_DESIGN_AUDIT_V8_1 */"
          CSS = r'''
          /* FORRUM_AI_DESIGN_AUDIT_V8_1
             A narrow correction layer over V8. It removes only confirmed
             template-like excess: oversized sparse headers, cardified child
             navigation, undersized secondary text and decorative modal blur.
          */

          /* The homepage no longer needs a separate visible "Главная" panel. */
          .home-commandbar {
            min-height: 0 !important;
            justify-content: flex-end !important;
            padding: 0 0 8px !important;
            border: 0 !important;
            background: transparent !important;
          }

          /* Category identity stays expressive, but no longer consumes 230+ px. */
          .community-profile {
            grid-template-columns: 152px minmax(0, 1fr) 248px !important;
            min-height: 168px !important;
          }

          .community-cover {
            min-height: 168px !important;
          }

          .community-cover .community-mark {
            width: 76px !important;
            height: 76px !important;
          }

          .community-profile-main {
            padding: 18px 20px 16px !important;
          }

          .community-title-row h1 {
            margin: 0 0 6px !important;
            font-size: clamp(24px, 2.2vw, 29px) !important;
            line-height: 1.12;
            letter-spacing: -.018em;
          }

          .community-title-row p {
            max-width: 720px;
            font-size: 13.5px !important;
            line-height: 1.48;
          }

          .curator-panel {
            padding: 16px 18px !important;
            background: #fbfbfa !important;
          }

          .curator-person .avatar {
            width: 44px !important;
            height: 44px !important;
          }

          .community-toolbar {
            min-height: 42px !important;
            padding-block: 5px !important;
          }

          /* Subdivisions are navigation rows, not a carousel of equal cards. */
          .child-community-strip {
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 8px !important;
            padding: 10px 14px !important;
          }

          .child-community-strip nav {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 18px !important;
            overflow: visible !important;
          }

          .child-community-strip nav a {
            min-width: 0 !important;
            padding: 9px 2px !important;
            border: 0 !important;
            border-top: 1px solid var(--line) !important;
            border-radius: 0 !important;
            background: transparent !important;
          }

          .child-community-strip nav a:hover,
          .child-community-strip nav a:focus-visible {
            background: var(--surface-soft) !important;
          }

          /* Restore readable hierarchy without inflating the whole interface. */
          .community-browser-title strong {
            font-size: 14.5px;
            line-height: 1.25;
          }

          .community-browser-copy > p {
            margin-block: 4px !important;
            color: #555552 !important;
            font-size: 12.5px !important;
            line-height: 1.4;
          }

          .community-browser-meta {
            color: #73736f !important;
            font-size: 11.5px !important;
            line-height: 1.35;
          }

          .home-topic-copy p,
          .publication-main p,
          .activity-copy p,
          .media-partner-copy p,
          .workshop-compact-card p {
            font-size: 13px !important;
          }

          /* Loading, empty and error states stay present, but stop looking like heroes. */
          .route-state {
            min-height: 156px !important;
            margin: 30px auto !important;
            padding: 20px 22px !important;
          }

          .empty-state,
          .compact-empty-state {
            padding: 18px 16px !important;
          }

          /* A modal needs separation, not a decorative glass effect. */
          .telegram-share-backdrop {
            background: rgba(24, 24, 22, .48) !important;
            backdrop-filter: none !important;
          }

          .telegram-share-dialog {
            border-radius: 5px !important;
            box-shadow: 0 16px 44px rgba(24, 24, 22, .16) !important;
          }

          @media (max-width: 1050px) {
            .community-profile {
              grid-template-columns: 138px minmax(0, 1fr) 220px !important;
            }
          }

          @media (max-width: 820px) {
            .community-profile {
              grid-template-columns: minmax(0, 1fr) !important;
              min-height: 0 !important;
            }

            .community-cover {
              min-height: 128px !important;
              border-right: 0 !important;
              border-bottom: 1px solid var(--line) !important;
            }

            .community-profile-main,
            .curator-panel {
              padding: 15px 16px !important;
            }

            .curator-panel {
              border-left: 0 !important;
              border-top: 1px solid var(--line) !important;
            }

            .child-community-strip nav {
              grid-template-columns: minmax(0, 1fr);
            }
          }
          '''

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          css_path = "apps/web/app/globals.css"
          css = read(css_path)
          if MARKER not in css:
              write(css_path, css.rstrip() + "\n\n" + CSS.strip() + "\n")

          home_path = "apps/web/components/home-dashboard.tsx"
          home = read(home_path)
          old_home = '<h1>Главная</h1>'
          new_home = '<h1 className="visually-hidden">Главная</h1>'
          if old_home in home:
              home = home.replace(old_home, new_home, 1)
          elif new_home not in home:
              raise RuntimeError("Visible homepage heading marker was not found")
          write(home_path, home)

          telegram_path = Path("apps/web/components/telegram-share-button.tsx")
          if telegram_path.exists():
              telegram = telegram_path.read_text(encoding="utf-8")
              duplicate = '<span className="eyebrow">Telegram Share</span>\n'
              if duplicate in telegram:
                  telegram = telegram.replace(duplicate, "", 1)
                  telegram_path.write_text(telegram, encoding="utf-8")

          audit_script = r'''import fs from 'node:fs';

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function requireMarker(source, marker, label) {
            if (!source.includes(marker)) {
              throw new Error(`${label}: missing ${marker}`);
            }
          }

          function forbidMarker(source, marker, label) {
            if (source.includes(marker)) {
              throw new Error(`${label}: forbidden ${marker}`);
            }
          }

          const css = read('apps/web/app/globals.css');
          const home = read('apps/web/components/home-dashboard.tsx');
          const catalogue = read(
            'apps/web/app/communities/communities-client.tsx',
          );
          const community = read(
            'apps/web/app/communities/[slug]/community-client.tsx',
          );

          requireMarker(css, 'FORRUM_CANONICAL_INTERFACE_V8', 'V8 baseline');
          requireMarker(css, 'FORRUM_AI_DESIGN_AUDIT_V8_1', 'V8.1 CSS');
          requireMarker(css, 'min-height: 168px !important', 'compact community header');
          requireMarker(css, 'repeat(2, minmax(0, 1fr))', 'dense child navigation');
          requireMarker(css, 'font-size: 12.5px !important', 'readable secondary text');
          requireMarker(css, 'backdrop-filter: none !important', 'non-glass modal');

          requireMarker(home, 'className="visually-hidden">Главная</h1>', 'home heading');
          forbidMarker(home, '<h1>Главная</h1>', 'visible standalone home heading');
          requireMarker(home, 'home-tree-hitarea', 'home navigation behavior');
          requireMarker(catalogue, 'community-browser-hitarea', 'catalogue behavior');
          requireMarker(community, 'community-profile', 'community architecture');
          requireMarker(community, 'child-community-strip', 'child communities');

          const telegramPath = 'apps/web/components/telegram-share-button.tsx';
          if (fs.existsSync(telegramPath)) {
            forbidMarker(
              read(telegramPath),
              '<span className="eyebrow">Telegram Share</span>',
              'duplicated Telegram heading',
            );
          }

          console.log('Confirmed AI-design corrections passed without architecture changes.');
          '''
          write("scripts/ai-design-audit-check.mjs", audit_script.strip() + "\n")

          report = r'''# FORRUM — жёсткий аудит AI-generated design, V8.1

          База: `forrum-canonical-interface-v8.yml`.

          ## Исправлены только подтверждённые проблемы

          1. Видимый самостоятельный блок «Главная» на главной странице.
          2. Шапка категории высотой более 230 px с тремя равнозначными колонками и крупными отступами.
          3. Подразделы в виде горизонтальной ленты одинаковых карточек.
          4. Вторичный текст каталога размером 10–11 px.
          5. Слишком крупные контейнеры loading/empty/error при малом объёме текста.
          6. Декоративный blur и дублирующая англоязычная подпись в окне Telegram.

          ## Не изменено

          - трёхколоночная архитектура главной;
          - дерево категорий и механика раскрытия;
          - маршруты, API, Prisma и модель данных;
          - состояния загрузки, ошибки, пустой выдачи и disabled;
          - уникальные изображения категорий, цветные ники и смысловые хэштеги;
          - ранжирование, подписки, кураторство и рабочие действия.

          ## Защитный контракт

          `scripts/ai-design-audit-check.mjs` не допускает возврата отдельного видимого блока «Главная», огромной шапки категории, карточной карусели подразделов, стеклянного Telegram-модального окна и потери интерактивной архитектуры V8.
          '''
          write("docs/FORRUM_AI_DESIGN_AUDIT_V8_1.md", report.strip() + "\n")

          current = Path('.github/workflows/forrum-ai-design-audit-v8-1.yml')
          for workflow in Path('.github/workflows').glob('*.y*ml'):
              if workflow != current:
                  workflow.unlink()

          print("FORRUM V8.1 targeted anti-template corrections applied.")
          PY

      - name: Verify patch scope and visual contract
        shell: bash
        run: |
          set -euo pipefail

          node scripts/ai-design-audit-check.mjs
          git diff --check

          allowed='^(apps/web/app/globals\.css|apps/web/components/home-dashboard\.tsx|apps/web/components/telegram-share-button\.tsx|scripts/ai-design-audit-check\.mjs|docs/FORRUM_AI_DESIGN_AUDIT_V8_1\.md|\.github/workflows/.*\.ya?ml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"

          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          test -f .github/workflows/forrum-ai-design-audit-v8-1.yml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX and accessibility checks
        run: |
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/ai-design-audit-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        env:
          NODE_ENV: production
        run: |
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Commit and push verified V8.1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git add -A apps/web scripts docs .github/workflows

          if git diff --cached --quiet; then
            echo "FORRUM V8.1 is already present in main."
          else
            git commit -m "Tighten FORRUM visual hierarchy after AI-design audit"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"

          test "$LOCAL_SHA" = "$REMOTE_SHA"

          git grep -q -F "FORRUM_AI_DESIGN_AUDIT_V8_1" HEAD -- apps/web/app/globals.css
          git grep -q -F 'className="visually-hidden">Главная</h1>' HEAD -- apps/web/components/home-dashboard.tsx
          git grep -q -F "Confirmed AI-design corrections passed" HEAD -- scripts/ai-design-audit-check.mjs

          test "$(git ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$' | wc -l)" -eq 1
          git ls-tree -r --name-only HEAD .github/workflows | grep -qx '.github/workflows/forrum-ai-design-audit-v8-1.yml'

          echo "FORRUM V8.1 is verified in origin/main."
