name: FORRUM Home Redesign V11.H.2
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-home-redesign-v11-h-2
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  stage-h-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify approved Stage H baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f apps/web/app/layout.tsx
          test -f apps/web/components/site-footer.tsx
          test -f apps/web/app/rules/page.tsx
          test -f apps/web/app/support/page.tsx
          grep -q 'FORRUM_HOME_REDESIGN_STAGE_H_V11' apps/web/app/globals.css
          grep -q 'home-curator-requirements-stage-h' apps/web/components/home-dashboard.tsx
          grep -q 'home-right-stage-f' apps/web/components/home-dashboard.tsx
          grep -q '<SiteFooter/>' apps/web/app/layout.tsx
          test -z "$(git status --porcelain)"

      - name: Restore canonical content and footer width Stage H.2
        shell: bash
        env:
          STAGE_H2_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$STAGE_H2_PATCH_B64" | base64 -d > /tmp/forrum-stage-h2-patch.py
          python3 /tmp/forrum-stage-h2-patch.py

      - name: Verify Stage H.2 scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/home-redesign-stage-g-check.mjs
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs
          git diff --check

          allowed='^(apps/web/app/globals\.css|scripts/home-redesign-stage-h2-check\.mjs|docs/FORRUM_HOME_REDESIGN_STAGE_H2_V11\.md)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files were changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create isolated Stage H.2 commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"
          git add --             apps/web/app/globals.css             scripts/home-redesign-stage-h2-check.mjs             docs/FORRUM_HOME_REDESIGN_STAGE_H2_V11.md

          if git diff --cached --quiet; then
            echo 'Stage H.2 is already present.'
          else
            git commit -m "Restore FORRUM shell width after footer integration"
          fi
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund --package-lock=false

      - name: Generate validate sync and seed Prisma
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:validate
          npm run db:push
          npm run db:seed

      - name: Static UX accessibility and Stage H.2 checks
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          node scripts/home-redesign-stage-h2-check.mjs
          node scripts/home-redesign-stage-h-check.mjs
          node scripts/home-redesign-stage-g-check.mjs
          node scripts/home-redesign-stage-d-check.mjs
          node scripts/home-redesign-stage-e-check.mjs
          node scripts/home-redesign-stage-f-check.mjs
          node scripts/ui-interaction-check.mjs

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Run API tests
        run: npm run test -w @forrum/api

      - name: Clean production build
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          rm -rf apps/web/.next apps/api/dist packages/contracts/dist
          npm run build -w @forrum/contracts
          npm run build -w @forrum/api
          npm run build -w @forrum/web

      - name: Remove generated build noise
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

      - name: Push verified Stage H.2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Local:  $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
