name: Deployment credential presence diagnostics

on:
  push:
    branches:
      - diag/railway-production-v53

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured deployment secret names
        env:
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
          HAS_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN != '' }}
          HAS_RAILWAY_DEPLOY_HOOK_WEB: ${{ secrets.RAILWAY_DEPLOY_HOOK_WEB != '' }}
          HAS_RAILWAY_DEPLOY_HOOK_API: ${{ secrets.RAILWAY_DEPLOY_HOOK_API != '' }}
          HAS_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_SSH_KEY: ${{ secrets.SSH_KEY != '' }}
          HAS_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_SERVER_HOST: ${{ secrets.SERVER_HOST != '' }}
          HAS_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_SERVER_USER: ${{ secrets.SERVER_USER != '' }}
          HAS_DEPLOY_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAS_VPS_USER: ${{ secrets.VPS_USER != '' }}
          HAS_SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD != '' }}
          HAS_SSH_PASSWORD: ${{ secrets.SSH_PASSWORD != '' }}
        run: env | grep '^HAS_' | sort
