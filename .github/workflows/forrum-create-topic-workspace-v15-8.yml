name: FORRUM Create Topic Workspace V15.8
run-name: FORRUM Create Topic Workspace V15.8
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: forrum-create-topic-workspace-v15-8
  cancel-in-progress: false
env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forrum?schema=public
  JWT_SECRET: forrum-github-actions-secret
  WEB_URL: http://127.0.0.1:3000
  API_INTERNAL_URL: http://127.0.0.1:4000/v1
  PUBLIC_API_URL: http://127.0.0.1:4000
  API_PORT: '4000'
  PORT: '3000'
jobs:
  create-topic-workspace-v15-8:
    name: Create Topic Workspace V15.8
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forrum
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d forrum" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - name: Check out canonical main
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
    - name: Verify installed V15.7.4 and detect V15.8
      id: baseline
      shell: bash
      run: "set -euo pipefail\n\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '// FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_2' \\\n  apps/web/app/create/publication-form.tsx)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_START */' \\\n  apps/web/app/globals.css)\" -eq 1\ntest \"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_WORKSPACE_V15_7_4_END */' \\\n  apps/web/app/globals.css)\" -eq 1\n\ngrep -Fq 'FORRUM_EDITOR_ENGINE_V15_6' \\\n  apps/web/components/bbcode-editor.tsx\ngrep -Fq 'FORRUM_TOPIC_REPLY_EDITOR_V15_6' \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\"\ngrep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12' \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\"\n\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\n\neditor_count=\"$(grep -Fxc '// FORRUM_CREATE_TOPIC_EDITOR_V15_8' \\\n  apps/web/components/bbcode-editor.tsx || true)\"\nform_count=\"$(grep -Fxc '// FORRUM_CREATE_TOPIC_EDITOR_V15_8' \\\n  apps/web/app/create/publication-form.tsx || true)\"\ncss_start_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_EDITOR_V15_8_START */' \\\n  apps/web/app/globals.css || true)\"\ncss_end_count=\"$(grep -Fxc '/* FORRUM_CREATE_TOPIC_EDITOR_V15_8_END */' \\\n  apps/web/app/globals.css || true)\"\ncheck_count=\"$(grep -Fc 'Create Topic Editor V15.8 passed:' \\\n  scripts/create-topic-editor-v15-8-check.mjs 2>/dev/null || true)\"\ndoc_count=\"$(grep -Fxc '# FORRUM Create Topic Workspace V15.8' \\\n  docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_8.md 2>/dev/null || true)\"\napply_count=\"$(grep -Fc 'editor constants' \\\n  scripts/create-topic-editor-v15-8-apply.py 2>/dev/null || true)\"\n\nfor count in \"$editor_count\" \"$form_count\" \"$css_start_count\" \\\n  \"$css_end_count\" \"$check_count\" \"$doc_count\" \"$apply_count\"; do\n  test \"$count\" -le 1\ndone\n\nif [ \"$editor_count\" -ne \"$form_count\" ] || \\\n   [ \"$editor_count\" -ne \"$css_start_count\" ] || \\\n   [ \"$editor_count\" -ne \"$css_end_count\" ] || \\\n   [ \"$editor_count\" -ne \"$check_count\" ] || \\\n   [ \"$editor_count\" -ne \"$doc_count\" ] || \\\n   [ \"$editor_count\" -ne \"$apply_count\" ]; then\n  echo 'Partial V15.8 marker state detected.'\n  exit 1\nfi\n\nif [ \"$editor_count\" -eq 1 ]; then\n  node scripts/create-topic-editor-v15-8-check.mjs\n  echo 'already_applied=true' >> \"$GITHUB_OUTPUT\"\n  echo 'Create Topic Editor V15.8 is already applied and valid.'\nelse\n  echo 'already_applied=false' >> \"$GITHUB_OUTPUT\"\nfi\n\ntest -z \"$(git status --porcelain)\""
    - name: Apply Create Topic Workspace V15.8
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      env:
        APPLY_B64: 
        CHECK_B64: 
        DOC_B64: 
      run: "set -euo pipefail\n\nprintf '%s' \"$APPLY_B64\" | base64 -d \\\n  > scripts/create-topic-editor-v15-8-apply.py\nprintf '%s' \"$CHECK_B64\" | base64 -d \\\n  > scripts/create-topic-editor-v15-8-check.mjs\nprintf '%s' \"$DOC_B64\" | base64 -d \\\n  > docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_8.md\n\npython3 scripts/create-topic-editor-v15-8-apply.py"
    - name: Verify V15.8 contracts and protected scope
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\nnode scripts/create-topic-editor-v15-8-check.mjs\nnode scripts/create-topic-workspace-v15-7-check.mjs\nnode scripts/topic-reply-editor-v15-6-check.mjs\nnode scripts/topic-post-surface-v15-5-check.mjs\nnode scripts/topic-page-frame-v15-4-check.mjs\nnode scripts/category-page-stage-1-v14-check.mjs\nnode scripts/section-page-header-v14-3-check.mjs\nnode scripts/section-page-layout-v14-7-check.mjs\nnode scripts/section-page-polish-v14-8-check.mjs\nnode scripts/section-tree-hit-area-v14-12-check.mjs\nnode scripts/global-header-v13-4-check.mjs\nnode scripts/communities-redesign-stage-f5-check.mjs\nnode scripts/home-redesign-stage-h2-check.mjs\nnode scripts/home-redesign-stage-h-check.mjs\nnode scripts/ui-interaction-check.mjs\n\ngit diff --check\n\nallowed='^(apps/web/app/create/publication-form\\.tsx|apps/web/components/bbcode-editor\\.tsx|apps/web/app/globals\\.css|scripts/create-topic-editor-v15-8-(apply\\.py|check\\.mjs)|docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_8\\.md)$'\nunexpected=\"$(git diff --name-only | grep -Ev \"$allowed\" || true)\"\n\nif [ -n \"$unexpected\" ]; then\n  echo 'Unexpected files changed:'\n  echo \"$unexpected\"\n  exit 1\nfi\n\nif git diff -- \\\n  \"apps/web/app/communities/[slug]/category-page.tsx\" \\\n  \"apps/web/app/p/[slug]/publication-client.tsx\" \\\n  apps/web/components/topic-category-tree.tsx \\\n  apps/web/components/bbcode-content.tsx \\\n  apps/web/lib/bbcode.ts \\\n  apps/web/components/main-nav.tsx \\\n  apps/web/components/site-header.tsx \\\n  apps/web/components/site-footer.tsx \\\n  apps/web/components/home-dashboard.tsx \\\n  apps/web/app/page.tsx \\\n  apps/api/src \\\n  apps/api/prisma | grep -q .; then\n  echo 'V15.8 changed protected topic/section/parser/header/home/backend scope.'\n  exit 1\nfi"
    - name: Create isolated verified V15.8 commit
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git config user.name "FORRUM QA updater"

        git config user.email "actions@users.noreply.github.com"


        git add --   apps/web/app/create/publication-form.tsx   apps/web/components/bbcode-editor.tsx   apps/web/app/globals.css   scripts/create-topic-editor-v15-8-apply.py   scripts/create-topic-editor-v15-8-check.mjs   docs/FORRUM_CREATE_TOPIC_WORKSPACE_V15_8.md


        git commit -m "Refine Create Topic editor V15.8"

        test -z "$(git status --porcelain)"'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      if: steps.baseline.outputs.already_applied != 'true'
      with:
        node-version: '24'
    - name: Install dependencies without creating a lock file
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm install --package-lock=false


        test ! -f package-lock.json'
    - name: Generate validate sync and seed Prisma
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run db:generate

        npm run db:validate

        npm run db:push

        npm run db:seed'
    - name: Static UX accessibility and regression checks
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        npm run validate:static

        npm run validate:ux

        npm run validate:a11y


        node scripts/create-topic-editor-v15-8-check.mjs

        node scripts/create-topic-workspace-v15-7-check.mjs

        node scripts/topic-reply-editor-v15-6-check.mjs

        node scripts/topic-post-surface-v15-5-check.mjs

        node scripts/topic-page-frame-v15-4-check.mjs

        node scripts/section-tree-hit-area-v14-12-check.mjs

        node scripts/global-header-v13-4-check.mjs

        node scripts/ui-interaction-check.mjs'
    - name: Typecheck every workspace
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run typecheck
    - name: Run API tests
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm test
    - name: Clean production build
      if: steps.baseline.outputs.already_applied != 'true'
      run: npm run build
    - name: Remove generated build noise
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git reset --hard HEAD

        git clean -ffdx


        test -z "$(git status --porcelain)"'
    - name: Push verified Create Topic Workspace V15.8
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: 'set -euo pipefail


        git fetch origin main

        git rebase origin/main

        git push origin HEAD:main'
    - name: Verify remote main
      if: steps.baseline.outputs.already_applied != 'true'
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse origin/main)\"\n\ngit show origin/main:apps/web/components/bbcode-editor.tsx \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_EDITOR_V15_8'\ngit show origin/main:apps/web/app/create/publication-form.tsx \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_EDITOR_V15_8'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_EDITOR_V15_8_START'\ngit show origin/main:apps/web/app/globals.css \\\n  | grep -Fq 'FORRUM_CREATE_TOPIC_EDITOR_V15_8_END'\ngit show 'origin/main:apps/web/app/p/[slug]/publication-client.tsx' \\\n  | grep -Fq 'FORRUM_TOPIC_REPLY_EDITOR_V15_6'\ngit show 'origin/main:apps/web/app/communities/[slug]/category-page.tsx' \\\n  | grep -Fq 'FORRUM_SECTION_TREE_HIT_AREA_V14_12'\n\nnode scripts/create-topic-editor-v15-8-check.mjs\necho 'FORRUM Create Topic Workspace V15.8 remote verification passed.' "
    - name: Confirm V15.8 was already valid
      if: steps.baseline.outputs.already_applied == 'true'
      shell: bash
      run: echo 'FORRUM Create Topic Workspace V15.8 was already applied; no files changed.'
