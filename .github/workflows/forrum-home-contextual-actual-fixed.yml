name: FORRUM Home Cleanup — Contextual Actual

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-home-contextual-actual
  cancel-in-progress: false

jobs:
  contextual-actual:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FORRUM HOME CLEANUP — CONTEXTUAL ACTUAL ==="

          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          test -f apps/web/components/home-dashboard.tsx
          test -f apps/web/app/globals.css
          test -f .github/workflows/forrum-home-contextual-actual.yml

          grep -Fq '// FORRUM_HOME_V45_RIGHT_RAIL_NEWS' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '// FORRUM_HOME_ACTUAL_ACTIVE_COMMUNITIES' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Актуальное"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'title="Активные голосования"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'const announcements' \
            apps/web/components/home-dashboard.tsx
          grep -Fq 'const activePolls' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '.brand' apps/web/app/globals.css
          grep -Fq '1580px' apps/web/app/globals.css

          echo "Baseline: PASS"

      - name: Write regression check first
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/home-contextual-actual-check.mjs <<'NODE'
          import fs from 'node:fs';

          const source = fs.readFileSync(
            'apps/web/components/home-dashboard.tsx',
            'utf8',
          );
          const css = fs.readFileSync(
            'apps/web/app/globals.css',
            'utf8',
          );

          for (const marker of [
            '// FORRUM_HOME_CONTEXTUAL_ACTUAL',
            'const actualAnnouncements = useMemo(() => {',
            'actualAnnouncements.map((item) => (',
            'activePolls.slice(0, 2).map((poll) => (',
            'title="Активные голосования"',
            'title="Новости FORRUM"',
          ]) {
            if (!source.includes(marker)) {
              throw new Error(`Missing production marker: ${marker}`);
            }
          }

          const actualStart = source.indexOf('title="Актуальное"');
          const weeklyStart = source.indexOf('<h2>Участники недели</h2>');

          if (actualStart < 0 || weeklyStart <= actualStart) {
            throw new Error('Could not locate Actual panel boundaries.');
          }

          const actual = source.slice(actualStart, weeklyStart);

          if (actual.includes('activeCommunities.map((community) => (')) {
            throw new Error('Actual still duplicates communities.');
          }

          if (actual.includes('discussed.slice(0, 3).map((item) => (')) {
            throw new Error('Actual still duplicates discussed topics.');
          }

          if (
            !source.includes(
              '(activePolls.length > 0 || actualAnnouncements.length > 0) && (',
            )
          ) {
            throw new Error('Actual is not conditional.');
          }

          if (!source.includes('activePolls.length > 0 && (')) {
            throw new Error('Empty active-polls section is not hidden.');
          }

          for (const marker of [
            '/* FORRUM_LOGO_DARK_HOVER_FIX */',
            'html.dark .brand:hover',
            'html.dark .brand:focus-visible',
            'html[data-forrum-theme="graphite"] .brand:hover',
          ]) {
            if (!css.includes(marker)) {
              throw new Error(`Missing logo hover fix: ${marker}`);
            }
          }

          console.log(
            'Contextual Actual: PASS — no duplicate blocks, empty polls hidden, logo hover protected.',
          );
          NODE

      - name: TDD RED
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/home-contextual-actual-check.mjs; then
            echo "::error::Regression check unexpectedly passed before implementation."
            exit 1
          fi

          echo "TDD RED confirmed."

      - name: Apply home logic cleanup
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/components/home-dashboard.tsx')
          source = path.read_text(encoding='utf-8')

          marker = '// FORRUM_HOME_CONTEXTUAL_ACTUAL'
          if marker in source:
              raise SystemExit('Contextual Actual patch already exists.')

          def statement_bounds(text, name):
              match = re.search(
                  rf'(?m)^  const {re.escape(name)}\b',
                  text,
              )
              if not match:
                  return None

              start = match.start()
              i = match.end()
              paren = 0
              bracket = 0
              brace = 0
              quote = None
              escaped = False

              while i < len(text):
                  ch = text[i]

                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch in ("'", '"', '`'):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren -= 1
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket -= 1
                  elif ch == '{':
                      brace += 1
                  elif ch == '}':
                      brace -= 1
                  elif (
                      ch == ';'
                      and paren == 0
                      and bracket == 0
                      and brace == 0
                  ):
                      end = i + 1
                      while end < len(text) and text[end] == '\n':
                          end += 1
                      return start, end

                  i += 1

              raise SystemExit(
                  f'Could not parse const statement: {name}'
              )

          def replace_home_panel(text, title, replacement):
              needle = f'title="{title}"'
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit(f'Could not find panel title: {title}')

              start = text.rfind('<HomePanel', 0, pos)
              end = text.find('</HomePanel>', pos)

              if start < 0 or end < 0:
                  raise SystemExit(
                      f'Could not locate HomePanel bounds: {title}'
                  )

              end += len('</HomePanel>')
              return text[:start] + replacement + text[end:]

          def wrap_home_panel(text, title, prefix, suffix):
              needle = f'title="{title}"'
              pos = text.find(needle)
              if pos < 0:
                  raise SystemExit(f'Could not find panel title: {title}')

              start = text.rfind('<HomePanel', 0, pos)
              end = text.find('</HomePanel>', pos)

              if start < 0 or end < 0:
                  raise SystemExit(
                      f'Could not locate HomePanel bounds: {title}'
                  )

              end += len('</HomePanel>')
              panel = text[start:end]
              return text[:start] + prefix + panel + suffix + text[end:]

          # Remove the previous active-community calculation.
          active_bounds = statement_bounds(source, 'activeCommunities')
          if active_bounds:
              start, end = active_bounds
              previous_marker = '// FORRUM_HOME_ACTUAL_ACTIVE_COMMUNITIES'
              marker_pos = source.rfind(previous_marker, 0, start)

              if marker_pos >= 0:
                  start = source.rfind('\n', 0, marker_pos) + 1

              source = source[:start] + source[end:]

          # Add a time-sensitive subset after the existing announcements const.
          announcements_bounds = statement_bounds(source, 'announcements')
          if not announcements_bounds:
              raise SystemExit(
                  'Could not locate announcements declaration.'
              )

          announcements_end = announcements_bounds[1]

          actual_data_lines = [
              '',
              '  ' + marker,
              '  const actualAnnouncements = useMemo(() => {',
              '    const now = Date.now();',
              '    return announcements',
              '      .filter((item) => {',
              '        if (!item.pinnedUntil) return false;',
              '        return new Date(item.pinnedUntil).getTime() > now;',
              '      })',
              '      .slice(0, 2);',
              '  }, [announcements]);',
              '',
          ]

          source = (
              source[:announcements_end]
              + '\n'.join(actual_data_lines)
              + source[announcements_end:]
          )

          # Actual = pinned important announcements and open polls only.
          actual_lines = [
              '{(activePolls.length > 0 || actualAnnouncements.length > 0) && (',
              '        <HomePanel',
              '          title="Актуальное"',
              '          href="/events"',
              '        >',
              '          <div className="forrum-home-v16__actual-list">',
              '            {actualAnnouncements.map((item) => (',
              '              <Link',
              '                className="forrum-home-v16__actual"',
              '                href={`/p/${item.slug}`}',
              '                key={`actual-${item.id}`}',
              '              >',
              '                <CommunityMark',
              '                  name={item.community.name}',
              '                  url={topicContentVisual(item)}',
              '                  size={30}',
              '                />',
              '                <span>',
              '                  <strong>{item.title || "Важное объявление"}</strong>',
              '                  <small>Важно сейчас</small>',
              '                </span>',
              '              </Link>',
              '            ))}',
              '            {activePolls.slice(0, 2).map((poll) => (',
              '              <Link',
              '                className="forrum-home-v16__actual"',
              '                href="/events"',
              '                key={`actual-poll-${poll.id}`}',
              '              >',
              '                <span',
              '                  className="forrum-home-v16__actual-symbol"',
              '                  aria-hidden="true"',
              '                >',
              '                  ▥',
              '                </span>',
              '                <span>',
              '                  <strong>{poll.title}</strong>',
              '                  <small>Идёт голосование</small>',
              '                </span>',
              '              </Link>',
              '            ))}',
              '          </div>',
              '        </HomePanel>',
              '      )}',
          ]

          source = replace_home_panel(
              source,
              'Актуальное',
              '\n'.join(actual_lines),
          )

          # Preserve the current poll component, only hide it when empty.
          source = wrap_home_panel(
              source,
              'Активные голосования',
              '{/* FORRUM_HOME_HIDE_EMPTY_POLLS */}\n'
              '        {activePolls.length > 0 && (\n',
              '\n        )}',
          )

          path.write_text(
              '\n'.join(
                  line.rstrip(' \t')
                  for line in source.splitlines()
              ) + '\n',
              encoding='utf-8',
          )

          print('Home contextual cleanup applied.')
          PY

          git diff --check

      - name: Fix dark logo hover
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/globals.css')
          css = path.read_text(encoding='utf-8')

          marker = '/* FORRUM_LOGO_DARK_HOVER_FIX */'
          if marker in css:
              raise SystemExit('Logo hover fix already exists.')

          if '.brand' not in css:
              raise SystemExit('Could not locate brand styling.')

          lines = [
              '',
              marker,
              'html.dark .brand:hover,',
              'html.dark .brand:focus-visible,',
              '.dark .brand:hover,',
              '.dark .brand:focus-visible,',
              'html[data-forrum-theme="graphite"] .brand:hover,',
              'html[data-forrum-theme="graphite"] .brand:focus-visible {',
              '  color: var(--fvt-text, var(--text));',
              '}',
              '',
          ]

          css = css.rstrip() + '\n' + '\n'.join(lines)
          path.write_text(css, encoding='utf-8')

          print('Dark logo hover fixed.')
          PY

          git diff --check

      - name: TDD GREEN
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-contextual-actual-check.mjs
          echo "TDD GREEN confirmed."

      - name: Scope audit
        shell: bash
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"

          expected="$(
            printf '%s\n' \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-contextual-actual-check.mjs |
            sort
          )"

          printf 'Changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"

          test -z "$(
            git diff --name-only -- \
              apps/web/components/main-nav.tsx \
              apps/web/app/page.tsx \
              apps/api \
              packages/contracts
          )"

          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '// FORRUM_HOME_V45_RIGHT_RAIL_NEWS' \
            apps/web/components/home-dashboard.tsx

          ! git diff | grep -Eq \
            'fakePoll|fakeUser|mockPoll|mockUser|demoPoll|demoUser'

          echo "Scope audit: PASS"

      - name: Stage verified patch
        shell: bash
        run: |
          set -euo pipefail

          git add -- \
            apps/web/app/globals.css \
            apps/web/components/home-dashboard.tsx \
            scripts/home-contextual-actual-check.mjs

          git diff --cached --check

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install \
            --include=dev \
            --no-audit \
            --no-fund \
            --package-lock=false

      - name: Validate Prisma
        shell: bash
        env:
          DATABASE_URL: postgresql://forrum:forrum@127.0.0.1:5432/forrum_ci?schema=public
        run: |
          set -euo pipefail

          npm run db:validate
          npm run db:generate

      - name: Full product verification
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-contextual-actual-check.mjs

          npm run validate:static
          npm run validate:ux
          npm run validate:a11y

          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/api --if-present
          npm test -w @forrum/web --if-present

          npm run typecheck

          rm -rf apps/web/.next
          npm run build

      - name: Production self-review
        shell: bash
        run: |
          set -euo pipefail

          node scripts/home-contextual-actual-check.mjs

          grep -Fq '1580px' apps/web/app/globals.css
          grep -Fq 'title="Новости FORRUM"' \
            apps/web/components/home-dashboard.tsx
          grep -Fq '// FORRUM_HOME_V45_RIGHT_RAIL_NEWS' \
            apps/web/components/home-dashboard.tsx

          ! git diff --cached | grep -Eq \
            'fakePoll|fakeUser|mockPoll|mockUser|demoPoll|demoUser'

          npm run typecheck
          npm run build

          echo "Production self-review: PASS"

      - name: Restore generated noise and self-delete
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- .
          git clean -ffdx

          git rm .github/workflows/forrum-home-contextual-actual.yml

          git diff --cached --check

          staged="$(
            git diff --cached --name-only |
            sort
          )"

          expected="$(
            printf '%s\n' \
              .github/workflows/forrum-home-contextual-actual.yml \
              apps/web/app/globals.css \
              apps/web/components/home-dashboard.tsx \
              scripts/home-contextual-actual-check.mjs |
            sort
          )"

          printf 'Final staged paths:\n%s\n' "$staged"
          test "$staged" = "$expected"

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "FORRUM QA updater"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "Make home Actual contextual and fix logo hover"

      - name: Publish only against unchanged main
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during verification. Rerun workflow."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify remote
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git show origin/main:apps/web/components/home-dashboard.tsx \
            | grep -Fq '// FORRUM_HOME_CONTEXTUAL_ACTUAL'

          git show origin/main:apps/web/app/globals.css \
            | grep -Fq '/* FORRUM_LOGO_DARK_HOVER_FIX */'

          if git cat-file -e \
            origin/main:.github/workflows/forrum-home-contextual-actual.yml \
            2>/dev/null
          then
            echo "::error::Workflow did not self-delete."
            exit 1
          fi

          echo "Contextual Actual cleanup published and workflow removed."
