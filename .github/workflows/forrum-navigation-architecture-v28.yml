name: FORRUM Navigation Architecture V28
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forrum-navigation-architecture-v28
  cancel-in-progress: false

env:
  NODE_ENV: test

jobs:
  navigation-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Inventory product before change
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"

          test -f apps/web/components/main-nav.tsx
          test -f scripts/home-reference-check.mjs
          test -f apps/web/app/services/page.tsx
          test -f apps/web/app/media/page.tsx
          test -f apps/web/app/news/page.tsx

          {
            echo "## FORRUM V28 — product mapping before code"
            echo
            echo "| Элемент | Существующая реализация | V28 |"
            echo "|---|---|---|"
            echo "| Главная | \`/\` | сохранить |"
            echo "| Сообщества | \`/communities\` | сохранить |"
            echo "| Услуги | \`/services\` page существует | вернуть в header |"
            echo "| Медиа | \`/media\` page существует | вернуть в header |"
            echo "| Новости | \`/news\` page + существующий API polling | вернуть в header, оживить unread |"
            echo "| Темы / Пользователи / Архив | предыдущая подмена header | убрать только из header |"
            if grep -q "redirect('/media')" apps/web/app/news/page.tsx; then
              echo
              echo "> /news сейчас перенаправляет в /media. V28 сохраняет это существующее поведение; отдельная News page — отдельное продуктовое решение."
            fi
            echo
            echo "> V27 dependency-order regression: static-check ran before npm dependencies existed. V28 installs dependencies first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode V28 product patch
        shell: bash
        env:
          PATCH_B64: 
          CHECK_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/forrum-navigation-v28.py
          printf '%s' "$CHECK_B64" | base64 -d > /tmp/forrum-navigation-v28-check.mjs
          python3 -m py_compile /tmp/forrum-navigation-v28.py
          node --check /tmp/forrum-navigation-v28-check.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install build dependencies
        run: >
          npm install --include=dev
          --no-audit --no-fund
          --package-lock=false

      - name: Verify TypeScript dependency before patch
        shell: bash
        run: |
          set -euo pipefail
          node -e "console.log('TypeScript:', require.resolve('typescript'))"
          node scripts/static-check.mjs

      - name: Apply V28 navigation architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/forrum-navigation-v28.py
          git diff --check
          node scripts/static-check.mjs
          node /tmp/forrum-navigation-v28-check.mjs
          node scripts/home-reference-check.mjs

      - name: Audit V28 git diff and scope
        shell: bash
        run: |
          set -euo pipefail
          echo "=== V28 DIFF ==="
          git diff -- apps/web/components/main-nav.tsx scripts/home-reference-check.mjs || true

          allowed='^(apps/web/components/main-nav\.tsx|scripts/home-reference-check\.mjs|scripts/navigation-product-contract-v28-check\.mjs)$'
          bad="$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//' |
            grep -Ev "$allowed" || true
          )"
          if [ -n "$bad" ]; then
            echo "::error::V28 changed files outside routing task:"
            printf '%s\n' "$bad"
            exit 1
          fi

          test -z "$(
            git diff --name-only |
            grep -E 'globals\.css|home-dashboard\.tsx|apps/api|packages/contracts' || true
          )"

      - name: Run existing FORRUM design contracts
        shell: bash
        run: |
          set -euo pipefail
          for checker in             scripts/home-paper-graphite-v16-check.mjs             scripts/global-shell-v16-1-check.mjs             scripts/home-reference-check.mjs             scripts/home-scale-polish-check.mjs             scripts/home-visual-theme-check.mjs
          do
            if [ -f "$checker" ]; then
              node "$checker"
            fi
          done
          node /tmp/forrum-navigation-v28-check.mjs

      - name: Run static UX accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const ts = require("typescript");
          const path = "apps/web/components/main-nav.tsx";
          const source = fs.readFileSync(path, "utf8");
          const file = ts.createSourceFile(
            path,
            source,
            ts.ScriptTarget.Latest,
            true,
            ts.ScriptKind.TSX,
          );
          const diagnostics = file.parseDiagnostics ?? [];
          if (diagnostics.length) {
            for (const d of diagnostics) {
              const pos = file.getLineAndCharacterOfPosition(d.start ?? 0);
              console.error(
                `${path}:${pos.line + 1}:${pos.character + 1} ` +
                ts.flattenDiagnosticMessageText(d.messageText, "\n"),
              );
            }
            process.exit(1);
          }
          console.log("MainNav V28 TSX parser: PASS");
          NODE
          node /tmp/forrum-navigation-v28-check.mjs
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          git diff --check

      - name: Run relevant tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web

      - name: Find and fix one weakness
        shell: bash
        run: |
          set -euo pipefail
          node -e "console.log('TypeScript re-check:', require.resolve('typescript'))"
          grep -Fq "onClick={href === '/news' ? markNewsSeen : undefined}" apps/web/components/main-nav.tsx
          grep -Fq "localStorage.setItem(newsSeenKey, newsSignature)" apps/web/components/main-nav.tsx
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "apps/web/components/main-nav.tsx"
          ).read_text(encoding="utf-8")

          pattern = (
              r"async\s+function\s+checkNews\(\)[\s\S]*?"
              r"\n\s*\}\s*\n\s*\n?\s*void\s+checkNews\(\);"
          )

          if not re.search(pattern, source):
              raise SystemExit(
                  "V26 regression: checkNews is not closed before void checkNews()."
              )

          print("V26 missing-brace regression guard: PASS")
          PY

          node /tmp/forrum-navigation-v28-check.mjs
          npm run typecheck -w @forrum/web
          git diff --check
          echo "Weakness fixed: News unread clears before the current /news redirect."

      - name: Restore tracked build side effects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tracked_dirty < <(
            git status --porcelain=v1 --untracked-files=no |
            sed 's/^...//'
          )
          for path in "${tracked_dirty[@]}"; do
            [ -n "$path" ] || continue
            case "$path" in
              apps/web/components/main-nav.tsx|scripts/home-reference-check.mjs)
                continue
                ;;
            esac
            git restore --staged --worktree -- "$path"
          done

      - name: Remove generated build artifacts
        shell: bash
        run: |
          set -euo pipefail
          git clean -ffdx -e /tmp/forrum-navigation-v28-check.mjs
          test -f /tmp/forrum-navigation-v28-check.mjs

      - name: Final V28 production audit
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/forrum-navigation-v28-check.mjs
          node scripts/home-reference-check.mjs
          git diff --check

          allowed='^(apps/web/components/main-nav\.tsx|scripts/home-reference-check\.mjs|scripts/navigation-product-contract-v28-check\.mjs)$'
          bad="$(
            git status --porcelain=v1 --untracked-files=all |
            sed 's/^...//' |
            grep -Ev "$allowed" || true
          )"
          if [ -n "$bad" ]; then
            echo "::error::Unexpected final V28 changes:"
            printf '%s\n' "$bad"
            exit 1
          fi

          test -f apps/web/app/services/page.tsx
          test -f apps/web/app/media/page.tsx
          test -f apps/web/app/news/page.tsx

          test -z "$(
            git diff --name-only |
            grep -E 'globals\.css|theme-toggle\.tsx' || true
          )"

      - name: Commit verified V28
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet             && [ -z "$(git ls-files --others --exclude-standard /tmp/forrum-navigation-v28-check.mjs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "FORRUM Navigation Architecture V28 already applied."
            exit 0
          fi

          git config user.name "forrum-actions"
          git config user.email "actions@forrum.local"
          git add             apps/web/components/main-nav.tsx             scripts/home-reference-check.mjs           git diff --cached --check
          git commit -m "Restore FORRUM product navigation V28"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Re-run full V28 audit after rebase
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/forrum-navigation-v28-check.mjs
          node scripts/home-reference-check.mjs
          git diff --check

          npm install --include=dev --no-audit --no-fund --package-lock=false
          npm run validate:static
          npm run validate:ux
          npm run validate:a11y
          npm test -w @forrum/contracts --if-present
          npm test -w @forrum/web --if-present
          npm run typecheck -w @forrum/contracts
          npm run typecheck -w @forrum/web

          rm -rf apps/web/.next
          npm run build -w @forrum/contracts
          npm run build -w @forrum/web
          git diff --check

          git restore --source=HEAD --staged --worktree -- .
          git clean -ffdx
          test -z "$(git status --porcelain)"

          node /tmp/forrum-navigation-v28-check.mjs
          node scripts/home-reference-check.mjs
          echo "Post-rebase V28 production audit passed."

      - name: Publish V28 safely
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main
            local_head="$(git rev-parse HEAD)"
            remote_head="$(git rev-parse origin/main)"

            if ! git merge-base --is-ancestor "$remote_head" "$local_head"; then
              git rebase origin/main
              node /tmp/forrum-navigation-v28-check.mjs
              node scripts/home-reference-check.mjs
              git diff --check

              if [ ! -d node_modules ]; then
                npm install --include=dev --no-audit --no-fund --package-lock=false
              fi

              npm run validate:static
              npm run validate:ux
              npm run validate:a11y
              npm test -w @forrum/contracts --if-present
              npm test -w @forrum/web --if-present
              npm run typecheck -w @forrum/contracts
              npm run typecheck -w @forrum/web
              rm -rf apps/web/.next
              npm run build -w @forrum/contracts
              npm run build -w @forrum/web
              git diff --check
              git restore --source=HEAD --staged --worktree -- .
              test -z "$(git status --porcelain --untracked-files=no)"
            fi

            git fetch origin main
            latest_remote="$(git rev-parse origin/main)"
            merge_base="$(git merge-base HEAD origin/main)"
            if [ "$latest_remote" != "$merge_base" ]; then
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::Could not publish V28 after $max_attempts safe attempts."
          exit 1

      - name: Verify remote V28 commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Published FORRUM Navigation Architecture V28: $(git rev-parse HEAD)"
